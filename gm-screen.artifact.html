, "html": "<h1>Act 1 — Reconnection</h1>\n<p><em>Sessions ~1–8. Episodic. Each relit beacon opens a corridor, and each corridor holds a world that spent ninety years becoming something strange.</em></p>\n<p><strong>Act goals:</strong> meet all five factions on the ground, gather <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a>, and let the crew's reputation outrun them.</p>\n<h2>Episode seeds beyond Vesta-9</h2>\n<ol>\n<li><strong>The Sealed Enclave.</strong> A Vigil-sealed temple whose caretaker droid still runs lessons for empty rooms — and something answered this year's roll call.</li>\n<li><strong>The Ration Engine.</strong> A world administered for ninety years by a droid bureaucracy that refuses to believe the galaxy is back; the crew must out-argue a spreadsheet that genuinely loves its people.</li>\n<li><strong>The Mausoleum Yards.</strong> A mothballed Republic fleet, now a hull-city of squatters, with an Admiralty prize crew inbound carrying eviction orders.</li>\n<li><strong>The Memory Market.</strong> A world where provenance is currency, and a forgery ring is quietly poisoning the galaxy's lore-fragment economy — including, perhaps, something the party already trusts.</li>\n<li><strong>The Oracle of Brel.</strong> A settlement worships a Force-sensitive child whose true dreams are eating her sleep; three factions arrive the same week the PCs do.</li>\n<li><strong>The Scar.</strong> A New Sith Wars battlefield where the dark side pooled. An Inheritor dig site offers the crew coin, answers, and the campaign's first real temptation.</li>\n<li><strong>The Five Systems.</strong> A small confederation that is, embarrassingly, thriving in isolation. Plugging them into the galaxy may ruin them — and they know it. Discovery is not neutral.</li>\n<li><strong>The Toll.</strong> A Hutt successor cartel holds the only living chokepoint lane and sells passage; the diplomats and traders get their spotlight episode.</li>\n<li><strong>The Dead Letter.</strong> An assassin droid is still working a ninety-year-old contract list. The government that posted it is dust, the Guild's purists insist a posting is a posting, and the next name on the list is somebody the crew needs alive.</li>\n<li><strong>The Handoff.</strong> A Kajidic middleman's \"cargo\" turns out to be a Force-sensitive child, sold up the chain toward buyers nobody names aloud. Intercepting the shipment is the easy part; deciding what to do about the market it revealed is the episode.</li>\n</ol>"}, {"section": "setting", "id": "act-2", "title": "Act 2 — Convergence", "html": "<h1>Act 2 — Convergence</h1>\n<p><em>Sessions ~9–16. The quiet ends.</em></p>\n<p>Hinge events, playable in any order:</p>\n<h2>The Awakening goes public</h2>\n<p>A display of the Force too public to hush — now every government has a policy, and every policy has victims.</p>\n<h2>The Conclave of Charts</h2>\n<p>The <a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">Lamplighters</a> auction the relighting order. Every faction bids; the party holds swing data from Act 1.</p>\n<h2>The Unveiling</h2>\n<p>The <a href=\"#\" class=\"xin\" data-nav=\"page:setting:inheritors\">Inheritors</a> present a trained cadre — the first \"Sith\" seen since Ruusan. They are costume: real techniques, counterfeit lineage. Almost nobody alive can tell the difference, and the two beings who can have just been handed an address.</p>\n<h2>The Vigil breaks</h2>\n<p>The argument over custody of the Force-sensitive goes from doctrinal to armed, and both halves of <a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">the Vigil</a> come to the party for help.</p>\n<h2>The Annexation</h2>\n<p>The <a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">Admiralty</a> \"secures\" a relit corridor for everyone's safety, and does not leave.</p>"}, {"section": "setting", "id": "act-3", "title": "Act 3 — The Founding", "html": "<h1>Act 3 — The Founding</h1>\n<p><em>Sessions ~17–20+. Two summits and one canyon.</em></p>\n<h2>The Founding Conclave</h2>\n<p>Crisis forces the constitutional moment: Republic restored, Admiralty empire, a concord of independent leagues — or the players' own third way. Their accumulated fragments, favors, and Force-sensitive allies are the votes.</p>\n<p>And hanging over the whole chamber is a legal fact almost nobody remembers: <strong>three Masters, met in a temple, can reconvene the Jedi Council</strong> — and who counts as a Master, ninety years out of session, is a question worth a war.</p>\n<h2>The Valley of the Jedi</h2>\n<p>Whoever brings the new Force-sensitives here defines what the Force's return means. On the table:</p>\n<ul>\n<li><strong>Release</strong> the thousand bound souls.</li>\n<li><strong>Draw</strong> on them.</li>\n<li><strong>Seal</strong> the Valley for another age.</li>\n<li><strong>Or ask the souls what they want.</strong></li>\n</ul>\n<h2>The true ending</h2>\n<p>The campaign's true ending is the <em>pairing</em> of a political outcome with a Valley choice. An empire that frees the dead and a republic that feeds on them are both possible, and both worth playing to find out.</p>"}, {"section": "setting", "id": "session-one", "title": "Session One — Vesta-9", "html": "<h1>Session One — \"The Light on Vesta-9\"</h1>\n<h2>Cold open</h2>\n<p>The crew is grounded at <strong>Okrent's Drift</strong>, a fuel-depot port at the frayed end of a living lane — cargo impounded, Obligations circling — when the sky changes. <strong>Vesta-9, dark for sixty years, is broadcasting.</strong> Every ship that can lift is lifting.</p>\n<h2>Scene 1 — The Scramble</h2>\n<p>Get off-world first: the impound, the fuel, and a likable rival crew worth keeping as recurring foils.</p>\n<h2>Scene 2 — The Race</h2>\n<p>Astrogation on a decayed route. Introduce <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">fragments</a> here, when one page of somebody's grandmother's rutter is the difference between arrival and drift.</p>\n<h2>Scene 3 — The Beacon</h2>\n<p>Vesta-9 station, lit and humming — and occupied.</p>\n<ul>\n<li><strong>Keeper Adressa Vhail</strong> of the Vigil is praying at the beacon core and will not say how she got there.</li>\n<li>The Admiralty sloop <strong><em>Steadfast</em></strong> (<strong>Cmdr. Joss Reike</strong>) drops in demanding all vessels stand to for inspection.</li>\n<li><strong>Chartmistress Bel Nerra</strong> of the Lamplighters arrives to certify the relight — and to hire witnesses.</li>\n</ul>\n<h2>Scene 4 — The Stowaway</h2>\n<p>Mid-standoff, the crew finds <strong>Immi Ozha</strong>, twelve, asleep in their hold, dreaming loudly of a canyon full of light. The beacon flickers in rhythm with her breathing.</p>\n<ul>\n<li>Reike wants her manifested and registered.</li>\n<li>Vhail goes very quiet.</li>\n<li>Nerra offers papers on the spot.</li>\n</ul>\n<h2>Out</h2>\n<p>The corridor to the <strong>Q'ell Reach</strong> stands open — <a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1's episode worlds</a> lie beyond — three factions know the crew's name, and someone knows exactly what just happened.</p>"}, {"section": "truths", "id": "truths", "title": "GM Truths (Part V)", "html": "<h1>GM Truths (Locked)</h1>\n<div class=\"adm adm-danger\"><p class=\"adm-title\">Players never see this page</p><p>Three dials, now set.</p></div>\n\n<h2>Dial 1 — The line is unbroken, and very far away</h2>\n<p>A Sith Master and apprentice continue Bane's work somewhere in the galaxy — patient, hidden, and uninterested in ruins. The Rule of Two does not want a withered galaxy; it wants one worth taking. Reunification is their harvest, which makes the party their unwitting gardeners: every relit beacon sets the table.</p>\n<p>They will not surface until a true galactic power exists — likely not within this campaign's span at all — so <strong>run them as an absence</strong>: unexplained good fortune whenever reunification stalls, rivals who quietly remove themselves, a pattern visible only from very far back. If the players ever found that power, the Sith's attention is the sequel.</p>\n<p>At 90 AR the line is only two or perhaps three successions deep — young, consolidating, and nowhere near ready, which is exactly why patience costs them nothing.</p>\n<p><em>(Stat blocks, statted for completeness only: <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>.)</em></p>\n<h3>The fork is closed: the Inheritors are heretics</h3>\n<p>No connection to the true line, and they do not know it — real techniques scraped from artifacts, counterfeit lineage, no living tradition. <strong>The Sith do not yet know they exist.</strong></p>\n<p>The moment that changes — the Unveiling, a public claim to a Darth title, anything that makes them look less like grave-robbers and more like a rival tradition — <strong>the culling comes</strong>, and it is surgical, anonymous, and total: the senior circle dead across a dozen worlds in one night, the archives vanished rather than burned, and nobody sane concluding \"Sith.\" The galaxy blames the Vigil, or the Admiralty, or an internal purge, and every misattribution lights a different Act 3 fire.</p>\n<p>Two aftershocks matter:</p>\n<ol>\n<li>The culling <strong>shatters the Inheritors instead of ending them</strong>: leaderless cells, fire-sale artifacts, half-trained adepts scattering with dangerous knowledge.</li>\n<li>The harvested archives include <strong>the Vesta-9 file</strong> — whoever wrecked the Inheritors now knows about the crew, and about Immi, and has never once been seen.</li>\n</ol>\n<h3>A second fork this history opens</h3>\n<p>How many hidden Jedi lineages survive to 90 AR?</p>\n<ul>\n<li><strong>Zero</strong> hands the reconvening question entirely to the new generation and whoever teaches them.</li>\n<li><strong>One or two</strong> — a tired woman on a dry world, third student of a student of Ruusan — turns \"who counts as a Master\" from a philosophy exam into a succession fight, and makes any living mentor the most valuable being in the campaign.</li>\n</ul>\n<h2>Dial 2 — The tide</h2>\n<p>The Force returns <strong>because it returns</strong>. The Vigil's theology, the Inheritors' doctrine, and the Republic's science are all wrong or unprovable; nobody gets to be right, and the mystery stays a mystery.</p>\n<p>The Valley of the Jedi is therefore <strong>not</strong> the engine of the Awakening — it is purely the era's greatest choice. The Force-sensitive dream of it the way compasses find north: it is simply the loudest thing the Force has ever done.</p>\n<h2>Dial 3 — Vesta-9 was Inheritor bait</h2>\n<p>They lit it to take a census — of the sector's ambitious wayfinders, and of the Force-sensitive families a reopened lane would flush into motion. Three consequences are now in play:</p>\n<ol>\n<li><strong>An Inheritor observer was present at the relight</strong>, so the crew — and Immi — are already in a file.</li>\n<li><strong>First contact will be helpful</strong>, because it always is: coin, rescue, answers, no strings visible.</li>\n<li><strong>Relighting a beacon requires guild handshake codes</strong>, so the Inheritors own a mole among the Lamplighters — which quietly turns Act 2's Conclave of Charts into a rigged auction the party can discover and expose.</li>\n</ol>\n<h2>Marginalia</h2>\n<p><strong>A calendar gift:</strong> Yoda's canonical birth falls in 104 AR — fourteen years after session one. He is not a relic of the old Order; he is downstream of your players. Whatever galaxy they build at the Founding is the one he will be born into — and the Order he someday joins is their legacy.</p>\n<p><strong>Canon is your epilogue, not your cage:</strong> Legends guarantees that a Republic and a Jedi Order stand a thousand years from now, and that Bane's line reaches its final two. It says nothing about what the rebuilding cost, what kind of Republic came first, or whose names history kept. If your players' Founding becomes the seed of the thousand years of peace, the record's silence about them is not a plot hole — it is what recoveries do to their founders.</p>"}];
const SEED   = {"questions": ["What ended the Order?", "What is the Valley?", "Who lit Vesta-9?", "What did the Adjournment actually adjourn?"], "clocks": [{"faction": "Provisional Republic", "crack": "Custodians of the idea, terrified of being tested", "value": 0, "notes": ""}, {"faction": "Admiralty", "crack": "The founding story requires an enemy → the Annexation", "value": 0, "notes": ""}, {"faction": "Vigil", "crack": "Sacrilege vs. Order-reborn — custody of the Awakened → the Vigil breaks", "value": 0, "notes": ""}, {"faction": "Inheritors", "crack": "Nobody knows whose hand is at the top → the Unveiling", "value": 0, "notes": "Hold the Vesta-9 file on the crew and Immi (Dial 3)."}, {"faction": "Lamplighters", "crack": "The relighting order is for sale → Conclave of Charts (rigged: Denno Pike)", "value": 0, "notes": ""}, {"faction": "Kajidics", "crack": "The young Hutts have run the numbers → clan war", "value": 0, "notes": ""}, {"faction": "The Awakening", "crack": "Every public display raises the temperature → it goes public", "value": 0, "notes": ""}], "beacons": [{"name": "Vesta-9", "status": "lit", "corridor": "the Q'ell Reach", "certified": "Chartmistress Bel Nerra (Lamplighters)", "fee": "pending session one", "followed": "Vigil, Admiralty, Lamplighters — and one Inheritor observer (Dial 3)"}], "fragments": [], "truthsFound": [], "corrupted": [], "sessions": [], "rev": 0};
const HEAD_STATIC = "<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ember Age GM Screen</title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap\">";
const SKELETON = "<header>\n  <h1><span class=\"flame\">◆</span> THE EMBER AGE <span class=\"small muted\">GM screen</span></h1>\n  <nav id=\"nav\"></nav>\n  <div class=\"spacer\"></div>\n  <button class=\"hbtn\" id=\"syncchip\" style=\"display:none\" onclick=\"syncNow()\">Sync</button>\n  <button class=\"hbtn\" onclick=\"exportState()\">Export save</button>\n  <button class=\"hbtn\" onclick=\"document.getElementById('importfile').click()\">Import</button>\n  <input type=\"file\" id=\"importfile\" accept=\".json\" style=\"display:none\" onchange=\"importState(this)\">\n  <button class=\"hbtn\" onclick=\"resetState()\">Reset</button>\n</header>\n<div id=\"syncbanner\"></div>\n<main>\n  <div id=\"tab-npcs\" class=\"tab\"></div>\n  <div id=\"tab-trackers\" class=\"tab\"></div>\n  <div id=\"tab-log\" class=\"tab\"></div>\n  <div id=\"tab-reference\" class=\"tab\"></div>\n  <div id=\"tab-setting\" class=\"tab\"></div>\n  <div id=\"tab-truths\" class=\"tab\"></div>\n</main>\n<footer>The Ember Age — homebrew campaign GM screen · built 2026-08-20 · state autosaves locally; Sync publishes it to this page's live copy</footer>";

/* ------------------------------------------------ state & sync */
const KEY = "emberAgeGM.v1";
function freshState(){ const s = JSON.parse(JSON.stringify(SEED)); s.rev = 0; return s; }
const stateEl = document.getElementById("gm-state");
let EMBED = freshState();
try{ if(stateEl) EMBED = Object.assign(freshState(), JSON.parse(stateEl.textContent)); }catch(e){}
let S = EMBED;
try{
  const ls = JSON.parse(localStorage.getItem(KEY));
  if(ls && (ls.rev||0) > (EMBED.rev||0)) S = Object.assign(freshState(), ls);
}catch(e){}
function save(){ S.rev = (S.rev||0)+1; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} updateSyncUI(); }
function esc(x){ return String(x==null?"":x).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let artifactNS = null, downloadsNS = null, readOnly = false;
(async () => {
  try{
    if(window.claude && window.claude.use){
      artifactNS = await window.claude.use("artifact");
      downloadsNS = await window.claude.use("downloads");
    }
  }catch(e){}
  updateSyncUI();
})();

function dirty(){ return (S.rev||0) > (EMBED.rev||0); }
function updateSyncUI(){
  const chip = document.getElementById("syncchip");
  if(!artifactNS || readOnly){ chip.style.display = "none"; }
  else{
    chip.style.display = "";
    chip.className = "hbtn" + (dirty() ? " dirty" : "");
    chip.textContent = dirty() ? `Sync (${(S.rev||0)-(EMBED.rev||0)} change${(S.rev-EMBED.rev)===1?"":"s"})` : "Synced ✓";
  }
  const ban = document.getElementById("syncbanner");
  if(artifactNS && !readOnly && dirty() && (EMBED.rev||0) > 0){
    ban.style.display = "block";
    ban.innerHTML = `This browser holds changes newer than the page's live copy.
      <button class="hbtn" onclick="syncNow()">Publish local changes</button>
      <button class="hbtn" onclick="keepCloud()">Discard local, keep live copy</button>`;
  } else ban.style.display = "none";
}
function keepCloud(){ S = JSON.parse(JSON.stringify(EMBED)); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} renderAll(); }

function stateJSON(){ return JSON.stringify(S).replace(/</g, "\\u003c"); }
function renderDocument(){
  const code = document.getElementById("app-code").textContent;
  const style = document.getElementById("app-style").textContent;
  const SC = "script";
  return "<!doctype html>\n<html lang=\"en\">\n<head>\n" + HEAD_STATIC +
    "\n<style id=\"app-style\">" + style + "</style>\n</head>\n<body>\n" + SKELETON +
    "\n<" + SC + " id=\"gm-state\" type=\"application/json\">" + stateJSON() + "</" + SC + ">\n" +
    "<" + SC + " id=\"app-code\">" + code + "</" + SC + ">\n</body>\n</html>\n";
}
async function syncNow(){
  if(!artifactNS) return;
  try{ sessionStorage.setItem("ea.resume", JSON.stringify({tab: cur})); }catch(e){}
  const chip = document.getElementById("syncchip");
  chip.textContent = "Syncing…";
  try{
    await artifactNS.publish(renderDocument());
    /* on success the shell reloads this view with the new embedded state */
  }catch(err){
    const code = err && err.code;
    if(code === "conflict"){ /* shell reloads to the winning version; local state stays in localStorage and the banner offers the merge choice */ }
    else if(code === "not_writer" || code === "not_granted" || code === "not_declared"){ readOnly = true; updateSyncUI(); }
    else if(code === "rate_limited"){ chip.textContent = "Rate limited — try again in a moment"; setTimeout(updateSyncUI, 4000); }
    else { chip.textContent = "Sync failed — will retry on next Sync"; setTimeout(updateSyncUI, 4000); }
  }
}

async function exportState(){
  const data = JSON.stringify(S, null, 2);
  const fname = "ember-age-save-" + new Date().toISOString().slice(0,10) + ".json";
  if(downloadsNS){
    try{ await downloadsNS.save({filename: fname, data}); }catch(err){ /* declined or unavailable — fall through */
      if(err && (err.code === "declined" || err.code === "rate_limited")) return;
      tryBlobDownload(fname, data);
    }
    return;
  }
  tryBlobDownload(fname, data);
}
function tryBlobDownload(fname, data){
  const blob = new Blob([data], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  URL.revokeObjectURL(a.href);
}
function importState(inp){
  const f = inp.files[0]; if(!f) return;
  f.text().then(t=>{ S = Object.assign(freshState(), JSON.parse(t)); save(); renderAll(); alert("Save imported. Use Sync to publish it to the live copy."); })
   .catch(()=>alert("Could not read that file."));
  inp.value = "";
}
function resetState(){
  if(confirm("Reset ALL tracker/log state to the campaign start? (Export first if unsure.)")){ S = freshState(); save(); renderAll(); }
}

/* ------------------------------------------------ tabs & in-app links */
const TABS = [["npcs","NPCs"],["trackers","Trackers"],["log","Session Log"],["reference","Reference"],["setting","Setting"],["truths","GM Truths"]];
let cur = "npcs";
try{ const r = JSON.parse(sessionStorage.getItem("ea.resume")); if(r && r.tab){ cur = r.tab; sessionStorage.removeItem("ea.resume"); } }catch(e){}
if(location.hash && TABS.some(t=>t[0]===location.hash.slice(1))) cur = location.hash.slice(1);
function nav(){
  document.getElementById("nav").innerHTML = TABS.map(([id,lbl])=>
    `<button class="${cur===id?'on':''}" onclick="go('${id}')">${lbl}</button>`).join("");
  TABS.forEach(([id])=>document.getElementById("tab-"+id).classList.toggle("on", cur===id));
}
function go(id){ cur=id; try{history.replaceState(null,"","#"+id);}catch(e){} nav(); window.scrollTo(0,0); }
function navTo(spec){
  const p = spec.split(":");
  if(p[0]==="tab"){ go(p[1]); }
  else if(p[0]==="page"){ pageSel[p[1]] = p[2]; pagesTab(p[1]); go(p[1]); }
  else if(p[0]==="npcs"){
    if(p[1]==="group"){ npcGroup = p[2]; npcKind = "All"; npcQ = ""; }
    npcTab(); go("npcs");
  }
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.xin[data-nav]");
  if(a){ e.preventDefault(); navTo(a.dataset.nav); }
});

/* ------------------------------------------------ NPC tab */
const KINDS = ["All","Nemesis","Rival","Minion","Vehicle","Hazard"];
let npcQ="", npcKind="All", npcGroup="all";
function npcTab(){
  const el = document.getElementById("tab-npcs");
  el.innerHTML = `
    <div class="toolbar">
      <input type="search" placeholder="Search ${NPCS.length} stat blocks — name, faction, skill, gear…" value="${esc(npcQ)}"
             oninput="npcQ=this.value;npcList()">
      ${KINDS.map(k=>`<button class="chip ${npcKind===k?'on':''}" onclick="npcKind='${k}';npcTab()">${k}</button>`).join("")}
      <select onchange="npcGroup=this.value;npcTab()">
        <option value="all">All groups</option>
        ${GROUPS.map(g=>`<option value="${g.slug}" ${npcGroup===g.slug?'selected':''}>${esc(g.label)}</option>`).join("")}
      </select>
    </div>
    <div id="npclist"></div>`;
  npcList();
}
function npcList(){
  const q = npcQ.trim().toLowerCase();
  const hits = NPCS.filter(n =>
    (npcKind==="All"||n.kind===npcKind) &&
    (npcGroup==="all"||n.group===npcGroup) &&
    (!q || n.search.includes(q)));
  const gi = (npcGroup!=="all" && !q) ? GROUPS.find(g=>g.slug===npcGroup) : null;
  document.getElementById("npclist").innerHTML =
    (gi?`<div class="card groupintro doc small">${gi.intro}</div>`:"") +
    `<p class="muted small">${hits.length} of ${NPCS.length} blocks</p>` +
    hits.map(n=>`
      <details class="npc" ${hits.length===1?"open":""}>
        <summary>
          <span class="nm">${esc(n.name)}</span>
          <span class="badge ${n.kind}">${n.kind}</span>
          <span class="fac">${esc(n.faction)}${n.role?" · "+esc(n.role):""}</span>
          ${n.derived?`<span class="drv">${esc(n.derived)}</span>`:""}
        </summary>
        <div class="body doc">${n.html}</div>
      </details>`).join("") || `<p class="muted">Nothing matches.</p>`;
}

/* ------------------------------------------------ Trackers tab */
function trackersTab(){
  const el = document.getElementById("tab-trackers");
  el.innerHTML = `
    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">Faction clocks</h2>
      <p class="muted small">Each faction's crack, 0–6. Click a segment; a full clock fires its Act 2 hinge.</p>
      <div class="clockgrid">${S.clocks.map((c,i)=>`
        <div class="card clock" style="margin:0">
          <b style="color:var(--gold)">${esc(c.faction)}</b>
          <div class="muted small">${esc(c.crack)}</div>
          <div class="segs">${[1,2,3,4,5,6].map(v=>
            `<div class="seg ${c.value>=v?'f':''}" title="${v}" onclick="clockSet(${i},${v})"></div>`).join("")}</div>
          <textarea placeholder="notes…" onchange="S.clocks[${i}].notes=this.value;save()">${esc(c.notes)}</textarea>
        </div>`).join("")}
      </div></div>

    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">Lore fragments</h2>
      <div class="qsum">${questionSummary()}</div>
      <table class="tr"><thead><tr><th>Fragment</th><th>Form</th><th>Tag</th><th>Question</th><th>Load-bearing claim</th><th>Holder</th><th>Status</th><th></th></tr></thead>
      <tbody>${S.fragments.map((f,i)=>`
        <tr><td><b>${esc(f.name)}</b></td><td>${esc(f.form)}</td><td><span class="tag ${esc(f.tag)}">${esc(f.tag)}</span></td>
        <td>${esc(f.question)}</td><td class="small">${esc(f.claim)}</td><td>${esc(f.holder)}</td><td>${esc(f.status)}</td>
        <td class="rowbtns"><button title="delete" onclick="S.fragments.splice(${i},1);save();trackersTab()">✕</button></td></tr>`).join("")}
      </tbody></table>
      <div class="formgrid">
        <div><label>Fragment name</label><input id="f-name" placeholder="Grandmother Osk's rutter, p.40"></div>
        <div><label>Form</label><input id="f-form" placeholder="rutter / witness / droid core…"></div>
        <div><label>Tag</label><select id="f-tag"><option>Jedi</option><option>Sith</option><option>Civic</option></select></div>
        <div><label>Question</label><input id="f-q" list="qlist" placeholder="What ended the Order?">
          <datalist id="qlist">${S.questions.map(q=>`<option>${esc(q)}</option>`).join("")}</datalist></div>
        <div class="wide"><label>Load-bearing claim (what it insists on)</label><input id="f-claim"></div>
        <div><label>Holder</label><input id="f-holder" value="crew"></div>
        <div><label>Status</label><select id="f-status"><option>trusted</option><option>suspect</option><option>spent</option><option>forged?</option></select></div>
        <div style="align-self:end"><button class="btn" onclick="addFragment()">Add fragment</button></div>
      </div>
      <div class="stat small muted">Rules: a held, relevant fragment = boost die on related Knowledge checks. 3+ fragments on one Question → Hard Knowledge (Lore) Reconstruction as a group scene; all three tags represented → upgrade an ability die once; only one tag → upgrade difficulty once. Full rules: <a href="#" class="xin" data-nav="page:reference:lore-fragments">Lore Fragments</a>.</div>
    </div>

    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">Beacon map</h2>
      <table class="tr"><thead><tr><th>Beacon</th><th>Status</th><th>Corridor</th><th>Certified by</th><th>First-lighting fee</th><th>Who followed through</th><th></th></tr></thead>
      <tbody>${S.beacons.map((b,i)=>`
        <tr><td><b>${esc(b.name)}</b></td>
        <td><select onchange="S.beacons[${i}].status=this.value;save()">${["dark","attempted","lit"].map(s=>`<option ${b.status===s?"selected":""}>${s}</option>`).join("")}</select></td>
        <td>${esc(b.corridor)}</td><td>${esc(b.certified)}</td><td>${esc(b.fee)}</td><td class="small">${esc(b.followed)}</td>
        <td class="rowbtns"><button title="delete" onclick="S.beacons.splice(${i},1);save();trackersTab()">✕</button></td></tr>`).join("")}
      </tbody></table>
      <div class="formgrid">
        <div><label>Beacon</label><input id="b-name"></div>
        <div><label>Status</label><select id="b-status"><option>dark</option><option>attempted</option><option>lit</option></select></div>
        <div><label>Corridor it opens</label><input id="b-corridor"></div>
        <div><label>Certified by</label><input id="b-certified"></div>
        <div><label>Fee</label><input id="b-fee"></div>
        <div class="wide"><label>Who followed through</label><input id="b-followed"></div>
        <div style="align-self:end"><button class="btn" onclick="addBeacon()">Add beacon</button></div>
      </div>
      <div class="stat small muted">Relight challenge — three stages, any order: <b>Wake it</b> (Mechanics/Computers) · <b>Chart it</b> (Hard Astrogation, fragments/rutters = boost) · <b>Speak to it</b> (Knowledge or social). Full rules: <a href="#" class="xin" data-nav="page:reference:beacon-relighting">Relighting a Beacon</a>.</div>
    </div>

    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">Truths revealed &amp; corrupted conclusions</h2>
      <table class="tr"><thead><tr><th>Truth / Insight granted</th><th></th></tr></thead><tbody>
        ${S.truthsFound.map((t,i)=>`<tr><td>${esc(t)}</td><td class="rowbtns"><button onclick="S.truthsFound.splice(${i},1);save();trackersTab()">✕</button></td></tr>`).join("")}
      </tbody></table>
      <div class="formgrid"><div class="wide"><input id="t-new" placeholder="Truth revealed + Insight granted (setback removed / talent unlocked)"></div>
      <div><button class="btn" onclick="pushItem('truthsFound','t-new')">Add</button></div></div>
      <table class="tr"><thead><tr><th>Corrupted conclusion in play (Despair)</th><th></th></tr></thead><tbody>
        ${S.corrupted.map((t,i)=>`<tr><td class="bias">${esc(t)}</td><td class="rowbtns"><button onclick="S.corrupted.splice(${i},1);save();trackersTab()">✕</button></td></tr>`).join("")}
      </tbody></table>
      <div class="formgrid"><div class="wide"><input id="c-new" placeholder="What the party now wrongly believes — and where it will bite"></div>
      <div><button class="btn" onclick="pushItem('corrupted','c-new')">Add</button></div></div>
    </div>`;
}
function clockSet(i,v){ S.clocks[i].value = (S.clocks[i].value===v? v-1 : v); save(); trackersTab(); }
function pushItem(key,inputId){ const el=document.getElementById(inputId); if(el.value.trim()){ S[key].push(el.value.trim()); save(); trackersTab(); } }
function addFragment(){
  const g=id=>document.getElementById(id).value;
  if(!g("f-name").trim()) return;
  const q=g("f-q").trim();
  if(q && !S.questions.includes(q)) S.questions.push(q);
  S.fragments.push({name:g("f-name"),form:g("f-form"),tag:g("f-tag"),question:q,claim:g("f-claim"),holder:g("f-holder"),status:g("f-status")});
  save(); trackersTab();
}
function addBeacon(){
  const g=id=>document.getElementById(id).value;
  if(!g("b-name").trim()) return;
  S.beacons.push({name:g("b-name"),status:g("b-status"),corridor:g("b-corridor"),certified:g("b-certified"),fee:g("b-fee"),followed:g("b-followed")});
  save(); trackersTab();
}
function questionSummary(){
  return S.questions.map(q=>{
    const fs = S.fragments.filter(f=>f.question===q);
    const tags = [...new Set(fs.map(f=>f.tag))];
    let note = "";
    if(fs.length>=3) note = tags.length>=3 ? `<span class="ready">Reconstruction ready — all three tags: upgrade ability once</span>`
      : tags.length===1 ? `<span class="ready">Reconstruction ready</span> · <span class="bias">single tag: upgrade difficulty once</span>`
      : `<span class="ready">Reconstruction ready</span>`;
    return `<div class="qcard"><b>${esc(q)}</b> — ${fs.length} fragment${fs.length===1?"":"s"}
      ${tags.map(t=>`<span class="tag ${esc(t)}">${esc(t)}</span>`).join(" ")} ${note?"· "+note:""}</div>`;
  }).join("");
}

/* ------------------------------------------------ Session log tab */
function logTab(){
  const el = document.getElementById("tab-log");
  const F = [["title","Title"],["date","Date"],["where","Where (system / world / beacon)"],["obligation","Obligation triggered"],
             ["beacons","Beacons (relit / attempted / learned of)"],["fragments","Fragments gained (name — tag — Question)"],
             ["factions","Factions moved"],["debts","Debts & favors"],["xp","XP awarded"],["line","The line of the night"]];
  el.innerHTML = `
    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">New session entry</h2>
      <div class="formgrid">
        ${F.map(([k,lbl])=>`<div class="${["where","fragments","factions","debts","line","beacons","obligation"].includes(k)?"wide":""}">
          <label>${lbl}</label><input id="s-${k}"></div>`).join("")}
        <div style="align-self:end"><button class="btn" onclick="addSession()">Add session ${S.sessions.length+1}</button></div>
      </div></div>
    ${S.sessions.map((s,i)=>`
      <div class="card sess">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h3>Session ${i+1} — ${esc(s.title||"untitled")} <span class="muted small">${esc(s.date||"")}</span></h3>
          <span class="rowbtns"><button title="copy as markdown" onclick="copySession(${i})">⧉</button>
          <button title="delete" onclick="if(confirm('Delete this session entry?')){S.sessions.splice(${i},1);save();logTab()}">✕</button></span>
        </div>
        <dl>${F.slice(2).map(([k,lbl])=>s[k]?`<dt>${lbl}</dt><dd>${esc(s[k])}</dd>`:"").join("")}</dl>
      </div>`).reverse().join("")}`;
}
function addSession(){
  const keys = ["title","date","where","obligation","beacons","fragments","factions","debts","xp","line"];
  const s = {}; keys.forEach(k=>s[k]=document.getElementById("s-"+k).value);
  if(!s.title.trim()) { alert("Give it at least a title."); return; }
  S.sessions.push(s); save(); logTab();
}
function copySession(i){
  const s = S.sessions[i];
  const md = `## Session ${i+1} — ${s.title} (${s.date})\n\n**Where:** ${s.where}\n**Obligation triggered:** ${s.obligation}\n**Beacons:** ${s.beacons}\n**Fragments gained:** ${s.fragments}\n**Factions moved:** ${s.factions}\n**Debts & favors:** ${s.debts}\n**XP awarded:** ${s.xp}\n**The line of the night:** ${s.line}\n`;
  navigator.clipboard ? navigator.clipboard.writeText(md).then(()=>alert("Copied as markdown."))
    : alert("Clipboard unavailable — select and copy:\n\n"+md);
}

/* ------------------------------------------------ page tabs (reference / setting / truths) */
const pageSel = {reference:null, setting:null};
function pagesTab(section){
  const el = document.getElementById("tab-"+section);
  const list = PAGES.filter(p=>p.section===section);
  if(!pageSel[section]) pageSel[section] = list[0].id;
  const curP = list.find(p=>p.id===pageSel[section]) || list[0];
  el.innerHTML = `<div class="cols">
    <div class="side">${section==="reference" ? minionCalc() : ""}
      ${list.map(p=>`<button class="${p.id===curP.id?'on':''}" onclick="pageSel['${section}']='${p.id}';pagesTab('${section}')">${esc(p.title)}</button>`).join("")}
    </div>
    <div class="pane"><div class="card doc">${curP.html}</div></div>
  </div>`;
  if(section==="reference" && document.getElementById("mc-out")) mcOut();
}
function minionCalc(){
  return `<div class="grp">Minion group math</div>
    <div style="padding:.2rem .5rem .5rem">
      <label>WT each × count</label>
      <div style="display:flex;gap:.3rem">
        <input id="mc-wt" type="number" value="5" min="1" style="width:60px" oninput="mcOut()">
        <input id="mc-n" type="number" value="4" min="1" style="width:60px" oninput="mcOut()">
      </div>
      <div id="mc-out" class="small muted" style="margin-top:.3rem"></div>
    </div>`;
}
function mcOut(){
  const wt=+document.getElementById("mc-wt").value||0, n=+document.getElementById("mc-n").value||0;
  document.getElementById("mc-out").innerHTML =
    `Group WT <b style="color:var(--gold)">${wt*n}</b> · group skills at <b style="color:var(--gold)">${Math.max(0,n-1)}</b> ranks<br>
     one minion drops at ${Array.from({length:n},(_,i)=>wt*(i+1)).join(", ")} total damage`;
}
let truthsOpen = false;
function truthsTab(){
  const el = document.getElementById("tab-truths");
  const p = PAGES.find(p=>p.section==="truths");
  el.innerHTML = truthsOpen
    ? `<div class="card doc">${p.html}</div><button class="btn ghost" onclick="truthsOpen=false;truthsTab()">Seal it again</button>`
    : `<div class="gate"><h2 style="color:var(--bad)">Part V — GM Truths (locked)</h2>
       <p class="muted">Players never see this page. Three dials, now set.<br>Don't open it with anyone looking over your shoulder.</p>
       <button class="btn danger" onclick="truthsOpen=true;truthsTab()">Break the seal</button></div>`;
}

/* ------------------------------------------------ boot */
function renderAll(){ nav(); npcTab(); trackersTab(); logTab(); pagesTab("reference"); pagesTab("setting"); truthsTab();
  if(document.getElementById("mc-out")) mcOut(); updateSyncUI(); }
window.addEventListener("hashchange",()=>{ const h=location.hash.replace("#",""); if(TABS.some(t=>t[0]===h)){ cur=h; nav(); } });
renderAll();
</script>
