<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Age — System Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&display=swap">
<style>
  :root{
    --bg:#050a10; --holo:#5fc3ff; --holo-dim:#2a5f80; --holo-faint:#153246; --ink:#d7ecf8; --dim:#7fa3bb;
    --ember:#e07b39; --gold:#ffb454; --disp:"Rajdhani",system-ui,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.45 var(--disp)}
  #stage{position:absolute;inset:0;overflow:hidden;touch-action:none}
  /* the galaxy (5,400 dots, routes, borders, grid, sector names) is painted on a canvas each frame; the SVG on top holds only the ~40 campaign systems and lanes */
  #bg{position:absolute;inset:0;width:100%;height:100%;display:block}
  #chart{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none}
  #tip{position:absolute;pointer-events:none;display:none;background:rgba(5,10,16,.9);border:1px solid var(--holo-dim);color:var(--holo);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;padding:.25rem .45rem;white-space:nowrap;z-index:30}
  #chart.dragging{cursor:grabbing}
  #chart text{font-family:var(--disp);fill:var(--holo);letter-spacing:.12em;text-transform:uppercase;pointer-events:none;paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
  #chart .sys text{pointer-events:auto}
  #chart .lbl{font-size:13px;font-weight:600}
  #chart .sub{font-size:9px;fill:var(--dim);letter-spacing:.18em}
  #chart .hop{font-size:9px;fill:var(--dim)}
  #chart .lanelbl{font-size:9px;fill:var(--holo-dim);letter-spacing:.25em}
  #nav polyline{fill:none;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
  #nav .seg-live{stroke:#7fd4ff;filter:url(#glow)}
  #nav .seg-dark{stroke:#ffb454;stroke-dasharray:14 10;filter:url(#glow)}
  #plotbtn.on{background:var(--ember);border-color:var(--ember);color:#1b120a}
  .navhop{margin:.1rem 0}
  .navhop b{color:var(--holo)} .navhop.dark b{color:var(--gold)}
  #chart[data-scaled] .sys > *{transform:scale(var(--k,1))}
  #chart[data-labels=all] .lane,#chart[data-labels=all] #nav *{vector-effect:non-scaling-stroke}
  #chart[data-labels=all] .lane[data-kind=dark]{stroke-width:1.6px}
  #chart[data-labels=all] .lane[data-kind=smuggler]{stroke-width:1.4px}
  #chart[data-labels=all] .lane[data-kind=living]{stroke-width:2.6px}
  #chart[data-labels=all] .lane[data-kind=far],#chart[data-labels=all] .lane[data-kind=fraying]{stroke-width:1.6px}
  #chart[data-labels=all] .lanelbl{font-size:calc(var(--k,1) * 9px)}
  #search{position:relative;display:inline-block}
  #q{background:rgba(5,10,16,.72);border:1px solid var(--holo-dim);color:var(--holo);padding:.32rem .55rem;font:inherit;font-size:.72rem;letter-spacing:.1em;width:130px;transition:width .2s;outline:none}
  #q:focus{width:230px;border-color:var(--holo)}
  #q::placeholder{color:var(--dim)}
  #qr{position:fixed;width:330px;max-height:330px;overflow:auto;background:rgba(5,10,16,.94);border:1px solid var(--holo-dim);backdrop-filter:blur(4px);display:none;z-index:40;text-align:left}
  #qr.open{display:block}
  .qrow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:.38rem .6rem;cursor:pointer}
  .qrow b{color:var(--holo);font-weight:600;letter-spacing:.1em;font-size:.78rem;white-space:nowrap}
  .qrow small{color:var(--dim);font-size:.62rem;letter-spacing:.06em;text-align:right}
  .qrow.active,.qrow:hover{background:rgba(80,150,200,.16)}
  .ping circle{fill:none;stroke:var(--gold);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:pingx 1.4s ease-out forwards}
  .ping .p2{animation-delay:.35s}
  @keyframes pingx{from{transform:scale(.35);opacity:1}to{transform:scale(4.2);opacity:0}}
  #chart[data-zoom=far] .sys text{display:none}
  #chart[data-zoom=far] .sys.major .lbl{display:block;font-size:58px}
  #chart[data-zoom=wide] .sys .lbl{font-size:26px}
  #chart[data-zoom=wide] .sys .sub,#chart[data-zoom=wide] .sys .hop{display:none}
  #chart[data-zoom=wide] .lanelbl{font-size:20px}
  #chart[data-zoom=far] .lanelbl{display:none}
  /* lanes */
  .lane{fill:none;stroke-linecap:round;transition:opacity .25s,stroke .25s}
  .lane[data-kind=dark]{stroke:var(--holo-dim);stroke-width:1.2;stroke-dasharray:6 7}
  .lane[data-kind=smuggler]{stroke:var(--holo-dim);stroke-width:1;stroke-dasharray:1.5 6}
  .lane[data-kind=living]{stroke:var(--ember);stroke-width:2;filter:url(#glow)}
  .lane[data-kind=far]{stroke:var(--holo-faint);stroke-width:1.2}
  .lane[data-kind=fraying]{stroke:var(--holo-faint);stroke-width:1.2;stroke-dasharray:10 6 6 8 3 12 2 16}
  .lane.relit{stroke:var(--ember);stroke-width:2;stroke-dasharray:none;filter:url(#glow)}
  /* systems */
  .sys{cursor:pointer;outline:none}
  .sys .core{fill:var(--holo-dim);stroke:var(--holo);stroke-width:1.2}
  .sys.capital .core{stroke-width:2;fill:#2c5a80}
  .sys.capital .lbl{font-weight:700;letter-spacing:.2em}
  .sys .ring{fill:none;stroke:var(--holo-dim);stroke-width:1;opacity:.8}
  .sys.beacon .core{fill:var(--bg);stroke:var(--holo-dim);stroke-width:1.5}
  .sys.beacon .ring{stroke-dasharray:2 3}
  .sys.lit .core{fill:var(--ember);stroke:var(--gold);filter:url(#glow)}
  .sys.lit .ring{stroke:var(--ember);stroke-dasharray:none;animation:pulse 3s ease-in-out infinite}
  .sys.always .core{fill:var(--gold);stroke:var(--gold);filter:url(#glow)}
  .sys.always .ring{stroke:var(--gold);opacity:.5;stroke-dasharray:none}
  .sys.lit text,.sys.always text{fill:var(--gold)}
  .sys .hit{fill:transparent}
  @keyframes pulse{0%,100%{opacity:.35;r:11}50%{opacity:.9;r:15}}
  /* hover dimming */
  #chart.hl .lane:not(.on),#chart.hl .sys:not(.on){opacity:.28}
  #chart.hl .lane.on{stroke:var(--holo)} #chart.hl .lane.on[data-kind=living],#chart.hl .lane.on.relit{stroke:var(--gold)}
  /* zoom-dependent label fade */
  .r-hydian,.r-far{transition:opacity .3s}
  #chart[data-zoom=reach] .r-hydian{opacity:.45} #chart[data-zoom=reach] .r-far{opacity:.15}
  #chart[data-zoom=wide] .r-far{opacity:.6}
  /* HUD */
  #hud{position:absolute;inset:0;pointer-events:none}
  #hud>*{pointer-events:auto}
  #hud>.frame{pointer-events:none}
  .frame{position:absolute;inset:10px;border:1px solid var(--holo-faint);pointer-events:none}
  .frame:before,.frame:after{content:"";position:absolute;width:22px;height:22px;border:2px solid var(--holo)}
  .frame:before{left:-1px;top:-1px;border-right:0;border-bottom:0}.frame:after{right:-1px;bottom:-1px;border-left:0;border-top:0}
  #topbar{position:absolute;left:26px;right:26px;top:14px;display:flex;flex-wrap:wrap;align-items:flex-start;gap:.3rem .8rem;pointer-events:none}
  #title{pointer-events:none;flex:0 1 auto}
  #title h1{margin:0;font-size:1.35rem;font-weight:700;letter-spacing:.18em;color:var(--holo);text-transform:uppercase}
  #title h1 b{color:var(--ember)}
  #title small{display:block;color:var(--dim);letter-spacing:.3em;font-size:.7rem;text-transform:uppercase}
  #regkey{position:absolute;right:26px;bottom:22px;display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.25rem .8rem;max-width:60%;font-size:.6rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
  #regkey .rk i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.35rem;vertical-align:middle;opacity:.9}
  #pres{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);width:min(640px,calc(100% - 40px));background:rgba(5,10,16,.9);border:1px solid var(--holo-dim);padding:.9rem 1.1rem .8rem;display:none;z-index:25;backdrop-filter:blur(4px)}
  #pres.open{display:block}
  #pres .pt{display:flex;justify-content:space-between;align-items:baseline;gap:1rem}
  #pres h2{margin:0;font-size:1.05rem;letter-spacing:.14em;text-transform:uppercase;color:var(--holo)}
  #pres .pd{color:var(--gold);font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap}
  #pres .px{margin:.45rem 0 .5rem;font-size:.86rem;line-height:1.5;color:var(--ink)}
  #pres .pl{display:flex;flex-wrap:wrap;gap:.25rem .9rem;font-size:.6rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:.5rem}
  #pres .pl i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:.35rem;vertical-align:middle;opacity:.85}
  #pres .pn{display:flex;align-items:center;gap:.4rem}
  #pres .pn .cnt{margin-left:auto;font-size:.62rem;letter-spacing:.2em;color:var(--dim)}
  #pres .pn .hb{padding:.35rem .6rem}
  #pres.min .px,#pres.min .pl{display:none}
  #pres .pt .tg{background:none;border:0;color:var(--dim);font-size:1rem;cursor:pointer;padding:0 .2rem;line-height:1}
  /* phones, portrait: a full-width bottom sheet with readable type */
  @media (max-width:720px){#pres{left:12px;right:12px;bottom:52px;width:auto;transform:none;padding:.8rem .9rem;max-height:48vh;overflow:auto} #pres .pt{flex-wrap:wrap;gap:.1rem .6rem} #pres h2{font-size:17px;flex:1 1 100%} #pres .pd{white-space:normal} #pres .pt .tg{margin-left:auto} #pres .px{font-size:16px;line-height:1.5} #pres .pd{font-size:.7rem} #pres .pl{font-size:.66rem} #pres .pn .hb{padding:.5rem .9rem;font-size:.8rem}}
  /* phones, landscape: a side panel so the map stays visible */
  @media (max-height:520px) and (orientation:landscape){#pres{left:auto;right:12px;top:52px;bottom:auto;width:min(340px,42vw);transform:none;max-height:calc(100vh - 64px);overflow:auto;padding:.6rem .75rem} #pres h2{font-size:14px} #pres .px{font-size:13px;line-height:1.4} #pres .pd{white-space:normal;font-size:.6rem} #pres .pt{flex-wrap:wrap;gap:.2rem .6rem}}
  #status{position:absolute;left:26px;bottom:22px;display:flex;gap:.6rem;align-items:flex-end;font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
  #status .pip{display:flex;flex-direction:column;align-items:center;gap:.25rem;cursor:pointer}
  #status .pip i{width:10px;height:10px;border-radius:50%;border:1px solid var(--holo-dim);background:var(--bg)}
  #status .pip.lit i{background:var(--ember);border-color:var(--gold);box-shadow:0 0 8px var(--ember)}
  #status .pip.always i{background:var(--gold);border-color:var(--gold)}
  #status .pip:hover{color:var(--ink)}
  #status .cap{margin-right:.4rem;color:var(--holo)}
  #ctl{display:flex;gap:.4rem;flex-wrap:wrap;justify-content:flex-end;margin-left:auto;pointer-events:auto}
  .hb{background:rgba(5,10,16,.7);border:1px solid var(--holo-dim);color:var(--holo);font:600 .75rem/1 var(--disp);letter-spacing:.15em;text-transform:uppercase;padding:.5rem .7rem;cursor:pointer;backdrop-filter:blur(3px)}
  .hb:hover,.hb:focus-visible{border-color:var(--holo);color:var(--ink);outline:none}
  .hb.on{background:var(--ember);border-color:var(--ember);color:#1b120a}
  #toast{position:absolute;right:26px;top:64px;color:var(--gold);font-size:.75rem;letter-spacing:.2em;text-transform:uppercase;opacity:0;transition:opacity .3s;pointer-events:none}
  #toast.show{opacity:1}
  /* scanlines + vignette */
  #fx{position:absolute;inset:0;pointer-events:none;background:
     repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px),
     radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.75) 100%)}
  /* panel (Task 4 fills it) */
  #panel{position:absolute;right:26px;top:110px;bottom:70px;width:min(360px,calc(100% - 52px));background:rgba(5,10,16,.88);border:1px solid var(--holo-dim);padding:1rem 1.1rem;overflow:auto;transform:translateX(20px);opacity:0;pointer-events:none;transition:.25s;backdrop-filter:blur(4px)}
  #panel.open{transform:none;opacity:1;pointer-events:auto}
  #panel h2{margin:0;font-size:1.3rem;letter-spacing:.15em;text-transform:uppercase;color:var(--holo)}
  #panel h2.lit{color:var(--gold)}
  #panel .k{color:var(--dim);font-size:.7rem;letter-spacing:.25em;text-transform:uppercase;margin:.9rem 0 .2rem}
  #panel p{margin:.2rem 0;font-size:.95rem;font-family:system-ui,"Segoe UI",Roboto,sans-serif;line-height:1.5}
  #panel .x{position:absolute;right:.6rem;top:.5rem;background:none;border:0;color:var(--dim);font-size:1.2rem;cursor:pointer}
  #panel img.wp{display:block;width:100%;height:auto;border:1px solid var(--holo-dim);margin:.4rem 0 .3rem;filter:saturate(.85) contrast(1.05)}
  #panel .facts{display:grid;grid-template-columns:max-content 1fr;gap:.15rem .7rem;margin:.3rem 0;font:.85rem/1.4 system-ui,"Segoe UI",Roboto,sans-serif}
  #panel .facts b{color:var(--dim);font:600 .62rem/1.7 var(--disp);letter-spacing:.18em;text-transform:uppercase}
  #panel a.wpl{color:var(--holo);font:600 .68rem/1 var(--disp);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;border-bottom:1px solid var(--holo-dim)}
  #panel a.wpl:hover{color:var(--ink);border-color:var(--holo)}
  #panel .cc{color:var(--dim);font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;margin-left:.5rem}
  <!-- GM:start -->
  #panel .gm{border-top:1px dashed var(--ember);margin-top:1rem;padding-top:.4rem;display:none}
  body.gm-on #panel .gm{display:block}
  #panel .gm .k{color:var(--ember)}
  .ftag{display:inline-block;border:1px solid var(--ember);color:var(--gold);font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;padding:.1rem .4rem;margin:.15rem .2rem 0 0}
  #chart .fac{font-size:7px;fill:var(--ember);letter-spacing:.1em;display:none}
  body.gm-on #chart .fac{display:block}
  <!-- GM:end -->
  @media (max-width:720px){
    #panel{left:12px;right:12px;top:auto;bottom:56px;width:auto;max-height:46vh;transform:translateY(20px);padding:.8rem .9rem}
    #q{font-size:16px;width:150px}
    #q:focus{width:200px}
    #panel.open{transform:none}
    #regkey{display:none}
    #topbar{left:12px;right:12px;top:10px}
    #title h1{font-size:.9rem;letter-spacing:.14em;white-space:nowrap}
    #title small{display:none}
    #ctl{justify-content:flex-start;gap:.25rem;margin-left:0}
    .hb{padding:.4rem .5rem;font-size:.62rem;letter-spacing:.1em}
    #q{width:120px;padding:.28rem .5rem}
  }
  @media (pointer:coarse){#q{font-size:16px} #panel,#qr,.hb{backdrop-filter:none}
    .sys .lbl{font-size:16px} .sys .sub{font-size:10px} .sys .hop{font-size:11px}
    .sys .core{r:4.5px} .sys.beacon .core{r:6.5px} .sys.capital .core{r:8px}}  /* backdrop blur over a moving raster is a per-frame readback on phones */  /* >=16px: mobile browsers don't auto-zoom the page into the field */
</style>
</head>
<body>
<div id="stage"><canvas id="bg" aria-hidden="true"></canvas><svg id="chart" xmlns="http://www.w3.org/2000/svg" data-zoom="reach" aria-label="System map"></svg><div id="tip"></div></div>
<div id="fx"></div>
<div id="hud">
  <div class="frame"></div>
  <div id="topbar">
  <div id="title"><h1>Nav<b>·</b>Chart</h1><small>90 AR · beacon status live</small></div>
  <div id="ctl">
    <span id="search"><input id="q" placeholder="Search…" autocomplete="off" spellcheck="false" aria-label="search the chart"><div id="qr"></div></span>
    <button class="hb" onclick="zoomBy(1.3)">+</button><button class="hb" onclick="zoomBy(1/1.3)">−</button>
    <button class="hb" onclick="frame('reach')">Frame the Run</button>
    <button class="hb" onclick="frame('road')">Frame the Road</button>
    <button class="hb" onclick="frame('galaxy')">Galaxy</button>
    <button class="hb" id="plotbtn" onclick="togglePlot()">Plot Course</button>
    <button class="hb" onclick="share()">Share</button>
    <button class="hb" id="histbtn" onclick="openPresPicker()">History</button>
    <!-- GM:start -->
    <button class="hb" id="gm-switch" onclick="toggleGM()">GM</button>
    <label class="hb">Import save<input type="file" accept="application/json" style="display:none" onchange="importSave(this.files[0]);this.value=''"></label>
    <!-- GM:end -->
  </div>
  </div>
  <div id="toast"></div>
  <div id="panel"><button class="x" onclick="closePanel()" aria-label="close">✕</button><div id="panel-body"></div></div>
  <div id="pres"><div class="pt"><h2 id="pres-title"></h2><span class="pd" id="pres-date"></span><button class="tg" onclick="document.getElementById('pres').classList.toggle('min')" aria-label="collapse narration" title="collapse / expand">▾</button></div><div class="px" id="pres-text"></div><div class="pl" id="pres-legend"></div>
    <div class="pn"><button class="hb" onclick="presStep(-1)">◀</button><button class="hb" onclick="presStep(1)">▶</button><span class="cnt" id="pres-cnt"></span><button class="hb" onclick="endPres()">✕</button></div></div>
  <div id="status"></div>
  <div id="regkey"></div>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const EDITION = "__EDITION__";
const DATA = JSON.parse(document.getElementById("data").textContent);
const byId = new Map(DATA.systems.map(s => [s.id, s]));
const SVG = "http://www.w3.org/2000/svg";
const chart = document.getElementById("chart");
const VIEWS = {reach:{x:4060, y:5680, w:1120, h:1280}, road:{x:2950, y:3330, w:2800, h:3870}, galaxy:{x:100, y:150, w:7500, h:8100}};
let vb = {...VIEWS.reach};

/* ---- lit state (Task 4 adds persistence) ---- */
let lit = new Set(["bannistar"]);
const isLit = s => s.alwaysLit || lit.has(s.id);
const KEY = "ember-age.system-map.lit";
function loadLit() {
  const q = new URL(location.href).searchParams.get("lit");
  if (q !== null) return new Set(q.split(",").filter(id => byId.has(id)));
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) return new Set(s.filter(id => byId.has(id))); } catch (e) {}
  return new Set(["bannistar"]);
}
function saveLit() {
  try { localStorage.setItem(KEY, JSON.stringify([...lit])); } catch (e) {}
  try { const u = new URL(location.href); u.search = "?lit=" + [...lit].join(","); history.replaceState(null, "", u); } catch (e) {}
}
function toggleLit(id) { if (lit.has(id)) lit.delete(id); else lit.add(id); saveLit(); render(); openPanel(id); }
lit = loadLit();

/* ---- rendering ---- */
function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
}
const esc = t => String(t).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function laneIsRelit(l) { const a = byId.get(l.from), b = byId.get(l.to); return l.kind === "dark" && a.beacon && b.beacon && isLit(a) && isLit(b); }
function regionOf(a, b) { return (a.region === "reach" && b.region === "reach") ? "reach" : (a.region === "far" || b.region === "far") ? "far" : "hydian"; }

function render() {
  chart.innerHTML = "";
  const defs = el("defs", {}, chart);
  defs.innerHTML = `
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
`;
  const gl = el("g", {id:"lanes"}, chart);
  for (const l of (DATA.laneSegs || [])) {
    const a = byId.get(l.from), b = byId.get(l.to);
    el("polyline", {class:"lane r-" + regionOf(a, b) + (laneIsRelit(l) ? " relit" : ""), points:l.pts.map(pt => pt.join(",")).join(" "), "data-from":l.from, "data-to":l.to, "data-kind":l.kind}, gl);
  }
  // one label per named lane, on its longest segment
  const seen = new Map();
  for (const l of (DATA.laneSegs || [])) {
    if (!l.name || l.name === "dead spur") continue;
    const a = byId.get(l.from), b = byId.get(l.to), len = Math.hypot(b.x - a.x, b.y - a.y);
    if (!seen.has(l.name) || seen.get(l.name).len < len) seen.set(l.name, {a, b, l, len});
  }
  for (const [name, {a, b, l}] of seen) {
    const mid = l.pts[Math.floor(l.pts.length / 2)], nxt = l.pts[Math.min(l.pts.length - 1, Math.floor(l.pts.length / 2) + 1)];
    const mx = mid[0], my = mid[1];
    let ang = Math.atan2((nxt[1] - mid[1]) || (b.y - a.y), (nxt[0] - mid[0]) || (b.x - a.x)) * 180 / Math.PI;
    if (ang > 90 || ang < -90) ang += 180;
    const t = el("text", {class:"lanelbl r-" + regionOf(a, b), x:mx, y:my - 6, "text-anchor":"middle", transform:`rotate(${ang} ${mx} ${my})`}, gl);
    t.textContent = name;
  }

  const gs = el("g", {id:"systems"}, chart);
  for (const s of [...DATA.systems].sort((a, b) => (a.capital ? 1 : 0) - (b.capital ? 1 : 0))) {  // capitals paint last, in front

  const dark = hops.filter(h => h.kind === "dark").length;
  const esc2 = x => esc(x);
  document.getElementById("panel-body").innerHTML =
    `<h2>Course</h2><div class="k">${esc2(A)} → ${esc2(B)}</div>` +
    `<p>${hops.length} jump${hops.length === 1 ? "" : "s"}${dark ? ` · <b style="color:var(--gold)">${dark} beacon-dark</b>` : " · all lanes live"}</p>` +
    hops.map((h, i) => `<p class="navhop ${h.kind}"><b>${i + 1}.</b> ${esc2(h.from)} → ${esc2(h.to)} <span class="muted" style="color:var(--dim);font-size:.8em">${esc2(h.route || "")}${h.kind === "dark" ? " · dark" : ""}</span></p>`).join("");
  document.getElementById("panel").classList.add("open");
}
chart.addEventListener("click", e => {
  if (!plotMode || (drag && drag.moved)) return;
  const dot = e.target.classList && e.target.classList.contains("gdot") ? e.target : null;
  const sys = e.target.closest ? e.target.closest(".sys") : null;
  if (dot) { e.stopPropagation(); plotPick(dot.getAttribute("data-n")); }
  else if (sys) { plotPick(byId.get(sys.dataset.id).name); }
}, true);
window.addEventListener("keydown", e => { if (e.key === "Escape" && plotMode) togglePlot(); });

render();
</script>
</body>
</html>
