orce point to inflict 2 strain on a target within short range, or — winning an opposed discipline versus discipline check — to make one target within short range adopt an emotional state or believe something untrue for a few minutes, or four rounds in combat ). - equipment: pre-ruusan disruptor, for the bodies that must never be identified (ranged [light]; damage 10; critical 2; range [short]; vicious 4), vibrosword with a scrubbed provenance (melee; damage 6; critical 2; range [engaged]; defensive 1, pierce 2, vicious 1), one anonymous industrial blasting charge (ranged [light]; damage 8; critical 4; range [short]; blast 6, limited ammo 1). chassis: emperor's hand, edge of the empire core rulebook, p. 402 (adjustments: none). using them: the culling of the inheritors is their graduation exam, and the grade is anonymity : the senior circle dead across a dozen worlds in one night, the archives vanished rather than burned, and nobody sane concluding \"sith.\" force rating 2 is justified as the line's entire pedagogy poured into a single student (era rule, part vii). they never claim a kill, never duel when a fall down a lift shaft will do, and withdraw the moment a fight turns evidentiary — being seen fighting with a lightsaber is a mission failure worse than death, which is why they do not carry one on a working job: the disruptor leaves no body, the vibrosword no signature, and the saber stays home with the master. after the culling they hold the harvested vesta-9 file: they know about the crew, and about immi, and have never once been seen — every misattribution the players chase (the vigil? the admiralty? a purge?) lights a different act 3 fire. --- the scar's echo"}, {"id": "keepers--the-scar-s-echo", "name": "The Scar's Echo", "kind": "Hazard", "typeline": "Encounter hazard", "faction": "Episode 6, \"The Scar\"", "role": "NOT an NPC", "derived": "", "group": "keepers", "html": "<p><em>Encounter hazard — Episode 6, \"The Scar\" — NOT an NPC</em></p>\n<blockquote>\n<p>A New Sith Wars battlefield where the dark side pooled and never drained: kilometers of fused glass under gray ashfall, an Inheritor dig site at its heart, and something underneath that has learned the shape of a listener.</p>\n<p><strong>DELIBERATELY HOMEBREW SECTION — the only one in this file.</strong> The Scar's Echo is a dark-side vergence run as terrain, not a creature: it has no characteristics, no wounds, and cannot be fought. Its mechanics are assembled from two RAW subsystems — the fear-check rules (Discipline checks against a set difficulty, F&amp;D core fear guidance) and Morality/Conflict as written — so nothing below requires a book lookup; the assembly, and the two declared overrides on the Adjustments line at the end of this entry, are the homebrew. The \"Encounter hazard\" typeline above is a sanctioned exception to the template's Nemesis/Rival/Minion types: this is the file's one declared non-NPC entry.</p>\n</blockquote>\n<p><strong>Zones and fear checks.</strong> Call for a fear check (Discipline) when a character first enters each zone, and again if the Echo does something overt (a voice using a dead parent's cadence, a glass field flexing like breath). Per the RAW consequence pattern: on a failure the character suffers 2 strain and adds a setback die to all checks for the remainder of the encounter; three or more threat add 2 further strain; a despair means panic — the character is staggered until the end of their next turn or must immediately move away from the heart. A character who succeeds cannot be forced to re-check in the same zone the same day.</p>\n<table>\n<thead>\n<tr>\n<th>Zone</th>\n<th>Fear check</th>\n<th>Ambient effects</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Ashfall Rim</strong> (the crash-ring and Inheritor base camp)</td>\n<td>Hard Discipline</td>\n<td>Ash-blind: add a setback die to Perception and Vigilance checks; ranged attacks beyond short range upgrade their difficulty once.</td>\n</tr>\n<tr>\n<td><strong>The Glass Fields</strong> (fused, uneven, wrong underfoot)</td>\n<td>Hard Discipline; Force-sensitive characters upgrade the difficulty once</td>\n<td>Difficult terrain throughout. Each hour spent here: Average Discipline check or suffer 1 strain (the whisper accumulates; this strain cannot be recovered until the character leaves the Scar).</td>\n</tr>\n<tr>\n<td><strong>The Choir</strong> (the heart; the dig itself)</td>\n<td>Daunting Discipline; Force-sensitive characters upgrade the difficulty once</td>\n<td>Both outer effects apply. All checks to recover strain here automatically fail. Sleeping in the Choir: 1 Conflict, and a true-but-poisoned dream.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Conflict pressure (RAW Conflict, tempted).</strong> The Echo's offer is generosity. While anywhere within the Scar, a Force-sensitive character may use dark side results on Force power checks <em>without flipping a Destiny Point</em> — the strain cost per dark point still applies as written, and each dark point used this way awards Conflict as RAW <strong>plus 1 additional Conflict</strong> (the vergence's finder's fee). Additionally, award 1 Conflict for: sleeping in the Choir; deliberately opening oneself to the Echo's visions; or taking payment from the dig knowing what is being dug. Land the aftermath hard (Part VII): there are no counselors in this era, and the first person to explain the nightmares wins — make sure the players notice who is offering.</p>\n<p><strong>The visions.</strong> Seek, Sense, Foresee, and Farsight checks made within the Scar add both a boost die <em>and</em> a setback die, and what they return is true but curated — the Echo shows real fragments (it qualifies as a <strong>Sith-tagged lore fragment source</strong> for the Reconstruction subsystem) selected to make the viewer feel indispensable. A despair on any such check puts a corrupted conclusion in play that the character believes (mirror of the Reconstruction rules).</p>\n<p><strong>The bargain (Wellspring).</strong> The Scar is a functional vergence, and therefore a legal Wellspring (Part VII): a Force-sensitive character <em>can</em> raise Force Rating or open a new power tree here. Any advance bought with the Scar as its Wellspring carries a rider: the first time that power or rating is used each session, the character gains 1 Conflict. This is the campaign's first real temptation, and it should work — the offer is genuine, the training is real, and the price is on layaway.</p>\n<p><strong>Running it.</strong> The Echo has no agenda a stat block could hold; it wants <em>listeners</em>, and it prefers the young. The Inheritor dig crew (coin, answers, courtesy — first contact is always helpful, per Dial 3) treats the whisper as an occupational perk and is quietly further gone than they know. Never bring Immi here on-screen without intending the campaign to pivot on it: she dreams of the Valley, which is loud, but the Scar is quiet and hungry, and it would very much like to be her second teacher.</p>\n<p><strong>Chassis:</strong> original build (encounter hazard — no adversary stat block exists or is owed; assembled from the F&amp;D fear-check guidance and RAW Morality/Conflict). <strong>Adjustments:</strong> the +1 Conflict finder's-fee and the no-Destiny-flip dark-pip rule are the only overrides of RAW, both declared above.</p>", "search": "the scar's echo encounter hazard — episode 6, \"the scar\" — not an npc a new sith wars battlefield where the dark side pooled and never drained: kilometers of fused glass under gray ashfall, an inheritor dig site at its heart, and something underneath that has learned the shape of a listener. deliberately homebrew section — the only one in this file. the scar's echo is a dark-side vergence run as terrain, not a creature: it has no characteristics, no wounds, and cannot be fought. its mechanics are assembled from two raw subsystems — the fear-check rules (discipline checks against a set difficulty, f&d core fear est thing a wayfinder can own to a bunker. ten passenger berths make it the natural refugee boat, pilgrim carrier, or mobile village — which is its own kind of plot hook."}, {"id": "ships--yt-1300-light-freighter", "name": "YT-1300 Light Freighter", "kind": "Vehicle", "typeline": "Vehicle", "faction": "heirloom lane-runner", "role": "the everywhere pattern", "derived": "Defense Fore/Aft 1/1 · Armor 3 · Hull Trauma Threshold 22 · System Strain Threshold 15", "group": "ships", "html": "<p><em>Vehicle — heirloom lane-runner — the everywhere pattern</em></p>\n<blockquote>\n<p>Corellia built so many of these before the lights went out that the design has become a kind of shared memory: every port has one, and every one is somebody's whole inheritance.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Silhouette</th>\n<th style=\"text-align: center;\">Speed</th>\n<th style=\"text-align: center;\">Handling</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">−1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Defense Fore/Aft 1/1 · Armor 3 · Hull Trauma Threshold 22 · System Strain Threshold 15</strong></p>\n<ul>\n<li><strong>Hyperdrive:</strong> Primary: Class 2, Backup: Class 12</li>\n<li><strong>Navicomputer:</strong> Yes</li>\n<li><strong>Sensor Range:</strong> Short</li>\n<li><strong>Crew:</strong> One pilot, one co-pilot/engineer</li>\n<li><strong>Encumbrance Capacity:</strong> 165 · <strong>Passenger Capacity:</strong> 6</li>\n<li><strong>Consumables:</strong> Two months · <strong>Price/Rarity:</strong> 100,000 credits/4 · <strong>Customization Hard Points:</strong> 6</li>\n<li><strong>Weapons:</strong> One dorsal and one ventral turret-mounted medium laser cannon (Fire Arc All; Damage 6; Critical 3; Range [Close])</li>\n</ul>\n<p><strong>Chassis:</strong> YT-1300 Light Freighter, Edge of the Empire Core Rulebook (adjustments: none).\n<strong are the real defensive stat. --- the admiralty"}, {"id": "ships--bns-steadfast-bastion-pattern-patrol-sloop", "name": "BNS Steadfast, Bastion-pattern Patrol Sloop", "kind": "Vehicle", "typeline": "Vehicle", "faction": "the Admiralty", "role": "Commander Joss Reike's inspection sloop", "derived": "Defense Fore/Port/Starboard/Aft 2/2/2/1 · Armor 6 · Hull Trauma Threshold 45 · System Strain Threshold 20", "group": "ships", "html": "<p><em>Vehicle — the Admiralty — Commander Joss Reike's inspection sloop</em></p>\n<blockquote>\n<p>The Steadfast does not hail you so much as inform you: a wall of pre-Ruusan naval steel that was keeping this watch before your grandmother was born, crewed by people who never stopped believing in uniforms.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Silhouette</th>\n<th style=\"text-align: center;\">Speed</th>\n<th style=\"text-align: center;\">Handling</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">5</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">−1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Defense Fore/Port/Starboard/Aft 2/2/2/1 · Armor 6 · Hull Trauma Threshold 45 · System Strain Threshold 20</strong></p>\n<ul>\n<li><strong>Hyperdrive:</strong> None</li>\n<li><strong>Navicomputer:</strong> None</li>\n<li><strong>Sensor Range:</strong> Long</li>\n<li><strong>Crew:</strong> Twelve</li>\n<li><strong>Encumbrance Capacity:</strong> not listed in the printed block · <strong>Passenger Capacity:</strong> 10 (troopers or prisoners)</li>\n<li><strong>Consumables:</strong> One month · <strong>Price/Rarity:</strong> 4,000,000 credits/5 · <strong>Customization Hard Points:</strong> 2</li>\n<li><strong>Weapons:</strong></li>\n<li>Dorsal, ventral, port, and starboard turret-mounted point-defense turbolaser batteries (Fire Arc All; Damage 11; Critical 3; Range [Long]; Breach 3, Linked 1, Slow-Firing 1)</li>\n<li>Forward-mounted concussion missile launcher (Fir ive a bold pilot honest odds; being remembered by the admiralty is the real cost. --- the circuit"}, {"id": "ships--swoop-bike", "name": "Swoop Bike", "kind": "Vehicle", "typeline": "Vehicle", "faction": "the swoop circuit", "role": "mail, gossip, and glory at 600 kph", "derived": "Defense Fore/Aft 0/0 · Armor 0 · Hull Trauma Threshold 2 · System Strain Threshold 3", "group": "ships", "html": "<p><em>Vehicle — the swoop circuit — mail, gossip, and glory at 600 kph</em></p>\n<blockquote>\n<p>The circuit is the closest thing the galaxy has to a broadcast, and this is its transmitter: one screaming engine, one rider, and a courier satchel bolted where the sense should be.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Silhouette</th>\n<th style=\"text-align: center;\">Speed</th>\n<th style=\"text-align: center;\">Handling</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">+2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Defense Fore/Aft 0/0 · Armor 0 · Hull Trauma Threshold 2 · System Strain Threshold 3</strong></p>\n<ul>\n<li><strong>Hyperdrive:</strong> None</li>\n<li><strong>Navicomputer:</strong> None</li>\n<li><strong>Sensor Range:</strong> None</li>\n<li><strong>Crew:</strong> One pilot</li>\n<li><strong>Encumbrance Capacity:</strong> 4 · <strong>Passenger Capacity:</strong> 1</li>\n<li><strong>Consumables:</strong> None · <strong>Price/Rarity:</strong> 6,000 credits/3 · <strong>Customization Hard Points:</strong> 2 · <strong>Maximum Altitude:</strong> 350 meters</li>\n<li><strong>Weapons:</strong> None</li>\n</ul>\n<p><strong>Chassis:</strong> Flare-S Swoop, Edge of the Empire Core Rulebook (adjustments: none).\n<em>(stats unverified against print — scope: Speed/Handling and Hull Trauma/System Strain Thresholds could not be independently corroborated — verify them against the Flare-S Swoop entry in the Edge of the Empire Core Rule const GROUPS = [{"slug": "session-one", "label": "Vesta-9 & the Crew's Orbit", "intro": "<h1>Vesta-9 &amp; the Crew's Orbit</h1>\n<p>Seven roster NPCs for session one, \"The Light on Vesta-9\" — plus the <em>Steadfast</em>'s marine boarding party, statted here so the standoff runs without a lookup — and for the orbit the crew will keep crossing all campaign: the port that impounded their cargo, the rival ship racing them to the beacon, and the three factions waiting at the light. It is 90 AR — the beacon has just relit after sixty dark years, nobody admits to lighting it, and every ship at Okrent's Drift that can lift is lifting. Every stat block below is an official FFG print pulled verbatim and re-skinned for the era; chassis and adjustments are declared on each.</p>\n<p><strong>GM file — contains spoilers for session one and threads into the campaign's locked truths (Part V). Players keep out.</strong></p>\n<hr />\n<h2>Okrent's Drift — The Scramble</h2>"}, {"slug": "republic-admiralty", "label": "Republic & Admiralty", "intro": "<h1>The Provisional Republic &amp; the Admiralty</h1>\n<p>Ninety years into an interregnum it still calls temporary, the Provisional Republic holds the old flag, the old archives, and a writ that stops at the atmosphere — while the Admiralty of the Bastion Worlds holds the last working capital ships and a founding story that requires an enemy. Between them lies the era's central argument: whether the galaxy is restored by continuity or secured by force. These six NPCs are the faces a wayfinder crew will meet when either power comes calling.</p>\n<p><em>GM file — contains faction cracks and campaign spoilers; do not share with players.</em></p>\n<hr />\n<h2>The Provisional Republic</h2>"}, {"slug": "vigil-inheritors", "label": "Vigil & Inheritors", "intro": "<h1>The Vigil &amp; the Inheritors</h1>\n<p>Two orders answer the Awakening, and both were founded on graves. The Vigil holds the sealed temples and the relics of the old Orders under a doctrine of veneration-without-practice — the standing peace terms with a bereaved galaxy — even as its founding generation dies and its certainty hardens. The Inheritors, heirs of the Brotherhood's quartermasters and camp-followers, spent three generations hoarding Sith lore, and now arrive first — warm, helpful, and taking notes — on the doorsteps of frightened Force-sensitive families.</p>\n<p><strong>GM file — spoilers for Dial 3, the Unveiling, and the Conclave of Charts. Do not share with players.</strong></p>\n<hr />\n<h2>The Vigil</h2>"}, {"slug": "lanes-ledgers", "label": "Lanes & Ledgers", "intro": "<h1>Lamplighters, Kajidics, the Guild &amp; the Clans</h1>\n<p>Ninety years after Ruusan, the powers in this file are the ones the Withering could not kill: the guild that kept the beacons breathing, the Hutt clan-corporations that got rich on the dark, the one writ that still travels between systems, and the one people who never demobilized. None of them wants the old Republic back — but every one of them intends to be paid, chartered, or armed when whatever comes next arrives. The party will work for all four before they ever fight one.</p>\n<p><strong>GM eyes only — this file carries Act 2–3 leverage (the Conclave of Charts, the kajidic succession) and one Dial 3 thread. Do not hand to players.</strong></p>\n<hr />\n<h2>The Lamplighters</h2>"}, {"slug": "reaches", "label": "The Reaches", "intro": "<h1>The Reaches — Episode NPCs</h1>\n<p>Beyond the Vesta-9 corridor lies the Q'ell Reach: ten thousand islands ninety years into the Withering, each one grown strange in its own direction. The people and machines below are what the crew finds when a lane relights — caretakers still keeping faith with vanished masters, economies built on scrap and provenance, and one very polite droid still working a dead government's kill-list. Every stat block here but one is an official published FFG adversary pulled verbatim and re-skinned for 90 AR — the single exception (Anwei, an original build) is declared on her block; chassis and adjustments are cited on each block.</p>\n<p><em>GM eyes only — this file spoils episode reveals for The Dead Letter, The Sealed Enclave, The Ration Engine, The Oracle of Brel, The Memory Market, The Chop-Yards, The Circuit, The Relit Lanes, and The Mausoleum Yards.</em></p>\n<hr />\n<h2>The Dead Letter</h2>"}, {"slug": "keepers", "label": "Keepers of the Flame 🔒", "intro": "<h1>Keepers of the Flame — GM-Locked Force Users</h1>\n<p>Ninety years after Ruusan, the trained Force survives in exactly two places, and neither advertises: a hidden Jedi lineage down to one tired Master and one farmhand pupil, and the Banite line, two or three successions deep and patiently setting the table. This file stats both — plus the dark-side vergence the Inheritors are digging into — because Acts 2 and 3 turn on who reaches the new generation first. These five entries are the campaign's locked answers made playable.</p>\n<p><strong>GM ONLY — SPOILER-CRITICAL. Nothing in this file is player-facing; it implements Part V (locked) of the planning document. Do not read aloud, do not summarize to players, do not leave open at the table.</strong></p>\n<blockquote>\n<p><strong>Sourcing note (updated after re-pull).</strong> Per the pull-don't-build policy, all four NPCs below are now <strong>verbatim pulls of official printed FFG adversary blocks</strong>. Attestation: a book-and-page-cited transcription dataset (the MIT-licensed stoogoff/sw-adversaries index, carrying full characteristics, derived stats, skills, talents, and weapon lines per entry) was cross-checked so that every citation resolves to an official FFG book — <strong>\"Forsaken Jedi\"</strong> (Edge of the Empire Core Rulebook, p. 412), <strong>\"Jedi Padawan\"</strong> (Collapse of the Republic, p. 137), <strong>\"Fallen Master\"</strong> (Force and Destiny Core Rulebook, p. 412; reprinted in Allies and Adversaries, p. 81), and <strong>\"Emperor's Hand\"</strong> (Edge of the Empire Core Rulebook, p. 402). Every printed number is transcribed exactly; only names, flavor, and equipment cosmetics are re-skinned for the era, and every block's Adjustments line is \"none.\" The first draft's original builds and their unverified-against-print flags are hereby retired. The Scar's Echo remains the file's one declared homebrew entry (a hazard, not an adversary — no printed block exists or is owed). At the table, print outranks this file: if one of the cited books is open in front of you and disagrees on a number, the book wins — then tell the archivist.</p>\n</blockquote>\n<hr />\n<h2>The Hidden Lineage</h2>\n<p>The second fork of Dial 1, resolved: one Jedi lineage survives to 90 AR. It consists, in its entirety, of the two people below. Neither the Vigil, the Republic, nor the Inheritors know they exist. A living mentor is the rarest Wellspring in the era (Part VII) — which makes Yenna Sar, mechanically and politically, the most valuable being in the campaign.</p>"}, {"slug": "ships", "label": "Ships of the Ember Age", "intro": "<h1>Ships of the Ember Age</h1>\n<p>Ninety years after Ruusan, nothing flies new. Every hull in this file is an inheritance — a pre-Withering pattern kept alive by devotion, cannibalized cousins, and a family's whole savings — and the handful of yards that could lay a fresh keel are strategic prizes worth wars. Book prices are quoted in old Republic credits as printed; in 90 AR a working ship is beyond price and a dead one becomes a neighborhood. Every stat block below is an official FFG vehicle block reproduced as printed; only the names and the rust are ours.</p>\n<p><em>This file is player-safe: no campaign secrets appear anywhere in it.</em></p>\n<hr />\n<h2>The Heirloom Lane-Runners</h2>\n<p><strong>Campaign convention.</strong> The three hulls below are the campaign's \"lane-runner patterns\" — freighter designs that were already old when the beacons went dark, reflavored as pre-Ruusan keels a century deep in one family's service. A player crew's shared ship uses one of these blocks <em>exactly as printed</em>: age lives in the paint, the smell, and the Obligation, never in the numbers. If a GM wants the rust mechanically visible for a session, RAW offers the <strong>Inferior</strong> quality (on a weapon: −1 damage <em>and</em> automatic threat on checks using it; on another system, apply the automatic threat) as a <em>temporary, story-driven condition</em> — apply it as a scene complication and take it off when the crew earns the repair montage. The blocks themselves stay stock.</p>"}];
const PAGES  = [{"section": "reference", "id": "primer", "title": "Adversary Rules Primer", "html": "<h1>NPC Library</h1>\n<p><em>Every stat block in this library is an </em><em>official published FFG adversary pulled as printed</em><em> and re-skinned for the Ember Age — new name, new face, same numbers. Each block cites its chassis (the printed adversary and book) and declares any mechanical deviation on an <code>Adjustments:</code> line (almost always \"none\"). Nothing here is built on fan homebrew.</em></p>\n<h2>How to read the blocks — FFG adversary rules in one screen</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Minion</strong></th>\n<th><strong>Rival</strong></th>\n<th><strong>Nemesis</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Strain threshold</td>\n<td><strong>None</strong> — strain damage becomes wounds</td>\n<td><strong>None</strong> — strain suffered becomes wounds</td>\n<td>Full strain threshold</td>\n</tr>\n<tr>\n<td>Skills</td>\n<td><strong>Group only, no ranks</strong> — a group has ranks equal to (members − 1) in its group skills</td>\n<td>Ranked, like a PC</td>\n<td>Ranked, like a PC</td>\n</tr>\n<tr>\n<td>Talents</td>\n<td>None</td>\n<td>Sparingly</td>\n<td>Expected — usually <strong>Adversary 1–3</strong> (<em>upgrade the difficulty of all combat checks targeting them, once per rank</em>)</td>\n</tr>\n<tr>\n<td>Dies to</td>\n<td>Any hit past its Wound Threshold</td>\n<td>Wounds past threshold</td>\n<td>Wounds past threshold (crits matter)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Minion group math:</strong> a group's wound threshold is the sum of its members' (four WT-5 minions = group WT 20), and one minion drops each time total damage passes a multiple of the individual WT.</p>\n<p><strong>Soak</strong> = Brawn + armor. <strong>Melee damage</strong> is printed as a total (Brawn already included).</p>\n<h2>The roster</h2>\n<table>\n<thead>\n<tr>\n<th>NPC</th>\n<th>Type</th>\n<th>Affiliation</th>\n<th>File</th>\n</tr>\n</thead>\ l &amp; Inheritors</a></td>\n</tr>\n<tr>\n<td>Grandmaster of Charts Ophira Zel</td>\n<td>Nemesis</td>\n<td>Lamplighters</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Beacon-Tender</td>\n<td>Rival</td>\n<td>Lamplighters</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Lane-Runner Deckhands</td>\n<td>Minions</td>\n<td>Lamplighters</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Sorulba the Anchor</td>\n<td>Nemesis</td>\n<td>Kajidics</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Jeeda the Younger</td>\n<td>Rival</td>\n<td>Kajidics</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Kajidic Enforcers</td>\n<td>Minions</td>\n<td>Kajidics</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Arbiter Ten Vekk</td>\n<td>Nemesis</td>\n<td>Bounty Hunters' Guild</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Guild Purist Tracker</td>\n<td>Rival</td>\n<td>Bounty Hunters' Guild</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Captain Tal Ordo</td>\n<td>Nemesis</td>\n<td>Mandalorian Clans</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Clan Ordo Soldiers</td>\n<td>Minions</td>\n<td>Mandalorian Clans</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Runi Ordo</td>\n<td>Rival</td>\n<td>Mandalorian Clans (Awakened foundling)</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>\"Dead Letter\"</td>\n<td>Nemesis</td>\n<td>a ninety-year-old contract</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Docent-7</td>\n<td>Rival</td>\n<td>the Sealed Enclave</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>The Quartermaster</td>\n<td>Rival (social)</td>\n<td>the Ration Engine</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Anwei, the Oracle of Brel</td>\n<td>Rival</td>\n<td>Brel</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Provenance-Broker Halla Wex + Scribes</td>\n<td>Rival + Minions</td>\n<td>the Memory Market</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Junk Baron Okkam Dree + Clan Cutters</td>\n<td>Rival + Minions</td>\n<td>salvage economy</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Swoop Ace \"Kettle\" Maro</td>\n<td>Rival</td>\n<td>the circuit</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Pirate Captain of the Quiet + Quiet Pirates</td>\n<td>Nemesis + Minions</td>\n<td>the Quiet</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Hullmayor Bessa Rin + Hull-City Militia</td>\n<td>Rival + Minions</td>\n<td>the Mausoleum Yards</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Master Yenna Sar</td>\n<td>Nemesis</td>\n<td>hidden Jedi lineage</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>Coll Bren</td>\n<td>Rival</td>\n<td>hidden Jedi lineage</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>The Patient Master</td>\n<td>Nemesis</td>\n<td>the true Sith line</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>The Patient Apprentice</td>\n<td>Nemesis</td>\n<td>the true Sith line</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>The Scar's Echo</td>\n<td>Hazard</td>\n<td>the dark side, pooled</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n</tbody>\n</table>\n<p>🔒 = spoiler-critical even within the GM section: these existences are Dial 1 material.</p>\n<p><em>Ship stat blocks live in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:ships\">Ships of the Ember Age</a> (shareable — ship stats aren't spoilers).</em></p>"}, {"section": "reference", "id": "dice-results", "title": "Reading the Dice", "html": "<h1>Reading the Dice</h1>\n<p><em>A player reference for The Ember Age (FFG Star Wars narrative dice)</em></p>\n<p>You rolled. Symbols everywhere. Here is the whole trick: the dice answer <strong>two separate questions</strong>, and you only freeze when you try to make them answer one. Question one — <em>did it work?</em> Question two — <em>what else happened?</em> Settle them in that order, out loud, and you are done in ten seconds.</p>\n<h2>Reading a Roll in 10 Seconds</h2>\n<p><strong>Axis 1 — Did it work?</strong> Count <strong>Success</strong> symbols, count <strong>Failure</strong> symbols. Each Failure cancels one Success. If at least one Success is left over, the check succeeds. If Successes and Failures cancel out exactly — or Failures win — the check fails. Ties go to failure. Nothing else on the table can change this answer.</p>\n<p><strong>Axis 2 — What else happened?</strong> Count <strong>Advantage</strong> symbols, count <strong>Threat</strong> symbols. Each Threat cancels one Advantage. Whatever is left over is a side effect — a perk if Advantage remains, a complication if Threat remains. This currency <strong>never</strong> turns success into failure or failure into success. You can fail brilliantly (failure with Advantage: the lock holds, but you spot the maintenance hatch) or succeed at a price (success with Threat: the door opens, loudly).</p>\n<p><strong>The big symbols:</strong></p>\n<ul>\n<li><strong>Triumph</strong> is a Success <em>plus</em> something spectacular. Its built-in Success goes into the Axis 1 tally and can be cancelled by a Failure like any other — but the Triumph <em>effect</em> is never cancelled. Even on a check that fails overall, you still spend the Triumph.</li>\n<li><strong>Despair</strong> is the mirror: it adds one Failure to the Axis 1 tally (cancellable normally), and its <em>effect</em> always lands regardless of the roll's outcome. You can succeed and still eat a Despair.</li>\n<li>Triumph and Despair do <strong>not</strong> cancel each other. Both fire.</li>\n</ul>\n<p>So every roll lands in one of four quadrants — succeed/fail crossed with perk/complication — plus optional fireworks. Name the quadrant, then spend.</p>\n<h2>Spending Advantage and Triumph in Combat</h2>\n<p>These are the standard rulebook options. Announce your spend; the GM narrates it.</p>\n<table>\n<thead>\n<tr>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Advantage</td>\n<td>Recover 1 strain (may be chosen more than once).</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Add a boost die to the next allied character's check.</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Notice one important point in the fight — the blast door controls, a weak seam in the armor plating, the catwalk above.</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Activate a weapon quality whose listed cost is 1.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Perform one immediate free maneuver (cannot exceed the two-maneuver-per-turn limit).</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Add a setback die to a targeted character's next check.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Activate a weapon quality (2 is the default cost unless the quality says otherwise).</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Negate the target's defensive bonuses (cover, equipment, guarded stance) until the end of the current round.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Ignore penalizing environmental effects (weather, zero-g, and the like) until the end of your next turn.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Force the target into a significant drawback — drop a wielded weapon, or (on a damaging hit, with GM agreement) disable a piece of their gear instead of dealing the damage.</td>\n</tr>\n<tr>\n<td>Advantage = weapon's Critical rating</td>\n<td>On a hit that deals damage past soak, trigger a <strong>Critical Injury</strong>. Extra activations add +10 each to the Critical roll.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Any option above, regardless of its Advantage cost.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Trigger a Critical Injury on a damaging hit, regardless of Critical rating.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Activate any weapon quality, regardless of its cost.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Upgrade the difficulty of the target's next check, or upgrade the ability of an ally's next check (yourself included).</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Do something vital and scene-shaping: shoot the blast-door controls, collapse the catwalk, spot the escape route.</td>\n</tr>\n<tr>\n<td>2 Triumph</td>\n<td>On a damaging hit, destroy one piece of equipment the target is using — blow up their blaster, burn out their shield generator.</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>One crit per hit.</strong> A single hit can inflict only <strong>one</strong> Critical Injury, no matter how you pay for it. Every activation after the first — whether bought with Advantage or Triumph — instead adds +10 to that one Critical roll.</p>\n</blockquote>\n<h3>The Mirror: Threat and Despair in Combat</h3>\n<p>The GM (or you, narrating your own stumble) spends these against the active character.</p>\n<table>\n<thead>\n<tr>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Threat</td>\n<td>Suffer 1 strain (may be applied more than once).</td>\n</tr>\n<tr>\n<td>1 Threat</td>\n<td>Lose the benefit of a prior maneuver (your aim, your guarded stance) until you take it again.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>An opponent may take one immediate free maneuver.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>Add a boost die to a targeted character's next check, or a setback die to your own or an ally's next check.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>Fall prone.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>Grant the enemy a significant advantage in the encounter — you shoot out the bridge controls you needed for your own escape.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Your ranged weapon runs out of ammunition for the rest of the encounter.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Your weapon or tool is damaged — it jams, cracks, or degrades a step.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Upgrade the difficulty of an ally's (or your own) next check.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>A serious GM complication: the shot hits an ally, the gear breaks at the worst moment, the fallback plan closes.</td>\n</tr>\n</tbody>\n</table>\n<h2>Advantage Outside Combat</h2>\n<p>Out of combat, Advantage buys narrative position: information, time, goodwill, or a setup for the next check (usually a boost die to a follow-up, a setback die on the opposition, or a detail the GM confirms). One or two Advantage buys something small; three or more, or a Triumph, buys something the whole scene turns on. <strong>You may suggest any of these to the GM:</strong></p>\n<ul>\n<li><strong>Slicing (Computers):</strong> leave no trace in the log; find one extra file you were not looking for; keep the backdoor open for later.</li>\n<li><strong>Mechanics:</strong> the repair holds longer than it should; finish faster than expected; salvage a usable spare part from the job.</li>\n<li><strong>Astrogation:</strong> shave hours off the transit; note a landmark worth adding to the rutter; arrive positioned exactly where you wanted.</li>\n<li><strong>Negotiation:</strong> better price, or a favor thrown in; learn what the other side actually values; leave the door open for future business.</li>\n<li><strong>Charm / Deception:</strong> the target repeats your version to others; you read what they are hiding; the lie survives one follow-up question.</li>\n<li><strong>Stealth:</strong> find an exit route as you go; overhear something useful; leave the guards arguing about whether they saw anything at all.</li>\n</ul>\n<p>Failed the check but rolled Advantage? Same menu, smaller portions: the attempt did not work, <em>and</em> you learned something, kept your cover, or set up the next try.</p>\n<h2>The Ember Age Spends (Campaign-Specific)</h2>\n<p>House options for this campaign's subsystems. All of these are proposals, not entitlements — see the etiquette box.</p>\n<table>\n<thead>\n<tr>\n<th>Cost</th>\n<th>Situation</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2 Advantage</td>\n<td>Any relevant Knowledge check</td>\n<td>Surface a lead: the GM names where a related <strong>lore fragment</strong> might be found — a witness, a rutter page, an unwiped droid.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Beacon relight, any stage</td>\n<td>Ease the next stage: hand a boost die to whichever crewmate tackles it.</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Social check with a faction agent</td>\n<td>Glimpse a hairline crack: one hint of the tension running through their faction.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Cantina or swoop-circuit scene</td>\n<td>The rumor network works for you: a courier carries one message or question ahead of you, free.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Beacon relight, any stage</td>\n<td>One stage's failsafes yield early: that stage completes without a further check.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Reconstruction scene</td>\n<td>A secret beyond the Question: the GM reveals something the fragments were never asked about.</td>\n</tr>\n<tr>\n<td>1 Threat</td>\n<td>Open Force use with witnesses</td>\n<td>The crowd's reaction worsens one extra step beyond the normal witness rule.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>Astrogation on a decayed lane</td>\n<td>Your route leaks: a rival crew or faction learns which corridor you are running.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Reconstruction scene</td>\n<td>A <strong>corrupted conclusion</strong> enters play — and the party believes it.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Beacon relight, any stage</td>\n<td>The relight broadcasts wider than intended. Someone you did not invite heard it, and is coming.</td>\n</tr>\n</tbody>\n</table>\n<h2>Etiquette at the Table</h2>\n<blockquote>\n<p><strong>The player proposes, the GM disposes.</strong> Suggest a spend in plain words — \"two Advantage: can I get a free maneuver to duck behind the crates?\" — and let the GM shape it. You will rarely be told no; you will often be told \"yes, and.\"</p>\n<p><strong>Spend promptly.</strong> A decent spend now beats a perfect spend after two minutes of menu-reading. Table momentum is worth more than optimization, and the strain recovery is <em>always</em> there when nothing else sings.</p>\n<p><strong>Use it or lose it — gracefully.</strong> Unspent Advantage does not bank between rolls. If you shrug, the GM may spend it as scene color on your behalf. That is not a punishment; it is the dice refusing to be boring.</p>\n</blockquote>\n<p>When in doubt: recover strain, boost a friend, or notice something. Those three answers are never wrong.</p>"}, {"section": "reference", "id": "lore-fragments", "title": "Lore Fragments", "html": "<h1>Lore Fragments</h1>\n<p><em>The core subsystem. The players assemble the true history themselves.</em></p>\n<h2>What a fragment is</h2>\n<p>A fragment is a <strong>tangible source</strong>: a holocron shard, a rutter, a sealed archive cell, an unwiped pre-war droid memory core — or a <strong>living witness</strong>. The last human eyewitnesses of Ruusan are dying this decade, and longer-lived species still carry the war as personal memory; testimony is a fragment you can argue with, and it contradicts the documents exactly as often as they contradict each other.</p>\n<p>Every fragment carries a tag — <strong>Jedi</strong>, <strong>Sith</strong>, or <strong>Civic</strong> — and fragments about the same event from different tags <strong>always disagree on one load-bearing fact.</strong></p>\n<h2>Rules</h2>\n<ul>\n<li><strong>Holding a relevant fragment</strong> adds a boost die to related Knowledge checks.</li>\n</ul>\n<h3>Reconstruction</h3>\n<p>With <strong>three or more fragments</strong> bearing on one named <strong>Question</strong> (\"What ended the Order?\" \"What is the Valley?\"), the party may attempt a <strong>Hard Knowledge (Lore)</strong> check as a group scene.</p>\n<ul>\n<li>If <strong>all three tags</strong> are represented: upgrade an ability die once.</li>\n<li>If <strong>only one tag</strong> is represented: upgrade the difficulty once — <em>bias is real.</em></li>\n</ul>\n<h3>Results</h3>\n<table>\n<thead>\n<tr>\n<th>Result</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Success</strong></td>\n<td>The GM reveals a <strong>Truth</strong>, and the party gains an <strong>Insight</strong> — permanently remove a setback die from one defined category of checks, <strong>or</strong> unlock an out-of-career talent purchase the Truth justifies</td>\n</tr>\n<tr>\n<td><strong>Triumph</strong></td>\n<td>A secret beyond the Question</td>\n</tr>\n<tr>\n<td><strong>Despair</strong></td>\n<td>A <strong>corrupted conclusion</strong> enters play — and the party believes it</td>\n</tr>\n</tbody>\n</table>\n<h2>Named Questions</h2>\n<p>Keep a public list of the Questions the party is working, e.g.:</p>\n<ul>\n<li><em>What ended the Order?</em></li>\n<li><em>What is the Valley?</em></li>\n<li><em>Who lit Vesta-9?</em></li>\n<li><em>What did the Adjournment actually adjourn?</em></li>\n</ul>\n<p><em>(GM: track issued fragments and their tags in the GM tools section of this wiki.)</em></p>"}, {"section": "reference", "id": "beacon-relighting", "title": "Relighting a Beacon", "html": "<h1>Relighting a Beacon</h1>\n<p><em>The set-piece skill challenge. Three stages in any order, built so different PCs shine.</em></p>\n<h2>The three stages</h2>\n<h3>1. Wake it</h3>\n<p><strong>Mechanics or Computers</strong> against sixty years of dead-man failsafes.</p>\n<h3>2. Chart it</h3>\n<p><strong>Hard Astrogation</strong>, with <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">fragments</a> and rutters as boost dice.</p>\n<h3>3. Speak to it</h3>\n<p>A <strong>Knowledge or social check</strong> to satisfy old Republic handshake protocols — or to convince a guild observer to certify the lighting.</p>\n<h2>What a relit beacon does</h2>\n<p>Each relit beacon:</p>\n<ul>\n<li><strong>Opens a region</strong> — a corridor of worlds ninety years strange.</li>\n<li><strong>Shifts the faction map.</strong></li>\n<li><strong>Pays a first-lighting fee</strong> (see <a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">the Lamplighters</a>).</li>\n<li><strong>Raises the same question: who follows you through?</strong></li>\n</ul>"}, {"section": "reference", "id": "force", "title": "The Force in the Ember Age", "html": "<h1>The Force in the Ember Age</h1>\n<p><em>In this era the Force is not a skill; it is an event.</em></p>\n<h2>Almost no teachers — Wellsprings</h2>\n<p>Increasing <strong>Force Rating</strong> or opening a <strong>new power tree</strong> requires a <strong>Wellspring</strong> found in play — a functional holocron, a vergence, or, rarest of all, a living mentor from one of the hidden lineages — <strong>in addition to the usual XP.</strong></p>\n<p>Knowledge is treasure.</p>\n<h2>Witnesses</h2>\n<p>Open Force use in front of ordinary people:</p>\n<ul>\n<li><strong>Shifts their disposition one step</strong> — awe or fear, GM's call.</li>\n<li><strong>Adds a setback die to social checks with that community</strong> until the party addresses what they saw.</li>\n</ul>\n<h2>Morality</h2>\n<p>Run it as written, but land the aftermath of Conflict harder: there are no counselors, no Council, no one to tell a Force-sensitive what the nightmares mean — <strong>except whoever reached them first.</strong></p>"}, {"section": "reference", "id": "obligation", "title": "Obligation", "html": "<h1>Obligation, Reflavored</h1>\n<p><em>Roll or choose. Everyone takes one — it is a broke, indebted galaxy.</em></p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">d10</th>\n<th>Obligation</th>\n<th>The Ember Age version</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td><strong>Debt</strong></td>\n<td>Sector scrip or a Kajidic marker, ruinous interest</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td><strong>Family</strong></td>\n<td>You are an isolated homeworld's only link</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td><strong>Oath</strong></td>\n<td>To a dying archivist</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td><strong>Notice</strong></td>\n<td>An Admiralty conscription writ with your name on it</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">5</td>\n<td><strong>Secret</strong></td>\n<td>Someone knows you are Force-sensitive — or love someone who is</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">6</td>\n<td><strong>Obsession</strong></td>\n<td>One fragment you cannot let go</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">7</td>\n<td><strong>Responsibility</strong></td>\n<td>Refugees from a lane that died</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">8</td>\n<td><strong>Contract</strong></td>\n<td>The Lamplighters hold your ship's papers</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">9</td>\n<td><strong>Posted</strong></td>\n<td>A Guild bounty, still live, with your name on it</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">10</td>\n<td>Choose or invent</td>\n<td>Keep it era-true: debts, memory, and the people a dead lane stranded</td>\n</tr>\n</tbody>\n</table>\n<p>Run Obligation as written in the core rules (starting totals, triggers, strain effects at threshold). The reflavoring changes who comes knocking, not the math.</p>"}, {"section": "reference", "id": "character-creation", "title": "Character Creation", "html": "<h1>Character Creation</h1>\n<h2>The basics</h2>\n<ul>\n<li><strong>Standard starting XP.</strong> Any career from any of the three core books (Edge of the Empire, Age of Rebellion, Force and Destiny).</li>\n<li><strong>The crew shares one heirloom ship</strong> — a Wayfarer-class, or any YT or Ghtroc hull reflavored as a pre-Ruusan lane-runner, a century old and held together by devotion. See <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:ships\">Ships of the Ember Age</a>.</li>\n<li><strong>Everyone takes <a href=\"#\" class=\"xin\" data-nav=\"page:reference:obligation\">Obligation</a></strong> — it is a broke, indebted galaxy.</li>\n<li><strong>Force-sensitive PCs also track Morality.</strong></li>\n<li><strong>Duty waits until Act 3</strong>, when the party formally aligns with a founding vision. The three mechanics mirror the three acts: survival, then conscience, then cause.</li>\n</ul>\n<h2>Playing one of the Awakened</h2>\n<p>A Force-sensitive PC enters via the <strong>Force-Sensitive Exile</strong> or <strong>Force-Sensitive Emergent</strong> universal specializations, or <strong>any Force and Destiny career</strong>, at <strong>Force Rating 1 — with no living teacher.</strong></p>\n<p>Their growth runs through discovery, not tuition: see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:force\">The Force in the Ember Age</a>. Knowledge is treasure.</p>\n<h2>Wayfinder crew concepts</h2>\n<p>The party are <strong>wayfinders</strong> — scout-envoy-archaeologists reopening the galaxy one lane at a time. Any concept that answers \"why does this person reopen dead lanes?\" works: seekers, traders, diplomats, chartkeepers, salvage crews, interpreters (splintered Basic makes them load-bearing), couriers off the swoop circuit, and perhaps one of the newly Force-sensitive.</p>"}, {"section": "setting", "id": "home", "title": "The Ember Age", "html": "<h1>The Ember Age</h1>\n<p><em>A homebrew Star Wars campaign for FFG (Edge of the Empire / Age of Rebellion / Force and Destiny)</em></p>\n<blockquote>\n<p>Hope with rust on it.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th></th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>When</strong></td>\n<td>~910 BBY. In-world, the year <strong>90 AR</strong> — After Ruusan.</td>\n</tr>\n<tr>\n<td><strong>What</strong></td>\n<td>Ninety years after the Jedi and Sith annihilated each other at Ruusan, the galaxy has withered into ten thousand islands — and the war is passing out of human living memory. Now the Force is returning, the beacons are relighting, and what comes next has not been decided.</td>\n</tr>\n<tr>\n<td><strong>Who</strong></td>\n<td>The player characters are <strong>wayfinders</strong> — a crew of seekers, traders, diplomats, and perhaps one of the newly Force-sensitive — reopening the galaxy one lane at a time.</td>\n</tr>\n<tr>\n<td><strong>Tone</strong></td>\n<td>Hope with rust on it. Rebuilding and discovery. Light and dark finding a way forward together — or the old dogmas returning wearing new faces.</td>\n</tr>\n</tbody>\n</table>\n<p>The thesis of the era, and the line to say aloud at session zero:</p>\n<p><strong>Nobody broke the galaxy — everyone just stopped holding it up.</strong></p>\n<hr />\n<h2>Finding your way</h2>\n<ul>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:timeline\">The Withering</a></strong> — the ninety-year timeline from Ruusan to the relighting of Vesta-9.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:galaxy\">The Galaxy at 90 AR</a></strong> — travel, memory, salvage, and the two networks that never stopped running.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:factions\">Factions</a></strong> — six answers to \"what comes next,\" and two standing powers.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:awakening\">The Awakening</a></strong> — the Force is coming back, and nobody knows why.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:structure\">Campaign Structure</a></strong> — three acts: Reconnection, Convergence, the Founding.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:session-one\">Session One: \"The Light on Vesta-9\"</a></strong> — the cold open.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"tab:reference\">Mechanics</a></strong> — character creation, Obligation, Lore Fragments, beacon relighting, and the Force in the Ember Age.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:glossary\">Terms of the Era</a></strong> — the appendix glossary.</li>\n</ul>\n<div class=\"adm adm-warning\"><p class=\"adm-title\">GM material</p><p>This is the GM's reference. Parts I–IV and VI–VIII can be read aloud or shared as the table discovers them; everything under the <strong>GM</strong> tab (Part V, the NPC library, the trackers) never leaves your side of the screen.</p></div>\n\n<h2>About this campaign and canon</h2>\n<p>This campaign diverges from Legends canon nowhere at all. The record says the Republic and the Jedi Order endured from Ruusan to the prequel era — but records are written by recoveries, and institutions that outlive their crises remember themselves as unbroken. The thought bomb beheaded two institutions in an afternoon; that both were eventually refounded does not mean either was alive in between. The thousand years of peace the prequels remember includes these decades. The Bane novels remain true, and so does everything published after — this era is simply the chapter nobody wrote down.</p>\n<p><strong>Your table writes it.</strong></p>"}, {"section": "setting", "id": "timeline", "title": "The Withering (Timeline)", "html": "<h1>The Withering</h1>\n<p><em>Ninety years, decade by decade — how the galaxy went out like a lamp: not smashed, just left untended.</em></p>\n<div class=\"adm adm-quote\"><p class=\"adm-title\">The thesis of the era</p><p><strong>Nobody broke the galaxy — everyone just stopped holding it up.</strong></p></div>\n\n<h2>0 AR — Ruusan</h2>\n<p>Seven battles end the New Sith Wars. Lord Kaan's thought bomb consumes both armies, and a thousand light and dark spirits are bound together in what becomes the Valley of the Jedi. Most of the Jedi Order dies on that world. Publicly, the Sith are extinct. Secretly, Darth Bane walks away with one apprentice and a Rule: two, no more.</p>\n<h2>0–12 AR — The Reformation and the Adjournment</h2>\n<p>The Republic demilitarizes in relief, and grief curdles fast into blame: after a thousand years of Sith wars the graves do not distinguish which order dug them, and in the mouths of the bereaved, <em>Jedi</em> and <em>Sith</em> become one curse. What remains of the Order — the old, the healers, the librarians, those who were not at Ruusan — places itself under Senate oversight and tries to continue, and finds no one willing to fund it, house it, or hand it a child.</p>\n<p>In 12 AR, too few and too unwelcome to govern anything, the High Council votes to adjourn — <strong>itself, not the Order.</strong> No council can adjourn a covenant with the Force, and the Masters knew it; what they suspended was governance: admissions, ranks, rulings, the voice. The motion carries with one amendment, easy to miss in the minutes: <strong>any three Masters, met together in a temple, may call the Council back into session.</strong></p>\n<p>The Council's last act deeds the sealed temples and relics — property, never the calling — to the custodial order that becomes <a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">the Vigil</a>; the archives disperse for a safekeeping that becomes scattering. The survivors go where the anger is thinnest and do the only thing left: one master, one or two pupils, wherever a rare gifted child can be found and a family persuaded.</p>\n<p>The Order never ends. It thins to a handful of hidden lineages and loses its voice.</p>\n<h2>12–35 AR — The Long Exhale</h2>\n<p>The fleets are decommissioned faster than anything replaces them, and sector defense devolves to local squadrons. Around 20 AR, one admiral over the shipyard worlds of the Bastion cluster simply declines the recall order, citing piracy — and is quietly ignored. <a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">Her heirs never leave.</a></p>\n<h2>35–58 AR — The Quiet Ledger</h2>\n<p>No villain kills the HoloNet; appropriations committees do. Relay maintenance lapses sector by sector. Interstellar credit fractures into sector scrip. Long-haul trade privatizes, then localizes, then stops.</p>\n<h2>58–75 AR — The Drift and the Ebb</h2>\n<p>Rim delegations stop attending a Senate whose sessions cost more to reach than they are worth, and quorum becomes ceremony. Meanwhile Force-sensitive births thin to almost nothing — <strong>the Ebb</strong> — and the few children born with the gift are hidden by their own families, because the surest way to lose a child is to let the neighbors hear the word <em>Jedi</em>. The hidden lineages starve for pupils, and most of them snap. It takes a generation for anyone to notice the Ebb at all, because there is no longer an Order counting.</p>\n<h2>75–90 AR — The Dimming and the Awakening</h2>\n<p>The war generation begins to die. News travels by courier and arrives as rumor, and on ten thousand worlds the Jedi and Sith pass from testimony into story. Then, in the same years, the Ebb reverses: Force-sensitive children are born in rising numbers, the oldest of them now young adults. The galaxy is forgetting the Force at exactly the moment the Force remembers the galaxy.</p>\n<p>In 90 AR, hyperspace beacon <strong>Vesta-9</strong>, dark for sixty years, relights. Nobody admits to lighting it.</p>\n<h2>Living memory at 90 AR</h2>\n<p>For humans, Ruusan is now a childhood memory of the very old: the last people who watched the armies pass are in their nineties, and they are dying this decade. For longer-lived species the ledger is different — a Wookiee who fought there is barely middle-aged, a Duros merchant remembers the Republic solvent, a Hutt remembers it whole. Galactic memory is stratified by species, and humans are already mythologizing what a living eyewitness two docks over can flatly contradict.</p>\n<p>History here is not yet archaeology. <strong>It can still be interviewed — and the interviews disagree.</strong></p>\n<p><em>(At the table, that sentence is a mechanic: see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">Lore Fragments</a>.)</em></p>"}, {"section": "setting", "id": "galaxy", "title": "The Galaxy at 90 AR", "html": "<h1>The Galaxy at 90 AR</h1>\n<p><em>What daily life looks like ninety years into the Withering.</em></p>\n<h2>Travel is the defining fact of life</h2>\n<p>A handful of major lanes still run intermittently; minor routes have decayed past their nav data, and a <strong>rutter</strong> — an inherited, annotated route-log — is often worth more than the ship carrying it. Starships are heirlooms maintained by devotion, and the few shipyards that still function are strategic prizes worth wars.</p>\n<p>News moves by courier packet and arrives months old, already halfway to myth. The old geography has inverted in places: parts of the Core are hollow grandeur — marble senate halls with the power out — while some Rim worlds, forced into self-sufficiency early, have quietly thrived and see no reason to be \"reconnected.\"</p>\n<h2>The Force, remembered wrong</h2>\n<p>Most living beings have never seen the Force used, and where it is remembered at all, it is remembered as the thing that burned the old galaxy down. The grudge is generational — a ledger of war dead read out at funerals, with Jedi and Sith entered in the same column. Reactions to the gift run superstitious: awe, terror, and, under both, blame.</p>\n<p><em>(Mechanically, this is the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:force\">witness rule</a>: in this era the Force is not a skill; it is an event.)</em></p>\n<h2>The economy of leftovers</h2>\n<p>The Withering built its own institutions in the corners. Nothing new gets manufactured at scale, so the real economy is salvage: junk barons, chop-yards, and scavenger clans stripping the war's leftovers, with the best finds moving through <a href=\"#\" class=\"xin\" data-nav=\"page:setting:kajidics\">Kajidic</a> markets.</p>\n<p>Droids are heirlooms like everything else, and a pre-war droid with an unwiped memory core is a walking archive — which makes old droids quietly precious and occasionally hunted. Ninety years of isolation has splintered Basic into local creoles, so protocol droids and flesh-and-blood interpreters are load-bearing professions again.</p>\n<h2>The two networks that never stopped running</h2>\n<p>With the HoloNet dead, news moves through:</p>\n<ul>\n<li><strong>The cantina</strong> — where a good rumor is worth a drink minimum, and ships still change hands over sabacc.</li>\n<li><strong>The swoop circuit</strong> — whose racers carry mail, gossip, and contraband between systems. The season standings are the closest thing the galaxy has to a shared broadcast.</li>\n</ul>"}, {"section": "setting", "id": "awakening", "title": "The Awakening", "html": "<h1>The Awakening</h1>\n<p><em>The Force is coming back. Nobody knows why. Nobody is ready.</em></p>\n<p>For two generations almost no one was born with the gift; for the last twenty years the births have been rising, and no one knows why. The signs are consistent:</p>\n<ul>\n<li><strong>True dreams.</strong></li>\n<li><strong>The hearth-sense</strong> — reading a room's feeling like weather.</li>\n<li><strong>Small luck that bends.</strong></li>\n</ul>\n<p>There are no schools, no Council, no temple that will take them — at most, rumor of a hidden lineage or two out in the deep systems, not advertising. What there is instead is a galaxy with a generational grudge: households that buried sons over the orders' last war now watch the neighbor's daughter bend luck, and respond with worship, exile, or drowning-fear.</p>\n<h2>What the factions want with the children</h2>\n<table>\n<thead>\n<tr>\n<th>Faction</th>\n<th>Wants them as</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:republic\">The Provisional Republic</a></td>\n<td>A census</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">The Admiralty</a></td>\n<td>Assets</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">The Vigil</a></td>\n<td>Wards — custody</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:inheritors\">The Inheritors</a></td>\n<td>Apprentices</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">The Lamplighters</a></td>\n<td>Navigators — quietly. A child who dreams true can feel a dead lane the way old pilots claim to</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:kajidics\">The Kajidics</a></td>\n<td>Merchandise</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:mandalorians\">The Mandalorian Clans</a></td>\n<td>Nothing — they simply adopt them. A foundling who bends luck is just a promising warrior</td>\n</tr>\n</tbody>\n</table>\n<h2>The vacuum the Adjournment left</h2>\n<p>With the Council out of session, no one alive can admit one of them to the Jedi Order — <strong>and no one has standing to deny them either.</strong> The day one of them stands up and says the word aloud, the only body that could rule on the claim is the one it takes three Masters to reconvene.</p>\n<h2>Immi</h2>\n<p>A Force-sensitive player character is fully supported (see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:character-creation\">Character Creation</a>). Either way, keep one in the party's orbit: <strong>Immi Ozha</strong>, twelve, a stowaway who turns up in the crew's hold in <a href=\"#\" class=\"xin\" data-nav=\"page:setting:session-one\">session one</a>, dreaming loudly of a canyon full of light she has never seen.</p>"}, {"section": "setting", "id": "glossary", "title": "Terms of the Era", "html": "<h1>Terms of the Era</h1>\n<p><em>The appendix glossary — the words everyone at the table should end up using without thinking.</em></p>\n<table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>AR</strong></td>\n<td>After Ruusan, the common calendar</td>\n</tr>\n<tr>\n<td><strong>the Withering</strong></td>\n<td>The long decline</td>\n</tr>\n<tr>\n<td><strong>the Ebb / the Awakening</strong></td>\n<td>The Force's fall and return</td>\n</tr>\n<tr>\n<td><strong>wayfinder</strong></td>\n<td>Scout-envoy-archaeologist; the party</td>\n</tr>\n<tr>\n<td><strong>rutter</strong></td>\n<td>An inherited, annotated route-log</td>\n</tr>\n<tr>\n<td><strong>scrip</strong></td>\n<td>Sector currency</td>\n</tr>\n<tr>\n<td><strong>first-lighting</strong></td>\n<td>Fee and honor for reopening a beacon</td>\n</tr>\n<tr>\n<td><strong>the Adjournment</strong></td>\n<td>The High Council's vote to suspend itself sine die, 12 AR — the Order itself was never adjourned</td>\n</tr>\n<tr>\n<td><strong>the Bastion Worlds</strong></td>\n<td>The shipyard cluster the Admiralty governs</td>\n</tr>\n<tr>\n<td><strong>the black lanes</strong></td>\n<td>The unregistered routes that never went dark</td>\n</tr>\n<tr>\n<td><strong>a posting</strong></td>\n<td>A Guild bounty, the one writ that still travels</td>\n</tr>\n<tr>\n<td><strong>the Quiet</strong></td>\n<td>Deep-rim slang for dead space</td>\n</tr>\n</tbody>\n</table>"}, {"section": "setting", "id": "factions", "title": "Factions Overview", "html": "<h1>Factions</h1>\n<p>Six answers to the question <strong>\"what comes next,\"</strong> then two standing powers not in the race but impossible to ignore. Each entry: who they are, what they want, what they offer a wayfinder crew, and the crack running through them.</p>\n<h2>The six answers</h2>\n<table>\n<thead>\n<tr>\n<th>Faction</th>\n<th>What comes next</th>\n<th>Offers the crew</th>\n<th>The crack</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:republic\">The Provisional Republic</a></td>\n<td>Continuity — the old flag restored</td>\n<td>Accreditation, archive access, moral cover</td>\n<td>Custodians of the idea, terrified of being tested</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">The Admiralty</a></td>\n<td>Naval protection — which is to say control</td>\n<td>Escort, fuel, repair, genuine safety</td>\n<td>Their founding story requires an enemy</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">The Vigil</a></td>\n<td>Veneration without practice, forever</td>\n<td>Sanctuary, authentication, sealed places</td>\n<td>The newly Force-sensitive split them in half</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:inheritors\">The Inheritors</a></td>\n<td>A monopoly on the returning Force</td>\n<td>Real training, when no one else can teach</td>\n<td>They don't know whose hand is at the top</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">The Lamplighters</a></td>\n<td>The network relit — in the order they choose</td>\n<td>Charters, salvage rights, first-lighting fees</td>\n<td>Whoever sets the order decides the century</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:kajidics\">The Kajidics</a></td>\n<td>Nothing, thank you — scarcity is margin</td>\n<td>Fuel, parts, black-lane rutters, no questions</td>\n<td>The young Hutts have run the numbers</td>\n</tr>\n</tbody>\n</table>\n<h2>The two standing powers</h2>\n<table>\n<thead>\n<tr>\n<th>Power</th>\n<th>Position</th>\n<th>To the crew</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:guild\">The Bounty Hunters' Guild</a></td>\n<td>The posting is the one writ that still travels</td>\n<td>Employer, threat, and the only enforcement a promise has</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:mandalorians\">The Mandalorian Clans</a></td>\n<td>War is work; foundlings are foundlings</td>\n<td>The finest soldiers alive, and everyone's contingency plan</td>\n</tr>\n</tbody>\n</table>"}, {"section": "setting", "id": "republic", "title": "The Provisional Republic", "html": "<h1>The Provisional Republic</h1>\n<p><em>The rump Senate and its Archive bureaus, ninety years into an interregnum they still call temporary.</em></p>\n<h2>Who they are</h2>\n<p>They hold unmatched legitimacy, unmatched documentation, a handful of long-lived senators who personally remember the Republic whole — and a writ that ends at the atmosphere.</p>\n<h2>What they want</h2>\n<p>Every relit beacon registered under Republic charter, restoring the galaxy as a matter of continuity rather than conquest.</p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>Letters of accreditation.</strong></li>\n<li><strong>Archive access</strong> — the richest source of <strong>Civic</strong> <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a>.</li>\n<li><strong>The moral cover of the old flag.</strong></li>\n</ul>\n<h2>The crack</h2>\n<p>Ninety years of \"provisional\" has bred leaders who prefer custodianship of the idea to the risk of actually governing — the institution has learned to survive by never being tested.</p>"}, {"section": "setting", "id": "admiralty", "title": "The Admiralty", "html": "<h1>The Admiralty</h1>\n<p><em>The government of the Bastion Worlds — the last power with working capital ships.</em></p>\n<h2>Who they are</h2>\n<p>The shipyard cluster where the fleet that refused the demobilization order dropped anchor and never left. A stratocracy built by that squadron — its current Lady Admiral is the granddaughter of the woman who said no — grown into the last power with working capital ships.</p>\n<p>The distinction matters on the ground: <strong>Bastioners</strong> are fiercely proud of their worlds and considerably less fond of the uniforms that run them, and the Admiralty works hard to keep outsiders from seeing the difference.</p>\n<h2>What they want</h2>\n<p>The relit lanes placed under naval protection — which is to say under naval control. And they conscript.</p>\n<h2>What they offer a wayfinder crew</h2>\n<p>What no one else can: <strong>escort, fuel, repair, genuine safety.</strong> Their pitch lands because it is half true: the Republic's weakness invited the wars.</p>\n<h2>The crack</h2>\n<p>Their founding story requires an enemy, and if the Sith do not return, some of their officers will need them to.</p>"}, {"section": "setting", "id": "vigil", "title": "The Vigil", "html": "<h1>The Vigil</h1>\n<p><em>Keepers of everything the old orders left behind — and the standing peace terms with the bereaved.</em></p>\n<h2>Who they are</h2>\n<p>Founded by Ruusan's grave-tenders and the Jedi Order's lay custodians, deeded the sealed temples and relics by the Council's last act — <strong>custody of property, though nothing in the minutes grants them custody of the calling.</strong> An angry galaxy tolerates them precisely because they keep it all locked away; their doctrine is not only theology, it is the standing peace terms with the bereaved.</p>\n<p>Their founding generation — the last people who actually knew Jedi — is dying, and doctrine is hardening exactly as fast as memory fails.</p>\n<h2>What they want</h2>\n<p>They gather relics, authenticate artifacts, tend the Valley of the Jedi — and forbid, absolutely, the use of any of it. <strong>Veneration without practice</strong>, so that the fire can never spread again.</p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>Sanctuary.</strong></li>\n<li><strong>Authentication</strong> of artifacts and <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a>.</li>\n<li><strong>Access to sealed places</strong> no one else may enter.</li>\n</ul>\n<h2>The crack</h2>\n<p>The newly Force-sensitive: half the order sees sacrilege walking around in children's bodies, and half sees the Order reborn and weeps. That argument will not stay doctrinal forever.</p>\n<p>And beneath it sits the deed itself: their authority covers stone and relic, not flesh — a distinction somebody is eventually going to read aloud.</p>"}, {"section": "setting", "id": "inheritors", "title": "The Inheritors", "html": "<h1>The Inheritors</h1>\n<p><em>A patient whisper-network selling the era's most dangerous currency: answers.</em></p>\n<h2>Who they are</h2>\n<p>Founded by the Brotherhood's surviving quartermasters, collaborators, and camp-followers — some of them still alive — the network has spent three generations quietly hoarding Sith lore, and, lately, arriving first on the doorsteps of frightened Force-sensitive families with answers, flattery, and coin.</p>\n<h2>What they want</h2>\n<p>A monopoly on the returning Force.</p>\n<h2>What they offer a wayfinder crew</h2>\n<p>The era's most dangerous currency: <strong>real training, when no one else alive can teach.</strong></p>\n<h2>The crack</h2>\n<p>Even senior Inheritors are not sure whose hand is at the top of their own organization — whether they serve a living tradition or are merely wearing its costume.</p>\n<p><em>(The GM knows the answer.)</em></p>"}, {"section": "setting", "id": "lamplighters", "title": "The Lamplighters", "html": "<h1>The Lamplighters</h1>\n<p><em>The beacon-tenders' guild — nominally neutral, universally necessary.</em></p>\n<h2>Who they are</h2>\n<p>Chartkeepers, rutter-brokers, and lane-runners who never stopped maintaining what could be maintained. The natural patron for a wayfinder crew.</p>\n<h2>What they want</h2>\n<p>The network relit — <strong><em>in the order they choose.</em></strong></p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>Charters.</strong></li>\n<li><strong>Salvage rights.</strong></li>\n<li><strong>First-lighting fees</strong> for every beacon reopened (see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:beacon-relighting\">Relighting a Beacon</a>).</li>\n</ul>\n<h2>The crack</h2>\n<p>Whoever sets the relighting order decides which worlds matter for the next century. The Grandmaster of Charts knows this, every faction knows she knows, and her neutrality is not unpurchasable — the price is merely very high.</p>"}, {"section": "setting", "id": "kajidics", "title": "The Kajidics", "html": "<h1>The Kajidics</h1>\n<p><em>The Hutt clan-corporations — the one interstellar institution the Withering made stronger.</em></p>\n<h2>Who they are</h2>\n<p>They never needed the Republic; <strong>scarcity is margin.</strong> They run the black lanes (the unregistered routes that never went dark), the fuel and scrap monopolies, and the protection rackets that pass for civic order on a hundred worlds.</p>\n<h2>What they want</h2>\n<p>Their answer to \"what comes next\" is <em>nothing, thank you</em> — they will be paid to keep it that way, because every relit beacon on a route they do not control is competition.</p>\n<h2>What they offer a wayfinder crew</h2>\n<p>What no charter can:</p>\n<ul>\n<li><strong>Fuel and parts.</strong></li>\n<li><strong>Black-lane rutters.</strong></li>\n<li><strong>Cash work with no questions attached.</strong></li>\n</ul>\n<h2>The crack</h2>\n<p>Generational: the young Hutts have run the numbers and think a rebuilt galaxy pays better than scarcity rents ever will, and a clan war over that spreadsheet is one bad season away.</p>"}, {"section": "setting", "id": "guild", "title": "The Bounty Hunters' Guild", "html": "<h1>The Bounty Hunters' Guild</h1>\n<p><em>A standing power — the closest thing the galaxy has to interstellar law.</em></p>\n<h2>Who they are</h2>\n<p>When the courts stopped reaching across systems, one writ kept traveling: <strong>the posting.</strong> The Guild honors any bounty whose bond clears — governments, Kajidics, grieving families, it does not care — and its code (<em>deliver as posted, no poaching, the posting is sacred</em>) has made it, absurdly, the closest thing the galaxy has to interstellar law.</p>\n<p>Worlds too small for judges hire hunters as <strong>circuit arbiters</strong>.</p>\n<h2>The dark side of the code</h2>\n<p>Postings outlive their posters, and Guild purists still honor bounties filed by governments that no longer exist.</p>\n<h2>To a wayfinder crew</h2>\n<p>The Guild is employer, threat, and occasionally the only enforcement a promise has.</p>"}, {"section": "setting", "id": "mandalorians", "title": "The Mandalorian Clans", "html": "<h1>The Mandalorian Clans</h1>\n<p><em>A standing power — the one people who never demobilized.</em></p>\n<h2>Who they are</h2>\n<p>Rebuilt under a Mandalore into clan companies that hire out to anyone whose bond clears — which, in a disarmed galaxy, makes them the finest soldiers alive and everyone's contingency plan. They remember the wars differently than everyone else: <strong>as work.</strong></p>\n<h2>On the Awakening</h2>\n<p>They hold the era's strangest position, which is no position at all — the clans take foundlings from every ruin they are paid to make or guard, and a foundling who bends luck is simply a promising warrior.</p>\n<p><strong>Nobody is watching the one culture that neither fears the gifted nor wants to own them.</strong></p>"}, {"section": "setting", "id": "structure", "title": "Campaign Structure", "html": "<h1>Campaign Structure</h1>\n<p>Three acts. Three mechanics. Three questions.</p>\n<table>\n<thead>\n<tr>\n<th>Act</th>\n<th>Sessions</th>\n<th>Shape</th>\n<th>Core mechanic</th>\n<th>The question</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1 — Reconnection</a></td>\n<td>~1–8</td>\n<td>Episodic</td>\n<td><strong>Obligation</strong> (survival)</td>\n<td>What did the galaxy become while nobody was looking?</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-2\">Act 2 — Convergence</a></td>\n<td>~9–16</td>\n<td>Hinge events, any order</td>\n<td><strong>Morality</strong> (conscience)</td>\n<td>Every government has a policy now — what's yours?</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-3\">Act 3 — The Founding</a></td>\n<td>~17–20+</td>\n<td>Two summits and one canyon</td>\n<td><strong>Duty</strong> (cause)</td>\n<td>What comes next — and who decides?</td>\n</tr>\n</tbody>\n</table>\n<div class=\"adm adm-tip\"><p class=\"adm-title\">Players discover this as they play</p><p>The act summaries below are shareable as the table reaches them. The GM's private notes live elsewhere.</p></div>\n\n<p>Start here: <a href=\"#\" class=\"xin\" data-nav=\"page:setting:session-one\">Session One — \"The Light on Vesta-9\"</a>. Track play in the <a href=\"#\" class=\"xin\" data-nav=\"tab:log\">Session Log</a>.</p>"}, {"section": "setting", "id": "act-1", "title": "Act 1 — Reconnection"
