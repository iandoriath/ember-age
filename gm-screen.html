able, that sentence is a mechanic: see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">Lore Fragments</a>.)</em></p>"}, {"section": "setting", "id": "galaxy", "title": "The Galaxy at 90 AR", "html": "<h1>The Galaxy at 90 AR</h1>\n<p><em>What daily life looks like ninety years into the Withering.</em></p>\n<h2>Travel is the defining fact of life</h2>\n<p>A handful of major lanes still run intermittently; minor routes have decayed past their nav data, and a <strong>rutter</strong> — an inherited, annotated route-log — is often worth more than the ship carrying it. Starships are heirlooms maintained by devotion, and the few shipyards that still function are strategic prizes worth wars.</p>\n<p>News moves by courier packet and arrives months old, already halfway to myth. The geography has split in two: the Core recovered — a working Senate, a Temple, lanes that run on schedule — and then stopped, at the line where the relays did. Out past it the Withering is the only weather, and some Rim worlds, forced into self-sufficiency early, have quietly thrived and see no reason to be \"reconnected.\"</p>\n<h2>The Force, remembered wrong</h2>\n<p>In the Core the Jedi are an institution: the Chancellor's peacekeepers, a Temple that sends for your gifted child at three, a word in the newsfeeds. Out here no one has seen a Jedi in a lifetime, and where the Force is remembered at all, it is remembered as the thing that burned the old galaxy down — the Reach was Sith country, and the principalities told their subjects for a century who the invaders were. The grudge is generational — a ledger of war dead read out at funerals, with Jedi and Sith entered in the same column. Reactions to the gift run superstitious: awe, terror, and, under both, blame.</p>\n<p><em>(Mechanically, this is the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:force\">witness rule</a>: in this era the Force is not a skill; it is an event.)</em></p>\n<h2>The economy of leftovers</h2>\n<p>The Withering built its own institutions in the corners. Nothing new gets manufactured at scale, so the real economy is salvage: junk barons, chop-yards, and scavenger clans stripping the war's leftovers, with the best finds moving through <a href=\"#\" class=\"xin\" data-nav=\"page:setting:kajidics\">Kajidic</a> markets.</p>\n<p>Droids are heirlooms like everything else, and a pre-war droid with an unwiped memory core is a walking archive — which makes old droids quietly precious and occasionally hunted. Ninety years of isolation has splintered Basic into local creoles, so protocol droids and flesh-and-blood interpreters are load-bearing professions again.</p>\n<h2>The two networks that never stopped running</h2>\n<p>With the HoloNet dead, news moves through:</p>\n<ul>\n<li><strong>The cantina</strong> — where a good rumor is worth a drink minimum, and ships still change hands over sabacc.</li>\n<li><strong>The swoop circuit</strong> — whose racers carry mail, gossip, and contraband between systems. The season standings are the closest thing the galaxy has to a shared broadcast.</li>\n</ul>"}, {"section": "setting", "id": "awakening", "title": "The Awakening", "html": "<h1>The Awakening</h1>\n<p><em>The Force is coming back. Nobody knows why. The Temple thinks it is ready.</em></p>\n<p>For two generations almost no one was born with the gift; for the last twenty years the births have been rising, and no one knows why. The signs are consistent:</p>\n<ul>\n<li><strong>True dreams.</strong></li>\n<li><strong>The hearth-sense</strong> — reading a room's feeling like weather.</li>\n<li><strong>Small luck that bends.</strong></li>\n</ul>\n<p>In the Core there is an answer for it: the <strong>Temple</strong> on Coruscant, which has been finding gifted children and raising them since the Reformation, and whose creches are fuller this decade than in living memory. Out here there is nothing — no school, no Council that has ever heard of this sector, at most a rumor of a withdrawn Jedi or two in the deep systems, not advertising — and a galaxy with a generational grudge: households that buried sons over the orders' last war now watch the neighbor's daughter bend luck, and respond with worship, exile, or drowning-fear.</p>\n<h2>The ask</h2>\n<p>The Republic's charter ships carry a Jedi, and the Jedi carries the Temple's rule: <em>send us your gifted children.</em> Young — three, four, five — and to Coruscant, and not back. The Reach hears that sentence through a century of principality propaganda and its own war dead, and what it hears is the invader, the child-taker, and, faintly, the old liberator. Every relit beacon makes the ask reachable for another world. Every answer is a scene.</p>\n<p>And the Temple has no rule for an adult. A twenty-year-old who dreams true is, by doctrine, too old to train and too dangerous to ignore — so the Order watches, which the watched can feel.</p>\n<h2>Three parties are counting</h2>\n<table>\n<thead>\n<tr>\n<th>Who</th>\n<th>Wants the gifted as</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:jedi\">The Jedi Order</a></td>\n<td><strong>Initiates</strong> — the young ones, for the Temple; the rest, watched</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:republic\">The Republic</a></td>\n<td>A census — and the Temple's quota met, as a condition of the charter</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">The Admiralty</a></td>\n<td>Assets</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">The Vigil</a></td>\n<td>Wards — custody, and kept <em>here</em></td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:inheritors\">The Inheritors</a></td>\n<td>Apprentices</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">The Lamplighters</a></td>\n<td>Navigators — quietly. A child who dreams true can feel a dead lane the way old pilots claim to</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:kajidics\">The Kajidics</a></td>\n<td>Merchandise</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:mandalorians\">The Mandalorian Clans</a></td>\n<td>Nothing — they simply adopt them. A foundling who bends luck is just a promising warrior</td>\n</tr>\n</tbody>\n</table>\n<p><em>(GM: there is a fourth count, and it is the oldest — see Dial 1.)</em></p>\n<h2>The question under the question</h2>\n<p>The Jedi of 90 AR are peacekeepers — the Chancellor's, answerable to a Senate, forbidden the war that made them, raising children to keep a peace the Rim never got. Is that what the Force is about? The Temple says yes. The withdrawn Jedi who never left the Rim say something else. The Awakened at your table will be asked to choose, by people who each think the choice is obvious.</p>\n<h2>The Awakening sits at your table</h2>\n<p>This is not a backdrop: one or more of the player characters carries the gift (see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:character-creation\">Character Creation</a>). Every policy in the table above is aimed at somebody's character sheet — the census, the assets, the custody, the apprenticeship, the navigator's articles, the Temple's watching. The party doesn't watch the Awakening happen to the galaxy. The galaxy watches it happen to the party, starting the moment <a href=\"#\" class=\"xin\" data-nav=\"page:setting:session-one\">a sixty-years-dead beacon chooses one of their pulses to keep time with</a>.</p>"}, {"section": "setting", "id": "glossary", "title": "Terms of the Era", "html": "<h1>Terms of the Era</h1>\n<p><em>The appendix glossary — the words everyone at the table should end up using without thinking.</em></p>\n<table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>AR</strong></td>\n<td>After Ruusan, the common calendar</td>\n</tr>\n<tr>\n<td><strong>the Withering</strong></td>\n<td>The long decline</td>\n</tr>\n<tr>\n<td><strong>the Ebb / the Awakening</strong></td>\n<td>The Force's fall and return</td>\n</tr>\n<tr>\n<td><strong>wayfinder</strong></td>\n<td>Scout-envoy-archaeologist; the party</td>\n</tr>\n<tr>\n<td><strong>rutter</strong></td>\n<td>An inherited, annotated route-log</td>\n</tr>\n<tr>\n<td><strong>scrip</strong></td>\n<td>Sector currency</td>\n</tr>\n<tr>\n<td><strong>first-lighting</strong></td>\n<td>Fee and honor for reopening a beacon</td>\n</tr>\n<tr>\n<td><strong>the Adjournment</strong></td>\n<td>The Senate's vote of 12 AR suspending the withered sectors' seats, charters and obligations sine die — the Rim was adjourned, not the Republic; the Order withdrew with it</td>\n</tr>\n<tr>\n<td><strong>the Temple</strong></td>\n<td>The Jedi Order's one house, on Coruscant — where the gifted are sent, young, and not sent back</td>\n</tr>\n<tr>\n<td><strong>the withdrawn</strong></td>\n<td>The Temple's word for the Jedi who refused the recall and stayed in the Rim. They call themselves Jedi</td>\n</tr>\n<tr>\n<td><strong>the Bastion Worlds</strong></td>\n<td>The shipyard cluster the Admiralty governs</td>\n</tr>\n<tr>\n<td><strong>the black lanes</strong></td>\n<td>The unregistered routes that never went dark</td>\n</tr>\n<tr>\n<td><strong>a posting</strong></td>\n<td>A Guild bounty, the one writ that still travels</td>\n</tr>\n<tr>\n<td><strong>the Quiet</strong></td>\n<td>Deep-rim slang for dead space</td>\n</tr>\n<tr>\n<td><strong>the Grumani Reach</strong></td>\n<td>Spacer slang for the withered interior of the Grumani sector — the campaign's home pocket</td>\n</tr>\n<tr>\n<td><strong>the Run</strong></td>\n<td>The Duros Space Run, the dead lane the crew is relighting hop by hop back toward the Hydian Way</td>\n</tr>\n</tbody>\n</table>"}, {"section": "setting", "id": "geography", "title": "The Road Back to the Hydian", "html": "<h1>The Road Back to the Hydian</h1>\n<p><em>Where the campaign happens: real charts, dead lanes. Player-safe — this is the geography any spacer at Okrent's Drift could sketch on a napkin.</em></p>\n<h2>The pocket: the Grumani Reach</h2>\n<p>The crew starts in the withered interior of the <strong>Grumani sector</strong>, Outer Rim — spacers call it <strong>the Grumani Reach</strong>. A century ago this was Sith country: during the Republic Dark Age the sector shattered into warlord principalities — the Daimanate, the Bactranate, the Arkadianate, the Dyarchy — and the last war burned through it on the way to Ruusan. The Republic's recovery never reached this far back out. The principalities are dust; their worlds are still here, grown strange in the dark.</p>\n<h2>The lane home: the Duros Space Run</h2>\n<p>One real lane threads the Reach: the <strong>Duros Space Run</strong>, which once carried trade from the Mid Rim all the way to the <strong>Hydian Way</strong> at <strong>Darkknell</strong>. Its Mid Rim end still trickles — <strong>Churba / New Cov</strong> (where it meets the Corellian Run), <strong>Kalarba</strong>, <strong>Glom Tho</strong>, <strong>Triffis</strong> — and that's the \"living lane\" whose frayed end the crew is grounded on at Bannistar. Everything beyond is beacon-dark.</p>\n<p><strong>The chain — one relit beacon per hop:</strong></p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">#</th>\n<th>System</th>\n<th>What's there at 90 AR</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">⌂</td>\n<td><strong>Bannistar Station</strong></td>\n<td>The great fuel gantries, and <strong>Okrent's Drift</strong> — the port that grew on their back. Campaign start; the frayed end of the living Run</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td><strong>Enarc</strong></td>\n<td>A dark crossroads: the <strong>Enarc Run</strong> (toward Naboo and the Rimma) and the Hutt-ringed <strong>Triellus</strong> both once met the Run here</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td><strong>Alui</strong></td>\n<td>First of the deep-Reach worlds</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td><strong>Verdanth</strong></td>\n<td>Jungle world</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td><strong>Aplooine</strong></td>\n<td>Quiet agrarian survivor</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">5</td>\n<td><strong>Sanrafsix</strong></td>\n<td>The great dead hub — its bazaars thrived on the last war's economy and died with it. Junction of the smugglers' <strong>Sanrafsix Corridor</strong></td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">6</td>\n<td><strong>Heptooine</strong></td>\n<td>The Run's last waystop</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">7</td>\n<td><strong>Jutrand</strong></td>\n<td>City-planet; capital of a dead Sith principality, haunted by its own grandeur</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">★</td>\n<td><strong>Darkknell</strong></td>\n<td>The lights come back on: a trinary-sun trade city that never stopped, the Hydian Way's local anchor</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">★★</td>\n<td><strong>Eriadu</strong></td>\n<td>One Hydian hop south: the junction of the <strong>Hydian Way</strong> and the <strong>Rimma Trade Route</strong>. See below</td>\n</tr>\n</tbody>\n</table>\n<p>Side-lanes off the chain, for side arcs and episode worlds: the <strong>Sanrafsix Corridor</strong> (Fostin Nine, Syned, Omwat — a notorious smugglers' road), the <strong>Enarc Run</strong>, and the dead local spurs into old principality space (Chelloa, Byllura, Aquilaris, Gazzari).</p>\n<h2>The prize: Eriadu</h2>\n<p>At the far end of the chain, where the Run meets the living galaxy, sits <strong>Eriadu</strong> — an old, modest world best known for delicate shellwork jewelry, which happens to occupy the most valuable crossroads in the southern Rim: the Hydian Way crossed the Rimma Trade Route, plus the minor <strong>Lipsec Run</strong>. Every faction can read a chart. Whoever holds the relit corridor when Eriadu wakes up owns the front door of the next century — and there are already rumors of coreward money, old families from Corulag, taking an interest in the place.</p>\n<h2>Why the lanes are dark: the two darkenings</h2>\n<p>The Reach's beacons died <strong>twice</strong>, and the distinction matters to anyone reading old rutters:</p>\n<ol>\n<li><strong>The first darkening (before Ruusan).</strong> In the depths of the Dark Age, the old Republic — bankrupt and losing — <em>deliberately shut down</em> its hyperspace relays beyond the Core, to deny the Sith the network. Thousands of systems went dark by policy. Out here, most beacons never came back: the oldest rutter pages describe lanes no living pilot has run.</li>\n<li><strong>The second darkening (the Withering).</strong> After Ruusan the recovery relit beacons Core-outward — slowly, and only so far. Vesta-9's sixty dark years date from this lapse: it was revived in the early Reformation and abandoned again when the appropriations stopped. The Withering is not the war's darkness; it is the recovery giving up.</li>\n</ol>\n<h2>The far road: toward the Valley</h2>\n<p>Every child knows the armies reached <strong>Ruusan</strong> seven times, so the road exists: up the <strong>Hydian Way</strong> the entire way coreward — Darkknell, Malastare (itself a raw colony barely older than the Withering), Denon — to <strong>Brentaal</strong>, where the Hydian crosses the <strong>Perlemian Trade Route</strong>; rimward down the Perlemian to <strong>Lantillies</strong>; then the <strong>Randon Run</strong> past <strong>Kashyyyk</strong> — and off the charts, into the Teraab stellar nursery, where the nebulae themselves have been quietly eating the last lanes to Ruusan ever since the war ended.</p>\n<p>The crew is relighting beacons at one end of that road. The Valley is at the other.</p>"}, {"section": "setting", "id": "factions", "title": "Factions Overview", "html": "<h1>Factions</h1>\n<p>Seven answers to the question <strong>\"what comes next,\"</strong> then two standing powers not in the race but impossible to ignore. Each entry: who they are, what they want, what they offer a wayfinder crew, and the crack running through them.</p>\n<h2>The seven answers</h2>\n<table>\n<thead>\n<tr>\n<th>Faction</th>\n<th>What comes next</th>\n<th>Offers the crew</th>\n<th>The crack</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:republic\">The Republic</a></td>\n<td>Reconnection — the adjourned Rim re-chartered on Coruscant's terms</td>\n<td>Accreditation, archive access, the flag</td>\n<td>It recovered by adjourning the Rim, and would rather nobody read the minutes</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:jedi\">The Jedi Order</a></td>\n<td>The Temple's peace — and the Rim's gifted children, sent young</td>\n<td>A Jedi's word, training for the very young, authentication</td>\n<td>Peacekeepers now; is that what the Force is about?</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">The Admiralty</a></td>\n<td>Naval protection — which is to say control</td>\n<td>Escort, fuel, repair, genuine safety</td>\n<td>Their founding story requires an enemy</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">The Vigil</a></td>\n<td>Veneration without practice, forever</td>\n<td>Sanctuary, authentication, sealed places</td>\n<td>The newly Force-sensitive split them in half; the Order's return splits them again</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:inheritors\">The Inheritors</a></td>\n<td>A monopoly on the returning Force</td>\n<td>Real training, when no one else can teach</td>\n<td>They don't know whose hand is at the top</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">The Lamplighters</a></td>\n<td>The network relit — in the order they choose</td>\n<td>Charters, salvage rights, first-lighting fees</td>\n<td>Whoever sets the order decides the century</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:kajidics\">The Kajidics</a></td>\n<td>Nothing, thank you — scarcity is margin</td>\n<td>Fuel, parts, black-lane rutters, no questions</td>\n<td>The young Hutts have run the numbers</td>\n</tr>\n</tbody>\n</table>\n<h2>The two standing powers</h2>\n<table>\n<thead>\n<tr>\n<th>Power</th>\n<th>Position</th>\n<th>To the crew</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:guild\">The Bounty Hunters' Guild</a></td>\n<td>The posting is the one writ that still travels</td>\n<td>Employer, threat, and the only enforcement a promise has</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:mandalorians\">The Mandalorian Clans</a></td>\n<td>War is work; foundlings are foundlings</td>\n<td>The finest soldiers alive, and everyone's contingency plan</td>\n</tr>\n</tbody>\n</table>"}, {"section": "setting", "id": "republic", "title": "The Republic", "html": "<h1>The Republic</h1>\n<p><em>Recovered, solvent, and sure of itself — a thousand lanes away.</em></p>\n<h2>Who they are</h2>\n<p>The Galactic Republic of the Reformation: a working Senate on Coruscant, a Chancellor with Jedi peacekeepers at his call, no army by law, and a writ that has stopped, for eighty years, exactly where the relays did. It does not think of itself as provisional. It thinks of itself as <em>recovered</em> — and it recovered by adjourning the Rim.</p>\n<p>Out here it arrives as charter ships: an envoy-archivist, a cargo of forms, a Jedi, and the quiet assumption that the Reach has been waiting.</p>\n<h2>What they want</h2>\n<p>Every relit beacon registered under Republic charter, the adjourned seats restored on the Senate's terms, and the Temple's quota met: the gifted children of the reconnected worlds, found and sent. Continuity, not conquest — which, to a world that was adjourned without being asked, can look like the same thing.</p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>Letters of accreditation</strong> — and with them, lanes that are suddenly legal.</li>\n<li><strong>Archive access</strong> — the richest source of <strong>Civic</strong> <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a>, and the only record of the Adjournment's minutes.</li>\n<li><strong>The flag</strong> — moral cover that still means something, two hops from anywhere that remembers it.</li>\n</ul>\n<h2>The crack</h2>\n<p>A Republic that rebuilt itself without an army and without the Rim now wants the Rim back, and has only two instruments to take it with: paperwork, and the Jedi. Every charter it signs out here is an admission that the Adjournment was a choice. The senators who remember making it are very old, and very anxious that the Rim not read the minutes.</p>"}, {"section": "setting", "id": "jedi", "title": "The Jedi Order", "html": "<h1>The Jedi Order</h1>\n<p><em>The Temple's peacekeepers — rare, reformed, and a century absent from the Reach.</em></p>\n<h2>Who they are</h2>\n<p>The Order the Reformation made: no Lords, no armies, one Temple on Coruscant, and a doctrine written in grief. The Jedi of 90 AR are found young, taken from their families, raised without attachment, and sworn to a peace they keep on the Chancellor's behalf — investigators, mediators, the Senate's conscience with a lightsaber. There are fewer of them than there are sectors. They believe the Sith extinct, and they are the reason the Sith are careful.</p>\n<p>They have not been in the Grumani Reach since the Adjournment. The last Jedi anyone here remembers were Knight Errant–era warriors fighting Sith Lords through these systems — and the principalities spent the century after telling their subjects who the invaders had been.</p>\n<h2>What they want</h2>\n<p>The gifted children of the reconnected Rim, found early and sent to the Temple. The sealed temples reopened under the Council's authority. And no Jedi in the Rim who answer to no Council — the withdrawn are, to Coruscant, a doctrinal problem that has gone unsupervised for eighty years.</p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>A Jedi's word</strong>, which out here is the only Republic writ that can't be forged.</li>\n<li><strong>Training</strong> — for the very young. For an adult who bends luck, they offer watching.</li>\n<li><strong>Authentication</strong> of Jedi relics and the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a> that carry the Jedi tag — the Temple's archive is the one that was never scattered.</li>\n<li><strong>Protection</strong> from things they do not believe exist.</li>\n</ul>\n<h2>The crack</h2>\n<p>They are peacekeepers now. Police, with a Senate to answer to and a war they are forbidden to fight. Half the Order has made its peace with that; the other half remembers, or has read, what the Force was before Ruusan turned it into a civic service — and the Reach is full of people who will ask them, to their faces, <em>is that really what the Force is about?</em></p>\n<p>And the doctrine has no answer for an adult. The Temple takes children; it cannot take a twenty-year-old who dreams true, and it cannot stop watching one.</p>\n<p><em>(The Order's face in the Reach, and the Jedi who never left it, are in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>.)</em></p>"}, {"section": "setting", "id": "admiralty", "title": "The Admiralty", "html": "<h1>The Admiralty</h1>\n<p><em>The government of the Bastion Worlds — the last power with working capital ships.</em></p>\n<h2>Who they are</h2>\n<p>The shipyard cluster where the fleet that refused the demobilization order dropped anchor and never left. A stratocracy built by that squadron — its current Lady Admiral is the granddaughter of the woman who said no — grown into the last power with working capital ships.</p>\n<p>The distinction matters on the ground: <strong>Bastioners</strong> are fiercely proud of their worlds and considerably less fond of the uniforms that run them, and the Admiralty works hard to keep outsiders from seeing the difference.</p>\n<h2>What they want</h2>\n<p>The relit lanes placed under naval protection — which is to say under naval control. And they conscript.</p>\n<h2>What they offer a wayfinder crew</h2>\n<p>What no one else can: <strong>escort, fuel, repair, genuine safety.</strong> Their pitch lands because it is half true: the Republic dissolved its fleets by law, adjourned the Rim, and sends paperwork and a Jedi to take it back.</p>\n<h2>The crack</h2>\n<p>Their founding story requires an enemy, and if the Sith do not return, some of their officers will need them to.</p>"}, {"section": "setting", "id": "vigil", "title": "The Vigil", "html": "<h1>The Vigil</h1>\n<p><em>Keepers of everything the Order left behind when it withdrew — and the standing peace terms with the bereaved.</em></p>\n<h2>Who they are</h2>\n<p>Founded by Ruusan's grave-tenders and the Order's lay custodians in the year of the Adjournment, when the Jedi sealed their Rim temples and went home to Coruscant. The Council deeded them the stone and the relics — <strong>custody of property, though nothing in the minutes grants them custody of the calling</strong> — under a single instruction: keep it locked until the Order returns. An angry galaxy tolerates them precisely because they keep it all locked away; their doctrine is not only theology, it is the standing peace terms with the bereaved.</p>\n<p>Their founding generation — the last people who actually knew Jedi — is dying, and doctrine is hardening exactly as fast as memory fails. Eighty years is long enough for <em>until the Order returns</em> to become <em>the Order is not coming back</em>, and then to become a creed.</p>\n<h2>What they want</h2>\n<p>They gather relics, authenticate artifacts, tend the Valley of the Jedi — and forbid, absolutely, the use of any of it. <strong>Veneration without practice</strong>, so that the fire can never spread again. They are the Rim's own answer to the Force, and they have had a century to decide they prefer it to Coruscant's.</p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>Sanctuary.</strong></li>\n<li><strong>Authentication</strong> of artifacts and <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a>.</li>\n<li><strong>Access to sealed places</strong> no one else may enter — including the temples the Temple now wants back.</li>\n</ul>\n<h2>The crack</h2>\n<p>The newly Force-sensitive split them in half: sacrilege walking around in children's bodies, or the Order reborn. The Order's return splits them again: half the Vigil will hand over the keys and weep with relief; half will not hand over the children, and has begun to wonder whether the deed says it must hand over anything at all.</p>\n<p>And beneath it sits the deed itself: their authority covers stone and relic, not flesh — a distinction somebody from Coruscant is eventually going to read aloud, in a temple, with two other Masters present.</p>"}, {"section": "setting", "id": "inheritors", "title": "The Inheritors", "html": "<h1>The Inheritors</h1>\n<p><em>A patient whisper-network selling the era's most dangerous currency: answers.</em></p>\n<h2>Who they are</h2>\n<p>Founded by the Brotherhood's surviving quartermasters, collaborators, and camp-followers — some of them still alive — the network has spent three generations quietly hoarding Sith lore, and, lately, arriving first on the doorsteps of frightened Force-sensitive families with answers, flattery, and coin.</p>\n<h2>What they want</h2>\n<p>A monopoly on the returning Force.</p>\n<h2>What they offer a wayfinder crew</h2>\n<p>The era's most dangerous currency: <strong>real training, when no one else alive can teach.</strong></p>\n<h2>The crack</h2>\n<p>Even senior Inheritors are not sure whose hand is at the top of their own organization — whether they serve a living tradition or are merely wearing its costume.</p>\n<p><em>(The GM knows the answer.)</em></p>"}, {"section": "setting", "id": "lamplighters", "title": "The Lamplighters", "html": "<h1>The Lamplighters</h1>\n<p><em>The beacon-tenders' guild — nominally neutral, universally necessary.</em></p>\n<h2>Who they are</h2>\n<p>Chartkeepers, rutter-brokers, and lane-runners who never stopped maintaining what could be maintained. The natural patron for a wayfinder crew.</p>\n<h2>What they want</h2>\n<p>The network relit — <strong><em>in the order they choose.</em></strong></p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>Charters.</strong></li>\n<li><strong>Salvage rights.</strong></li>\n<li><strong>First-lighting fees</strong> for every beacon reopened (see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:beacon-relighting\">Relighting a Beacon</a>).</li>\n</ul>\n<h2>The crack</h2>\n<p>Whoever sets the relighting order decides which worlds matter for the next century. The Grandmaster of Charts knows this, every faction knows she knows, and her neutrality is not unpurchasable — the price is merely very high. The guild's insistence that beacons relight in <em>its</em> sequence, and only its sequence, is the one thing about it that is not for sale — and the one thing about it worth asking why.</p>"}, {"section": "setting", "id": "kajidics", "title": "The Kajidics", "html": "<h1>The Kajidics</h1>\n<p><em>The Hutt clan-corporations — the one interstellar institution the Withering made stronger.</em></p>\n<h2>Who they are</h2>\n<p>They never needed the Republic; <strong>scarcity is margin.</strong> They run the black lanes (the unregistered routes that never went dark), the fuel and scrap monopolies, and the protection rackets that pass for civic order on a hundred worlds.</p>\n<h2>What they want</h2>\n<p>Their answer to \"what comes next\" is <em>nothing, thank you</em> — they will be paid to keep it that way, because every relit beacon on a route they do not control is competition.</p>\n<h2>What they offer a wayfinder crew</h2>\n<p>What no charter can:</p>\n<ul>\n<li><strong>Fuel and parts.</strong></li>\n<li><strong>Black-lane rutters.</strong></li>\n<li><strong>Cash work with no questions attached.</strong></li>\n</ul>\n<h2>The crack</h2>\n<p>Generational: the young Hutts have run the numbers and think a rebuilt galaxy pays better than scarcity rents ever will, and a clan war over that spreadsheet is one bad season away.</p>"}, {"section": "setting", "id": "guild", "title": "The Bounty Hunters' Guild", "html": "<h1>The Bounty Hunters' Guild</h1>\n<p><em>A standing power — the closest thing the galaxy has to interstellar law.</em></p>\n<h2>Who they are</h2>\n<p>When the courts stopped reaching across systems, one writ kept traveling: <strong>the posting.</strong> The Guild honors any bounty whose bond clears — governments, Kajidics, grieving families, it does not care — and its code (<em>deliver as posted, no poaching, the posting is sacred</em>) has made it, absurdly, the closest thing the galaxy has to interstellar law.</p>\n<p>Worlds too small for judges hire hunters as <strong>circuit arbiters</strong>.</p>\n<h2>The dark side of the code</h2>\n<p>Postings outlive their posters, and Guild purists still honor bounties filed by governments that no longer exist.</p>\n<h2>To a wayfinder crew</h2>\n<p>The Guild is employer, threat, and occasionally the only enforcement a promise has.</p>"}, {"section": "setting", "id": "mandalorians", "title": "The Mandalorian Clans", "html": "<h1>The Mandalorian Clans</h1>\n<p><em>A standing power — the one people who never demobilized.</em></p>\n<h2>Who they are</h2>\n<p>Rebuilt under a Mandalore into clan companies that hire out to anyone whose bond clears — which, in a disarmed galaxy, makes them the finest soldiers alive and everyone's contingency plan. They remember the wars differently than everyone else: <strong>as work.</strong></p>\n<h2>On the Awakening</h2>\n<p>They hold the era's strangest position, which is no position at all — the clans take foundlings from every ruin they are paid to make or guard, and a foundling who bends luck is simply a promising warrior.</p>\n<p><strong>Nobody is watching the one culture that neither fears the gifted nor wants to own them.</strong></p>"}, {"section": "setting", "id": "structure", "title": "Campaign Structure", "html": "<h1>Campaign Structure</h1>\n<p>Three acts. Three mechanics. Three questions.</p>\n<table>\n<thead>\n<tr>\n<th>Act</th>\n<th>Sessions</th>\n<th>Shape</th>\n<th>Core mechanic</th>\n<th>The question</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1 — Reconnection</a></td>\n<td>~1–8</td>\n<td>Episodic</td>\n<td><strong>Obligation</strong> (survival)</td>\n<td>What did the galaxy become while nobody was looking?</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-2\">Act 2 — Convergence</a></td>\n<td>~9–16</td>\n<td>Hinge events, any order</td>\n<td><strong>Morality</strong> (conscience)</td>\n<td>Every government has a policy now — what's yours?</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-3\">Act 3 — The Founding</a></td>\n<td>~17–20+</td>\n<td>Two summits and one canyon</td>\n<td><strong>Duty</strong> (cause)</td>\n<td>What comes next — and who decides?</td>\n</tr>\n</tbody>\n</table>\n<div class=\"adm adm-tip\"><p class=\"adm-title\">Players discover this as they play</p><p>The act summaries below are shareable as the table reaches them. The GM's private notes live elsewhere.</p></div>\n\n<p>Start here: <a href=\"#\" class=\"xin\" data-nav=\"page:setting:session-one\">Session One — \"The Light on Vesta-9\"</a>. Track play in the <a href=\"#\" class=\"xin\" data-nav=\"tab:log\">Session Log</a>.</p>"}, {"section": "setting", "id": "act-1", "title": "Act 1 — Reconnection", "html": "<h1>Act 1 — Reconnection</h1>\n<p><em>Sessions ~1–8. Episodic. Each relit beacon opens a corridor, and each corridor holds a world that spent ninety years becoming something strange.</em></p>\n<p><strong>Act goals:</strong> meet all five factions on the ground, gather <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a>, and let the crew's reputation outrun them.</p>\n<p><strong>Where:</strong> the episodes sit along the dead <a href=\"#\" class=\"xin\" data-nav=\"page:setting:geography\">Duros Space Run</a> through the Grumani Reach — one relit beacon per hop, Bannistar Station back toward Darkknell and the Hydian Way. Place each seed on a real system as the crew reaches it (the GM keeps suggested placements on the beacon map).</p>\n<h2>Episode seeds beyond Vesta-9</h2>\n<ol>\n<li><strong>The Sealed Enclave.</strong> A Vigil-sealed temple whose caretaker droid still runs lessons for empty rooms — and something answered this year's roll call.</li>\n<li><strong>The Ration Engine.</strong> A world administered for ninety years by a droid bureaucracy that refuses to believe the galaxy is back; the crew must out-argue a spreadsheet that genuinely loves its people.</li>\n<li><strong>The Mausoleum Yards.</strong> A mothballed Republic fleet, now a hull-city of squatters, with an Admiralty prize crew inbound carrying eviction orders.</li>\n<li><strong>The Memory Market.</strong> A world where provenance is currency, and a forgery ring is quietly poisoning the galaxy's lore-fragment economy — including, perhaps, something the party already trusts.</li>\n<li><strong>The Oracle of Brel.</strong> A settlement worships a Force-sensitive child whose true dreams are eating her sleep; three factions arrive the same week the PCs do.</li>\n<li><strong>The Scar.</strong> A New Sith Wars battlefield where the dark side pooled. An Inheritor dig site offers the crew coin, answers, and the campaign's first real temptation.</li>\n<li><strong>The Five Systems.</strong> A small confederation that is, embarrassingly, thriving in isolation. Plugging them into the galaxy may ruin them — and they know it. Discovery is not neutral.</li>\n<li><strong>The Toll.</strong> A Hutt successor cartel holds the only living chokepoint lane and sells passage; the diplomats and traders get their spotlight episode.</li>\n<li><strong>The Dead Letter.</strong> An assassin droid is still working a ninety-year-old contract list. The government that posted it is dust, the Guild's purists insist a posting is a posting, and the next name on the list is somebody the crew needs alive.</li>\n<li><strong>The Handoff.</strong> A Kajidic middleman's \"cargo\" turns out to be a Force-sensitive child, sold up the chain toward buyers nobody names aloud. Intercepting the shipment is the easy part; deciding what to do about the market it revealed is the episode.</li>\n</ol>"}, {"section": "setting", "id": "act-2", "title": "Act 2 — Convergence", "html": "<h1>Act 2 — Convergence</h1>\n<p><em>Sessions ~9–16. The quiet ends.</em></p>\n<p>Hinge events, playable in any order:</p>\n<h2>The Awakening goes public</h2>\n<p>A display of the Force too public to hush — now every government has a policy, and every policy has victims.</p>\n<h2>The Conclave of Charts</h2>\n<p>The <a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">Lamplighters</a> auction the relighting order. Every faction bids; the party holds swing data from Act 1.</p>\n<h2>The Unveiling</h2>\n<p>The <a href=\"#\" class=\"xin\" data-nav=\"page:setting:inheritors\">Inheritors</a> present a trained cadre — the first \"Sith\" seen since Ruusan. They are costume: real techniques, counterfeit lineage. Almost nobody alive can tell the difference, and the two beings who can have just been handed an address.</p>\n<h2>The Vigil breaks</h2>\n<p>The argument over custody of the Force-sensitive goes from doctrinal to armed, and both halves of <a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">the Vigil</a> come to the party for help.</p>\n<h2>The Annexation</h2>\n<p>The <a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">Admiralty</a> \"secures\" a relit corridor for everyone's safety, and does not leave.</p>"}, {"section": "setting", "id": "act-3", "title": "Act 3 — The Founding", "html": "<h1>Act 3 — The Founding</h1>\n<p><em>Sessions ~17–20+. Two summits and one canyon.</em></p>\n<h2>The Founding Conclave</h2>\n<p>Crisis forces the constitutional moment: the Rim re-chartered under Coruscant, an Admiralty dominion, a concord of independent leagues — or the players' own third way. Their accumulated fragments, favors, and Force-sensitive allies are the votes.</p>\n<p>And hanging over the whole chamber is a codicil almost nobody remembers: <strong>three Masters, met in a sealed temple, can reopen it and seat a chapter of the Order there</strong> — outside Coruscant's reach. With one Master from the Temple and one who never left, who counts as the third is a question worth a war.</p>\n<h2>The Valley of the Jedi</h2>\n<p>Getting there is its own act: up the <a href=\"#\" class=\"xin\" data-nav=\"page:setting:geography\">whole Hydian Way</a> coreward to Brentaal, out the Perlemian to Lantillies, down the Randon Run past Kashyyyk — and then off every chart that survives, into the Teraab stellar nursery, where the nebulae have been quietly erasing the last lanes to Ruusan since the war ended. The crew that relit the Rim's beacons ends the campaign navigating a road the sky itself is closing.</p>\n<p>Whoever brings the new Force-sensitives here defines what the Force's return means. On the table:</p>\n<ul>\n<li><strong>Release</strong> the thousand bound souls.</li>\n<li><strong>Draw</strong> on them.</li>\n<li><strong>Seal</strong> the Valley for another age.</li>\n<li><strong>Or ask the souls what they want.</strong></li>\n</ul>\n<h2>The true ending</h2>\n<p>The campaign's true ending is the <em>pairing</em> of a political outcome with a Valley choice. An empire that frees the dead and a republic that feeds on them are both possible, and both worth playing to find out.</p>"}, {"section": "setting", "id": "session-one", "title": "Session One — Vesta-9", "html": "<h1>Session One — \"The Light on Vesta-9\"</h1>\n<h2>Cold open</h2>\n<p>The crew is grounded at <strong>Okrent's Drift</strong> — the fuel-depot port that grew on the back of <strong>Bannistar Station</strong>'s great gantries, at the frayed end of the living stretch of the <strong>Duros Space Run</strong> — cargo impounded, Obligations circling — when the sky changes. <strong>Vesta-9, dark for sixty years, is broadcasting.</strong> Every ship that can lift is lifting.</p>\n<h2>Scene 1 — The Scramble</h2>\n<p>Get off-world first: the impound, the fuel, and a likable rival crew worth keeping as recurring foils.</p>\n<h2>Scene 2 — The Race</h2>\n<p>Astrogation on a decayed route. Introduce <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">fragments</a> here, when one page of somebody's grandmother's rutter is the difference between arrival and drift.</p>\n<h2>Scene 3 — The Beacon</h2>\n<p>Vesta-9 station, lit and humming — and occupied.</p>\n<ul>\n<li><strong>Keeper Adressa Vhail</strong> of the Vigil is praying at the beacon core and will not say how she got there.</li>\n<li>The Admiralty sloop <strong><em>Steadfast</em></strong> (<strong>Cmdr. Joss Reike</strong>) drops in demanding all vessels stand to for inspection.</li>\n<li><strong>Chartmistress Bel Nerra</strong> of the Lamplighters arrives to certify the relight — and to hire witnesses.</li>\n</ul>\n<h2>Scene 4 — The Resonance</h2>\n<p>Mid-standoff, the beacon's carrier wave slips off its pitch — and finds the pulse of one of the crew. The mast brightens when they breathe in, dims when they breathe out: sixty years of silence, and the first thing this machine chooses to keep time with is somebody at the table. Whether they push it down or answer it is theirs to decide — in front of three factions.</p>\n<ul>\n<li>Reike wants them entered on the fleet's rolls, \"for their own protection.\"</li>\n<li>Vhail goes very quiet.</li>\n<li>Nerra offers navigator's articles on the spot.</li>\n</ul>\n<h2>Out</h2>\n<p>The corridor toward <strong>Enarc</strong> stands open — the first dead leg of the <a href=\"#\" class=\"xin\" data-nav=\"page:setting:geography\">Duros Space Run</a>, the road that once ran through the <strong>Grumani Reach</strong> to Darkknell and the Hydian Way. <a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1's episode worlds</a> lie along it. Three factions know the crew's name, and someone knows exactly what just happened.</p>"}, {"section": "truths", "id": "truths", "title": "GM Truths (Part V)", "html": "<h1>GM Truths (Locked)</h1>\n<div class=\"adm adm-danger\"><p class=\"adm-title\">Players never see this page</p><p>Three dials, now set.</p></div>\n\n<h2>Dial 1 — The line is unbroken, and very far away</h2>\n<p>A Sith Master and apprentice continue Bane's work somewhere in the galaxy — patient, hidden, and interested in ruins only for what they remember. The Rule of Two does not want a withered galaxy; it wants one worth taking — and it wants every true thing about the Sith out of that galaxy and into its own hands. The Reach was Sith country in the wars, and the Withering sealed its vaults; reunification is their harvest, which makes the party their unwitting gardeners: every relit beacon opens a door she means to be first through.</p>\n<p>They will not surface until a true galactic power exists — likely not within this campaign's span at all — so <strong>run them as an absence</strong>: unexplained good fortune whenever reunification stalls, rivals who quietly remove themselves, a pattern visible only from very far back. If the players ever found that power, the Sith's attention is the sequel.</p>\n<p>At 90 AR the line is only two or perhaps three successions deep — young, consolidating, and nowhere near ready, which is exactly why patience costs them nothing.</p>\n<p><em>(Stat blocks, statted for completeness only: <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>.)</em></p>\n<h3>The fork is closed: the Inheritors are heretics</h3>\n<p>No connection to the true line, and they do not know it — real techniques scraped from artifacts, counterfeit lineage, no living tradition. <strong>The Sith do not yet know they exist.</strong></p>\n<p>The moment that changes — the Unveiling, a public claim to a Darth title, anything that makes them look less like grave-robbers and more like a rival tradition — <strong>the culling comes</strong>, and it is surgical, anonymous, and total: the senior circle dead across a dozen worlds in one night, the archives vanished rather than burned, and nobody sane concluding \"Sith.\" The galaxy blames the Vigil, or the Admiralty, or an internal purge, and every misattribution lights a different Act 3 fire.</p>\n<p>Two aftershocks matter:</p>\n<ol>\n<li>The culling <strong>shatters the Inheritors instead of ending them</strong>: leaderless cells, fire-sale artifacts, half-trained adepts scattering with dangerous knowledge.</li>\n<li>The harvested archives include <strong>the Vesta-9 file</strong> — whoever wrecked the Inheritors now knows about the crew, and which of them the beacon answered, and has never once been seen.</li>\n</ol>\n<h3>The second fork, resolved: two Jedi</h3>\n<p>The Order is alive on Coruscant and absent here, and the campaign's Jedi question is not extinction but <strong>succession</strong>: Coruscant's Order or the Rim's?</p>\n<ul>\n<li><strong>The Core's Jedi</strong> — Master N'Kata Del Gormo, the Temple's envoy, arriving with the Republic's charter ships to find the gifted children and reopen the sealed temples under the Council's authority. Canon says he ends as a hermit on a swamp world who trains a crashed young Yoda and a human friend, outside the Temple's system — so his arc here is the campaign's own question, <em>is this really what the Force is about?</em>, answered by a man who came to the Reach for the Temple and stayed for the swamp. Verdanth is his swamp. The Republic ship that one day answers Yoda's distress call gets there on a lane your players relit.</li>\n<li><strong>The Rim's Jedi</strong> — Yenna Sar, third student of a Master who refused the recall in the year of the Adjournment; a tired woman on a dry world who has kept vigil over the gift for a century the Temple spent counting children it could reach. To Del Gormo she is the withdrawn: a heresy with a lightsaber. To the Reach she is the only Jedi it has ever met.</li>\n</ul>\n<p>The codicil — three Masters, met in a sealed temple, may reopen it and seat a chapter of the Order there — makes the third Master the prize of Act 3, and \"who counts as a Master\" a war with two faces on it. The crew's gifted adult, too old for the Temple by doctrine and too dangerous to ignore, stands between them. <em>(Both are statted in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>.)</em></p>\n<h2>Dial 2 — The tide</h2>\n<p>The Force returns <strong>because it returns</strong>. The Vigil's theology, the Inheritors' doctrine, and the Republic's science are all wrong or unprovable; nobody gets to be right, and the mystery stays a mystery.</p>\n<p>The Valley of the Jedi is therefore <strong>not</strong> the engine of the Awakening — it is purely the era's greatest choice. The Force-sensitive dream of it the way compasses find north: it is simply the loudest thing the Force has ever done.</p>\n<h2>Dial 3 — Vesta-9 was lit by the Sith</h2>\n<p>The apprentice lit it. The line is hunting one object: <strong>the holocron of Naga Sadow</strong> — the Dark Lord of the Great Hyperspace War's own teaching, five thousand years old, looted during the New Sith Wars into the collection of one of the principalities that held this region, and lost with them when the Withering sealed the Reach. The Sith know it survived; they do not know which principality's vault it sits in, or where in the Reach that vault is. So the Reach had to be reopened, and the line could not be seen to reopen it. Three consequences are now in play:</p>\n<ol>\n<li><strong>The Lamplighters are the Sith's scouting arm, and do not know it.</strong> Through a coreward patron the guild believes to be a private antiquarian consortium, the line funds the guild — and the patron's money comes with the patron's <em>order</em>. That is why the guild is so insistent that beacons relight in <strong>its</strong> sequence: the relighting order is the Sith search pattern, and behind every certified relight a quiet survey team goes in first. Every first-lighting fee the crew earns is paid, two hands back, by the thing they are helping to find. (<a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> — the Patronage.)</li>\n<li><strong>An Inheritor observer was present at the relight anyway.</strong> The Inheritors did not light Vesta-9, but grave-robbers notice when a tomb opens: an unremarkable hull in the arrival swarm filed a census — the crew, above all its gifted — and the Inheritors are now chasing the same vaults from the other side. First contact will be helpful, because it always is: coin, rescue, answers, no strings visible.</li>\n<li><strong>The guild leaks twice.</strong> The Inheritors own a mole among the Lamplighters (Chartkeeper Denno Pike) who sells them the handshake codes and the patron's relighting order — which quietly turns Act 2's Conclave of Charts into an auction rigged from two directions: the patron has already bought the order, and the Inheritors have already stolen it. The party can discover and expose either, and the second one they find is the dangerous one.</li>\n</ol>\n<h2>Marginalia</h2>\n<p><strong>A calendar gift:</strong> Yoda's canonical birth falls in 104 AR — fourteen years after session one. He is not a relic of the old Order; he is downstream of your players. Whatever galaxy they build at the Founding is the one he will be born into — and the Order he someday joins is their legacy.</p>\n<p><strong>Canon is your epilogue, not your cage:</strong> Legends guarantees that a Republic and a Jedi Order stand a thousand years from now, and that Bane's line reaches its final two. It says nothing about what the rebuilding cost, what kind of Republic came first, or whose names history kept. If your players' Founding becomes the seed of the thousand years of peace, the record's silence about them is not a plot hole — it is what recoveries do to their founders.</p>"}];
const MODULES= [{"id": "01", "title": "Session One — The Light on Vesta-9", "intro": "<p><em>The GM-screen module. Run the session from this page. Every marked name opens its stat block in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">Vesta-9 &amp; the Crew's Orbit</a>; subsystem links go to the mechanics pages the session introduces.</em></p>", "scenes": [{"sid": "s1", "title": "Overview", "html": "<p><strong>The session's jobs</strong>, in rising order of consequence: teach the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragment</a> subsystem at the moment a single page is worth a ship's life; put three factions on the ground in front of the crew — the Vigil, the Admiralty, the Lamplighters — each wanting something real and paying for it; land the Awakening in the crew's own lap — the beacon is going to answer one of them, in front of three factions, and what the table does about it becomes their reputation; and open the corridor into the Grumani Reach — the first dead leg of the <a href=\"#\" class=\"xin\" data-nav=\"page:setting:geography\">Duros Space Run</a> — where <a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1</a> lives. If the table drives home arguing about what they owe their own gifted, the session worked.</p>\n<p><strong>What the players should be holding when it ends:</strong> a certified corridor with their names on the paper; 1,200 scrip minus whatever Scene 1 cost them; at least one logged fragment and the Question it bears on; a standing witness-charter offer from the guild; and the knowledge that the beacon answered one of their own in front of three factions. That last one is the campaign.</p>\n<p><strong>The spine</strong> — five beats, about four hours with a break:</p>\n<table>\n<thead>\n<tr>\n<th>Beat</th>\n<th>Section</th>\n<th>Clock</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Grounded, then the sky changes</td>\n<td>Cold Open</td>\n<td>~20 min</td>\n</tr>\n<tr>\n<td>The scramble off-world</td>\n<td>Scene 1</td>\n<td>~50 min</td>\n</tr>\n<tr>\n<td>The race up a dead lane</td>\n<td>Scene 2</td>\n<td>~40 min</td>\n</tr>\n<tr>\n<td>The standoff at the light</td>\n<td>Scene 3</td>\n<td>~60 min</td>\n</tr>\n<tr>\n<td>The resonance, and the way out</td>\n<td>Scene 4 + The Out</td>\n<td>~55 min</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Cut for time, never for weight.</strong> If the clock runs hot: compress the fuel problem to one roll, hand the fragment over via whichever vector is nearest, and let the <em>Steadfast</em> arrive early to squeeze Scene 3. Never cut the resonance read-aloud, the three factional reactions to it, or the closing image — the session is remembered by those three, in that order.</p>\n<p><strong>Prep checklist</strong> — seven items, half an hour:</p>\n<ol>\n<li>\n<p><strong>Talk to your Force-sensitive player(s) before the session.</strong> Scene 4 shines a spotlight on one of them: the beacon is going to reach for their character in front of three factions. Check they want that spotlight tonight, agree on how private the first signs should be, and promise them what the scene delivers — a choice, never an ambush. If more than one PC is gifted, pick with the players whom the beacon finds first (the others feel it secondhand, like a note struck in the next room).</p>\n</li>\n<li>\n<p>Tie each PC's Obligation to the grounding at Okrent's Drift — one written sentence per PC. The table in the Cold Open does most of the work; personalize the names.</p>\n</li>\n<li>Print the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:dice-results\">Reading the Dice</a> player sheets, one per player. This session leans on Advantage/Threat spends and the sheets keep the table fast.</li>\n<li>Keep the <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">session one NPC file</a> open — the whole cast is statted there, marines and minion math included.</li>\n<li>Pick two or three <a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1 episode seeds</a> to place along the Duros Space Run chain (see <a href=\"#\" class=\"xin\" data-nav=\"page:setting:geography\">the geography page</a> for the real systems, Enarc through Jutrand) and pencil them onto the <a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">beacon map</a>.</li>\n<li>Make the fragment card: <em>Grandmother Osk's rutter, page 40</em> — form, tag, Question, and its load-bearing claim written on a physical card you can hand across the table.</li>\n<li>Decide privately how <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--keeper-adressa-vhail\">Keeper Adressa Vhail</a> reached the core before anyone — mundane, stranded, or something stranger. Neither she nor anyone on camera lit the beacon: the Sith apprentice did, a week ago, and is long gone (Dial 3). The Inheritor observer is an unremarkable hull in the arrival swarm (see the danger box below) — decide only which hull.</li>\n</ol>\n<div class=\"adm adm-danger\"><p class=\"adm-title\">GM only — Dial 3 is on the field</p><p>Vesta-9 was lit by the Sith apprentice, to reopen the Reach for a holocron hunt; nothing on the field tonight knows that, and nothing should. What <em>is</em> on the field is an Inheritor observer — grave-robbers notice when a tomb opens — an unremarkable hull in the arrival swarm that files no claim and asks no questions. Do not cast them, do not name them, do not let the camera find them. They pay off silently in The Out. If the crew examines the core, the one honest trace is that it was woken by hand, competently, by someone who knew the old protocols and left nothing else. See <a href=\"#\" class=\"xin\" data-nav=\"tab:truths\">GM Truths</a>.</p></div>\n\n<div class=\"adm adm-tip\"><p class=\"adm-title\">Table talk before the dice</p><p>If session zero did not already do it, say the era's thesis line aloud before the cold open — <em>nobody broke the galaxy; everyone just stopped holding it up</em> — and remind the table that in this era the Force is not a skill, it is an event. Both lines pay for themselves by Scene 4.</p></div>"}, {"sid": "s2", "title": "Cold Open — Okrent's Drift", "html": "<p>The tableau: a fuel-depot port at the frayed end of a living lane. The crew's ship is bolted, their cargo is impounded, and their Obligations have found the address. Let them stew in it for ten minutes of roleplay before the sky changes — offer each player one small vignette of being broke:</p>\n<ul>\n<li>Haggling at the commissary over a meal that costs more than it did yesterday, because everything does.</li>\n<li>Watching the twice-daily lane departure from the fence line, with somebody else's manifest on it.</li>\n<li>A courier packet arriving months old — news from home that was already decided before they could have answered it.</li>\n<li>The Obligation itself knocking: a collector, a cousin, a writ, a rumor. One knock each; use the table below.</li>\n</ul>\n<blockquote>\n<p>Okrent's Drift at dusk is the smell of fuel and the sound of somebody else's ship leaving. Your own sits under the depot lights with a port-authority bolt clamped to the landing gear like a brass tumor, and the cargo that was going to fix everything is behind a fence with your name misspelled on the seizure tag. The lane out of here still runs; you can watch it, twice a day, taking other people places.</p>\n</blockquote>\n<p><strong>Why <em>you</em> are stuck here</strong> — invoke each PC's Obligation as the specific reason the Drift has them:</p>\n<table>\n<thead>\n<tr>\n<th>Obligation</th>\n<th>The grounding, personalized</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Debt</strong></td>\n<td>The impound <em>is</em> the collection. <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--portmaster-grell\">Portmaster Grell</a>'s ledger carries your marker's interest, and the Kajidic dues-taker at the gate knows your face.</td>\n</tr>\n<tr>\n<td><strong>Family</strong></td>\n<td>The cargo is the lifeline — medicine or parts consigned for your homeworld, seized with the hold.</td>\n</tr>\n<tr>\n<td><strong>Oath</strong></td>\n<td>The dying archivist's last commission is in those crates, and the deadline was last week.</td>\n</tr>\n<tr>\n<td><strong>Notice</strong></td>\n<td>An Admiralty conscription writ reached this port before you did. Lifting without clearance confirms everything it says about you.</td>\n</tr>\n<tr>\n<td><strong>Secret</strong></td>\n<td>Someone on this field knows — and the price of their quiet was the cargo.</td>\n</tr>\n<tr>\n<td><strong>Obsession</strong></td>\n<td>You spent the fuel money on a fragment lead that went nowhere. That is <em>why</em> you cannot pay Grell.</td>\n</tr>\n<tr>\n<td><strong>Responsibility</strong></td>\n<td>Your refugees are camped at the field's edge; feeding them is where the scrip went.</td>\n</tr>\n<tr>\n<td><strong>Contract</strong></td>\n<td>The Lamplighters hold your ship's papers, and their factor here grounded you pending arrears. Remember this in Scene 3: Chartmistress Nerra is your creditor's colleague.</td>\n</tr>\n<tr>\n<td><strong>Posted</strong></td>\n<td>A Guild hunter is drinking in the cantina, deciding whether the posting on you still bonds. Lifting fast is suddenly very attractive.</td>\n</tr>\n</tbody>\n</table>\n<p>Then the sky changes:</p>\n<blockquote>\n<p>It starts as a murmur on the depot's public band, then every nav board in the port lights at once. Vesta-9 — dark since your grandparents' time, a dead name on old charts — is broadcasting, clean and steady, like sixty years never happened. Across the field a freighter spins up its lifters without waiting for clearance, and then everybody is running.</p>\n</blockquote>\n<p>Say the stakes plainly through an NPC's mouth (any dockhand): a relit beacon means a <strong>first-lighting fee</strong>, salvage rights, and a corridor of worlds nobody has priced in ninety years — <em>for whoever gets there and gets it certified.</em> Cut to the scramble.</p>"}, {"sid": "s3", "title": "Scene 1 — The Scramble", "html": "<p>Three problems between the crew and the sky: the impound, the fuel, and the fact that everyone else heard the same broadcast. Run it as an obstacle course with a clock ticking audibly — every ten minutes of table time, narrate another ship lifting.</p>\n<p><strong>The field at a glance</strong> — four stations; the party can and should split up:</p>\n<table>\n<thead>\n<tr>\n<th>Where</th>\n<th>What is there</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>The impound office</td>\n<td>The bolt release, the ledger, and a portmaster who has never once torn up a ledger — only repriced it.</td>\n</tr>\n<tr>\n<td>The fuel queue</td>\n<td>150-scrip lift-and-jump loads, a line out the gate, and the <em>Larksong</em> holding the head of it.</td>\n</tr>\n<tr>\n<td>The cantina gantry</td>\n<td>The rumor network at full boil: the chart-broker, the wager board, and word of who has already lifted.</td>\n</tr>\n<tr>\n<td>The depot infirmary</td>\n<td>A vacuum-lunged old spacer who ran the Duros Space Run when it was alive — see Scene 2's third vector.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The impound.</strong> <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--portmaster-grell\">Portmaster Grell</a> hovers at eye level behind his ledger-slate so nobody can look down on him. Listed price: <strong>450 scrip</strong> release plus a <strong>60-scrip lift tax</strong>. Assume the crew can raise about a third of that — say so out loud; the shortfall is the scene. He is venal, not cruel: every fee has a listed price, and he honors what he signs. His opening line, delivered while the beacon news howls outside his window: <em>\"Everyone in this port suddenly has somewhere to be. Prices reflect demand. Yours reflects history.\"</em> If violence so much as clears its throat, he drops behind the desk and starts naming lower numbers — keep him alive; a portmaster who owes the crew goodwill is Act 1's best recurring door.</p>\n<table>\n<thead>\n<tr>\n<th>Approach</th>\n<th>Check</th>\n<th>It works</th>\n<th>The downside</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Haggle his angle</td>\n<td><strong>Average Negotiation</strong>, upgraded once for his savvy (Natural Negotiator lets him force one reroll)</td>\n<td>He would rather own a piece of a rumor than scrip today: the debt converts to a signed 15% of any first-lighting fee. Advantage shaves it to 10%.</td>\n<td>Threat: the 60-scrip lift tax stays, cash up front.</td>\n</tr>\n<tr>\n<td>Lie to him</td>\n<td><strong>Average Deception</strong>, upgraded once by his Nobody's Fool</td>\n<td>The bolt comes off on the strength of a forged consignment or an invented patron.</td>\n<td>Discovered — a failed check now, or any Despair in the port later — he doubles the release to 900, honors nothing unsigned, and says your names to the Kajidic dues-taker. Collections will find you (+5 to a Debt Obligation, or seed one).</td>\n</tr>\n<tr>\n<td>Slip the bolt</td>\n<td><strong>Hard Skulduggery</strong> on the impound clamp</td>\n<td>A quiet release and no paper at all.</td>\n<td>Threat: the tamper logs — Grell knows before you clear the gravity well. Despair: the bolt's tracer fires on lift; the debt beats you to Vesta-9 in the guild post.</td>\n</tr>\n<tr>\n<td>Pay</td>\n<td>510 scrip they do not have</td>\n<td>The dockside Kajidic lender advances it in minutes.</td>\n<td>Ruinous interest: Debt Obligation +5, and the young Hutt's clerk smiles as she files it.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The fuel.</strong> The depot queue is suddenly the longest line on the planet. A lift-and-jump load runs <strong>150 scrip</strong>. Options: <strong>Average Negotiation</strong> with the depot clerk for deferral against the first-lighting fee; <strong>Average Streetwise</strong> for an off-book half-load at 90; or the kindness below.</p>\n<p><strong>The rivals.</strong> Holding the head of the fuel queue: the <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--larksong-crew\">Larksong crew</a>, three spacers in patched vac-jackets who finish each other's sentences, and their captain — <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-vess-marrow\">Captain Vess Marrow</a>, who waves at the crew from her boarding ramp like an old friend, because by the third race she genuinely will be. Play her fast, warm, and better-prepared: she names the wager (loser buys the winner's table a round, every port, for a season), and if the crew is short on fuel she splits her allocation without being asked — \"I want to <em>beat</em> you, not lap you.\" She is the recurring foil; nothing in this scene should make her an enemy.</p>\n<p><strong>Advantage/Threat menu</strong> — tuned to this scene:</p>\n<table>\n<thead>\n<tr>\n<th>Result showing</th>\n<th>Spend it as</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Advantage</td>\n<td>A dockhand throws in charged cells: remove a setback die from the crew's next shipboard Mechanics check.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Grell lets slip the count — how many ships have lifted, and that the <em>Larksong</em> is fueled but waiting on a chart.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>The Kajidic dues-taker at the gate writes the crew's names in her book.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>Fuel-line delay: the <em>Larksong</em> lifts first, visibly, with a cheerful wave.</td>\n</tr>\n<tr>\n<td>Triumph</td>\n<td>Grell smells profit and flips: release fee waived for a signed 10%, and he throws in the depot's sixty-year-old lane chart — a boost die in Scene 2.</td>\n</tr>\n<tr>\n<td>Despair</td>\n<td>The impound bolt scars the gear coming off: the ship starts Scene 2 carrying 2 system strain.</td>\n</tr>\n</tbody>\n</table>\n<div class=\"adm adm-tip\"><p class=\"adm-title\">If it drags</p><p>Marrow pays. She strolls into the impound office mid-haggle, counts out Grell's 510 from her winnings pouch, and tells the crew they owe her \"one page's worth\" — then races them anyway. It ends the scene and hands Scene 2 its fragment vector.</p></div>"}, {"sid": "s4", "title": "Scene 2 — The Race", "html": "<p>Frame it mechanically before anyone rolls: this session <em>is</em> the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:beacon-relighting\">beacon-relighting set piece</a>, run out of order. <strong>Wake it</strong> was done by an unknown hand — that mystery is the campaign's. The crew is now flying <strong>Chart it</strong>, and <strong>Speak to it</strong> waits at the station.</p>\n<p><strong>The jump.</strong> The Run's first dead leg — Bannistar Station toward Enarc — has decayed past its nav data: <strong>Hard Astrogation</strong>, exactly per the beacon rules. A rutter page bearing on the route adds a boost die — this is the fragment lesson, taught at the moment it matters. Jumping blind is legal but earns a setback die for sixty years of drift silt.</p>\n<p><strong>While the navigator plots</strong> — one supporting beat per other PC, so nobody watches one person roll:</p>\n<table>\n<thead>\n<tr>\n<th>Crewmate</th>\n<th>Check</th>\n<th>On success</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>The engineer</td>\n<td><strong>Average Mechanics</strong>, coaxing the heirloom drives</td>\n<td>Remove the setback from any Scene 1 hull damage, or clear 1 system strain mid-run.</td>\n</tr>\n<tr>\n<td>The slicer</td>\n<td><strong>Average Computers</strong>, scrubbing sixty years of silt from the nav data</td>\n<td>Add a boost die to the Astrogation check.</td>\n</tr>\n<tr>\n<td>The lookout</td>\n<td><strong>Average Perception</strong> at the reversion points</td>\n<td>The dead drift buoys read a heartbeat early — downgrade one Despair-shaped surprise to a Threat-shaped one, narratively.</td>\n</tr>\n<tr>\n<td>The captain</td>\n<td><strong>Average Leadership</strong>, calling the run</td>\n<td>Recover 2 strain across the crew; the ship flies like the crew believes in it.</td>\n</tr>\n</tbody>\n</table>\n<div class=\"adm adm-tip\"><p class=\"adm-title\">The house spends are live</p><p>This is the first scene where the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:dice-results\">Ember Age spend table</a> earns its keep: 2 Advantage on a relight stage hands a boost to whoever tackles the next one, 2 Threat on decayed-lane Astrogation leaks the route to a rival, and a Despair means the relight broadcasts wider than intended. Let a player find the table themselves; approve generously.</p></div>\n\n<p><strong>How they get the page</strong> — three vectors, use whichever the fiction reaches first:</p>\n<ul>\n<li><strong>The Marrow trade.</strong> <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-vess-marrow\">Captain Vess Marrow</a> owns a copy of Grandmother Osk's rutter. She will trade page 40 for the crew's signature backing the <em>Larksong</em> as co-witnesses at certification — both crews on the guild paper, whoever docks first. (If she paid Grell in Scene 1, this is the \"one page's worth\" coming home.)</li>\n<li><strong>The cantina purchase.</strong> A chart-broker under the depot gantry sells a fair copy for 80 scrip — or for the full, embarrassing story of how the crew lost their cargo. He collects embarrassments.</li>\n<li><strong>The dying spacer's gift.</strong> Tama Osk herself — the rutter's author, vacuum-lunged in the depot infirmary — gives the crew the original for a promise. Play her in her nineties and entirely unafraid: fifty years on the Duros Run, a dry rasp that costs her something to use, and one remaining want — to have the run she never finished finished under her name, said back into the lane by somebody who made it. (No stat block; she never leaves the infirmary bed.) The promise: <em>\"When it answers you, tell it Osk finished the run.\"</em> She says the claim aloud, free: \"That lane never went full dark. Something kept the buoys warm. I logged it, and nobody believed me.\" If the crew keeps the promise — says her name into the beacon's carrier during certification — give them a boost die on the Speak-to-it check, and note that Vhail hears it, and looks at the crew for the first time like they might be worth talking to.</li>\n</ul>\n<p>When the page lands, hand over the card and log it:</p>\n<div class=\"runact\" data-kind=\"fragment\" data-aid=\"m01-1\" data-args=\"{&quot;name&quot;: &quot;Grandmother Osk&#x27;s rutter, page 40&quot;, &quot;form&quot;: &quot;rutter&quot;, &quot;tag&quot;: &quot;Civic&quot;, &quot;question&quot;: &quot;Who lit Vesta-9?&quot;, &quot;claim&quot;: &quot;the lane was never fully dark&quot;, &quot;holder&quot;: &quot;crew&quot;, &quot;status&quot;: &quot;trusted&quot;}\"><button class=\"btn\">Issue fragment: Grandmother Osk&#x27;s rutter, page 40</button><span class=\"runact-desc\">Civic · bears on “Who lit Vesta-9?”</span></div>\n\n<div class=\"adm adm-tip\"><p class=\"adm-title\">Teach the subsystem out loud</p><p>Say the rules as you hand the card: it has a <strong>form</strong>, a <strong>tag</strong> (Civic), and it bears on a named <strong>Question</strong> — <em>Who lit Vesta-9?</em> It boosts related Knowledge checks; three fragments on one Question unlock a <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">Reconstruction</a>. Open the <a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">fragment tracker</a> where the players can see it. Fragments from different tags always disagree on one load-bearing fact — write Osk's claim down now so the contradiction is loaded before anyone notices.</p></div>\n\n<p><strong>Outcomes ladder:</strong></p>\n<table>\n<thead>\n<tr>\n<th>The roll</th>\n<th>What happens</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Success</td>\n<td>Clean jump. First ship in — except for the keeper already kneeling at the core. The crew gets perhaps an hour of quiet at the station before the sky fills.</td>\n</tr>\n<tr>\n<td>Success with 3+ Threat, or failure</td>\n<td>Slow jump: drift-silt reversions, two recalculations. They arrive to find the <a href=\"#\" class=\"xin\" data-nav=\"npc:ships--bns-steadfast-bastion-pattern-patrol-sloop\">BNS Steadfast, Bastion-pattern Patrol Sloop</a> already on station with its interdiction broadcast running.</td>\n</tr>\n<tr>\n<td>Despair (regardless of success)</td>\n<td>Misjump scare: reversion inside the shoal short of the station. The ship suffers 3 system strain and limps the last leg — the crew arrives <em>last</em>, standoff already assembled.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Neck-and-neck.</strong> Mid-run, the lane forces a mid-course recalculation at a collapsed drift buoy, and the <em>Larksong</em> reverts alongside. The crew's fresh solution shows what the older copies miss: the buoy's mass shadow has drifted into the third leg, dead across the <em>Larksong</em>'s plotted line. The choice: <strong>comm the warning</strong> — lose the lead, arrive together or second, and cement a friendship the campaign will spend for years — or <strong>stay silent</strong> — arrive first while the <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--larksong-crew\">Larksong crew</a> limps in behind a scarred hull, and start the rivalry cold. Do not soften it; the table should feel the price of whichever they buy.</p>"}, {"sid": "s5", "title": "Scene 3 — The Beacon", "html": "<blockquote>\n<p>The station hangs where the charts promised, and it is lit — running lights, docking ring, the long lattice of the beacon mast all burning like a festival. Under everything, on every band, the carrier hums: one clear note repeating its name to a galaxy that stopped listening. Nothing about it looks sixty years dead. Something about it looks <em>swept</em>.</p>\n</blockquote>\n<p><strong>Occupancy timeline</strong> — who is where, keyed to the Scene 2 ladder:</p>\n<table>\n<thead>\n<tr>\n<th>When</th>\n<th>On station</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Before anyone</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--keeper-adressa-vhail\">Keeper Adressa Vhail</a>, kneeling at the beacon core, praying. No ship anyone can find. She answers every \"how\" with a psalm about doors.</td>\n</tr>\n<tr>\n<td>The crew's arrival</td>\n<td>Per the outcomes ladder — first, second, or last.</td>\n</tr>\n<tr>\n<td>+40 minutes (or already there)</td>\n<td>The <a href=\"#\" class=\"xin\" data-nav=\"npc:ships--bns-steadfast-bastion-pattern-patrol-sloop\">BNS Steadfast, Bastion-pattern Patrol Sloop</a> arrives off its fleet tender's clamps, runs out its guns, and broadcasts: all vessels stand to for inspection under the Corridor Security Act — a law the Admiralty passed for itself.</td>\n</tr>\n<tr>\n<td>+90 minutes</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a>'s guild packet arrives trailing the swarm from the Drift. She requests docking \"as certifying observer,\" ink already wet.</td>\n</tr>\n<tr>\n<td>Throughout</td>\n<td>The arrival swarm: a dozen hulls from Okrent's Drift — and one that files no claim (see The Out).</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Running order.</strong> Let the scene breathe in this sequence, whatever the arrival math: (1) the crew and the empty, humming station — and Vhail, who does not look up; (2) the <em>Steadfast</em>'s broadcast, which turns every hopeful in the swarm into an audience; (3) the inspection; (4) Nerra's docking request, timed to interrupt whatever is tensest; (5) certification. Scene 4 detonates wherever the inspection reaches the aft hold.</p>\n<p><strong>The three-cornered standoff.</strong> This is a social scene with a warship in it, not a combat with dialogue. Each corner wants something <em>from the crew</em>, and each has a lever:</p>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--keeper-adressa-vhail\">Keeper Adressa Vhail</a></th>\n<th><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--commander-joss-reike\">Commander Joss Reike</a></th>\n<th><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Wants</strong></td>\n<td>The core treated as a shrine — no slicing, no salvage claim on the station — and the crew's honest account of their approach.</td>\n<td>All vessels stand to: manifests, inspection — and one signed line in his log that this corridor \"requires naval protection.\"</td>\n<td>To certify the relight with the crew signed as witnesses of record, and their observations of who lit it.</td>\n</tr>\n<tr>\n<td><strong>Lever</strong></td>\n<td>She knows more about the old network and the old Order than anyone else alive at this table. Answers are her currency; she trades them for reverence, never scrip.</td>\n<td>The only warship in the sky, and the procedure that justifies using it.</td>\n<td>No guild certificate, no first-lighting fee — and she decides whose names go on the paper.</td>\n</tr>\n<tr>\n<td><strong>Red line</strong></td>\n<td>Anyone cutting into the core housing, or claiming the Vigil blessed this lighting.</td>\n<td>Armed defiance, or humiliation in front of his marines.</td>\n<td>Forged guild marks, or claiming the fee around her.</td>\n</tr>\n<tr>\n<td><strong>Compliance earns</strong></td>\n<td>One true answer to any one question — a Jedi-tag lead — and the Vigil's doors marked friendly.</td>\n<td>Correct treatment, a fuel chit drawn on the <em>Steadfast</em>, a clean record in the log.</td>\n<td>The fee, the witness charter, accreditation — real value, honestly paid. Her Deception 3 is for what the offer <em>omits</em>.</td>\n</tr>\n<tr>\n<td><strong>Refusal earns</strong></td>\n<td>Your names in her psalter under a heading you cannot read; sealed places stay sealed to you.</td>\n<td>Refuse <em>lawfully</em>, on the record, and he salutes — he respects people who beat him by the book. Refuse unlawfully and the ladder starts.</td>\n<td>Perfect politeness, an \"unwitnessed\" filing,
