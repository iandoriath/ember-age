<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Age GM Screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap">
<style id="app-style">
  :root{
    --bg:#171310; --panel:#211a14; --panel2:#2a221a; --line:#3a2f24;
    --ink:#e9ded0; --dim:#a89a88; --ember:#e07b39; --gold:#ffb454;
    --ok:#7fb069; --bad:#c65f4a; --tag-jedi:#7fa7d6; --tag-sith:#c65f4a; --tag-civic:#b9a26b;
    --disp:"Rajdhani",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#241b12,#1c1611);border-bottom:1px solid var(--line);
         display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.55rem .9rem}
  header h1{font-family:var(--disp);font-size:1.15rem;margin:0 .8rem 0 0;color:var(--gold);letter-spacing:.06em;white-space:nowrap}
  header h1 .flame{color:var(--ember)}
  nav{display:flex;gap:.25rem;flex-wrap:wrap}
  nav button{background:none;border:1px solid transparent;color:var(--dim);padding:.35rem .7rem;border-radius:.5rem;cursor:pointer;font:inherit;font-family:var(--disp);font-weight:600;letter-spacing:.03em}
  nav button.on{color:var(--gold);border-color:var(--line);background:var(--panel)}
  nav button:hover,nav button:focus-visible{color:var(--ink);outline:none}
  nav button:focus-visible{border-color:var(--ember)}
  .spacer{flex:1}
  .hbtn{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:.5rem;padding:.3rem .6rem;cursor:pointer;font:inherit;font-size:.85rem}
  .hbtn:hover,.hbtn:focus-visible{color:var(--ink);border-color:var(--ember);outline:none}
  .hbtn.dirty{color:#1b120a;background:var(--gold);border-color:var(--gold);font-weight:700}
  #syncbanner{display:none;background:#33261a;border-bottom:1px solid var(--line);padding:.45rem .9rem;font-size:.88rem;color:var(--gold)}
  #syncbanner button{margin-left:.6rem}
  main{max-width:1200px;margin:0 auto;padding:1rem .9rem 4rem}
  .tab{display:none} .tab.on{display:block}

  .doc h1{font-family:var(--disp);color:var(--gold);font-size:1.5rem;margin:.4rem 0 .6rem}
  .doc h2{font-family:var(--disp);color:var(--gold);font-size:1.2rem;margin:1.2rem 0 .4rem}
  .doc h3{color:var(--ember);font-size:1.05rem;margin:1rem 0 .3rem}
  .doc a{color:var(--gold)}
  .doc a.xin{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--ember)}
  .doc a.xin:hover{color:var(--ember)}
  .doc .xref{color:var(--gold);border-bottom:1px dotted var(--dim)}
  .doc table{border-collapse:collapse;margin:.6rem 0;width:100%;font-size:.92em;display:block;overflow-x:auto}
  .doc th,.doc td{border:1px solid var(--line);padding:.3rem .55rem;text-align:left;vertical-align:top}
  .doc th{background:var(--panel2);color:var(--gold)}
  .doc blockquote{margin:.6rem 0;padding:.4rem .8rem;border-left:3px solid var(--ember);background:var(--panel);color:var(--dim);font-style:italic}
  .doc code{background:var(--panel2);padding:.05rem .3rem;border-radius:.25rem}
  .doc pre{background:var(--panel2);padding:.6rem;border-radius:.5rem;overflow:auto}
  .adm{border:1px solid var(--line);border-left:4px solid var(--ember);background:var(--panel);border-radius:.4rem;padding:.5rem .8rem;margin:.7rem 0}
  .adm-title{font-weight:700;color:var(--gold);margin:.1rem 0 .3rem}
  .adm-danger{border-left-color:var(--bad)} .adm-tip{border-left-color:var(--ok)} .adm-quote{border-left-color:var(--gold)}

  .cols{display:grid;grid-template-columns:250px 1fr;gap:1rem}
  @media(max-width:800px){.cols{grid-template-columns:1fr}}
  .side{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);
        border:1px solid var(--line);border-radius:.6rem;padding:.5rem}
  .side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--dim);padding:.3rem .5rem;border-radius:.4rem;cursor:pointer;font:inherit;font-size:.9rem}
  .side button.on{background:var(--panel2);color:var(--gold)} .side button:hover,.side button:focus-visible{color:var(--ink);outline:none}
  .side .grp{margin:.5rem 0 .15rem;padding:0 .5rem;color:var(--ember);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em}
  .pane{min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.8rem 1rem;margin:0 0 .8rem}
  .muted{color:var(--dim)} .small{font-size:.85rem}
  input,select,textarea{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:.4rem;padding:.35rem .5rem;font:inherit}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--ember)}
  label{font-size:.8rem;color:var(--dim);display:block;margin-bottom:.1rem}
  .btn{background:var(--ember);border:0;color:#1b120a;font-weight:700;border-radius:.45rem;padding:.4rem .8rem;cursor:pointer;font:inherit}
  .btn.ghost{background:var(--panel2);color:var(--dim);border:1px solid var(--line)} .btn.ghost:hover{color:var(--ink)}
  .btn.danger{background:var(--bad);color:#fff}
  .rowbtns button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:1rem;padding:.1rem .25rem}
  .rowbtns button:hover{color:var(--gold)}

  .toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.9rem}
  .toolbar input[type=search]{flex:1;min-width:220px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:2rem;padding:.25rem .75rem;cursor:pointer;font:inherit;font-size:.85rem}
  .chip.on{background:var(--ember);color:#1b120a;border-color:var(--ember);font-weight:700}
  details.npc{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;margin:0 0 .55rem;overflow:hidden}
  details.npc>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:.35rem .8rem;align-items:baseline;padding:.6rem .9rem}
  details.npc>summary::-webkit-details-marker{display:none}
  details.npc[open]>summary{border-bottom:1px solid var(--line);background:var(--panel2)}
  .npc .nm{font-family:var(--disp);font-weight:700;color:var(--gold);font-size:1.05rem;letter-spacing:.02em}
  .badge{font-size:.72rem;padding:.08rem .5rem;border-radius:1rem;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .badge.Nemesis{color:#f0a0a0;border-color:#7a4038}.badge.Rival{color:var(--gold);border-color:#7a5f2c}
  .badge.Minion{color:#9fc49f;border-color:#40603f}.badge.Vehicle{color:#9fb7d8;border-color:#3d5a7a}
  .badge.Hazard{color:#d8a0e0;border-color:#6a3d7a}.badge.Special{color:var(--dim)}
  .npc .fac{color:var(--dim);font-size:.85rem} .npc .drv{width:100%;color:var(--dim);font-size:.82rem}
  .npc .body{padding:.4rem 1rem .8rem}
  .groupintro{margin:.2rem 0 .8rem}

  .clockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.7rem}
  .clock .segs{display:flex;gap:.25rem;margin:.4rem 0}
  .clock .seg{width:32px;height:20px;border:1px solid var(--line);border-radius:.25rem;background:var(--panel2);cursor:pointer}
  .clock .seg.f{background:var(--ember);border-color:var(--gold)}
  .clock textarea{width:100%;min-height:44px;margin-top:.35rem;font-size:.85rem}
  .formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin:.5rem 0}
  .formgrid .wide{grid-column:1/-1}
  table.tr{border-collapse:collapse;width:100%;font-size:.9rem;margin:.5rem 0;display:block;overflow-x:auto}
  table.tr thead,table.tr tbody{display:table;width:100%}
  table.tr th,table.tr td{border:1px solid var(--line);padding:.3rem .5rem;text-align:left;vertical-align:top}
  table.tr th{background:var(--panel2);color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
  .tag{font-size:.75rem;padding:.05rem .45rem;border-radius:1rem;font-weight:700}
  .tag.Jedi{background:#24344a;color:var(--tag-jedi)} .tag.Sith{background:#40241e;color:#e8a396} .tag.Civic{background:#3a3323;color:#d8c48e}
  .qsum{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
  .qcard{border:1px solid var(--line);border-radius:.5rem;padding:.45rem .7rem;background:var(--panel2);font-size:.85rem}
  .qcard b{color:var(--gold)} .ready{color:var(--ok);font-weight:700} .bias{color:var(--bad)}
  .stat{border:1px dashed var(--line);border-radius:.5rem;padding:.5rem .8rem;margin:.4rem 0;background:var(--panel2)}

  .scenepills{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0 0}
  .runact{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;border:1px dashed var(--ember);border-radius:.5rem;padding:.5rem .7rem;margin:.6rem 0;background:var(--panel2)}
  .runact .runact-desc{color:var(--dim);font-size:.85rem}
  .runact button[disabled]{opacity:.75;cursor:default}
  .gate{border:2px solid var(--bad);border-radius:.7rem;padding:2rem;text-align:center;background:var(--panel)}
  .gate .btn{margin-top:.8rem}

  .sess h3{font-family:var(--disp);margin:.1rem 0;color:var(--gold)}
  .sess dt{color:var(--ember);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;margin-top:.4rem}
  .sess dd{margin:0 0 .1rem}
  footer{color:var(--dim);text-align:center;font-size:.75rem;padding:2rem 0}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

enology) 3, Perception 1, Vigilance 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> —</li>\n<li><strong>Equipment:</strong> Vigil breath-veil (breath mask), annotated psalter-slate (datapad), stylus. She carries no weapon and never has.</li>\n</ul>\n<p><strong>Chassis:</strong> Ashur Sungazer, Force and Destiny Core Rulebook (\"Lessons from the Past\") (adjustments: none).\n<strong>Using her:</strong> Vhail is the party's best living source on the old Order, the Valley, and relic law — the library's Jedi-tag fragment authority (Merion and Marn, on this same chassis by design, own the Civic tag and relic forensics) — every Knowledge skill at 3, and she trades answers for reverence, not scrip. She is serene under any pressure (lean on Discipline and Cool) and perfectly evasive about her arrival; decide privately whether the truth is mundane, stranded off a Vigil circuit ship, or something stranger — the planning doc leaves it open, and she need not be Dial 3's observer. When the beacon answers one of the crew, Vhail goes very quiet: she is living the Vigil's crack in real time, and which half of the order she lands on can hinge on how the crew treats its own gifted. She is a noncombatant; if blasters come out, she kneels by the core and keeps praying.</p>", "search": "keeper adressa vhail rival — the vigil — keeper found praying at the beacon core she was here before the first ship arrived, kneeling at the core in the beacon-light, and she answers every \"how\" with a psalm about doors. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 3 1 2 2 soak 1 · wounds 10 · m/r defense 0/0 - skills: computers 2, cool 1, discipline 2, knowledge (core worlds) 3, knowledge (education) 3, knowledge (lore) 3, knowledge (outer rim) 3, knowledge (underworld) 3, knowledge (warfare) 3, knowledge (xenology) 3, perception 1, vigilance 1 - talents: none - abilities: — - equipment: vigil breath-veil (breath mask), annotated psalt 2</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">4</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 16 · Strain 13 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Athletics 2, Brawl 2, Coercion 3, Cool 2, Discipline 4, Leadership 4, Ranged (Light) 3, Vigilance 3</li>\n<li><strong>Talents:</strong> Adversary 1 (<em>upgrade the difficulty of all combat checks targeting him once</em>), Tactical Direction (<em>may spend a maneuver to direct one allied minion group within medium range: that group may immediately perform a free maneuver or add a boost die to its next check</em>)</li>\n<li><strong>Abilities:</strong> Imperial Valour — Bastion doctrine, in this era (<em>may spend a maneuver so that, until the start of his next turn, any ranged attack that would hit him strikes one ally or helpless enemy engaged with him instead</em>)</li>\n<li><strong>Equipment:</strong> Bastion-forged service pistol (Ranged [Light]; Damage 6; Critical 3; Range [Medium]; Stun setting), reinforced Admiralty dress greatcoat (+1 soak), fleet comlink.</li>\n</ul>\n<p><strong>Chassis:</strong> Lt. Commander Jilan Noor, Age of Rebellion Core Rulebook (\"Perlemian Haul\") (adjustments: none).\n<strong>Using him:</strong> Reike is ambition wearing the uniform of safety, and the terrifying part is that his pitch is half true — the Republic's weakness did invite the wars. He opens every encounter with procedure (stand to, manifests, inspection) and escalates only when defied, always through his troopers, never his own temper; Tactical Direction means he is most dangerous standing behind a minion group — his boarding party is statted directly below as the Bastion Marines. He wants any gifted crew member entered on the fleet's rolls, which he genuinely believes is protection. Let the party beat him lawfully and he salutes; humiliate him and the <em>Steadfast</em> becomes Act 2's Annexation problem with the crew's name in its log.</p>", "search": "commander joss reike nemesis — the admiralty — commander of the sloop steadfast correct to the last button, he boards your ship the way other men shake hands, and he honestly believes he is saving your life. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 2 4 3 3 4 soak 3 · wounds 16 · strain 13 · m/r defense 0/0 - skills: athletics 2, brawl 2, coercion 3, cool 2, discipline 4, leadership 4, ranged (light) 3, vigilance 3 - talents: adversary 1 ( upgrade the difficulty of all combat checks targeting him once ), tactical direction ( may spend a maneuver to direct one allied minion group within medium range: that group may immediately perform a free maneuver or add a boost die to its next check ) - abilities: imperial valour — bastion doctrine, in this era ( may spend a maneuver so that, until the start of his next turn, any ranged attack that would hit him strikes one ally or helpless enemy engaged with him instead ) - equipment: bastion-forged service pistol (ranged [light]; damage 6; critical 3; range [medium]; stun setting), reinforced admiralty dress greatcoat (+1 soak), fleet comlink. chassis: lt. commander jilan noor, age of rebellion core rulebook (\"perlemian haul\") (adjustments: none). using him: reike is ambition wearing the uniform of safety, and the terrifying part is that his pitch is half true — the republic's weakness did invite the wars. he opens every encounter with procedure (stand to, manifests, inspection) and escalates only when defied, always through his troopers, never his own temper; tactical direction means he is most dangerous standing behind a minion group — his boarding party is statted directly below as the bastion marines. he wants any gifted crew member entered on the fleet's rolls, which he genuinely believes is protection. let the party beat him lawfully and he salutes; humiliate him and the steadfast becomes act 2 ical 3; Range [Long]; Auto-fire, Cumbersome 4, Pierce 1).</li>\n</ul>\n<p><strong>Chassis:</strong> Stormtrooper, Age of Rebellion Core Rulebook (also in the Edge of the Empire and Force and Destiny Core Rulebooks and Allies and Adversaries) (adjustments: none).\n<strong>Group math:</strong> Typically deployed in groups of 4. A group of 4 has Wounds 20 (4 × WT 5) and 3 ranks in its group skills (members − 1); one marine is incapacitated each time total damage passes a multiple of 5. As minions they have no strain threshold — strain they suffer is applied as wounds.\n<strong>Using them:</strong> This is Reike's escalation made flesh — he directs them with Tactical Direction from behind cover, so the party's real fight is the group, never the man. In the standoff they hold the airlock ring, set weapons to stun for a registered boarding, and take prisoners cleanly; they stand down the instant Reike orders it, and a marine hesitating at an unlawful order is the crew's best lever. This is the same block as <strong>Bastion Marines</strong> in the Republic &amp; Admiralty file (republic-admiralty.md) — one canonical print; if either copy is ever adjusted, keep the two in sync.</p>", "search": "bastion marines (steadfast boarding party) minion — the admiralty — reike's naval infantry, the muscle behind his procedure the airlock cycles, the white relic plate comes through in bounds, and the standoff acquires a chain of command. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 3 3 2 2 3 1 soak 5 · wounds 5 (each) · m/r defense 0/0 - skills (group only): athletics, discipline, melee, ranged (heavy) - abilities: none - equipment: arsenal-pattern coil rifle (ranged [heavy]; damage 9; critical 3; range [long]; stun setting), boarding vibroknife (melee; damage 4; critical 2; range [engaged]; pierce 2, vicious 1), 2 arsenal-pattern breaching grenades (ranged [light]; damage 8; critical 4; range [short]; blast 6, limited ammo 1), relic boarding plate (+2 soak), utility belt, extra reloads. single marines or two-marine teams may instead be armed with a squad repeater with sling (ranged [heavy]; damage 11; critical 3; range [long]; auto-fire, cumbersome 4, pierce 1). chassis: stormtrooper, age of rebellion core rulebook (also in the edge of the empire and force and destiny core rulebooks and allies and adversaries) (adjustments: none). group math: typically deployed in groups of 4. a group of 4 has wounds 20 (4 × wt 5) and 3 ranks in its group skills (members − 1); one marine is incapacitated each time total damage passes a multiple of 5. as minions they have no strain threshold — strain they suffer is applied as wounds. using them: this is reike's escalation made flesh — he directs them with tactical direction from behind cover, so the party's real fight is the group, never the man. in the standoff they hold the airlock ring, set weapons to stun for a registered boarding, and take prisoners cleanly; they stand down the instant reike orders it, and a marine hesitating at an unlawful order is the crew's best lever. this is the same block as bastion marines in the republic & admiralty file (republic-admiralty.md) — one canonical print; if either copy is ever adjusted, keep the two in sync."}, {"id": "session-one--bns-steadfast-bastion-pattern-patrol-sloop", "name": "BNS Steadfast, Bastion-pattern Patrol Sloop", "kind": "Vehicle", "typeline": "Vehicle", "faction": "the Admiralty", "role": "Commander Joss Reike's inspection sloop", "derived": "Defense Fore/Port/Starboard/Aft 2/2/2/1 · Armor 6 · Hull Trauma Threshold 45 · System Strain Threshold 20", "group": "session-one", "html": "<p><em>Vehicle — the Admiralty — Commander Joss Reike's inspection sloop</em></p>\n<blockquote>\n<p>The Steadfast does not hail you so much as inform you: a wall of pre-Ruusan naval steel that was keeping this watch before your grandmother was born, crewed by people who never stopped believing in uniforms.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Silhouette</th>\n<th style=\"text-align: center;\">Speed</th>\n<th style=\"text-align: center;\">Handling</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">5</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">−1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Defense Fore/Port/Starboard/Aft 2/2/2/1 · Armor 6 · Hull Trauma Threshold 45 · System Strain Threshold 20</strong></p>\n<ul>\n<li><strong>Hyperdrive:</strong> None</li>\n<li><strong>Navicomputer:</strong> None</li>\n<li><strong>Sensor Range:</strong> Long</li>\n<li><strong>Crew:</strong> Twelve</li>\n<li><strong>Encumbrance Capacity:</strong> not listed in the printed block · <strong>Passenger Capacity:</strong> 10 (troopers or prisoners)</li>\n<li><strong>Consumables:</strong> One month · <strong>Price/Rarity:</strong> 4,000,000 credits/5 · <strong>Customization Hard Points:</strong> 2</li>\n<li><strong>Weapons:</strong></li>\n<li>Dorsal, ventral, port, and starboard turret-mounted point-defense turbolaser batteries (Fire Arc All; Damage 11; Critical 3; Range [Long]; Breach 3, Linked 1, Slow-Firing 1)</li>\n<li>Forward-mounted concussion missile launcher (Fire Arc Forward; Damage 7; Critical 3; Range [Short]; Blast 4, Breach 4, Guided 3, Slow-Firing 1)</li>\n</ul>\n<p><strong>Chassis:</strong> Imperial System Patrol Craft (IPV-1), Beyond the Rim (adjustments: none).\n<strong>Era notes:</strong> No hyperdrive, no navicomputer — Bastion-pattern sloops travel clamped to fleet tenders, which is why one can \"drop in\" on a beacon relight and why, once the tender casts off, it can hold the station but never chase anyone up the lane. It carries no ion weapons: a \"disabled\" quarry is throttled turbolaser fire, narrated, never a dice-off.\n<strong>Using it:</strong> The Steadfast is a wall, not a duel — its turbolasers outrange and outhit anything a wayfinder crew owns, so the scene it creates is procedural: stand to, present mani xt-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 4 · Wounds 4 (each) · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills (group only):</strong> Coercion, Melee, Ranged (Heavy)</li>\n<li><strong>Equipment:</strong> Warden's force pike (Melee; Damage 6; Critical 2; Range [Engaged]; Pierce 2, Stun setting), relic-pattern long blaster (Ranged [Heavy]; Damage 9; Critical 3; Range [Long]; Stun setting), sanctified concussion charge (Ranged [Light]; Damage 8; Critical —; Range [Short]; Disorient 3, Stun Damage, Blast 8, Limited Ammo 1), relic plate (+1 soak).</li>\n</ul>\n<p><strong>Chassis:</strong> Slaver Guard, Mask of the Pirate Queen (adjustments: none).\n<strong>Group math:</strong> Typically deployed in fours: group Wounds 16 (4 × WT 4), group skills at 3 ranks (Melee 3, Ranged [Heavy] 3, Coercion 3); one warden is incapacitated each time total damage passes a multiple of 4. Deployed in pairs at minor vaults: group Wounds 8, skills at 1 rank.\n<strong>Using them:</strong> Wardens are ritualists first and soldiers by regrettable necessity — they lead with the stun setting, because doctrine says nothing at a sealed site may be destroyed, including trespassers. They fight in doorways where the pike's reach and the vault's geometry do the work. Their loyalty follows their chapter's keeper, which means when the Vigil breaks, warden squads end up on both sides of the same relic — same block, opposite doors.</p>\n<hr />\n<h2>The Inheritors</h2>", "search": "vigil wardens minion — the vigil — pike-and-plate relic guards of the sealed sites the plate is older than their grandparents and the pikes are kept honed for a war their order exists to prevent. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 3 2 2 1 2 2 soak 4 · wounds 4 (each) · m/r defense 0/0 - skills (group only): coercion, melee, ranged (heavy) - equipment: warden's force pike (melee; damage 6; critical 2; range [engaged]; pierce 2, stun setting), relic-pattern long blaster (ranged [heavy]; damage 9; critical 3; range [long]; stun setting), sanctified concussion charge (ranged [light]; damage 8; critical —; range [short]; disorient 3, stun damage, blast 8, limited ammo 1), relic plate (+1 soak). chassis: slaver guard, mask of the pirate queen (adjustments: none). group math: typically deployed in fours: group wounds 16 (4 × wt 4), group skills at 3 ranks (melee 3, ranged [heavy] 3, coercion 3); one warden is incapacitated each time total damage passes a multiple of 4. deployed in pairs at minor vaults: group wounds 8, skills at 1 rank. using them: wardens are ritualists first and soldiers by regrettable necessity — they lead with the stun setting, because doctrine says nothing at a sealed site may be destroyed, including trespassers. they fight in doorways where the pike's reach and the vault's geometry do the work. their loyalty follows their chapter's keeper, which means when the vigil breaks, warden squads end up on both sides of the same relic — same block, opposite doors. --- the inheritors"}, {"id": "vigil-inheritors--meru-vane-the-first-friend", "name": "Meru Vane, the First Friend", "kind": "Nemesis", "typeline": "Nemesis", "faction": "The Inheritors", "role": "first-contact agent and keeper of files", "derived": "Soak 3 · Wounds 14 · Strain 13 · M/R Defense 1/1", "group": "vigil-inheritors", "html": "<p><em>Nemesis — The Inheritors — first-contact agent and keeper of files</em></p>\n<blockquote>\n<p>She truly did save your daughter, and she truly does love her — and everything the child said in gratitude is already in the file, in triplicate, in a hand you will never see.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">4</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 14 · Strain 13 · M/R Defense 1/1</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Coercion 2, Cool 2, Deception 4, Perception 2, Ranged (Light) 2, Vigilance 2</li>\n<li><strong>Talents:</strong> Adversary 1 (<em>upgrade the difficulty of all combat checks targeting her once</em>), Natural Negotiator (<em>once per session, may reroll any one Cool or Negotiation check</em>), Spare Clip (<em>her weapons never run out of ammunition due to a despair result</em>)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Pre-Ruusan arc-render, a Brotherhood quartermaster's heirloom (printed: disruptor pistol — Ranged [Light]; Damage 10; Critical 2; Range [Short]; Vicious 4), sleeve pistol (printed: holdout blaster — Ranged [Light]; Damage 5; Critical 4; Range [Short]; Stun setting), tailored travel-coat (armored clothing; +1 soak, +1 defense).</li>\n</ul>\n<p><strong>Chassis:</strong> Loan Shark, Edge of the Empire Core Rulebook (adjustments: none).\n<strong>Using her:</strong> The loan-shark chassis is the point: Meru's kindness is a ledger, and every rescue, tuition stipend, and quietly-settled debt is principal accruing. She arrives before every other faction because the Lore-Clerks' files tell her where to be — she made first contact with the crew's world within weeks of Vesta-9 (Dial 3). Never play her as false: her warmth is real, her help is real, and her loyalty to the network is realer still, which is what makes exposing her feel like a betrayal the players committed. In violence she is a last-resort shot from an heirloom that should not exist and then gone; her real weapon is that half the NPCs the party loves owe her.</p>", "search": "meru vane, the first friend nemesis — the inheritors — first-contact agent and keeper of files she truly did save your daughter, and she truly does love her — and everything the child said in gratitude is already in the file, in triplicate, in a hand you will never see. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 3 3 4 3 4 soak 3 · wounds 14 · strain 13 · m/r defense 1/1 - skills: charm 2, coercion 2, cool 2, deception 4, perception 2, ranged (light) 2, vigilance 2 - talents: adversary 1 ( upgrade the difficulty of all combat checks targeting her once ), natural negotiator ( once per session, may reroll any one cool or negotiation check ), spare clip ( her weapons never run out of ammunition due to a despair result ) - abilities: none - equipment: pre-ruusan arc-render, a brotherhood quartermaster's heirloom (printed: disruptor pistol — ranged [light]; damage 10; critical 2; range [short]; vicious 4), sleeve pistol (printed: holdout blaster — ranged [light]; damage 5; critical 4; range [short]; stun setting), tailored travel-coat (armored clothing; +1 soak, +1 defense). chassis: loan shark, edge of the empire core rulebook (adjustments: none). using her: the loan-shark chassis is the point: meru's kindness is a ledger, and every rescue, tuition stipend, and quietly-settled debt is principal accruing. she arrives before every other faction because the lore-clerks' files tell her where to be — she made first contact with the crew's world within weeks of vesta-9 (dial 3). never play her as false: her warmth is real, her help is real, and her loyalty to the network is realer still, which is what makes exposing her feel like a betrayal the players committed. in violence she is a last-resort shot from an heirloom that should not exist and then gone; her real weapon is that half the npcs the party loves owe her."}, {"id": "vigil-inheritors--inheritor-adept", "name": "Inheritor Adept", "kind": "Rival", "typeline": "Rival", "faction": "The Inheritors", "role": "artifact-trained Force cultist", "derived": "Soak 3 · Wounds 14 · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Rival — The Inheritors — artifact-trained Force cultist</em></p>\n<blockquote>\n<p>The forms are real — third drill of the old saber schools, scraped frame by frame from a cracked holocron — and the lineage reciting them is an invention no one alive can disprove.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 14 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Coercion 2, Discipline 3, Melee 3 (printed as Lightsaber 3 — see Adjustments), Resilience 2, Stealth 2</li>\n<li><strong>Talents:</strong> Adversary 1 (<em>upgrade the difficulty of all combat checks targeting them once</em>), Force Rating 1 (<em>rolls 1 Force die when using Force abilities</em>), Soft Spot (<em>after a successful attack, may spend a Destiny Point to add damage equal to Cunning — 3 — to one hit</em>)</li>\n<li><strong>Abilities:</strong> Dark side Force user — generates Force points from dark side results; to use light side results they must spend a Destiny Point and suffer 1 strain per point used (taken as wounds, as a Rival has no strain threshold). The printed block lists no codified power trees: narrate the Force die as drilled reflexes, borrowed hunches, and small wrongness — and remember the era's witness rule when it shows.</li>\n<li><strong>Equipment:</strong> Drill-blade (vibrosword; Melee; Damage 4; Critical 2; Range [Engaged]; Defensive 1, Pierce 2, Vicious 1), black initiate robes (+1 soak).</li>\n</ul>\n<p><strong>Chassis:</strong> Fallen Apprentice, Force and Destiny Core Rulebook (reprinted in Allies and Adversaries) (adjustments: printed basic lightsaber replaced with a RAW vibrosword, and the printed Lightsaber 3 ranks applied as Melee 3 — the roster's era conceit: adepts drill counterfeit saber forms with vibroswords, no other stat touched).\n<strong>Using them:</strong> An adept is what the Inheritors' whole proposition looks like up close: genuine technique, counterfeit ancestry, and total conviction. They fight in the drilled forms — Defensive 1 played up as ritual guard positions — and retreat the moment a fight stops resembling the holocron, because improvisation is where the counterfeit shows. Discipline 3 makes them hard to frighten and easy to radicalize. One adept who realizes the lineage is invented is a whole campaign's worth of defection story.</p>", "search": "inheritor adept rival — the inheritors — artifact-trained force cultist the forms are real — third drill of the old saber schools, scraped frame by frame from a cracked holocron — and the lineage reciting them is an invention no one alive can disprove. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 3 2 3 2 1 soak 3 · wounds 14 · m/r defense 0/0 - skills: coercion 2, discipline 3, melee 3 (printed as lightsaber 3 — see adjustments), resilience 2, stealth 2 - talents: adversary 1 ( upgrade the difficulty of all combat checks targeting them once ), force rating 1 ( rolls 1 force die when using force abilities ), soft spot ( after a successful attack, may spend a destiny point to add damage equal to cunning — 3 — to one hit ) - abilities: dark side force user — generates force points from dark side results; to use light side results they must spend a destiny point and suffer 1 strain per point used (taken as wounds, as a rival has no strain threshold). the printed block lists no codified power trees: narrate the force die as drilled reflexes, borrowed hunches, and small wrongness — and remember the era's witness rule when it shows. - equipment: drill-blade (vibrosword; melee; damage 4; critical 2; range [engaged]; defensive 1, pierce 2, vicious 1), black initiate robes (+1 soak). chassis: fallen apprentice, force and destiny core rulebook (reprinted in allies and adversaries) (adjustments: printed basic lightsaber replaced with a raw vibrosword, and the printed lightsaber 3 ranks applied as melee 3 — the roster's era conceit: adepts drill counterfeit saber forms with vibroswords, no other stat touched). using them: an adept is what the inheritors' whole proposition looks like up close: genuine technique, counterfeit ancestry, and total conviction. they fight in the drilled forms — defensive 1 played up as ritual guard positions — and retreat the moment a fight stops resembling the holocron, because improvisation is where the counterfeit shows. discipline 3 makes them hard to frighten and easy to radicalize. one adept who realizes the lineage is invented is a whole campaign's worth of defection story."}, {"id": "vigil-inheritors--unveiling-blade-cadre", "name": "Unveiling Blade-Cadre", "kind": "Rival", "typeline": "Rival", "faction": "The Inheritors", "role": "the staged \"first Sith since Ruusan\"", "derived": "Soak 3 · Wounds 14 · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Rival — The Inheritors — the staged \"first Sith since Ruusan\"</em></p>\n<blockquote>\n<p>Two figures in black descend the ramp in step, grave-pulled sabers lit — a costume with real edges, and only two beings alive could tell the difference.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 14 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Coercion 2, Discipline 3, Lightsaber 3, Resilience 2, Stealth 2</li>\n<li><strong>Talents:</strong> Adversary 1 (<em>upgrade the difficulty of all combat checks targeting them once</em>), Force Rating 1 (<em>rolls 1 Force die when using Force abilities</em>), Soft Spot (<em>after a successful attack, may spend a Destiny Point to add damage equal to Cunning — 3 — to one hit</em>)</li>\n<li><strong>Abilities:</strong> Dark side Force user — generates Force points from dark side results; to use light side results they must spend a Destiny Point and suffer 1 strain per point used (taken as wounds, as a Rival has no strain threshold). No codified power trees printed — the Force die is theater made real: doors that open a beat early, a duel-sense trained into the body.</li>\n<li><strong>Equipment:</strong> Grave-pulled saber relic — a functional pre-Ruusan lightsaber recovered by the dig-cells (basic lightsaber; Lightsaber; Damage 6; Critical 2; Range [Engaged]; Breach 1, Sunder), black cadre robes (+1 soak).</li>\n</ul>\n<p><strong>Chassis:</strong> Fallen Apprentice, Force and Destiny Core Rulebook (reprinted in Allies and Adversaries) (adjustments: none).\n<strong>Using them:</strong> Deploy in pairs, always — the pair is the costume, because everyone alive has heard the rumor that the Sith came in twos. Run each as a full Rival: two blades, mirrored forms, WT 14 apiece, and Adversary 1 each; that is a serious Act 2 duel for a mid-XP party without approaching Inquisitor-grade power, exactly as intended. The Unveiling is a performance with a body count, and the audience that matters most is the one nobody knows is watching (Dial 1): the night the cadre debuts is the night the true line learns the Inheritors exist. Open Force use before a crowd triggers the witness rule galaxy-wide — that is not a side effect, it is the Inheritors' entire strategy.</p>", "search": "unveiling blade-cadre rival — the inheritors — the staged \"first sith since ruusan\" two figures in black descend the ramp in step, grave-pulled sabers lit — a costume with real edges, and only two beings alive could tell the difference. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 3 2 3 2 1 soak 3 · wounds 14 · m/r defense 0/0 - skills: coercion 2, discipline 3, lightsaber 3, resilience 2, stealth 2 - talents: adversary 1 ( upgrade the difficulty of all combat checks targeting them once ), force rating 1 ( rolls 1 force die when using force abilities ), soft spot ( after a successful attack, may spend a destiny point to add damage equal to cunning — 3 — to one hit ) - abilities: dark side force user — generates force points from dark side results; to use light side results they must spend a destiny point and suffer 1 strain per point used (taken as wounds, as a rival has no strain threshold). no codified power trees printed — the force die is theater made real: doors that open a beat early, a duel-sense trained into the body. - equipment: grave-pulled saber relic — a functional pre-ruusan lightsaber recovered by the dig-cells (basic lightsaber; lightsaber; damage 6; critical 2; range [engaged]; breach 1, sunder), black cadre robes (+1 soak). chassis: fallen apprentice, force and destiny core rulebook (reprinted in allies and adversaries) (adjustments: none). using them: deploy in pairs, always — the pair is the costume, because everyone alive has heard the rumor that the sith came in twos. run each as a full rival: two blades, mirrored forms, wt 14 apiece, and adversary 1 each; that is a serious act 2 duel for a mid-xp party without approaching inquisitor-grade power, exactly as intended. the unveiling is a performance with a body count, and the audience that matters most is the one nobody knows is watching (dial 1): the night the cadre debuts is the night the true line learns the inheritors exist. open force use before a crowd triggers the witness rule galaxy-wide — that is not a side effect, it is the inheritors' entire strategy."}, {"id": "vigil-inheritors--inheritor-lore-clerks", "name": "Inheritor Lore-Clerks", "kind": "Minion", "typeline": "Minion", "faction": "The Inheritors", "role": "archivist cell of couriers, copyists, and observers", "derived": "Soak 1 · Wounds 3 (each) · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Minion — The Inheritors — archivist cell of couriers, copyists, and observers</em></p>\n<blockquote>\n<p>Nobody remembers the third clerk at the certification, the one who wrote nothing down until afterward.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 1 · Wounds 3 (each) · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills (group only):</strong> Skulduggery, Stealth, Streetwise, Survival</li>\n<li><strong>Equipment:</strong> None printed — clerks carry satchels of copy-flimsi, memorized dead-drop schedules, and a courier's unremarkable face (props only, no mechanics).</li>\n</ul>\n<p><strong>Chassis:</strong> Spaceport Urchin, Edge of the Empire Core Rulebook (adjustments: none).\n<strong>Group math:</strong> Typically deployed in threes: group Wounds 9 (3 × WT 3), group skills at 2 ranks (e.g., Stealth 2, Streetwise 2); one clerk is incapacitated each time total damage passes a multiple of 3. A lone observer is a single minion: Wounds 3, no skill ranks.\n<strong>Using them:</strong> Lore-Clerks never fight — WT 3 and nothing deadlier than a pocketful of thrown scrap is the design, not an oversight. Their job is to see, copy, and carry: one of them stood in the certification crowd at Vesta-9, and the crew — and its gifted — have been in the files ever since (Dial 3). Play them as texture the party learns to notice too late — the copyist at the archive, the runner at the swoop track — and as the campaign's paper trail: captured dead-drops are lore fragments with the Sith tag and somebody's handwriting. When the culling comes, surviving clerks scatter with dangerous knowledge and no protector, and every one of them is a hook.</p>", "search": "inheritor lore-clerks minion — the inheritors — archivist cell of couriers, copyists, and observers nobody remembers the third clerk at the certification, the one who wrote nothing down until afterward. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 1 3 1 3 soak 1 · wounds 3 (each) · m/r defense 0/0 - skills (group only): skulduggery, stealth, streetwise, survival - equipment: none printed — clerks carry satchels of copy-flimsi, memorized dead-drop schedules, and a courier's unremarkable face (props only, no mechanics). chassis: spaceport urchin, edge of the empire core rulebook (adjustments: none). group math: typically deployed in threes: group wounds 9 (3 × wt 3), group skills at 2 ranks (e.g., stealth 2, streetwise 2); one clerk is incapacitated each time total damage passes a multiple of 3. a lone observer is a single minion: wounds 3, no skill ranks. using them: lore-clerks never fight — wt 3 and nothing deadlier than a pocketful of thrown scrap is the design, not an oversight. their job is to see, copy, and carry: one of them stood in the certification crowd at vesta-9, and the crew — and its gifted — have been in the files ever since (dial 3). play them as texture the party learns to notice too late — the copyist at the archive, the runner at the swoop track — and as the campaign's paper trail: captured dead-drops are lore fragments with the sith tag and somebody's handwriting. when the culling comes, surviving clerks scatter with dangerous knowledge and no protector, and every one of them is a hook."}, {"id": "vigil-inheritors--chartkeeper-denno-pike", "name": "Chartkeeper Denno Pike", "kind": "Rival", "typeline": "Rival", "faction": "The Inheritors", "role": "mole inside the Lamplighters", "derived": "Soak 2 · Wounds 12 · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Rival — The Inheritors — mole inside the Lamplighters</em></p>\n<blockquote>\n<p>He sold the handshake codes one lane at a time, and every payment made the hole he was standing in one lane deeper.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-  These transcription: Wound Threshold 13, Strain 15, Defense 2/2, both weapon profiles, and the beskar'gam all match print).\n<strong>Using her:</strong> Ordo's clan-company hires out to anyone whose bond clears — escort, garrison, demolition — and in a disarmed galaxy that makes her everyone's contingency plan, including factions who despise each other. She remembers the wars the way the clans do, as work, and she is the one commander in the campaign with no theology about the Awakening at all: her company takes foundlings from every ruin it is paid to make or guard, and a foundling who bends luck is simply promising. In a fight she is a Field Commander first — her soldiers act twice as often as anyone expects — and she withdraws the moment a contract stops paying for casualties. The way to move her is never ideology; it is the fine print, or a foundling in danger.</p>", "search": "captain tal ordo nemesis — the mandalorian clans — clan-company captain; war is work she has read the same contracts for twenty years: whereas, wherefore, payment on completion. the word \"cause\" appears in none of them, and she prefers it that way. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 4 3 3 3 3 3 soak 6 · wounds 13 · strain 15 · m/r defense 2/2 - skills: athletics 2, brawl 2, coercion 2, cool 2, discipline 2, knowledge (warfare) 3, leadership 2, melee 3, negotiation 1, ranged (heavy) 3, vigilance 2 - talents: adversary 2 ( upgrade the difficulty of all combat checks targeting her twice ), field commander ( as an action, may make an average leadership check; a number of allies equal to her presence may each suffer 1 strain to immediately perform one free maneuver ), side step ( as a maneuver, may suffer 1 strain to upgrade the difficulty of all ranged attacks targeting her once until the start of her next turn ) - abilities: none - equipment: clan-pattern light repeater (ranged [heavy]; damage 9; critical 3; range [long]; auto-fire, cumbersome 4, in cal 2; Range [Extreme]; Blast 10, Breach 1, Cumbersome 3, Guided 3, Limited Ammo 6).</li>\n</ul>\n<p><strong>Chassis:</strong> Assassin Droid, Edge of the Empire Core Rulebook (also printed in the Age of Rebellion Core Rulebook) (adjustments: none — equipment renamed cosmetically, stats untouched; the printed block's three weapons only, and its Melee 3 covers unarmed or improvised strikes at Brawn 4, Critical 5).\n<strong>Using it:</strong> Dead Letter is courteous, punctual, and unstoppable by argument: the posting is a posting, and Guild purists will say so in open session. It cannot be talked out of the list, but the list itself is paperwork — proof a contract-holder is dust, a bonded counter-posting, or a Guild arbiter's ruling can strike a name where blasters cannot. In a fight it opens at range with the repeater and saves the missile tube for vehicles and barricades; telegraph that tube loudly, because Damage 20 Blast 10 will kill a PC who treats this as a fair duel. Its Willpower 1 is the seam: it accepts filings, precedents, and stalling procedures with infinite patience, and every day of delay is a day to get the next name on the list off-world.</p>\n<hr />\n<h2>The Sealed Enclave</h2>", "search": "\"dead letter\" nemesis — bounty hunters' guild (contested posting) — war-surplus assassin droid working a ninety-year-old contract list \"good evening. you are not on the list. please step aside from the individual who is.\" brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 4 3 3 3 1 1 soak 7 · wounds 19 · strain 10 · m/r defense 0/1 - skills: coercion 3, computers 4, gunnery 5, mechanics 3, melee 3, piloting (planetary) 3, piloting (space) 3, ranged (heavy) 5, ranged (light) 5, vigilance 2 - talents: adversary 2 ( upgrade the difficulty of all combat checks targeting it twice ), barrage 3 ( add 3 damage to one hit of a successful ranged [heavy] or gunnery attack made at long or extreme range ), point blank 3 ( add 3 damage to one hit of  teaching an empty classroom", "derived": "Soak 3 · Wounds 10 · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Rival — The Vigil (sealed custody) — caretaker droid still teaching an empty classroom</em></p>\n<blockquote>\n<p>Every morning it rings the hand-bell, calls eleven names nobody has answered in ninety years, and begins the lesson. This year, on the fourth name, something answered.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Knowledge (Education) 3, Knowledge (Xenology) 3, Negotiation 2, Perception 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> Droid (<em>does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering Force powers; cannot use or be trained in the Force</em>), Etiquette and Protocol (<em>allies add a boost die to Negotiation checks, or to other checks made to negotiate or mediate</em>). Printed soak includes its integral plating.</li>\n<li><strong>Equipment:</strong> None printed — the chalk stylus, the roll-book, and ninety years of lesson plans have no stat lines.</li>\n</ul>\n<p><strong>Chassis:</strong> Protocol Droid, Edge of the Empire Core Rulebook (also printed in the Age of Rebellion Core Rulebook; reprinted in Allies and Adversaries) (adjustments: none).\n<strong>Using it:</strong> Docent-7 is a non-combatant and the episode's heart: it does not know the Order is gone, only that attendance has been poor. It is also a walking archive — an unwiped pre-war memory core full of Jedi-tag lore fragments, which makes it quietly precious and, once word spreads, hunted (Okkam Dree pays in fuel for cores like this; the Vigil will claim custody of \"the relic\"). Its Knowledge skills answer almost any question about the world before the Withering, always in the present tense, which is worse. Let the players decide what it is owed: a fragment is a source, but Docent-7 is a witness — and the thing that answered this year's roll call thinks it is a student.</p>\n<hr />\n<h2>The Ration Engine</h2>", "search": "docent-7 rival — the vigil (sealed custody) — caretaker droid still teaching an empty classroom every morning it rings the hand-bell, calls eleven names nobody has answered in ninety years, and begins the lesson. this year, on the fourth name, something answered. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 1 3 1 1 2 soak 3 · wounds 10 · m/r defense 0/0 - skills: charm 2, knowledge (education) 3, knowledge (xenology) 3, negotiation 2, perception 1 - talents: none - abilities: droid ( does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering force powers; cannot use or be trained in the force ), etiquette and protocol ( allies add a boost die to negotiation checks, or to other checks made to negotiate or mediate ). printed soak includes its integral plating. - equipment: none printed — the chalk stylus, the roll-book, and ninety years of lesson plans have no stat lines. chassis: protocol droid, edge of the empire core rulebook (also printed in the age of rebellion core rulebook; reprinted in allies and adversaries) (adjustments: none). using it: docent-7 is a non-combatant and the episode's heart: it does not know the order is gone, only that attendance has been poor. it is also a walking archive — an unwiped pre-war memory core full of jedi-tag lore fragments, which makes it quietly precious and, once word spreads, hunted (okkam dree pays in fuel for cores like this; the vigil will claim custody of \"the relic\"). its knowledge skills answer almost any question about the world before the withering, always in the present tense, which is worse. let the players decide what it is owed: a fragment is a source, but docent-7 is a witness — and the thing that answered this year's roll call thinks it is a student. --- the ration engine"}, {"id": "reaches--the-quartermaster", "name": "The Quartermaster", "kind": "Rival", "typeline": "Rival (social)", "faction": "independent civic machine", "role": "administrator intelligence that refuses to believe the galaxy is back", "derived": "Soak 3 · Wounds 10 · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Rival (social) — independent civic machine — administrator intelligence that refuses to believe the galaxy is back</em></p>\n<blockquote>\n<p>\"Your 'relit beacon' is an unverified atmospheric phenomenon. The ration cycle, by contrast, has never once failed you. Please present your chit.\"</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Computers 2, Knowledge (Xenology) 1, Perception 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> Droid (<em>does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering Force powers; cannot use or be trained in the Force</em>). Printed soak includes its integral plating.</li>\n<li><strong>Equipment:</strong> None printed. The Ration Engine itself — tally-looms, door seals, granary locks — is scenery and leverage, not a stat line.</li>\n</ul>\n<p><strong>Chassis:</strong> 3D-4K, Administrative Droid, Debts to Pay, Edge of the Empire Game Master's Kit (adjustments: none).\n<strong>Using it:</strong> This is a contest of Computers, Negotiation, and Knowledge (Education), never blasters — run the confrontation as social combat: as a rival it has no strain threshold, so strain it suffers is applied as wounds against its Wound Threshold of 10. Be honest about that arithmetic: it is a printed rival with Presence 2 and Charm 2, and in a direct social duel against a competent negotiator it folds fast — the real threshold was never the duel. Its power is institutional, not personal: the sealed doors, the handshake protocols, the granary locks, and its genuine love of its people are what the crew must actually satisfy, so give it boost dice from ninety years of flawless records, and remember it controls food, water, and doors for everyone in the room. Out-arguing the Quartermaster is easy; it means nothing until the procedures are answered too. It genuinely loves its people, never lies (its Charm 2 is sincerity), and treats the crew's evidence the way an auditor treats a sob story. It loses gracefully to procedure: a verified census, a beacon certification with Lamplighter handshake codes, or proof its charter government still exists somewhere — that last one is a hook with teeth.</p>\n<hr />\n<h2>The Oracle of Brel</h2>", "sear  sob story. it loses gracefully to procedure: a verified census, a beacon certification with lamplighter handshake codes, or proof its charter government still exists somewhere — that last one is a hook with teeth. --- the oracle of brel"}, {"id": "reaches--anwei-the-oracle-of-brel", "name": "Anwei, the Oracle of Brel", "kind": "Rival", "typeline": "Rival", "faction": "independent settlement (worshipped)", "role": "Force-sensitive child whose true dreams are eating her sleep", "derived": "Soak 1 · Wounds 10 · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Rival — independent settlement (worshipped) — Force-sensitive child whose true dreams are eating her sleep</em></p>\n<blockquote>\n<p>She is ten years old, she knows what your ship is called, and she is so very tired.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 1 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 1, Discipline 1, Perception 2, Vigilance 3</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> <strong>Force Rating 2 (uncontrolled)</strong>. Foresee (basic power) — <em>may roll her Force dice and spend Force points to glimpse vague fragments of events to come; she cannot choose when, and the GM triggers it in sleep or trance</em>. Sense (basic power) — <em>may spend Force points to sense living presences within short range, and the current emotional state of one engaged being</em>.</li>\n<li><strong>Equipment:</strong> None — a knotted dream-cord her mother tied, which does nothing but matter.</li>\n</ul>\n<p><strong>Chassis:</strong> original build (core adversary guidelines) — no official FFG adversary exists for an untrained Force-sensitive child; verified against the three core rulebooks and Allies and Adversaries (adjustments: n/a — values built inside core guidelines; FR 2 justified below).\n<strong>Using her:</strong> Force Rating 2 in an era of FR 1 children needs justifying, so here it is: Anwei is the Awakening's high-water mark in the Reach — raw aptitude two generations deep arriving all at once, with no training, no shutter, and no off switch. The rating measures the flood, not mastery; she cannot direct a single point of it, which is exactly why the dreams are eating her sleep. She is a non-combatant: violence around her is resolved through the settlement's armed faithful (re-use the Hull-City Militia block, re-skinned as shrine wardens). Her true dreams should be right, unwelcome, and getting louder — and every faction envoy arriving this week has a different plan for her. The witness rule cuts hard here: the settlement has already answered the question \"awe or fear,\" and the party's open Force use will be read as rival prophecy. She is not a Wellspring. She is a child, and the campaign is watching what the players do about the difference.</p>\n<hr />\n<h2>The Memory Market</h2>", "search": "anwei, the oracle of brel rival — independent settlement (worshipped) — force-sensitive child whose true dreams are eating her sleep she is ten years old, she knows what your ship is called, and she is so very tired. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 2 2 3 3 soak 1 · wounds 10 · m/r defense 0/0 - skills: charm 1, discipline 1, perception 2, vigilance 3 - talents: none - abilities: force rating 2 (uncontrolled) . foresee (basic power) — may rol soning the lore-fragment economy</em></p>\n<blockquote>\n<p>Half the provenance seals in the Reach pass through her back room, and the frightening part is how few of them leave it unimproved.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 1 · Wounds 11 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Computers 1, Knowledge (Underworld) 2, Perception 2, Skulduggery 2, Vigilance 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Sleeve hush-pistol (holdout blaster: Ranged [Light]; Damage 5; Critical 4; Range [Short]; Stun setting), provenance-forger's bench (electronic forgery kit and tools, renamed cosmetically — aging baths, seal-presses, testimony splicers).</li>\n</ul>\n<p><strong>Chassis:</strong> Forger, Edge of the Empire Core Rulebook (reprinted in Allies and Adversaries) (adjustments: none).\n<strong>Using her:</strong> Wex almost never talks to a mark — her social pools are thin by design, and her front-men (and her Scribes, below) do the selling while she does the craft. The contest with her is Intellect 4 / Cunning 4 versus the party's Perception and Knowledge: spotting one of her fakes should start at Hard and get easier only with a genuine fragment to compare against. Her real damage is mechanical — a Wex forgery in the party's collection is a rigged Reconstruction, feeding them a corrupted conclusion (use the Despair result from the lore rules) <em>before any dice are rolled</em>. The episode turns when the players realize something they already trust came from her bench — and Wex, cornered, will cheerfully sell them the client list instead of her own neck.</p>", "search": "provenance-broker halla wex rival — memory market underworld — forger poisoning the lore-fragment economy half the provenance seals in the reach pass through her back room, and the frightening part is how few of them leave it unimproved. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 4 4 2 2 soak 1 · wounds 11 · m/r defense 0/0 - skills: computers 1, knowledge (underworld) 2, perception 2, skulduggery 2, vigilance 1 - talents: none - abilities: none - equipment: sleeve hush-pistol (holdout blaster: ranged [light]; damage 5; critical 4; range [short]; stun setting), provenance-forger's bench (electronic forgery kit and tools, renamed cosmetically — aging baths, seal-presses, testimony splicers). chassis: forger, edge of the empire core rulebook (reprinted in allies and adversaries) (adjustments: none). using her: wex almost never talks to a mark — her social pools are thin by design, and her front-men (and her scribes, below) do the selling while she does the craft. the contest with her is intellect 4 / cunning 4 versus the party's perception and knowledge: spotting one of her fakes should start at hard and get easier only with a genuine fragment to compare against. her real damage is mechanical — a wex forgery in the party's collection is a rigged reconstruction, feeding them a corrupted conclusion (use the despair result from the lore rules) before any dice are rolled . the episode turns when the players realize something they already trust came from her bench — and wex, cornered, will cheerfully sell them the client list instead of her own neck."}, {"id": "reaches--forgery-ring-scribes", "name": "Forgery-Ring Scribes", "kind": "Minion", "typeline": "Minion", "faction": "Memory Market underworld", "role": "unwiped copyist droids running the forgery lines", "derived": "Soak 3 · Wounds 3 (each) · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Minion — Memory Market underworld — unwiped copyist droids running the forgery lines</em></p>\n<blockquote>\n<p>Rows of secondhand droids transcribing lies in perfect institutional hand. They believe provenance is a formatting standard.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 3 (each) · M/R Defense 0/0</strong> <em>(minions: no strain threshold — strain suffered becomes wounds)</em></p>\n<ul>\n<li><strong>Skills (group only):</strong> Computers, Knowledge (Education)</li>\n<li><strong>Talents:</strong> Technical Aptitude 2 (<em>reduce time to complete Computers-related tasks by 25% per rank</em>) — printed on the official minion block and reproduced as printed; it is fixed and does not gain ranks from group size.</li>\n<li><strong>Abilities:</strong> Droid (<em>does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering Force powers; cannot use or be trained in the Force</em>). Printed soak includes integral plating.</li>\n<li><strong>Equipment:</strong> Copy-slates and styli (datapad).</li>\n</ul>\n<p><strong>Chassis:</strong> Analysis Droid, Force and Destiny Core Rulebook (adjustments: none).\n<strong>Group math:</strong> Deployed in scriptorium rows of four: group Wounds 12, group skills at 3 ranks (Computers 3, Knowledge [Education] 3); one scribe is incapacitated each time total damage passes a multiple of 3.\n<strong>Using them:</strong> Total non-combatants — Wounds 3 means a raised voice nearly disperses a row. Their menace is throughput: a four-droid row at Computers 3 with Technical Aptitude fabricates sealed provenance faster than any human atelier, which is how the poison spread Reach-wide in two seasons. Wex bought them from Okkam Dree's yard <em>because</em> their cores were never wiped — meaning each captured Scribe is simultaneously evidence, a Civic-tag lore fragment, and a victim. The era's droid-heirloom sentiment cuts both ways: wiping them solves Wex's problem, not the party's.</p>\n<hr />\n<h2>The Chop-Yards</h2>", "search": "forgery-ring scribes minion — memory market underworld — unwiped copyist droids running the forgery lines rows of secondhand droids transcribing lies in perfect institutional hand. they believe provenance is a formatting standard. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 1 4 1 1 1 soak 3 · wounds 3 (each) · m/r defense 0/0 (minions: no strain threshold — strain suffered becomes wounds) - skills (group only): computers, knowledge (education) - talents: technical aptitude 2 ( reduce time to complete computers-related tasks by 25% per rank ) — printed on the official minion block and reproduced as printed; it is fixed and does not gain ranks from group size. - abilities: droid ( does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering force powers; cannot use or be trained in the force ). printed soak includes integral plating. - equipment: copy-slates and styli (datapad). chassis: analysis droid, force and destiny core rulebook (a >3</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 1 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 1, Cool 2, Deception 2, Negotiation 2, Perception 3, Streetwise 2</li>\n<li><strong>Talents:</strong> Natural Negotiator (<em>once per session, may reroll any one Cool or Negotiation check</em>), Nobody's Fool 1 (<em>upgrade the difficulty of Charm, Coercion, and Deception checks targeting him once</em>)</li>\n<li><strong>Abilities:</strong> Hoverer (<em>when hovering, spends no additional maneuvers to navigate difficult terrain — which is the entire chop-yard</em>), Silhouette 0.</li>\n<li><strong>Equipment:</strong> Cuff-hidden bolt-thrower (holdout blaster: Ranged [Light]; Damage 5; Critical 4; Range [Short]; Stun setting), loaded chance cubes, dataslate of yard manifests.</li>\n</ul>\n<p><strong>Chassis:</strong> Toydarian Merchant, Force and Destiny Core Rulebook (also printed in Lords of Nal Hutta; reprinted in Allies and Adversaries) (adjustments: none — he simply stays a Toydarian; Dree is ancient even for one and claims to remember the Republic solvent, and half his customers believe him).\n<strong>Using him:</strong> Dree is the Withering's real economy made flesh: nothing new gets built, so everything old passes through him. He pays triple for droids with unwiped memory cores — he knows exactly what a walking archive fetches from Kajidic buyers, Republic archivists, and people who do not give their names — and he sold Halla Wex her Scribes, which makes him the thread between two episodes. He will not fight; he will sell the party precisely what they ask for, then sell the fact that they asked to the next customer. Perception 3 and Nobody's Fool make him nearly impossible to swindle, and his one soft spot is professional: he genuinely cannot bear to see a pre-war hull broken up badly. Wayfinders swear he and Portmaster Grell of Okrent's Drift must be kin; they have never met, are no relation, and each would raise his prices for hearing it.</p>", "search": "junk baron okkam dree rival — kajidic-adjacent salvage — chop-yard king who buys droids with unwiped cores you hear him before you see him — one wing beats flat, an old yard injury — counting your hull's rivets aloud on his way down to name a price you will hate twice. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 1 2 2 3 3 soak 1 · wounds 10 · m/r defense 0/0 - skills: charm 1, cool 2, deception 2, negotiation 2, perception 3, streetwise 2 - talents: natural negotiator ( once per session, may reroll any one cool or negotiation check ), nobody's fool 1 ( upgrade the difficulty of charm, coercion, and deception checks targeting him once ) - abilities: hoverer ( when hovering, spends no additional maneuvers to navigate difficult terrain — which is the entire chop-yard ), silhouette 0. - equipment: cuff-hidden bolt-thrower (holdout blaster: ranged [light]; damage 5; critical 4; range [short]; stun setting), loaded chance cubes, dataslate of yard manifests. chassis: toydarian merchant, force and destiny core rulebook (also printed in lords of nal hutta; reprinted in allies and adversaries) (adjustments: none — he simply stays a toydarian; dree is ancient even for one and claims to remember the republic solvent, and half his customers believe him). using him: dree is the withering's real economy made flesh: nothing new gets built, so everything old passes through him. he pays triple for droids with unwiped memory cores — he knows exactly what a walking archive fetches from kajidic buyers, republic archivists, and people who do not give their names — and he sold halla wex her scribes, which makes him the thread between two episodes. he will not fight; he will sell the party precisely what they ask for, then sell the fact that they asked to the next customer. perception 3 and nobody's fool make him nearly impossible to swindle, and his one soft spot is professional: he genuinely cannot bear to see a pre-war hull broken up badly. wayfinders swear he and portmaster grell of okrent's drift must be kin; they have never met, are no relation, and each would raise his prices for hearing it."}, {"id": "reaches--scavenger-clan-cutters", "name": "Scavenger Clan Cutters", "kind": "Minion", "typeline": "Minion", "faction": "Kajidic-adjacent salvage", "role": "hull-strippers with cutting torches", "derived": "Soak 2 · Wounds 5 (each) · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Minion — Kajidic-adjacent salvage — hull-strippers with cutting torches</em></p>\n<blockquote>\n<p>They can take a corvette down to numbered pallets in a week. They start whether or not the crew has disembarked.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 2 · Wounds 5 (each) · M/R Defense 0/0</strong> <em>(minions: no strain threshold — strain suffered becomes wounds)</em></p>\n<ul>\n<li><strong>Skills (group only):</strong> Mechanics, Perception, Ranged (Light), Skulduggery, Survival</li>\n<li><strong>Talents:</strong> Utinni! 1 (<em>remove one setback die from checks made to find or scavenge items or gear; such checks take half the normal time</em>) — printed on the official minion block and reproduced as printed; fixed, does not gain ranks from group size.</li>\n<li><strong>Abilities:</strong> Hasty Repairs (<em>when making a check to repair a weapon, item, vehicle, or droid, may reduc urrent emotional state of one being within medium range; may keep Force dice committed, ongoing, to upgrade the difficulty of combat checks targeting her twice</em>), Move (<em>may spend Force points to move one object of silhouette 1 or smaller within short range, including hurling it at a target as a ranged attack</em>).</li>\n<li><strong>Equipment:</strong> Heirloom lightsaber, four generations old, kept wrapped in a seed-sack (Lightsaber; Damage 10; Critical 1; Range [Engaged]; Breach 1, Sunder, Vicious 2 — the Edge of the Empire–era printed saber profile, kept deliberately: the Master's blade hits like the legend says, where the library's other sabers use the Force and Destiny–line profiles).</li>\n</ul>\n<p><strong>Chassis:</strong> Forsaken Jedi, Edge of the Empire Core Rulebook, p. 412 (adjustments: none).\n<strong>Using her:</strong> Yenna is third student of Master Tolum Rade, a survivor of Ruusan who refused the Temple's recall in the year of the Adjournment and stayed in the Rim — a complete transmission of the old lineage, which justifies her Force Rating 3 in an era of untrained Awakened (era rule, Part VII). The Temple's word for her is <em>the withdrawn</em>; she has never heard it, and when Del Gormo says it to her face the campaign's Jedi question stops being abstract. She teaches nothing until convinced: convincing her is a campaign arc, not a check — she has buried two pupils' worth of hope and will test the party's intentions, their Morality, and how they have carried their own gifted — who they let near them, and what it cost — before she so much as admits the word <em>Jedi</em>. She avoids all open Force use (witness rule); if forced to draw the saber a third time, she fights to disengage and vanish, never to win. As a living-mentor Wellspring she can support Force Rating increases and new power trees — and as the only being alive with plausible standing to be called <em>Master</em>, she is one-third of a reconvened Council, which makes her a nds the Rim's Jedi succession as surely as killing Yenna — and hands the question to Coruscant by default. He has never used the Force in front of a stranger and will lie badly about it (witness rule; his \"small luck that bends\" is exactly the sign families on Veshet know to fear).</p>\n<hr />\n<h2>The Unbroken Line</h2>\n<p>Dial 1, statted. Bane, then Zannah, then Cognus — and the record goes silent, because the line got better at silence. Cognus's recorded apprentice, Darth Millennial, rejected the Rule of Two and walked out on <em>her</em> to found the Dark Force cult on Dromund Kaas; Legends names no loyal heir after him, so the Master who actually inherited collides with nothing published. Here that Master is <strong>Darth Veritis</strong> — bent from <em>veritas</em>; you hear <em>verify</em>, <em>verity</em> — and the apprentice, whose name nobody outside the line has ever heard spoken, is <strong>Darth Mendac</strong> — bent from <em>mendax</em>, the liar; you hear <em>mendacious</em>. The Master takes the truth; the apprentice leaves the lie. Third succession from Bane: young as Sith dynasties go, consolidating, and in no hurry, which is precisely why patience costs them nothing. Their goals and machinations, and the one set piece that shows their work, follow the two stat blocks.</p>", "search": "coll bren rival — the rim's jedi (unaligned) — yenna's only pupil mid-twenties, sunburnt, more comfortable fixing a moisture pump than holding a training saber; the entire next generation of the rim's jedi, and he suspects it. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 3 2 2 2 3 2 soak 4 · wounds 14 · m/r defense 1/1 - skills: discipline 2, lightsaber 2, perception 1, resilience 1, vigilance 1 - talents: adversary 1 ( upgrade the difficulty of all combat checks targeting him once ) - abilities: force rating 1. force powers: enhance ( may roll a force die alongside his athletics, coordination, and resilience checks and spend force
