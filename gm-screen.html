<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Age GM Screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap">
<style id="app-style">
  :root{
    --bg:#171310; --panel:#211a14; --panel2:#2a221a; --line:#3a2f24;
    --ink:#e9ded0; --dim:#a89a88; --ember:#e07b39; --gold:#ffb454;
    --ok:#7fb069; --bad:#c65f4a; --tag-jedi:#7fa7d6; --tag-sith:#c65f4a; --tag-civic:#b9a26b;
    --disp:"Rajdhani",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  html{--fs:1;font-size:calc(16px*var(--fs))}  /* --fs: the Aa text-size scale, 1 / 1.15 / 1.3 */
  body{background:var(--bg);color:var(--ink);font:.9375rem/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#241b12,#1c1611);border-bottom:1px solid var(--line);
         display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.55rem .9rem}
  header h1{font-family:var(--disp);font-size:1.15rem;margin:0 .8rem 0 0;color:var(--gold);letter-spacing:.06em;white-space:nowrap}
  header h1 .flame{color:var(--ember)}
  nav{display:flex;gap:.25rem;flex-wrap:wrap}
  nav button{background:none;border:1px solid transparent;color:var(--dim);padding:.35rem .7rem;border-radius:.5rem;cursor:pointer;font:inherit;font-family:var(--disp);font-weight:600;letter-spacing:.03em}
  nav button.on{color:var(--gold);border-color:var(--line);background:var(--panel)}
  nav button:hover,nav button:focus-visible{color:var(--ink);outline:none}
  nav button:focus-visible{border-color:var(--ember)}
  .spacer{flex:1}
  .hbtn{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:.5rem;padding:.3rem .6rem;cursor:pointer;font:inherit;font-size:.85rem}
  .hbtn:hover,.hbtn:focus-visible{color:var(--ink);border-color:var(--ember);outline:none}
  .hbtn.dirty{color:#1b120a;background:var(--gold);border-color:var(--gold);font-weight:700}
  #syncbanner{display:none;background:#33261a;border-bottom:1px solid var(--line);padding:.45rem .9rem;font-size:.88rem;color:var(--gold)}
  #syncbanner button{margin-left:.6rem}
  main{max-width:1200px;margin:0 auto;padding:1rem .9rem 4rem}
  .tab{display:none} .tab.on{display:block}
  .sub{display:none} .sub.on{display:block}
  .subnav{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .8rem}
  .subnav button{background:none;border:1px solid var(--line);color:var(--dim);padding:.3rem .7rem;border-radius:.5rem;cursor:pointer;font:inherit;font-family:var(--disp);font-weight:600}
  .subnav button.on{color:var(--gold);background:var(--panel)}
  /* Run cockpit: scene list · the scene · at-hand rail */
  .cockpit{display:grid;grid-template-columns:210px minmax(0,1fr) 330px;gap:.8rem;align-items:start}
  .cockpit .rail{position:sticky;top:64px;max-height:calc(100vh - 80px);overflow:auto}
  .scenelist{display:flex;flex-direction:column;gap:.25rem}
  .scenelist button{text-align:left;background:none;border:1px solid transparent;color:var(--dim);padding:.4rem .55rem;border-radius:.45rem;cursor:pointer;font:inherit;display:flex;gap:.45rem;align-items:baseline}
  .scenelist button.on{color:var(--gold);border-color:var(--line);background:var(--panel)}
  .scenelist button.done{opacity:.55;text-decoration:line-through}
  .scenelist .n{font-family:var(--disp);font-weight:700;min-width:1.2em;color:var(--ember)}
  .scenenav{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin:.2rem 0 .6rem}
  .athand h3{margin:.2rem 0 .4rem;color:var(--ember);font-size:.95rem}
  .athand>summary{cursor:pointer;color:var(--gold);font-family:var(--disp);font-weight:700;list-style:none;padding:.1rem 0 .4rem}
  .athand>summary::-webkit-details-marker{display:none} .athand>summary::before{content:"\25B8 ";color:var(--ember)} .athand[open]>summary::before{content:"\25BE "}
  .modsel{display:none;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:.5rem;padding:.5rem .6rem;width:100%;margin:0 0 .6rem}
  .scenenav .navlabel .short{display:none} .scenenav .btn{white-space:nowrap}
  .only-narrow{display:none} .htools{display:contents}
  .athand details.npc{margin:0 0 .4rem}
  .athand .mini{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.25rem 0;border-bottom:1px solid var(--line);font-size:.9rem}
  .athand .mini .segs{display:flex;gap:2px}
  .athand .mini .seg{width:14px;height:12px;border:1px solid var(--line);border-radius:2px;cursor:pointer}
  .athand .mini .seg.f{background:var(--ember);border-color:var(--ember)}
  .athand .b-lit{color:var(--gold)} .athand .b-dark{color:var(--dim)}
  #qs{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:50;display:flex;justify-content:center;align-items:flex-start;padding-top:12vh}
  #qs[hidden]{display:none}
  .qsbox{width:min(640px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.6rem}
  .qsbox input{width:100%;font:inherit;font-size:1.05rem;padding:.5rem .7rem;background:#1a140f;color:var(--ink);border:1px solid var(--line);border-radius:.4rem}
  #qs-out{max-height:50vh;overflow:auto;margin-top:.4rem}
  #qs-out button{display:flex;gap:.6rem;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:.4rem .5rem;border-radius:.4rem;cursor:pointer;font:inherit}
  #qs-out button.on,#qs-out button:hover{background:#2a211a}
  #qs-out .k{color:var(--dim);font-size:.8rem;min-width:4.5em}

  .doc h1{font-family:var(--disp);color:var(--gold);font-size:1.5rem;margin:.4rem 0 .6rem}
  .doc h2{font-family:var(--disp);color:var(--gold);font-size:1.2rem;margin:1.2rem 0 .4rem}
  .doc h3{color:var(--ember);font-size:1.05rem;margin:1rem 0 .3rem}
  .doc a{color:var(--gold)}
  .doc a.xin{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--ember)}
  .doc a.xin:hover{color:var(--ember)}
  .doc .xref{color:var(--gold);border-bottom:1px dotted var(--dim)}
  .doc table{border-collapse:collapse;margin:.6rem 0;width:100%;font-size:.92em}
  .doc .tw{overflow-x:auto;margin:.6rem 0;-webkit-overflow-scrolling:touch} .doc .tw table{margin:0}
  .doc table.wide td:first-child,.doc table.wide th:first-child{min-width:5.5em}   /* row labels (Wants / Lever) never break mid-word */
  .doc th,.doc td{border:1px solid var(--line);padding:.3rem .55rem;text-align:left;vertical-align:top}
  .doc th{background:var(--panel2);color:var(--gold)}
  .doc blockquote{margin:.6rem 0;padding:.4rem .8rem;border-left:3px solid var(--ember);background:var(--panel);color:var(--dim);font-style:italic}
  .doc code{background:var(--panel2);padding:.05rem .3rem;border-radius:.25rem}
  .doc pre{background:var(--panel2);padding:.6rem;border-radius:.5rem;overflow:auto}
  .adm{border:1px solid var(--line);border-left:4px solid var(--ember);background:var(--panel);border-radius:.4rem;padding:.5rem .8rem;margin:.7rem 0}
  .adm-title{font-weight:700;color:var(--gold);margin:.1rem 0 .3rem}
  .adm-danger{border-left-color:var(--bad)} .adm-tip{border-left-color:var(--ok)} .adm-quote{border-left-color:var(--gold)}

  .cols{display:grid;grid-template-columns:250px 1fr;gap:1rem}
  @media(max-width:800px){.cols{grid-template-columns:1fr}}
  .side{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);
        border:1px solid var(--line);border-radius:.6rem;padding:.5rem}
  .side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--dim);padding:.3rem .5rem;border-radius:.4rem;cursor:pointer;font:inherit;font-size:.9rem}
  .side button.on{background:var(--panel2);color:var(--gold)} .side button:hover,.side button:focus-visible{color:var(--ink);outline:none}
  .side .grp{margin:.5rem 0 .15rem;padding:0 .5rem;color:var(--ember);font-size:.72rem;text-transform:uppercase;letter-spacing:.1em}
  .pane{min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.8rem 1rem;margin:0 0 .8rem}
  .muted{color:var(--dim)} .small{font-size:.85rem}
  input,select,textarea{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:.4rem;padding:.35rem .5rem;font:inherit}
  input:focus,select:focus,textarea:focus{outline:1px solid var(--ember)}
  label{font-size:.8rem;color:var(--dim);display:block;margin-bottom:.1rem}
  .btn{background:var(--ember);border:0;color:#1b120a;font-weight:700;border-radius:.45rem;padding:.4rem .8rem;cursor:pointer;font:inherit}
  .btn.ghost{background:var(--panel2);color:var(--dim);border:1px solid var(--line)} .btn.ghost:hover{color:var(--ink)}
  .btn.danger{background:var(--bad);color:#fff}
  .rowbtns button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:1rem;padding:.1rem .25rem}
  .rowbtns button:hover{color:var(--gold)}

  .toolbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.9rem}
  .toolbar input[type=search]{flex:1;min-width:220px}
  .chip{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:2rem;padding:.25rem .75rem;cursor:pointer;font:inherit;font-size:.85rem}
  .chip.on{background:var(--ember);color:#1b120a;border-color:var(--ember);font-weight:700}
  details.npc{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;margin:0 0 .55rem;overflow:hidden}
  details.npc>summary{list-style:none;cursor:pointer;display:flex;flex-wrap:wrap;gap:.35rem .8rem;align-items:baseline;padding:.6rem .9rem}
  details.npc>summary::-webkit-details-marker{display:none}
  details.npc[open]>summary{border-bottom:1px solid var(--line);background:var(--panel2)}
  .npc .nm{font-family:var(--disp);font-weight:700;color:var(--gold);font-size:1.05rem;letter-spacing:.02em}
  .badge{font-size:.72rem;padding:.08rem .5rem;border-radius:1rem;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .badge.Nemesis{color:#f0a0a0;border-color:#7a4038}.badge.Rival{color:var(--gold);border-color:#7a5f2c}
  .badge.Minion{color:#9fc49f;border-color:#40603f}.badge.Vehicle{color:#9fb7d8;border-color:#3d5a7a}
  .badge.Hazard{color:#d8a0e0;border-color:#6a3d7a}.badge.Special{color:var(--dim)}
  .npc .fac{color:var(--dim);font-size:.85rem} .npc .drv{width:100%;color:var(--dim);font-size:.82rem}
  .npc .body{padding:.4rem 1rem .8rem}
  .groupintro{margin:.2rem 0 .8rem}

  .clockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.7rem}
  .clock .segs{display:flex;gap:.25rem;margin:.4rem 0}
  .clock .seg{width:32px;height:20px;border:1px solid var(--line);border-radius:.25rem;background:var(--panel2);cursor:pointer}
  .clock .seg.f{background:var(--ember);border-color:var(--gold)}
  .clock textarea{width:100%;min-height:44px;margin-top:.35rem;font-size:.85rem}
  .formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin:.5rem 0}
  .formgrid .wide{grid-column:1/-1}
  table.tr{border-collapse:collapse;width:100%;font-size:.9rem;margin:.5rem 0;display:block;overflow-x:auto}
  table.tr thead,table.tr tbody{display:table;width:100%}
  table.tr th,table.tr td{border:1px solid var(--line);padding:.3rem .5rem;text-align:left;vertical-align:top}
  table.tr th{background:var(--panel2);color:var(--gold);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
  .tag{font-size:.75rem;padding:.05rem .45rem;border-radius:1rem;font-weight:700}
  .tag.Jedi{background:#24344a;color:var(--tag-jedi)} .tag.Sith{background:#40241e;color:#e8a396} .tag.Civic{background:#3a3323;color:#d8c48e}
  .qsum{display:flex;flex-wrap:wrap;gap:.5rem;margin:.4rem 0}
  .qcard{border:1px solid var(--line);border-radius:.5rem;padding:.45rem .7rem;background:var(--panel2);font-size:.85rem}
  .qcard b{color:var(--gold)} .ready{color:var(--ok);font-weight:700} .bias{color:var(--bad)}
  .crewstats{display:flex;flex-wrap:wrap;gap:.35rem;margin:.5rem 0}
  .crewstats div{border:1px solid var(--line);border-radius:.4rem;padding:.25rem .55rem;text-align:center;min-width:3rem;background:var(--panel2)}
  .crewstats div b{display:block;font-family:var(--disp);font-size:1.1rem;color:var(--gold)} .crewstats div span{font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
  .crewstats .sep{border:0;background:none;min-width:.4rem;padding:0}
  .crewgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:.8rem}
  .crewgrid .k{font-family:var(--disp);font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;color:var(--ember);margin:.5rem 0 .2rem}
  .crewgrid ul{margin:.2rem 0 .2rem 1rem;padding:0}
  .dchip{display:inline-block;width:.8rem;height:.8rem;margin-right:2px;vertical-align:-2px}
  .dchip.bo{background:#4f86b0;width:.62rem;height:.62rem;border-radius:2px} .dchip.se{background:#3a3a3a;width:.62rem;height:.62rem;border-radius:2px}
  .dchip.ab,.dchip.di{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)} .dchip.ab{background:#3f7d3a} .dchip.di{background:#5c4a7d}
  .dchip.pr,.dchip.ch{clip-path:polygon(25% 4%,75% 4%,100% 50%,75% 96%,25% 96%,0 50%)} .dchip.pr{background:#c9a227} .dchip.ch{background:#a0312b}
  .stat{border:1px dashed var(--line);border-radius:.5rem;padding:.5rem .8rem;margin:.4rem 0;background:var(--panel2)}

  .scenepills{display:flex;flex-wrap:wrap;gap:.35rem;margin:.4rem 0 0}
  .runact{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;border:1px dashed var(--ember);border-radius:.5rem;padding:.5rem .7rem;margin:.6rem 0;background:var(--panel2)}
  .runact .runact-desc{color:var(--dim);font-size:.85rem}
  .runact button[disabled]{opacity:.75;cursor:default}
  .gate{border:2px solid var(--bad);border-radius:.7rem;padding:2rem;text-align:center;background:var(--panel)}
  .gate .btn{margin-top:.8rem}

  .sess h3{font-family:var(--disp);margin:.1rem 0;color:var(--gold)}
  .sess dt{color:var(--ember);font-size:.78rem;text-transform:uppercase;letter-spacing:.07em;margin-top:.4rem}
  .sess dd{margin:0 0 .1rem}
  footer{color:var(--dim);text-align:center;font-size:.75rem;padding:2rem 0}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

  /* Phones (portrait). Nearly every secondary size above is in rem, which keys off the browser's
     16px root, not the 15px body — so on a phone the .72–.85rem labels landed at 11–13px. Raising
     the root here scales all of them together; the rest is tap targets and keeping any long token
     from widening the layout (which makes mobile browsers zoom the whole page out). */
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  main{overflow-x:clip}
  /* stacked cockpit: narrow windows and ANY portrait viewport (a phone in desktop mode reports >1000px
     and still needs one column). Sits after the base rules so it actually overrides them. */
  @media (max-width:1000px), (orientation:portrait){
    .cockpit{grid-template-columns:minmax(0,1fr)} .cockpit .rail{position:static;max-height:none;padding:.5rem .6rem}   /* minmax(0,…): a wide table must scroll inside its card, never push the column open */
    .scenelist{flex-direction:row;flex-wrap:nowrap;overflow-x:auto;gap:.3rem;padding-bottom:.2rem} .scenelist button{white-space:nowrap;flex:0 0 auto}
    .cockpit .rail .small.hint{display:none}
    .toolbar{flex-wrap:nowrap;overflow-x:auto} .toolbar .chip{white-space:nowrap;flex:0 0 auto}
    .modchips{display:none} .modsel{display:block}
    .scenenav{gap:.4rem} .scenenav .navlabel .full{display:none} .scenenav .navlabel .short{display:inline}
    .doc .tw table.wide{min-width:40rem}
  }
  /* portrait gets bigger type (landscape phones already read well at the base size; Aa scales either) */
  @media (orientation:portrait){ html{font-size:calc(17px*var(--fs,1))} body{font-size:1.0625rem} }
  @media (max-width:640px){
    html{font-size:calc(18px*var(--fs,1))}
    body{font-size:1.0625rem;line-height:1.5}
    .doc,.npc .body,.card,.qcard,.clock,.sess{overflow-wrap:anywhere}
    header{position:static;gap:.45rem;padding:.5rem .7rem}
    .only-narrow{display:inline-block} .htools{display:none;width:100%;gap:.4rem} .htools.open{display:flex}  /* wrapped tabs make it ~200px tall; pinned, it would eat a quarter of a phone screen */
    header h1{font-size:1.2rem;margin-right:.4rem} header h1 .small{display:none}
    nav{width:100%;gap:.3rem;order:2} .htools{order:3}   /* title row keeps Aa and the menu; tabs wrap beneath it */
    nav button{padding:.5rem .8rem;font-size:1rem}
    .hbtn{padding:.45rem .7rem;font-size:.95rem}
    main{padding:.8rem .7rem 4rem}
    .doc h1{font-size:1.45rem} .doc h2{font-size:1.25rem} .doc h3{font-size:1.1rem}
    .doc table{font-size:.95em}
    .doc th,.doc td,table.tr th,table.tr td{padding:.4rem .5rem}
    .side{position:static;max-height:40vh}
    .side button{font-size:1rem;padding:.4rem .5rem} .side .grp{font-size:.8rem}
    .badge,.tag{font-size:.85rem} label,.sess dt{font-size:.95rem}
    .doc,.npc .body{font-size:1.05rem;line-height:1.55} .athand .mini{font-size:1rem} .scenelist button{font-size:1rem;padding:.5rem .7rem} .scenenav .btn{font-size:1rem}
    .small,.muted.small,.npc .fac,.npc .drv,.qcard,.chip,.runact .runact-desc,.clock textarea{font-size:.95rem}
    .crewstats div span{font-size:.72rem} .crewgrid .k{font-size:.8rem}
    .chip{padding:.4rem .85rem} .btn{padding:.5rem .9rem}
    .clock .seg{width:36px;height:24px}
    footer{font-size:.85rem}
  }
</style>
</head>
<body>
<header>
  <h1><span class="flame">◆</span> THE EMBER AGE <span class="small muted">GM screen</span></h1>
  <nav id="nav"></nav>
  <div class="spacer"></div>
  <button class="hbtn" id="fsbtn" onclick="cycleFs()" title="Text size (cycles 1x / 1.15x / 1.3x)">Aa</button>
  <button class="hbtn only-narrow" onclick="document.getElementById('htools').classList.toggle('open')" title="More">&#8943;</button>
  <div class="htools" id="htools">
  <button class="hbtn" id="syncchip" style="display:none" onclick="syncNow()">Sync</button>
  <button class="hbtn" onclick="exportState()">Export save</button>
  <button class="hbtn" onclick="document.getElementById('importfile').click()">Import</button>
  <input type="file" id="importfile" accept=".json" style="display:none" onchange="importState(this)">
  <button class="hbtn" onclick="resetState()">Reset</button>
  </div>
</header>
<div id="syncbanner"></div>
<main>
  <div id="tab-run" class="tab"></div>
  <div id="tab-crew" class="tab"></div>
  <div id="tab-npcs" class="tab"></div>
  <div id="tab-trackers" class="tab"></div>
  <div id="tab-log" class="tab"></div>
  <div id="tab-book" class="tab">
    <div class="subnav" id="booknav"></div>
    <div id="tab-reference" class="sub"></div>
    <div id="tab-setting" class="sub"></div>
  </div>
  <div id="qs" hidden><div class="qsbox"><input id="qs-in" placeholder="Jump to an NPC, page, or scene…  (Esc closes)" autocomplete="off"><div id="qs-out"></div></div></div>
</main>

eed</th>\n<th style=\"text-align: center;\">Handling</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\"><strong>4</strong></td>\n<td style=\"text-align: center;\">−1</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Defense Fore/Aft 1/1 · Armor 3 · Hull Trauma Threshold 22 · System Strain Threshold 15</strong></p>\n<ul>\n<li><strong>Hyperdrive:</strong> Primary: <strong>Class 1</strong>, Backup: <strong>none</strong> (see Adjustments)</li>\n<li><strong>Navicomputer:</strong> Yes</li>\n<li><strong>Sensor Range:</strong> Short</li>\n<li><strong>Crew:</strong> One pilot, one co-pilot/engineer (Marrow flies; her three deckhands rotate the second seat and the turrets)</li>\n<li><strong>Encumbrance Capacity:</strong> 165 · <strong>Passenger Capacity:</strong> 6</li>\n<li><strong>Consumables:</strong> Two months · <strong>Price/Rarity:</strong> 100,000 credits/4 · <strong>Customization Hard Points:</strong> 6 (two spent on the attachments below)</li>\n<li><strong>Weapons:</strong> One dorsal and one ventral turret-mounted medium laser cannon (Fire Arc All; Damage 6; Critical 3; Range [Close])</li>\n</ul>\n<p><strong>Chassis:</strong> YT-1300 Light Freighter, Edge of the Empire Core Rulebook (adjustments: declared — the stock block with two printed attachments installed at RAW cost, and one deliberate omission: (1) <strong>High-Output Ion Turbine</strong> (Edge of the Empire Core Rulebook): +1 Speed, so 4; (2) <strong>Hyperdrive Generator</strong> (Edge of the Empire Core Rulebook): the primary hyperdrive one class better, Class 2 → Class 1; (3) <strong>no backup hyperdrive</strong> — Marrow sold the Class 12 backup to the Bannistar chop-yard to make the generator's price. Confirm the two attachments' printed hard-point cost and prices against the book before the first roll that turns on them; everything else above is the YT-1300 as printed.)\n<strong>Era notes:</strong> This is what a first-lighting prize looks like when it is spent well. The Triffis fee went to the chop-yard under Okrent's Drift for a salvaged turbine and a generator pulled from a dead courier, and the yard quoted the crew the same work at a price they could not pay. Nothing about the <em>Larksong</em> is new; it is simply the one YT-1300 in the sector whose owner has been paid.\n<strong>Using it:</strong> The envy is calibrated on purpose: Speed 4 against the crew's 3, and Class 1 against their Class 2 — she wins every straight race and every jump, and \"the <em>Larksong</em> got there an hour ago\" is the hyperdrive math, not luck. Everything else is the same ship: same two turrets, same paper armor, same strain. The weaknesses are real and the players can find them. <strong>No backup hyperdrive:</strong> a Despair on her Astrogation, or a hit that drops the primary, leaves the <em>Larksong</em> drifting on a dead lane with no way home — Marrow knows it, which is why she only races lanes she holds a chart for, and why she wants the crew's page as much as they want hers. <strong>The turbine runs hot:</strong> after any chase flown at full speed, the GM may hang the Inferior quality on it until she has had a night in port (the lane-runner convention in the ships file). <strong>The prize is mostly gone:</strong> the pouch she pays Grell from is the last of it, and her hard points are two-thirds spent. And the hook under all of it: the turbine and the generator are RAW attachments at printed prices, sold by a yard that will sell the crew the same thing the day they have a prize of their own. The <em>Larksong</em> is not a better ship. It is a paid-for one. This is the same block as <strong>The Larksong</strong> in the ships file (<a href=\"#\" class=\"xin\" data-nav=\"npcs:group:ships\">ships.md</a>) — one canonical print; if either copy is ever adjusted, keep the two in sync.</p>", "search": "the larksong, prize-money yt-1300 vehicle — independent (captain vess marrow) — the rival's ship: the same pattern as yours, with the triffis prize spent on it same hull as half the rim, and you hear the difference before you see it: a new ion turbine that whistles clean where yours coughs, plating that has actually been painted this decade, and a name on the bow in gold leaf that somebody paid a real artist for. silhouette speed handling :-: :-: :-: 4 4 −1 defense fore/aft 1/1 · armor 3 · hull trauma threshold 22 · system strain threshold 15 - hyperdrive: primary: class 1 , backup: none (see adjustments) - navicomputer: yes - sensor range: short - crew: one pilot, one co-pilot/engineer (marrow flies; her three deckhands rotate the second seat and the turrets) - encumbrance capacity: 165 · passenger capacity: 6 - consumables: two months · price/rarity: 100,000 credits/4 · customization hard points: 6 (two spent on the attachments below) - weapons: one dorsal and one ventral turret-mounted medium laser cannon (fire arc all; damage 6; critical 3; range [close]) chassis: yt-1300 light freighter, edge of the empire core rulebook (adjustments: declared — the stock block with two printed attachments installed at raw cost, and one deliberate omission: (1) high-output ion turbine (edge of the empire core rulebook): +1 speed, so 4; (2) hyperdrive generator (edge of the empire core rulebook): the primary hyperdrive one class better, class 2 → class 1; (3) no backup hyperdrive — marrow sold the class 12 backup to the bannistar chop-yard to make the generator's price. confirm the two attachments' printed hard-point cost and prices against the book before the first roll that turns on them; everything else above is the yt-1300 as printed.) era notes: this is what a first-lighting prize looks like when it is spent well. the triffis fee went to the chop-yard under okrent's drift for a salvaged turbine and a generator pulled from a dead courier, and the yard quoted the crew the same work at a price they could not pay. nothing about the larksong is new; it is simply the one yt-1300 in the sector e column. The list is long, and she is not far into it.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 1 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Computers 2, Cool 1, Discipline 2, Knowledge (Core Worlds) 3, Knowledge (Education) 3, Knowledge (Lore) 3, Knowledge (Outer Rim) 3, Knowledge (Underworld) 3, Knowledge (Warfare) 3, Knowledge (Xenology) 3, Perception 1, Vigilance 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> —</li>\n<li><strong>Equipment:</strong> Vigil breath-veil (breath mask), necrology slate (datapad — the war dead in one column, and eighty years of margin notes), stylus. She carries no weapon and never has.</li>\n</ul>\n<p><strong>Chassis:</strong> Ashur Sungazer, Force and Destiny Core Rulebook (\"Lessons from the Past\") (adjustments: none).\n<strong>Using her:</strong> Vhail is the party's best living source on <strong>the war</strong> — its graves, its lineages, its law of relics — every Knowledge skill at 3, with the ledger the Core sanitized on her slate (the library's Jedi-tag fragment authority; Merion and Marn, on this same chassis by design, own the Civic tag and relic forensics). A coreward crew arrives knowing more than she does about the living Order; let them discover, fast, that she knows more than they do about everything the Order would ce Capacity:</strong> not listed in the printed block · <strong>Passenger Capacity:</strong> 10 (troopers or prisoners)</li>\n<li><strong>Consumables:</strong> One month · <strong>Price/Rarity:</strong> 4,000,000 credits/5 · <strong>Customization Hard Points:</strong> 2</li>\n<li><strong>Weapons:</strong></li>\n<li>Dorsal, ventral, port, and starboard turret-mounted point-defense turbolaser batteries (Fire Arc All; Damage 11; Critical 3; Range [Long]; Breach 3, Linked 1, Slow-Firing 1)</li>\n<li>Forward-mounted concussion missile launcher (Fire Arc Forward; Damage 7; Critical 3; Range [Short]; Blast 4, Breach 4, Guided 3, Slow-Firing 1)</li>\n</ul>\n<p><strong>Chassis:</strong> Imperial System Patrol Craft (IPV-1), Beyond the Rim (adjustments: none).\n<strong>Era notes:</strong> No hyperdrive, no navicomputer — Naboo-pattern sloops travel clamped to fleet tenders, which is why one can \"drop in\" on a beacon relight and why, once the tender casts off, it can hold the station but never chase anyone up the lane. It carries no ion weapons: a \"disabled\" quarry is throttled turbolaser fire, narrated, never a dice-off. The hull is itself intelligence: the Admiralty scouts with sloops and makes statements with heavier hulls — Vesta-9 got a picket sent to look, not a fleet sent to hold, and a sharp crew can read the fleet's distance and caution from what it chose to risk. Her answer to a swarm is arithmetic, not mass: twelve crew cannot board a dozen hulls and do not need to — the gun ladder means she only ever needs one example, which nobody volunteers to be.\n<strong>Using it:</strong> The Steadfast is a wall, not a duel — its turbolasers outrange and outhit anything a wayfinder crew owns, so the scene it creates is procedural: stand to, present manifests, submit to boarding (those ten passenger berths are Reike's inspection party, or your cell). Let the players win against the paperwork, the commander's rigidity, or the tender schedule, never the guns. This is the same block as <strong>NAS Steadfast, Naboo-pattern Patrol Sloop</strong> in the ships file (<a href=\"#\" class=\"xin\" data-nav=\"npcs:group:ships\">ships.md</a>) — one canonical print; if either copy is ever adjusted, keep the two in sync.</p>", "search": "nas steadfast, naboo-pattern patrol sloop vehicle — the admiralty — commander joss reike's inspection sloop the steadfast does not hail you so much as inform you: a wall of pre-ruusan naval steel that was keeping this watch before your grandmother was born, crewed by people who never stopped believing in uniforms. silhouette speed handling :-: :-: :-: 5 3 −1 defense fore/port/starboard/aft 2/2/2/1 · armor 6 · hull trauma threshold 45 · system strain threshold 20 - hyperdrive: none - navicomputer: none - sensor range: long - crew: twelve - encumbrance capacity: not listed in the printed block · passenger capacity: 10 (troopers or prisoners) - consumables: one month · price/rarity: 4,000,000 credits/5 · customization hard points: 2 - weapons: - dorsal, ventral, port, and starboard turret-mounted point-defense turbolaser batteries (fire arc all; damage 11; critical 3; range [long]; breach 3, linked 1, slow-firing 1) - forward-mounted concussion missile launcher (fire arc forward; damage 7; critical 3; range [short]; blast 4, breach 4, guided 3, slow-firing 1) chassis: imperial system patrol craft (ipv-1), beyond the rim (adjustments: none). era notes: no hyperdrive, no navicomputer — naboo-pattern sloops travel clamped to fleet tenders, which is why one can \"drop in\" on a beacon relight and why, once the tender casts off, it can hold the station but never chase anyone up the lane. it carries no ion weapons: a \"disabled\" quarry is throttled turbolaser fire, narrated, never a dice-off. the hull is itself intelligence: the admiralty scouts with sloops and makes statements with heavier hulls — vesta-9 got a picket sent to look, not a fleet sent to hold, and a sharp crew can read the fleet's distance and caution from wh ity</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 4 · Wounds 15 · Strain 20 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Astrogation 2, Brawl 2, Charm 3, Coercion 3, Cool 4, Discipline 4, Knowledge (Education) 3, Knowledge (Lore) 4, Knowledge (Outer Rim) 4, Knowledge (Warfare) 5, Knowledge (Xenology) 5, Leadership 5, Melee 3, Perception 4, Ranged (Light) 2, Vigilance 4</li>\n<li><strong>Talents:</strong> Adversary 2 (<em>upgrade the difficulty of all combat checks targeting her twice</em>), Command 3 (<em>adds three boost dice to her Leadership checks; those she commands add a boost die to their Discipline checks to follow her orders for the next 24 hours</em>), Commanding Presence 2 (<em>remove two setback dice from her Leadership and Cool checks</em>), Nobody's Fool 2 (<em>upgrade the difficulty of Charm, Coercion, and Deception checks against her twice</em>)</li>\n<li><strong>Abilities:</strong> Fleet low-light oculars (<em>surgical implants, an heirloom naval augmetic — the printed Infravision ability under a cosmetic name: remove up to one setback die imposed on her checks by darkness or poor lighting</em>); Art of War (<em>once per session, may make a Hard Knowledge [Lore], Knowledge [Outer Rim], or Knowledge [Xenology] check to study an opponent, species, or organization; each success grants one automatic success on all checks she makes against that target until the end of the session</em>)</li>\n<li><strong>Equipment:</strong> Her grandmother's presentatio >\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">4</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 1 · Wounds 13 · Strain 15 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Discipline 2, Knowledge (Education) 3, Knowledge (Lore) 4, Leadership 3, Negotiation 3</li>\n<li><strong>Talents:</strong> Command 2 (<em>adds two boost dice to his Leadership checks; those he commands add a boost die to their Discipline checks to follow his orders for the next 24 hours</em>), Inspiring Rhetoric (<em>action: makes an Average Leadership check; each success lets one ally within short range recover 1 strain, and each advantage may be spent to let an affected ally recover 1 more</em>), Kill with Kindness 2 (<em>removes two setback dice from his Charm and Leadership checks</em>), Nobody's Fool 2 (<em>upgrade the difficulty of Charm, Coercion, and Deception checks targeting him twice</em>)</li>\n<li><strong>Abilities:</strong> Invoke the First Terms (printed as \"Invoke Doellin\") — <em>(Invoke Doellin rules text unverified against print — GM should check Strongholds of Resistance, Kinyen chapter, and use the printed wording.)</em></li>\n<li><strong>Equipment:</strong> The First Staff (staff of office; ceremonial, no combat profile printed), keeper's grey robes, ledger-slate (datapad), short-range comlink, 500 in chapter scrip.</li>\n</ul>\n<p><strong>Chassis:</strong> Doellinist High Priest, Strongholds of Resistance (adjustments: none).\n<strong>Using him:</strong> Odran Su's chapter was founded by Gran grave-tenders from the Ruusan burial details, and its inner circle is still largely Gran — which is why his printed congregation ability, a Gran devotional invocation, still earns its keep at the table. He never fights; he rules rooms, invokes the deed of the Council's last act, and makes refusing him feel like desecrating a grave. Play his failing memory as the engine of his hardness: each session he remembers one less true thing about the war and forbids one more thing in the dead's name. When the Vigil breaks (Act 2), he is the half that comes armed — with wardens, writs, and absolute sincerity that the Awakened are sacrilege walking in children's bodies.</p>", "search": "first keeper odran su nemesis — the vigil — hardliner first keeper of a dying doctrine he was a boy at the last of the great burials, and that memory is failing him now — so he grips the doctrine instead; and doctrine, unlike memory, does not soften. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 3 2 2 4 soak 1 · wounds 13 · strain 15 · m/r defense 0/0 - skills: charm 2, discipline 2, knowledge (education) 3, knowledge (lore) 4, leadership 3, negotiation 3 - talents: command 2 ( adds two boost dice to his leadership checks; those he commands add a boost die to their discipline checks to follow his orders for the next 24 hours ), inspiring rhetoric ( action: makes an average leadership check; each success lets one ally within short range recover 1 strain, and each advantage may be spent to let an affected ally recover 1 more ), kill with kindness 2 ( removes two setback dice from his charm and leadership checks ), nobody's fool 2 ( upgrade the difficulty of charm, coercion, and deception checks targeting him twice ) - abilities: invoke the first terms (printed as \"invoke doellin\") — (invoke doellin rules text unverified against print — gm should check strongholds of resistance, kinyen chapter, and use the printed wording.) - equipment: the first staff (staff of office; ceremonial, no combat profile printed), keeper's grey robes, ledger-slate (datapad), short-range comlink, 500 in chapter scrip. chassis: doellinist high priest, strongholds of resistance (adjustments: none). using him: odran su's chapter was founded by gran grave-tenders from the ruusan burial details, and its inner circle is still largely gran — which is why his printed congregation ability, a gran devotional invocation, still earns its keep at the table. he never fights; he rules rooms, invokes the deed of the council's last act, and makes refusing him feel like desecrating a grave. play his failing memory as the engine of his hardness: each session he remembers one less true thing about the war and forbids one more thing in the dead's name. when the vigil breaks (act 2), he is the half that comes armed — with wardens, writs, and absolute sincerity that the awakened are sacrilege walking in children's bodies."}, {"id": "vigil-inheritors--keeper-tessa-marn", "name": "Keeper Tessa Marn", "kind": "Rival", "typeline": "Rival", "faction": "The Vigil", "role": "reformer keeper and relic-scholar", "derived": "Soak 1 · Wounds 10 · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Rival — The Vigil — reformer keeper and relic-scholar</em></p>\n<blockquote>\n<p>She authenticated a saber-hilt with steady hands, then wept in the vault after the pilgrims left — because the hands that made it are being born again, and her Order calls that a threat.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 1 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Computers 2, Cool 1, Discipline 2, Knowledge (Core Worlds) 3, Knowledge (Education) 3, Knowledge (Lore) 3, Knowledge (Outer Rim) 3, Knowledge (Underworld) 3, Knowledge (Warfare) 3, Knowledge (Xenology) 3, Perception 1, Vigilance 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Dust-veil (breath mask, for the sealed vaults), archive slate (datapad), copyist's stylus. She carries no weapon and never has.</li>\n</ul>\n<p><strong>Chassis:</strong> Ashur Sungazer, Force and Destiny Core Rulebook (included adventure \"Lessons from the Past\") (adjustments: none).\n<strong>Using her:</strong> Tessa is the library's relic-forensics examiner — provenance, wear-patterns, and forgery tells on physical artifacts (Vhail and Merion, on this same chassis by design, own the Jedi and Civic fragment tags) — and the Vigil's quiet heresy: she has been forging custody paperwork to move Awakened children out of hardline chapters' reach, one family at a time. Every Knowledge skill at rank 3 makes her a walking Reconstruction scene — and a catastrophic loss if Odran Su ever audits her ledgers. She is a Rival with Wound Threshold 10 and no defenses; if violence finds her, that is the story failing, and she will say so. Her price for help is always the same: the party carries one more family somewhere safe.</p>", "search": "keeper tessa marn rival — the vigil — reformer keeper and relic-scholar she authenticated a saber-hilt with steady hands, then wept in the vault after the pilgrims left — because the hands that made it are being born again, and her order calls that a threat. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 3 1 2 2 soak 1 · wounds 10 · m/r defense 0/0 - skills: computers 2, cool 1, discipline 2, knowledge (core worlds) 3, knowledge (education) 3, knowledge (lore) 3, knowledge (outer rim) 3, knowledge (underworld) 3, knowledge (warfare) 3, knowledge (xenology) 3, perception 1, vigilance 1 - talents: none - abilities: none - equipment: dust-veil (breath mask, for the sealed vaults), archive slate (datapad), copyist's stylus. she carries no weapon and never has. chassis: ashur sungazer, force and destiny core rulebook (included adventure \"lessons from the past\") (adjustments: none). using her: tessa is the library's relic-forensics examiner — provenance, wear-patterns, and forgery tells on physical artifacts (vhail and merion, on this same chassis by design, own the jedi and civic fragment tags) — and the vigil's quiet heresy: she has been forging custody paperwork to move awakened children out of hardline chapters' reach, one family at a time. every knowledge skill at rank 3 makes her a walking reconstruction scene — and a catastrophic loss if odran su ever audits her ledgers. she is a rival with wound threshold 10 and no defenses; if violence finds her, that is the story failing, and she will say so. her price for help is always the same: the party carries one more family somewhere safe."}, {"id": "vigil-inheritors--vigil-wardens", "name": "Vigil Wardens", "kind": "Minion", "typeline": "Minion", "faction": "The Vigil", "role": "pike-and-plate relic guards of the sealed sites", "derived": "Soak 4 · Wounds 4 (each) · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Minion — The Vigil — pike-and-plate relic guards of the sealed sites</em></p>\n<blockquote>\n<p>The plate is older than their grandparents and the pikes are kept honed for a war their order exists to prevent.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 4 · Wounds 4 (each) · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills (group only):</strong> Coercion, Melee, Ranged (Heavy)</li>\n<li><strong>Equipment:</strong> Warden's force pike (Melee; Damage 6; Critical 2; Range [Engaged]; Pierce 2, Stun setting), relic-pattern long blaster (Ranged [Heavy]; Damage 9; Critical 3; Range [Long]; Stun setting), sanctified concussion charge (Ranged [Light]; Damage 8; Critical —; Range [Short]; Disorient 3, Stun Damage, Blast 8, Limited Ammo 1), relic plate (+1 soak).</li>\n</ul>\n<p><strong>Chassis:</strong> Slaver Guard, Mask of the Pirate Queen (adjustments: none).\n<strong>Group math:</strong> Typically deployed in fours: group Wounds 16 (4 × WT 4), group skills at 3 ranks (Melee 3, Ranged [Heavy] 3, Coercion 3); one warden is incapacitated each time total damage passes a multiple of 4. Deployed in pairs at minor vaults: group Wounds 8, skills at 1 rank.\n<strong>Using them:</strong> Wardens are ritualists first and soldiers by regrettable necessity — they lead with the stun setting, because doctrine says nothing at a sealed site may be destroyed, including trespassers. They fight in doorways where the pike's reach and the vault's geometry do the work. Their loyalty follows their chapter's keeper, which means when the Vigil breaks, warden squads end up on both sides of the same relic — same block, opposite doors.</p>\n<hr />", "search": "vigil wardens minion — the vigil — pike-and-plate relic guards of the sealed sites the plate is older than their grandparents and the pikes are kept honed for a war their order exists to prevent. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 3 2 2 1 2 2 soak 4 · wounds 4 (each) · m/r defense 0/0 - skills (group only): coercion, melee, ranged (heavy) - equipment: warden's force pike (melee; damage 6; critical 2; range [engaged]; pierce 2, stun setting), relic-pattern long blaster (ranged [heavy]; damage 9; critical 3; range [long]; stun setting), sanctified concussion charge (ranged [light]; damage 8; critical —; range [short]; disorient 3, stun damage, blast 8, limited ammo 1), relic plate (+1 soak). chassis: slaver guard, mask of the pirate queen (adjustments: none). group math: typically deployed in fours: group wounds 16 (4 × wt 4), group skills at 3 ranks (melee 3, ranged [heavy] 3, coercion 3); one warden is incapacitated each time total damage passes a multiple of 4. deployed in pairs at minor vaults: group wounds 8, skills at 1 rank. using them: wardens are ritualists first and soldiers by regrettable necessity — they lead with the stun setting, because doctrine says nothing at a sealed site may be destroyed, including trespassers. they fight in doorways where the pike's reach and the vault's geometry do the work. their loyalty follows their chapter's keeper, which means when the vigil breaks, warden squads end up on both sides of the same relic — same block, opposite doors. ---"}, {"id": "vigil-inheritors--set-piece-the-unbroken-seal", "name": "Set piece — The Unbroken Seal", "kind": "Special", "typeline": "Revelation encounter", "faction": "the Scrub's crime surfaces", "role": "run it mid–Act 1 or in Act 2, at any Vigil-kept vault the story reaches", "derived": "", "group": "vigil-inheritors", "html": "<p><em>Revelation encounter — the Scrub's crime surfaces — run it mid–Act 1 or in Act 2, at any Vigil-kept vault the story reaches</em></p>\n<blockquote>\n<p>Three hours of liturgy to open a door nobody ever forced. Behind it, dust outlines where the relics stood.</p>\n</blockquote>\n<p><strong>Setup.</strong> Any honest reason to unseal a Vigil vault works: a provenance dispute the crew brought them, Tane's accreditation survey, the codicil question, the <em>Sealed Enclave</em> seed — or the crew's own earned access. What matters is that the Vigil opens the door <em>willingly, by the rite, for the first time in eighty years</em>, with the crew standing witness.</p>\n<p><strong>The rite is the scene.</strong> The necrology read at the threshold — the site's own dead, by name, and it takes hours; the wax and scripture peeled in strict order; the keeper's hands unsteady with the honor of it. Give the liturgy real screen time, because the scene's whole power is the gap between the ceremony and what it opens onto: a bare room. Dust outlines on the shelves. One relic left on the central plinth.</p>\n<p><strong>The truth.</strong> The seal is honest — that is the horror. The Scrub came <strong>through the stone</strong>: a bored shaft from an adjacent gallery, cut with months of patience and re-mortared behind them, decades ago. The doctrine wasn't fooled; it was irrelevant. Everything genuinely of the war is gone, the one piece left behind is a counterfeit (Scrub doctrine: the galaxy is to be left <em>wrong</em>, not ignorant), and the theft is older than anyone in the room.</p>\n<p><strong>Reading the room</strong> (RAW difficulties; a failed check says nothing, a despair says something false):</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Check</th>\n<th>What it gives</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Perception or Skulduggery, Hard</strong></td>\n<td>The re-mortared bore behind the reliquary shelving — entry through the rock, the seal never touched. The craftsmanship says months of work; the dust says decades ago.</td>\n</tr>\n<tr>\n<td><strong>Knowledge (Lore), Hard</strong> <em>(Average with a Sith-tagged fragment)</em></td>\n<td>The plinth-piece is a counterfeit — left deliberately, not forgotten. Whoever chose could tell true from false at a glance.</td>\n</tr>\n<tr>\n<td><strong>Knowledge (Warfare or Education), Average</strong></td>\n<td>The missing inventory skews: everything of the <em>war</em> taken — records, regalia, the site's true relics — while devotional copies elsewhere in the shrine stand untouched. This was a reader, not a looter.</td>\n</tr>\n<tr>\n<td><strong>Vigilance (or Sense), Average</strong></td>\n<td>The room is quiet the way the Emptied House is quiet: whatever the Force could feel here left long ago. The gifted feel nothing where the manifest promises weight.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>What it does to the Vigil.</strong> The keeper's crisis lands first — then the order's. A quiet audit of seals begins (a season of circuit ships, checking); the early returns are bad, and both halves of the crack weaponize them: the wardens read it as <em>seal deeper, trust no one</em>; the Order-reborn wing reads it as proof the watch failed <strong>because</strong> it refused to wield. Advance the Vigil clock. If Vhail is present and trusted, this is her hour.</p>\n<p><strong>The campaign hook.</strong> The audit's pattern is Ladder evidence of the first order: the emptied vaults track the relighting sequence <em>years ahead of the light</em> — proof that someone holding the patron's order has been working the dark country (rungs 1–2, <a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">Faction Clocks</a>), and the Vigil's dated seal-audits are exactly the kind of <em>filed</em> documentation the Ladder pays for. From this night on, the war's grave-keepers are the Ladder's best archive and its most motivated clients. (The Emptied House, below, is this scene's dark twin: there the fakes stay on their plinths to tell a lie; here the bareness tells the truth. The full doctrine is the Scrub, in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>.)</p>\n<h2>The Inheritors</h2>", "search": "set piece — the unbroken seal revelation encounter — the scrub's crime surfaces — run it mid–act 1 or in act 2, at any vigil-kept vault the story reaches three hours of liturgy to open a door nobody ever forced. behind it, dust outlines where the relics stood. setup. any honest reason to unseal a vigil vault works: a provenance dispute the crew brought them, tane's accreditation survey, the codicil question, the sealed enclave seed — or the crew's own earned access. what matters is that the vigil opens the door willingly, by the rite, for the first time in eighty years , with the crew standing witness. the rite is the scene. the necrology read at the threshold — the site's own dead, by name, and it takes hours; the wax and scripture peeled in strict order; the keeper's hands unsteady with the honor of it. give the liturgy real screen time, because the scene's whole power is the gap between the ceremony and what it opens onto: a bare room. dust outlines on the shelves. one relic left on the central plinth. the truth. the seal is honest — that is the horror. the scrub came through the stone : a bored shaft from an adjacent gallery, cut with months of patience and re-mortared behind them, decades ago. the doctrine wasn't fooled; it was irrelevant. everything genuinely of the war is gone, the one piece left behind is a counterfeit (scrub doctrine: the galaxy is to be left wrong , not ignorant), and the theft is older than anyone in the room. reading the room (raw difficulties; a failed check says nothing, a despair says something false): check what it gives --- --- perception or skulduggery, hard the re-mortared bore behind the reliquary shelving — entry through the rock, the seal never touched. the craftsmanship says months of work; the dust says decades ago. knowledge (lore), hard (average with a sith-tagged fragment) the plinth-piece is a counterfeit — left deliberately, not forgotten. whoever chose could tell true from false at a glance. knowledge (warfare or education), average the missing inventory skews: everything of the war taken — records, regalia, the site's true relics — while devotional copies elsewhere in the shrine stand untouched. this was a reader, not a looter. vigilance (or sense), average the room is quiet the way the emptied house is quiet: whatever the force could feel here left long ago. the gifted feel nothing where the manifest promises weight. what it does to the vigil. the keeper's crisis lands first — then the order's. a quiet audit of seals begins (a season of circuit ships, checking); the early returns are bad, and both halves of the crack weaponize them: the wardens read it as seal deeper, trust no one ; the order-reborn wing reads it as proof the watch failed because it refused to wield. advance the vigil clock. if vhail is present and trusted, this is her hour. the campaign hook. the audit's pattern is ladder evidence of the first order: the emptied vaults track the relighting sequence years ahead of the light — proof that someone holding the patron's order has been working the dark country (rungs 1–2, [faction clocks](../tools/faction-clocks.md)), and the vigil's dated seal-audits are exactly the kind of filed documentation the ladder pays for. from this night on, the war's grave-keepers are the ladder's best archive and its most motivated clients. (the emptied house, below, is this scene's dark twin: there the fakes stay on their plinths to tell a lie; here the bareness tells the truth. the full doctrine is the scrub, in [keepers of the flame](keepers.md).) the inheritors"}, {"id": "vigil-inheritors--meru-vane-the-first-friend", "name": "Meru Vane, the First Friend", "kind": "Nemesis", "typeline": "Nemesis", "faction": "The Inheritors", "role": "first-contact agent and keeper of files", "derived": "Soak 3 · Wounds 14 · Strain 13 · M/R Defense 1/1", "group": "vigil-inheritors", "html": "<p><em>Nemesis — The Inheritors — first-contact agent and keeper of files</em></p>\n<blockquote>\n<p>She truly did save your daughter, and she truly does love her — and everything the child said in gratitude is already in the file, in triplicate, in a hand you will never see.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">4</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 3 · Wounds 14 · Strain 13 · M/R Defense 1/1</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Coercion 2, Cool 2, Deception 4, Perception 2, Ranged (Light) 2, Vigilance 2</li>\n<li><strong>Talents:</strong> Adversary 1 (<em>upgrade the difficulty of all combat checks targeting her once</em>), Natural Negotiator (<em>once per session, may reroll any one Cool or Negotiation check</em>), Spare Clip (<em>her weapons never run out of ammunition due to a despair result</em>)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Pre-Ruusan arc-render, a Brotherhood quartermaster's heirloom (printed: disruptor pistol — Ranged [Light]; Damage 10; Critical 2; Range [Short]; Vicious 4), sleeve pistol (printed: holdout blaster — Ranged [Light]; Damage 5; Critical 4; Range [Short]; Stun setting), tailored travel-coat (armored clothing; +1 soak, +1 defense).</li>\n</ul>\n<p><strong>Chassis:</strong> Loan Shark, Edge of the Empire Core Rulebook (adjustments: none).\n<strong>Using her:</strong> The loan-shark chassis is the point: Meru's kindness is a ledger, and every rescue, tuition stipend, and quietly-settled debt is principal accruing. She arrives before every other faction because the Lore-Clerks' files tell her where to be — she made first contact with the crew's world within weeks of Vesta-9 (Dial 3). Never play her as false: her warmth is real, her help is real, and her loyalty to the network is realer still, which is what makes exposing her feel like a betrayal the players committed. In violence she is a last-resort shot from an heirloom that should not exist and then gone; her real weapon is that half the NPCs the party loves owe her.</p>", "search": "meru vane, the first friend nemesis — the inheritors — first-contact agent and keeper of files she truly did save your daughter, and she truly does love her — and everything the child said in gratitude is already in the file, in triplicate, in a hand you will never see. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 3 3 4 3 4 soak 3 · wounds 14 · strain 13 · m/r defense 1/1 - skills: charm 2, coercion 2, cool 2, deception 4, perception 2, ranged (light) 2, vigilance 2 - talents: adversary 1 ( upgrade the difficulty of all combat checks targeting her once ), natural negotiator ( once per session, may reroll any one cool or negotiation check ), spare clip ( her weapons never run out of ammunition due to a despair result ) - abilities: none - equipment: pre-ruusan arc-render, a brotherhood quartermaster's heirloom (printed: disruptor pistol — ranged [light]; damage 10; critical 2; range [short]; vicious 4), sleeve pistol (printed: holdout blaster — ranged [light]; damage 5; critical 4; range [short]; stun setting), tailored travel-coat (armored clothing; +1 soak, +1 defense). chassis: loan shark, edge of the empire core rulebook (adjustments: none). using her: the loan-shark chassis is the point: meru's kindness is a ledger, and every rescue, tuition stipend, an ors--unveiling-blade-cadre", "name": "Unveiling Blade-Cadre", "kind": "Rival", "typeline": "Rival", "faction": "The Inheritors", "role": "the staged \"first Sith since Ruusan\"", "derived": "Soak 3 · Wounds 14 · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Rival — The Inheritors — the staged \"first Sith since Ruusan\"</em></p>\n<blockquote>\n<p>Two figures in black descend the ramp in step, grave-pulled sabers lit — a costume with real edges, and only two beings alive could tell the difference.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 3 · Wounds 14 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Coercion 2, Discipline 3, Lightsaber 3, Resilience 2, Stealth 2</li>\n<li><strong>Talents:</strong> Adversary 1 (<em>upgrade the difficulty of all combat checks targeting them once</em>), Force Rating 1 (<em>rolls 1 Force die when using Force abilities</em>), Soft Spot (<em>after a successful attack, may spend a Destiny Point to add damage equal to Cunning — 3 — to one hit</em>)</li>\n<li><strong>Abilities:</strong> Dark side Force user — generates Force points from dark side results; to use light side results they must spend a Destiny Point and suffer 1 strain per point used (taken as wounds, as a Rival has no strain threshold). No codified power trees printed — the Force die is theater made real: doors that open a beat early, a duel-sense trained into the body.</li>\n<li><strong>Equipment:</strong> Grave-pulled saber relic — a functional pre-Ruusan lightsaber recovered by the dig-cells (basic lightsaber; Lightsaber; Damage 6; Critical 2; Range [Engaged]; Breach 1, Sunder), black cadre robes (+1 soak).</li>\n</ul>\n<p><strong>Chassis:</strong> Fallen Apprentice, Force and Destiny Core Rulebook (reprinted in Allies and Adversaries) (adjustments: none).\n<strong>Using them:</strong> Deploy in pairs, always — the pair is the costume, because everyone alive has heard the rumor that the Sith came in twos. Run each as a full Rival: two blades, mirrored forms, WT 14 apiece, and Adversary 1 each; that is a serious Act 2 duel for a mid-XP party without approaching Inquisitor-grade power, exactly as intended. The Unveiling is a performance with a body count, and the audience that matters most is the one nobody knows is watching (Dial 1): the night the cadre debuts is the night the true line learns the Inheritors exist. Open Force use before a crowd triggers the witness rule galaxy-wide — that is not a side effect, it is the Inheritors' entire strategy.</p>", "search": "unveiling blade-cadre rival — the inheritors — the staged \"first sith since ruusan\" two figures in black descend the ramp in step, grave-pulled sabers lit — a costume with real edges, and only two beings alive could tell the difference. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 3 2 3 2 1 soak 3 · wounds 14 · m/r defense 0/0 - skills: coercion 2, discipline 3, lightsaber 3, resilience 2, stealth 2 - talents: adversary 1 ( upgrade the difficulty of all combat checks targeting them once ), force rating 1 ( rolls 1 force die when using force abilities ), soft spot ( after a successful attack, may spend a destiny point to add damage equal to cunning — 3 — to one hit ) - abilities: dark side force user — generates force points from dark side results; to use light side results the ntellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 1 · Wounds 3 (each) · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills (group only):</strong> Skulduggery, Stealth, Streetwise, Survival</li>\n<li><strong>Equipment:</strong> None printed — clerks carry satchels of copy-flimsi, memorized dead-drop schedules, and a courier's unremarkable face (props only, no mechanics).</li>\n</ul>\n<p><strong>Chassis:</strong> Spaceport Urchin, Edge of the Empire Core Rulebook (adjustments: none).\n<strong>Group math:</strong> Typically deployed in threes: group Wounds 9 (3 × WT 3), group skills at 2 ranks (e.g., Stealth 2, Streetwise 2); one clerk is incapacitated each time total damage passes a multiple of 3. A lone observer is a single minion: Wounds 3, no skill ranks.\n<strong>Using them:</strong> Lore-Clerks never fight — WT 3 and nothing deadlier than a pocketful of thrown scrap is the design, not an oversight. Their job is to see, copy, and carry: one of them stood in the certification crowd at Vesta-9, and the crew — what they testified, and what they were seen carrying — have been in the files ever since (Dial 3). Play them as texture the party learns to notice too late — the copyist at the archive, the runner at the swoop track — and as the campaign's paper trail: captured dead-drops are lore fragments with the Sith tag and somebody's handwriting. When the culling comes, surviving clerks scatter with dangerous knowledge and no protector, and every one of them is a hook.</p>", "search": "inheritor lore-clerks minion — the inheritors — archivist cell of couriers, copyists, and observers nobody remembers the third clerk at the certification, the one who wrote nothing down until afterward. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 1 3 1 3 soak 1 · wounds 3 (each) · m/r defense 0/0 - skills (group only): skulduggery, stealth, streetwise, survival - equipment: none printed — clerks carry satchels of copy-flimsi, memorized dead-drop schedules, and a courier's unremarkable face (props only, no mechanics). chassis: spaceport urchin, edge of the empire core rulebook (adjustments: none). group math: typically deployed in threes: group wounds 9 (3 × wt 3), group skills at 2 ranks (e.g., stealth 2, streetwise 2); one clerk is incapacitated each time total damage passes a multiple of 3. a lone observer is a single minion: wounds 3, no skill ranks. using them: lore-clerks never fight — wt 3 and nothing deadlier than a pocketful of thrown scrap is the design, not an oversight. their job is to see, copy, and carry: one of them stood in the certification crowd at vesta-9, and the crew — what they testified, and what they were seen carrying — have been in the files ever since (dial 3). play them as texture the party learns to notice too late — the copyist at the archive, the runner at the swoop track — and as the campaign's paper trail: captured dead-drops are lore fragments with the sith tag and somebody's handwriting. when the culling comes, surviving clerks scatter with dangerous knowledge and no protector, and every one of them is a hook."}, {"id": "vigil-inheritors--chartkeeper-denno-pike", "name": "Chartkeeper Denno Pike", "kind": "Rival", "typeline": "Rival", "faction": "The Inheritors", "role": "mole inside the Lamplighters", "derived": "Soak 2 · Wounds 12 · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Rival — The Inheritors — mole inside the Lamplighters</em></p>\n<blockquote>\n<p>He sold the handshake codes one lane at a time, and every payment made the hole he was standing in one lane deeper.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 2 · Wounds 12 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Computers 2, Cool 2, Skulduggery 1</li>\n<li><strong>Talents:</strong> Bypass Security (<em>removes one setback die from Computers or Skulduggery checks made to bypass security measures</em>)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Guild-issue suppression pistol (printed: stun blaster — Ranged [Light]; Damage 6; Critical —; Range [Short]; Stun Damage), chartkeeper's splice-kit (slicing gear).</li>\n</ul>\n<p><strong>Chassis:</strong> Slicer, Edge of the Empire Core Rulebook (reprinted in Age of Rebellion Core Rulebook and Allies and Adversaries) (adjustments: none).\n<strong>Using him:</strong> Denno is how the Inheritors follow the relights and why the Conclave of Charts is rigged from the second direction: guild handshake codes and the patron's relighting order are his product, and Meru Vane holds his debts. He has no idea the order he is selling was bought first by someone far worse than his buyers (Dial 3). He is not a villain, he is a man in a hole — nervous, over-leveraged, and visibly relieved the first time anyone offers him a way out that isn't a deeper hole. His stun-only sidearm is the tell: he has never once planned to hurt anybody. Redeeming him hands the party the proof that exposes the auction; cornering him hands the Inheritors a martyr and burns the evidence — let the players discover which they did.</p>", "search": "chartkeeper denno pike rival — the inheritors — mole inside the lamplighters he sold the handshake codes one lane at a time, and every payment made the hole he was standing in one lane deeper. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 2 4 3 2 1 soak 2 · wounds 12 · m/r defense 0/0 - skills: computers 2, cool 2, skulduggery 1 - talents: bypass security ( removes one setback die from computers or skulduggery checks made to bypass security measures ) - abilities: none - equipment: guild-issue suppression pistol (printed: stun blaster — ranged [light]; damage 6; critical —; range [short]; stun damage), chartkeeper's splice-kit (slicing gear). chassis: slicer, edge of the empire core rulebook (reprinted in age of rebellion core rulebook and allies and adversaries) (adjustments: none). using him: denno is how the inheritors follow the relights and why the conclave of charts is rigged from the second direction: guild handshake codes and the patron's relighting order are his product, and meru vane holds his debts. he has no idea the order he is selling was bought first by someone far worse than his buyers (dial 3). he is not a villain, he is a man in a hole — nervous, over-leveraged, and visibly relieved the first time anyone offers him a way out that isn't a deeper hole. his stun-only sidearm is the tell: he has never once planned to hurt anybody. redeeming him hands the party the proof that exposes the auction; cornering him hands the inheritors a martyr and burns the evidence — let the players discover which they did."}, {"id": "vigil-inheritors--the-culling-how-the-inheritors-end", "name": "The culling — how the Inheritors end", "kind": "Special", "typeline": "", "faction": "", "role": "", "derived": "", "group": "vigil-inheritors", "html": "<p><strong>The fork is closed: the Inheritors are heretics.</strong> No connection to the true line, and they do not know it — real techniques scraped from artifacts, counterfeit lineage, no living tradition. <strong>The Sith do not yet know they exist.</strong></p>\n<p>The moment that changes — the Unveiling, a public claim to a Darth title, anything that makes them look less like grave-robbers and more like a rival tradition — <strong>the culling comes</strong>, and it is surgical, anonymous, and total: the senior circle dead across a dozen worlds in one night, the archives vanished rather than burned, and nobody sane concluding \"Sith.\" The galaxy blames the Vigil, or the Admiralty, or an internal purge, and every misattribution lights a different Act 3 fire. (It is Mendac's exam — the Graduation, in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>.)</p>\n<p>Two aftershocks matter:</p>\n<ol>\n<li>The culling <strong>shatters the Inheritors instead of ending them</strong>: leaderless cells, fire-sale artifacts, half-trained adepts scattering with dangerous knowledge.</li>\n<li>The harvested archives include <strong>the Vesta-9 file</strong> — whoever wrecked the Inheritors now knows about the crew — what they saw at Vesta-9, what they carry, and by then which of them is gifted — and has never once been seen.</li>\n</ol>", "search": "the culling — how the inheritors end the fork is closed: the inheritors are heretics. no connection to the true line, and they do not know it — real techniques scraped from artifacts, counterfeit lineage, no living tradition. the sith do not yet know they exist. the moment that changes — the unveiling, a public claim to a darth title, anything that makes them look less like grave-robbers and more like a rival tradition — the culling comes , and it is surgical, anonymous, and total: the senior circle dead across a dozen worlds in one night, the archives vanished rather than burned, and nobody sane concluding \"sith.\" the galaxy blames the vigil, or the admiralty, or an internal purge, and every misattribution lights a different act 3 fire. (it is mendac's exam — the graduation, in [keepers of the flame](keepers.md).) two aftershocks matter: 1. the culling shatters the inheritors instead of ending them : leaderless cells, fire-sale artifacts, half-trained adepts scattering with dangerous knowledge. 2. the harvested archives include the vesta-9 file — whoever wrecked the inheritors now knows about the crew — what they saw at vesta-9, what they carry, and by then which of them is gifted — and has never once been seen."}, {"id": "vigil-inheritors--set-piece-the-emptied-house", "name": "Set piece — The Emptied House", "kind": "Special", "typeline": "Aftermath encounter", "faction": "the culling, seen from inside", "role": "run it after the Unveiling, or earlier as the culling's first quiet strike", "derived": "", "group": "vigil-inheritors", "html": "<p><em>Aftermath encounter — the culling, seen from inside — run it after the Unveiling, or earlier as the culling's first quiet strike</em></p>\n<blockquote>\n<p>One night, one base, nobody alive, and the relic hall still full.</p>\n</blockquote>\n<p>Use an Inheritor base the crew has already visited with courtesy — first contact is always helpful (Dial 3) — so that coming back is the point: the dig camp at the Scar, a Sanrafsix warehouse, a cell on the Veshet spur. They find it taken apart. Everyone is dead and it happened in one night. There are no blaster scorings and no cauterized wounds. The bodies that must never be identified are not there at all (the disruptor); the rest died of falls, of fire, and of each other (Influence). The archive rooms are bare — not burned, <em>emptied</em>: dust outlines where shelves stood. And the relic hall is untouched. Every \"Sith artifact\" the Inheritors ever displayed is still on its plinth.</p>\n<p><strong>The truth.</strong> Mendac took every genuine item and left every counterfeit, because Veritis's eye is the one thing in the galaxy that can tell them apart — and because a room full of fakes tells the galaxy this was robbery by people who did not know what they were looking at. That is the Scrub's whole doctrine in one room: the galaxy is not to be left ignorant of the Sith, it is to be left <em>wrong</em>. Nobody sane concludes \"Sith.\" The fakes are also a message, for the one reader in ten thousand who can tell.</p>\n<p><strong>Reading the room</strong> (optional clue ladder; RAW difficulties; a failed check says nothing, a despair says something false):</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Check</th>\n<th>What it gives</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Perception, Average</strong></td>\n<td>No blaster or saber marks; too few bodies for a base this size; the missing dead are exactly the senior faces the crew remembers.</td>\n</tr>\n<tr>\n<td><strong>Medicine, Hard</strong></td>\n<td>The survivors of the first wave killed each other and then themselves, in an order that makes no sense — unless they were <em>made</em> to (Influence). Force-sensitive characters may substitute a Sense check: the fear in the walls has a shape.</td>\n</tr>\n<tr>\n<td><strong>Knowledge (Lore), Hard</strong> <em>(Average if the character has handled a real Sith relic or holds a Sith-tagged fragment)</em></td>\n<td>The relics on the plinths are counterfeits — good ones, the Inheritors' own costume pieces.</td>\n</tr>\n<tr>\n<td><strong>Knowledge (Lore), Daunting</strong> <em>(Formidable without a Sith-tagged fragment)</em></td>\n<td><em>Only</em> fakes remain. Whoever did this could tell — which means a living tradition, not grave-robbers. Success awards a <strong>Sith-tagged lore fragment</strong> (\"Someone in the galaxy can still tell true from false\") and the GM a problem: the players now know the thing nobody sane concludes.</td>\n</tr>\n<tr>\n<td><strong>Streetwise, Hard</strong></td>\n<td>The fakes will surface on the Memory Market within weeks, consigned by a fence who never met the seller. The trail ends at a dead fence.</td>\n</tr>\n<tr>\n<td><strong>Vigilance (or Sense), Average, in the archive</strong></td>\n<td>The house is <em>quiet</em>. Whatever was here that the Force could feel left with the thieves — the only honest inventory of what was taken.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Aftermath.</strong> Fire-sale of the fakes; leaderless cells; half-trained adepts scattering with dangerous knowledge; if this was a senior base, the Vesta-9 file is gone with everything else. The galaxy blames the Vigil, the Admiralty, or an Inheritor purge, and each misattribution lights a different Act 3 fire (<a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-3\">Act 3</a>). If the crew's gifted stands in the relic hall and feels nothing at all, let that land: the real thing was here, and it is with someone now.</p>", "search": "set piece — the emptied house aftermath encounter — the culling, seen from inside — run it after the unveiling, or earlier as the culling's first quiet strike one night, one base, nobody alive, and the relic hall still full. use an inheritor base the crew has already visited with courtesy — first contact is always helpful (dial 3) — so that coming back is the point: the dig camp at the scar, a sanrafsix warehouse, a cell on the veshet spur. they find it taken apart. everyone is dead and it happened in one night. there are no blaster scorings and no cauterized wounds. the bodies that must never be identified are not there at all (the disruptor); the rest died of falls, of fire, and of each other (influence). the archive rooms are bare — not burned, emptied : dust outlines where shelves stood. and the relic hall is untouched. every \"sith artifact\" the inheritors ever displayed is still on its plinth. the truth. mendac took every genuine item and left every counterfeit, because veritis's eye is the one thing in the galaxy that ca
