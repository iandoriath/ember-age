name: wiki

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Build GM wiki (strict)
        run: mkdocs build --strict -f mkdocs.yml
      - name: Build GM screen
        run: python tools/build-gm-screen.py
      - name: Upload GM screen artifact
        uses: actions/upload-artifact@v4
        with:
          name: gm-screen
          path: gm-screen.html
