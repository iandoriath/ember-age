gotiation 1, Ranged (Heavy) 3, Vigilance 2</li>\n<li><strong>Talents:</strong> Adversary 2 (<em>upgrade the difficulty of all combat checks targeting her twice</em>), Field Commander (<em>as an action, may make an Average Leadership check; a number of allies equal to her Presence may each suffer 1 strain to immediately perform one free maneuver</em>), Side Step (<em>as a maneuver, may suffer 1 strain to upgrade the difficulty of all ranged attacks targeting her once until the start of her next turn</em>)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Clan-pattern light repeater (Ranged [Heavy]; Damage 9; Critical 3; Range [Long]; Auto-fire, Cumbersome 4, Inaccurate 1, Pierce 2, Slow-Firing 2), mythosaur axe (Melee; Damage 8; Critical 2; Range [Engaged]; Cortosis — <em>cannot be damaged by the Sunder quality</em> —, Pierce 3, Vicious 3), heirloom beskar'gam (+2 soak, +2 defense, Cortosis — <em>attacks against her lose the benefit of Pierce and Breach</em>).</li>\n</ul>\n<p><strong>Chassis:</strong> Chieftain Vera Beroya, Friends Like These (adjustments: none — printed named Mandalorian chieftain block re-skinned whole; verified against the official Friends Like These transcription: Wound Threshold 13, Strain 15, Defense 2/2, both weapon profiles, and the beskar'gam all match print).\n<strong>Using her:</strong> Ordo's clan-company hires out to anyone whose bond clears — escort, garrison, demolition — and in a disarmed galaxy that makes her everyone's contingency plan, including factions who despise each other. She remembers the wars the way the clans do, as work, and she is the one commander in the campaign with no theology about the Awakening at all: her company takes foundlings from every ruin it is paid to make or guard, and a foundling who bends luck is simply promising. In a fight she is a Field Commander first — her soldiers act twice as often as anyone expects — and she withdraws the moment a contract stops paying for casualti e each other. she remembers the wars the way the clans do, as work, and she is the one commander in the campaign with no theology about the awakening at all: her company takes foundlings from every ruin it is paid to make or guard, and a foundling who bends luck is simply promising. in a fight she is a field commander first — her soldiers act twice as often as anyone expects — and she withdraws the moment a contract stops paying for casualties. the way to move her is never ideology; it is the fine print, or a foundling in danger."}, {"id": "lanes-ledgers--clan-ordo-soldiers", "name": "Clan Ordo Soldiers", "kind": "Minion", "typeline": "Minion", "faction": "The Mandalorian Clans", "role": "the finest infantry alive", "derived": "Soak 5 · Wounds 5 (each) · M/R Defense 0/0", "group": "lanes-ledgers", "html": "<p><em>Minion — The Mandalorian Clans — the finest infantry alive</em></p>\n<blockquote>\n<p>Ninety years of galactic disarmament, and these are the people who spent them drilling.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 5 · Wounds 5 (each) · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills (group only):</strong> Athletics, Discipline, Melee, Ranged (Heavy)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Ancestral blaster rifle, oiled daily for three generations (Ranged [Heavy]; Damage 9; Cri ting, or a Guild arbiter's ruling can strike a name where blasters cannot. In a fight it opens at range with the repeater and saves the missile tube for vehicles and barricades; telegraph that tube loudly, because Damage 20 Blast 10 will kill a PC who treats this as a fair duel. Its Willpower 1 is the seam: it accepts filings, precedents, and stalling procedures with infinite patience, and every day of delay is a day to get the next name on the list off-world.</p>\n<hr />\n<h2>The Sealed Enclave</h2>", "search": "\"dead letter\" nemesis — bounty hunters' guild (contested posting) — war-surplus assassin droid working a ninety-year-old contract list \"good evening. you are not on the list. please step aside from the individual who is.\" brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 4 3 3 3 1 1 soak 7 · wounds 19 · strain 10 · m/r defense 0/1 - skills: coercion 3, computers 4, gunnery 5, mechanics 3, melee 3, piloting (planetary) 3, piloting (space) 3, ranged (heavy) 5, ranged (light) 5, vigilance 2 - talents: adversary 2 ( upgrade the difficulty of all combat checks targeting it twice ), barrage 3 ( add 3 damage to one hit of a successful ranged [heavy] or gunnery attack made at long or extreme range ), point blank 3 ( add 3 damage to one hit of a successful ranged [heavy] or ranged [light] attack made at short range or engaged ) - abilities: droid ( does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering force powers; cannot use or be trained in the force ). printed soak includes its integral war-grade plating. - equipment: ninety-year service repeater (light repeating blaster: ranged [heavy]; damage 11; critical 3; range [long]; auto-fire, cumbersome 4, pierce 1), built-in wrist coil-pistol (light blaster pistol: ranged [light]; damage 5; critical 4; range [medium]; stun setting), built-in shoulder missile tube (gunnery; damage 20; critical 2; range style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 3 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Knowledge (Education) 3, Knowledge (Xenology) 3, Negotiation 2, Perception 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> Droid (<em>does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering Force powers; cannot use or be trained in the Force</em>), Etiquette and Protocol (<em>allies add a boost die to Negotiation checks, or to other checks made to negotiate or mediate</em>). Printed soak includes its integral plating.</li>\n<li><strong>Equipment:</strong> None printed — the chalk stylus, the roll-book, and ninety years of lesson plans have no stat lines.</li>\n</ul>\n<p><strong>Chassis:</strong> Protocol Droid, Edge of the Empire Core Rulebook (also printed in the Age of Rebellion Core Rulebook; reprinted in Allies and Adversaries) (adjustments: none).\n<strong>Using it:</strong> Docent-7 is a non-combatant and the episode's heart: it does not know the Order is gone, only that attendance has been poor. It is also a walking archive — an unwiped pre-war memory core full of Jedi-tag lore fragments, which makes it quietly precious and, once word spreads, hunted (Okkam Dree pays in fuel for cores like this; the Vigil will claim custody of \"the relic\"). Its Knowledge skills answer almost any question about the world before the Withering, always in the present tense, which is worse. Let the players decide what it is owed: a fragment is a source, but Docent-7 is a witness — and the thing that answered this year's roll call thinks it is a student.</p>\n<hr />\n<h2>The Ration Engine</h2>", "search": "docent-7 rival — the vigil (sealed custody) — caretaker droid still teaching an empty classroom every morning it rings the hand-bell, calls eleven names nobody has answered in ninety years, and begins the lesson. this year, on the fourth name, something answered. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 1 3 1 1 2 soak 3 · wounds 10 · m/r defense 0/0 - skills: charm 2, knowledge (education) 3, knowledge (xenology) 3, negotiation 2, perception 1 - talents: none - abilities: droid ( does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering force powers; cannot use or be trained in the force ), etiquette and protocol ( allies add a boost die to negotiation checks, or to other checks made to negotiate or mediate ). printed soak includes its integral plating. - equipment: none printed — the chalk stylus, the roll-book, and ninety years of lesson plans have no stat lines. chassis: protocol droid, edge of the empire core rulebook (also printed in the age of rebellion core rulebook; reprinted in allies and adversaries) (adjustments: none). using it: docent-7 is a non-combatant and the episode's heart: it does not know the order is gone, only that attendance has been poor. it is also a walking archive — an unwiped pre-war memory core full of jedi-tag lore fragments, which makes it quietly precious and, once word spreads, hunted (okkam dree pays in fuel for cores like this; the vigil will claim custody of \"the relic\"). its knowledge skills answer almost any question about the world before the withering, always in the present tense, which is worse. let the players decide what it is owed: a fragment is a source, but docent-7 is a witness — and the thing that answered this year's roll call thinks it is a student. --- the ration engine"}, {"id": "reaches--the-quartermaster", "name": "The Quartermaster", "kind": "Rival", "typeline": "Rival (social)", "faction": "independent civic machine", "role": "administrator intelligence that refuses to believe the galaxy is back", "derived": "Soak 3 · Wounds 10 · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Rival (social) — independent civic machine — administrator intelligence that refuses to believe the galaxy is back</em></p>\n<blockquote>\n<p>\"Your 'relit beacon' is an unverified atmospheric phenomenon. The ration cycle, by contrast, has never once failed you. Please present your chit.\"</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 3 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Computers 2, Knowledge (Xenology) 1, Perception 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> Droid (<em>does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering Force powers; cannot use or be trained in the Force</em>). Printed soak includes its integral plating.</li>\n<li><strong>Equipment:</strong> None printed. The Ration Engine itself — tally-looms, door seals, granary locks — is scenery and leverage, not a stat line.</li>\n</ul>\n<p><strong>Chassis:</strong> 3D-4K, Administrative Droid, Debts to Pay, Edge of the Empire Game Master's Kit (adjustments: none).\n<strong>Using it:</strong> This is a contest of Computers, Negotiation, and Knowledge (Education), never blasters — run the confrontation as social combat: as a rival it has no strain threshold, so strain it suffers is applied as wounds against its Wound Threshold of 10. Be honest about that arithmetic: it is a printed rival with Presence 2 and Charm 2, and in a direct social duel against a competent negotiator it folds fast — the real threshold was never the duel. Its power is institutional, not personal: the sealed doors, the handshake protocols, the granary locks, and its genuine love of its people are what the crew must actually satisfy, so give it boost dice from ninety years of flawless records, and remember it controls food, water, and doors for everyone in the room. Out-arguing the Quartermaster is easy; it means nothing until the procedures are answered too. It genuinely loves its people, never lies (its Charm 2 is sincerity), and treats the crew's evidence the way an auditor treats a sob story. It loses gracefully to procedure: a verified census, a beacon certification with Lamplighter handshake codes, or proof its charter government still exists somewhere — that last one is a hook with teeth.</p>\n<hr />\n<h2>The Oracle of Brel</h2>", "search": "the quartermaster rival (social) — independent civic machine — administrator intelligence that refuses to believe the galaxy is back \"your 'relit beacon' is an unverified atmospheric phenomenon. the ration cycle, by contrast, has never once failed you. please present your chit.\" brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 1 3 1 1 2 soak 3 · wounds 10 · m/r defense 0/0 - skills: charm 2, computers 2, knowledge (xenology) 1, perception 1 - talents: none - abilities: droid ( does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering force powers; cannot use or be trained in the force ). printed soak includes its integral plating. - equipment: none printed. the ration engine itself — tally-looms, door seals, granary locks — is scenery and leverage, not a stat line. chassis: 3d-4k, administrative droid, debts to pay, edge of the empire game master's kit (adjustments: none). using it: this is a contest of computers, negotiation, and knowledge (education), never blasters — run the confrontation as social combat: as a rival it has no strain threshold, so strain it suffers is applied as wounds against its wound threshold of 10. be honest about that arithmetic: it is a printed rival with presence 2 and charm 2, and in a direct social duel against a competent negotiator it folds fast — the real threshold was never the duel. its power is institutional, not personal: the sealed doors, the handshake protocols, the granary locks, and its genuine love of its people are what the crew must actually satisfy, so give it boost dice from ninety years of flawless records, and remember it controls food, water, and doors for everyone in the room. out-arguing the quartermaster is easy; it means nothing until the procedures are answered too. it genuinely loves its people, never lies (its charm 2 is sincerity), and treats the crew's evidence the way an auditor treats a sob story. it loses gracefully to procedure: a verified census, a beacon certification with lamplighter handshake codes, or proof its charter government still exists somewhere — that last one is a hook with teeth. --- the oracle of brel"}, {"id": "reaches--anwei-the-oracle-of-brel", "name": "Anwei, the Oracle of Brel", "kind": "Rival", "typeline": "Rival", "faction": "independent settlement (worshipped)", "role": "Force-sensitive child whose true dreams are eating her sleep", "derived": "Soak 1 · Wounds 10 · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Rival — independent settlement (worshipped) — Force-sensitive child whose true dreams are eating her sleep</em></p>\n<blockquote>\n<p>She is ten years old, she knows what your ship is called, and she is so very tired.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 1 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 1, Discipline 1, Perception 2, Vigilance 3</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> <strong>Force Rating 2 (uncontrolled)</strong>. Foresee (basic power) — <em>may roll her Force dice and spend Force points to glimpse vague fragments of events to come; she cannot choose when, and the GM triggers it in sleep or trance</em>. Sense (basic power) — <em>may spend Force points to sense living presences within short range, and the current emotional state of one engaged being</em>.</li>\n<li><strong>Equipment:</strong> None — a knotted dream-cord her mother tied, which does nothing but matter.</li>\n</ul>\n<p><strong>Chassis:</strong> original build (core adversary guidelines) — no official FFG adversary exists for an untrained Force-sensitive child; verified against the three core rulebooks and Allies and Adversaries (adjustments: n/a — values built inside core guidelines; FR 2 justified below).\n<strong>Using her:</strong> Force Rating 2 in an era of FR 1 children needs justifying, so here it is: Anwei is the Awakening's high-water mark on the Run — raw aptitude two generations deep arriving all at once, with no training, no shutter, and no off switch. The rating measures the flood, not mastery; she cannot direct a single point of it, which is exactly why the dreams are eating her sleep. She is a non-combatant: violence around her is resolved through the settlement's armed faithful (re-use the Hull-City Militia block, re-skinned as shrine wardens). Her true dreams should be right, unwelcome, and getting louder — and every faction envoy arriving this week has a different plan for her. The witness rule cuts hard here: the settlement has already answered the question \"awe or fear,\" and the party's open Force use will be read as rival prophecy. She is not a Wellspring. She is a child, and the campaign is watching what the players do about the difference.</p>\n<hr />\n<h2>The Memory Market</h2>", "search": "anwei, the oracle of brel rival — independent settlement (worshipped) — force-sensitive child whose true dreams are eating her sleep she is ten years old, she knows what your ship is called, and she is so very tired. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 2 2 3 3 soak 1 · wounds 10 · m/r defense 0/0 - skills: charm 1, discipline 1, perception 2, vigilance 3 - talents: none - abilities: force rating 2 (uncontrolled) . foresee (basic power) — may roll her force dice and spend force points to glimpse vague fragments of events to come; she cannot choose when, and the gm triggers it in sleep or trance . sense (basic power) — may spend force points to sense living presences within short range, and the current emotional state of one engaged being . - equipment: none — a knotted dream-cord her mother tied, which does nothing but matter. chassis: original build (core adversary guidelines) — no official ffg adversary exists for an untrained force-sensitive child; verified against the three core rulebooks and allies and adversaries (adjustments: n/a — values built inside core guidelines; fr 2 justified below). using her: force rating 2 in an era of fr 1 children needs justifying, so here it is: anwei is the awakening's high-water mark on the run — raw aptitude two generations deep arriving all at once, with no training, no shutter, and no off switch. the rating measures the flood, not mastery; she cannot direct a single point of it, which is exactly why the dreams are eating her sleep. she is a non-combatant: violence around her is resolved through the settlement's armed faithful (re-use the hull-city militia block, re-skinned as shrine wardens). her true dreams should be right, unwelcome, and getting louder — and every faction envoy arriving this week has a different plan for her. the witness rule cuts hard here: the settlement has already answered the question \"awe or fear,\" and the party's open force use will be read as rival prophecy. she is not a wellspring. she is a child, and the campaign is watching what the players do about the difference. --- the memory market"}, {"id": "reaches--provenance-broker-halla-wex", "name": "Provenance-Broker Halla Wex", "kind": "Rival", "typeline": "Rival", "faction": "Memory Market underworld", "role": "forger poisoning the lore-fragment economy", "derived": "Soak 1 · Wounds 11 · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Rival — Memory Market underworld — forger poisoning the lore-fragment economy</em></p>\n<blockquote>\n<p>Half the provenance seals on the Run pass through her back room, and the frightening part is how few of them leave it unimproved.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 1 · Wounds 11 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Computers 1, Knowledge (Underworld) 2, Perception 2, Skulduggery 2, Vigilance 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Sleeve hush-pistol (holdout blaster: Ranged [Light]; Damage 5; Critical 4; Range [Short]; Stun setting), provenance-forger's bench (electronic forgery kit and tools, renamed cosmetically — aging baths, seal-presses, testimony splicers).</li>\n</ul>\n<p><strong>Chassis:</strong> Forger, Edge of the Empire Core Rulebook (reprinted in Allies and Adversaries) (adjustments: none).\n<strong>Using her:</strong> Wex almost never talks to a mark — her social pools are thin by design, and her front-men (and her Scribes, below) do the selling while she does the craft. The contest with her is Intellect 4 / Cunning 4 versus the party's Perception and Knowledge: spotting one of her fakes should start at Hard and get easier only with a genuine fragment to compare against. Her real damage is mechanical — a Wex forgery in the party's collection is a rigged Reconstruction, feeding them a corrupted conclusion (use the Despair result from the lore rules) <em>before any dice are rolled</em>. The episode turns when the players realize something they already trust came from her bench — and Wex, cornered, will cheerfully sell them the client list instead of her own neck.</p>", "search": "provenance-broker halla wex rival — memory market underworld — forger poisoning the lore-fragment economy half the provenance seals on the run pass through her back room, and the frightening part is how few of them leave it unimproved. brawn agility intellect cunning willpower presence :-: :-: :-: /th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 3 · Wounds 3 (each) · M/R Defense 0/0</strong> <em>(minions: no strain threshold — strain suffered becomes wounds)</em></p>\n<ul>\n<li><strong>Skills (group only):</strong> Computers, Knowledge (Education)</li>\n<li><strong>Talents:</strong> Technical Aptitude 2 (<em>reduce time to complete Computers-related tasks by 25% per rank</em>) — printed on the official minion block and reproduced as printed; it is fixed and does not gain ranks from group size.</li>\n<li><strong>Abilities:</strong> Droid (<em>does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering Force powers; cannot use or be trained in the Force</em>). Printed soak includes integral plating.</li>\n<li><strong>Equipment:</strong> Copy-slates and styli (datapad).</li>\n</ul>\n<p><strong>Chassis:</strong> Analysis Droid, Force and Destiny Core Rulebook (adjustments: none).\n<strong>Group math:</strong> Deployed in scriptorium rows of four: group Wounds 12, group skills at 3 ranks (Computers 3, Knowledge [Education] 3); one scribe is incapacitated each time total damage passes a multiple of 3.\n<strong>Using them:</strong> Total non-combatants — Wounds 3 means a raised voice nearly disperses a row. Their menace is throughput: a four-droid row at Computers 3 with Technical Aptitude fabricates sealed provenance faster than any human atelier, which is how the poison spread Run-wide in two seasons. Wex bought them from Okkam Dree's yard <em>because</em> their cores were never wiped — meaning each captured Scribe is simultaneously evidence, a Civic-tag lore fragment, and a victim. The era's droid-heirloom sentiment cuts both ways: wiping them solves Wex's problem, not the party's.</p>\n<hr />\n<h2>The Chop-Yards</h2>", "search": "forgery-ring scribes minion — memory market underworld — unwiped copyist droids running the forgery lines rows of secondhand droids transcribing lies in perfect institutional hand. they believe provenance is a formatting standard. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 1 4 1 1 1 soak 3 · wounds 3 (each) · m/r defense 0/0 (minions: no strain threshold — strain suffered becomes wounds) - skills (group only): computers, knowledge (education) - talents: technical aptitude 2 ( reduce time to complete computers-related tasks by 25% per rank ) — printed on the official minion block and reproduced as printed; it is fixed and does not gain ranks from group size. - abilities: droid ( does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering force powers; cannot use or be trained in the force ). printed soak includes integral plating. - equipment: copy-slates and styli (datapad). chassis: analysis droid, force and destiny core rulebook (adjustments: none). group math: deployed in scriptorium rows of four: group wounds 12, group skills at 3 ranks (computers 3, knowledge [education] 3); one scribe is incapacitated each time total damage passes a multiple of 3. using them: total non-combatants — wounds 3 means a raised voice nearly disperses a row. their menace is throughput: a four-droid row at computers 3 with technical aptitude fabricates sealed provenance faster than any human atelier, which is how the poison spread run-wide in two seasons. wex bought them from okkam dree's yard because their cores were never wiped — meaning each captured scribe is simultaneously evidence, a civic-tag lore fragment, and a victim. the era's droid-heirloom sentiment cuts both ways: wiping them solves wex's problem, not the party's. --- the chop-yards"}, {"id": "reaches--junk-baron-okkam-dree", "name": "Junk Baron Okkam Dree", "kind": "Rival", "typeline": "Rival", "faction": "Kajidic-adjacent salvage", "role": "chop-yard king who buys droids with unwiped cores", "derived": "Soak 1 · Wounds 10 · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Rival — Kajidic-adjacent salvage — chop-yard king who buys droids with unwiped cores</em></p>\n<blockquote>\n<p>You hear him before you see him — one wing beats flat, an old yard injury — counting your hull's rivets aloud on his way down to name a price you will hate twice.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 1 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 1, Cool 2, Deception 2, Negotiation 2, Perception 3, Streetwise 2</li>\n<li><strong>Talents:</strong> Natural Negotiator (<em>once per session, may reroll any one Cool or Negotiation check</em>), Nobody's Fool 1 (<em>upgrade the difficulty of Charm, Coercion, and Deception checks targeting him once</em>)</li>\n<li><strong>Abilities:</strong> Hoverer (<em>when hovering, spends no additional maneuvers to navigate difficult terrain — which is the entire chop-yard</em>), Silhouette 0.</li>\n<li><strong>Equipment:</strong> Cuff-hidden bolt-thrower (holdout blaster: Ranged [Light]; Damage 5; Critical 4; Range [Short]; Stun setting), loaded chance cubes, dataslate of yard manifests.</li>\n</ul>\n<p><strong>Chassis:</strong> Toydarian Merchant, Force and Destiny Core Rulebook (also printed in Lords of Nal Hutta; reprinted in Allies and Adversaries) (adjustments: none — he simply stays a Toydarian; Dree is ancient even for one and claims to remember the Republic solvent, and half his customers believe him).\n<strong>Using him:</strong> Dree is the Withering's real economy made flesh: nothing new gets built, so everything old passes through him. He pays triple for droids with unwiped memory cores — he knows exactly what a walking archive fetches from Kajidic buyers, Republic archivists, and people who do not give their names — and he sold Halla Wex her Scribes, which makes him the thread between two episodes. He will not fight; he will sell the party precisely what they ask for, then sell the fact that they asked to the next customer. Perception 3 and Nobody's Fool make him nearly impossible to swindle, and his one soft spot is professional: he genuinely cannot bear to see a pre-war hull broken up badly. Wayfinders swear he and Portmaster Grell of Okrent's Drift must be kin; they have never met, are no relation, and each would raise his prices for hearing it.</p>", "search": "junk baron okkam dree rival — kajidic-adjacent salvage — chop-yard king who buys droids with unwiped cores you hear him before you see him — one wing beats flat, an old yard injury — counting your hull's rivets aloud on his way down to name a price you will hate twice. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 1 2 2 3 3 soak 1 · wounds 10 · m/r defense 0/0 - skills: charm 1, cool 2, deception 2, negotiation 2, perception 3, streetwise 2 - talents: natural negotiator ( once per session, may reroll any one cool or negotiation check ), nobody's fool 1 ( upgrade the difficulty of charm, coercion, and deception checks targeting him once ) - abilities: hoverer ( when hovering, spends no additional maneuvers to navigate difficult terrain — which is the entire chop-yard ), silhouette 0. - equipment: cuff-hidden bolt-thrower (holdout blaster: ranged [light]; damage 5; critical 4; range [short]; stun setting), loaded chance cubes, dataslate of yard manifests. chassis: toydarian merchant, force and destiny core rulebook (also printed in lords of nal hutta; reprinted in allies and adversaries) (adjustments: none — he simply stays a toydarian; dree is ancient even for one and claims to remember the republic solvent, and half his customers believe him). using him: dree is the withering's real economy made flesh: nothing new gets built, so everything old passes through him. he pays triple for droids with unwiped memory cores — he knows exactly what a walking archive fetches from kajidic buyers, republic archivists, and people who do not give their names — and he sold halla wex her scribes, which makes him the thread between two episodes. he will not fight; he will sell the party precisely what they ask for, then sell the fact that they asked to the next customer. perception 3 and nobody's fool make him nearly impossible to swindle, and his one soft spot is professional: he genuinely cannot bear to see a pre-war hull broken up badly. wayfinders swear he and portmaster grell of okrent's drift must be kin; they have never met, are no relation, and each would raise his prices for hearing it."}, {"id": "reaches--scavenger-clan-cutters", "name": "Scavenger Clan Cutters", "kind": "Minion", "typeline": "Minion", "faction": "Kajidic-adjacent salvage", "role": "hull-strippers with cutting torches", "derived": "Soak 2 · Wounds 5 (each) · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Minion — Kajidic-adjacent salvage — hull-strippers with cutting torches</em></p>\n<blockquote>\n<p>They can take a corvette down to numbered pallets in a week. They start whether or not the crew has disembarked.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 2 · Wounds 5 (each) · M/R Defense 0/0</strong> <em>(minions: no strain threshold — strain suffered becomes wounds)</em></p>\n<ul>\n<li><strong>Skills (group only):</strong> Mechanics, Perception, Ranged (Light), Skulduggery, Survival</li>\n<li><strong>Talents:</strong> Utinni! 1 (<em>remove one setback die from checks made to find or scavenge items or gear; such checks take half the normal time</em>) — printed on the official minion block and reproduced as printed; fixed, does not gain ranks from group size.</li>\n<li><strong>Abilities:</strong> Hasty Repairs (<em>when making a check to repair a weapon, item, vehicle, or droid, may reduce the difficulty one step, to a minimum of Simple; if a later check involving the patched object generates a despair, the object — or its user — suffers an immediate critical hit or critical injury</em>).</li>\n<li><strong>Equipment:</strong> Salvaged ion cutter (ionization blaster: Ranged [Light]; Damage 10; Critical 5; Range [Short]; Disorient 5, Stun Damage [droids only]), scrap-cloth wraps (robes, +1 soak), rigger's belt (utility belt — torches, prybars, and line, used as tools, not weapons).</li>\n</ul>\n<p><strong>Chassis:</strong> Jawa Scavenger, Allies and Adversaries (adjustments: none — species re-skinned cosmetically to the Run's hooded clan-folk; all mechanics as printed).\n<strong>Group math:</strong> Deployed in cutting crews of four: group Wounds 20, group skills at 3 ranks (e.g., Mechanics 3); one cutter is incapacitated each time total damage passes a multiple of 5.\n<strong>Using them:</strong> They would always rather strip a ship than fight its crew, and their opening move in any standoff is to keep cutting. Note the armament: ion weapons that barely scratch flesh but drop droids cold — a cutting crew is accidentally the most dangerous thing on the Run to Docent-7, and a genuinely useful ally against Dead Letter, if the party can afford the finder's fee. Their Hasty Repairs patch-jobs are cheap, fast, and cursed; let the players buy one anyway.</p>\n<hr />\n<h2>The Circuit</h2>", "search": "scavenger clan cutters minion — kajidic-adjacent salvage — hull-strippers with cutting torches they can take a corvette down to numbered pallets in a week. they start whether or not the crew has disembarked. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 3 2 3 1 2 soak 2 · wounds 5 (each) · m/r defense 0/0 (minions: no strain threshold — strain suffered becomes wounds) - skills (group only): mechanics, perception, ranged (light), skulduggery, survival - talents: utinni! 1 ( remove one setback die from checks made to find or scavenge items or gear; such checks take half the normal time ) — printed on the official minion block and reproduced as printed; fixed, does not gain ranks from group size. - abilities: hasty repairs ( when making a check to repair a weapon, item, vehicle, or droid, may reduce the difficulty one step, to a minimum of simple; if a later check involving the patched object generates a despair, the object — or its user — suffers an immediate critical hit or critical injury ). - equipment: salvaged ion cutter (ionization blaster: ranged [light]; damage 10; critical 5; range [short]; disorient 5, stun damage [droids only]), scrap-cloth wraps (robes, +1 soak), rigger's belt (utility belt — torches, prybars, and line, used as tools, not weapons). chassis: jawa scavenger, allies and adversaries (adjustments: none — species re-skinned cosmetically to the run's hooded clan-folk; all mechanics as printed). group math: deployed in cutting crews of four: group wounds 20, group skills at 3 ranks (e.g., mechanics 3); one cutter is incapacitated each time total damage passes a multiple of 5. using them: they would always rather strip a ship than fight its crew, and their opening move in any standoff is to keep cutting. note the armament: ion weapons that barely scratch flesh but drop droids cold — a cutting crew is accidentally the most dangerous thing on the run to docent-7, and a genuinely useful ally against dead letter, if the party can afford the finder's fee. their hasty repairs patch-jobs are cheap, fast, and cursed; let the players buy one anyway. --- the circuit"}, {"id": "reaches--swoop-ace-kettle-maro", "name": "Swoop Ace \"Kettle\" Maro", "kind": "Rival", "typeline": "Rival", "faction": "the swoop circuit", "role": "racer-courier carrying the Run's mail, gossip, and standings", "derived": "Soak 3 · Wounds 12 · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Rival — the swoop circuit — racer-courier carrying the Run's mail, gossip, and standings</em></p>\n<blockquote>\n<p>If it fits in a pannier, she hauls it; if it doesn't, she memorizes it. The season standings arrive when Kettle does.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 3 · Wounds 12 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Brawl 1, Charm 2, Knowledge (Outer Rim) 3, Mechanics 3, Piloting (Planetary) 3, Vigilance 2</li>\n<li><strong>Talents:</strong> Full Throttle (<em>may take a Full Throttle action, making a Hard Piloting check; on success, her vehicle's top speed increases by 1 for a number of rounds equal to her Cunning</em>), Smooth Acceleration (<em>when performing the Punch It maneuver, her swoop suffers 1 less system strain than normal, to a minimum of 1</em>)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Patched racing leathers (racing suit, +1 soak). Her swoop, the <em>Kettle</em>, uses the standard swoop bike vehicle profile from any core rulebook.</li>\n</ul>\n<p><strong>Chassis:</strong> Swoop Ace, Allies and Adversaries (adjustments: none).\n<strong>Using her:</strong> Kettle carries no weapon because her weapon is departure: Agility 4, Piloting 3, and Full Throttle mean nothing on the Run catches her on the deck. She is the closest thing the era has to a broadcast network — Knowledge (Outer Rim) 3 is ninety settlements' worth of gossip, grudges, and route conditions, priced at a drink per rumor and payable in kind. Run her as the party's fastest way to move a message, a bribe, or a warning — and remember that anything they hand her rides next to everyone else's secrets. If the crew impresses her, the circuit's standings start mentioning their ship by name, which is reputation, which is Obligation bait.</p>\n<hr />\n<h2>The Relit Lanes</h2>", "search": "swoop ace \"kettle\" maro rival — the swoop circuit — racer-courier carrying the run's mail, gossip, and standings if it fits in a pannier, she hauls it; if it s came back, and the traffic — and something that had been waiting for traffic.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 5 · Wounds 20 · Strain 12 · M/R Defense 1/1</strong></p>\n<ul>\n<li><strong>Skills:</strong> Coercion 3, Cool 3, Coordination 2, Deception 3, Gunnery 2, Leadership 2, Melee 4, Ranged (Heavy) 3, Resilience 2, Skulduggery 3</li>\n<li><strong>Talents:</strong> Adversary 2 (<em>upgrade the difficulty of all combat checks targeting her twice</em>), Feral Strength 2 (<em>add 2 damage to one hit of a successful Brawl or Melee attack</em>), Knockdown (<em>may spend a triumph on a successful melee attack to knock the target prone</em>)</li>\n<li><strong>Abilities:</strong> Pirate Leader (<em>may perform a maneuver to give orders to allied pirates within medium range, granting them a boost die on their next check</em>)</li>\n<li><strong>Equipment:</strong> Heirloom boarding-ax (vibro-ax: Melee; Damage 7; Critical 2; Range [Engaged]; Pierce 2, Sunder, Vicious 3), lane-war repeater (heavy blaster rifle: Ranged [Heavy]; Damage 10; Critical 3; Range [Long]; Auto-fire, Cumbersome 3), patch-plated greatcoat (armored clothing: +1 soak, +1 defense).</li>\n</ul>\n<p><strong>Chassis:</strong> Pirate Captain, Edge of the Empire Core Rulebook (also printed in the Age of Rebellion Core Rulebook; reprinted in Allies and Adversaries) (adjustments: none — note the official block is printed at nemesis tier, so she carries a full strain track).\n<strong>Using her:</strong> Every beacon the party relights redraws her hunting chart — first-lighting fees travel as rumors, and rumors travel to her. She opens with a false distress code (Deception 3), boards behind a Quiet Pirates screen, and uses Pirate Leader every round to keep boost dice flowing to the minions while she closes to Engaged, where Melee 4, Feral Strength, and that ax end arguments. She is a campaign-scale consequence, not a one-fight villain: her existence is the Admiralty's best recruiting pitch and the Lamplighters' worst nightmare, and a crew that captures her alive holds a bargaining chip three factions will bid on. Vibro-ax damage shown as printed (Brawn 4 + 3); Feral Strength adds 2 more to one hit of a successful attack.</p>", "search": "pirate captain of the quiet nemesis — independent raiders — predator of the newly relit lanes out in the quiet nothing moved for sixty years. then the beacons came back, and the traffic — and something that had been waiting for traffic. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 4 4 2 3 2 3 soak 5 · wounds 20 · strain 12 · m/r defense 1/1 - skills: coercion 3, cool 3, coordination 2, deception 3, gunnery 2, leadership 2, melee 4, ranged (heavy) 3, resilience 2, skulduggery 3 - talents: adversary 2 ( upgrade the difficulty of all combat checks targeting her twice ), feral strength 2 ( add 2 damage to one hit of a successful brawl or melee attack ), knockdown ( may spend a triumph on a successful melee attack to knock the target prone ) - abilities: pirate leader ( may perform a maneuver to give orders to allied pirates within medium range, granting them a boost die on their next check ) - equipment: heirloom boarding-ax (vibro-ax: melee; damage 7; critical 2; range [engaged]; pierce 2, sunder, vicious 3), lane-war repeater (heavy blaster rifle: ranged [heavy]; damage 10; not be decoyed off one by mundane means)</li>\n<li><strong>Equipment:</strong> Bite (Brawl; Damage 6; Critical 3; Range [Engaged]); whip-tail (Brawl; Damage 5; Critical 4; Range [Engaged]; Stun Damage — the tail's venom stuns).</li>\n</ul>\n<p><strong>Chassis:</strong> Vornskr — the library's index shows a Legends-line print; verify book and page before use, and if the index disproves it, reskin a printed hunting-beast block and declare the adjustment.\n<strong>Using it:</strong> Wildlife that says the Census theme without an NPC: a pack that keys on the crew's gifted tells the whole table who is being hunted this era — and a beast that <em>detects</em> the gifted is worth money to every faction counting them, which is a black-market subplot in one sentence. Offworld stock (Myrkr is far away): someone imported them once, for exactly that reason, and the imports went feral. Use sparingly; near the Dathomiri, never accidentally.</p>\n<h2>Herds &amp; leviathans</h2>", "search": "vornskr (optional — the deep cut) rival — the feral run — canid that hunts by force-sense the pack ignored the whole boarding party, all six of them, armed. it is looking at her. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 3 3 1 3 2 1 soak 4 · wounds 12 · m/r defense 0/0 - skills: athletics 2, brawl 2, perception 3, stealth 3, survival 3 - talents: none - abilities: silhouette 1; force hunter (hunts by sensing the force: add 2 boost dice to perception and survival checks to detect or track a force-sensitive being; it attacks force-sensitives in preference to any other target and cannot be decoyed off one by mundane means) - equipment: bite (brawl; damage 6; critical 3; range [engaged]); whip-tail (brawl; damage 5; critical 4; range [engaged]; stun damage — the tail's venom stuns). chassis: vornskr — the library's index shows a legends-line print; verify book and page before use, and if the index disproves it, reskin a printed hunting-beast block and declare the adjustment. using it: wildlife that says the census theme without an npc: a pack that keys on the crew's gifted tells the whole table who is being hunted this era — and a beast that detects the gifted is worth money to every faction counting them, which is a black-market subplot in one sentence. offworld stock (myrkr is far away): someone imported them once, for exactly that reason, and the imports went feral. use sparingly; near the dathomiri, never accidentally. herds & leviathans"}, {"id": "wildlife--feral-bantha-herd", "name": "Feral Bantha Herd", "kind": "Minion", "typeline": "Minion", "faction": "The Feral Run", "role": "the abandoned world's new owners", "derived": "Soak 6 · Wounds 9 · M/R Defense 0/0", "group": "wildlife", "html": "<p><em>Minion — The Feral Run — the abandoned world's new owners</em></p>\n<blockquote>\n<p>The agri-world's last colonists shipped out two generations ago. Their livestock stayed, and it has opinions about the landing field.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Soak 6 · Wounds 9 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills (group only):</strong> Brawl, Resilience</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> Silhouette 2; mount (carries two riders, once won over); <strong>Herd</strong> (threatened banthas stampede as one — treat a stampede as a hazard: Hard Athletics or Coordination to clear, Daunting to turn the herd; vehicles roll Piloting against the same)</li>\n<li><strong>Equipment:</strong> Horns and mass (Brawl; Damage 6; Critical 4; Range [Engaged]; Knockdown).</li>\n</ul>\n<p><strong>Chassis:</strong> Bantha, Allies and Adversaries (transcription unverified against print — check before use).\n<strong>Using them:</strong> The mount trope and the comedy engine in one block: a stampede through a certification ceremony, a beast-drawn ferry where fuel costs more than feed, a herd that has claimed the only flat ground a shuttle can land on. Winning a herd's tolerance (Survival, a gifted PC's calm, or feed) hands the crew transport, cargo haulage, and local goodwill no scrip can buy.</p>", "search": "feral bantha herd minion — the feral run — the abandoned world's new owners the agri-world's last colonists shipped out two generations ago. their livestock stayed, and it has opinions about the landing field. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 4 1 1 1 2 1 soak 6 · wounds 9 · m/r defense 0/0 - skills (group only): brawl, resilience - talents: none - abilities: silhouette 2; mount (carries two riders, once won over); herd (threatened banthas stampede as one — treat a stampede as a hazard: hard athletics or coordination to clear, daunting to turn the herd; vehicles roll piloting against the same) - equipment: horns and mass (brawl; damage 6; critical 4; range [engaged]; knockdown). chassis: bantha, allies and adversaries (transcription unverified against print — check before use). using them: the mount trope and the comedy engine in one block: a stampede through a certification ceremony, a beast-drawn ferry where fuel costs more than feed, a herd that has claimed the only flat ground a shuttle can land on. winning a herd's tolerance (survival, a gifted pc's calm, or feed) hands the crew transport, cargo haulage, and local goodwill no scrip can buy."}, {"id": "wildlife--the-reef", "name": "The Reef", "kind": "Hazard", "typeline": "Hazard", "faction": "The Feral Run", "role": "a wreck-field become an ecosystem; declared homebrew, like the Scar's Echo", "derived": "", "group": "wildlife", "html": "<p><em>Hazard — The Feral Run — a wreck-field become an ecosystem; declared homebrew, like the Scar's Echo</em></p>\n<blockquote>\n<p>The war left a battlefield across the corridor. Ninety years made it a reef — salvage crust, mynock shoals, hull-barnacles — and a reef this old has a landlord.</p>\n</blockquote>\n<p>Run the Reef as <strong>terrain with intent</strong>, never as a stat block: dense wreckage (setback dice and silhouette limits), mynock shoals (system strain weather), sensor ghosts — and the <strong>anchor predator</strong>, an exogorth-class thing grown fat on ninety years of drifting salvage, silhouette 7, patient as geology. It is a fact of the field, not a monster to kill: its presence upgrades Piloting checks in its third of the reef; its strike is narrated, telegraphed (the wreck-field <em>flexing</em>), and survivable by flying well. <strong>The bigger fish:</strong> the Reef is where a pursuing hull learns why the locals throttle down — the crew that baits a pursuer across the landlord's parlor ends a chase without firing a shot. The corridor the recovery needs runs straight through; the episode seed is <em>The Reef</em> (<a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1</a>).</p>", "search": "the reef hazard — the feral run — a wreck-field become an ecosystem; declared homebrew, like the scar's echo the war left a battlefield across the corridor. ninety years made it a reef — salvage crust, mynock shoals, hull-barnacles — and a reef this old has a landlord. run the reef as terrain with intent , never as a stat block: dense wreckage (setback dice and silhouette limits), mynock shoals (system strain weather), sensor ghosts — and the anchor predator , an exogorth-class thing grown fat on ninety years of drifting salvage, silhouette 7, patient as geology. it is a fact of the field, not a monster to kill: its presence upgrades piloting checks in its third of the reef; its strike is narrated, telegraphed (the wreck-field flexing ), and survivable by flying well. the bigger fish: the reef is where a pursuing hull learns why the locals throttle down — the crew that baits a pursuer across the landlord's parlor ends a chase without firing a shot. the corridor the recovery needs runs straight through; the episode seed is the reef ([act 1](../../campaign/act-1.md))."}, {"id": "wildlife--the-aquilaris-deep", "name": "The Aquilaris Deep", "kind": "Hazard", "typeline": "Hazard", "faction": "The Feral Run", "role": "the drowned resort's landlord; declared homebrew", "derived": "", "group": "wildlife", "html": "<p><em>Hazard — The Feral Run — the drowned resort's landlord; declared homebrew</em></p>\n<blockquote>\n<p>The resort piers went under sixty years ago. Something moved into the shallows above them, and the fishing villages' first rule is: nothing on the water at dusk.</p>\n</blockquote>\n<p>The leviathan of Aquilaris (hop 2) is the physical session's weather: run it as a <strong>storm with intent</strong> — wake-surges that swamp skiffs, a shadow under the glass-bottomed old promenades, pressure rules and Piloting (Planetary) upgrades on the water at dusk. Roll the water, never the teeth: it breaches on a Despair, it hunts by wake, and it can be <em>read</em> (Survival or Xenology — its circuit is regular, and the locals' calendar of safe hours is accurate, which is worth more than any harpoon). It is also the module of the Chadra-Fan's nightmare — Mikrés's drowning-fear is on his sheet, and this is the session that pays it honest screen time without cruelty: give him the engineering solution (the pumps, the pontoon, the winch) that saves the day from dry land.</p>", "search": "the aquilaris deep hazard — the feral run — the drowned resort's landlord; declared homebrew the resort piers went under sixty years ago. something moved into the shallows above them, and the fishing villages' first rule is: nothing on the water at dusk. the leviathan of aquilaris (hop 2) is the physical session's weather: run it as a storm with intent — wake-surges that swamp skiffs, a shadow under the glass-bottomed old promenades, pressure rules and piloting (planetary) upgrades on the water at dusk. roll the water, never the teeth: it breaches on a despair, it hunts by wake, and it can be read (survival or xenology — its circuit is regular, and the locals' calendar of safe hours is accurate, which is worth more than any harpoon). it is also the module of the chadra-fan's nightmare — mikrés's drowning-fear is on his sheet, and this is the session that pays it honest screen time without cruelty: give him the engineering solution (the pumps, the pontoon, the winch) that saves the day from dry land."}, {"id": "keepers--master-n-kata-del-gormo", "name": "Master N'Kata Del Gormo", "kind": "Nemesis", "typeline": "Nemesis", "faction": "no faction (the swamp)", "role": "the hermit of Verdanth; run unstatted", "derived": "", "group": "keepers", "html": "<p><em>Nemesis — no faction (the swamp) — the hermit of Verdanth; run unstatted</em></p>\n<blockquote>\n<p>Four arms, four small black eyes, a serpentine lower half at ease in black water, and a twisted staff crowned with a crystal prism, used mostly to point at things he finds funny. His neighbors do not call him a Jedi. They call him the fellow in the swamp, and they are careful to speak well of him.</p>\n</blockquote>\n<p><strong>Canon:</strong> a Hysalrian Jedi Master who, according to Legends rumor, lived as a hermit on a swamp world and trained a crashed young Yoda and a human friend until a Republic ship answered their distress call; the dates are \"lost.\" Yoda is born in 104 AR; the swamp is <strong>Verdanth</strong>, hop 3 on the Run; and the Republic ship that answers the distress call gets there on a lane your players relit. Nothing published contradicts any of it.</p>\n<p><strong>The break:</strong> He left at the Reformation itself. When the Order placed itself under the Chancellor, he said the thing out loud — <em>the Force outlives every government that has ever claimed it, and a Jedi who becomes the state's cop has confused the vessel for the water</em> — and walked rimward while every other Jedi walked coreward. He has been on Verdanth about ninety years; Hysalrian lifespans are unrecorded, which is to say, long enough. He does not use the word <em>withdrawn</em>, does not consider himself to have left anything that still existed, and has never once wondered whether Coruscant approves of him.</p>\n<p><strong>Stats:</strong> none, deliberately. He is a teacher and a question, not an encounter; if violence ever reaches him, the scene has already gone wrong in a way no stat block fixes. (If a block is ever truly needed, assign an official Jedi Master chassis and verify it against print before use, per this library's sourcing rule.)</p>\n<p><strong>Using him:</strong> Zen absurdity with a true bottom — jokes, riddles, wrong answers that turn out to be the rightest thing anyone says all campaign. Play him at an angle to every scene: he answers the question under the question, feeds people before he will argue with them, and finds the Temple's solemnity genuinely, warmly hilarious. He anchors the campaign's spiritual contrast in one line: <strong>the Vigil kept the stones, the Temple kept the rules, and the swamp kept the thing itself.</strong> His arc is not a turn — he is already what the legend says he becomes — it is a siege: the Awakening keeps washing gifted people up on his shore (the Last Muster's call, further down this file, is why <em>this</em> shore — he has heard the grinding for ninety years, knows the sound is grief and not invitation, and will say so only in riddles), Tane keeps arriving to win an argument he declines to have, and the campaign gets to ask him whether transcending politics also means abandoning people. He is the era's rarest thing, a living-mentor Wellspring (Part VII): he can support Force Rating increases and new power trees, and he teaches the way swamps teach — slowly, wetly, and only what you came in already carrying.</p>\n<p><strong>Wants from the crew:</strong> nothing, which is the most disarming thing on the Run; later, the true shape of what they saw at the beacon — he collects what the Force is <em>doing</em>, never who is doing it. <strong>Offers:</strong> sanctuary with no registry attached; training that does not require joining anything; and, to the crew's gifted adult, the one thing neither Temple nor Sith will offer — an answer to <em>what is this for?</em> that is not also a recruitment.</p>", "search": "master n'kata del gormo nemesis — no faction (the swamp) — the hermit of verdanth; run unstatted four arms, four small black eyes, a serpentine lower half at ease in black water, and a twisted staff crowned with a crystal prism, used mostly to point at things he finds funny. his neighbors do not call him a jedi. they call him the fellow in the swamp, and they are careful to speak well of him. canon: a hysalrian jedi master who, according to legends rumor, lived as a hermit on a swamp world and trained a crashed young yoda and a human friend until a republic ship answered their distress call; the dates are \"lost.\" yoda is born in 104 ar; the swamp is verdanth , hop 3 on the run; and the republic ship that answers the distress call gets there on a lane your players relit. nothing published contradicts any of it. the break: he left at the reformation itself. when the order placed itself under the chancellor, he said the thing out loud — the force outlives every government that has ever claimed it, and a jedi who becomes the state's cop has confused the vessel for the water — and walked rimward while every other jedi walked coreward. he has been on verdanth about ninety years; hysalrian lifespans are unrecorded, which is to say, long enough. he does not use the word withdrawn , does not consider himself to have left anything that still existed, and has never once wondered whether coruscant approves of him. stats: none, deliberately. he is a teacher and a question, not an encounter; if violence ever reaches him, the scene has already gone wrong in a way no stat block fixes. (if a block is ever truly needed, assign an official jedi master chassis and verify it against print before use, per this library's sourcing rule.) using him: zen absurdity with a true bottom — jokes, riddles, wrong answers that turn out to be the rightest thing anyone says all campaign. play him at an angle to every scene: he answers the question under the question, feeds people before he will argue with them, and finds the temple's solemnity genuinely, warmly hilarious. he anchors the campaign's spiritual contrast in one line: the vigil kept the stones, the temple kept the rules, and the swamp kept the thing itself. his arc is not a turn — he is already what the legend says he becomes — it is a siege: the awakening keeps washing gifted people up on his shore (the last muster's call, further down this file, is why this shore — he has heard the grinding for ninety years, knows the sound is grief and not invitation, and will say so only in riddles), tane keeps arriving to win an argument he declines to have, and the campaign gets to ask him whether transcending politics also means abandoning people. he is the era's rarest thing, a living-mentor wellspring (part vii): he can support force rating increases and new power trees, and he teaches the way swamps teach — slowly, wetly, and only what you came in already carrying. wants from the crew: nothing, which is the most disarming thing on the run; later, the true shape of what they saw at the beacon — he collects what the force is doing , never who is doing it. offers: sanctuary with no registry attached; training that does not require joining anything; and, to the crew's gifted adult, the one thing neither temple nor sith will offer — an answer to what is this for? that is not also a recruitment."}, {"id": "keepers--master-seldra-tane", "name": "Master Seldra Tane", "kind": "Nemesis", "typeline": "Nemesis", "faction": "the Jedi Order (the Temple)", "role": "the Core's envoy to the Run; run unstatted", "derived": "", "group": "keepers", "html": "<p><em>Nemesis — the Jedi Order (the Temple) — the Core's envoy to the Run; run unstatted</em></p>\n<blockquote>\n<p>Human, mid-forties, travel robes pressed anyway. Every form performed perfectly — the bow measured, the certification sealed, the courtesy exact — and the forms are not empty: they are what held her Order together after Ruusan, and she can tell you which grave each one is written on.</p>\n</blockquote>\n<p><strong>The mission:</strong> She arrives with the Republic's accreditation mission after the third certified relight reaches the Core's newsfeeds (Act 2 — news travels by courier, so give it a season), carrying both halves of the Core's offer. The Temple's half: the gifted children found and sent, the sealed temples reopened under the Council, and no Jedi in the Rim who answer to no Council. The Senate's half: reintegration under a single <strong>sector seat</strong> — one senator for the whole Grumani sector, in place of the old one-world-one-seat delegations (see <a href=\"#\" class=\"xin\" data-nav=\"page:setting:republic\">the Republic</a>). She believes in both, and she is the best possible person to sell them: taken at three, no attachments, a flawless record — the system's perfect product, sent to sell the system that made her.</p>\n<p><strong>Stats:</strong> none yet, by the same rule as Del Gormo: an envoy and a question, not an encounter. If a duel ever becomes possible, assign an official chassis and verify it against print before use. Until then she does not roll.</p>\n<p><strong>Using her:</strong> Form and ritual above meaning and intent — but play the forms as load-bearing, never as parody: her certifications are real, her word is the one Republic writ that cannot be forged out here, and the grief under the doctrine is real too. Her contempt for Del Gormo is doctrinal, not personal, and it has weight: when the Order buried its Knights at Ruusan and rebuilt itself as service, he kept the Force and abandoned the people — desertion in robes, however serene. His serenity sounds different when you remember he pronounced it while the graves were being dug; make the table feel that her side of the argument is <em>hard</em>. She keeps visiting the swamp to win it, keeps losing, and keeps coming back — run those visits on camera; they are the campaign's philosophy given two voices, and they should be funny until the moment they are not. Whether she holds to the end or cracks in the swamp is play's to decide: write her firm and visiting, and keep both endings live. Del Gormo's counter, when it finally lands, is not an argument — it is noticing, aloud, that nobody (not the creche, not the Council, not the Senate) has ever once asked her what <em>she</em> wants.</p>\n<p><strong>Wants from the crew:</strong> the names of the gifted (she will ask politely, once); passage and local standing for the mission; an honest account of the hermit on Verdanth, about whom the Temple's file is one rumor long. <strong>Offers:</strong> a Jedi's word; Jedi-tag authentication from the one archive that was never scattered; charters with the Senate's seal on them; and, to the gifted adult she cannot train and cannot stop watching, attention without ownership — the Temple's whole unanswerable problem in one person.</p>", "search": "master seldra tane nemesis — the jedi order (the temple) — the core's envoy to the run; run unstatted human, mid-forties, travel robes pressed anyway. every form performed perfectly — the bow measured, the certification sealed, the courtesy exact — and the forms are not empty: they are wha atient Apprentice's fighter: no name, no transponder; the fastest thing on the Run, and the least seen</em></p>\n<blockquote>\n<p>A pre-Ruusan interceptor out of a dead principate's yards, hull the color of no color, running no transponder and answering no hail — a ship that is, legally, nothing. Nobody on the Run has ever seen it twice.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Silhouette</th>\n<th style=\"text-align: center;\">Speed</th>\n<th style=\"text-align: center;\">Handling</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">6</td>\n<td style=\"text-align: center;\">+3</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Defense Fore/Port/Starboard/Aft 1/—/—/0 · Armor 2 · Hull Trauma Threshold 6 · System Strain Threshold 6</strong></p>\n<ul>\n<li><strong>Hyperdrive:</strong> Primary: Class 1</li>\n<li><strong>Navicomputer:</strong> Yes</li>\n<li><strong>Sensor Range:</strong> Close</li>\n<li><strong>Crew:</strong> One pilot</li>\n<li><strong>Encumbrance Capacity:</strong> 4</li>\n<li><strong>Consumables:</strong> One week · <strong>Price/Rarity:</strong> 150,000 credits/6 · <strong>Customization Hard Points:</strong> 1</li>\n<li><strong>Weapons:</strong></li>\n<li>Light laser cannon (Fire Arc Fore; Damage 5; Critical 3; Range [Close])</li>\n<li>Concussion missile launcher (Fire Arc Fore; Damage 6; Critical 3; Range [Short]; Blast 4, Breach 4, Guided 3, Limited Ammo 6, Linked 1, Slow-Firing 1)</li>\n</ul>\n<p><strong>Chassis:</strong> RZ-1 A-wing Light Interceptor, Age of Rebellion Core Rulebook (adjustments: none — transcribed from print).\n<strong>Era notes:</strong> Speed 6 and Handling +3 are the point; the hull is paper (six trauma), which is doctrine, not weakness — a ship built to never be hit. The Bane line does not fight; it <em>leaves</em> — and this is the ship that makes leaving a certainty. Nothing a wayfinder crew owns can match its speed, hold a sensor lock on a hull running dark, or follow a Class 1 hyperdrive off a decayed lane. Mendac does not travel in it: the Scrub is done by liner, freighter, and hired hulls, and the interceptor waits in a hidden berth — a dead spur, a principate ruin, a hollowed asteroid off the Sanrafsix Corridor — for the exits. Its only wear is on the docking clamps.\n<strong>Using it:</strong> With Piloting (Space) 3 and Gunnery 3 she flies it as well as she does everything else, which means the fight is hers to choose and never the crew's. Two rules. First, the ship exists to <em>not be seen</em>: she disengages the moment a fight turns evidentiary, and a chase the crew \"wins\" is a chase she chose to end. Second, when she does fire, it is to leave no witnesses — Breach 4 concussion missiles against a century-old heirloom hull (Armor 3–4) put a lane-runner's engines out in one volley, and a ship adrift on a dead lane with no beacon is a ship nobody ever finds. Run an encounter with it as weather, not a dogfight: a contact that appears on the edge of sensors, matches every course change for one long minute, and is gone before anyone can say what it was. If the crew ever gets a clear look at it — a hull silhouette, a drive signature — that is the first hard evidence in the campaign that the Absence has a shape, and it should cost her something: the Mother would not forgive a <em>second</em> sighting. Improv hook: the docking cradle at a freshly opened site is still warm, and no ship anyone can find left it.</p>", "search": "sith scout fighter — mendac's interceptor vehicle — the sith line (dial 1) — the patient apprentice's fighter: no name, no transponder; the fastest thing on the run, and the least seen a pre-ruusan interceptor out of a dead principate's yards, hull the color of no color, running no transponder and answering no hail — a ship that is, legally, nothing. nobody on the run has ever seen it twice. silhouette speed handling :-: :-: :-: 3 6 +3 defense fo very course change for one long minute, and is gone before anyone can say what it was. if the crew ever gets a clear look at it — a hull silhouette, a drive signature — that is the first hard evidence in the campaign that the absence has a shape, and it should cost her something: the mother would not forgive a second sighting. improv hook: the docking cradle at a freshly opened site is still warm, and no ship anyone can find left it."}, {"id": "keepers--what-the-line-wants-and-how-it-works", "name": "What the line wants, and how it works", "kind": "Special", "typeline": "", "faction": "", "role": "", "derived": "", "group": "keepers", "html": "<p><strong>The strategy in one line: every true thing about the Sith, out of the galaxy and into her hands.</strong> Veritis is not building an empire, a treasury or an army, and wants none of them yet. Seventy years after Bane, the line's whole position rests on two facts — it holds the only unbroken transmission of the dark side, and the Jedi believe the Sith extinct — and both are facts about <em>knowledge</em>. So that is what she works on. Every holocron, teaching, tomb-record and court archive the New Sith Wars scattered is to be found, verified, and removed: the genuine into the line's keeping, the galaxy left with nothing but its fakes. The Republic will be corrupted eventually; this century's work is making sure that when anyone goes looking for what the Sith were, they find only what Veritis has left for them.</p>\n<p><strong>Why she is looking at the Run.</strong> The Grumani sector was the Brotherhood of Darkness's country — the Daimanate, the Bactranate, the Arkadianate, the Dyarchy were its inheritance — and their vaults hold the war's true records: rosters, academy lists, correspondence, the paperwork of a thousand self-made Dark Lords. Every page is <em>incriminating</em>: it is the evidence from which anyone could reconstruct what the Sith were at the end, and therefore deduce what the Sith became. The worst single item is <strong>the holocron of Lord Kaan</strong> (its own section below), which names Bane and records the heresy that became the line. The line has known since Bane that the record existed — he is <em>in</em> it — and known only that the war's end lost it; the catalogue's standing best guess has always been the Bactranate vaults under Jutrand. So the country had to be cleared before the galaxy came back to read it — and when the clearing outran two pairs of hands, the Run had to reopen <em>in her order</em>, and the line could not be seen to open it: a guild has been opening doors for her for a decade, one beacon at a time, in her sequence — and the one door the guild could never find, Mendac finally opened herself, lighting Vesta-9 on her way out of its emptied vault so the advance would resume.</p>\n<p><strong>The Patronage.</strong> Through a coreward front the Lamplighters believe to be a private antiquarian consortium, the line funds the guild. The money comes with two conditions the Grandmaster of Charts took to be a collector's vanity: the relighting proceeds in the patron's sequence, and the patron's survey teams get first look at anything a relight uncovers. The sequence is the Sith search pattern — principality by principality, vault by vault — and the survey teams are the Scrub. The prizes are wages: the guild believes the patron is buying beacons, when it is really hiring ten thousand prospectors to turn over a country's soil — and the first-look clause is both cover (her people, anywhere on the Run, with paper that explains them) and the whisper network's first thread. The pattern is even visible from the outside, to anyone who thinks to look: it was the patron's money that turned the guild off the Corellian Run at New Cov ten years ago — Ryloth unreached, the Core baffled — and pointed it down the dead Duros Space Run toward the principate vaults. The day the guild pivoted is the day the search began. Ophira Zel does not know who her patron is. She has begun to suspect that the registry leaks; she has not begun to suspect the money.</p>\n<p><strong>What Veritis wants.</strong></p>\n<ul>\n<li><strong>The truth, all of it.</strong> Verification is the point: she can tell a genuine relic from the Inheritors' best forgery at a glance, and the line's inventory of what survived Ruusan is the only honest one in the galaxy.</li>\n<li><strong>The galaxy wrong, not ignorant.</strong> Absence invites questions; error answers them. Counterfeits are left exactly where they lie, fake lineages are allowed to flourish, and a rival who has trained on a forgery is worth more to her alive than dead — until he starts to find real things.</li>\n<li><strong>Exactly one heir.</strong> Any third claim on the Sith inheritance — grave-robbers in costume (the Inheritors), a prophet in the Sith Worlds (Millennial), a Temple that starts looking outward — is not an enemy to be fought but a reader to be denied the book.</li>\n<li><strong>To be unnecessary.</strong> Never a name in a dispatch; never a protagonist. The day anyone can point at Veritis is the day the century was wasted.</li>\n</ul>\n<p><strong>What Mendac wants</strong> is simpler and younger: to be good enough. She was a workhouse child who walked into a cave on a dare and walked out over a Sith Master's body; everything since has been the Mother teaching her what that was worth. Anonymity is the grade; the Inheritors are the exam; and underneath the doctrine is an apprentice who has begun to suspect that patience is the Master's weapon against <em>her</em> as much as against the galaxy — which is the Rule of Two working as designed, and not this campaign's problem. She has friends she left on a workhouse world seven years ago. She has never once checked on them. She thinks about it more than the Mother knows.</p>", "search": "what the line wants, and how it works the strategy in one line: every true thing about the sith, out of the galaxy and into her hands. veritis is
