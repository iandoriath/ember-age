rives at long range with throttled turbolaser fire — narrate the disabling, do not roll it; the marines board under stun and take prisoners cleanly; <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--commander-joss-reike\">Commander Joss Reike</a> files charges <em>correctly</em>. Play the aftermath, not a massacre: an Admiralty brig, a scrupulously fair hearing, <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-vess-marrow\">Captain Vess Marrow</a> posting bond she cannot afford, Nerra buying testimony, Skell selling his — twice, to both sides — and <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--keeper-adressa-vhail\">Keeper Adressa Vhail</a> declining to testify at all. The crew flies again owing everyone — and the Annexation now has their name in its founding paperwork.</p></div>\n\n<p><em>If shots were actually fired at the sloop:</em></p>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m01-8\" data-args=\"{&quot;faction&quot;: &quot;Admiralty&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;Shots fired at the Steadfast over Vesta-9 — the corridor now provably needs protecting, with the crew&#x27;s name in the log&quot;}\"><button class=\"btn\">Advance clock: Admiralty +1</button><span class=\"runact-desc\">Shots fired at the Steadfast over Vesta-9 — the corridor now provably needs protecting, with the crew&#x27;s name in the log</span></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">They name the stranger on the record</p><p>Reike is gentle, correct, and keeps every promise — that is what makes it dangerous. His finding is filed the same night, and it is <em>true</em>, which is why it travels: courteous letters that arrive on time, a fleet analyst's standing interest in the crew's future certifications, and an Admiralty with a lawful reason to be on every lane the crew opens. Keep it as texture, not a cage — the pipeline runs both ways, and a crew the Admiralty trusts can read its files. GM only: the certification packet also carries the codes to the guild's desks, and the reader Dial 3 put behind them now knows the crew <em>noticed</em>. The Weeding will be gentle with them, at first — gardeners are not pruned — but the crew's rivals will start having remarkable luck.</p></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">They sell Osk's page — or the book's address</p><p><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a></strong> pays what she promised, the same hour, and is warm about it forever. What she really bought is an address: by morning the guild has bought Skell's debt-paper at triple its face, a probate lien follows it to the infirmary, and the book leaves the guild's hands within the month — to the patron's \"survey teams,\" who have wanted it for ten years (Dial 3) — and the prizes up the Run stop stalling and start accelerating, in the patron's order, faster than any crew can follow. Osk hears who sold her before she dies; the orderly will tell the crew she asked for their names. The port hears too. Nothing about it is a disaster, which is the point: they will only understand what they sold when they reach the first vault that has already been emptied.</p></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">They back Skell's lien</p><p>Skell pays the cut the same hour — he is scrupulous about exactly the debts that profit him — and by morning the guild has bought his paper at triple its face: the lien the crew co-signed is now a guild precedent, and the <em>Overdue</em> is a licensed creditor working up the Run one bought debt at a time, with the crew's names on the founding claim. Osk hears who swore against her promise before she dies; the orderly will tell the crew she asked for their names.</p></div>\n\n<p><em>If the crew co-signed the claim:</em></p>\n<div class=\"runact\" data-kind=\"thread\" data-aid=\"m01-9\" data-args=\"{&quot;ledger&quot;: &quot;holds&quot;, &quot;item&quot;: &quot;Skell&#x27;s lien over Osk — co-sworn by the crew&quot;, &quot;holder&quot;: &quot;Capt. Ferro Skell (guild-bought by morning)&quot;, &quot;since&quot;: &quot;S1&quot;, &quot;notes&quot;: &quot;The crew&#x27;s signature is on the founding claim&quot;}\"><button class=\"btn\">Log thread (holds): Capt. Ferro Skell (guild-bought by morning)</button><span class=\"runact-desc\">Skell&#x27;s lien over Osk — co-sworn by the crew</span></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">They hand the evidence to Vhail</p><p><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--keeper-adressa-vhail\">Keeper Adressa Vhail</a></strong> does not thank them. Someone is opening doors on purpose, with the old codes, and her order's deed never contemplated that — she leaves with the crew's trust and her order's crisis in the same satchel, and both halves of the Vigil will come asking what else the crew saw. The sealed places open to them. So does the argument.</p></div>\n\n<p><em>If the crew put the evidence formally in Vigil hands:</em></p>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m01-10\" data-args=\"{&quot;faction&quot;: &quot;Vigil&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;The Vigil learns someone is opening the sealed doors on purpose — the custody argument goes from doctrinal to real&quot;}\"><button class=\"btn\">Advance clock: Vigil +1</button><span class=\"runact-desc\">The Vigil learns someone is opening the sealed doors on purpose — the custody argument goes from doctrinal to real</span></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">They lie clean and get caught</p><p>A Despair at certification, or any careful reader later: the wake log says what it says, and the witnesses of record stood next to it. Nothing happens tonight. Later, a guild inquiry, an Admiralty analyst's letter, or a Vigil warden who simply <em>looks</em> at them — and every guild door that opened swings a little less easily. The crew learns that in this era, a certificate is a promise, and the Run keeps score.</p></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">They claim the fee without a guild witness</p><p>No certificate, no bond: the claim files as \"unwitnessed,\" which any crew may counterclaim — Skell will, gleefully, and the <em>Larksong</em> was there too. The fee freezes, the famous number was never theirs to begin with, and Grell's cut evaporates with both, which he takes personally and repriced. <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a> will offer to backdate a certification later, sweetly, for a favor the guild names. That favor is a hook — spend it on whichever Act 1 seed the party is circling.</p></div>"}]}, {"id": "02", "title": "Session Two — The Toll at Enarc", "intro": "<p><em>The GM-screen module for hop 1. Run the session from this page, one scene at a time — it assumes you remember broad strokes, not details: every name is introduced and every number is stated where you need it. Marked names open stat blocks. </em><em>Branch-safe</em><em>: no particular Session One outcome is assumed — collect what your table actually did in the carry-forward table and run everything else as written.</em></p>", "scenes": [{"sid": "s1", "title": "What you need to know (even if you read nothing else)", "html": "<p><strong>Where we are.</strong> The crew is flying the first dead leg past Vesta-9 toward <strong>Enarc</strong> — hop 1 of the dark Duros Space Run. The Lamplighters' guild posts cash prizes for relighting dead beacons; the advance stalled five years on unfindable Vesta-9, Vesta-9 lit itself (Session One), and the guild instantly posted the next prize: <strong>Enarc, 8,000 scrip</strong> — paperwork dated, suspiciously, <em>before</em> Vesta-9's certificate cleared. A relight pays only if a guild observer certifies it; the crew likely holds a <strong>witness charter</strong> (250 scrip per certified lighting), and Chartmistress Bel Nerra — the guild's certifier for this corridor — is <strong>a day behind them</strong> and arrives in time for the certification scene.</p>\n<p><strong>The twist of the night: Enarc is a hermit kingdom.</strong> When the Run went dark, a minor Hutt with no standing in the wider clan-economy realized darkness was the one market he could corner. <strong>Sorulba the Anchor</strong> closed the junction, crowned himself its anchor, and has spent forty years running a small, sealed, <em>hedonistic</em> kingdom — court festivals while the gantries rust, subjects who need exit permits they never get, races and feasts as the bread-and-circuses of a state going nowhere on purpose. He is not a power. He is a weak king whose whole reign depends on the door staying shut, and he knows it. And the kingdom's door swings one way: <strong>anyone may arrive; no one leaves without the king's leave</strong> — and in forty years he has granted almost none. That is why the Run knows nothing of Enarc even though the junction sits on every old chart: the strays and smugglers who found the closed kingdom never came back to describe it. Run-side spacers put it plainly — <em>Enarc eats ships.</em> Its one foreign relationship runs the <em>other</em> way — quiet relations with the <strong>Naboo Admiralty</strong> down the Enarc Run (call it <strong>the Naboo lane</strong> at the table), two closed states discreetly trading, the embassy's personnel exempted by treaty. And the beacon mast on the palace spine is <em>maintained, polished, and off</em>: the king keeps it perfect as proof he could open the door any day he pleases. He never has.</p>\n<p><strong>Tonight is the kingdom's opening crisis, live.</strong> The beacon prize has brought outside hulls to the closed junction for the first time in decades — <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-ferro-skell\">Captain Ferro Skell</a> got there first, a couple of gold-rush crews behind him, then the <em>Larksong</em>, then the crew — and every one of them is now inside the one-way door, counting days. Skell understood the rule fastest, which is why he is spending the crew's biography like currency: he is buying his way toward an exit visa. The court is overwhelmed, fascinated, and split: Sorulba wants the gates sealed and the visitors gone; <strong>Jeeda the Younger</strong> has run the numbers and wants the kingdom <em>open</em>. The crew arrives carrying the one thing neither Hutt can print: guild paper that can make a relight legal. And at the center of it all sits the session's centerpiece — this is the campaign's <strong>first beacon the crew lights with their own hands</strong> (Vesta-9 lit itself). Protect Scene 4.</p>\n<p><strong>The cast, one line each</strong> <em>(stats in brackets)</em>:</p>\n<ul>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:lanes-ledgers--sorulba-the-anchor\">Sorulba the Anchor</a></strong> — the weak king; wants the beacon dark and his kingdom closed; never leaves the dais; his word is good and priced. He speaks to outsiders only through Vopp — being addressed directly is a privilege he sells. <em>(Lanes &amp; Ledgers)</em></li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:lanes-ledgers--jeeda-the-younger\">Jeeda the Younger</a></strong> — young Hutt, the court's \"auditor,\" the opening faction; wants the beacon lit with the kajidic named <strong>port authority of record</strong>. <em>(Lanes &amp; Ledgers)</em></li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:lanes-ledgers--kajidic-enforcers\">Kajidic Enforcers</a></strong> — the palace guard; commercial, unhurried, stun-first. <em>(Lanes &amp; Ledgers)</em></li>\n<li><strong>Scale-Master Vopp</strong> — the king's voice, clerk, and spymaster: the scales, the picket log, the court record. Unstatted social terrain; has heard everything twice.</li>\n<li><strong>Draz</strong> — the court's swoop champion, the king's pride; unstatted — borrow Swoop Ace \"Kettle\" Maro's block. <em>(Out on the Run)</em></li>\n<li><strong>Purser-Lieutenant Ansa Breck</strong> — the Naboo Admiralty's envoy at the kingdom's one embassy; <strong>treaty wing</strong> (wants the lane lit, tariffed low, friendly). Unstatted — borrow Lieutenant-at-Writs Calloway. <em>(Republic &amp; Admiralty)</em></li>\n<li><strong>Lieutenant Dray Kollen</strong> — Breck's escort; <strong>Founding cadre</strong> (would keep the junction a chokepoint until the fleet can hold it — the king's side tonight, ironically). Mute background: he drills his marines on the embassy pad in public view and lets the image talk. <em>(borrow Admiralty Marines)</em></li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-ferro-skell\">Captain Ferro Skell</a></strong> + <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--skell-s-crew\">Skell's crew</a> and <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--the-overdue-debt-bought-ghtroc-720\">The Overdue, debt-bought Ghtroc 720</a> — the crew's enemy peer from Session One. He landed first, and the first thing he sold the court was <em>the crew's biography</em>. <em>(Vesta-9 &amp; the Crew's Orbit)</em></li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-vess-marrow\">Captain Vess Marrow</a></strong> + the <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--larksong-crew\">Larksong crew</a> — the friendly rival, champion of the last paid prize; the season wager is live. <em>(Vesta-9 &amp; the Crew's Orbit)</em></li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a></strong> — the guild certifier, a day behind. <em>(Vesta-9 &amp; the Crew's Orbit)</em></li>\n</ul>\n<p><strong>Rules shorthand:</strong> Average = 2 difficulty dice, Hard = 3. A <strong>fragment</strong> is the campaign's clue-card (form, tag, Question, claim); hand it over physically and log it in the <a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">fragment tracker</a>. <strong>Triumph</strong> = spectacular extra success; <strong>Despair</strong> = success-independent complication.</p>"}, {"sid": "s2", "title": "Carrying Session One forward", "html": "<p>Collect what the table actually did; use every row that applies. (Set by Session One's Handoff table — same labels.)</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>If, at Vesta-9, the crew…</th>\n<th>Then, at Enarc</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Named the stranger on the record — testified that an unknown hand lit Vesta-9 deliberately</td>\n<td>The finding empowers the Founding wing: Kollen holds a mandate as well as an escort post, Breck's soft offer hardens, and the <em>Steadfast</em>'s tender is scheduled for Enarc within weeks. The court hears of it and reads it correctly: the outside is already arguing over who polices <em>them</em>.</td>\n</tr>\n<tr>\n<td>Certified it clean — \"unknown hand, lane clear\"</td>\n<td>Guild doors are warm — and if Nerra's fine print named the guild <em>charting authority for the corridor</em>, the crew now carries that sovereignty claim into a king's court whether they like it or not. Sorulba has read the certificate. He quotes it.</td>\n</tr>\n<tr>\n<td>Backed Skell's lien</td>\n<td>The court already holds his <em>notarized</em> version — the crew's names co-sworn on the founding claim — so correcting the record at Enarc now smells of perjury, and the court enjoys the smell. Skell's exit-visa fund got its down payment from their cut.</td>\n</tr>\n<tr>\n<td>Handed the evidence to Vhail</td>\n<td>A Vigil circuit ship shadows the crew's transponder a day behind. It does not hail. It is taking notes — and its first question about the strange navy is the campaign's in miniature: a fleet full of order and empty of the Force, now census-curious about the gifted.</td>\n</tr>\n<tr>\n<td>Sold Osk's page — or the book's address</td>\n<td>The Scrub is ahead of them: the kingdom's pickets logged a ghost transit crossing the far sky, outbound up the Run, three days ago — unanswered, unhailed. The crew is no longer opening doors; they are following someone through them.</td>\n</tr>\n<tr>\n<td>Kept the page (or hold the book)</td>\n<td>Osk's margins cover the junction: the true approach past the dead buoys (boost die on the jump), and a note in her hand — <em>\"Enarc's scales are honest. The scale-master is not.\"</em></td>\n</tr>\n<tr>\n<td>Returned to Osk / hold the full story</td>\n<td>Her testimony names this place: the \"antiquarians'\" survey she flew skirted the closed kingdom once, ran dark, and was never challenged. The pickets remember the hull that would not answer. That memory is in the log — see the Court.</td>\n</tr>\n<tr>\n<td>However it went with Skell</td>\n<td>Skell landed first — and his first sale to the court was the crew's biography: their debts, their record at Vesta-9, his own edit of the lane ambush. Everything the court knows about the crew, Skell priced. Correcting the record is the crew's problem now, and the court enjoys watching them try.</td>\n</tr>\n<tr>\n<td>However the Record went</td>\n<td>Breck has read the Vesta-9 certificate — the Admiralty reads everything that touches its road — and she opens with it. Truth-tellers get trust; clean-certifiers get a knowing pause and a slightly <em>better</em> offer. Founding papers follow you.</td>\n</tr>\n</tbody>\n</table></div>\n<p>Carry the small economy too: the witness charter (250/lighting) applies tonight; Grell's cut, if signed, follows the crew's fees; the Marrow wager stands.</p>\n<div class=\"runact\" data-kind=\"thread\" data-aid=\"m02-1\" data-args=\"{&quot;ledger&quot;: &quot;knows&quot;, &quot;who&quot;: &quot;Sorulba&#x27;s court&quot;, &quot;what&quot;: &quot;The crew&#x27;s biography — their debts, their record at Vesta-9, Skell&#x27;s own edit of the lane ambush&quot;, &quot;since&quot;: &quot;S2&quot;, &quot;notes&quot;: &quot;Sold by Skell before the crew landed; correcting the record is play, and the court enjoys watching&quot;}\"><button class=\"btn\">Log thread (knows): Sorulba&#x27;s court</button><span class=\"runact-desc\">The crew&#x27;s biography — their debts, their record at Vesta-9, Skell&#x27;s own edit of the lane ambush</span></div>"}, {"sid": "s3", "title": "Scene 1 — Arrival: The Closed Door", "html": "<p><strong>The jump.</strong> Vesta-9 to Enarc is an uncertified dead leg: <strong>Hard Astrogation</strong> (Osk's page or margins add a boost die). Enarc is not <em>lost</em> — it is on every old chart, a famous junction — it is <em>closed</em>: anyone can attempt the jump; Osk's margins only make it safe. Skell beat everyone here because he jumped straight from the lane while the crew sat through certification.</p>\n<p><strong>The challenge.</strong> The beacon mast reads cold on every band — then a picket boat older than anyone aboard slides out of the dark with its lights off and speaks:</p>\n<blockquote>\n<p>\"This is the Anchorage of Sorulba. Enarc is open to you. Enarc is not open <em>behind</em> you — the Anchorage keeps what it is given. Dock and be welcome, guests of the court; or come about now, and carry your business back into the dark. There is no third reading. The dark does not care which.\"</p>\n</blockquote>\n<p>The warning is genuine, delivered once, and phrased so that gold-rush crews have ignored it all week. If the players hesitate, let them — entering <em>knowing</em> is the choice the scene is for. The prize, the picket log, and everything else this session wants are on the far side of that door.</p>\n<p><strong>Then the court decides to be delighted.</strong> Whatever business they state, the answer comes back an hour later in a different voice — younger, silkier (Jeeda's office): the court of Enarc <em>welcomes</em> the celebrated relighters of Vesta-9 as guests of the Anchor. Berthing is free. Fuel is a gift. Each crew member is assigned a <strong>host</strong> — a courtier-minder who will not leave their side, takes notes behind their smile, and answers every question with a better meal. This is the hermit kingdom's oldest trick: the door does not open; it <em>swallows</em>. And on the dock, the crew gets their first taste of Skell's head start — their minders already know things about them: the lease, the impound, a version of the lane ambush with the guns pointing the other way. <em>(Everything the court knows, Skell sold — see the carry-forward row. Let the players discover the dossier by being complimented on details they never mentioned.)</em></p>\n<p><strong>What the players should feel:</strong> they are celebrities in a sealed country — watched, feted, priced — and everyone at this court is starving for the outside while pretending not to be. First outside faces in decades. Every conversation is an interrogation wearing perfume. And on the guest docks, the gold-rush captains who beat them here are learning the rule the hard way — one mutters \"third week\" into his drink — because berthing is free, fuel is a gift, and the exit paperwork is always <em>almost</em> ready.</p>"}, {"sid": "s4", "title": "Scene 2 — The Festival", "html": "<p><strong>The kingdom, seen walking.</strong> A pre-Ruusan customs hulk grown into a palace-city: the old inspection halls hung with tapestries, fuel bowsers repainted as triumphal columns, a court that eats imported delicacies off Naboo-stamped crates while the dock families ration. Give the players the two beats that matter: the <strong>beacon mast</strong> on the palace spine — polished, maintained, dark, the king's crown jewel and his proof that the closed door is a <em>choice</em> — and the <strong>festival</strong> the court throws for its new guests, because a hermit court celebrates anything that breaks the boredom.</p>\n<p><strong>Run the festival as one braided scene</strong> — the crew at the center table, three threads arriving over the courses:</p>\n<ul>\n<li><strong>The wager settles loudly.</strong> <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-vess-marrow\">Captain Vess Marrow</a> pays or collects on the Vesta-9 race in front of the whole court — toasts, the story retold with the crew in it, the court adopting favorites. <em>(Cold rivalry? She settles with cold courtesy, and the court notices that too — this is a room that reads faces professionally.)</em></li>\n<li><strong>The letter of marque.</strong> Mid-toast, Purser-Lieutenant Breck — the Admiralty's envoy, navy grey among the silks — approaches Marrow <em>publicly</em> and offers an escort commission and naval registry: the fleet wants its first famous privateer. Warm Marrow asks the crew what they think, and means it. The crew watches their likable rival being courted by the nascent empire — and understands the same offer is one good deed away from <em>them</em>.</li>\n<li><strong>The corner seat.</strong> <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-ferro-skell\">Captain Ferro Skell</a> dines two tables away, already at ease, already owed favors — and sends the crew a course they didn't order, with his compliments, paid from an account that used to be their debts. <em>(He sold their story; now he shows them he can afford to be gracious. Let a player fantasize about the punch they cannot throw at a king's table.)</em></li>\n<li><strong>Background truth:</strong> through the feast-hall's viewport, Kollen drills his marines on the embassy pad — parade-order, in public view, saying nothing. Breck is visibly annoyed at the timing. That is the Annexation, rehearsing where everyone can see it.</li>\n</ul>\n<p><strong>Breck's quiet question</strong> — after the festival, once, to the crew alone: <em>\"Your guild posted the Enarc prize before your Vesta-9 paper cleared. Who does your guild bank with?\"</em> The Admiralty noticed the too-fast prize too, and the fleet's investigators are competent, patient, and genuinely useful. <strong>(GM only — the trap is structural:</strong> handing the who-funds-the-guild thread to the Founding cadre arms them with a perfect enemy; \"a hidden hand funds the reopening\" is rally material whether or not anyone ever says the word <em>Sith</em>. The players can hand the fascists their cause and believe they are doing detective work. They are. That is the problem.)</p>"}, {"sid": "s5", "title": "Scene 3 — The Court of the Anchor", "html": "<p><strong>The situation.</strong> <a href=\"#\" class=\"xin\" data-nav=\"npc:lanes-ledgers--sorulba-the-anchor\">Sorulba the Anchor</a> holds court from a dais he has not left in forty years, and he speaks to outsiders <strong>only through Scale-Master Vopp</strong> — being addressed directly by the Anchor is a privilege, and the court keeps score of who earns it. Stage him as terrain, never combat: he pays promptly, keeps his word to the letter, prices the letter. Before the crew is called, let them watch the kingdom work on its own people — two petitioners ahead of them:</p>\n<ul>\n<li>A dock family petitions for an <strong>exit permit</strong> — grown children, a cousin on Kalarba, a life waiting. Vopp grants it warmly… effective <em>after</em> their debts to the crown clear. The family bows and files out. Everyone in the room knows the debts never clear. <em>(This is the kingdom in one exchange.)</em></li>\n<li>A picket captain reports the week's <strong>ghost sightings</strong> — unidentified transits crossing the far sky — and is thanked and dismissed. <em>(Seed the log before the crew ever asks about it.)</em></li>\n</ul>\n<p><strong>What the courts want</strong> — the argument the crew has walked into the middle of:</p>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th></th>\n<th><a href=\"#\" class=\"xin\" data-nav=\"npc:lanes-ledgers--sorulba-the-anchor\">Sorulba the Anchor</a> <em>(through Vopp)</em></th>\n<th><a href=\"#\" class=\"xin\" data-nav=\"npc:lanes-ledgers--jeeda-the-younger\">Jeeda the Younger</a></th>\n<th>Purser-Lt. Breck <em>(the Admiralty)</em></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Wants</strong></td>\n<td>The beacon dark and the kingdom closed. He offers the crew <strong>2,000 scrip, a black-lane rutter — and the rarest paper he signs: exit visas, the whole crew, unconditional</strong> — to certify the corridor \"unnavigable\" and carry a flattering story of the Anchorage away with them.</td>\n<td>The beacon lit, the certificate naming the kajidic <strong>port authority of record</strong> — the kingdom opened <em>on the family's terms</em>, fees legal and posted. Offers fuel at cost, clan protection on the Run, \"a point of the port, for a year.\"</td>\n<td>The beacon lit with two clauses on the founding paper: a <strong>naval customs house</strong> and <strong>protected-lane status</strong> — settlers and trade welcome, under the fleet's law. Offers escort, fuel at naval rates, naval certification.</td>\n</tr>\n<tr>\n<td><strong>Lever</strong></td>\n<td>The palace guard, the pickets, the berth the crew's ship sits in — and every kind hospitality, which in this kingdom is also the cage.</td>\n<td>The schedules and the scales: she can make the relight <em>easy</em> — leave, power, escorts — or make the king's obstruction visible to the whole clan network he pretends not to fear.</td>\n<td>The kingdom's one foreign account: the embassy, the fuel contract, and a patrol sloop a short jump down the Naboo lane. Paper that looks reassuringly like law.</td>\n</tr>\n<tr>\n<td><strong>Red line</strong></td>\n<td>A relight certified around him. He does not rage; he <em>closes the door</em> — and the crew is on the inside of it.</td>\n<td>Violence against the family. Her whole play is that the numbers work without a war.</td>\n<td>The junction under <em>Hutt</em> law. She smiles through everything except \"port authority of record: the kajidic.\"</td>\n</tr>\n<tr>\n<td><strong>Honest warning</strong></td>\n<td>His offers are real and his word is good — that is what makes him dangerous.</td>\n<td>\"My elders are not evil, wayfinder — they are innumerate.\" She means it, and she is <em>twenty percent</em> less safe than she sounds.</td>\n<td>Her tariffs are genuinely low, and every clause is a foothold: the customs house is the Annexation wearing courtesy.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The Scales of the Anchor.</strong> Offers at this court are weighed — a token on each pan, before the room — and what is said at the Scales <em>is</em> the negotiation. When the crew is called, Vopp sets the king's 2,000-scrip token on his pan and asks, for the record, what the guests put on theirs. Make the players speak their offers aloud; the court grades the performance as much as the terms.</p>\n<p><strong>The King's Circuit — the wager.</strong> The court's obsession, its bread and circuses, its one export-quality thing: <strong>swoop racing</strong> through the palace-city — the bowser colonnades, the dead-dock tunnels, the spine. The thing the crew should want from this room is the <strong>picket log</strong> (below), and Sorulba does not sell it. He <em>stakes</em> it — on his champion. If the crew wants the log, someone rides: the court's champion <strong>Draz</strong> (borrow Swoop Ace \"Kettle\" Maro's block; the kingdom lends the crew a court swoop, tuned exactly as well as the king wishes) against the crew's rider, three legs:</p>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th>Leg</th>\n<th>The ride</th>\n<th>The check</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>The colonnades</strong></td>\n<td>Flat-out slalom through the repainted fuel bowsers, the whole court watching from the galleries</td>\n<td><strong>Hard Piloting (Planetary)</strong></td>\n</tr>\n<tr>\n<td><strong>The dead docks</strong></td>\n<td>A lightless tunnel of forty years of mothballed hulls — racers navigate by memory or nerve, and the hulls are <em>inhabited</em>: forty years of roosts, and the lead racer's wake lifts them in a burst of startled wings</td>\n<td><strong>Average Piloting (Planetary)</strong> plus a setback die for the dark; a bold rider may substitute <strong>Perception</strong> to read the wrecks. Threat on this leg is wildlife, not walls (<span class=\"xref\">The Feral Run</span>)</td>\n</tr>\n<tr>\n<td><strong>The spine</strong></td>\n<td>The climb along the palace's back, finishing under the dark beacon mast itself</td>\n<td><strong>Hard Piloting (Planetary)</strong>; Advantage from earlier legs carries forward as boost dice</td>\n</tr>\n<tr>\n<td>Best of three legs wins. Draz rolls three Piloting with a boost (home track); a <strong>Triumph</strong> anywhere is a lead nothing answers; a <strong>Despair</strong> is a wreck — dramatic, survivable, and the court <em>loves</em> it. Stakes: the picket log's pages against something the crew genuinely fears losing — their rutter page, their sworn testimony in a future dispute, or their ship's papers for a season. <em>(A crew with no rider can propose dejarik — holochess, Vopp playing for the house — best of three, </em><em>Knowledge (Education) or Astrogation vs 3 difficulty</em><em>; but the court will be disappointed in them, and show it.)</em></td>\n<td></td>\n<td></td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The picket log.</strong> Two standing orders live in it, written years apart, and keeping them distinct is the whole game. <strong>The first is the kingdom's one open door, priced and logged:</strong> the Naboo account — Admiralty tenders down the Naboo lane for years, fueled, paid, every visit dated. (A careful reader can date the <em>Steadfast</em>'s tender passing toward Vesta-9 — which superficially feeds the port's wrong answer from Session One, <em>the Admiralty lit it</em>, and actually refutes it: a fleet that pays its fuel bills at a king's dock is not sneaking anywhere.) <strong>The second order is newer, unpriced, and unexplained:</strong> the pickets have logged <strong>ghosts</strong> for years — unidentified transits crossing the junction's far sky, dark, unanswering — and <em>six years ago the standing order changed from \"hail and pursue\" to \"log and let pass,\"</em> after a picket boat that went to look never came home. No wreck. No answer. There are ships you do not stop, and they are not the fleet's.</p>\n<div class=\"runact\" data-kind=\"fragment\" data-aid=\"m02-2\" data-args=\"{&quot;name&quot;: &quot;The Enarc picket log, dark years&quot;, &quot;form&quot;: &quot;ledger&quot;, &quot;tag&quot;: &quot;Civic&quot;, &quot;question&quot;: &quot;Who lit Vesta-9?&quot;, &quot;claim&quot;: &quot;the pickets stopped hailing the ghosts six years ago — by standing order&quot;, &quot;holder&quot;: &quot;crew&quot;, &quot;status&quot;: &quot;trusted&quot;}\"><button class=\"btn\">Issue fragment: The Enarc picket log, dark years</button><span class=\"runact-desc\">Civic · bears on “Who lit Vesta-9?”</span></div>\n\n<p>The built-in contradiction, for the players to find: Osk said somebody has been flying the dead Run <em>for ten years</em>; the pickets stopped <em>looking</em> six years ago. Both are true — the gap is the fact in dispute, and reconciling it (the ghosts didn't stop flying; they stopped being <em>challenged</em>, because a weak king did the honest arithmetic about what happens to picket boats that look too closely) is worth a Reconstruction and a very cold feeling at the table.</p>\n<div class=\"adm adm-danger\"><p class=\"adm-title\">GM only — Dial 3</p><p>The Naboo account is commerce; the ghost order is the shadow of the campaign's hidden actors (see <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>, the doctrine of the open road — the short version: a patron secretly steers the guild's relighting order, and its agents fly the dark Run unseen; the lost picket boat stopped one of <em>their</em> hulls once). If the table has opened the Question <em>Why did the Run stay dark?</em>, this log bears on it as naturally as on Vesta-9 — let it count toward either. If the players conflate the two and close the case as \"the Admiralty all along,\" let them — the fuel account's honest arithmetic is sitting right there, waiting to reopen it.</p></div>"}, {"sid": "s6", "title": "Scene 4 — The First Relight", "html": "<p><strong>Why this scene is the centerpiece.</strong> Vesta-9 lit itself. This is the first beacon the crew ever lights <strong>with their own hands</strong> — the campaign's whole premise, finally on-screen — so do not let it be one die roll. The mast has been polished for forty years and <em>fired</em> for none of them: the capacitor stacks need manual sequencing at <strong>three stations at once</strong>, and the politics do not stop screaming while it happens.</p>\n<p><strong>Getting leave (or not).</strong> With a court's blessing — Jeeda's, Breck's clauses, a Scales bargain, or a race victory the king honors through his teeth — the crew works openly, with power and dock access, in front of the whole kingdom. Without leave it is an infiltration of a sealed palace whose only guarded relic is the mast: vents, borrowed livery, a festival for cover — build it from the party's ideas, and remember <a href=\"#\" class=\"xin\" data-nav=\"npc:lanes-ledgers--kajidic-enforcers\">Kajidic Enforcers</a> carry Vigilance and Perception as group skills; the smart way past palace muscle has always been the ledger, not the knife.</p>\n<p><strong>The three stations</strong> — one or more PCs each; everyone gets their hands on the beacon:</p>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th>Station</th>\n<th>Where</th>\n<th>The work</th>\n<th>On a Despair</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>The mast head</strong></td>\n<td>Two hundred meters up the palace spine, EVA, pickets sweeping</td>\n<td><strong>Hard Athletics or Coordination</strong> to make the climb, then <strong>Average Mechanics</strong> to seat the igniter by hand</td>\n<td>The tool drifts. Somebody improvises, or somebody goes and gets it — narrate the long reach over nothing.</td>\n</tr>\n<tr>\n<td><strong>The core room</strong></td>\n<td>The old beacon heart, deep in the palace</td>\n<td><strong>Average Computers</strong> to run the guild handshake (their charter papers carry the codes; Osk's margins carry older ones), then <strong>Hard Mechanics</strong> to sequence capacitors that have never once fired</td>\n<td>Arc-flash: 4 strain, and the mast tries to fire <em>early</em>, half-sequenced — see below.</td>\n</tr>\n<tr>\n<td><strong>The feed junction</strong></td>\n<td>Down among the bowser colonnades — the crown's own grid</td>\n<td><strong>Average Skulduggery or Mechanics</strong> to re-route palace power without tripping the crown's alarms — or, with leave, <strong>Average Negotiation</strong> with the gantry master, who wants a bribe and an autograph</td>\n<td>The palace grid <em>notices</em>: enforcers arrive to watch, arms folded, and every later check here is upgraded once.</td>\n</tr>\n</tbody>\n</table></div>\n<p>Run it as two or three interleaved rounds — cut between stations like a heist. PCs without a station support: the captain on comms (<strong>Average Leadership</strong> — hand a boost die to any one station per round), a lookout (<strong>Average Perception/Vigilance</strong> — downgrade one incoming complication), a face holding off the court in the corridor (opposed social). The relight completes when all three stations have succeeded.</p>\n<p><strong>Threat menu for the set piece:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Result showing</th>\n<th>Spend it as</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2 Threat</td>\n<td>The crown cuts power \"for the festival\" — the feed junction must re-succeed before the sequence can complete.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>Kollen appears at the core room \"to assist\" — his presence upgrades the next check there once, and if the crew accepts the help, his signature is on the relight paperwork forever (a poison gift the Founding wing will spend).</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>A picket's spotlight pins the mast head: freeze in the glare for a round, or push through it for 2 strain.</td>\n</tr>\n<tr>\n<td>Despair</td>\n<td>A ghost — a dark hull, unlit, unanswering — drifts past the mast head close enough to see the crew's faces, and somebody aboard is <em>watching</em>. It says nothing. It files no complaint. (GM: let the image sit; it is the campaign in one frame.)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>If the mast fires early</strong> (core-room Despair): the beacon lights <em>wrong</em> — a stuttering, off-pitch carrier every nav board in the kingdom hears as a wounded animal — and someone must re-seat the sequence <strong>live</strong>, at the mast head, while it cycles: one more <strong>Hard Mechanics</strong> with the mast humming under their gloves. Scary; not lethal.</p>\n<p><strong>The firing.</strong> When the last station goes green, read it slowly:</p>\n<blockquote>\n<p>The charge runs up the spine like something remembering how to breathe, and the mast catches — light rolling joint by joint to the head, forty years of polish finally meaning something. Below you the whole kingdom has stopped: dock families, courtiers, the palace guard, two Hutts, an envoy in navy grey, every upturned face lit the same color. And on every band, in the oldest voice in the sky, Enarc says its own name to the galaxy — the door the king kept shut, open — <em>because you lit it.</em> First light anyone here ever gave back.</p>\n</blockquote>\n<p>Then let the silence break — some of the kingdom is cheering, and some of it is looking at the king — and cut to the paper.</p>\n<p><strong>Certification — the \"Speak to it\" stage.</strong> <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a> arrives a day behind the crew — in time for this scene — carrying the certification packet and the Enarc prize paperwork <em>(dated before Vesta-9's certificate cleared; say nothing, let a player find the date and realize the advance was never resumed, it was </em><em>waiting</em><em>)</em>. The check: <strong>Average Negotiation or Charm</strong>, upgraded once for her table manner — she <em>wants</em> to sign; the fight is over <strong>whose clauses go on the founding paper of a three-lane junction</strong>: Jeeda's <em>port authority of record</em>, Breck's <em>customs house + protected lane</em>, the guild's <em>charting authority</em> (if that fine print exists from Session One), and the crew's names as witnesses — again. The certificate is read for a century, and everyone in the room knows it.</p>"}, {"sid": "s7", "title": "Scene 5 — The Way Out", "html": "<p>Every outcome below also answers the quieter question every guest in the kingdom is asking: <em>who gets to leave, and on whose paper.</em> A lit, certified corridor makes the one-way rule unenforceable — which is half of why the king fights it, and the whole reason the gold-rush captains on the guest docks will love or hate the crew forever.</p>\n<p><strong>Outcomes</strong> — what the founding paper says, and what it seeds:</p>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th>If the crew…</th>\n<th>Tonight</th>\n<th>It seeds</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Lights it on <strong>Jeeda's</strong> terms</td>\n<td>The relight was <em>easy</em> — leave, power, a Hutt smiling for the first time in the campaign. Sorulba does not rage; he <em>audits</em>. Breck's report home says the junction opened under Hutt law</td>\n<td>The kingdom opens on the family's terms and the clan war goes from one bad season away to scheduled. Jeeda is a patron; the old king is a creditor; the crew is the hinge of both.</td>\n</tr>\n<tr>\n<td>Lights it on <strong>the Admiralty's</strong> terms</td>\n<td>Smooth and <em>legal-feeling</em>: naval escort, naval stamps, tariffs posted low — and the two Hutts agree with each other for the first time, about the crew</td>\n<td>The Charter gets its first legal foothold on the Run; the Annexation learns it can arrive by clause instead of by tender. The Republic reads the certificate within the month and understands the Adjournment has a competitor.</td>\n</tr>\n<tr>\n<td>Lights it for <strong>the guild</strong>, around every court</td>\n<td>The corridor certifies clean — and leaving the kingdom becomes the chase below, or hospitality that stops pretending</td>\n<td>The king's counterstroke assembles; the crew has made an enemy of a man whose whole art is patience — and the court remembers everyone who was at the festival.</td>\n</tr>\n<tr>\n<td>Takes <strong>Sorulba's</strong> price and leaves it dark</td>\n<td>2,000 scrip, a black-lane rutter, and the Anchor's genuine respect — worth more than the money</td>\n<td>The choice <em>stands</em> — no unseen hand undoes it. Instead the <strong>order moves</strong>: the guild posts its next prizes around the closed kingdom, the Run lights past it hop by hop, and Enarc becomes an embargoed island in a brightening lane — which is exactly what the king chose, and the crew will watch what that does to the people inside. (GM: the patron's sequence simply reroutes; the crew may notice the reroute happened <em>because of them</em>.)</td>\n</tr>\n<tr>\n<td>Lights it <strong>covertly</strong> and runs</td>\n<td>The prize claim is contestable, every court is insulted, and the certificate carries no authority at all</td>\n<td>A lit junction with no law: pirates, claim-jumpers, and every faction's worst instinct arrive over the following weeks. The crew built a gold rush with no sheriff — inside somebody's home.</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m02-3\" data-args=\"{&quot;faction&quot;: &quot;Kajidics&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;Enarc forces the family argument — the old king and the young reformer now have a beacon between them&quot;}\"><button class=\"btn\">Advance clock: Kajidics +1</button><span class=\"runact-desc\">Enarc forces the family argument — the old king and the young reformer now have a beacon between them</span></div>\n\n<p><em>If the relight certifies (any lit outcome), update the board:</em></p>\n<div class=\"runact\" data-kind=\"beacon\" data-aid=\"m02-4\" data-args=\"{&quot;name&quot;: &quot;Enarc&quot;, &quot;status&quot;: &quot;lit&quot;, &quot;corridor&quot;: &quot;the Run toward Aquilaris — plus the Naboo lane, and the Triellus&quot;, &quot;certified&quot;: &quot;per tonight&#x27;s paper — note whose authority the certificate names&quot;, &quot;fee&quot;: &quot;witness fees per charter; the 8,000 posted prize per the guild&#x27;s terms&quot;, &quot;followed&quot;: &quot;the kingdom was already here; note who arrives next&quot;}\"><button class=\"btn\">Update beacon map: Enarc</button><span class=\"runact-desc\">lit · witness fees per charter; the 8,000 posted prize per the guild&#x27;s terms</span></div>\n\n<p><strong>The chase</strong> <em>(if the crew leaves hostile — the guild-clean and covert rows, or any Scales bargain broken; remember there is no lawful exit without the king's leave, so these are prison breaks, and every gold-rush crew on the docks is watching to see if it can be done)</em>: three legs, one check each, hard narration between.</p>\n<ol>\n<li><strong>The colonnade weave</strong> — out through the bowser columns with picket boats rising: <strong>Hard Piloting (Space)</strong>. Fail: 2 system strain and the pickets herd them toward —</li>\n<li><strong>The dark approaches</strong> — the junction's unlit far sky, where the ghosts fly: <strong>Average Perception or Astrogation</strong> to thread the dead buoys. Despair: running lights snap on off the port bow — a hull that was never asleep, watching, not firing — and the last leg is flown in its shadow.</li>\n<li><strong>The jump</strong> — calculating out under pursuit: <strong>Hard Astrogation</strong> (Osk's margins boost). The pickets break off at the shoal's edge: the kingdom does not chase into the dark it fears. If <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--the-overdue-debt-bought-ghtroc-720\">The Overdue, debt-bought Ghtroc 720</a> is at Enarc, Skell picks whichever side of the chase pays better, and makes sure the crew sees him choose.</li>\n</ol>"}, {"sid": "s8", "title": "Wrinkles & side quests", "html": "<p><em>Enarc is a kingdom nobody leaves, run by a weak king with Hutt appetites, sitting on the only door in the sector — which makes it the campaign's best side-quest ground. Four core wrinkles below are canon; each hits a PC or the campaign's spine and can run tonight or on the return visit the First Relight guarantees. Three drop-ins follow for texture, and one is reserved for the return. Log every change of custody or knowledge in Threads — Enarc is where the crew learns the ledger cuts both ways.</em></p>\n<h3>The Exit Pit</h3>\n<p><strong>The custom.</strong> <a href=\"#\" class=\"xin\" data-nav=\"npc:lanes-ledgers--sorulba-the-anchor\">Sorulba the Anchor</a> keeps a menagerie under the festival galleries, and the court's cruelest custom lives there: a petitioner denied an exit visa may <em>fight for one</em> in the pit. Nobody has won in eleven years, which is the point — the pit is how the king says no with entertainment attached. The beast is a feral <a href=\"#\" class=\"xin\" data-nav=\"npc:wildlife--nexu\">Nexu</a> (or two, for a party — heat sight beats the pit's darkness, which the court keeps dark on purpose); the galleries are full; the king watches through Vopp and never speaks.</p>\n<p><strong>How it reaches the crew.</strong> A stranded captain from the guest docks — pick one the crew has met, third week, counting days — draws the pit rather than the wait, and asks the crew to stand with her: the custom allows a <em>party</em> of petitioners, and the visa is shared. Or it reaches them directly: if the Way Out goes wrong (the dark choice, a refused walk-away), the pit is the crew's third exit — the one the king cannot refuse, because the custom is older than he is.</p>\n<p><strong>Running it.</strong> Two or three rounds of real combat, then the court's verdict — surviving is not winning; the king's <em>thumb</em> is. Advantage spent in the pit buys the galleries (the crowd's roar is the one thing Sorulba fears), and a Triumph gives the crew the pit's real prize: the beast <em>spared</em>, a gifted PC calming it in front of a thousand witnesses — the witness rule firing like a struck bell, and a Hutt court that has just seen the Force for the first time in a century.</p>\n<p><strong>Choice:</strong> enter the pit for a stranger, for yourselves, or refuse it and find another way. <strong>Aftermath:</strong> a visa won in the pit is <em>unconditional</em> and the court remembers who won it.</p>\n<div class=\"runact\" data-kind=\"thread\" data-aid=\"m02-5\" data-args=\"{&quot;ledger&quot;: &quot;debts&quot;, &quot;who&quot;: &quot;A stranded captain (name her)&quot;, &quot;whom&quot;: &quot;The crew&quot;, &quot;what&quot;: &quot;Her life and her exit visa — the pit, stood together&quot;, &quot;status&quot;: &quot;open&quot;}\"><button class=\"btn\">Log thread (debts): A stranded captain (name her)</button><span class=\"runact-desc\">Her life and her exit visa — the pit, stood together</span></div>\n\n<h3>The Debt Auction</h3>\n<p><strong>The custom.</strong> Festival night's second spectacle: the king auctions the <em>debts</em> of the stranded — Hutt debt-bondage with paperwork. Ledger-law as theatre: a captain's arrears, a mechanic's medical bill, an apprentice's articles, read aloud by Vopp and sold to the galleries. The buyer owns the debtor's labor until paid, and nobody stranded ever pays.</p>\n<p><strong>The wrinkle.</strong> Halfway through the lots, Vopp reads a lease. <strong>Mikrés's</strong> — the predatory lease from the Drift, sold up the chain to the Anchorage the way all paper on the Run eventually sells, and <strong><a href=\"#\" class=\"xin\" data-nav=\"npc:lanes-ledgers--jeeda-the-younger\">Jeeda the Younger</a> is bidding.</strong> She is not cruel about it; she is <em>precise</em>: a Chadra-Fan technician who can relight beacons is the most valuable labor in the kingdom, and she has run the numbers.</p>\n<p><strong>Running it.</strong> The bidding is a scene, not a roll — the crew can outbid (they may not have it), interpose paper (Nerra's witness charter, if they hold it, makes a certified crew's articles <em>guild-protected</em> — a Hard Negotiation to make the court honor it), or make the king an offer for the whole lot. If Jeeda wins, she does not enslave Mikrés; she <em>hires</em> him, generously, with a clause: he does not leave Enarc until the beacon is lit and the young Hutts hold the door. Skell's lien precedent, if the crew co-signed it at Vesta-9, is cited by Vopp from the bench — their own signature, read back to them.</p>\n<p><strong>Choice:</strong> buy a stranger's freedom with the money they need for their own, or watch a friend's paper go to a Hutt who means to keep him. <strong>Aftermath:</strong> whoever holds the lease after tonight is a face Mikrés's Wealth pursuit now has.</p>\n<div class=\"runact\" data-kind=\"thread\" data-aid=\"m02-6\" data-args=\"{&quot;ledger&quot;: &quot;holds&quot;, &quot;item&quot;: &quot;Mikrés&#x27;s predatory lease&quot;, &quot;holder&quot;: &quot;(who won the auction — Jeeda, the crew, or the king)&quot;, &quot;since&quot;: &quot;S2&quot;, &quot;notes&quot;: &quot;Sold up the chain from the Drift; read aloud at the Debt Auction&quot;}\"><button class=\"btn\">Log thread (holds): (who won the auction — Jeeda, the crew, or the king)</button><span class=\"runact-desc\">Mikrés&#x27;s predatory lease</span></div>\n\n<h3>The Stranded Warden</h3>\n<p><strong>The wrinkle.</strong> In the guest docks there is a grey veil who has been inside for <em>four years</em>. A circuit warden — statted as one of the <a href=\"#\" class=\"xin\" data-nav=\"npc:vigil-inheritors--vigil-wardens\">Vigil Wardens</a> if it matters — she came to check the seal on the old principality vault under the palace, which the king now uses as his treasury. The door swings one way for her too. She has never been allowed near the vault, and she has never stopped asking.</p>\n<p><strong>What she asks.</strong> She cannot file her audit — Enarc has no outbound post but the pickets, and the pickets search grey veils twice. She asks the crew to carry it out: a sealed slate for the Vigil chapter at the next warden's station up the Run. In it: her observation that the treasury's <em>outer</em> seal — the Vigil's, eighty years old — is intact, and that the palace nonetheless took delivery of crates <em>from</em> the vault, six years ago, on festival nights, when the noise covered the work.</p>\n<p><strong>GM truth (Dial 3).</strong> That vault is why the ghost order exists. The Scrub visited it through the stone, the way it visits everything — and the court, which noticed, took a bribe to look away and then ordered the pickets to stop hailing what they could not afford to see. The warden has, without knowing it, dated the Scrub's visit to Enarc and tied it to the picket log's six-year silence. Her slate is <strong>rung-one Ladder material</strong> — the pattern, filed — and a Civic fragment on <em>Why did the Run stay dark?</em> if the crew reads it.</p>\n<p><strong>Choice:</strong> carry it (a Vigil favor, and the grave cult the spacers laugh at turns out to hold the kingdom's real secret), sell it to Nerra (the guild would like to know what is under the palace), or open it and read. <strong>Aftermath:</strong> the Unbroken Seal is foreshadowed at hop 1; when the crew stands in a Vigil vault later and finds dust outlines, they have already held the paper that predicted it.</p>\n<div class=\"runact\" data-kind=\"fragment\" data-aid=\"m02-7\" data-args=\"{&quot;name&quot;: &quot;The stranded warden&#x27;s audit slate&quot;, &quot;form&quot;: &quot;sealed Vigil audit&quot;, &quot;tag&quot;: &quot;Civic&quot;, &quot;question&quot;: &quot;Why did the Run stay dark?&quot;, &quot;claim&quot;: &quot;the treasury&#x27;s seal is intact, and crates still came out of it — on festival nights, six years ago&quot;, &quot;holder&quot;: &quot;crew&quot;, &quot;status&quot;: &quot;trusted&quot;}\"><button class=\"btn\">Issue fragment: The stranded warden&#x27;s audit slate</button><span class=\"runact-desc\">Civic · bears on “Why did the Run stay dark?”</span></div>\n\n<div class=\"runact\" data-kind=\"thread\" data-aid=\"m02-8\" data-args=\"{&quot;ledger&quot;: &quot;knows&quot;, &quot;who&quot;: &quot;The Vigil (once the slate is delivered)&quot;, &quot;what&quot;: &quot;The Anchorage&#x27;s treasury vault was worked through the stone, six years ago, with the court&#x27;s paid silence&quot;, &quot;since&quot;: &quot;S2&quot;, &quot;notes&quot;: &quot;Rung-one Ladder material if filed; the warden is still inside&quot;}\"><button class=\"btn\">Log thread (knows): The Vigil (once the slate is delivered)</button><span class=\"runact-desc\">The Anchorage&#x27;s treasury vault was worked through the stone, six years ago, with the court&#x27;s paid silence</span></div>\n\n<h3>Service Is Citizenship</h3>\n<p><strong>The wrinkle.</strong> Lieutenant Kollen's <a href=\"#\" class=\"xin\" data-nav=\"npc:republic-admiralty--admiralty-marines\">Admiralty Marines</a> drill on the embassy pad in public view for a reason the crew can work out: the Admiralty <em>recruits the stranded</em>. Enlist, and the embassy's treaty exemption carries you out the door — the only legal exit from the Anchorage is a uniform. The Founding cadre has quietly filled two boats this year with people who would have signed anything.</p>\n<p><strong>How it reaches the crew.</strong> Twice. First through an NPC — the stranded captain from the pit, the mechanic whose debt sold last night — who asks the crew whether they should <em>take it</em>, because it is a real way out and it costs only everything after. Second, and personally, the offer lands on <strong>the Republic Trooper</strong>: Kollen, correct to the last button, offers him a commission — the Admiralty's writ as his exit visa, from the navy that believes it inherited his oath. <em>\"The writ passed to those who kept it, Trooper. You kept it. Come and be paid for it.\"</em></p>\n<p><strong>Running it.</strong> Not a roll — a conversation, ideally overheard by the crew's gifted, because the marines' census-curiosity about the Awakened is part of the recruiting pitch. If the Trooper refuses, Kollen salutes; the offer is never withdrawn, and it will be repeated up the Run at every relit beacon, a little warmer each time. If any NPC the crew cares about enlists, they leave Enarc in a uniform on the next tender — and the crew meets them again, later, on the other side of an inspection.</p>\n<p><strong>Choice:</strong> get someone out through the one door that is open, knowing what walks through it. <strong>Aftermath:</strong> the nascent empire recruiting through the only exit is the Admiralty's real mechanism, shown once, small, at hop 1.</p>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m02-9\" data-args=\"{&quot;faction&quot;: &quot;Admiralty&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;The Founding cadre recruits the stranded at Enarc — the treaty exemption is the exit visa; the crew saw the machinery&quot;}\"><button class=\"btn\">Advance clock: Admiralty +1</button><span class=\"runact-desc\">The Founding cadre recruits the stranded at Enarc — the treaty exemption is the exit visa; the crew saw the machinery</span></div>\n\n<h3>Drop-ins</h3>\n<ul>\n<li><strong>The Third-Week Captains.</strong> The guest docks are a shadow society of the stranded, counting days, with a lottery for exit petitions and a forgery trade in visa seals — and they need a <em>mail run</em>: a bag of letters out past the pickets, one of which names a Naboo account. Carry it (a smuggling check at the exit picket with other people's hopes aboard; every letter delivered is a favor logged in Threads) or sell the manifest to Vopp.</li>\n<li><strong>The Bowser.</strong> The embassy's plasma bowser is the kingdom's only fuel: Breck wants to sell it low, Kollen wants to withhold it until the court folds — and <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--skell-s-crew\">Skell's crew</a> is <em>siphoning</em> it at night. A night op in the fuel yard; expose Skell to Breck for an Admiralty favor, or catch him and hold it over the lien.</li>\n<li><strong>The Long Wait.</strong> A derelict in the dead docks: a freighter whose captain died in his third year of waiting. Something roosts in it now (<a href=\"#\" class=\"xin\" data-nav=\"npc:wildlife--nexu\">Nexu</a>, heat sight in the dark). His log is a fragment — <em>\"the ghosts come on festival nights; the noise covers them\"</em> (Civic, <em>Why did the Run stay dark?</em>) — and his will names whoever brings his body out. Ten minutes of derelict crawl, and a lesson about what Enarc does to people.</li>\n</ul>\n<h3>Reserved for the return visit — Jeeda's Numbers</h3>\n<p><a href=\"#\" class=\"xin\" data-nav=\"npc:lanes-ledgers--jeeda-the-younger\">Jeeda the Younger</a> wants the door open and the old king embarrassed. When the crew comes back with a certified corridor behind them, she offers the picket log's <em>second</em> page — who paid the court to stop hailing the ghosts — in exchange for helping rig the King's Circuit against Draz and handing her the festival. Backing her is backing the palace coup in waiting, and \"the young Hutts have run the numbers\" ends in clan war one bad season away. Let it breathe: the coup should be a session, not a scene.</p>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m02-10\" data-args=\"{&quot;faction&quot;: &quot;Kajidics&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;Jeeda&#x27;s coup in waiting — the crew helped rig the Circuit; the young Hutts have the festival&quot;}\"><button class=\"btn\">Advance clock: Kajidics +1</button><span class=\"runact-desc\">Jeeda&#x27;s coup in waiting — the crew helped rig the Circuit; the young Hutts have the festival</span></div>"}, {"sid": "s9", "title": "The Out", "html": "<p><strong>The fork — let the players choose the direction.</strong> Three lanes meet at Enarc, and for the first time the campaign asks which way:</p>\n<ul>\n<li><strong>Up the Run: Aquilaris, hop 2</strong> — drowned resort world, first of the deep-Run stops, and the guild's next prize posts immediately. <em>Of course it does.</em> (This is the patron's order. Staying on it, the crew's luck stays strangely good.)</li>\n<li><strong>Down the Naboo lane:</strong> Breck extends an invitation — come see the Admiralty's home waters. Seeing the closed pocket from inside is a reveal nobody else on this side of the dark has had. (GM: leaving the patron's order has a felt cost — the unearned luck stops, and the guild's warmth cools a degree.)</li>\n<li><strong>The Triellus:</strong> Jeeda offers a black-lane rutter and an introduction — the Hutt ring, the family's roads, the wider clan-economy the old king hid from. Same cost: off the order, off the luck.</li>\n</ul>\n<p><strong>Other doors:</strong></p>\n<ul>\n<li><strong>The clan argument travels.</strong> Whichever Hutt lost tonight writes letters; expect the winner's rivals — or the loser's collectors — at the crew's next port.</li>\n<li><strong>If the Admiralty finding exists</strong> (Session One): the tender arrives at Enarc on schedule, and the junction becomes the Annexation's first test case with the crew's names in its founding file.</li>\n<li><strong>Skell keeps the ledger he lives by.</strong> Whatever happened tonight went into it, priced — including everything the court now believes about the crew.</li>\n<li><strong>If the gifted dream recurs</strong> (optional; the era's pull toward the Valley, nothing local): the canyon again, closer — and this time somebody in it is facing the dreamer.</li>\n</ul>\n<p><strong>XP:</strong> 15–20; <strong>+5</strong> for a resolution that used ledgers, paper, or testimony where blasters would have been easier.</p>\n<p><strong>The closing image</strong>, in your own words: the junction lit or dark by the crew's own hand — and in the palace's oldest hall, under forty years of festival banners, Vopp chalks tonight's entry in the court record the way the kingdom has always kept history. A hull. A name. A price. Whatever the galaxy decides Enarc was worth, the court already wrote it down.</p>"}]}];

const TRACKDOCS = {"ladder": "<p><strong>Rungs filed:</strong> ☐ pattern ☐ hull ☐ face ☐ name</p>\n<p>The Rule of Two survives on one asset: nobody knows it exists. So the line does not lose duels — it loses <em>sightings</em>. The campaign's stated weapon (testimony, not turbolasers) is also the weapon that works on the Sith, and it climbs a ladder. Each rung is something the crew <strong>records and files</strong> — a certificate, a sworn statement, an archive deposit, a pattern documented where other people can read it. A rung merely <em>witnessed</em> is a scare; a rung <em>filed</em> is a wound.</p>\n<ol>\n<li><strong>The pattern.</strong> The Weeding's tell, run down and documented: obstacles to the relighting vanish the night after a guild packet leaves port (<a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>, the machinations). Filed, it proves <em>someone</em> is gardening the recovery. Cost to the line: the Weeding pauses on this corridor; a cutout is burned.</li>\n<li><strong>The hull.</strong> A drive signature or silhouette recorded twice — the ghost-traffic given a shape (the picket logs are the natural first source). Filed, it proves the gardener has ships. Cost: the line changes carriers, abandons a hidden berth, loses a season.</li>\n<li><strong>The face.</strong> A description that matches across two worlds — the kind stranger at a bedside, the scholar relieved a relic is fake, the shape at a dark station. Filed, it proves a <em>person</em>. Cost: Mendac withdraws from the field entirely for an act; the Scrub falls behind the advance for the first time.</li>\n<li><strong>The name.</strong> Provenance, testimony, and pattern assembled into an identity someone official is obliged to act on. Filed, the Absence is broken — and the line must come <em>to the crew</em>, on ground the crew chose, which is the only version of the Act 3 confrontation the players can win. This rung is where \"mysterious\" ends and the statted antagonists in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> step into the light.</li>\n</ol>\n<p>Award rungs stingily and honor them absolutely: every filed rung visibly costs the line something, every unfiled rung invites the Weeding to tidy the witness, and the ladder never runs backward. The players should be able to feel, by mid-campaign, that they are not hunting a monster — they are <em>developing a photograph</em>.</p>", "payouts": "<p>The fragment rules promise a Truth on a successful Reconstruction, and the campaign's deep secrets have to stay whole — so pay Reconstructions out in rungs. Each Question has three; award the lowest unearned rung, and a Triumph may skip one. (Fragment economy note: the session one–two fragments are all Civic-tagged, which upgrades cross-tag Reconstructions — plan the first <strong>Sith-tag</strong> source early: the principate court seed at Aquilaris is the natural spot, and the Inheritors' recovered census works later.)</p>\n<ul>\n<li><strong>Who lit Vesta-9?</strong> (1) <em>The relighting order was written before the relights — someone is choosing.</em> (2) <em>The chooser's people fly dark, were at the station before the light, and have flown the Run for ten years.</em> (3) <em>The chooser can tell a true relic from a false one — a living tradition, not grave-robbers.</em></li>\n<li><strong>What is the Valley?</strong> (1) <em>The armies reached Ruusan seven times; the seventh time, both armies died in one day — not in battle. Something was used.</em> (2) <em>It was a weapon of the mind — one ritual that took every soul on the field, light and dark together, a thousand strong. Taken, not killed: the dreams about the canyon are true, and the light in it is people.</em> (3) <em>It is not the engine of the Force's return — it is the loudest thing the Force has ever done. And it is a lock as much as a weapon; a lock implies a key, and a key implies someone deciding what it means.</em></li>\n<li><strong>Why did the Run stay dark?</strong> (1) <em>The darkness was uneven and convenient: every serious push to relight or re-bond the Run died quietly — backers vanished, surveys cancelled, the Jutrand Commission strangled in committee.</em> (2) <em>Somebody flew the dark Run the whole time and needed it empty — the ghost traffic is older than the relighting, and the pickets were ordered not to look.</em> (3) <em>The Run did not simply wither — it was withered: its lights were helped out under the recession's cover and kept out while the old principality vaults were cleared, and the relighting order is the emptying order.</em></li>\n<li><strong>What is calling the gifted up the Run?</strong> (1) <em>The pull is real and shared: the gifted drift up the Run from every direction, it grinds like stone on dry stone when it sounds like anything at all, and more people hear it every year — more ears, not a louder call.</em> (2) <em>It is a made thing with an author, keyed to fire at its author's death — and it has been calling for exactly ninety years.</em> (3) <em>What it carries is not its author's voice. The voice it was built to carry is trapped with a thousand others, and the call is the sound of their prison — followed far enough, it stops being a sound and becomes a road.</em></li>\n<li><strong>What did the Adjournment actually adjourn?</strong> (1) <em>The seats were suspended \"until reconnection\" — reconnection has happened, and no seats came back.</em> (2) <em>The minutes exist; the senators who wrote them are alive, and anxious.</em> (3) <em>It adjourned the Republic's obligations, never its claims — the writ was kept alive on purpose, waiting to be re-imposed.</em></li>\n<li><strong>Why did the Jedi leave the Rim?</strong> (1) <em>They were recalled to one Temple; a few refused and stayed.</em> (2) <em>The refusers taught in hiding until the Ebb starved them out — the last lineage ended a generation ago, and left things behind.</em> (3) <em>The Temple's rule was written in grief for Ruusan's late-trained dead — it protects children by owning them, and it has no answer for an adult.</em></li>\n</ul>"};
