and every guild door in the Reach swinging politely shut.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The <em>Larksong</em> at the light.</strong> <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-vess-marrow\">Captain Vess Marrow</a> docks per the race's outcome and parks the <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--larksong-crew\">Larksong crew</a> in visible, cheerful neutrality. If the Scene 2 trade was made, she backs the crew's account to Nerra and expects her names on the certificate; if the race ended cold, she bids against them at Nerra's table — graciously, and hard. She offers Reike nothing but compliance and offers Vhail a respectful nod she does not explain. Her testimony, not her pistol, is what she brought aboard.</p>\n<p><strong>Advantage/Threat in the standoff</strong> — a menu for the social rolls:</p>\n<table>\n<thead>\n<tr>\n<th>Result showing</th>\n<th>Spend it as</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Advantage</td>\n<td>A hairline crack shows: Reike's marines trade a look at the word \"protection\"; Vhail's hand tightens on the psalter at \"children\"; Nerra's smile stalls, once, at \"handshake codes.\"</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>A concession in the paper: strike one clause of Nerra's fine print, or win a named exemption in Reike's log.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>A private audience: one of the three steps aside with the crew, off the record, and says one true thing.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>The swarm gets bold: a hopeful hull makes a move on the station, and Reike's posture hardens for everyone.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>The three corners agree on exactly one thing — the crew is the problem — and all three levers press at once.</td>\n</tr>\n<tr>\n<td>Despair</td>\n<td>The inspection widens, immediately: Reike wants the aft hold opened <em>now</em>. Cut to Scene 4.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Poking at the light.</strong> Someone will examine the core — let them. <strong>Average Mechanics or Computers</strong> establishes three facts, delivered flatly: the failsafes were released <em>from inside</em>, in the correct order, with no forced panels; the wake sequence used valid guild handshake codes; and whoever did it cleaned up afterward. Say all three and move on — do not explain. (GM only: this is the session's one hard clue toward the Conclave rigging. Vhail did not do this, whatever the players conclude, and Nerra goes noticeably quiet if shown the handshake logs.)</p>\n<p><strong>Vhail's trade.</strong> She will answer exactly one question truthfully and completely, for the price of visible reverence at the core — a moment of honest silence is enough. Sample answers, each a thread the campaign can pull:</p>\n<table>\n<thead>\n<tr>\n<th>If they ask…</th>\n<th>She answers</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\"Who lit it?\"</td>\n<td>\"Not my order. We do not wake things. Ask instead who <em>benefits</em> from an opened door — and notice who arrives already knowing which doors come next.\"</td>\n</tr>\n<tr>\n<td>\"How did you get here?\"</td>\n<td>A psalm about doors — but if the crew was honest with her about the resonance by session's end, she adds, quietly: \"I was brought. I have not yet decided by what.\"</td>\n</tr>\n<tr>\n<td>Anything about the old Order, the Valley, or relic law</td>\n<td>A true, careful answer worth a Jedi-tag lead — name where a fragment might be found in the Grumani Reach, keyed to one of your seeded episode worlds.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>The inspection.</strong> Reike boards with four <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--bastion-marines-steadfast-boarding-party\">Bastion Marines (Steadfast boarding party)</a> — one minion group: 20 wounds, 3 ranks in its group skills, weapons set to stun for a registered boarding. If the crew's papers are honest, no roll: he is correct to the last button and thanks them. Contraband or false manifests need <strong>Hard Deception</strong> (his Discipline 4 misses very little), or <strong>Hard Skulduggery</strong> <em>before</em> the boarding to re-stow. A failed check costs confiscation and a log entry, not blood. Either way — unless the crew has already searched their own hold — a marine at the aft frame goes still and holds up a fist: he hears breathing. <strong>Cut to Scene 4 mid-inspection.</strong></p>\n<div class=\"adm adm-danger\"><p class=\"adm-title\">If blasters come out</p><p>Be honest with yourself about the <a href=\"#\" class=\"xin\" data-nav=\"npc:ships--bns-steadfast-bastion-pattern-patrol-sloop\">BNS Steadfast, Bastion-pattern Patrol Sloop</a>: a patrol sloop's gun ladder against a century-old heirloom hull is not a fight, it is an arrest. Do not stage a space battle the crew can win — the sloop cripples their engines with precise, throttled turbolaser fire, narrated as disabling rather than rolled, and the marines board under stun with Reike directing from cover (Tactical Direction; the fight is always the group, never the man, and his Adversary 1 punishes dueling him anyway). How everyone climbs down: any <em>lawful</em> proposal — \"we submit under protest, log it\" — stands Reike down instantly; Nerra interposes paper (\"a certification hearing needs living witnesses, Commander\"); Vhail kneels at the core and begins the psalm for the dead of Ruusan, loudly, which no Bastion crew will fire past; and a marine hesitating at an unlawful order is the crew's best lever — Reike would rather stand down than watch his boarding party's discipline crack. Remember also what the <em>Steadfast</em> cannot do: it has no hyperdrive and no navicomputer — it arrived clamped to a fleet tender, and until that tender returns it can hold the station, not chase the crew up the dead Run into the Grumani Reach. If they push through all of it, see Contingencies.</p></div>\n\n<div class=\"adm adm-tip\"><p class=\"adm-title\">Pacing the standoff</p><p>Sixty minutes is generous and can still evaporate. Keep the <em>Steadfast</em>'s presence audible — proximity klaxons on the swarm, the marines' bootsteps on the ring — and whenever the table settles into comfortable negotiation, have one of the three corners raise the price. The scene should end because the certification and the inspection both resolved, not because everyone ran out of things to want.</p></div>\n\n<p><strong>Certification — the \"Speak to it\" stage.</strong> With Nerra aboard as guild observer, the relight's final stage is convincing her to certify: <strong>Average Negotiation</strong> or <strong>Average Charm</strong>, upgraded once for her practiced table manner — she <em>wants</em> to sign; the check is about whose terms. Honest testimony about the already-lit core adds a boost die. Without her — satisfying the old Republic handshake protocols cold — it is <strong>Hard Knowledge (Education)</strong>, and see Contingencies for what an uncertified claim is worth. Results: <strong>Success</strong> — the certificate of relight issues with the crew as witnesses of record, fee released. <strong>Triumph</strong> — she enters them as first-lighting claimants outright: full honors and priority at future guild tables. <strong>Threat</strong> — fine print: the certificate names the guild as charting authority for the whole corridor. <strong>Despair</strong> — the certification packet copies wider than intended; someone the crew did not invite now holds a clean copy (GM only: the mole — see <a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">faction clocks</a>).</p>"}, {"sid": "s6", "title": "Scene 4 — The Resonance", "html": "<p>Trigger it at the height of the standoff — ideally mid-certification, while all three factions are watching the core and each other. The beacon has spent the whole session humming. Now it finds a frequency.</p>\n<blockquote>\n<p>The certification handshake is mid-cycle when the beacon's hum slips off its pitch. It takes a moment to hear what it has slipped <em>to</em>. Then, quietly, to one player: it's yours. The mast light through the viewport brightens when you breathe in. Dims when you breathe out. Sixty years of dead-man silence, and the first thing this machine has chosen to keep time with is your pulse. Nobody else has noticed. Yet.</p>\n</blockquote>\n<p><strong>The choice belongs to the player.</strong> Deliver the moment privately — a note, a word at the kitchen counter, a look — and put it plainly: <em>the beacon is reaching for you; do you push it down, or answer it?</em> There is no wrong choice. Both are the scene.</p>\n<ul>\n<li><strong>Push it down:</strong> <strong>Average Discipline</strong>, upgraded once — not because the beacon resists, but because it is sixty years lonely and not subtle. Success: the sync fades into coincidence, and only the logs will ever know (see the slow-fuse box). Threat: one person in the chamber caught the pattern — pick whichever witness makes the best trouble. Despair: the suppression spikes the beacon and the whole mast flares once, in rhythm, in front of everyone.</li>\n<li><strong>Answer it:</strong> no roll. The mast breathes with them in front of three factions — and the certification's \"Speak to it\" stage completes on the spot, unasked: the handshake protocol has been waiting sixty years for a voice it recognizes. Award the crew the stage's success outright. Then every mask in the chamber moves at once.</li>\n</ul>\n<div class=\"adm adm-tip\"><p class=\"adm-title\">Running the spotlight</p><p>You cleared this in prep (item 0); tonight, deliver what you promised. The gifted PC gets the choice with real information and real time — never narrate their gift acting without them, and never roll it as a tool. If the player holds it down all session, that is a complete and honorable version of the scene: see Contingencies.</p></div>\n\n<p><strong>Three reactions, three sets of teeth</strong> — aimed, now, at somebody's character sheet:</p>\n<ul>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--commander-joss-reike\">Commander Joss Reike</a> — the writ.</strong> Fleet Form 77-K: gifted crew aboard an inspected vessel are to be entered on the fleet's rolls, \"for their own protection\" — and he genuinely believes that. Registration, not arrest: name, ship, gift, itinerary. Refusing a lawful writ makes the whole crew harborers; he can re-impound pending review. The outs: sign it (he logs it <em>and schedules a follow-up</em> — the Admiralty checks); make the refusal lawful — <strong>Average Charm</strong> to have it sit right with him, or <strong>Hard Deception</strong> to argue the resonance was instrument error (his Discipline 4 again, and the logs disagree); or let Nerra interpose paper — a certification hearing needs its witnesses uncoerced.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--keeper-adressa-vhail\">Keeper Adressa Vhail</a> — the silence.</strong> She says nothing during the standoff. Afterward she finds the gifted PC alone and asks exactly one question — <em>\"When you say the word</em> Jedi <em>— and one day you will — who will be standing beside you?\"</em> — and leaves without pressing. What she does after is the hinge: a crew that treats its gifted member as a person leans her report toward the half of her order that weeps; a crew that treats them as an asset, a secret, or a problem leans it toward custody. Either way, the Vigil now knows the Awakening rides with this crew.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a> — the papers.</strong> Navigator's articles, produced on the spot, for an adult and at adult rates: real salary, guild protection, accreditation — because someone who dreams true can feel a dead lane the way old pilots claim to. The offer is honestly generous. Fine print: routings and dream-logs become guild property. (GM only: everything filed crosses the mole's desk.)</li>\n</ul>\n<p><strong>Decision matrix</strong> — what the crew does about their own, and what each choice seeds:</p>\n<table>\n<thead>\n<tr>\n<th>If the crew…</th>\n<th>Costs now</th>\n<th>Seeds for Act 1</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Closes ranks and keeps it quiet</td>\n<td>Every port becomes a risk — Reike's follow-up travels with them, and the first time the gift visibly bends luck in front of strangers, the witness rule fires</td>\n<td>The Inheritors' first contact comes <em>helpful</em>: coin, rescue, answers, no visible strings (Dial 3). <em>The Oracle of Brel</em> and <em>The Handoff</em> land personally.</td>\n</tr>\n<tr>\n<td>The gifted PC signs Reike's rolls</td>\n<td>Scheduled check-ins; the fleet holds their name, gift, and itinerary</td>\n<td>An Admiralty asset-pipeline to discover from the inside; the registration becomes conscription leverage when the Annexation comes; a sympathetic clerk at <em>The Mausoleum Yards</em>.</td>\n</tr>\n<tr>\n<td>They confide in Vhail</td>\n<td>She must choose which half of her order she serves</td>\n<td>The Vigil's custody argument ignites early — both halves come recruiting the PC. <em>The Sealed Enclave</em>'s roll call gains a name it answers to.</td>\n</tr>\n<tr>\n<td>The gifted PC signs Nerra's articles</td>\n<td>Salary and protection — routings and dream-logs owned by a guild with a hole in it</td>\n<td>The dream-logs reach the Inheritors fastest of all (Dial 3), and the Conclave of Charts gains a lever shaped like a crew member.</td>\n</tr>\n<tr>\n<td>They deny everything, publicly</td>\n<td><strong>Hard Deception</strong> against a room that includes Discipline 4 and a luminosity log</td>\n<td>A \"suspected\" flag in three files instead of a fact in one — slower fuses, deeper suspicion, and the Inheritors' helpful strangers arrive anyway.</td>\n</tr>\n</tbody>\n</table>\n<div class=\"adm adm-note\"><p class=\"adm-title\">The flicker is on the record</p><p>The beacon's sync sits in the station's own luminosity logs, and Nerra's certification packet carries the trace — whatever the table chose, however well the roll went. Nobody in the standoff has connected it yet; do not spring it tonight. It is a slow fuse: whoever reads that packet carefully later (an Admiralty analyst, a curious archivist, the reader Dial 3 put behind the guild's desks) can date to the minute when the beacon started keeping time with somebody's heart.</p></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">The witness rule, with three factions watching</p><p>If any PC uses the Force openly here, apply the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:force\">witness rule</a> — disposition shifts one step, awe or fear — but the \"community\" watching is <em>three factions' agents at once</em>. Reike's writ acquires a second name. Vhail stops being silent. Nerra's fine print grows a clause. Add the setback die to social checks with all of them until the crew addresses what was seen, and remember the Threat spend that worsens the crowd one extra step.</p></div>\n\n<p><em>If open Force use happened in front of the factions:</em></p>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m01-2\" data-args=\"{&quot;faction&quot;: &quot;The Awakening&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;Open Force use before three factions at the Vesta-9 relight&quot;}\"><button class=\"btn\">Advance clock: The Awakening +1</button><span class=\"runact-desc\">Open Force use before three factions at the Vesta-9 relight</span></div>"}, {"sid": "s7", "title": "The Out", "html": "<blockquote>\n<p>The corridor is open. On the boards it reads like a sentence finished after sixty years: VESTA-9 — LIT — RUN CLEAR TO ENARC. The Steadfast holds station like the corridor already belongs to it, the guild packet burns for home with signed paper aboard, and somewhere sunward a keeper is praying over a machine. Every one of them wrote down your names.</p>\n</blockquote>\n<p>Before the bookkeeping, settle debts on-screen: Grell's cut (if signed) transmitted with bad grace and a note that his door is open; Marrow's wager paid at whichever cantina comes next; and the promise to Osk kept or broken, said aloud either way.</p>\n<p><strong>Bookkeeping</strong> — run the list in order:</p>\n<ol>\n<li><strong>Update the <a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">beacon board</a>.</strong> The first-lighting fee is <strong>1,200 sector scrip</strong>, paid to the certified witnesses of record — Grell's signed cut, if any, comes off the top and should hurt. <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a>'s standing witness-charter offer: <strong>250 scrip per certified lighting</strong> plus guild accreditation — permits, parts, and rutters at guild rates. Worth more than the fee itself within three sessions, which is exactly how the Lamplighters collect people.</li>\n</ol>\n<div class=\"runact\" data-kind=\"beacon\" data-aid=\"m01-3\" data-args=\"{&quot;name&quot;: &quot;Vesta-9&quot;, &quot;status&quot;: &quot;lit&quot;, &quot;corridor&quot;: &quot;the Grumani Reach (Duros Space Run, toward Enarc)&quot;, &quot;certified&quot;: &quot;Chartmistress Bel Nerra (Lamplighters)&quot;, &quot;fee&quot;: &quot;1,200 sector scrip, paid to the witnesses of record&quot;, &quot;followed&quot;: &quot;Vigil, Admiralty, Lamplighters — and one uncounted observer&quot;}\"><button class=\"btn\">Update beacon map: Vesta-9</button><span class=\"runact-desc\">lit · 1,200 sector scrip, paid to the witnesses of record</span></div>\n\n<ol>\n<li><strong>Log the fragments.</strong> Osk's rutter page was logged in Scene 2 (press it there if it never got pressed). And that night, docked under the lit beacon, the gifted crew member dreams — a canyon full of light, the light is people, all saying one word together that they can never quite hear. Not a scary dream; the kind you try to get back into. It recurs. Log the living witness — the witness is one of the crew:</li>\n</ol>\n<div class=\"runact\" data-kind=\"fragment\" data-aid=\"m01-4\" data-args=\"{&quot;name&quot;: &quot;The canyon dream (one of the crew&#x27;s)&quot;, &quot;form&quot;: &quot;living witness — a gifted PC&quot;, &quot;tag&quot;: &quot;Jedi&quot;, &quot;question&quot;: &quot;What is the Valley?&quot;, &quot;claim&quot;: &quot;the canyon is full of light, and the light is people&quot;, &quot;holder&quot;: &quot;crew&quot;, &quot;status&quot;: &quot;trusted&quot;}\"><button class=\"btn\">Issue fragment: The canyon dream (one of the crew&#x27;s)</button><span class=\"runact-desc\">Jedi · bears on “What is the Valley?”</span></div>\n\n<ol>\n<li><em>The quiet one. GM only — do this where the players cannot see it. The unremarkable hull in the arrival swarm files its census: the crew, the ship, the certified corridor — and which of the names the beacon answered. The Inheritors did not light this beacon; they are the second party to arrive at a door somebody else opened, and they intend to be first through the next one.</em></li>\n</ol>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m01-5\" data-args=\"{&quot;faction&quot;: &quot;Inheritors&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;Dial 3 — the observer files the Vesta-9 census: the crew — and its gifted — are now in an Inheritor file&quot;}\"><button class=\"btn\">Advance clock: Inheritors +1</button><span class=\"runact-desc\">Dial 3 — the observer files the Vesta-9 census: the crew — and its gifted — are now in an Inheritor file</span></div>\n\n<ol>\n<li><strong>XP:</strong> 15–20 standard for the session; <strong>+5</strong> for strong Obligation play — a PC who let the grounding cost them something real, not just narrated it.</li>\n</ol>\n<p><strong>Next session's door</strong> — open one before the table stands up, keyed to what they chose:</p>\n<ul>\n<li>The gift stayed the crew's secret: the gifted PC dreams again the night before making port at the first world up the dead Run — and something from the dream is on the manifest.</li>\n<li>The gifted PC signed with a faction: a letter, a summons, or a scheduled check-in arrives — whoever holds the registration wants something carried, and the crew is suddenly a courier with a conscience.</li>\n<li>Fee in hand: Grell's cut comes due, Marrow proposes a joint run, or the guild's 250-scrip charter dangles the next dark beacon on the Reach's far side.</li>\n<li>Fee unclaimed: Nerra's backdating favor is on the table, and it has a destination attached — your pick of the seeded episode worlds.</li>\n</ul>\n<p><strong>The closing image</strong>, said to the table in your own words: the crew came to Okrent's Drift as nobody. They leave with a corridor open behind them and three factions holding files with their names — the Vigil's psalter, the Admiralty's log, the guild's certificate. And someone nobody counted has a file too — and theirs is the only one that marks which of the names the beacon answered.</p>"}, {"sid": "s8", "title": "Contingencies", "html": "<div class=\"adm adm-danger\"><p class=\"adm-title\">They attack the Steadfast</p><p>The sloop cripples their drives at long range with throttled turbolaser fire — narrate the disabling, do not roll it; the marines board under stun and take prisoners cleanly; <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--commander-joss-reike\">Commander Joss Reike</a> files charges <em>correctly</em>. Play the aftermath, not a massacre: a Bastion brig, a scrupulously fair hearing, <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-vess-marrow\">Captain Vess Marrow</a> posting bond she cannot afford, Nerra buying testimony, <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--keeper-adressa-vhail\">Keeper Adressa Vhail</a> declining to testify at all. The crew flies again owing everyone — and the Annexation now has their name in its founding paperwork.</p></div>\n\n<p><em>If shots were actually fired at the sloop:</em></p>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m01-6\" data-args=\"{&quot;faction&quot;: &quot;Admiralty&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;Shots fired at the Steadfast over Vesta-9 — the corridor now provably needs protecting, with the crew&#x27;s name in the log&quot;}\"><button class=\"btn\">Advance clock: Admiralty +1</button><span class=\"runact-desc\">Shots fired at the Steadfast over Vesta-9 — the corridor now provably needs protecting, with the crew&#x27;s name in the log</span></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">The gifted PC registers with the fleet</p><p>Reike is gentle, correct, and keeps every promise — that is what makes it dangerous. Registration means scheduled check-ins at named ports, a fleet physician's standing invitation, and courteous letters that always arrive on time. Keep it in play as texture, not a cage: the check-ins can be traded on, dodged at a cost, or attended for intelligence — the pipeline runs both ways. When the Awakening goes public in Act 2, the fleet comes to collect what it registered, and the PC gets to decide in front of the whole table what their signature was worth.</p></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">They confide in Vhail, or sign Nerra's articles</p><p><strong>Vhail</strong> does not thank them. Custody of the <em>calling</em> is the thing her order's deed never granted, and a living, willing, adult Awakened standing in front of her forces the argument the Vigil has postponed for a generation — she leaves with the crew's trust and her order's crisis in the same satchel. <strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a></strong> files the articles the same day, and the PC's routings and dream-logs start flowing through a guild with a hole in it — the Inheritors get their name, their schedule, and their canyon, in the guild's own filing format (Dial 3).</p></div>\n\n<p><em>If the crew put their gifted member's existence formally in Vigil hands:</em></p>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m01-7\" data-args=\"{&quot;faction&quot;: &quot;Vigil&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;A living, willing Awakened adult known to the Vigil — the sacrilege-versus-rebirth argument goes from doctrinal to real&quot;}\"><button class=\"btn\">Advance clock: Vigil +1</button><span class=\"runact-desc\">A living, willing Awakened adult known to the Vigil — the sacrilege-versus-rebirth argument goes from doctrinal to real</span></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">The gift never surfaces</p><p>The player held it down all session — honor it; that was the scene, played well. The resonance still sits in the luminosity logs and the certification packet (slow-fuse box), so the Dial 3 observer files the crew with a \"suspected\" flag rather than a fact, and the Inheritors' first contact comes slower and more carefully. And the beacon remembers: at the next relight the crew attempts, the new beacon reaches for the same PC <em>harder</em> — the choice comes back around, louder, in front of whoever is watching that time.</p></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">They claim the first-lighting fee without a guild witness</p><p>No certificate, no bond: the claim files as \"unwitnessed,\" which any crew may counterclaim — and the <em>Larksong</em> was there. The fee freezes; Grell's cut evaporates with it, which he takes personally and repriced. <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a> will offer to backdate a certification later, sweetly, for a favor the guild names. That favor is a hook — spend it on whichever Act 1 seed the party is circling.</p></div>"}]}];
const SEED   = {"questions": ["Why did the Jedi leave the Rim?", "What is the Valley?", "Who lit Vesta-9?", "What did the Adjournment actually adjourn?"], "clocks": [{"faction": "Republic", "crack": "Recovered by adjourning the Rim; wants it back on its terms", "value": 0, "notes": ""}, {"faction": "Admiralty", "crack": "The founding story requires an enemy → the Annexation", "value": 0, "notes": ""}, {"faction": "Vigil", "crack": "Sacrilege vs. Order-reborn — custody of the Awakened → the Vigil breaks", "value": 0, "notes": ""}, {"faction": "Inheritors", "crack": "Nobody knows whose hand is at the top → the Unveiling", "value": 0, "notes": "Hold the Vesta-9 file on the crew — and its gifted (Dial 3)."}, {"faction": "Lamplighters", "crack": "The relighting order is for sale → Conclave of Charts (rigged: Denno Pike)", "value": 0, "notes": ""}, {"faction": "Kajidics", "crack": "The young Hutts have run the numbers → clan war", "value": 0, "notes": ""}, {"faction": "The Awakening", "crack": "Every public display raises the temperature → it goes public", "value": 0, "notes": ""}], "beacons": [{"name": "Vesta-9", "status": "lit", "corridor": "the Grumani Reach (Duros Space Run, toward Enarc)", "certified": "Chartmistress Bel Nerra (Lamplighters)", "fee": "pending session one", "followed": "Vigil, Admiralty, Lamplighters — and one Inheritor observer (Dial 3)"}], "fragments": [], "truthsFound": [], "corrupted": [], "sessions": [], "run": {}, "rev": 0};
const HEAD_STATIC = "<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Ember Age GM Screen</title>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap\">";
const SKELETON = "<header>\n  <h1><span class=\"flame\">◆</span> THE EMBER AGE <span class=\"small muted\">GM screen</span></h1>\n  <nav id=\"nav\"></nav>\n  <div class=\"spacer\"></div>\n  <button class=\"hbtn\" id=\"syncchip\" style=\"display:none\" onclick=\"syncNow()\">Sync</button>\n  <button class=\"hbtn\" onclick=\"exportState()\">Export save</button>\n  <button class=\"hbtn\" onclick=\"document.getElementById('importfile').click()\">Import</button>\n  <input type=\"file\" id=\"importfile\" accept=\".json\" style=\"display:none\" onchange=\"importState(this)\">\n  <button class=\"hbtn\" onclick=\"resetState()\">Reset</button>\n</header>\n<div id=\"syncbanner\"></div>\n<main>\n  <div id=\"tab-run\" class=\"tab\"></div>\n  <div id=\"tab-npcs\" class=\"tab\"></div>\n  <div id=\"tab-trackers\" class=\"tab\"></div>\n  <div id=\"tab-log\" class=\"tab\"></div>\n  <div id=\"tab-reference\" class=\"tab\"></div>\n  <div id=\"tab-setting\" class=\"tab\"></div>\n  <div id=\"tab-truths\" class=\"tab\"></div>\n</main>\n<footer>The Ember Age — homebrew campaign GM screen · built 2026-08-23 · state autosaves locally; Sync publishes it to this page's live copy</footer>";

/* ------------------------------------------------ state & sync */
const KEY = "emberAgeGM.v1";
function freshState(){ const s = JSON.parse(JSON.stringify(SEED)); s.rev = 0; return s; }
const stateEl = document.getElementById("gm-state");
let EMBED = freshState();
try{ if(stateEl) EMBED = Object.assign(freshState(), JSON.parse(stateEl.textContent)); }catch(e){}
let S = EMBED;
try{
  const ls = JSON.parse(localStorage.getItem(KEY));
  if(ls && (ls.rev||0) > (EMBED.rev||0)) S = Object.assign(freshState(), ls);
}catch(e){}
function save(){ S.rev = (S.rev||0)+1; try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} updateSyncUI(); }
function esc(x){ return String(x==null?"":x).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

let artifactNS = null, downloadsNS = null, readOnly = false;
(async () => {
  try{
    if(window.claude && window.claude.use){
      artifactNS = await window.claude.use("artifact");
      downloadsNS = await window.claude.use("downloads");
    }
  }catch(e){}
  updateSyncUI();
})();

function dirty(){ return (S.rev||0) > (EMBED.rev||0); }
function updateSyncUI(){
  const chip = document.getElementById("syncchip");
  if(!artifactNS || readOnly){ chip.style.display = "none"; }
  else{
    chip.style.display = "";
    chip.className = "hbtn" + (dirty() ? " dirty" : "");
    chip.textContent = dirty() ? `Sync (${(S.rev||0)-(EMBED.rev||0)} change${(S.rev-EMBED.rev)===1?"":"s"})` : "Synced ✓";
  }
  const ban = document.getElementById("syncbanner");
  if(artifactNS && !readOnly && dirty() && (EMBED.rev||0) > 0){
    ban.style.display = "block";
    ban.innerHTML = `This browser holds changes newer than the page's live copy.
      <button class="hbtn" onclick="syncNow()">Publish local changes</button>
      <button class="hbtn" onclick="keepCloud()">Discard local, keep live copy</button>`;
  } else ban.style.display = "none";
}
function keepCloud(){ S = JSON.parse(JSON.stringify(EMBED)); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} renderAll(); }

function stateJSON(){ return JSON.stringify(S).replace(/</g, "\\u003c"); }
function renderDocument(){
  const code = document.getElementById("app-code").textContent;
  const style = document.getElementById("app-style").textContent;
  const SC = "script";
  return "<!doctype html>\n<html lang=\"en\">\n<head>\n" + HEAD_STATIC +
    "\n<style id=\"app-style\">" + style + "</style>\n</head>\n<body>\n" + SKELETON +
    "\n<" + SC + " id=\"gm-state\" type=\"application/json\">" + stateJSON() + "</" + SC + ">\n" +
    "<" + SC + " id=\"app-code\">" + code + "</" + SC + ">\n</body>\n</html>\n";
}
async function syncNow(){
  if(!artifactNS) return;
  try{ sessionStorage.setItem("ea.resume", JSON.stringify({tab: cur})); }catch(e){}
  const chip = document.getElementById("syncchip");
  chip.textContent = "Syncing…";
  try{
    await artifactNS.publish(renderDocument());
    /* on success the shell reloads this view with the new embedded state */
  }catch(err){
    const code = err && err.code;
    if(code === "conflict"){ /* shell reloads to the winning version; local state stays in localStorage and the banner offers the merge choice */ }
    else if(code === "not_writer" || code === "not_granted" || code === "not_declared"){ readOnly = true; updateSyncUI(); }
    else if(code === "rate_limited"){ chip.textContent = "Rate limited — try again in a moment"; setTimeout(updateSyncUI, 4000); }
    else { chip.textContent = "Sync failed — will retry on next Sync"; setTimeout(updateSyncUI, 4000); }
  }
}

async function exportState(){
  const data = JSON.stringify(S, null, 2);
  const fname = "ember-age-save-" + new Date().toISOString().slice(0,10) + ".json";
  if(downloadsNS){
    try{ await downloadsNS.save({filename: fname, data}); }catch(err){ /* declined or unavailable — fall through */
      if(err && (err.code === "declined" || err.code === "rate_limited")) return;
      tryBlobDownload(fname, data);
    }
    return;
  }
  tryBlobDownload(fname, data);
}
function tryBlobDownload(fname, data){
  const blob = new Blob([data], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  URL.revokeObjectURL(a.href);
}
function importState(inp){
  const f = inp.files[0]; if(!f) return;
  f.text().then(t=>{ S = Object.assign(freshState(), JSON.parse(t)); save(); renderAll(); alert("Save imported. Use Sync to publish it to the live copy."); })
   .catch(()=>alert("Could not read that file."));
  inp.value = "";
}
function resetState(){
  if(confirm("Reset ALL tracker/log state to the campaign start? (Export first if unsure.)")){ S = freshState(); save(); renderAll(); }
}

/* ------------------------------------------------ tabs & in-app links */
const TABS = [["run","Run"],["npcs","NPCs"],["trackers","Trackers"],["log","Session Log"],["reference","Reference"],["setting","Setting"],["truths","GM Truths"]];
let cur = "npcs";
try{ const r = JSON.parse(sessionStorage.getItem("ea.resume")); if(r && r.tab){ cur = r.tab; sessionStorage.removeItem("ea.resume"); } }catch(e){}
if(location.hash && TABS.some(t=>t[0]===location.hash.slice(1))) cur = location.hash.slice(1);
function nav(){
  document.getElementById("nav").innerHTML = TABS.map(([id,lbl])=>
    `<button class="${cur===id?'on':''}" onclick="go('${id}')">${lbl}</button>`).join("");
  TABS.forEach(([id])=>document.getElementById("tab-"+id).classList.toggle("on", cur===id));
}
function go(id){ cur=id; try{history.replaceState(null,"","#"+id);}catch(e){} nav(); window.scrollTo(0,0); }
let npcFocus = null;
function navTo(spec){
  const p = spec.split(":");
  if(p[0]==="tab"){ go(p[1]); }
  else if(p[0]==="page"){ pageSel[p[1]] = p[2]; pagesTab(p[1]); go(p[1]); }
  else if(p[0]==="npcs"){
    if(p[1]==="group"){ npcGroup = p[2]; npcKind = "All"; npcQ = ""; }
    npcTab(); go("npcs");
  }
  else if(p[0]==="npc"){
    npcFocus = p.slice(1).join(":"); npcGroup = "all"; npcKind = "All"; npcQ = "";
    npcTab(); go("npcs");
    const el = document.getElementById("npc-"+npcFocus);
    if(el){ el.open = true; el.scrollIntoView({block:"start"}); }
  }
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.xin[data-nav]");
  if(a){ e.preventDefault(); navTo(a.dataset.nav); return; }
  const b = e.target.closest(".runact button");
  if(b){ runAction(b.closest(".runact")); }
});

/* ------------------------------------------------ Run tab */
function runState(mid){
  if(!S.run) S.run = {};
  if(!S.run[mid]) S.run[mid] = { scenes: {}, actions: {} };
  return S.run[mid];
}
function runTab(){
  const el = document.getElementById("tab-run");
  if(!MODULES.length){ el.innerHTML = `<p class="muted">No run modules built yet.</p>`; return; }
  const m = MODULES[0];
  const rs = runState(m.id);
  el.innerHTML = `
    <div class="card">
      <h2 style="margin:.1rem 0;font-family:var(--disp);color:var(--gold)">${esc(m.title)}</h2>
      <div class="scenepills">${m.scenes.map(s=>`
        <button class="chip ${rs.scenes[s.sid]?'on':''}" onclick="document.getElementById('scene-${s.sid}').scrollIntoView({block:'start'})"
          title="jump to scene">${esc(s.title)}</button>`).join("")}
      </div>
      <p class="muted small" style="margin:.4rem 0 0">Pills jump to a scene; tick a scene done with the checkbox on its header. Action buttons write straight into your Trackers.</p>
    </div>
    <div class="card doc">${m.intro}</div>
    ${m.scenes.map(s=>`
      <div class="card doc" id="scene-${s.sid}">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:.6rem">
          <h2 style="margin:.1rem 0">${esc(s.title)}</h2>
          <label class="small muted" style="white-space:nowrap"><input type="checkbox" ${rs.scenes[s.sid]?"checked":""}
            onchange="runState('${m.id}').scenes['${s.sid}']=this.checked;save();runTab()"> done</label>
        </div>
        ${s.html}
      </div>`).join("")}`;
  markDoneActions(m.id);
}
function markDoneActions(mid){
  const rs = runState(mid);
  document.querySelectorAll("#tab-run .runact").forEach(d=>{
    if(rs.actions[d.dataset.aid]){
      const b = d.querySelector("button");
      b.disabled = true; b.textContent = "✓ " + b.textContent.replace(/^✓ /,"");
      b.classList.add("ghost");
    }
  });
}
function runAction(div){
  const kind = div.dataset.kind, aid = div.dataset.aid;
  let args = {};
  try{ args = JSON.parse(div.dataset.args); }catch(e){ return; }
  const m = MODULES[0], rs = runState(m.id);
  if(rs.actions[aid]) return;
  if(kind === "fragment"){
    if(args.question && !S.questions.includes(args.question)) S.questions.push(args.question);
    S.fragments.push({name:args.name||"", form:args.form||"", tag:args.tag||"Civic", question:args.question||"",
                      claim:args.claim||"", holder:args.holder||"crew", status:args.status||"trusted"});
  } else if(kind === "clock"){
    const c = S.clocks.find(c=>c.faction===args.faction);
    if(c){ c.value = Math.max(0, Math.min(6, c.value + (args.delta||1)));
           if(args.note) c.notes = (c.notes? c.notes+"\n" : "") + args.note; }
  } else if(kind === "beacon"){
    const b = S.beacons.find(b=>b.name===args.name);
    if(b) Object.assign(b, args);
    else S.beacons.push({name:args.name||"", status:args.status||"lit", corridor:args.corridor||"",
                         certified:args.certified||"", fee:args.fee||"", followed:args.followed||""});
  } else return;
  rs.actions[aid] = true;
  save(); trackersTab(); markDoneActions(m.id);
}

/* ------------------------------------------------ NPC tab */
const KINDS = ["All","Nemesis","Rival","Minion","Vehicle","Hazard"];
let npcQ="", npcKind="All", npcGroup="all";
function npcTab(){
  const el = document.getElementById("tab-npcs");
  el.innerHTML = `
    <div class="toolbar">
      <input type="search" placeholder="Search ${NPCS.length} stat blocks — name, faction, skill, gear…" value="${esc(npcQ)}"
             oninput="npcQ=this.value;npcList()">
      ${KINDS.map(k=>`<button class="chip ${npcKind===k?'on':''}" onclick="npcKind='${k}';npcTab()">${k}</button>`).join("")}
      <select onchange="npcGroup=this.value;npcTab()">
        <option value="all">All groups</option>
        ${GROUPS.map(g=>`<option value="${g.slug}" ${npcGroup===g.slug?'selected':''}>${esc(g.label)}</option>`).join("")}
      </select>
    </div>
    <div id="npclist"></div>`;
  npcList();
}
function npcList(){
  const q = npcQ.trim().toLowerCase();
  const hits = NPCS.filter(n =>
    (npcKind==="All"||n.kind===npcKind) &&
    (npcGroup==="all"||n.group===npcGroup) &&
    (!q || n.search.includes(q)));
  const gi = (npcGroup!=="all" && !q) ? GROUPS.find(g=>g.slug===npcGroup) : null;
  document.getElementById("npclist").innerHTML =
    (gi?`<div class="card groupintro doc small">${gi.intro}</div>`:"") +
    `<p class="muted small">${hits.length} of ${NPCS.length} blocks</p>` +
    hits.map(n=>`
      <details class="npc" id="npc-${n.id}" ${hits.length===1||n.id===npcFocus?"open":""}>
        <summary>
          <span class="nm">${esc(n.name)}</span>
          <span class="badge ${n.kind}">${n.kind}</span>
          <span class="fac">${esc(n.faction)}${n.role?" · "+esc(n.role):""}</span>
          ${n.derived?`<span class="drv">${esc(n.derived)}</span>`:""}
        </summary>
        <div class="body doc">${n.html}</div>
      </details>`).join("") || `<p class="muted">Nothing matches.</p>`;
}

/* ------------------------------------------------ Trackers tab */
function trackersTab(){
  const el = document.getElementById("tab-trackers");
  el.innerHTML = `
    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">Faction clocks</h2>
      <p class="muted small">Each faction's crack, 0–6. Click a segment; a full clock fires its Act 2 hinge.</p>
      <div class="clockgrid">${S.clocks.map((c,i)=>`
        <div class="card clock" style="margin:0">
          <b style="color:var(--gold)">${esc(c.faction)}</b>
          <div class="muted small">${esc(c.crack)}</div>
          <div class="segs">${[1,2,3,4,5,6].map(v=>
            `<div class="seg ${c.value>=v?'f':''}" title="${v}" onclick="clockSet(${i},${v})"></div>`).join("")}</div>
          <textarea placeholder="notes…" onchange="S.clocks[${i}].notes=this.value;save()">${esc(c.notes)}</textarea>
        </div>`).join("")}
      </div></div>

    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">Lore fragments</h2>
      <div class="qsum">${questionSummary()}</div>
      <table class="tr"><thead><tr><th>Fragment</th><th>Form</th><th>Tag</th><th>Question</th><th>Load-bearing claim</th><th>Holder</th><th>Status</th><th></th></tr></thead>
      <tbody>${S.fragments.map((f,i)=>`
        <tr><td><b>${esc(f.name)}</b></td><td>${esc(f.form)}</td><td><span class="tag ${esc(f.tag)}">${esc(f.tag)}</span></td>
        <td>${esc(f.question)}</td><td class="small">${esc(f.claim)}</td><td>${esc(f.holder)}</td><td>${esc(f.status)}</td>
        <td class="rowbtns"><button title="delete" onclick="S.fragments.splice(${i},1);save();trackersTab()">✕</button></td></tr>`).join("")}
      </tbody></table>
      <div class="formgrid">
        <div><label>Fragment name</label><input id="f-name" placeholder="Grandmother Osk's rutter, p.40"></div>
        <div><label>Form</label><input id="f-form" placeholder="rutter / witness / droid core…"></div>
        <div><label>Tag</label><select id="f-tag"><option>Jedi</option><option>Sith</option><option>Civic</option></select></div>
        <div><label>Question</label><input id="f-q" list="qlist" placeholder="What ended the Order?">
          <datalist id="qlist">${S.questions.map(q=>`<option>${esc(q)}</option>`).join("")}</datalist></div>
        <div class="wide"><label>Load-bearing claim (what it insists on)</label><input id="f-claim"></div>
        <div><label>Holder</label><input id="f-holder" value="crew"></div>
        <div><label>Status</label><select id="f-status"><option>trusted</option><option>suspect</option><option>spent</option><option>forged?</option></select></div>
        <div style="align-self:end"><button class="btn" onclick="addFragment()">Add fragment</button></div>
      </div>
      <div class="stat small muted">Rules: a held, relevant fragment = boost die on related Knowledge checks. 3+ fragments on one Question → Hard Knowledge (Lore) Reconstruction as a group scene; all three tags represented → upgrade an ability die once; only one tag → upgrade difficulty once. Full rules: <a href="#" class="xin" data-nav="page:reference:lore-fragments">Lore Fragments</a>.</div>
    </div>

    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">Beacon map</h2>
      <table class="tr"><thead><tr><th>Beacon</th><th>Status</th><th>Corridor</th><th>Certified by</th><th>First-lighting fee</th><th>Who followed through</th><th></th></tr></thead>
      <tbody>${S.beacons.map((b,i)=>`
        <tr><td><b>${esc(b.name)}</b></td>
        <td><select onchange="S.beacons[${i}].status=this.value;save()">${["dark","attempted","lit"].map(s=>`<option ${b.status===s?"selected":""}>${s}</option>`).join("")}</select></td>
        <td>${esc(b.corridor)}</td><td>${esc(b.certified)}</td><td>${esc(b.fee)}</td><td class="small">${esc(b.followed)}</td>
        <td class="rowbtns"><button title="delete" onclick="S.beacons.splice(${i},1);save();trackersTab()">✕</button></td></tr>`).join("")}
      </tbody></table>
      <div class="formgrid">
        <div><label>Beacon</label><input id="b-name"></div>
        <div><label>Status</label><select id="b-status"><option>dark</option><option>attempted</option><option>lit</option></select></div>
        <div><label>Corridor it opens</label><input id="b-corridor"></div>
        <div><label>Certified by</label><input id="b-certified"></div>
        <div><label>Fee</label><input id="b-fee"></div>
        <div class="wide"><label>Who followed through</label><input id="b-followed"></div>
        <div style="align-self:end"><button class="btn" onclick="addBeacon()">Add beacon</button></div>
      </div>
      <div class="stat small muted">Relight challenge — three stages, any order: <b>Wake it</b> (Mechanics/Computers) · <b>Chart it</b> (Hard Astrogation, fragments/rutters = boost) · <b>Speak to it</b> (Knowledge or social). Full rules: <a href="#" class="xin" data-nav="page:reference:beacon-relighting">Relighting a Beacon</a>.</div>
    </div>

    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">Truths revealed &amp; corrupted conclusions</h2>
      <table class="tr"><thead><tr><th>Truth / Insight granted</th><th></th></tr></thead><tbody>
        ${S.truthsFound.map((t,i)=>`<tr><td>${esc(t)}</td><td class="rowbtns"><button onclick="S.truthsFound.splice(${i},1);save();trackersTab()">✕</button></td></tr>`).join("")}
      </tbody></table>
      <div class="formgrid"><div class="wide"><input id="t-new" placeholder="Truth revealed + Insight granted (setback removed / talent unlocked)"></div>
      <div><button class="btn" onclick="pushItem('truthsFound','t-new')">Add</button></div></div>
      <table class="tr"><thead><tr><th>Corrupted conclusion in play (Despair)</th><th></th></tr></thead><tbody>
        ${S.corrupted.map((t,i)=>`<tr><td class="bias">${esc(t)}</td><td class="rowbtns"><button onclick="S.corrupted.splice(${i},1);save();trackersTab()">✕</button></td></tr>`).join("")}
      </tbody></table>
      <div class="formgrid"><div class="wide"><input id="c-new" placeholder="What the party now wrongly believes — and where it will bite"></div>
      <div><button class="btn" onclick="pushItem('corrupted','c-new')">Add</button></div></div>
    </div>`;
}
function clockSet(i,v){ S.clocks[i].value = (S.clocks[i].value===v? v-1 : v); save(); trackersTab(); }
function pushItem(key,inputId){ const el=document.getElementById(inputId); if(el.value.trim()){ S[key].push(el.value.trim()); save(); trackersTab(); } }
function addFragment(){
  const g=id=>document.getElementById(id).value;
  if(!g("f-name").trim()) return;
  const q=g("f-q").trim();
  if(q && !S.questions.includes(q)) S.questions.push(q);
  S.fragments.push({name:g("f-name"),form:g("f-form"),tag:g("f-tag"),question:q,claim:g("f-claim"),holder:g("f-holder"),status:g("f-status")});
  save(); trackersTab();
}
function addBeacon(){
  const g=id=>document.getElementById(id).value;
  if(!g("b-name").trim()) return;
  S.beacons.push({name:g("b-name"),status:g("b-status"),corridor:g("b-corridor"),certified:g("b-certified"),fee:g("b-fee"),followed:g("b-followed")});
  save(); trackersTab();
}
function questionSummary(){
  return S.questions.map(q=>{
    const fs = S.fragments.filter(f=>f.question===q);
    const tags = [...new Set(fs.map(f=>f.tag))];
    let note = "";
    if(fs.length>=3) note = tags.length>=3 ? `<span class="ready">Reconstruction ready — all three tags: upgrade ability once</span>`
      : tags.length===1 ? `<span class="ready">Reconstruction ready</span> · <span class="bias">single tag: upgrade difficulty once</span>`
      : `<span class="ready">Reconstruction ready</span>`;
    return `<div class="qcard"><b>${esc(q)}</b> — ${fs.length} fragment${fs.length===1?"":"s"}
      ${tags.map(t=>`<span class="tag ${esc(t)}">${esc(t)}</span>`).join(" ")} ${note?"· "+note:""}</div>`;
  }).join("");
}

/* ------------------------------------------------ Session log tab */
function logTab(){
  const el = document.getElementById("tab-log");
  const F = [["title","Title"],["date","Date"],["where","Where (system / world / beacon)"],["obligation","Obligation triggered"],
             ["beacons","Beacons (relit / attempted / learned of)"],["fragments","Fragments gained (name — tag — Question)"],
             ["factions","Factions moved"],["debts","Debts & favors"],["xp","XP awarded"],["line","The line of the night"]];
  el.innerHTML = `
    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">New session entry</h2>
      <div class="formgrid">
        ${F.map(([k,lbl])=>`<div class="${["where","fragments","factions","debts","line","beacons","obligation"].includes(k)?"wide":""}">
          <label>${lbl}</label><input id="s-${k}"></div>`).join("")}
        <div style="align-self:end"><button class="btn" onclick="addSession()">Add session ${S.sessions.length+1}</button></div>
      </div></div>
    ${S.sessions.map((s,i)=>`
      <div class="card sess">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h3>Session ${i+1} — ${esc(s.title||"untitled")} <span class="muted small">${esc(s.date||"")}</span></h3>
          <span class="rowbtns"><button title="copy as markdown" onclick="copySession(${i})">⧉</button>
          <button title="delete" onclick="if(confirm('Delete this session entry?')){S.sessions.splice(${i},1);save();logTab()}">✕</button></span>
        </div>
        <dl>${F.slice(2).map(([k,lbl])=>s[k]?`<dt>${lbl}</dt><dd>${esc(s[k])}</dd>`:"").join("")}</dl>
      </div>`).reverse().join("")}`;
}
function addSession(){
  const keys = ["title","date","where","obligation","beacons","fragments","factions","debts","xp","line"];
  const s = {}; keys.forEach(k=>s[k]=document.getElementById("s-"+k).value);
  if(!s.title.trim()) { alert("Give it at least a title."); return; }
  S.sessions.push(s); save(); logTab();
}
function copySession(i){
  const s = S.sessions[i];
  const md = `## Session ${i+1} — ${s.title} (${s.date})\n\n**Where:** ${s.where}\n**Obligation triggered:** ${s.obligation}\n**Beacons:** ${s.beacons}\n**Fragments gained:** ${s.fragments}\n**Factions moved:** ${s.factions}\n**Debts & favors:** ${s.debts}\n**XP awarded:** ${s.xp}\n**The line of the night:** ${s.line}\n`;
  navigator.clipboard ? navigator.clipboard.writeText(md).then(()=>alert("Copied as markdown."))
    : alert("Clipboard unavailable — select and copy:\n\n"+md);
}

/* ------------------------------------------------ page tabs (reference / setting / truths) */
const pageSel = {reference:null, setting:null};
function pagesTab(section){
  const el = document.getElementById("tab-"+section);
  const list = PAGES.filter(p=>p.section===section);
  if(!pageSel[section]) pageSel[section] = list[0].id;
  const curP = list.find(p=>p.id===pageSel[section]) || list[0];
  el.innerHTML = `<div class="cols">
    <div class="side">${section==="reference" ? minionCalc() : ""}
      ${list.map(p=>`<button class="${p.id===curP.id?'on':''}" onclick="pageSel['${section}']='${p.id}';pagesTab('${section}')">${esc(p.title)}</button>`).join("")}
    </div>
    <div class="pane"><div class="card doc">${curP.html}</div></div>
  </div>`;
  if(section==="reference" && document.getElementById("mc-out")) mcOut();
}
function minionCalc(){
  return `<div class="grp">Minion group math</div>
    <div style="padding:.2rem .5rem .5rem">
      <label>WT each × count</label>
      <div style="display:flex;gap:.3rem">
        <input id="mc-wt" type="number" value="5" min="1" style="width:60px" oninput="mcOut()">
        <input id="mc-n" type="number" value="4" min="1" style="width:60px" oninput="mcOut()">
      </div>
      <div id="mc-out" class="small muted" style="margin-top:.3rem"></div>
    </div>`;
}
function mcOut(){
  const wt=+document.getElementById("mc-wt").value||0, n=+document.getElementById("mc-n").value||0;
  document.getElementById("mc-out").innerHTML =
    `Group WT <b style="color:var(--gold)">${wt*n}</b> · group skills at <b style="color:var(--gold)">${Math.max(0,n-1)}</b> ranks<br>
     one minion drops at ${Array.from({length:n},(_,i)=>wt*(i+1)).join(", ")} total damage`;
}
let truthsOpen = false;
function truthsTab(){
  const el = document.getElementById("tab-truths");
  const p = PAGES.find(p=>p.section==="truths");
  el.innerHTML = truthsOpen
    ? `<div class="card doc">${p.html}</div><button class="btn ghost" onclick="truthsOpen=false;truthsTab()">Seal it again</button>`
    : `<div class="gate"><h2 style="color:var(--bad)">Part V — GM Truths (locked)</h2>
       <p class="muted">Players never see this page. Three dials, now set.<br>Don't open it with anyone looking over your shoulder.</p>
       <button class="btn danger" onclick="truthsOpen=true;truthsTab()">Break the seal</button></div>`;
}

/* ------------------------------------------------ boot */
function renderAll(){ nav(); runTab(); npcTab(); trackersTab(); logTab(); pagesTab("reference"); pagesTab("setting"); truthsTab();
  if(document.getElementById("mc-out")) mcOut(); updateSyncUI(); }
window.addEventListener("hashchange",()=>{ const h=location.hash.replace("#",""); if(TABS.some(t=>t[0]===h)){ cur=h; nav(); } });
renderAll();
</script>
