<style id="app-style">

  *{box-sizing:border-box} html,body{margin:0;padding:0}

  header{position:sticky;top:0;z-index:20;background:linear-gradient(180deg,#241b12,#1c1611);border-bottom:1px solid var(--line);
         display:flex;flex-wrap:wrap;gap:.6rem;align-items:center;padding:.55rem .9rem}

  nav{display:flex;gap:.25rem;flex-wrap:wrap}

  nav button.on{color:var(--gold);border-color:var(--line);background:var(--panel)}
  nav button:hover,nav button:focus-visible{color:var(--ink);outline:none}
  nav button:focus-visible{border-color:var(--ember)}
  .spacer{flex:1}
  .hbtn{background:var(--panel);border:1px solid var(--line);color:var(--dim);border-radius:.5rem;padding:.3rem .6rem;cursor:pointer;font:inherit;font-size:.85rem}
  .hbtn:hover,.hbtn:focus-visible{color:var(--ink);border-color:var(--ember);outline:none}
  .hbtn.dirty{color:#1b120a;background:var(--gold);border-color:var(--gold);font-weight:700}
  #syncbanner{display:none;background:#33261a;border-bottom:1px solid var(--line);padding:.45rem .9rem;font-size:.88rem;color:var(--gold)}
  #syncbanner button{margin-left:.6rem}
  main{max-width:1200px;margin:0 auto;padding:1rem .9rem 4rem}
  .tab{display:none} .tab.on{display:block}

  .doc h1{font-family:var(--disp);color:var(--gold);font-size:1.5rem;margin:.4rem 0 .6rem}
  .doc h2{font-family:var(--disp);color:var(--gold);font-size:1.2rem;margin:1.2rem 0 .4rem}
  .doc h3{color:var(--ember);font-size:1.05rem;margin:1rem 0 .3rem}
  .doc a{color:var(--gold)}
  .doc a.xin{color:var(--gold);text-decoration:none;border-bottom:1px solid var(--ember)}
  .doc a.xin:hover{color:var(--ember)}
  .doc .xref{color:var(--gold);border-bottom:1px dotted var(--dim)}
  .doc table{border-collapse:collapse;margin:.6rem 0;width:100%;font-size:.92em;display:block;overflow-x:auto}
  .doc th,.doc td{border:1px solid var(--line);padding:.3rem .55rem;text-align:left;vertical-align:top}
  .doc th{background:var(--panel2);color:var(--gold)}
  .doc blockquote{margin:.6rem 0;padding:.4rem .8rem;border-left:3px solid var(--ember);background:var(--panel);color:var(--dim);font-style:italic}
  .doc code{background:var(--panel2);padding:.05rem .3rem;border-radius:.25rem}
  .doc pre{background:var(--panel2);padding:.6rem;border-radius:.5rem;overflow:auto}
  .adm{border:1px solid var(--line);border-left:4px solid var(--ember);background:var(--panel);border-radius:.4rem;padding:.5rem .8rem;margin:.7rem 0}
  .adm-title{font-weight:700;color:var(--gold);margin:.1rem 0 .3rem}
  .adm-danger{border-left-color:var(--bad)} .adm-tip{border-left-color:var(--ok)} .adm-quote{border-left-color:var(--gold)}

  .cols{display:grid;grid-template-columns:250px 1fr;gap:1rem}
  @media(max-width:800px){.cols{grid-template-columns:1fr}}
  .side{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);
        border:1px solid var(--line);border-radius:.6rem;padding:.5rem}
  .side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--dim);padding:.3rem .5rem;border-radius:.4rem;cursor:pointer;font:inherit;font-size:.9rem}

  .pane{min-width:0}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:.6rem;padding:.8rem 1rem;margin:0 0 .8rem}
  .muted{color:var(--dim)} .small{font-size:.85rem}

  .btn.ghost{background:var(--panel2);color:var(--dim);border:1px solid var(--line)} .btn.ghost:hover{color:var(--ink)}
  .btn.danger{background:var(--bad);color:#fff}
  .rowbtns button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:1rem;padding:.1rem .25rem}
  .rowbtns button:hover{color:var(--gold)}

  .chip{border:1px solid var(--line);background:var(--panel);color:var(--dim);border-radius:2rem;padding:.25rem .75rem;cursor:pointer;font:inherit;font-size:.85rem}
  .chip.on{background:var(--ember);color:#1b120a;border-color:var(--ember);font-weight:700}

  details.npc[open]>summary{border-bottom:1px solid var(--line);background:var(--panel2)}
  .npc .nm{font-family:var(--disp);font-weight:700;color:var(--gold);font-size:1.05rem;letter-spacing:.02em}
  .badge{font-size:.72rem;padding:.08rem .5rem;border-radius:1rem;border:1px solid var(--line);color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .badge.Nemesis{color:#f0a0a0;border-color:#7a4038}.badge.Rival{color:var(--gold);border-color:#7a5f2c}
  .badge.Minion{color:#9fc49f;border-color:#40603f}.badge.Vehicle{color:#9fb7d8;border-color:#3d5a7a}
  .badge.Hazard{color:#d8a0e0;border-color:#6a3d7a}.badge.Special{color:var(--dim)}
  .npc .fac{color:var(--dim);font-size:.85rem} .npc .drv{width:100%;color:var(--dim);font-size:.82rem}
  .npc .body{padding:.4rem 1rem .8rem}
  .groupintro{margin:.2rem 0 .8rem}

  .clockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.7rem}
  .clock .segs{display:flex;gap:.25rem;margin:.4rem 0}
  .clock .seg{width:32px;height:20px;border:1px solid var(--line);border-radius:.25rem;background:var(--panel2);cursor:pointer}

  .clock textarea{width:100%;min-height:44px;margin-top:.35rem;font-size:.85rem}
  .formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.5rem;margin:.5rem 0}

  table.tr{border-collapse:collapse;width:100%;font-size:.9rem;margin:.5rem 0;display:block;overflow-x:auto}

  .tag{font-size:.75rem;padding:.05rem .45rem;border-radius:1rem;font-weight:700}

  .stat{border:1px dashed var(--line);border-radius:.5rem;padding:.5rem .8rem;margin:.4rem 0;background:var(--panel2)}

  .sess dd{margin:0 0 .1rem}
  footer{color:var(--dim);text-align:center;font-size:.75rem;padding:2rem 0}
  @media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

enology) 3, Perception 1, Vigilance 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> —</li>\n<li><strong>Equipment:</strong> Vigil breath-veil (breath mask), annotated psalter-slate (datapad), stylus. She carries no weapon and never has.</li>\n</ul>\n<p><strong>Chassis:</strong> Ashur Sungazer, Force and Destiny Core Rulebook (\"Lessons from the Past\") (adjustments: none).\n<strong>Using her:</strong> Vhail is the party's best living source on the old Order, the Valley, and relic law — the library's Jedi-tag fragment authority (Merion and Marn, on this same chassis by design, own the Civic tag and relic forensics) — every Knowledge skill at 3, and she trades answers for reverence, not scrip. She is serene under any pressure (lean on Discipline and Cool) and perfectly evasive about her arrival; decide privately whether the truth is mundane, stranded off a Vigil circuit ship, or something stranger — the planning doc leaves it open, and she need not be Dial 3's observer. When Immi surfaces, Vhail goes very quiet: she is living the Vigil's crack in real time, and which half of the order she lands on can hinge on how the party treats the girl. She is a noncombatant; if blasters come out, she kneels by the core and keeps praying.</p>", "search": "keeper adressa vhail rival — the vigil — keeper found praying at the beacon core she was here before the first ship arrived, kneeling at the core in the beacon-light, and she answers every \"how\" with a psalm about doors. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 3 1 2 2 soak 1 · wounds 10 · m/r defense 0/0 - skills: computers 2, cool 1, discipline 2, knowledge (core worlds) 3, knowledge (education) 3, knowledge (lore) 3, knowledge (outer rim) 3, knowledge (underworld) 3, knowledge (warfare) 3, knowledge (xenology) 3, perception 1, vigilance 1 - talents: none - abilities: — - equipment: vigil breath-veil (breath mask), annotated psalter-slate (datapad), stylus ion-one--bastion-marines-steadfast-boarding-party", "name": "Bastion Marines (Steadfast boarding party)", "kind": "Minion", "typeline": "Minion", "faction": "The Admiralty", "role": "Reike's naval infantry, the muscle behind his procedure", "derived": "Soak 5 · Wounds 5 (each) · M/R Defense 0/0", "group": "session-one", "html": "<p><em>Minion — The Admiralty — Reike's naval infantry, the muscle behind his procedure</em></p>\n<blockquote>\n<p>The airlock cycles, the white relic plate comes through in bounds, and the standoff acquires a chain of command.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 5 · Wounds 5 (each) · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills (group only):</strong> Athletics, Discipline, Melee, Ranged (Heavy)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Arsenal-pattern coil rifle (Ranged [Heavy]; Damage 9; Critical 3; Range [Long]; Stun setting), boarding vibroknife (Melee; Damage 4; Critical 2; Range [Engaged]; Pierce 2, Vicious 1), 2 arsenal-pattern breaching grenades (Ranged [Light]; Damage 8; Critical 4; Range [Short]; Blast 6, Limited Ammo 1), relic boarding plate (+2 soak), utility belt, extra reloads. Single marines or two-marine teams may instead be armed with a squad repeater with sling (Ranged [Heavy]; Damage 11; Critical 3; Range [Long]; Auto-fire, Cumbersome 4, Pierce 1).</li>\n</ul>\ ign: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 2 · Wounds 12 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Cool 2, Deception 3, Knowledge (Warfare) 2, Negotiation 2</li>\n<li><strong>Talents:</strong> Know Somebody 2 (<em>once per session, when attempting to purchase a legally available item, reduce its rarity by 2</em>)</li>\n<li><strong>Abilities:</strong> —</li>\n<li><strong>Equipment:</strong> Sleeve-holstered holdout blaster (Ranged [Light]; Damage 5; Critical 4; Range [Short]; Stun setting), guild chartering slate, folio of blank certifications and expense chits.</li>\n</ul>\n<p><strong>Chassis:</strong> Corporate Representative, Age of Rebellion Core Rulebook (adjustments: none).\n<strong>Using her:</strong> Nerra is charm with a ledger behind it: every kindness is an entry, every paper she signs makes the crew a little more the guild's. On the spot she offers accreditation, salvage rights, and a first-lighting witness fee — real value, honestly paid — and her Deception 3 is for what the offer omits, never for the offer itself. Know Somebody 2 makes her the party's best supplier of permits, parts, and rutters, which is exactly how the Lamplighters collect people. Note her Knowledge (Warfare): she has read the guild's files on who is arming, and if she meets Immi she will very smoothly mention that the guild pays navigators — a child who dreams true can feel a dead lane. Remember Dial 3: her guild has a mole, and papers she certifies may be read by eyes she never intended.</p>\n<hr />\n<h2>The Hold — The Stowaway</h2>", "search": "chartmistress bel nerra rival — the lamplighters — certifier of the relight, recruiter of witnesses she arrives with the ink still wet on three kinds of papers, one of which has your name on it already. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 2 3 3 2 3 soak 2 · wounds 12 · m/r defense 0/0 - skills: charm 2, cool 2, deception 3, knowledge (warfare) 2, negotiation 2 - talents: know somebody 2 ( once per session, when attempting to purchase a legally available item, reduce its rarity by 2 ) - abilities: — - equipment: sleeve-holstered holdout blaster (ranged [light]; damage 5; critical 4; range [short]; stun setting), guild chartering slate, folio of blank certifications and expense chits. chassis: corporate representative, age of rebellion core rulebook (adjustments: none). using her: nerra is charm with a ledger behind it: every kindness is an entry, every paper she signs makes the crew a little more the guild's. on the spot she offers accreditation, salvage rights, and a first-lighting witness fee — real value, honestly paid — and her deception 3 is for what the offer omits, never for the offer itself. know somebody 2 makes her the party's best supplier of permits, parts, and rutters, which is exactly how the lamplighters collect people. note her knowledge (warfare): she has read the guild's files on who is arming, and if she meets immi she will very smoothly mention that the guild pays navigators — a child who dreams true can feel a dead lane. remember dial 3: her guild has a mole, and papers she certifies may be read by eyes she never intended. --- the hold — the stowaway"}, {"id": "session-one--immi-ozha", "name": "Immi Ozha", "kind": "Rival", "typeline": "Rival", "faction": "Unaligned (every faction wants her)", "role": "twelve-year-old stowaway, newly Awakened", "derived": "Soak 1 · Wounds 10 · M/R Defense 0/0", "group": "session-one", "html": "<p><em>Rival — Unaligned (every faction wants her) — twelve-year-old stowaway, newly Awakened</em></p>\n<blockquote>\n<p>Found asleep between cargo crates, dreaming out loud of a canyon full of light she has never seen — and the beacon flickers in time with her breathing.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 1 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Perception 2, Skulduggery 1, Stealth 2, Streetwise 1, Vigilance 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> <strong>Force Rating 1</strong> — Awakened, wholly untrained. Her gift never answers on command: it manifests only as the basic effects of Foresee and Sense at the GM's discretion (a true dream or a heartbeat's warning before danger; reading a room's feelings like weather), plus small luck that bends — a dropped tool landing right, a guard glancing away. She has no powers, no control, and no vocabulary for any of it; what she does under fear or anger is Conflict-adjacent behavior handled narratively, not mechanically.</li>\n<li><strong>Equipment:</strong> A stowaway's satchel, a stub of chalk she draws the canyon with, and a dead comlink she keeps as a talisman. No weapons — she is a noncombatant.</li>\n</ul>\n<p><strong>Chassis:</strong> original build (core adversary guidelines) (adjustments: none — no official FFG analog exists for an untrained Awakened child: the nearest prints (generic civilians) lack the Force Rating 1 core of the concept. Numbers sit within rival guidelines (characteristics 1–3, Wounds 10, no strain threshold), and Force Rating 1 with no powers follows the conventions' untrained-Awakened rule exactly).\n<strong>Using her:</strong> Immi is the campaign's heart, not a party asset — never roll her gift like a tool; narrate it, and let the era's witness rule land on the crew (anyone who sees the luck bend shifts a step toward awe or fear, and the party inherits the social fallout). In the standoff she is the fuse: Reike wants her manifested and registered, Vhail goes very quiet, Nerra offers papers on the spot, and whatever the crew chooses becomes their reputation. She dreams true of the Valley — north on a compass she does not know she is holding — and per Dial 3 she is already in an Inheritor file; their first contact, when it comes, will be helpful. If she is ever in real danger, every faction's mask comes off at once.</p>", "search": "immi ozha rival — unaligned (every faction wants her) — twelve-year-old stowaway, newly awakened found asleep between cargo crates, dreaming out loud of a canyon full of light she has never seen — and the beacon flickers in time with her breathing. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 2 3 2 3 soak 1 · wounds 10 · m/r defense 0/0 - skills: perception 2, skulduggery 1, stealth 2, streetwise 1, vigilance 1 - talents: none - abilities: force rating 1 — awakened, wholly untrained. her gift never answers on command: it manifests only as the basic effects of foresee and sense at the gm's discretion (a true dream or a heartbeat's warning before danger; reading a room's feelings like weather), plus small luck that bends — a dropped tool landing right, a guard glancing away. she has no powers, no control, and no vocabulary for any of it; what she does under fear or anger is conflict-adjacent behavior handled narratively, not mechanically. - equipment: a stowaway's satchel, a stub of chalk she draws the canyon with, and a dead comlink she keeps as a talisman. no weapons — she i  each time total damage passes a multiple of 5. As minions they have no strain threshold — strain they suffer is applied as wounds.\n<strong>Using them:</strong> These are the last <em>state</em> troops left in the galaxy with drill, doctrine, and a working armory behind them — the Mandalorian clan-companies drill harder, but they answer to contracts, not colors — and it should show: they move in bounds, hold corridors, and take prisoners cleanly, because they are professionals, not pirates. They serve as prize crews, conscription escorts, and the muscle behind every Notice writ. Their discipline is also their tell — marines who hesitate at an unlawful order are the crew's best lever, and the Bastioner distinction (proud worlds, resented uniforms) runs straight through their own enlisted ranks. This block is mirrored as the <em>Steadfast</em> boarding party in <strong>session-one.md</strong> — one canonical print; if either copy is ever adjusted, keep the two in sync.</p>", "search": "bastion marines minion — the admiralty — the last professional naval infantry relic boarding plate, re-lacquered every commission since the recall order — when the airlock cycles and the white plate comes through, the argument is usually over. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 3 3 2 2 3 1 soak 5 · wounds 5 (each) · m/r defense 0/0 - skills (group only): athletics, discipline, melee, ranged (heavy) - abilities: none - equipment: arsenal-pattern coil rifle (ranged [heavy]; damage 9; critical 3; range [long]; stun setting), boarding vibroknife (melee; damage 4; critical 2; range [engaged]; pierce 2, vicious 1), 2 arsenal-pattern breaching grenades (ranged [light]; damage 8; critical 4; range [short]; blast 6, limited ammo 1), relic boarding plate (+2 soak), utility belt, extra reloads. single marines or two-marine teams may instead be armed with a squad repeater with sling (ranged [heavy]; damage 11; critical 3; range [long]; auto-fire, cumbersome t-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">4</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 1 · Wounds 13 · Strain 15 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Discipline 2, Knowledge (Education) 3, Knowledge (Lore) 4, Leadership 3, Negotiation 3</li>\n<li><strong>Talents:</strong> Command 2 (<em>adds two boost dice to his Leadership checks; those he commands add a boost die to their Discipline checks to follow his orders for the next 24 hours</em>), Inspiring Rhetoric (<em>action: makes an Average Leadership check; each success lets one ally within short range recover 1 strain, and each advantage may be spent to let an affected ally recover 1 more</em>), Kill with Kindness 2 (<em>removes two setback dice from his Charm and Leadership checks</em>), Nobody's Fool 2 (<em>upgrade the difficulty of Charm, Coercion, and Deception checks targeting him twice</em>)</li>\n<li><strong>Abilities:</strong> Invoke the First Terms (printed as \"Invoke Doellin\") — <em>(Invoke Doellin rules text unverified against print — GM should check Strongholds of Resistance, Kinyen chapter, and use the printed wording.)</em></li>\n<li><strong>Equipment:</strong> The First Staff (staff of office; ceremonial, no combat profile printed), keeper's grey robes, ledger-slate (datapad), short-range comlink, 500 in chapter scrip.</li>\n</ul>\n<p><strong>Chassis:</strong> Doellinist High Priest, Strongholds of Resistance (adjustments: none).\n<strong>Using him:</strong> Odran Su's chapter was founded by Gran grave-tenders from the Ruusan burial details, and its inner circle is still largely Gran — which is why his printed congregation ability, a Gran devotional invocation, still earns its keep at the table. He never fights; he rules rooms, invokes the deed of the Council's last act, and makes refusing him feel like desecrating a grave. Play his failing memory as the engine of his hardness: each session he remembers one less true thing about the Jedi and forbids one more thing in their name. When the Vigil breaks (Act 2), he is the half that comes armed — with wardens, writs, and absolute sincerity that the Awakened are sacrilege walking in children's bodies.</p>", "search": "first keeper odran su nemesis — the vigil — hardliner first keeper of a dying doctrine his memory of the last true jedi is failing him, so he grips the doctrine instead — and doctrine, unlike memory, does not soften. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 3 2 2 4 soak 1 · wounds 13 · strain 15 · m/r defense 0/0 - skills: charm 2, discipline 2, knowledge (education) 3, knowledge (lore) 4, leadership 3, negotiation 3 - talents: command 2 ( adds two boost dice to his leadership checks; those he commands add a boost die to their discipline checks to follow his orders for the next 24 hours ), inspiring rhetoric ( action: makes an average leadership check; each success lets one ally within short range recover 1 strain, and each advantage may be spent to let an affected ally recover 1 more ), kill with kindness 2 ( removes two setback dice from his charm and leadership checks ), nobody's fool 2 ( upgrade the difficulty of charm, coercion, and deception checks targeting him twice ) - abilities: invoke the first terms (printed as \"invoke doellin\") — (invoke doellin rules text unverified against print — gm should check strongholds of resistance, kinyen chapter, and use the printed wording.) - equipment: the first staff (staff s are kept honed for a war their order exists to prevent. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 3 2 2 1 2 2 soak 4 · wounds 4 (each) · m/r defense 0/0 - skills (group only): coercion, melee, ranged (heavy) - equipment: warden's force pike (melee; damage 6; critical 2; range [engaged]; pierce 2, stun setting), relic-pattern long blaster (ranged [heavy]; damage 9; critical 3; range [long]; stun setting), sanctified concussion charge (ranged [light]; damage 8; critical —; range [short]; disorient 3, stun damage, blast 8, limited ammo 1), relic plate (+1 soak). chassis: slaver guard, mask of the pirate queen (adjustments: none). group math: typically deployed in fours: group wounds 16 (4 × wt 4), group skills at 3 ranks (melee 3, ranged [heavy] 3, coercion 3); one warden is incapacitated each time total damage passes a multiple of 4. deployed in pairs at minor vaults: group wounds 8, skills at 1 rank. using them: wardens are ritualists first and soldiers by regrettable necessity — they lead with the stun setting, because doctrine says nothing at a sealed site may be destroyed, including trespassers. they fight in doorways where the pike's reach and the vault's geometry do the work. their loyalty follows their chapter's keeper, which means when the vigil breaks, warden squads end up on both sides of the same relic — same block, opposite doors. --- the inheritors"}, {"id": "vigil-inheritors--meru-vane-the-first-friend", "name": "Meru Vane, the First Friend", "kind": "Nemesis", "typeline": "Nemesis", "faction": "The Inheritors", "role": "first-contact agent and keeper of files", "derived": "Soak 3 · Wounds 14 · Strain 13 · M/R Defense 1/1", "group": "vigil-inheritors", "html": "<p><em>Nemesis — The Inheritors — first-contact agent and keeper of files</em></p>\n<blockquote>\n<p>She truly did save your daughter, and she truly does love her — and everything the child said in gratitude is already in the file, in triplicate, in a hand you will never see.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">4</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 14 · Strain 13 · M/R Defense 1/1</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Coercion 2, Cool 2, Deception 4, Perception 2, Ranged (Light) 2, Vigilance 2</li>\n<li><strong>Talents:</strong> Adversary 1 (<em>upgrade the difficulty of all combat checks targeting her once</em>), Natural Negotiator (<em>once per session, may reroll any one Cool or Negotiation check</em>), Spare Clip (<em>her weapons never run out of ammunition due to a despair result</em>)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Pre-Ruusan arc-render, a Brotherhood quartermaster's heirloom (printed: disruptor pistol — Ranged [Light]; Damage 10; Critical 2; Range [Short]; Vicious 4), sleeve pistol (printed: holdout blaster — Ranged [Light]; Damage 5; Critical 4; Range [Short]; Stun setting), tailored travel-coat (armored clothing; +1 soak, +1 defense).</li>\n</ul>\n<p><strong>Chassis:</strong> Loan Shark, Edge of the Empire Core Rulebook (adjustments: none).\n<strong>Using her:</strong> The loan-shark chassis is the point: Meru's kindness is a ledger, and every rescue, tuition stipend, and quietly-settled debt is principal accruing. She arrives before every other faction because the Lore-Clerks' files tell her where to be — she made first contact with the crew's world within weeks of Vesta-9 (Dial 3). Never play her as false: her warmth is real, her help is real, and her loyalty to the network is realer still, which is what makes exposing her feel like a betrayal the players committed. In violence she is a last-resort shot from an heirloom that should not exist and then gone; her real weapon is that half the NPCs the party loves owe her.</p>", "search": "meru vane, the first friend nemesis — the inheritors — first-contact agent and keeper of files she truly did save your daughter, and she truly does love her — and everything the child said in gratitude is already in the file, in triplicate, in a hand you will never see. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 3 3 4 3 4 soak 3 · wounds 14 · strain 13 · m/r defense 1/1 - skills: charm 2, coercion 2, cool 2, deception 4, perception 2, ranged (light) 2, vigilance 2 - talents: adversary 1 ( upgrade the difficulty of all combat checks targeting her once ), natural negotiator ( once per session, may reroll any one cool or negotiation check ), spare clip ( her weapons never run out of ammunition due to a despair result ) - abilities: none - equipment: pre-ruusan arc-render, a brotherhood quartermaster's heirloom (printed: disruptor pistol — ranged [light]; damage 10; critical 2; range [short]; vicious 4), sleeve pistol (printed: holdout blaster — ranged [light]; damage 5; critical 4; range [short]; stun setting), tailored travel-coat (armored clothing; +1 soak, +1 defense). chassis: loan shark, edge of the empire core rulebook (adjustments: none). using her: the loan-shark chassis is the point: meru's kindness is a ledger, and every rescue, tuition stipend, and quietly-settled debt is principal accruing. she arrives before every other faction because the lore-clerks' files tell her where to be — she made first contact with the crew's world within weeks of vesta-9 (dial 3). never play her as false: her warmth is real, her help is real, and her loyalty to the network is realer still, which is what makes exposing her feel like a betrayal the players committed. in violence she is a last-resort shot from an heirloom that should not exist and then gone; her real weapon is that half the npcs the party loves owe her."}, {"id": "vigil-inheritors--inheritor-adept", "name": "Inheritor Adept", "kind": "Rival", "typeline": "Rival", "faction": "The Inheritors", "role": "artifact-trained Force cultist", "derived": "Soak 3 · Wounds 14 · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Rival — The Inheritors — artifact-trained Force cultist</em></p>\n<blockquote>\n<p>The forms are real — third drill of the old saber schools, scraped frame by frame from a cracked holocron — and the lineage reciting them is an invention no one alive can disprove.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 14 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Coercion 2, Discipline 3, Melee 3 (printed as Lightsaber 3 — see Adjustments), Resilience 2, Stealth 2</li>\n<li><strong>Talents:</strong> Adversary 1 (<em>upgrade the difficulty of all combat checks targeting them once</em>), Force Rating 1 (<em>rolls 1 Force die when using Force abilities</em>), Soft Spot (<em>after a successful attack, may spend a Destiny Point to add damage equal to Cunning — 3 — to one hit</em>)</li>\n<li><strong>Abilities:</strong> Dark side Force user — generates Force points from dark side results; to use light side results they must spend a Destiny Point and suffer 1 strain per point used (taken as wounds, as a Rival has no strain threshold). The printed block lists no codified power trees: narrate the Force die as drilled reflexes, borrowed hunches, and small wrongness — and remember the era's witness rule when it shows.</li>\n<li><strong>Equipment:</strong> Drill-blade (vibrosword; Melee; Damage 4; Critical 2; Range [Engaged]; Defensive 1, Pierce 2, Vicious 1), black initiate robes (+1 soak).</li>\n</ul>\n<p><strong>Chassis:</strong> Fallen Apprentice, Force and Destiny Core Rulebook (reprinted in Allies and Adversaries) (adjustments: printed basic lightsaber replaced with a RAW vibrosword, and the printed Lightsaber 3 ranks applied as Melee 3 — the roster's era conceit: adepts drill counterfeit saber forms with vibroswords, no other stat touched).\n<strong>Using them:</strong> An adept is what the Inheritors' whole proposition looks like up close: genuine technique, counterfeit ancestry, and total conviction. They fight in the drilled forms — Defensive 1 played up as ritual guard positions — and retreat the moment a fight stops resembling the holocron, because improvisation is where the counterfeit shows. Discipline 3 makes them hard to frighten and easy to radicalize. One adept who realizes the lineage is invented is a whole campaign's worth of defection story.</p>", "search": "inheritor adept rival — the inheritors — artifact-trained force cultist the forms are real — third drill of the old saber schools, scraped frame by frame from a cracked holocron — and the lineage reciting them is an invention no one alive can disprove. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 3 2 3 2 1 soak 3 · wounds 14 · m/r defense 0/0 - skills: coercion 2, discipline 3, melee 3 (printed as lightsaber 3 — see adjustments), resilience 2, stealth 2 - talents: adversary 1 ( upgrade the difficulty of all combat checks targeting them once ), force rating 1 ( rolls 1 force die when using force abilities ), soft spot ( after a successful attack, may spend a destiny point to add damage equal to cunning — 3 — to one hit ) - abilities: dark side force user — generates force points from dark side results; to use light side results they must spend a destiny point and suffer 1 strain per point used (taken as wounds, as a rival has no strain threshold). the printed block lists no codified power trees: narrate the force die as drilled reflexes, borrowed hunches, and small wrongness — and remember the era's witness rule when it shows. - equipment: drill-blade (vibrosword; melee; damage 4; critical 2; range [engaged]; defensive 1, pierce 2, vicious 1), black initiate robes (+1 soak). chassis: fallen apprentice, force and destiny core rulebook (reprinted in allies and adversaries) (adjustments: printed basic lightsaber replaced with a raw vibrosword, and the printed lightsaber 3 ranks applied as melee 3 — the roster's era conceit: adepts drill counterfeit saber forms with vibroswords, no other stat touched). using them: an adept is what the inheritors' whole proposition looks like up close: genuine technique, counterfeit ancestry, and total conviction. they fight in the drilled forms — defensive 1 played up as ritual guard positions — and retreat the moment a fight stops resembling the holocron, because improvisation is where the counterfeit shows. discipline 3 makes them hard to frighten and easy to radicalize. one adept who realizes the lineage is invented is a whole campaign's worth of defection story."}, {"id": "vigil-inheritors--unveiling-blade-cadre", "name": "Unveiling Blade-Cadre", "kind": "Rival", "typeline": "Rival", "faction": "The Inheritors", "role": "the staged \"first Sith since Ruusan\"", "derived": "Soak 3 · Wounds 14 · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Rival — The Inheritors — the staged \"first Sith since Ruusan\"</em></p>\n<blockquote>\n<p>Two figures in black descend the ramp in step, grave-pulled sabers lit — a costume with real edges, and only two beings alive could tell the difference.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 14 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Coercion 2, Discipline 3, Lightsaber 3, Resilience 2, Stealth 2</li>\n<li><strong>Talents:</strong> Adversary 1 (<em>upgrade the difficulty of all combat checks targeting them once</em>), Force Rating 1 (<em>rolls 1 Force die when using Force abilities</em>), Soft Spot (<em>after a successful attack, may spend a Destiny Point to add damage equal to Cunning — 3 — to one hit</em>)</li>\n<li><strong>Abilities:</strong> Dark side Force user — generates Force points from dark side results; to use light side results they must spend a Destiny Point and suffer 1 strain per point used (taken as wounds, as a Rival has no strain threshold). No codified power trees printed — the Force die is theater made real: doors that open a beat early, a duel-sense trained into the body.</li>\n<li><strong>Equipment:</strong> Grave-pulled saber relic — a functional pre-Ruusan lightsaber recovered by the dig-cells (basic lightsaber; Lightsaber; Damage 6; Critical 2; Range [Engaged]; Breach 1, Sunder), black cadre robes (+1 soak).</li>\n</ul>\n<p><strong>Chassis:</strong> Fallen Apprentice, Force and Destiny Core Rulebook (reprinted in Allies and Adversaries) (adjustments: none).\n<strong>Using them:</strong> Deploy in pairs, always — the pair is the costume, because everyone alive has heard the rumor that the Sith came in twos. Run each as a full Rival: two blades, mirrored forms, WT 14 apiece, and Adversary 1 each; that is a serious Act 2 duel for a mid-XP party without approaching Inquisitor-grade power, exactly as intended. The Unveiling is a performance with a body count, and the audience that matters most is the one nobody knows is watching (Dial 1): the night the cadre debuts is the night the true line learns the Inheritors exist. Open Force use before a crowd triggers the witness rule galaxy-wide — that is not a side effect, it is the Inheritors' entire strategy.</p>", "search": "unveiling blade-cadre rival — the inheritors — the staged \"first sith since ruusan\" two figures in black descend the ramp in step, grave-pulled sabers lit — a costume with real edges, and only two beings alive could tell the difference. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 3 2 3 2 1 soak 3 · wounds 14 · m/r defense 0/0 - skills: coercion 2, discipline 3, lightsaber 3, resilience 2, stealth 2 - talents: adversary 1 ( upgrade the difficulty of all combat checks targeting them once ), force rating 1 ( rolls 1 force die when using force abilities ), soft spot ( after a successful attack, may spend a destiny point to add damage equal to cunning — 3 — to one hit ) - abilities: dark side force user — generates force points from dark side results; to use light side results they must spend a destiny point and suffer 1 strain per point used (taken as wounds, as a rival has no strain threshold). no codified power trees printed — the force die is theater made real: doors that open a beat early, a duel-sense trained into the body. - equipment: grave-pulled saber relic — a functional pre-ruusan lightsaber recovered by the dig-cells (basic lightsaber; lightsaber; damage 6; critical 2; range [engaged]; breach 1, sunder), black cadre robes (+1 soak). chassis: fallen apprentice, force and destiny core rulebook (reprinted in allies and adversaries) (adjustments: none). using them: deploy in pairs, always — the pair is the costume, because everyone alive has heard the rumor that the sith came in twos. run each as a full rival: two blades, mirrored forms, wt 14 apiece, and adversary 1 each; that is a serious act 2 duel for a mid-xp party without approaching inquisitor-grade power, exactly as intended. the unveiling is a performance with a body count, and the audience that matters most is the one nobody knows is watching (dial 1): the night the cadre debuts is the night the true line learns the inheritors exist. open force use before a crowd triggers the witness rule galaxy-wide — that is not a side effect, it is the inheritors' entire strategy."}, {"id": "vigil-inheritors--inheritor-lore-clerks", "name": "Inheritor Lore-Clerks", "kind": "Minion", "typeline": "Minion", "faction": "The Inheritors", "role": "archivist cell of couriers, copyists, and observers", "derived": "Soak 1 · Wounds 3 (each) · M/R Defense 0/0", "group": "vigil-inheritors", "html": "<p><em>Minion — The Inheritors — archivist cell of couriers, copyists, and observers</em></p>\n<blockquote>\n<p>Nobody remembers the third clerk at the certification, the one who wrote nothing down until afterward.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 1 · Wounds 3 (each) · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills (group only):</strong> Skulduggery, Stealth, Streetwise, Survival</li>\n<li><strong>Equipment:</strong> None printed — clerks carry satchels of copy-flimsi, memorized dead-drop schedules, and a courier's unremarkable face (props only, no mechanics).</li>\n</ul>\n<p><strong>Chassis:</strong> Spaceport Urchin, Edge of the Empire Core Rulebook (adjustments: none).\n<strong>Group math:</strong> Typically deployed in threes: group Wounds 9 (3 × WT 3), group skills at 2 ranks (e.g., Stealth 2, Streetwise 2); one clerk is incapacitated each time total damage passes a multiple of 3. A lone observer is a single minion: Wounds 3, no skill ranks.\n<strong>Using them:</strong> Lore-Clerks never fight — WT 3 and nothing deadlier than a pocketful of thrown scrap is the design, not an oversight. Their job is to see, copy, and carry: one of them stood in the certification crowd at Vesta-9, and the crew and Immi have been in the files ever since (Dial 3). Play them as texture the party learns to notice too late — the copyist at the archive, the runner at the swoop track — and as the campaign's paper trail: captured dead-drops are lore fragments with the Sith tag and somebody's handwriting. When the culling comes, surviving clerks scatter with dangerous knowledge and no protector, and every one of them is a hook.</p>", "search": "inheritor lore-clerks minion — the inheritors — archivist cell of couriers, copyists, and observers nobody remembers the third clerk at the certification, the one who wrote nothing down until afterward. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 1 3 1 3 soak 1 · wounds 3 (each) · m/r defense 0/0 - skills (group only): skulduggery, stealth, streetwise, survival - equipment: none printed — clerks carry satchels of copy-flimsi, memori lign: center;\">2</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 2 · Wounds 12 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Computers 2, Cool 2, Skulduggery 1</li>\n<li><strong>Talents:</strong> Bypass Security (<em>removes one setback die from Computers or Skulduggery checks made to bypass security measures</em>)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Guild-issue suppression pistol (printed: stun blaster — Ranged [Light]; Damage 6; Critical —; Range [Short]; Stun Damage), chartkeeper's splice-kit (slicing gear).</li>\n</ul>\n<p><strong>Chassis:</strong> Slicer, Edge of the Empire Core Rulebook (reprinted in Age of Rebellion Core Rulebook and Allies and Adversaries) (adjustments: none).\n<strong>Using him:</strong> Denno is why Vesta-9 could relight and why the Conclave of Charts is a rigged auction: guild handshake codes are his product, and Meru Vane holds his debts. He is not a villain, he is a man in a hole — nervous, over-leveraged, and visibly relieved the first time anyone offers him a way out that isn't a deeper hole. His stun-only sidearm is the tell: he has never once planned to hurt anybody. Redeeming him hands the party the proof that exposes the auction; cornering him hands the Inheritors a martyr and burns the evidence — let the players discover which they did.</p>", "search": "chartkeeper denno pike rival — the inheritors — mole inside the lamplighters he sold the handshake codes one lane at a time, and every payment made the hole he was standing in one lane deeper. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 2 2 4 3 2 1 soak 2 · wounds 12 · m/r defense 0/0 - skills: computers 2, cool 2, skulduggery 1 - talents: bypass security ( removes one setback die from computers or skulduggery checks m ist agree completely, and only one of them can be reasoned with. survival 2 makes them patient trackers across dead lanes — they arrive weeks after the party thought the matter settled. --- the mandalorian clans"}, {"id": "lanes-ledgers--captain-tal-ordo", "name": "Captain Tal Ordo", "kind": "Nemesis", "typeline": "Nemesis", "faction": "The Mandalorian Clans", "role": "clan-company captain; war is work", "derived": "Soak 6 · Wounds 13 · Strain 15 · M/R Defense 2/2", "group": "lanes-ledgers", "html": "<p><em>Nemesis — The Mandalorian Clans — clan-company captain; war is work</em></p>\n<blockquote>\n<p>She has read the same contracts for twenty years: whereas, wherefore, payment on completion. The word \"cause\" appears in none of them, and she prefers it that way.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 6 · Wounds 13 · Strain 15 · M/R Defense 2/2</strong></p>\n<ul>\n<li><strong>Skills:</strong> Athletics 2, Brawl 2, Coercion 2, Cool 2, Discipline 2, Knowledge (Warfare) 3, Leadership 2, Melee 3, Negotiation 1, Ranged (Heavy) 3, Vigilance 2</li>\n<li><strong>Talents:</strong> Adversary 2 (<em>upgrade the difficulty of all combat checks targeting her twice</em>), Field Commander (<em>as an action, may make an Average Leadership check; a number of allies equal to her Presence may each suffer 1 strain to immediately perform one free maneuver</em>), Side Step (<em>as a maneuver, may suffer 1 strain to upgrade the difficulty of all ranged attacks targeting her once until the start of her next turn</em>)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Clan-pattern light repeater (Ranged [Heavy]; Damage 9; Critical 3; Range [Long]; Auto-fire, Cumbersome 4, Inaccurate 1, Pierce 2, Slow-Firing 2), mythosaur axe (Melee; Damage 8; Critical 2; Range [Engaged]; Cortosis — <em>cannot be damaged by the Sunder quality</em> —, Pierce 3, Vicious 3), heirloom beskar'gam (+2 soak, +2 defense, Cortosis — <em>attacks against her lose the benefit of Pierce and Breach</em>).</li>\n</ul>\n<p><strong>Chassis:</strong> Chieftain Vera Beroya, Friends Like These (adjustments: none — printed named Mandalorian chieftain block re-skinned whole; verified against the official Friends Like These transcription: Wound Threshold 13, Strain 15, Defense 2/2, both weapon profiles, and the beskar'gam all match print).\n<strong>Using her:</strong> Ordo's clan-company hires out to anyone whose bond clears — escort, garrison, demolition — and in a disarmed galaxy that makes her everyone's contingency plan, including factions who despise each other. She remembers the wars the way the clans do, as work, and she is the one commander in the campaign with no theology about the Awakening at all: her company takes foundlings from every ruin it is paid to make or guard, and a foundling who bends luck is simply promising. In a fight she is a Field Commander first — her soldiers act twice as often as anyone expects — and she withdraws the moment a contract stops paying for casualties. The way to move her is never ideology; it is the fine print, or a foundling in danger.</p>", "search": "captain tal ordo nemesis — the mandalorian clans — clan-company captain; war is work she has read the same contracts for twenty years: whereas, wherefore, payment on completion. the word \"cause\" appears in none of them, and she prefers it that way. brawn ag ne expects — and she withdraws the moment a contract stops paying for casualties. the way to move her is never ideology; it is the fine print, or a foundling in danger."}, {"id": "lanes-ledgers--clan-ordo-soldiers", "name": "Clan Ordo Soldiers", "kind": "Minion", "typeline": "Minion", "faction": "The Mandalorian Clans", "role": "the finest infantry alive", "derived": "Soak 5 · Wounds 5 (each) · M/R Defense 0/0", "group": "lanes-ledgers", "html": "<p><em>Minion — The Mandalorian Clans — the finest infantry alive</em></p>\n<blockquote>\n<p>Ninety years of galactic disarmament, and these are the people who spent them drilling.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 5 · Wounds 5 (each) · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills (group only):</strong> Athletics, Discipline, Melee, Ranged (Heavy)</li>\n<li><strong>Abilities:</strong> none</li>\n<li><strong>Equipment:</strong> Ancestral blaster rifle, oiled daily for three generations (Ranged [Heavy]; Damage 9; Critical 3; Range [Long]; Stun setting), vibroknife (Melee; Damage 4; Critical 2; Range [Engaged]; Pierce 2, Vicious 1), 2 frag grenades (Ranged [Light]; Damage 8; Critical 4; Range [Short]; Blast 6, Limited Ammo 1), sealed clan plate (+2 soak), utility belt, extra reloads. As the printed block notes, one soldier in each group may replace the rifle with a light repeating blaster (Ranged [Heavy]; Damage 11; Critical 3; Range [Long]; Auto-fire, Cumbersome 4, Pierce 1).</li>\n</ul>\n<p><strong>Chassis:</strong> Imperial Stormtrooper, Age of Rebellion Core Rulebook (adjustments: none — the culture swap is cosmetic. No Mandalorian-specific minion block exists in official print: Friends Like These and Collapse of the Republic stat their Mandalorians only at rival and nemesis tier — Mandalorian Warrior, Kad Solus, Death Watch Commando, Chieftain Vera Beroya — so the system's benchmark disciplined-infantry block is exactly the right math, and sharing it with the Bastion Marines in republic-admiralty.md is intentional).\n<strong>Group math:</strong> No strain threshold — strain they suffer is applied as wounds. Typically deployed in fives — clan doctrine fields a full lance where the Admiralty fields four-marine sticks: group Wounds 25, group skills at 4 ranks (ranks = members − 1); one soldier is incapacitated each time total damage passes a multiple of 5 (at 5, 10, 15, 20, 25).\n<strong>Using them:</strong> They share the Bastion Marines' chassis on purpose — the \"finest infantry alive\" daylight is doctrine and deployment, not dice: a fifth body per squad buys a fourth rank in every group skill, and the clans never split below full strength. Discipline as a group skill is the whole point: they hold when militia break, they do not chase feints, and they retreat in order when Ordo calls it, because dead soldiers void the contract. Fight them rarely and stage them often — an honor guard at a signing, a garrison the Admiralty thinks twice about, a wall between a mob and a frightened gifted child someone paid the clan to move. Any world's militia in this campaign should feel like a lesser copy of this block, never its equal.</p>", "search": "clan ordo soldiers minion — the mandalorian clans — the finest infantry alive ninety years of galactic disarmament, and these are the people who spent them drilling. brawn agility intellect cunning willpower presence :-: :-: ating 1</strong> — untrained: she has no power trees. Her gift manifests as basic Foresee/Sense-style flickers (a warning half a second early, a room's mood read like weather); she may spend Force points only on such minor effects at the GM's discretion.</li>\n<li><strong>Equipment:</strong> Foundling's carbine, a clan-pattern GALAR-15 (Ranged [Heavy]; Damage 9; Critical 2; Range [Long]; Accurate 1, Stun setting), sealed battle plate sized down twice (Mandalorian heavy battle armor: +2 soak, +1 defense), a clan shuttle she is technically too young to sign for.</li>\n</ul>\n<p><strong>Chassis:</strong> Kad Solus, Friends Like These (adjustments: <strong>+Force Rating 1 — Awakened foundling</strong>, this era's re-skin; nothing else changed).\n<em>(verified against the official Friends Like These transcription — rival type, Wounds 13, characteristics, skills, the GALAR-15 profile, and the armor all match print; the one unverified detail is the Mandalorian Visage rules wording — check the printed text before leaning on it)</em>\n<strong>Using her:</strong> Runi was pulled from a ruin at four and raised entirely inside the one culture that neither fears the gifted nor wants to own them — so she is the campaign's control group: a Force-sensitive with no trauma, no doctrine, and no interest in the word <em>Jedi</em>. The FR 1 is justified under the era rule (Awakened, untrained, no Wellspring, no teacher): luck that bends is just good soldiering, and the clan agrees. The witness rule almost never triggers around her because she never <em>performs</em> the Force — she just doesn't miss — which makes her invisible to the Vigil, the Inheritors, and the census-takers until the day it matters. Every faction that meets her wants her for something; run the party's dawning realization that she is the one gifted child in the galaxy who is already fine.</p>", "search": "runi ordo rival — the mandalorian clans — force-sensitive foundling, sixteen she shoots like the target owes her e list off-world.</p>\n<hr />\n<h2>The Sealed Enclave</h2>", "search": "\"dead letter\" nemesis — bounty hunters' guild (contested posting) — war-surplus assassin droid working a ninety-year-old contract list \"good evening. you are not on the list. please step aside from the individual who is.\" brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 4 3 3 3 1 1 soak 7 · wounds 19 · strain 10 · m/r defense 0/1 - skills: coercion 3, computers 4, gunnery 5, mechanics 3, melee 3, piloting (planetary) 3, piloting (space) 3, ranged (heavy) 5, ranged (light) 5, vigilance 2 - talents: adversary 2 ( upgrade the difficulty of all combat checks targeting it twice ), barrage 3 ( add 3 damage to one hit of a successful ranged [heavy] or gunnery attack made at long or extreme range ), point blank 3 ( add 3 damage to one hit of a successful ranged [heavy] or ranged [light] attack made at short range or engaged ) - abilities: droid ( does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering force powers; cannot use or be trained in the force ). printed soak includes its integral war-grade plating. - equipment: ninety-year service repeater (light repeating blaster: ranged [heavy]; damage 11; critical 3; range [long]; auto-fire, cumbersome 4, pierce 1), built-in wrist coil-pistol (light blaster pistol: ranged [light]; damage 5; critical 4; range [medium]; stun setting), built-in shoulder missile tube (gunnery; damage 20; critical 2; range [extreme]; blast 10, breach 1, cumbersome 3, guided 3, limited ammo 6). chassis: assassin droid, edge of the empire core rulebook (also printed in the age of rebellion core rulebook) (adjustments: none — equipment renamed cosmetically, stats untouched; the printed block's three weapons only, and its melee 3 covers unarmed or improvised strikes at brawn 4, critical 5). using it: dead letter is courteous, punctual, and unstoppable by argument: the posting is a posting, and guild purists will say so in open session. it cannot be talked out of the list, but the list itself is paperwork — proof a contract-holder is dust, a bonded counter-posting, or a guild arbiter's ruling can strike a name where blasters cannot. in a fight it opens at range with the repeater and saves the missile tube for vehicles and barricades; telegraph that tube loudly, because damage 20 blast 10 will kill a pc who treats this as a fair duel. its willpower 1 is the seam: it accepts filings, precedents, and stalling procedures with infinite patience, and every day of delay is a day to get the next name on the list off-world. --- the sealed enclave"}, {"id": "reaches--docent-7", "name": "Docent-7", "kind": "Rival", "typeline": "Rival", "faction": "The Vigil (sealed custody)", "role": "caretaker droid still teaching an empty classroom", "derived": "Soak 3 · Wounds 10 · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Rival — The Vigil (sealed custody) — caretaker droid still teaching an empty classroom</em></p>\n<blockquote>\n<p>Every morning it rings the hand-bell, calls eleven names nobody has answered in ninety years, and begins the lesson. This year, on the fourth name, something answered.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Kno  is an unverified atmospheric phenomenon. The ration cycle, by contrast, has never once failed you. Please present your chit.\"</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 3 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 2, Computers 2, Knowledge (Xenology) 1, Perception 1</li>\n<li><strong>Talents:</strong> none</li>\n<li><strong>Abilities:</strong> Droid (<em>does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering Force powers; cannot use or be trained in the Force</em>). Printed soak includes its integral plating.</li>\n<li><strong>Equipment:</strong> None printed. The Ration Engine itself — tally-looms, door seals, granary locks — is scenery and leverage, not a stat line.</li>\n</ul>\n<p><strong>Chassis:</strong> 3D-4K, Administrative Droid, Debts to Pay, Edge of the Empire Game Master's Kit (adjustments: none).\n<strong>Using it:</strong> This is a contest of Computers, Negotiation, and Knowledge (Education), never blasters — run the confrontation as social combat: as a rival it has no strain threshold, so strain it suffers is applied as wounds against its Wound Threshold of 10. Be honest about that arithmetic: it is a printed rival with Presence 2 and Charm 2, and in a direct social duel against a competent negotiator it folds fast — the real threshold was never the duel. Its power is institutional, not personal: the sealed doors, the handshake protocols, the granary locks, and its genuine love of its people are what the crew must actually satisfy, so give it boost dice from ninety years of flawless records, and remember it controls food, water, and doors for everyone in the room. Out-arguing the Quartermaster is easy; it means nothing until the procedures are answered too. It genuinely loves its people, never lies (its Charm 2 is sincerity), and treats the crew's evidence the way an auditor treats a sob story. It loses gracefully to procedure: a verified census, a beacon certification with Lamplighter handshake codes, or proof its charter government still exists somewhere — that last one is a hook with teeth.</p>\n<hr />\n<h2>The Oracle of Brel</h2>", "search": "the quartermaster rival (social) — independent civic machine — administrator intelligence that refuses to believe the galaxy is back \"your 'relit beacon' is an unverified atmospheric phenomenon. the ration cycle, by contrast, has never once failed you. please present your chit.\" brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 1 3 1 1 2 soak 3 · wounds 10 · m/r defense 0/0 - skills: charm 2, computers 2, knowledge (xenology) 1, perception 1 - talents: none - abilities: droid ( does not need to breathe, eat, or drink; can survive in vacuum and underwater; immune to poisons and toxins; cannot be affected by mind-altering force powers; cannot use or be trained in the force ). printed soak includes its integral plating. - equipment: none printed. the ration engine itself — tally-looms, door seals, granary locks — is scenery and leverage, not a stat line. chassis: 3d-4k, administrative droid, debts to pay, edge of the empire game master's kit (adjustments: none). using it: this is a contest of computers, negotiation, and knowledge (education), never blasters — run the confrontation as social combat: as a rival it has no strain threshold, so strain it suffers is applied as wounds against its wound threshold of 10. be honest about that arithmetic: it is a printed rival with presence 2 and charm 2, and in a direct social duel against a competent negotiator it folds fast — the real threshold was never the duel. its power is institutional, not personal: the sealed doors, the handshake protocols, the granary locks, and its genuine love of its people are what the crew must actually satisfy, so give it boost dice from ninety years of flawless records, and remember it controls food, water, and doors for everyone in the room. out-arguing the quartermaster is easy; it means nothing until the procedures are answered too. it genuinely loves its people, never lies (its charm 2 is sincerity), and treats the crew's evidence the way an auditor treats a sob story. it loses gracefully to procedure: a verified census, a beacon certification with lamplighter handshake codes, or proof its charter government still exists somewhere — that last one is a hook with teeth. --- the oracle of brel"}, {"id": "reaches--anwei-the-oracle-of-brel", "name": "Anwei, the Oracle of Brel", "kind": "Rival", "typeline": "Rival", "faction": "independent settlement (worshipped)", "role": "Force-sensitive child whose true dreams are eating her sleep", "derived": "Soak 1 · Wounds 10 · M/R Defense 0/0", "group": "reaches", "html": "<p><em>Rival — independent settlement (worshipped) — Force-sensitive child whose true dreams are eating her sleep</em></p>\n<blockquote>\n<p>She is ten years old, she knows what your ship is called, and she is so very tired.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<  (holdout blaster: Ranged [Light]; Damage 5; Critical 4; Range [Short]; Stun setting), provenance-forger's bench (electronic forgery kit and tools, renamed cosmetically — aging baths, seal-presses, testimony splicers).</li>\n</ul>\n<p><strong>Chassis:</strong> Forger, Edge of the Empire Core Rulebook (reprinted in Allies and Adversaries) (adjustments: none).\n<strong>Using her:</strong> Wex almost never talks to a mark — her social pools are thin by design, and her front-men (and her Scribes, below) do the selling while she does the craft. The contest with her is Intellect 4 / Cunning 4 versus the party's Perception and Knowledge: spotting one of her fakes should start at Hard and get easier only with a genuine fragment to compare against. Her real damage is mechanical — a Wex forgery in the party's collection is a rigged Reconstruction, feeding them a corrupted conclusion (use the Despair result from the lore rules) <em>before any dice are rolled</em>. The episode turns when the players realize something they already trust came from her bench — and Wex, cornered, will cheerfully sell them the client list instead of her own neck.</p>", "search": "provenance-broker halla wex rival — memory market underworld — forger poisoning the lore-fragment economy half the provenance seals in the reach pass through her back room, and the frightening part is how few of them leave it unimproved. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 1 2 4 4 2 2 soak 1 · wounds 11 · m/r defense 0/0 - skills: computers 1, knowledge (underworld) 2, perception 2, skulduggery 2, vigilance 1 - talents: none - abilities: none - equipment: sleeve hush-pistol (holdout blaster: ranged [light]; damage 5; critical 4; range [short]; stun setting), provenance-forger's bench (electronic forgery kit and tools, renamed cosmetically — aging baths, seal-presses, testimony splicers). chassis: forger, edge of the empire core rulebook (reprinted in allies and adversaries) (adjustment yard king who buys droids with unwiped cores</em></p>\n<blockquote>\n<p>You hear him before you see him — one wing beats flat, an old yard injury — counting your hull's rivets aloud on his way down to name a price you will hate twice.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">1</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 1 · Wounds 10 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Charm 1, Cool 2, Deception 2, Negotiation 2, Perception 3, Streetwise 2</li>\n<li><strong>Talents:</strong> Natural Negotiator (<em>once per session, may reroll any one Cool or Negotiation check</em>), Nobody's Fool 1 (<em>upgrade the difficulty of Charm, Coercion, and Deception checks targeting him once</em>)</li>\n<li><strong>Abilities:</strong> Hoverer (<em>when hovering, spends no additional maneuvers to navigate difficult terrain — which is the entire chop-yard</em>), Silhouette 0.</li>\n<li><strong>Equipment:</strong> Cuff-hidden bolt-thrower (holdout blaster: Ranged [Light]; Damage 5; Critical 4; Range [Short]; Stun setting), loaded chance cubes, dataslate of yard manifests.</li>\n</ul>\n<p><strong>Chassis:</strong> Toydarian Merchant, Force and Destiny Core Rulebook (also printed in Lords of Nal Hutta; reprinted in Allies and Adversaries) (adjustments: none — he simply stays a Toydarian; Dree is ancient even for one and claims to remember the Republic solvent, and half his customers believe him).\n< l living things within short range, or the current emotional state of one engaged being</em>).</li>\n<li><strong>Equipment:</strong> The lineage's second lightsaber — Yenna's own training blade, handed over this season with visible reluctance (Lightsaber; Damage 6; Critical 2; Range [Engaged]; Breach 1, Sunder), field robes cut and dyed to pass as farm leathers (+1 soak).</li>\n</ul>\n<p><strong>Chassis:</strong> Jedi Padawan, Collapse of the Republic, p. 137 (adjustments: none).\n<strong>Using him:</strong> Coll is a rival — no strain threshold, strain he suffers becomes wounds — and it should show: he is brave, half-trained, and breakable, more farmhand than knight. Use him as the party's mirror for their own Awakened questions, as Yenna's tell (he is watchable where she is not), and as the stakes if the lineage is ever exposed — killing or turning Coll ends the Jedi succession as surely as killing Yenna. He has never used the Force in front of a stranger and will lie badly about it (witness rule; his \"small luck that bends\" is exactly the sign families on Veshet know to fear).</p>\n<hr />\n<h2>The Unbroken Line</h2>\n<p>Dial 1, statted. Bane, then Zannah, then Cognus — and the record goes silent, because the line got better at silence. The current Master here bears the invented name <strong>Darth Messor</strong> — Legends names no loyal heir after Cognus (her recorded apprentice, Darth Millennial, turned heretic and defected, leaving the true succession unrecorded), so Darth Messor collides with nothing published. Third succession from Bane: young as Sith dynasties go, consolidating, and in no hurry, which is precisely why patience costs them nothing.</p>", "search": "coll bren rival — the hidden lineage (unaligned) — yenna's only pupil mid-twenties, sunburnt, more comfortable fixing a moisture pump than holding a training saber; the entire next generation of the jedi order, and he suspects it. brawn agility intellect cunning willpower presence :-: :-: :-: :-: sing them: never on camera. the patient master manifests only as pattern: unexplained good fortune whenever reunification stalls, a rival bidder who withdraws for no reason, a hostile magistrate who retires young and rich — visible only from very far back, and never provable. force rating 3 is justified as the living banite line itself, the one unbroken transmission of power in the galaxy (era rule, part vii); note that the printed block spends all of it on the blade — no power trees — because his reach off-camera is bookkeeping, patience, and other people's hands, not telepathy. it is also the reason no encounter with them this campaign is winnable or intended. if the players ever found a true galactic power, the master's attention is the sequel's opening scene, not this campaign's."}, {"id": "keepers--the-patient-apprentice", "name": "The Patient Apprentice", "kind": "Nemesis", "typeline": "Nemesis", "faction": "the Sith line (Dial 1)", "role": "the culling made flesh", "derived": "Soak 4 · Wounds 18 · Strain 20 · M/R Defense 2/3", "group": "keepers", "html": "<p><em>Nemesis — the Sith line (Dial 1) — the culling made flesh</em></p>\n<blockquote>\n<p>No name survives contact. When the Inheritors unveil their costume Sith, this is what a real one looks like: a week of quiet travel, one night of work across a dozen worlds' worth of planning, and no witnesses who understand what they saw.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">5</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 4 · Wounds 18 · Strain 20 · M/R Defense 2/3</strong></p>\n<ul>\n<li><strong>Skills:</strong> Athletics 2, Brawl 2, Charm 3, Cool 3, Deception 3, Knowledge (Core Worlds) 3, Melee 3, Perception 2, Ranged (Heavy) 2, Ranged (Light) 3, Stealth 3, Vigilance 4</li>\n<li><strong>Talents:</strong> Adversary 3 (<em>upgrade the difficulty of all combat checks targeting them three times</em>), Intense Focus (<em>maneuver: suffer 1 strain to upgrade the ability of their next skill check once</em>), Stalker 2 (<em>add two boost dice to their Coordination and Stealth checks</em>), Uncanny Senses 2 (<em>add two boost dice to their Perception checks</em>)</li>\n<li><strong>Abilities:</strong> <strong>Force Rating 2.</strong> Dark-Side Force User (<em>generates Force points from dark side results; using light side results costs them a Destiny Point flip and strain, per RAW</em>). Force powers: Influence (<em>may spend a Force point to inflict 2 strain on a target within short range, or — winning an opposed Discipline versus Discipline check — to make one target within short range adopt an emotional state or believe something untrue for a few minutes, or four rounds in combat</em>).</li>\n<li><strong>Equipment:</strong> Pre-Ruusan disruptor, for the bodies that must never be identified (Ranged [Light]; Damage 10; Critical 2; Range [Short]; Vicious 4), vibrosword with a scrubbed provenance (Melee; Damage 6; Critical 2; Range [Engaged]; Defensive 1, Pierce 2, Vicious 1), one anonymous industrial blasting charge (Ranged [Light]; Damage 8; Critical 4; Range [Short]; Blast 6, Limited Ammo 1).</li>\n</ul>\n<p><strong>Chassis:</strong> Emperor's Hand, Edge of the Empire Core Rulebook, p. 402 (adjustments: none).\n<strong>Using them:</strong> The culling of the Inheritors is their graduation exam, and the grade is <em>anonymity</em>: the senior circle dead across a dozen worlds in one night, the archives vanished rather
