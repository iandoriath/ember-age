/strong> stands open — the first dead leg of the <a href=\"#\" class=\"xin\" data-nav=\"page:setting:geography\">Duros Space Run</a>, the road that once ran through the dark heart of the Run to Darkknell and the Hydian Way. <a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1's episode worlds</a> lie along it. Three factions know the crew's name — so does an enemy holding a claim — and someone knows exactly what just happened.</p>"}];
const MODULES= [{"id": "01", "title": "Session One — The Light on Vesta-9", "intro": "<p><em>The GM-screen module. Run the session from this page, one scene at a time — each scene is self-contained: the situation, who is in it and what they want, the checks, the outcomes, and what they seed. Marked names open stat blocks in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">Vesta-9 &amp; the Crew's Orbit</a>; the <a href=\"#\" class=\"xin\" data-nav=\"page:setting:session-one\">player recap</a> is the only player-safe summary of this session.</em></p>", "scenes": [{"sid": "s1", "title": "Overview", "html": "<p><strong>The session in one sentence:</strong> the beacon nobody could find for five years lights itself, a broke crew races the port to it, and what they <em>testify</em> about who lit it — in front of three factions and an enemy, one faction nobody knew existed this morning — becomes the founding paper of the reopened Run.</p>\n<p><strong>The session's jobs</strong>, in rising order of consequence: teach the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragment</a> subsystem at the moment a single page is worth a ship's life; put three factions and an enemy on the ground — the Lamplighters, the <strong>Naboo Admiralty</strong> (whose existence is tonight's reveal), the Vigil (a familiar strangeness at the edge of the scene — the Run's spacers already know the grey veils as a weird religious sect), and <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-ferro-skell\">Captain Ferro Skell</a> with a bought debt in his pocket; put the crew <strong>on the record</strong> as witnesses to a lighting nobody claims, holding evidence nobody else has; and open the corridor up the dark Run, where <a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1</a> lives. If the table drives home arguing about what they put on the paper — and what they kept off it — the session worked.</p>\n<p><strong>The spine</strong> — eight beats, about four hours with a break:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Beat</th>\n<th>Scene</th>\n<th>Clock</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>The argument, then the sky changes</td>\n<td>1 — Grell's Office</td>\n<td>~20 min</td>\n</tr>\n<tr>\n<td>Fuel, the champion, the errand</td>\n<td>2 — The Field</td>\n<td>~25 min</td>\n</tr>\n<tr>\n<td>The factor, the deed, the page</td>\n<td>3 — The Bedside</td>\n<td>~25 min</td>\n</tr>\n<tr>\n<td>Up the dead lane</td>\n<td>4 — The Race</td>\n<td>~35 min</td>\n</tr>\n<tr>\n<td>The standoff at the light</td>\n<td>5 — The Beacon</td>\n<td>~55 min</td>\n</tr>\n<tr>\n<td>Lighting party: ______</td>\n<td>6 — The Record</td>\n<td>~40 min</td>\n</tr>\n<tr>\n<td>The return, and the way out</td>\n<td>The Out</td>\n<td>~25 min</td>\n</tr>\n<tr>\n<td>Flags for session two</td>\n<td>The Handoff</td>\n<td>~5 min</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Cut for time, never for weight.</strong> If the clock runs hot: compress the fuel problem to one roll, reach the page through whichever vector is nearest, and let the <em>Steadfast</em> arrive early to squeeze Scene 5. Never cut the bedside, the moment the paper asks who lit it, or the closing image — the session is remembered by those three, in that order.</p>\n<p><strong>The numbers, on one line</strong> <em>(all sector scrip)</em>: lease arrears <strong>450</strong> + lift tax <strong>60</strong> · fuel load <strong>150</strong> (off-book half-load 90) · Osk's bought debt, in Skell's pocket <strong>250</strong> · rutter copy <strong>80</strong> · witness fee <strong>1,200</strong> · the famous posted prize <strong>12,000</strong> · witness charter <strong>250</strong>/lighting.</p>\n<p><strong>Prep checklist</strong> — eight items, half an hour:</p>\n<ol>\n<li>Tie each PC's Obligation to the grounding — one written sentence per PC; the table in Scene 1 does most of the work.</li>\n<li>Print the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:dice-results\">Reading the Dice</a> player sheets; this session leans on Advantage/Threat spends.</li>\n<li>Keep the <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">session one NPC file</a> open — the whole cast is statted there, marines and minion math included.</li>\n<li>Pick two or three <a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1 episode seeds</a> and pencil them onto the <a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">beacon map</a> (real systems, Enarc through Jutrand).</li>\n<li>Make the props — they beat exposition: the fragment card (<em>Grandmother Osk's rutter, page 40</em> — form, tag, Question, claim), and the certificate of relight with a blank line the players will physically write on: <strong>\"Lighting party: ______.\"</strong> One sheet each.</li>\n<li>Know the lien. <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-ferro-skell\">Captain Ferro Skell</a> bought Osk's medical debt this morning (250 — Scene 3), and under the Drift's ledger-law a bought debt is a lien on the debtor's property — arguably including the rutter under her pillow. If that paper is still in Skell's hand at certification, he has a <em>claim</em>: \"the chart that found this station is collateral on a debt I hold; the finding is mine.\" Tender the 250 at the bedside and the lien never exists — his corner at the beacon collapses to hearsay. Leave it standing and Scene 5's third corner arrives holding it. Decide nothing else in advance; the argument's strength is the table's to test.</li>\n<li>Decide privately what <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--keeper-adressa-vhail\">Keeper Adressa Vhail</a> saw. She was at the <em>dark</em> station before it lit — kneeling at the cold core, reading the necrology, when the light came on around her — and she has no ship anyone can find. <strong>Default answer</strong> (override freely): a Vigil circuit ship dropped her here on the warden's round — seals checked, names read — and returns on schedule, meaning the Vigil knew where Vesta-9 sat all along and never told the guild, because doors stay shut; she is the campaign's second person who knew and said nothing, and both facts are discoverable later. And she <em>saw the lighter</em>: a shape that looked at her, and left her alive. The necrology covers all of it: she answers every question with the list of the dead.</li>\n<li>Confirm the famous number (12,000 unless you've changed it) and know why nobody on the field can claim it: nobody on the field lit the beacon. That gap is Scene 6.</li>\n</ol>\n<div class=\"adm adm-danger\"><p class=\"adm-title\">GM only — Dial 3 is on the field</p><p>The Sith apprentice lit Vesta-9 tonight — deliberately, calmly, and exactly per plan. The line flies the dark lanes without beacons; beacons are for the <em>galaxy</em>, because the search rides the guild's public advance, and the advance was stalled on exactly this beacon. For years the line did not even know a true chart existed — Osk's survey was assumed lost with the hands who flew it — until the guild's repeated failed surveys forwarded \"the one pilot who won't sell\" to the patron's desk. Then it took a season: Mendac visited the blind woman's bedside months ago as a kind stranger with a sheet of jump-knots and — Influence, the liar's power — walked her through the run in a voice Osk trusted; Osk does not know what she told her. The visit, the station, the emptied principate cache (no holocron), and the light on the way out: routine, to them. The galaxy's comfortable wrong answer (\"some prize-hunter who didn't live to file\") was part of the calculation. (Optional body for the Question, for later acts: the survey hands from ten years ago did not outlive the trip home — a drifting hulk off the lane can one day answer \"who lit Vesta-9?\" with corpses and a worse question.) Nothing on the field knows any of this, and nothing should. What <em>is</em> on the field is an <strong>Inheritor observer</strong> — grave-robbers notice when a tomb opens — a clerk in guild grey standing in the certification crowd who writes nothing down. Spend exactly one throwaway line of description on them tonight, no more; the docking manifest in Nerra's packet makes them findable later, which keeps the reveal fair. They pay off silently in The Out. The line's full machinery is in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>.</p></div>\n\n<div class=\"adm adm-tip\"><p class=\"adm-title\">This party (update as the roster settles)</p><p>Bind the generic hooks to the actual sheets. <strong>Mikrés Kyríes</strong> (Chadra-Fan Technician, Debt: predatory lease, Pursuit: Wealth): Grell's impound <em>is</em> the lease — the creditor has a face tonight; Nerra's 3,000-scrip offer for Osk's page is aimed squarely at Wealth-versus-a-promise; and Chadra-Fan are canonically terrified of drowning, which is worth remembering when hop 2 turns out to be a drowned world. <strong>The Republic Trooper</strong> (Human Soldier, Dutybound, Oath: the Republic): the best version of his story out here — his garrison's charter was suspended <em>sine die</em> in 12 AR and three generations kept the post anyway; he is a living Civic fragment, the Question <em>\"What did the Adjournment actually adjourn?\"</em> is on his sheet, and Reike's pitch (\"the writ passed to those who kept it\") is a personal attack. Reike should court him; Nerra courts Mikrés; Vhail watches the gifted. <strong>The Dathomiri PC</strong> (in creation): self-taught, no tradition, no teacher — not a Nightsister; her gift is exactly what the Awakening makes and exactly what every faction tonight wants to register, buy, or protect.</p></div>\n\n<div class=\"adm adm-tip\"><p class=\"adm-title\">Table talk before the dice</p><p>If session zero did not already do it, say the era's thesis line aloud — <em>nobody broke the galaxy; everyone just stopped holding it up</em> — and remind the table that in this era the Force is not a skill, it is an event. Both lines pay for themselves later.</p></div>"}, {"sid": "s2", "title": "Scene 1 — Grell's Office", "html": "<p><strong>The situation.</strong> Okrent's Drift is a boomtown that bet on the Run reopening and has spent years losing the bet: Bannistar's fuel gantries were raised new to feed the Lamplighters' advance — four beacons relit in a decade, every prize paid, the last to the <em>Larksong</em> — then Vesta-9 refused to be found, and the port slid into recession. The crew opens the session mid-argument in <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--portmaster-grell\">Portmaster Grell</a>'s impound office, and the argument is a perfect circle: the ship stays bolted until the lease arrears are paid; the crew can't pay until they sell the cargo; the cargo can't sell until it clears inspection; inspections are backlogged for weeks; and impounded vessels can't even be <em>scheduled</em> for inspection until the lease is current. Every door in the loop is locked from the far side, and Grell built the loop. Let them argue in character for ten minutes — no dice needed yet.</p>\n<blockquote>\n<p>The office smells of fuel-tax stamps and someone else's lunch. Grell hovers at eye level behind the ledger-slate so nobody can look down on him, and he has just explained, for the third time, patiently, that the rule that would free your ship is behind the rule that would free your cargo, which is behind the rule that would free your ship. Somewhere out on the field, a lane departure you are not on lights the window.</p>\n</blockquote>\n<p><strong>Why <em>you</em> are stuck here</strong> — invoke each PC's Obligation as the specific reason the Drift has them:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Obligation</th>\n<th>The grounding, personalized</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Debt</strong></td>\n<td>The impound <em>is</em> the collection. Grell's ledger carries your marker's interest, and the Kajidic dues-taker at the gate knows your face.</td>\n</tr>\n<tr>\n<td><strong>Family</strong></td>\n<td>The cargo is the lifeline — medicine or parts consigned for your homeworld, seized with the hold.</td>\n</tr>\n<tr>\n<td><strong>Oath</strong></td>\n<td>The dying archivist's last commission is in those crates, and the deadline was last week.</td>\n</tr>\n<tr>\n<td><strong>Notice</strong></td>\n<td>A reconnected world's magistracy re-issued an old writ the moment the lanes reopened — paper that slept for years is awake, and it reached this port before you did. Lifting without clearance confirms everything it says about you.</td>\n</tr>\n<tr>\n<td><strong>Secret</strong></td>\n<td>Someone on this field knows — and the price of their quiet was the cargo.</td>\n</tr>\n<tr>\n<td><strong>Obsession</strong></td>\n<td>You spent the fuel money on a fragment lead that went nowhere. That is <em>why</em> you cannot pay Grell.</td>\n</tr>\n<tr>\n<td><strong>Responsibility</strong></td>\n<td>Your refugees are camped at the field's edge; feeding them is where the scrip went.</td>\n</tr>\n<tr>\n<td><strong>Contract</strong></td>\n<td>The Lamplighters hold your ship's papers, and their factor here grounded you pending arrears. Remember this in Scene 5: Chartmistress Nerra is your creditor's colleague.</td>\n</tr>\n<tr>\n<td><strong>Posted</strong></td>\n<td>A Guild hunter is drinking in the cantina, deciding whether the posting on you still bonds. Lifting fast is suddenly very attractive.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Then, mid-sentence, the sky changes:</strong></p>\n<blockquote>\n<p>It starts as a murmur on the depot's public band, then every nav board in the port lights at once. Vesta-9 — dark since your grandparents' time, a dead name on old charts — is broadcasting, clean and steady, like sixty years never happened. Across the field a freighter spins up its lifters without waiting for clearance, and then everybody is running.</p>\n</blockquote>\n<p>Nobody in this port needs the stakes explained — they have been the port's whole conversation for years — so put the <em>disbelief</em> in a dockhand's mouth: <em>\"Five years of surveys. Best chartkeepers in the guild. Nobody could find it. And it just — came on.\"</em> Then the famous number, said the way people say a lottery number. Nobody on the field has stopped to ask who could claim a prize for a beacon nobody lit. They will.</p>\n<p><strong>The deal.</strong> The light changes the argument: the crew suddenly needs sky, and Grell — watching a port full of brand-new grift assemble outside his window — suddenly wants this conversation over. For the first time all morning, both sides of the desk want a deal. Listed price: <strong>450 scrip</strong> of lease arrears plus a <strong>60-scrip lift tax</strong> (the inspection backlog quietly evaporates the moment the arrears are \"resolved\" — the loop was never about the rules). Odds are the crew cannot come close to raising it — say the number out loud anyway; the shortfall is the whole scene. Every ten minutes of haggling his eyes drift to the window and the price of his patience drops. He is venal, not cruel: every fee has a listed price, and he honors what he signs. If violence clears its throat he drops behind the desk and starts naming lower numbers — keep him alive; a portmaster who owes the crew goodwill is Act 1's best recurring door.</p>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th>Approach</th>\n<th>Check</th>\n<th>It works</th>\n<th>The downside</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Haggle his angle</td>\n<td><strong>Average Negotiation</strong>, upgraded once (Natural Negotiator lets him force one reroll)</td>\n<td>He'd rather own a piece of a rumor than scrip today: the debt converts to a signed 15% of any first-lighting fee. Advantage shaves it to 10%.</td>\n<td>Threat: the 60-scrip lift tax stays, cash up front.</td>\n</tr>\n<tr>\n<td>Lie to him</td>\n<td><strong>Average Deception</strong>, upgraded once (Nobody's Fool)</td>\n<td>The bolt comes off on a forged consignment or an invented patron.</td>\n<td>Discovered — failure now, or any Despair in the port later — he doubles the release to 900, honors nothing unsigned, and says your names to the Kajidic dues-taker (+5 Debt Obligation, or seed one).</td>\n</tr>\n<tr>\n<td>Slip the bolt</td>\n<td><strong>Hard Skulduggery</strong> on the impound clamp</td>\n<td>A quiet release and no paper at all.</td>\n<td>Threat: tamper logs — Grell knows before you clear the gravity well. Despair: the bolt's tracer fires on lift; the debt beats you to Vesta-9 in the guild post.</td>\n</tr>\n<tr>\n<td>Pay</td>\n<td>510 scrip they do not have</td>\n<td>The dockside Kajidic lender advances it in minutes.</td>\n<td>Ruinous interest: Debt Obligation +5, and the young Hutt's clerk smiles as she files it.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>It seeds:</strong> whatever paper the crew signs here follows them — Grell's cut resurfaces in The Out, the lender's book in Act 1, and a crew that walks out with <em>no</em> deal is down to the Skulduggery row or stealing another crew's ship, which is a different campaign.</p>"}, {"sid": "s3", "title": "Scene 2 — The Field", "html": "<p><strong>The situation.</strong> An obstacle course with an audible clock: every ten minutes of table time, narrate another ship lifting. The crew's morning in Grell's office cost them their fuel-queue place — they join at the back, watching fueled ships climb.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Where</th>\n<th>What is there</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>The fuel queue</td>\n<td>150-scrip lift-and-jump loads, a line out the gate, and the <em>Larksong</em> holding the head of it.</td>\n</tr>\n<tr>\n<td>The cantina gantry</td>\n<td>The rumor network at full boil: the chart-broker, the wager board, word of who has already lifted.</td>\n</tr>\n<tr>\n<td>The depot infirmary</td>\n<td>Tama Osk — and, tonight, the debt-buyers who got to her bedside first. Scene 3.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The fuel.</strong> A lift-and-jump load runs <strong>150 scrip</strong>. Options: <strong>Average Negotiation</strong> with the depot clerk for deferral against the first-lighting fee; <strong>Average Streetwise</strong> for an off-book half-load at 90; or the head of the queue, below.</p>\n<p><strong>The champion.</strong> Holding the head of the queue: the <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--larksong-crew\">Larksong crew</a>, three spacers in patched vac-jackets who finish each other's sentences, and their captain — <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-vess-marrow\">Captain Vess Marrow</a>, who waves at the crew from her boarding ramp like an old friend, because by the third race she genuinely will be. Everyone in the port knows the <em>Larksong</em>: hers is the crew that claimed the Triffis prize, the last one the guild paid before the Run stalled, and the wager board has her as the favorite before she finishes waving. Her ship is statted — <a href=\"#\" class=\"xin\" data-nav=\"npc:ships--the-larksong-prize-money-yt-1300\">The Larksong, prize-money YT-1300</a> — the crew's own pattern with the prize spent on it: Speed 4 to their 3, a Class 1 hyperdrive to their Class 2, no backup hyperdrive at all. Let the players hear the turbine before they see the ship. Play her fast, warm, and better-prepared: she names the wager (loser buys the winner's table a round, every port, for a season), and when she sees where the queue has put the crew she splits her allocation without being asked — <em>\"I want to beat you, not lap you.\"</em></p>\n<p><strong>The errand.</strong> Waving off thanks, she flips them a folded flimsi: a fresh sheet of <strong>jump-knots</strong> — astrogation teasers off the cantina rack, the spacer's crossword, two bits at the commissary. <em>\"Call it even: drop these with Grandmother Osk in the infirmary — I bring her the new sheet every time I'm through, and tonight I'm racing you. She's blind, so you'll have to read them to her. She does them in her head faster than you can read. Bring your manners.\"</em> A genuinely trivial errand, and Marrow thinks nothing of it — it is the fig leaf that lets a proud, broke crew take the fuel. Her deckhands walk the split load to the crew's pad while the errand runs — which is why the crew has ten minutes for a dying woman in the middle of a gold rush. The <em>Larksong</em> lifts before they're back, cheerful wave from the ramp.</p>\n<p><strong>The other ways to a page</strong> <em>(if the bedside never happens, the fragment lesson still can)</em>: <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-vess-marrow\">Captain Vess Marrow</a> owns a copy of Grandmother Osk's rutter — the <em>old</em> log, the living-days route every Run family traded around — and trades page 40 for the crew's signature backing the <em>Larksong</em> as co-witnesses at certification. The chart-broker under the gantry sells a fair copy for <strong>80 scrip</strong> — or for the full, embarrassing story of how the crew lost their cargo; he collects embarrassments — and throws in a hint free: <em>\"Mine's a copy. The original's owner is dying about forty meters from here. She doesn't sell.\"</em> Copies give the Scene 4 boost die. They do not carry the claim.</p>\n<p><strong>Advantage/Threat menu</strong> — tuned to this scene:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Result showing</th>\n<th>Spend it as</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Advantage</td>\n<td>A dockhand throws in charged cells: remove a setback die from the crew's next shipboard Mechanics check.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Grell lets slip the count — how many ships have lifted, and that the <em>Larksong</em> is fueled but waiting on a chart.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>The Kajidic dues-taker at the gate writes the crew's names in her book.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>The split load walks over slowly: the crew's lift slips ten more minutes, and one more rival hull gets ahead of them.</td>\n</tr>\n<tr>\n<td>Triumph</td>\n<td>Grell smells profit and flips: release fee waived for a signed 10%, plus the depot's sixty-year-old lane chart — a boost die in Scene 4.</td>\n</tr>\n<tr>\n<td>Despair</td>\n<td>The impound bolt scars the gear coming off: the ship starts Scene 4 carrying 2 system strain.</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"adm adm-tip\"><p class=\"adm-title\">If it drags</p><p>Marrow pays. She strolls into the impound office mid-haggle, counts out Grell's 510 from her winnings pouch, and tells the crew they owe her \"one page's worth\" — then races them anyway. The debt is real, not flavor: \"one page's worth\" is the co-witness signature (Scene 2's trade), and she collects it at certification, in front of Nerra, at the least convenient moment she can find.</p></div>"}, {"sid": "s4", "title": "Scene 3 — The Bedside", "html": "<p><strong>The situation.</strong> Tama Osk — the rutter's author, vacuum-lunged in the depot infirmary. Play her as a Duros somewhere past a hundred and fifty, blind these last two years, entirely unafraid: she flew the Run when it was whole, kept flying its dark stretches for decades after everyone else stopped, and speaks in a dry rasp that costs her something to use. (No stat block; she never leaves the bed.) If the table wants the quiet beat before the storm: a crew member reads the first jump-knot aloud and the blind woman solves it before the sentence ends — the port thinks she is a relic; she is the sharpest navigator the crew has ever been in a room with, and now they know it before anyone mentions a chart. Under her pillow is the <strong>original</strong> — her dark-years marginalia: true positions, drift shadows, which buoys were warm — the one chart in the galaxy that finds Vesta-9 without a broadcast to home on.</p>\n<p><strong>What the crew walks in on.</strong> However they arrive — Marrow's errand, the broker's hint, their own reasons — they arrive mid-scene: <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-ferro-skell\">Captain Ferro Skell</a> and two of <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--skell-s-crew\">Skell's crew</a> are around the bed, not shouting, which is worse. Skell bought Osk's medical debt off the infirmary's books this morning — <strong>250 scrip</strong> of it, purchased within the hour of the boards lighting — and he is explaining, reasonably, that the <em>Overdue</em> collects what it is owed, that a dying woman has nothing else of value, and that everyone in this port knows what is under her pillow. The arithmetic is honest and vile: the relight makes her book the key to every prize on the Run, and Skell means to hold her last weeks hostage for it. (He cannot actually win — Osk has out-stubborned richer and scarier people than him for ten years, and she would die first — but nobody in the room knows that yet, and her last weeks getting uglier is real.)</p>\n<p><strong>The deed</strong> — no prompt, no promised reward, and these are not people who fold to a raised voice: <strong>tender the debt</strong> — 250 scrip counted out before witnesses; under port ledger-law a registered debt tendered in full is discharged, and Grell will enforce his own rules with visible pleasure — but the money has to come from somewhere that hurts tonight; <strong>face them down</strong> — <strong>Hard Coercion</strong>, or Negotiation with something real behind it: Skell is violent, not stupid, and a crew that looks like more trouble than a book is worth gets a shrug and a <em>\"see you on the lane\"</em>; or <strong>make it a fight</strong> — they will happily oblige, two of them plus Skell in an infirmary ward, stun settings nowhere in their doctrine; the orderly screams, Grell fines everybody, and the grudge is now blood. Doing nothing is allowed: Skell keeps the squeeze, Osk gives him nothing, the errand is delivered, and the crew never learns what was under the pillow — the copies still teach the fragment lesson, and the second audition (The Out) stays open. Either way, remember what this scene is really for: Marrow is the rival the crew will love. <strong>Skell is the other kind.</strong></p>\n<p><strong>The down payment.</strong> If they act, she chooses — and says why, citing what this table actually did (the tender, the stare-down, the thrown punch — make it specific): <em>\"Everyone in this port is running toward money tonight. You just spent yours keeping wolves off a stranger. Sit down.\"</em> What she gives is <strong>not the book.</strong> It is <strong>page 40, the original</strong> — margins no copy carries — plus the claim, said aloud, free: <em>\"Somebody has been flying that lane for years. The buoys were warm when I went back. And the guild's prizes go exactly where those people wanted to go.\"</em> And the promise, both halves: <em>\"When it answers you, tell it Osk finished the run. And don't sell my page to the people who were just in this room.\"</em> Then the hook: <em>\"Come back and tell me what you found up there. Then we'll talk about the rest of the book.\"</em></p>\n<p>Two threads for later, if the conversation opens: asked whether she ever told a soul where Vesta-9 sits, her rasp goes quiet — <em>\"Once. A young woman. Right questions, kind voice. I couldn't tell you a single word I said to her.\"</em> (GM: Dial 3 — a living-witness thread that pays off when the crew someday has a silhouette to match; do not explain it tonight.) And her old <strong>navigation droid</strong> — blind pilots need eyes — went to a chop-yard for debts years ago; its unwiped core holds fifty years of the Run. Recovering it is a quest hook with a technician's name on it (the buyer, if anyone ever chases it, was Okkam Dree).</p>\n<p>When a page lands — hers or a copy — hand over the card and log it (copy only: log the card with the claim blank, and let them notice the blank):</p>\n<div class=\"runact\" data-kind=\"fragment\" data-aid=\"m01-1\" data-args=\"{&quot;name&quot;: &quot;Grandmother Osk&#x27;s rutter, page 40&quot;, &quot;form&quot;: &quot;rutter&quot;, &quot;tag&quot;: &quot;Civic&quot;, &quot;question&quot;: &quot;Who lit Vesta-9?&quot;, &quot;claim&quot;: &quot;somebody has been flying the dead Run for years, and the prizes follow them&quot;, &quot;holder&quot;: &quot;crew&quot;, &quot;status&quot;: &quot;trusted&quot;}\"><button class=\"btn\">Issue fragment: Grandmother Osk&#x27;s rutter, page 40</button><span class=\"runact-desc\">Civic · bears on “Who lit Vesta-9?”</span></div>\n\n<div class=\"adm adm-tip\"><p class=\"adm-title\">Teach the subsystem out loud</p><p>Say the rules as you hand the card: it has a <strong>form</strong>, a <strong>tag</strong> (Civic), and it bears on a named <strong>Question</strong> — <em>Who lit Vesta-9?</em> It boosts related Knowledge checks; three fragments on one Question unlock a <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">Reconstruction</a>. Open the <a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">fragment tracker</a> where the players can see it. Fragments from different tags always disagree on one load-bearing fact — write Osk's claim down now so the contradiction is loaded before anyone notices.</p></div>\n\n<p><strong>It seeds:</strong> keeping the first half of the promise — her name into the beacon's carrier at certification — gives a boost die on the Speak-to-it check, and Vhail hears it, and looks at the crew for the first time like they might be worth talking to. The inheritance — the whole rutter and the whole story (the coreward \"antiquarians,\" the survey she flew before any prize was posted, the places that should have been empty, the people who did not come back) — is a <em>return</em> scene: The Out tonight if twenty minutes remain, session two's cold open if not. She will already have heard what went on the record; coming back at all is the second audition. When she hands the book over she has weeks left; her funeral is Act 1's first — and play it as a scene, not a line: in this era the war dead are read aloud at funerals, Jedi and Sith entered in one column, and if the Republic Trooper wears the uniform to it, the whole port notices. <strong>Why not Marrow:</strong> Osk loves her, and the guild owns her — the Triffis prize made the <em>Larksong</em> the guild's poster crew, and Osk's one hard criterion is <em>owes the guild nothing</em>. The old log was her consolation gift years ago, and Marrow has never once asked about the original, which is part of why Osk loves her. The errand is exactly what it looks like — a friend's small habit, handed off in a hurry; Marrow has no idea what it set in motion. If the crew ever tells her, she is quiet a moment, and then: <em>\"Good.\"</em></p>"}, {"sid": "s5", "title": "Scene 4 — The Race", "html": "<p><strong>The situation.</strong> Frame it mechanically before anyone rolls: this session <em>is</em> the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:beacon-relighting\">beacon-relighting set piece</a>, run out of order. <strong>Wake it</strong> was done by an unknown hand — that mystery is the campaign's. The crew is flying <strong>Chart it</strong> now, and <strong>Speak to it</strong> waits at the station.</p>\n<div class=\"adm adm-tip\"><p class=\"adm-title\">Weather with teeth (optional)</p><p>A cheap, perfect Threat spend anywhere on the leg: <strong>mynocks</strong> — the dead lane's pigeons — latched on at the last cold buoy and chewing the power couplings (1 system strain a round until somebody EVAs or barrel-rolls them off; <span class=\"xref\">The Feral Run</span>). Sixty dark years put colonies on every cold surface out here, and the crew's running lights are the first thing to disturb them in a lifetime.</p></div>\n\n<p><strong>The jump.</strong> The Run's first dead leg — Bannistar toward Enarc — has decayed past its nav data: <strong>Hard Astrogation</strong>, exactly per the beacon rules. A rutter page bearing on the route adds a boost die — the fragment lesson, taught at the moment it matters. Jumping blind is legal but earns a setback die for sixty years of drift silt. <em>(Why the Larksong's Class 1 hyperdrive doesn't simply win: on a decayed lane the clock is recalculation, not multiplier — the legs between dead buoys are short, and every reversion resets the math. Open lanes are where she laps people; dead ones are won by charts.)</em></p>\n<p><strong>While the navigator plots</strong> — one supporting beat per other PC, so nobody watches one person roll:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Crewmate</th>\n<th>Check</th>\n<th>On success</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>The engineer</td>\n<td><strong>Average Mechanics</strong>, coaxing the heirloom drives</td>\n<td>Remove the setback from any Scene 2 hull damage, or clear 1 system strain mid-run.</td>\n</tr>\n<tr>\n<td>The slicer</td>\n<td><strong>Average Computers</strong>, scrubbing sixty years of silt from the nav data</td>\n<td>Add a boost die to the Astrogation check.</td>\n</tr>\n<tr>\n<td>The lookout</td>\n<td><strong>Average Perception</strong> at the reversion points</td>\n<td>The dead drift buoys read a heartbeat early — downgrade one Despair-shaped surprise to a Threat-shaped one, narratively.</td>\n</tr>\n<tr>\n<td>The captain</td>\n<td><strong>Average Leadership</strong>, calling the run</td>\n<td>Recover 2 strain across the crew; the ship flies like the crew believes in it.</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"adm adm-tip\"><p class=\"adm-title\">The house spends are live</p><p>First scene where the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:dice-results\">Ember Age spend table</a> earns its keep: 2 Advantage on a relight stage hands a boost to whoever tackles the next one, 2 Threat on decayed-lane Astrogation leaks the route to a rival, a Despair means the relight broadcasts wider than intended. Let a player find the table themselves; approve generously.</p></div>\n\n<p><strong>Neck-and-neck.</strong> Mid-run, the lane forces a recalculation at a collapsed drift buoy, and the <em>Larksong</em> reverts alongside. The crew's fresh solution shows what the older copies miss: the buoy's mass shadow has drifted into the third leg, dead across the <em>Larksong</em>'s plotted line. The choice: <strong>comm the warning</strong> — lose the lead, arrive together or second, and cement a friendship the campaign will spend for years — or <strong>stay silent</strong> — arrive first while the <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--larksong-crew\">Larksong crew</a> limps in behind a scarred hull, and start the rivalry cold. Do not soften it. And remember who Marrow is: the wager board's favorite, the crew that claimed the last prize the guild ever paid. Nobodies who beat the champion by warning her are a story the port tells for a season. Nobodies who beat her by letting her hull get scarred are a different story, and the port tells that one too.</p>\n<p><strong>Outcomes ladder:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>The roll</th>\n<th>What happens</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Success</td>\n<td>Clean jump — first of the swarm proper. The station is not empty even so: the warden was here before the light, and if Skell ran his default race (paper first — see <em>Where is the Overdue?</em> below), the <em>Overdue</em> is already on the ring, mid-recital. Perhaps an hour of quiet before the rest of the sky fills.</td>\n</tr>\n<tr>\n<td>Success with 3+ Threat, or failure</td>\n<td>Slow jump: drift-silt reversions, two recalculations. They arrive to find the <a href=\"#\" class=\"xin\" data-nav=\"npc:ships--nas-steadfast-naboo-pattern-patrol-sloop\">NAS Steadfast, Naboo-pattern Patrol Sloop</a> already on station, interdiction broadcast running.</td>\n</tr>\n<tr>\n<td>Despair (regardless of success)</td>\n<td>Misjump scare: reversion inside the shoal short of the station. 3 system strain, limping the last leg — the crew arrives <em>last</em>, standoff already assembled.</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"adm adm-danger\"><p class=\"adm-title\">The Overdue is ahead of them</p><p>Default: Skell left the Drift the moment the carrier lit — his plan was always paper, and the beacon now broadcasts its own address on every band — so the <em>Overdue</em> passed the reversion points hours ago, burning for the station with the debt-paper in the strongbox. <strong>But if the bedside drew blood</strong>, he waits at the last reversion point instead: <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--the-overdue-debt-bought-ghtroc-720\">The Overdue, debt-bought Ghtroc 720</a> drops onto an intercept vector — Skell, bloodied or humiliated at the ward, rounding the account to even before the paperwork. If the crew carries the page, he wants it; if not, crippling the competition before certification pays almost as well; and if there is blood between them from the ward, revenge rounds it to even. Run a real fight, two or three rounds — the turtle against their hare: the <em>Overdue</em> is slower and much harder (Armor 5, twenty-eight hull), its turret walks fire on Skell's own Gunnery, and <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--skell-s-crew\">Skell's crew</a> shoot to kill, not to warn. The crew's outs are flying (the hulls match speeds; their pilot is better), gunnery of their own, or running the last leg — which means arriving at the station with the <em>Overdue</em> on their tail, into whatever the outcomes ladder put there: fleeing under the <em>Steadfast</em>'s guns is safety with a price tag (an Admiralty log entry with their name in it, and Skell peeling away, smiling, guns suddenly cold). Skell breaks off the moment the math goes wrong — he wants profit, not a grave. Never the <em>Larksong</em> (the rivalry stays clean), never the <em>Steadfast</em> (that is an arrest, not a fight — Scene 5). If the bedside never happened, there is no ambush at all — the <em>Overdue</em> is simply ahead, and the lane is quiet.</p></div>\n\n<p><strong>Where is the <em>Overdue</em> when the crew arrives?</strong> The race has more than one shape — key Scene 5's setup to how the bedside and the lane actually went:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>If…</th>\n<th>Then at the station</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>No blood at the bedside <em>(default)</em></td>\n<td>Skell flew at the first flash of the carrier and beat everyone: the <em>Overdue</em> is clamped, the recital is running, and half the early swarm believes <em>he</em> lit it — until Nerra checks the codes.</td>\n</tr>\n<tr>\n<td>The lane fight happened and he broke off</td>\n<td>The crew arrives first; the <em>Overdue</em> limps in <strong>behind</strong> them, laser-scored and cold-gunned under the <em>Steadfast</em>'s watch — and files anyway. His \"armed incident on the lane\" report now runs against his own scorched hull and a room that already heard the crew's version first.</td>\n</tr>\n<tr>\n<td>The lane fight crippled the crew</td>\n<td>They limp in last (the Despair row): Skell has been clamped for an hour, his account is already in two files — and the crew's entrance, smoking, late, and armed, matches his version better than theirs.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Who does the swarm suspect of lighting it?</strong> Whoever arrived first. In the default that is Skell, until the codes clear him. But if the <em>crew</em> beat everyone in, the comfortable wrong answer lands on <strong>them</strong>: first aboard, holding a chart nobody else has — half the swarm decides they lit it and are dodging the prize claim, which makes Scene 6's blank line suddenly personal. Either way the misdirection does its real work: nobody in the swarm is asking the true question yet.</p>"}, {"sid": "s6", "title": "Scene 5 — The Beacon", "html": "<blockquote>\n<p>The station hangs where no chart promised — three light-hours off the guild's plot, exactly where Osk's page says — and it is lit: running lights, docking ring, the long lattice of the beacon mast all burning like a festival. Under everything, on every band, the carrier hums: one clear note repeating its name to a galaxy that stopped listening. Nothing about it looks sixty years dead. Something about it looks <em>swept</em>. And the swept places look very, very recent.</p>\n</blockquote>\n<p><strong>Occupancy timeline</strong> — who is where, keyed to the Scene 4 ladder:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>When</th>\n<th>On station</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Before the light</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--keeper-adressa-vhail\">Keeper Adressa Vhail</a>, kneeling at the beacon core, reading names from a slate — the war dead, Jedi and Sith in one column. She was here when it was dark. No ship anyone can find. She answers every \"how\" with the necrology, as if the list of the dead were itself the explanation. The swarm's verdict, on the open band, is familiar and wrong: <em>\"Grave cult's here. Don't touch what she's taped off.\"</em></td>\n</tr>\n<tr>\n<td>Before the crew <em>(default — no blood at the bedside)</em></td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--the-overdue-debt-bought-ghtroc-720\">The Overdue, debt-bought Ghtroc 720</a>, already clamped to the ring — Skell on the beacon's public band, filing a first-lighting claim flat as a recital: name, hull, debt-paper, lien. Half the early swarm believes <em>he</em> lit it, and keeps believing it until Nerra checks the codes. <em>(If the lane fight happened, he is not here yet — key this row to the</em> Where is the Overdue? <em>table in Scene 4.)</em></td>\n</tr>\n<tr>\n<td>Within the hour</td>\n<td>Whoever lit it — gone. One docking cradle on the ring is still warm to the touch, and nothing is in it.</td>\n</tr>\n<tr>\n<td>The crew's arrival</td>\n<td>Per the outcomes ladder — first, second, or last.</td>\n</tr>\n<tr>\n<td>+40 minutes (or already there)</td>\n<td>The <a href=\"#\" class=\"xin\" data-nav=\"npc:ships--nas-steadfast-naboo-pattern-patrol-sloop\">NAS Steadfast, Naboo-pattern Patrol Sloop</a> arrives <strong>out of the dark side of the lane</strong> — from up the dead Run, where nothing is supposed to live — off a fleet tender no chart lists, runs out its guns, and broadcasts: all vessels stand to for inspection under the Corridor Security Act, a law of a navy nobody in the swarm has ever heard of. This is the galaxy's first sight of the <strong>Naboo Admiralty</strong>. Within the hour, half the swarm settles on the comfortable answer: <em>the Admiralty lit it — they came out of the dark, navies have codes.</em> Let that answer harden; the crew's evidence will fight it.</td>\n</tr>\n<tr>\n<td>+90 minutes</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a>'s guild packet arrives trailing the swarm from the Drift. She requests docking \"as certifying observer,\" ink already wet.</td>\n</tr>\n<tr>\n<td>Throughout</td>\n<td>The arrival swarm: a dozen hulls from Okrent's Drift — and, later, in the certification crowd, a clerk in guild grey who writes nothing down (The Out).</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Running order.</strong> Whatever the arrival math: (1) the crew, the humming station, the warden at the core who does not look up — and, unless the lane fight delayed him, the <em>Overdue</em> on the ring, Skell mid-recital on the public band; (2) the <em>Steadfast</em>'s broadcast, which turns every hopeful in the swarm into an audience; (3) the inspection; (4) Nerra's docking request, timed to interrupt whatever is tensest; (5) certification. Scene 6 detonates the moment the paper asks who lit it.</p>\n<p>Color for the approach: as the arrival swarm's floodlights sweep the station, a <strong>mynock colony</strong> lifts off the dead hull in a single grey sheet — sixty years of tenants leaving as the neighborhood relights. It costs nothing mechanically and tells the table the truth about the dark: it was never empty (<span class=\"xref\">The Feral Run</span>).</p>\n<p><strong>The three-cornered standoff.</strong> A social scene with a warship in it, not a combat with dialogue. Each corner wants something <em>from the crew</em>, and each has a lever. Vhail is present but is not a corner — she wants nothing from the crew tonight, which in this room makes her the strangest thing on the station; her trade (below) is the scene's fourth wall. (Budget note: if the table is swamped with names, Vhail runs <em>silent</em> — her trade keeps for the return visit — and Skell's corner runs <em>short</em>: his claim lands in one speech and keeps for the certification table.)</p>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th></th>\n<th><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-ferro-skell\">Captain Ferro Skell</a></th>\n<th><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--commander-joss-reike\">Commander Joss Reike</a></th>\n<th><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Wants</strong></td>\n<td>The folio — or failing that, the finding: <em>\"the chart that found this station is collateral on a debt I hold; the lighting claim rides the lien.\"</em> He wants it sworn, co-signed, and paid.</td>\n<td>All vessels stand to: manifests, inspection — and one signed line in his log that this corridor \"requires naval protection.\" A stranger on the lane would do nicely.</td>\n<td>To certify the relight with the crew signed as witnesses of record — <em>clean</em>: unknown hand, lane clear — and, if it exists, to buy the chart that found this place.</td>\n</tr>\n<tr>\n<td><strong>Lever</strong></td>\n<td>The debt-paper — 250, bought at Osk's bedside this morning — plus a sworn account that contradicts the crew's wherever it hurts them. Nerra finds the lien argument <em>interesting</em>, not absurd: a chart as collateral is the kind of precedent a guild lives on.</td>\n<td>The only warship in the sky, and the procedure that justifies using it.</td>\n<td>No guild certificate, no fee — and she decides whose names go on the paper.</td>\n</tr>\n<tr>\n<td><strong>Red line</strong></td>\n<td>Being made a liar in front of the navy and the guild — disprove his account publicly and he stops negotiating.</td>\n<td>Armed defiance, or humiliation in front of his marines.</td>\n<td>Forged guild marks, or claiming the fee around her.</td>\n</tr>\n<tr>\n<td><strong>Compliance earns</strong></td>\n<td>A cut of whatever the paper pays, offered with dead-flat courtesy, and a cold \"see you up the Run.\"</td>\n<td>Correct treatment, a fuel chit drawn on the <em>Steadfast</em>, a clean record in the log.</td>\n<td>The fee, the witness charter, accreditation — real value, honestly paid. Her Deception 3 is for what the offer <em>omits</em>.</td>\n</tr>\n<tr>\n<td><strong>Refusal earns</strong></td>\n<td>The <em>Overdue</em> on their tail out of the system — and his sworn counter-account riding in Nerra's packet and Reike's log.</td>\n<td>Refuse <em>lawfully</em>, on the record, and he salutes — he respects people who beat him by the book. Refuse unlawfully and the ladder starts.</td>\n<td>Perfect politeness, an \"unwitnessed\" filing, and every guild door on the Run swinging politely shut.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The <em>Larksong</em> at the light.</strong> <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-vess-marrow\">Captain Vess Marrow</a> docks per the race's outcome and parks the <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--larksong-crew\">Larksong crew</a> in visible, cheerful neutrality. If the co-witness trade was made, she backs the crew's account to Nerra and expects her names on the certificate; if the race ended cold, she bids against them at Nerra's table — graciously, and hard. She offers Reike nothing but compliance and, to Skell, the flat look reserved for men who bill the dying. Her testimony, not her pistol, is what she brought aboard.</p>\n<p><strong>Skell fights on paper now.</strong> Under the <em>Steadfast</em>'s guns he cannot win the room by force and knows it — so the guns stay cold and the claim does the work: the lien speech on the public band, a sworn account to Nerra that contradicts the crew's wherever it hurts them, and a concerned spacer's report to Reike about \"an armed incident on the lane,\" his own part edited out. Neither of them particularly believes him; both find him <em>useful</em> — Nerra as leverage on the crew's terms, Reike as one more line in the corridor-needs-protecting file. <strong>The out the crew may not notice:</strong> tender the 250 — at the bedside hours ago, or right here, in front of witnesses — and the lien dies; his corner collapses to hearsay, and everyone in the chamber watches him fold the dead paper away. If the bedside came to blows instead, the paper arrives with a bandaged hand and a better story. And the claim plays differently by arrival order: filed first-in, it is a standing fact the room formed around; delivered limping in scorched, it is a wounded man's story against the crew's — he knows it, and prices the Scene 6 co-signature accordingly (a fifth of the famous number from strength, a quarter when he needs them). Either way, this is the crew's first lesson in the campaign's actual weapon: testimony, not turbolasers.</p>\n<p><strong>Poking at the light.</strong> Someone will examine the station — let them. <strong>Average Mechanics or Computers</strong> at the core establishes three facts, delivered flatly: the failsafes were released <em>from inside</em>, in the correct order, no forced panels; the wake sequence used valid guild handshake codes; whoever did it cleaned up afterward — within the last few hours. <strong>Average Perception</strong> on the docking ring adds a fourth: one cradle is still warm, and no ship anyone can find left it. Any navigator with Osk's page adds the fifth without a roll: the station is three light-hours from where the guild's charts put it — which is why nobody ever found it dark, and means whoever lit it <em>knew where it was</em>. Say them all and move on — do not explain. (GM only: these are the session's hard clues toward the Conclave rigging and the patron behind it. Skell did not do this, whatever the swarm concluded before the codes were checked — and neither did Vhail, whatever the players conclude; Nerra goes noticeably quiet if shown the handshake logs, and quieter at the name Osk.)</p>\n<p><strong>Vhail's trade.</strong> She answers exactly one question truthfully and completely, for the price of a moment's honest silence for the names she is reading — respect, not reverence, and she can tell the difference at a glance:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>If they ask…</th>\n<th>She answers</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>\"Who lit it?\"</td>\n<td>\"Not my order. We do not wake things. Ask instead who <em>benefits</em> from an opened door — and notice who arrives already knowing which doors come next.\"</td>\n</tr>\n<tr>\n<td>\"How did you get here?\"</td>\n<td>\"The doors were shut. I keep the doors.\" — and if the crew told the truth on the record by session's end, she adds, quietly: \"I was here before the light. I have not yet decided what that makes me.\"</td>\n</tr>\n<tr>\n<td>Anything about the war — its lineages, the Valley, or relic law</td>\n<td>A true, careful answer worth a Jedi-tag lead — name where a fragment might be found out on the Run, keyed to a seeded episode world. Good defaults from <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>: a four-generation lightsaber sitting unrecognized on the Memory Market at Sanrafsix, or a dry hill on Veshet that the locals leave alone and will not say why.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>The inspection.</strong> Why a dozen hulls stand to for one sloop: she cannot inspect the swarm at once and does not need to — she needs exactly one example, and nobody volunteers; twelve crew work the queue one hull at a time while the gun ladder does the arithmetic for everyone else. And the hull is itself intelligence, for a crew sharp enough to read it: the Admiralty sent a <em>picket to look</em>, not a fleet to hold — the sloop says the fleet is far, cautious, or both. Reike boards with four <a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--admiralty-marines-steadfast-boarding-party\">Admiralty Marines (Steadfast boarding party)</a> — one minion group: 20 wounds, 3 ranks in group skills, weapons set to stun for a registered boarding. Honest papers: no roll — he is correct to the last button and thanks them. Contraband or false manifests: <strong>Hard Deception</strong> (his Discipline 4 misses very little), or <strong>Hard Skulduggery</strong> <em>before</em> the boarding to re-stow; a failed check costs confiscation and a log entry, not blood. Either way the inspection reaches the nav console — and if Osk's original is aboard, a marine finds a dark-lane chart annotated in a hand that is not the crew's, and Reike's eyebrows go up exactly once. He does not confiscate it. He <em>notes</em> it. <strong>Cut to Scene 6 mid-inspection.</strong></p>\n<p><strong>Advantage/Threat in the standoff:</strong></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Result showing</th>\n<th>Spend it as</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Advantage</td>\n<td>A hairline crack shows: Reike's marines trade a look at the word \"protection\"; Skell's recital stumbles, once, at the name Osk — the one name he will not say twice; Vhail's hand tightens on the slate at \"children\"; Nerra's smile stalls, once, at \"handshake codes.\"</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>A concession in the paper: strike one clause of Nerra's fine print, or win a named exemption in Reike's log.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>A private audience: one of the three steps aside with the crew, off the record, and says one true thing.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>The swarm gets bold: a hopeful hull makes a move on the station, and Reike's posture hardens for everyone.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>The three corners agree on exactly one thing — the crew is the problem — and all three levers press at once.</td>\n</tr>\n<tr>\n<td>Despair</td>\n<td>The inspection widens, immediately: Reike wants the aft hold opened <em>now</em>. Cut to Scene 6.</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"adm adm-danger\"><p class=\"adm-title\">If blasters come out</p><p>Be honest with yourself about the <a href=\"#\" class=\"xin\" data-nav=\"npc:ships--nas-steadfast-naboo-pattern-patrol-sloop\">NAS Steadfast, Naboo-pattern Patrol Sloop</a>: a patrol sloop's gun ladder against a century-old heirloom hull is not a fight, it is an arrest. Do not stage a space battle the crew can win — the sloop cripples their engines with throttled turbolaser fire, narrated rather than rolled, and the marines board under stun with Reike directing from cover (Tactical Direction; the fight is always the group, never the man). How everyone climbs down: any <em>lawful</em> proposal — \"we submit under protest, log it\" — stands Reike down instantly; Nerra interposes paper (\"a certification hearing needs living witnesses, Commander\"); Vhail kneels at the core and begins reading the necrology of Ruusan aloud — the dead of both armies, name by name — which no Admiralty crew will fire past; Skell — of all people — goes loudly, ostentatiously <em>compliant</em>, hands visible, claim restated for the log, because paper needs him alive; and a marine hesitating at an unlawful order is the crew's best lever. Remember what the <em>Steadfast</em> cannot do: no hyperdrive, no navicomputer — it arrived clamped to a fleet tender, and until the tender returns it can hold the station, not chase anyone up the dead Run. If they push through all of it: Contingencies.</p></div>\n\n<p><strong>Certification — the \"Speak to it\" stage.</strong> With Nerra aboard as guild observer: <strong>Average Negotiation</strong> or <strong>Average Charm</strong>, upgraded once for her practiced table manner — she <em>wants</em> to sign; the check is about whose terms. Honest testimony about the already-lit core adds a boost die; so does keeping Osk's promise — her name spoken into the carrier. Without Nerra — satisfying the old Republic handshake protocols cold — it is <strong>Hard Knowledge (Education)</strong>, and see Contingencies for what an uncertified claim is worth. Know the two numbers: the <strong>witness fee</strong> (1,200 — what certified witnesses of record earn) and the <strong>posted prize</strong> (12,000 — the guild's price for finding and relighting Vesta-9, which technically nobody on this field can claim, because nobody on this field lit it). The swarm has not worked that out. Nerra has. <strong>Success</strong> — the certificate issues, crew as witnesses of record, fee released; the prize stays on the guild's books. <strong>Triumph</strong> — she enters them as first-lighting claimants outright: the famous number, full honors, priority at future guild tables — and a debt to the guild with no line on the form. <strong>Threat</strong> — fine print: the certificate names the guild charting authority for the whole corridor. <strong>Despair</strong> — the certification packet copies wider than intended; someone the crew did not invite now holds a clean copy (GM only: the mole — <a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">faction clocks</a>).</p>"}, {"sid": "s7", "title": "Scene 6 — The Record", "html": "<p><strong>The situation.</strong> Trigger it at the height of the standoff — ideally mid-certification. Nerra's form has a line on it. So does Reike's fleet log. Both say the same thing — <em>Lighting party / responsible hand</em> — and everyone in the chamber has just heard it read aloud, and everyone is looking at the witnesses of record.</p>\n<blockquote>\n<p>Nerra's stylus stops over the line. \"Lighting party.\" She looks up, pleasant as weather. \"You were first aboard. Who do I write?\" Across the ring, Reike's adjutant has the same line open in the fleet log and is waiting with the patience of a man who is paid to wait. At the rail, Skell has his own stylus out, smiling like a man offering to split a bill. At the core, Vhail has stopped reading. She has not turned around.</p>\n</blockquote>\n<p><strong>What the crew is holding</strong> — take stock out loud, because the players may not realize it: Osk's claim that somebody has been flying the dead Run for years, and that the prizes follow them; the wake log — inside release, valid guild codes, cleaned up within hours; a docking cradle still warm, no ship anyone can find; a station three light-hours off every chart, lit by someone who knew where it was. Nobody else in the chamber has all of it. Two of the three corners have already guessed at part of it.</p>\n<p><strong>The choice belongs to the table, and it is not a roll:</strong> what goes on the record? The certificate is the founding paper of the reopened Run; it will be read for a century; their names are on it as witnesses. There is no wrong answer. Every answer is the scene.</p>\n<p><strong>Four wants, aimed at the paper:</strong></p>\n<ul>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--commander-joss-reike\">Commander Joss Reike</a> — the finding.</strong> <em>\"Unknown armed actor operating a dead lane with guild codes\"</em> is the exact line his log needs to make this corridor \"require naval protection.\" He will not lead them there; he does not have to. Say the stranger out loud and he thanks them, sincerely. Say nothing and he enters <em>\"lighting party: undetermined; witnesses uncooperative,\"</em> which is worse for them and better for him. And he has a personal stake: half the port already believes his own fleet lit it, and <em>\"lighting party: not the Admiralty\"</em> is the other line his log requires — witnessed, signed, preferably tonight.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--chartmistress-bel-nerra\">Chartmistress Bel Nerra</a> — the clean line.</strong> <em>\"Unknown hand; lane clear\"</em> is what she wants written, and she pays for it: strike her fine print, upgrade the witness charter, enter them as claimants for the famous number. She goes quiet at the handshake codes, quieter at the name Osk — and the moment she learns an <em>original</em> page exists, she offers real money on the spot: <strong>3,000 scrip</strong> for the page, rising toward the famous number for the book it came from, if the crew can produce it — or say where it lives. That is the sale Osk has refused for ten years, arriving at the crew's elbow hours after they watched Skell try to <em>collect</em> it at her bedside — the same appetite, with better manners. Her Deception 3 is for what the offer omits: where the book goes after. (GM only: to the patron's survey teams, within the month.)</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--captain-ferro-skell\">Captain Ferro Skell</a> — the co-signature.</strong> A fifth of the famous number, offered flat, to co-swear his finding: the lien stands, the chart was collateral, the claim is his — with the crew's names beside his as witnesses of record. It is Osk's promise sold hours after they made it, to the man who was at her bedside — and it is real money, tonight, no fine print. He watches them do the arithmetic and does not rush them. <em>(If the 250 was tendered, this bullet never happens: he has no paper, and he knows better than to bluff Nerra.)</em></li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"npc:session-one--keeper-adressa-vhail\">Keeper Adressa Vhail</a> — the truth at the core.</strong> She wants nothing written. She wants it <em>said</em>, at the core, honestly — and afterward she finds whoever spoke alone, asks exactly one question — <em>\"Who opened this door — and did you say so?\"</em> — and leaves without pressing. A crew that told the truth leans her report toward the wardens who think the seals are being worked, not merely failing — the Unbroken Seal's argument; a crew that certified it clean is entered on her slate, in the margin for the living.</li>\n</ul>\n<p><strong>Decision matrix</strong> — what the crew puts on the record, and what it costs and seeds:</p>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th>If the crew…</th>\n<th>Costs now</th>\n<th>Seeds for Act 1</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Names the stranger on the record</td>\n<td>Reike's finding — the Annexation gets its founding paperwork with their names on it — and the certification packet carries the codes to the guild's desks (GM: the patron now knows the crew <em>noticed</em>)</td>\n<td>The <em>Steadfast</em>'s tender returns with orders; guild doors cool; the Weeding takes an interest — a rival withdraws, a magistrate is helpful, luck the crew did not earn.</td>\n</tr>\n<tr>\n<td>Certifies it clean — \"unknown hand, lane clear\"</td>\n<td>The fee, the guild's warmth, and a lie with their names on the Run's founding paper</td>\n<td>Every guild door opens; the Conclave of Charts arrives with the crew as trusted witnesses — and the first person who reads the wake log carefully knows what they left out. <em>The Memory Market</em> lands personally: provenance is a thing they have already fudged.</td>\n</tr>\n<tr>\n<td>Backs Skell's lien</td>\n<td>Osk hears before she dies — the orderly tells the crew she asked for their names — and the port hears too; the cut is real money, tonight</td>\n<td>By morning the guild buys Skell's paper at triple its face: the <em>Overdue</em> is now a creditor with the crew's signature on his founding claim, and every debt he buys up the Run travels with a precedent they co-signed.</td>\n</tr>\n<tr>\n<td>Hands the evidence to Vhail</td>\n<td>She must choose which half of her order she reports to — keys or children</td>\n<td>The Vigil learns someone is opening doors on purpose; sealed places open to the crew, and both halves of the order come asking what else they saw. <em>The Sealed Enclave</em> gains a witness.</td>\n</tr>\n<tr>\n<td>Sells Osk's page — or the book's address — to Nerra</td>\n<td>Money now, at the price of a promise made hours ago; the port learns who sold it</td>\n<td>By morning the guild has bought Skell's debt-paper at triple its face, and a probate lien follows it to the infirmary; the guild — and the guild's patron — finally get what they waited ten years for, and the prizes stop stalling and start <em>accelerating</em>, in an order nobody at this table chose (Dial 3). Osk hears before she dies.</td>\n</tr>\n<tr>\n<td>Keeps the page and says nothing</td>\n<td>Perfect politeness from Nerra, an \"undetermined\" finding from Reike, a margin note on Vhail's slate, and Skell's flat promise to collect up the Run</td>\n<td>The crew holds the original's first page and a standing invitation to the rest — the return to Osk becomes Act 1's first milestone, and when the book comes home with them it is the campaign's engine, and the target on their hull.</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"adm adm-note\"><p class=\"adm-title\">The wake log is on the record</p><p>Whatever the crew said, the station's own logs carry the handshake codes and the cradle's temperature, and Nerra's certification packet carries the logs. Nobody in the standoff has read them carefully yet; do not spring it tonight. Whoever reads that packet later (an Admiralty analyst, a curious archivist, the reader Dial 3 put behind the guild's desks) will know the witnesses of record stood next to the evidence and chose what to say about it.</p></div>\n\n<div class=\"adm adm-note\"><p class=\"adm-title\">The witness rule, if the Force comes out</p><p>Nothing in this scene calls on the Force, and nothing should — the era's gift is an event, not a set piece, and it will find the crew on its own schedule. But if a PC <em>chooses</em> to use it openly here, apply the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:force\">witness rule</a> — disposition shifts one step, awe or fear — and the \"community\" watching is <em>three factions and a creditor at once</em>: Reike's log acquires a second finding, Vhail stops being silent, Nerra's fine print grows a clause, and Skell's sworn account gains a chapter. Setback die on social checks with all of them until the crew addresses what was seen.</p></div>\n\n<p><em>If open Force use happened in front of the factions:</em></p>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m01-2\" data-args=\"{&quot;faction&quot;: &quot;The Awakening&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;Open Force use before three factions at the Vesta-9 relight&quot;}\"><button class=\"btn\">Advance clock: The Awakening +1</button><span class=\"runact-desc\">Open Force use before three factions at the Vesta-9 relight</span></div>"}, {"sid": "s8", "title": "The Out", "html": "<blockquote>\n<p>The corridor is open. On the boards it reads like a sentence finished after sixty years: VESTA-9 — LIT — RUN CLEAR TO ENARC. The Steadfast holds station like the corridor already belongs to it, the guild packet burns for home with signed paper aboard, and somewhere sunward a keeper is reading the dead's names over a machine. Every one of them wrote down your names.</p>\n</blockquote>\n<p><strong>The return.</strong> If twenty minutes remain, fly it tonight: back on the Drift, the infirmary orderly flags the crew down before they reach their pad — <em>\"she wants to see you.\"</em> The swarm got home ahead of them; Osk already knows what went on the record, and whether a certain name went into the carrier. If they kept faith, this is the inheritance scene (Scene 3's last beat): the whole book, the whole story, and a session that ends with the rutter under an arm and ENARC — DARK on the boards. Play it, don't summarize it. If the clock is gone, it opens session two and loses nothing.</p>\n<p><strong>Debts on-screen</strong> before the bookkeeping: Grell's cut (if signed) transmitted with bad grace and a note that his door is open; Marrow's wager paid at whichever cantina comes next; the promise to Osk kept or broken, said aloud either way.</p>\n<p><strong>Bookkeeping</strong> — in order:</p>\n<ol>\n<li><strong>Update the <a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">beacon board</a>.</strong> Witness fee <strong>1,200</strong>, paid to the certified witnesses of record — Grell's signed cut comes off the top and should hurt (if the Triumph awarded the famous number, Grell will argue his percentage was \"of the prize\"; he is wrong, and he will try). The posted prize, unless awarded, stays on the guild's books — the first moment anyone at the table should wonder where the guild's money comes from. Nerra's standing witness-charter offer: <strong>250 scrip per certified lighting</strong> plus guild accreditation — worth more than the fee within three sessions, which is exactly how the Lamplighters collect people.</li>\n</ol>\n<div class=\"runact\" data-kind=\"beacon\" data-aid=\"m01-3\" data-args=\"{&quot;name&quot;: &quot;Vesta-9&quot;, &quot;status&quot;: &quot;lit&quot;, &quot;corridor&quot;: &quot;the Run past Vesta-9 (toward Enarc)&quot;, &quot;certified&quot;: &quot;Chartmistress Bel Nerra (Lamplighters)&quot;, &quot;fee&quot;: &quot;1,200 sector scrip, paid to the witnesses of record&quot;, &quot;followed&quot;: &quot;Vigil, Admiralty, Lamplighters, the Overdue — and one uncounted observer&quot;}\"><button class=\"btn\">Update beacon map: Vesta-9</button><span class=\"runact-desc\">lit · 1,200 sector scrip, paid to the witnesses of record</span></div>\n\n<ol>\n<li><strong>Log the fragments.</strong> Osk's page was logged in Scene 3 (press it there if it never got pressed). <em>Optional, only if you want the Force in the room at all tonight:</em> that night, docked wherever they sleep, a gifted crew member dreams — a canyon full of light, the light is people, all saying one word together that they can never quite hear. Not a scary dream; the kind you try to get back into. It recurs. This is the era's pull toward the Valley (Dial 2), not anything the beacon did — nobody saw it, nobody knows, and it is theirs to mention or keep. If used:</li>\n</ol>\n<div class=\"runact\" data-kind=\"fragment\" data-aid=\"m01-4\" data-args=\"{&quot;name&quot;: &quot;The canyon dream (one of the crew&#x27;s)&quot;, &quot;form&quot;: &quot;living witness — a gifted PC&quot;, &quot;tag&quot;: &quot;Jedi&quot;, &quot;question&quot;: &quot;What is the Valley?&quot;, &quot;claim&quot;: &quot;the canyon is full of light, and the light is people&quot;, &quot;holder&quot;: &quot;crew&quot;, &quot;status&quot;: &quot;trusted&quot;}\"><button class=\"btn\">Issue fragment: The canyon dream (one of the crew&#x27;s)</button><span class=\"runact-desc\">Jedi · bears on “What is the Valley?”</span></div>\n\n<ol>\n<li><em>The quiet one — GM only, where the players cannot see. The clerk in guild grey files its census: the crew, the ship, the certified corridor, what they said on the record — and, if it was ever visible on a console or in a hand, the rutter. The Inheritors did not light this beacon; they are the second party to arrive at a door somebody else opened, and they intend to be first through the next one.</em></li>\n</ol>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m01-5\" data-args=\"{&quot;faction&quot;: &quot;Inheritors&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;Dial 3 — the observer files the Vesta-9 census: the crew, what they testified, and what they carry are now in an Inheritor file&quot;}\"><button class=\"btn\">Advance clock: Inheritors +1</button><span class=\"runact-desc\">Dial 3 — the observer files the Vesta-9 census: the crew, what they testified, and what they carry are now in an Inheritor file</span></div>\n\n<div class=\"runact\" data-kind=\"thread\" data-aid=\"m01-6\" data-args=\"{&quot;ledger&quot;: &quot;knows&quot;, &quot;who&quot;: &quot;The Inheritors&quot;, &quot;what&quot;: &quot;The Vesta-9 file: the crew, the ship, the certified corridor, what they said on the record — and, if it was ever visible, the rutter&quot;, &quot;since&quot;: &quot;S1&quot;, &quot;notes&quot;: &quot;Filed by the clerk in guild grey; first contact will be helpful&quot;}\"><button class=\"btn\">Log thread (knows): The Inheritors</button><span class=\"runact-desc\">The Vesta-9 file: the crew, the ship, the certified corridor, what they said on the record — and, if it was ever visible, the rutter</span></div>\n\n<ol>\n<li><strong>Start the pressure dials honestly.</strong> The Admiralty's reveal is itself pressure — a phantom navy now holds the corridor:</li>\n</ol>\n<div class=\"runact\" data-kind=\"clock\" data-aid=\"m01-7\" data-args=\"{&quot;faction&quot;: &quot;Admiralty&quot;, &quot;delta&quot;: 1, &quot;note&quot;: &quot;The reveal at Vesta-9 — a fleet nobody knew existed now holds the first relit corridor&quot;}\"><button class=\"btn\">Advance clock: Admiralty +1</button><span class=\"runact-desc\">The reveal at Vesta-9 — a fleet nobody knew existed now holds the first relit corridor</span></div>\n\n<ol>\n<li><strong>XP:</strong> 15–20; <strong>+5</strong> for strong Obligation play — a PC who let the grounding cost them something real, not just narrated it.</li>\n</ol>\n<p><strong>The closing image</strong>, said in your own words: the crew came to Okrent's Drift as nobody. They leave with a corridor open behind them, three factions holding files with their names — the warden's slate, the Admiralty's log, the guild's certificate — and an enemy holding a claim with their names in it, however it reads. And someone nobody counted has a file too — and theirs is the only one that marks what the crew is carrying, and what they left off the paper.</p>"}, {"sid": "s9", "title": "The Handoff — what session two reads", "html": "<p>Before the table stands up, mark which of these are true. <span class=\"xref\">Module 02's carry-forward table</span> reads these rows verbatim — this is the contract between the sessions:</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Flag</th>\n<th>Set it if…</th>\n<th>Session two consequence (short form)</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Named the stranger on the record</strong></td>\n<td>They testified an unknown hand lit Vesta-9 deliberately (Reike's \"unknown armed actor\" finding)</td>\n<td>The Founding wing arrives at Enarc holding a mandate; the tender is scheduled.</td>\n</tr>\n<tr>\n<td><strong>Certified it clean</strong></td>\n<td>The paper says \"unknown hand, lane clear\"</td>\n<td>Guild warmth — and the guild's charting-authority fine print rides into a Hutt court.</td>\n</tr>\n<tr>\n<td><strong>Backed Skell's lien</strong></td>\n<td>They co-swore his finding at certification</td>\n<td>The <em>Overdue</em> reaches Enarc as a creditor with the crew's signature on his claim — and the court hears his version <em>notarized</em>.</td>\n</tr>\n<tr>\n<td><strong>Handed the evidence to Vhail</strong></td>\n<td>The Vigil holds the wake-log evidence</td>\n<td>A circuit ship shadows the crew, census-curious about everything.</td>\n</tr>\n<tr>\n<td><strong>Sold Osk's page — or the book's address</strong></td>\n<td>Nerra (or anyone) bought it</td>\n<td>The Scrub is <em>ahead</em> of the crew from now on.</td>\n</tr>\n<tr>\n<td><strong>Kept the page / hold the book</strong></td>\n<td>The original (or the inheritance) travels with them</td>\n<td>Boost dice on the dark legs — and a target on the hull.</td>\n</tr>\n<tr>\n<td><strong>Returned to Osk</strong></td>\n<td>The inheritance scene was played (tonight or next session)</td>\n<td>The full testimony names the closed kingdom at Enarc: her survey skirted it once, running dark, and was never challenged.</td>\n</tr>\n<tr>\n<td><strong>However it went with Skell</strong></td>\n<td>Bought off, faced down, bloodied, or never met</td>\n<td>The <em>Overdue</em> reaches Enarc ahead of the crew — and the first thing Skell sells the court is the crew's biography.</td>\n</tr>\n<tr>\n<td><strong>However the Record went</strong></td>\n<td>Always</td>\n<td>Breck — the Admiralty's envoy at Enarc — has read the certificate before the crew arrives. Founding papers follow you.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Schedule the warm knock:</strong> within weeks of Vesta-9, the Inheritors' first contact arrives <em>helpful</em> — coin, rescue, answers, no visible strings (Meru Vane's people; see Vigil &amp; Inheritors). Aim it at session three, so the faction has a face before it has a file.</p>\n<p><strong>One open door, keyed to the loudest flag:</strong> kept the page — the first leg is exactly where her margins say, and something in a margin is waiting on their first Chart-it check · named the stranger — a courteous Admiralty letter at the next port, asking them to carry something · certified clean — Nerra's 250-scrip charter dangles the next dark beacon, and the wager board has posted odds on the crew, which is how they learn they are famous · sold the book — a survey team nobody hired leaves Bannistar ahead of them, up the lane they sold · fee unclaimed — Nerra's backdating favor is on the table, destination attached.</p>"}, {"sid": "s10", "title": "Contingencies", "html": "<div class=\"adm adm-danger\"><p class=\"adm-title\">They attack the Steadfast</p><p>The sloop cripples their d
