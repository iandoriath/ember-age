<script id="app-code">
const NPCS   = /*__NPCS__*/[];
const GROUPS = /*__GROUPS__*/[];
const PAGES  = /*__PAGES__*/[];
const MODULES= /*__MODULES__*/[];
const SEED   = /*__SEED__*/{};
const RETIRED_Q = /*__RETIRED_Q__*/{};
const TRACKDOCS = /*__TRACKDOCS__*/{};
const CREW   = /*__CREW__*/[];
const HEAD_STATIC = /*__HEAD__*/"";
const SKELETON = /*__SKEL__*/"";

/* ------------------------------------------------ state & sync */
const KEY = "emberAgeGM.v1";
function freshState(){ const s = JSON.parse(JSON.stringify(SEED)); s.rev = 0; return s; }
const stateEl = document.getElementById("gm-state");
let EMBED = freshState();
try{ if(stateEl) EMBED = Object.assign(freshState(), JSON.parse(stateEl.textContent)); }catch(e){}
let S = EMBED;
try{
  const ls = JSON.parse(localStorage.getItem(KEY));
  if(ls && (ls.rev||0) > (EMBED.rev||0)) S = Object.assign(freshState(), ls);
}catch(e){}
/* Saved state outlives design changes: retire old Questions (remapping their fragments), keep the seed's
   Question order, refresh clock cracks and the seeded pre-S1 ledger rows, without touching anything the GM entered. */
function migrateState(s){
  let changed = false;
  const seedQ = SEED.questions || [];
  (s.fragments || []).forEach(f => { if(f.question && Object.prototype.hasOwnProperty.call(RETIRED_Q, f.question)){ f.question = RETIRED_Q[f.question] || ""; changed = true; } });
  const kept = (s.questions || []).filter(q => !Object.prototype.hasOwnProperty.call(RETIRED_Q, q));
  const next = seedQ.concat(kept.filter(q => !seedQ.includes(q)));
  if(JSON.stringify(next) !== JSON.stringify(s.questions || [])){ s.questions = next; changed = true; }
  (SEED.clocks || []).forEach(sc => {
    const c = (s.clocks || []).find(x => x.faction === sc.faction);
    if(!c){ (s.clocks = s.clocks || []).push(JSON.parse(JSON.stringify(sc))); changed = true; }
    else if(c.crack !== sc.crack){ c.crack = sc.crack; changed = true; }
  });
  (SEED.knows || []).forEach(sk => {
    const k = (s.knows || []).find(x => x.who === sk.who && x.since === sk.since);
    if(k && (k.what !== sk.what || k.notes !== sk.notes)){ k.what = sk.what; k.notes = sk.notes; changed = true; }
  });
  return changed;
}

let artifactNS = null, downloadsNS = null, readOnly = false;
(async () => {

function dirty(){ return (S.rev||0) > (EMBED.rev||0); }
function updateSyncUI(){
  const chip = document.getElementById("syncchip");
  if(!artifactNS || readOnly){ chip.style.display = "none"; }
  else{
    chip.style.display = "";
    chip.className = "hbtn" + (dirty() ? " dirty" : "");
    chip.textContent = dirty() ? `Sync (${(S.rev||0)-(EMBED.rev||0)} change${(S.rev-EMBED.rev)===1?"":"s"})` : "Synced ✓";
  }
  const ban = document.getElementById("syncbanner");
  if(artifactNS && !readOnly && dirty() && (EMBED.rev||0) > 0){
    ban.style.display = "block";
    ban.innerHTML = `This browser holds changes newer than the page's live copy.
      <button class="hbtn" onclick="syncNow()">Publish local changes</button>
      <button class="hbtn" onclick="keepCloud()">Discard local, keep live copy</button>`;
  } else ban.style.display = "none";
}
function keepCloud(){ S = JSON.parse(JSON.stringify(EMBED)); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} renderAll(); }

function stateJSON(){ return JSON.stringify(S).replace(/</g, "\\u003c"); }
function renderDocument(){
  const code = document.getElementById("app-code").textContent;
  const style = document.getElementById("app-style").textContent;
  const SC = "script";
  return "<!doctype html>\n<html lang=\"en\">\n<head>\n" + HEAD_STATIC +
    "\n<style id=\"app-style\">" + style + "</style>\n</head>\n<body>\n" + SKELETON +
    "\n<" + SC + " id=\"gm-state\" type=\"application/json\">" + stateJSON() + "</" + SC + ">\n" +
    "<" + SC + " id=\"app-code\">" + code + "</" + SC + ">\n</body>\n</html>\n";
}
async function syncNow(){
  if(!artifactNS) return;
  try{ sessionStorage.setItem("ea.resume", JSON.stringify({tab: cur})); }catch(e){}
  const chip = document.getElementById("syncchip");
  chip.textContent = "Syncing…";
  try{
    await artifactNS.publish(renderDocument());
    /* on success the shell reloads this view with the new embedded state */
  }catch(err){
    const code = err && err.code;
    if(code === "conflict"){ /* shell reloads to the winning version; local state stays in localStorage and the banner offers the merge choice */ }
    else if(code === "not_writer" || code === "not_granted" || code === "not_declared"){ readOnly = true; updateSyncUI(); }
    else if(code === "rate_limited"){ chip.textContent = "Rate limited — try again in a moment"; setTimeout(updateSyncUI, 4000); }
    else { chip.textContent = "Sync failed — will retry on next Sync"; setTimeout(updateSyncUI, 4000); }
  }
}

async function exportState(){
  const data = JSON.stringify(S, null, 2);
  const fname = "ember-age-save-" + new Date().toISOString().slice(0,10) + ".json";
  if(downloadsNS){
    try{ await downloadsNS.save({filename: fname, data}); }catch(err){ /* declined or unavailable — fall through */
      if(err && (err.code === "declined" || err.code === "rate_limited")) return;
      tryBlobDownload(fname, data);
    }
    return;
  }
  tryBlobDownload(fname, data);
}
function tryBlobDownload(fname, data){
  const blob = new Blob([data], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = fname; a.click();
  URL.revokeObjectURL(a.href);
}
function importState(inp){
  const f = inp.files[0]; if(!f) return;
  f.text().then(t=>{ S = Object.assign(freshState(), JSON.parse(t)); save(); renderAll(); alert("Save imported. Use Sync to publish it to the live copy."); })
   .catch(()=>alert("Could not read that file."));
  inp.value = "";
}

let qsSel = 0, qsHits = [];
function qsIndex(){
  const out = [];
  for(const n of NPCS) out.push({k:"NPC", t:n.name, s:(n.name+" "+n.faction+" "+(n.role||"")).toLowerCase(), go:()=>navTo("npc:"+n.id)});
  for(const pg of PAGES) out.push({k:pg.section, t:pg.title, s:pg.title.toLowerCase(), go:()=>navTo("page:"+pg.section+":"+pg.id)});
  for(const m of MODULES) m.scenes.forEach((sc,i)=>out.push({k:"scene", t:m.title+" · "+sc.title, s:(m.title+" "+sc.title).toLowerCase(), go:()=>{ runGo(m.id,i); go("run"); }}));
  return out;
}
let QS = null;
function qsOpen(){ QS = QS || qsIndex(); const q = document.getElementById("qs"); q.hidden = false; const i = document.getElementById("qs-in"); i.value = ""; qsRender(""); i.focus(); }
function qsClose(){ document.getElementById("qs").hidden = true; }
function qsRender(v){
  const q = v.trim().toLowerCase();
  qsHits = q ? QS.filter(x=>x.s.includes(q)).slice(0,14) : [];
  qsSel = 0;
  document.getElementById("qs-out").innerHTML = qsHits.map((h,i)=>`<button class="${i===qsSel?'on':''}" onclick="qsPick(${i})"><span class="k">${esc(h.k)}</span><span>${esc(h.t)}</span></button>`).join("");
}
function qsPick(i){ const h = qsHits[i]; if(!h) return; qsClose(); h.go(); }
document.addEventListener("keydown", e=>{
  const inField = ["INPUT","TEXTAREA","SELECT"].includes(e.target.tagName);
  const qs = document.getElementById("qs");
  if(!qs.hidden){
    if(e.key==="Escape"){ qsClose(); }
    else if(e.key==="ArrowDown"){ e.preventDefault(); qsSel = Math.min(qsHits.length-1, qsSel+1); qsRender(document.getElementById("qs-in").value); }
    else if(e.key==="ArrowUp"){ e.preventDefault(); qsSel = Math.max(0, qsSel-1); qsRender(document.getElementById("qs-in").value); }
    else if(e.key==="Enter"){ qsPick(qsSel); }
    return;
  }
  if(inField) return;
  if(e.key==="/"){ e.preventDefault(); qsOpen(); }
  else if(cur==="run" && (e.key==="]"||e.key==="[")){
    const m = MODULES.find(x=>x.id===(S.run||{}).cur) || MODULES[0]; if(!m) return;
    const at = runState(m.id).at ?? -1; runGo(m.id, Math.max(-1, Math.min(m.scenes.length-1, at + (e.key==="]"?1:-1))));
  }
});

function runAction(div){
  const kind = div.dataset.kind, aid = div.dataset.aid;
  let args = {};
  try{ args = JSON.parse(div.dataset.args); }catch(e){ return; }
  const inLibrary = aid.startsWith("npc-");
  const m = MODULES[0], rs = inLibrary ? runState("npc") : runState(m.id);
  if(rs.actions[aid]) return;
  if(kind === "fragment"){
    if(args.question && !S.questions.includes(args.question)) S.questions.push(args.question);
    S.fragments.push({name:args.name||"", form:args.form||"", tag:args.tag||"Civic", question:args.question||"",
                      claim:args.claim||"", holder:args.holder||"crew", status:args.status||"trusted"});
  } else if(kind === "clock"){
    const c = S.clocks.find(c=>c.faction===args.faction);
    if(c){ c.value = Math.max(0, Math.min(6, c.value + (args.delta||1)));
           if(args.note) c.notes = (c.notes? c.notes+"\n" : "") + args.note; }
  } else if(kind === "beacon"){
    const b = S.beacons.find(b=>b.name===args.name);
    if(b) Object.assign(b, args);
    else S.beacons.push({name:args.name||"", status:args.status||"lit", corridor:args.corridor||"",
                         certified:args.certified||"", fee:args.fee||"", followed:args.followed||""});
  } else if(kind === "thread"){
    if(args.ledger === "knows"){
      (S.knows=S.knows||[]).push({who:args.who||"", what:args.what||"", since:args.since||"", notes:args.notes||""});
    } else if(args.ledger === "holds"){
      (S.holds=S.holds||[]).push({item:args.item||"", holder:args.holder||"", since:args.since||"", notes:args.notes||""});
    } else if(args.ledger === "debts"){
      (S.debts=S.debts||[]).push({who:args.who||"", whom:args.whom||"", what:args.what||"", status:args.status||"open"});
    } else return;
  } else return;
  rs.actions[aid] = true;
  save(); trackersTab(); if(inLibrary){ npcTab(); } markDoneActions(m.id);
}

          ${c.vehicles.map(v => `<div class="k">Ship</div><div class="small"><b>${esc(v.name)}</b> · Sil ${v.silhouette} · Spd ${v.speed} · Hdl ${v.handling} · Def ${v.def_fore}/${v.def_aft} · Armor ${v.armor} · HT ${v.hull} · SS ${v.strain} · ${esc(v.hyperdrive)}${v.weapons.length ? " · " + esc(v.weapons.join("; ")) : ""}</div>`).join("")}

function npcTab(){

function npcList(){
  const q = npcQ.trim().toLowerCase();
  const hits = NPCS.filter(n =>
    (npcKind==="All"||n.kind===npcKind) &&
    (npcGroup==="all"||n.group===npcGroup) &&
    (!q || n.search.includes(q)));
  const gi = (npcGroup!=="all" && !q) ? GROUPS.find(g=>g.slug===npcGroup) : null;
  document.getElementById("npclist").innerHTML =
    (gi?`<div class="card groupintro doc small">${gi.intro}</div>`:"") +
    `<p class="muted small">${hits.length} of ${NPCS.length} blocks</p>` +
    hits.map(n=>`
      <details class="npc" id="npc-${n.id}" ${hits.length===1||n.id===npcFocus?"open":""}>
        <summary>
          <span class="nm">${esc(n.name)}</span>
          <span class="badge ${n.kind}">${n.kind}</span>
          <span class="fac">${esc(n.faction)}${n.role?" · "+esc(n.role):""}</span>
          ${n.derived?`<span class="drv">${esc(n.derived)}</span>`:""}
        </summary>
        <div class="body doc">${n.html}</div>
      </details>`).join("") || `<p class="muted">Nothing matches.</p>`;
}

function clockSet(i,v){ S.clocks[i].value = (S.clocks[i].value===v? v-1 : v); save(); trackersTab(); if(cur==="run") runTab(); }
function pushItem(key,inputId){ const el=document.getElementById(inputId); if(el.value.trim()){ S[key].push(el.value.trim()); save(); trackersTab(); } }
function addFragment(){
  const g=id=>document.getElementById(id).value;
  if(!g("f-name").trim()) return;
  const q=g("f-q").trim();
  if(q && !S.questions.includes(q)) S.questions.push(q);
  S.fragments.push({name:g("f-name"),form:g("f-form"),tag:g("f-tag"),question:q,claim:g("f-claim"),holder:g("f-holder"),status:g("f-status")});
  save(); trackersTab();
}
function addBeacon(){
  const g=id=>document.getElementById(id).value;
  if(!g("b-name").trim()) return;
  S.beacons.push({name:g("b-name"),status:g("b-status"),corridor:g("b-corridor"),certified:g("b-certified"),fee:g("b-fee"),followed:g("b-followed")});
  save(); trackersTab();
}
function addKnow(){
  const g=id=>document.getElementById(id).value;
  if(!g("k-who").trim()) return;
  (S.knows=S.knows||[]).push({who:g("k-who"),what:g("k-what"),since:g("k-since"),notes:g("k-notes")});
  save(); trackersTab();
}
function addHold(){
  const g=id=>document.getElementById(id).value;
  if(!g("h-item").trim()) return;
  (S.holds=S.holds||[]).push({item:g("h-item"),holder:g("h-holder"),since:g("h-since"),notes:g("h-notes")});
  save(); trackersTab();
}
function addDebt(){
  const g=id=>document.getElementById(id).value;
  if(!g("d-who").trim()) return;
  (S.debts=S.debts||[]).push({who:g("d-who"),whom:g("d-whom"),what:g("d-what"),status:"open"});
  save(); trackersTab();
}
function questionSummary(){
  return S.questions.map(q=>{
    const fs = S.fragments.filter(f=>f.question===q);
    const tags = [...new Set(fs.map(f=>f.tag))];
    let note = "";
    if(fs.length>=3) note = tags.length>=3 ? `<span class="ready">Reconstruction ready — all three tags: upgrade ability once</span>`
      : tags.length===1 ? `<span class="ready">Reconstruction ready</span> · <span class="bias">single tag: upgrade difficulty once</span>`
      : `<span class="ready">Reconstruction ready</span>`;
    return `<div class="qcard"><b>${esc(q)}</b> — ${fs.length} fragment${fs.length===1?"":"s"}
      ${tags.map(t=>`<span class="tag ${esc(t)}">${esc(t)}</span>`).join(" ")} ${note?"· "+note:""}</div>`;
  }).join("");
}

/* ------------------------------------------------ Session log tab */
function logTab(){
  const el = document.getElementById("tab-log");
  const F = [["title","Title"],["date","Date"],["where","Where (system / world / beacon)"],["obligation","Obligation triggered"],
             ["beacons","Beacons (relit / attempted / learned of)"],["fragments","Fragments gained (name — tag — Question)"],
             ["factions","Factions moved"],["debts","Debts & favors"],["xp","XP awarded"],["line","The line of the night"]];
  el.innerHTML = `
    <div class="card"><h2 style="margin:.1rem 0;color:var(--gold)">New session entry</h2>
      <div class="formgrid">
        ${F.map(([k,lbl])=>`<div class="${["where","fragments","factions","debts","line","beacons","obligation"].includes(k)?"wide":""}">
          <label>${lbl}</label><input id="s-${k}"></div>`).join("")}
        <div style="align-self:end"><button class="btn" onclick="addSession()">Add session ${S.sessions.length+1}</button></div>
      </div></div>
    ${S.sessions.map((s,i)=>`
      <div class="card sess">
        <div style="display:flex;justify-content:space-between;align-items:baseline">
          <h3>Session ${i+1} — ${esc(s.title||"untitled")} <span class="muted small">${esc(s.date||"")}</span></h3>
          <span class="rowbtns"><button title="copy as markdown" onclick="copySession(${i})">⧉</button>
          <button title="delete" onclick="if(confirm('Delete this session entry?')){S.sessions.splice(${i},1);save();logTab()}">✕</button></span>
        </div>
        <dl>${F.slice(2).map(([k,lbl])=>s[k]?`<dt>${lbl}</dt><dd>${esc(s[k])}</dd>`:"").join("")}</dl>
      </div>`).reverse().join("")}`;
}
function addSession(){
  const keys = ["title","date","where","obligation","beacons","fragments","factions","debts","xp","line"];
  const s = {}; keys.forEach(k=>s[k]=document.getElementById("s-"+k).value);
  if(!s.title.trim()) { alert("Give it at least a title."); return; }
  S.sessions.push(s); save(); logTab();
}
function copySession(i){
  const s = S.sessions[i];
  const md = `## Session ${i+1} — ${s.title} (${s.date})\n\n**Where:** ${s.where}\n**Obligation triggered:** ${s.obligation}\n**Beacons:** ${s.beacons}\n**Fragments gained:** ${s.fragments}\n**Factions moved:** ${s.factions}\n**Debts & favors:** ${s.debts}\n**XP awarded:** ${s.xp}\n**The line of the night:** ${s.line}\n`;
  navigator.clipboard ? navigator.clipboard.writeText(md).then(()=>alert("Copied as markdown."))
    : alert("Clipboard unavailable — select and copy:\n\n"+md);
}

/* ------------------------------------------------ page tabs (reference / setting) */
const pageSel = {reference:null, setting:null};
function pagesTab(section){
  const el = document.getElementById("tab-"+section);
  const list = PAGES.filter(p=>p.section===section);
  if(!pageSel[section]) pageSel[section] = list[0].id;
  const curP = list.find(p=>p.id===pageSel[section]) || list[0];
  el.innerHTML = `<div class="cols">
    <div class="side">${section==="reference" ? minionCalc() : ""}
      ${list.map(p=>`<button class="${p.id===curP.id?'on':''}" onclick="pageSel['${section}']='${p.id}';pagesTab('${section}')">${esc(p.title)}</button>`).join("")}
    </div>
    <div class="pane"><div class="card doc">${curP.html}</div></div>
  </div>`;
  if(section==="reference" && document.getElementById("mc-out")) mcOut();
}
function minionCalc(){
  return `<div class="grp">Minion group math</div>
    <div style="padding:.2rem .5rem .5rem">
      <label>WT each × count</label>
      <div style="display:flex;gap:.3rem">
        <input id="mc-wt" type="number" value="5" min="1" style="width:60px" oninput="mcOut()">
        <input id="mc-n" type="number" value="4" min="1" style="width:60px" oninput="mcOut()">
      </div>
      <div id="mc-out" class="small muted" style="margin-top:.3rem"></div>
    </div>`;
}
function mcOut(){
  const wt=+document.getElementById("mc-wt").value||0, n=+document.getElementById("mc-n").value||0;
  document.getElementById("mc-out").innerHTML =
    `Group WT <b style="color:var(--gold)">${wt*n}</b> · group skills at <b style="color:var(--gold)">${Math.max(0,n-1)}</b> ranks<br>
     one minion drops at ${Array.from({length:n},(_,i)=>wt*(i+1)).join(", ")} total damage`;
}
/* ------------------------------------------------ boot */
function renderAll(){ applyFs(); nav(); runTab(); crewTab(); npcTab(); trackersTab(); logTab(); pagesTab("reference"); pagesTab("setting");
  if(document.getElementById("mc-out")) mcOut(); updateSyncUI(); }
window.addEventListener("hashchange",()=>{ const h=location.hash.replace("#",""); if(TABS.some(t=>t[0]===h)||SUB[h]){ go(h); } });
renderAll();
</script>
