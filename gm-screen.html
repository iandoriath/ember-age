aves the lie. third succession from bane: young as sith dynasties go, consolidating, and in no hurry, which is precisely why patience costs them nothing. their goals and machinations, and the one set piece that shows their work, follow the two stat blocks."}, {"id": "keepers--the-patient-master", "name": "The Patient Master", "kind": "Nemesis", "typeline": "Nemesis", "faction": "the Sith line (Dial 1)", "role": "Darth Veritis; stats for completeness only", "derived": "Soak 4 · Wounds 18 · Strain 18 · M/R Defense 0/0", "group": "keepers", "html": "<p><em>Nemesis — the Sith line (Dial 1) — Darth Veritis; stats for completeness only</em></p>\n<blockquote>\n<p>Somewhere, a person of modest reputation and an excellent memory watches lanes relight, and is pleased with the harvest coming in.</p>\n</blockquote>\n<p><strong>DO NOT PUT ON-SCREEN.</strong> This block exists so the GM knows what sits at the top of the era; the Patient Master should not appear in this campaign's span. Run them as an absence (see Using them).</p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Brawn</th>\n<th style=\"text-align: center;\">Agility</th>\n<th style=\"text-align: center;\">Intellect</th>\n<th style=\"text-align: center;\">Cunning</th>\n<th style=\"text-align: center;\">Willpower</th>\n<th style=\"text-align: center;\">Presence</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">4</td>\n<td style=\"text-align: center;\">3</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 4 · Wounds 18 · Strain 18 · M/R Defense 0/0</strong></p>\n<ul>\n<li><strong>Skills:</strong> Athletics 2, Coercion 3, Discipline 4, Knowledge (Lore) 2, Leadership 2, Lightsaber 4, Resilience 3</li>\n<li><strong>Talents:</strong> Adversary 2 (<em>upgrade the difficulty of all combat checks targeting her twice</em>), Hawk Bat =\"text-align: center;\">5</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">2</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Soak 4 · Wounds 18 · Strain 20 · M/R Defense 2/3</strong></p>\n<ul>\n<li><strong>Skills:</strong> Athletics 2, Brawl 2, Charm 3, Cool 3, Deception 3, Knowledge (Core Worlds) 3, Melee 3, Perception 2, Ranged (Heavy) 2, Ranged (Light) 3, Stealth 3, Vigilance 4</li>\n<li><strong>Talents:</strong> Adversary 3 (<em>upgrade the difficulty of all combat checks targeting them three times</em>), Intense Focus (<em>maneuver: suffer 1 strain to upgrade the ability of their next skill check once</em>), Stalker 2 (<em>add two boost dice to their Coordination and Stealth checks</em>), Uncanny Senses 2 (<em>add two boost dice to their Perception checks</em>)</li>\n<li><strong>Abilities:</strong> <strong>Force Rating 2.</strong> Dark-Side Force User (<em>generates Force points from dark side results; using light side results costs them a Destiny Point flip and strain, per RAW</em>). Force powers: Influence (<em>may spend a Force point to inflict 2 strain on a target within short range, or — winning an opposed Discipline versus Discipline check — to make one target within short range adopt an emotional state or believe something untrue for a few minutes, or four rounds in combat</em>).</li>\n<li><strong>Equipment:</strong> Pre-Ruusan disruptor, for the bodies that must never be identified (Ranged [Light]; Damage 10; Critical 2; Range [Short]; Vicious 4), vibrosword with a scrubbed provenance (Melee; Damage 6; Critical 2; Range [Engaged]; Defensive 1, Pierce 2, Vicious 1), one anonymous industrial blasting charge (Ranged [Light]; Damage 8; Critical 4; Range [Short]; Blast 6, Limited Ammo 1).</li>\n</ul>\n<p><strong>Chassis:</strong> Emperor's Hand, Edge of the Empire Core Rulebook, p. 402 (adjustments: none).\n<strong>Using them:</strong> The culling of the Inheritors is their graduation exam, and the grade is <em>anonymity</em>: the senior circle dead across a dozen worlds in one night, the archives vanished rather than burned, and nobody sane concluding \"Sith.\" Force Rating 2 is justified as the line's entire pedagogy poured into a single student (era rule, Part VII). They never claim a kill, never duel when a fall down a lift shaft will do, and withdraw the moment a fight turns evidentiary — being <em>seen</em> fighting with a lightsaber is a mission failure worse than death, which is why they do not carry one on a working job: the disruptor leaves no body, the vibrosword no signature, and the saber stays home with the Master. After the culling they hold the harvested Vesta-9 file: they know about the crew, and which of them the beacon answered, and have never once been seen — every misattribution the players chase (the Vigil? the Admiralty? a purge?) lights a different Act 3 fire.</p>", "search": "the patient apprentice nemesis — the sith line (dial 1) — darth mendac, the culling made flesh no name survives contact. when the inheritors unveil their costume sith, this is what a real one looks like: a week of quiet travel, one night of work across a dozen worlds' worth of planning, and no witnesses who understand what they saw. brawn agility intellect cunning willpower presence :-: :-: :-: :-: :-: :-: 4 4 3 5 3 2 soak 4 · wounds 18 · strain 20 · m/r defense 2/3 - skills: athletics 2, brawl 2, charm 3, cool 3, deception 3, knowledge (core worlds) 3, melee 3, perception 2, ranged (heavy) 2, ranged (light) 3, stealth 3, vigilance 4 - talents: adversary 3 ( upgrade the difficulty of all combat checks targeting them three times ), intense focus ( maneuver: suffer 1 strain to upgrade the ability of their next skill check once ), stalker 2 ( add two boost dice to their coordination and stealth checks ), uncanny senses 2 ( add two boost dice to their perception checks ) - abilities: force rating 2. dark-side force user ( generates force points from dark side results; using light side results costs them a destiny point flip and strain, per raw ). force powers: influence ( may spend a force point to inflict 2 strain on a target within short range, or — winning an opposed discipline versus discipline check — to make one target within short range adopt an emotional state or believe something untrue for a few minutes, or four rounds in combat ). - equipment: pre-ruusan disruptor, for the bodies that must never be identified (ranged [light]; damage 10; critical 2; range [short]; vicious 4), vibrosword with a scrubbed provenance (melee; damage 6; critical 2; range [engaged]; defensive 1, pierce 2, vicious 1), one anonymous industrial blasting charge (ranged [light]; damage 8; critical 4; range [short]; blast 6, limited ammo 1). chassis: emperor's hand, edge of the empire core rulebook, p. 402 (adjustments: none). using them: the culling of the inheritors is their graduation exam, and the grade is anonymity : the senior circle dead across a dozen worlds in one night, the archives vanished rather than burned, and nobody sane concluding \"sith.\" force rating 2 is justified as the line's entire pedagogy poured into a single student (era rule, part vii). they never claim a kill, never duel when a fall down a lift shaft will do, and withdraw the moment a fight turns evidentiary — being seen fighting with a lightsaber is a mission failure worse than death, which is why they do not carry one on a working job: the disruptor leaves no body, the vibrosword no signature, and the saber stays home with the master. after the culling they hold the harvested vesta-9 file: they know about the crew, and which of them the beacon answered, and have never once been seen — every misattribution the players chase (the vigil? the admiralty? a purge?) lights a different act 3 fire."}, {"id": "keepers--what-the-line-wants-and-how-it-works", "name": "What the line wants, and how it works", "kind": "Special", "typeline": "", "faction": "", "role": "", "derived": "", "group": "keepers", "html": "<p><strong>The strategy in one line: every true thing about the Sith, out of the galaxy and into her hands.</strong> Veritis is not building an empire, a treasury or an army, and wants none of them yet. Seventy years after Bane, the line's whole position rests on two facts — it holds the only unbroken transmission of the dark side, and the Jedi believe the Sith extinct — and both are facts about <em>knowledge</em>. So that is what she works on. Every holocron, teaching, tomb-record and court archive the New Sith Wars scattered is to be found, verified, and removed: the genuine into the line's keeping, the galaxy left with nothing but its fakes. The Republic will be corrupted eventually; this century's work is making sure that when anyone goes looking for what the Sith were, they find only what Veritis has left for them.</p>\n<p><strong>Why she is looking at the Reach.</strong> The Grumani sector was Sith country in the wars — the Daimanate, the Bactranate, the Arkadianate, the Dyarchy — and the Withering sealed it: courts, tombs, archives, the private libraries of Sith Lords, a century of beacon-dark silence over all of it. Nobody has read any of it since. And somewhere in it is the one thing she came for: <strong>the holocron of Naga Sadow</strong> — the Dark Lord of the Great Hyperspace War's own teaching, five thousand years old, looted during the New Sith Wars into a principality's collection and lost with the principality. The line's catalogue says it survived the Withering. It does not say which vault. (Legends records no holocron of Sadow's in this sector, so it collides with nothing — and a Sadow holocron is exactly the kind of thing a Sith principate would have killed a world to own.) So the Reach had to reopen, and the line could not be seen to open it: Mendac lit Vesta-9 (Dial 3), and a guild has been opening the rest of the doors for her since, one beacon at a time, in her order. Reunification is the line's harvest and the party its unwitting gardeners: they are not relighting a trade lane, they are unlocking a library Veritis intends to empty — so that only lies remain.</p>\n<p><strong>The Patronage.</strong> Through a coreward front the Lamplighters believe to be a private antiquarian consortium, the line funds the guild. The money comes with two conditions the Grandmaster of Charts took to be a collector's vanity: the relighting proceeds in the patron's sequence, and the patron's survey teams get first look at anything a relight uncovers. The sequence is the Sith search pattern — principality by principality, vault by vault — and the survey teams are the Scrub. Ophira Zel does not know who her patron is. She has begun to suspect that the registry leaks; she has not begun to suspect the money.</p>\n<p><strong>What Veritis wants.</strong></p>\n<ul>\n<li><strong>The truth, all of it.</strong> Verification is the point: she can tell a genuine relic from the Inheritors' best forgery at a glance, and the line's inventory of what survived Ruusan is the only honest one in the galaxy.</li>\n<li><strong>The galaxy wrong, not ignorant.</strong> Absence invites questions; error answers them. Counterfeits are left exactly where they lie, fake lineages are allowed to flourish, and a rival who has trained on a forgery is worth more to her alive than dead — until he starts to find real things.</li>\n<li><strong>Exactly one heir.</strong> Any third claim on the Sith inheritance — grave-robbers in costume (the Inheritors), a prophet in the Sith Worlds (Millennial), a Temple that starts looking outward — is not an enemy to be fought but a reader to be denied the book.</li>\n<li><strong>To be unnecessary.</strong> Never a name in a dispatch; never a protagonist. The day anyone can point at Veritis is the day the century was wasted.</li>\n</ul>\n<p><strong>What Mendac wants</strong> is simpler and younger: to be good enough. Anonymity is the grade; the Inheritors are the exam; and underneath the doctrine is an apprentice who has begun to suspect that patience is the Master's weapon against <em>them</em> as much as against the galaxy — which is the Rule of Two working as designed, and not this campaign's problem.</p>\n<p><strong>The machinations</strong> (off-screen and ongoing — draw on them whenever you need the pattern to show from very far back):</p>\n<ol>\n<li><strong>The Weeding.</strong> Whenever the relighting stalls — a certification held up, a corridor claim contested, a magistrate who would rather the lane stayed dark, a guild officer who questions the patron's order — the obstacle removes itself. A rival withdraws without explanation; a hostile official retires young and quiet; a rutter that would have started a war goes missing from a dead man's cabin. Mendac's hands, Veritis's patience, never a trace. The players should feel the recovery is lucky. It is not.</li>\n<li><strong>The Scrub.</strong> The line's real work in the Reach, and the reason the order matters. Behind every relit beacon, the patron's \"survey team\" — Mendac, or hands Mendac has hired and will not leave alive — goes in first: the principality vaults opened and read, the genuine removed, the forgeries and the garbled copies left on the shelves for the next scholar to find. Each vault that does not hold the holocron narrows the search to the next beacon on the guild's list. Run it as the crew arriving somewhere already visited — a tomb with fresh footprints and nothing in it, a dead principality's archive whose only surviving volumes are the ones a Daunting Knowledge (Lore) check reveals to be worthless. The Memory Market at Sanrafsix is watched, not bought from: the day a genuine piece surfaces, its seller has a short future. Improv hook: a scholar of impeccable manners who asks to <em>see</em> a relic and is visibly, quietly relieved to find it is fake.</li>\n<li><strong>The Wasp Trap.</strong> Millennial's heresy on Dromund Kaas is alive and tolerated. It is a sump for the loud: the ambitious, the visionary, the seer who would otherwise draw attention inside Republic space. Veritis's people never touch it — occasionally they <em>send</em> someone to it — and it will be culled the day it reaches Republic space or the day a Darth title out of the Sith Worlds is taken seriously. Dromund Kaas is on the far side of the Rim from the Reach; if the heresy ever touches this campaign, it arrives as a recruiter, a rumor, or a prophecy that is suspiciously accurate about the Valley.</li>\n<li><strong>The Census.</strong> The Awakening is the line's future. A generation of untrained Force-sensitives with no Order to claim them is either the greatest recruiting pool the Sith have ever had or the seed of the Jedi's return, and Veritis means to decide which. The line keeps its own watch on the gifted, and the Inheritors' harvested Vesta-9 file (Dial 3 — they watched the relight Mendac performed) completes it. The line now knows the crew, and which of them the beacon answered. <strong>Their desire is not to kill them.</strong> Gardeners are not pruned, and Mendac's successor has to come from somewhere: the Rule of Two recruits at generational distance, and if you want a sequel hook, the apprentice's apprentice may already be at your table.</li>\n<li><strong>The Graduation.</strong> The culling of the Inheritors (Dial 1) is Mendac's exam — see the set piece below. It is the Weeding, the Scrub and the Census done in one night.</li>\n<li><strong>The Absence.</strong> Never on camera. Veritis manifests as pattern and Mendac as aftermath; neither is ever provable, and no encounter with either is winnable or intended. If the players ever build a true galactic power, the line's attention is the sequel's opening scene.</li>\n</ol>", "search": "what the line wants, and how it works the strategy in one line: every true thing about the sith, out of the galaxy and into her hands. veritis is not building an empire, a treasury or an army, and wants none of them yet. seventy years after bane, the lin  at all (the disruptor); the rest died of falls, of fire, and of each other (Influence). The archive rooms are bare — not burned, <em>emptied</em>: dust outlines where shelves stood. And the relic hall is untouched. Every \"Sith artifact\" the Inheritors ever displayed is still on its plinth.</p>\n<p><strong>The truth.</strong> Mendac took every genuine item and left every counterfeit, because Veritis's eye is the one thing in the galaxy that can tell them apart — and because a room full of fakes tells the galaxy this was robbery by people who did not know what they were looking at. That is the Scrub's whole doctrine in one room: the galaxy is not to be left ignorant of the Sith, it is to be left <em>wrong</em>. Nobody sane concludes \"Sith.\" The fakes are also a message, for the one reader in ten thousand who can tell.</p>\n<p><strong>Reading the room</strong> (optional clue ladder; RAW difficulties; a failed check says nothing, a despair says something false):</p>\n<table>\n<thead>\n<tr>\n<th>Check</th>\n<th>What it gives</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Perception, Average</strong></td>\n<td>No blaster or saber marks; too few bodies for a base this size; the missing dead are exactly the senior faces the crew remembers.</td>\n</tr>\n<tr>\n<td><strong>Medicine, Hard</strong></td>\n<td>The survivors of the first wave killed each other and then themselves, in an order that makes no sense — unless they were <em>made</em> to (Influence). Force-sensitive characters may substitute a Sense check: the fear in the walls has a shape.</td>\n</tr>\n<tr>\n<td><strong>Knowledge (Lore), Hard</strong> <em>(Average if the character has handled a real Sith relic or holds a Sith-tagged fragment)</em></td>\n<td>The relics on the plinths are counterfeits — good ones, the Inheritors' own costume pieces.</td>\n</tr>\n<tr>\n<td><strong>Knowledge (Lore), Daunting</strong> <em>(Formidable without a Sith-tagged fragment)</em></td>\n<td><em>Only</em> fakes remain. Whoever did this could tell — which means a living tradition, not grave-robbers. Success awards a <strong>Sith-tagged lore fragment</strong> (\"Someone in the galaxy can still tell true from false\") and the GM a problem: the players now know the thing nobody sane concludes.</td>\n</tr>\n<tr>\n<td><strong>Streetwise, Hard</strong></td>\n<td>The fakes will surface on the Memory Market within weeks, consigned by a fence who never met the seller. The trail ends at a dead fence.</td>\n</tr>\n<tr>\n<td><strong>Vigilance (or Sense), Average, in the archive</strong></td>\n<td>The house is <em>quiet</em>. Whatever was here that the Force could feel left with the thieves — the only honest inventory of what was taken.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Aftermath.</strong> Fire-sale of the fakes; leaderless cells; half-trained adepts scattering with dangerous knowledge; if this was a senior base, the Vesta-9 file is gone with everything else. The galaxy blames the Vigil, the Admiralty, or an Inheritor purge, and each misattribution lights a different Act 3 fire (Part V). If the crew's gifted stands in the relic hall and feels nothing at all, let that land: the real thing was here, and it is with someone now.</p>\n<hr />\n<h2>The Scar's Echo</h2>", "search": "set piece — the emptied house aftermath encounter — the culling, seen from inside — run it after the unveiling, or earlier as the culling's first quiet strike one night, one base, nobody alive, and the relic hall still full. use an inheritor base the crew has already visited with courtesy — first contact is always helpful (dial 3) — so that coming back is the point: the dig camp at the scar, a sanrafsix warehouse, a cell on the veshet spur. they find it taken apart. everyone is dead and it happened in one night. there are no blaster scorings and no cauterized wounds. the bodies that must never be identified are not there at all (the disruptor); the rest died of falls, of fire, and of each other (influence). the archive room  quiet . whatever was here that the force could feel left with the thieves — the only honest inventory of what was taken. aftermath. fire-sale of the fakes; leaderless cells; half-trained adepts scattering with dangerous knowledge; if this was a senior base, the vesta-9 file is gone with everything else. the galaxy blames the vigil, the admiralty, or an inheritor purge, and each misattribution lights a different act 3 fire (part v). if the crew's gifted stands in the relic hall and feels nothing at all, let that land: the real thing was here, and it is with someone now. --- the scar's echo"}, {"id": "keepers--the-scar-s-echo", "name": "The Scar's Echo", "kind": "Hazard", "typeline": "Encounter hazard", "faction": "Episode 6, \"The Scar\"", "role": "NOT an NPC", "derived": "", "group": "keepers", "html": "<p><em>Encounter hazard — Episode 6, \"The Scar\" — NOT an NPC</em></p>\n<blockquote>\n<p>A New Sith Wars battlefield where the dark side pooled and never drained: kilometers of fused glass under gray ashfall, an Inheritor dig site at its heart, and something underneath that has learned the shape of a listener.</p>\n<p><strong>DELIBERATELY HOMEBREW SECTION — the only one in this file.</strong> The Scar's Echo is a dark-side vergence run as terrain, not a creature: it has no characteristics, no wounds, and cannot be fought. Its mechanics are assembled from two RAW subsystems — the fear-check rules (Discipline checks against a set difficulty, F&amp;D core fear guidance) and Morality/Conflict as written — so nothing below requires a book lookup; the assembly, and the two declared overrides on the Adjustments line at the end of this entry, are the homebrew. The \"Encounter hazard\" typeline above is a sanctioned exception to the template's Nemesis/Rival/Minion types: this is the file's one declared non-NPC entry.</p>\n</blockquote>\n<p><strong>Zones and fear checks.</strong> Call for a fear check (Discipline) when a character first enters each zone, and again if the Echo does something overt (a voice using a dead parent's cadence, a glass field flexing like breath). Per the RAW consequence pattern: on a failure the character suffers 2 strain and adds a setback die to all checks for the remainder of the encounter; three or more threat add 2 further strain; a despair means panic — the character is staggered until the end of their next turn or must immediately move away from the heart. A character who succeeds cannot be forced to re-check in the same zone the same day.</p>\n<table>\n<thead>\n<tr>\n<th>Zone</th>\n<th>Fear check</th>\n<th>Ambient effects</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Ashfall Rim</strong> (the crash-ring and Inheritor base camp)</td>\n<td>Hard Discipline</td>\n<td>Ash-blind: add a setback die to Perception and Vigilance checks; ranged attacks beyond short range upgrade their difficulty once.</td>\n</tr>\n<tr>\n<td><strong>The Glass Fields</strong> (fused, uneven, wrong underfoot)</td>\n<td>Hard Discipline; Force-sensitive characters upgrade the difficulty once</td>\n<td>Difficult terrain throughout. Each hour spent here: Average Discipline check or suffer 1 strain (the whisper accumulates; this strain cannot be recovered until the character leaves the Scar).</td>\n</tr>\n<tr>\n<td><strong>The Choir</strong> (the heart; the dig itself)</td>\n<td>Daunting Discipline; Force-sensitive characters upgrade the difficulty once</td>\n<td>Both outer effects apply. All checks to recover strain here automatically fail. Sleeping in the Choir: 1 Conflict, and a true-but-poisoned dream.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Conflict pressure (RAW Conflict, tempted).</strong> The Echo's offer is generosity. While anywhere within the Scar, a Force-sensitive character may use dark side results on Force power checks <em>without flipping a Destiny Point</em> — the strain cost per dark point still applies as written, and each dark point used this way awards Conflict as RAW <strong>plus 1 additional Conflict</strong> (the vergence's finder's fee). Additionally, award 1 Conflict for: sleeping in the Choir; deliberately opening oneself to the Echo's visions; or taking payment from the dig knowing what is being dug. Land the aftermath hard (Part VII): there are no counselors in this era, and the first person to explain the nightmares wins — make sure the players notice who is offering.</p>\n<p><strong>The visions.</strong> Seek, Sense, Foresee, and Farsight checks made within the Scar add both a boost die <em>and</em> a setback die, and what they return is true but curated — the Echo shows real fragments (it qualifies as a <strong>Sith-tagged lore fragment source</strong> for the Reconstruction subsystem) selected to make the viewer feel indispensable. A despair on any such check puts a corrupted conclusion in play that the character believes (mirror of the Reconstruction rules).</p>\n<p><strong>The bargain (Wellspring).</strong> The Scar is a functional vergence, and therefore a legal Wellspring (Part VII): a Force-sensitive character <em>can</em> raise Force Rating or open a new power tree here. Any advance bought with the Scar as its Wellspring carries a rider: the first time that power or rating is used each session, the character gains 1 Conflict. This is the campaign's first real temptation, and it should work — the offer is genuine, the training is real, and the price is on layaway.</p>\n<p><strong>Running it.</strong> The Echo has no agenda a stat block could hold; it wants <em>listeners</em>, and it prefers the young. The Inheritor dig crew (coin, answers, courtesy — first contact is always helpful, per Dial 3) treats the whisper as an occupational perk and is quietly further gone than they know. Never bring the crew's gifted here without intending the campaign to pivot on it: they dream of the Valley, which is loud, but the Scar is quiet and hungry, and it would very much like to be their second teacher.</p>\n<p><strong>Chassis:</strong> original build (encounter hazard — no adversary stat block exists or is owed; assembled from the F&amp;D fear-check guidance and RAW Morality/Conflict). <strong>Adjustments:</strong> the +1 Conflict finder's-fee and the no-Destiny-flip dark-pip rule are the only overrides of RAW, both declared above.</p>", "search": "the scar's echo encounter hazard — episode 6, \"the scar\" — not an npc a new sith wars battlefield where the dark side pooled and never drained: kilometers of fused glass under gray ashfall, an inheritor dig site at its heart, and something underneath that has learned the shape of a listener. deliberately homebrew section — the only one in this file. the scar's echo is a dark-side vergence run as terrain, not a creature: it has no characteristics, no wounds, and cannot be fought. its mechanics are assembled from two raw subsystems — the fear-check rules (discipline checks against a set difficulty, f&d core fear guidance) and morality/conflict as written — so nothing below requires a book lookup; the assembly, and the two declared overrides on the adjustments line at the end of this entry, are the homebrew. the \"encounter hazard\" typeline above is a sanctioned exception to the template's nemesis/rival/minion types: this is the file's one declared non-npc entry. zones and fear checks. call for a fear check (discipline) when a character first enters each zone, and again if the echo does something overt (a voice using a dead parent's cadence, a glass field flexing like breath). per the raw consequence pattern: on a failure the character suffers 2 strain and adds a setback die to all checks for the remainder of the encounter; three or more threat add 2 further strain; a despair means panic — the character is staggered until the end of their next turn or must immediately move away from the heart. a character who succeeds cannot be forced to re-check in the same zone the same day. zone fear check ambient effects --- --- --- ashfall rim (the crash-ring and inheritor base camp) hard discipl so the era's newsfeed: whoever wins the season carries the rumors, the mail, and quietly the contraband, which makes befriending one worth more than beating one.</p>\n<hr />\n<h2>The Kajidics</h2>", "search": "swoop bike vehicle — the swoop circuit — mail, gossip, and glory at 600 kph the circuit is the closest thing the galaxy has to a broadcast, and this is its transmitter: one screaming engine, one rider, and a courier satchel bolted where the sense should be. silhouette speed handling :-: :-: :-: 2 3 +2 defense fore/aft 0/0 · armor 0 · hull trauma threshold 2 · system strain threshold 3 - hyperdrive: none - navicomputer: none - sensor range: none - crew: one pilot - encumbrance capacity: 4 · passenger capacity: 1 - consumables: none · price/rarity: 6,000 credits/3 · customization hard points: 2 · maximum altitude: 350 meters - weapons: none chassis: flare-s swoop, edge of the empire core rulebook (adjustments: none). (stats unverified against print — scope: speed/handling and hull trauma/system strain thresholds could not be independently corroborated — verify them against the flare-s swoop entry in the edge of the empire core rulebook vehicles chapter before table use; the remaining fields are corroborated as printed) era notes: circuit machines are shrines of mismatched relic parts, each with a dead racer's name painted somewhere honest. sponsorship livery (kajidic, lamplighter, hometown collective) is worth a boost die on the social checks it impresses — never on the flying. using it: hull trauma 2 means any solid hit ends a swoop, so run races and chases as pure piloting (planetary) drama — opposed checks, terrain, nerve — where crashing out is the stake rather than damage math. a circuit rider is also the era's newsfeed: whoever wins the season carries the rumors, the mail, and quietly the contraband, which makes befriending one worth more than beating one. --- the kajidics"}, {"id": "ships--kajidic-fuel-barge", "name": "Kajidic Fuel Barge", "kind": "Vehicle", "typeline": "Vehicle", "faction": "the Kajidics", "role": "a rolling monopoly with a Hutt's name on the manifest", "derived": "Defense Fore/Port/Starboard/Aft 2/1/1/1 · Armor 2 · Hull Trauma Threshold 40 · System Strain Threshold 20", "group": "ships", "html": "<p><em>Vehicle — the Kajidics — a rolling monopoly with a Hutt's name on the manifest</em></p>\n<blockquote>\n<p>A hundred meters of tank and rivet moving at the speed of contract law. It is slow, unarmed, and utterly safe, because everyone for ten systems needs what is inside it to arrive.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">Silhouette</th>\n<th style=\"text-align: center;\">Speed</th>\n<th style=\"text-align: center;\">Handling</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">5</td>\n<td style=\"text-align: center;\">2</td>\n<td style=\"text-align: center;\">−3</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Defense Fore/Port/Starboard/Aft 2/1/1/1 · Armor 2 · Hull Trauma Threshold 40 · System Strain Threshold 20</strong></p>\n<ul>\n<li><strong>Hyperdrive:</strong> Primary: Class 3, Backup: Class 20</li>\n<li><strong>Navicomputer:</strong> Yes</li>\n<li><strong>Sensor Range:</strong> Medium</li>\n<li><strong>Crew:</strong> 20</li>\n<li><strong>Encumbrance Capacity:</strong> 10,000 · <strong>Passenger Capacity:</strong> 5</li>\n<li><strong>Consumables:</strong> Three months · <strong>Price/Rarity:</strong> 200,000 credits/5 · <strong>Customization Hard Points:</strong> 4</li>\n<li><strong>Weapons:</strong> None</li>\n</ul>\n<p><strong>Chassis:</strong> Action VI Bulk Transport, Edge of the Empire Core Rulebook (adjustments: none).\n<strong>Era notes:</strong> The tanks are the newest thing aboard; the keel predates the Withering and the clan bought it as salvage for less than one hold's worth of fuel now sells for. Its real armor is economics — burn a Kajidic barge and your world goes dark next quarter.\n<strong>Using it:</strong> The barge is a const GROUPS = [{"slug": "session-one", "label": "Vesta-9 & the Crew's Orbit", "intro": "<h1>Vesta-9 &amp; the Crew's Orbit</h1>\n<p>Six roster NPCs for session one, \"The Light on Vesta-9\" — plus the <em>Steadfast</em>'s marine boarding party and the sloop itself, statted here so the standoff runs without a lookup — and for the orbit the crew will keep crossing all campaign: the port that impounded their cargo, the rival ship racing them to the beacon, and the three factions waiting at the light. It is 90 AR — the beacon has just relit after sixty dark years, nobody admits to lighting it, and every ship at Okrent's Drift that can lift is lifting. Every stat block below is an official FFG print pulled verbatim and re-skinned for the era; chassis and adjustments are declared on each.</p>\n<p><strong>GM file — contains spoilers for session one and threads into the campaign's locked truths (Part V). Players keep out.</strong></p>\n<hr />\n<h2>Okrent's Drift — The Scramble</h2>"}, {"slug": "republic-admiralty", "label": "Republic & Admiralty", "intro": "<h1>The Republic &amp; the Admiralty</h1>\n<p>Recovered in the Core and absent out here since the Adjournment, the Republic arrives as charter ships: the old flag, the old archives, a writ that stopped where the relays did and now wants to move again — while the Admiralty of the Bastion Worlds holds the last working capital ships and a founding story that requires an enemy. Between them lies the era's central argument: whether the galaxy is restored by continuity or secured by force. These six NPCs are the faces a wayfinder crew will meet when either power comes calling.</p>\n<p><em>GM file — contains faction cracks and campaign spoilers; do not share with players.</em></p>\n<hr />\n<h2>The Republic</h2>"}, {"slug": "vigil-inheritors", "label": "Vigil & Inheritors", "intro": "<h1>The Vigil &amp; the Inheritors</h1>\n<p>Two orders answer the Awakening, and both were founded on graves. The Vigil holds the sealed temples and the relics of the old Orders under a doctrine of veneration-without-practice — the standing peace terms with a bereaved galaxy — even as its founding generation dies and its certainty hardens. The Inheritors, heirs of the Brotherhood's quartermasters and camp-followers, spent three generations hoarding Sith lore, and now arrive first — warm, helpful, and taking notes — on the doorsteps of frightened Force-sensitive families.</p>\n<p><strong>GM file — spoilers for Dial 3, the Unveiling, and the Conclave of Charts. Do not share with players.</strong></p>\n<hr />\n<h2>The Vigil</h2>"}, {"slug": "lanes-ledgers", "label": "Lanes & Ledgers", "intro": "<h1>Lamplighters, Kajidics, the Guild &amp; the Clans</h1>\n<p>Ninety years after Ruusan, the powers in this file are the ones the Withering could not kill: the guild that kept the beacons breathing, the Hutt clan-corporations that got rich on the dark, the one writ that still travels between systems, and the one people who never demobilized. None of them wants the old Republic back — but every one of them intends to be paid, chartered, or armed when whatever comes next arrives. The party will work for all four before they ever fight one.</p>\n<p><strong>GM eyes only — this file carries Act 2–3 leverage (the Conclave of Charts, the kajidic succession) and one Dial 3 thread. Do not hand to players.</strong></p>\n<hr />\n<h2>The Lamplighters</h2>"}, {"slug": "reaches", "label": "The Reaches", "intro": "<h1>The Reaches — Episode NPCs</h1>\n<p>Beyond the Vesta-9 corridor lies the Grumani Reach — the withered interior of the Grumani sector, where the last war's Sith principalities died and the Republic's recovery never returned: ten thousand islands ninety years into the Withering, each one grown strange in its own direction. The people and machines below are what the crew finds when a lane relights — caretakers still keeping faith with vanished masters, economies built on scrap and provenance, and one very polite droid still working a dead government's kill-list. Every stat block here but one is an official published FFG adversary pulled verbatim and re-skinned for 90 AR — the single exception (Anwei, an original build) is declared on her block; chassis and adjustments are cited on each block.</p>\n<p><em>GM eyes only — this file spoils episode reveals for The Dead Letter, The Sealed Enclave, The Ration Engine, The Oracle of Brel, The Memory Market, The Chop-Yards, The Circuit, The Relit Lanes, and The Mausoleum Yards.</em></p>\n<hr />\n<h2>The Dead Letter</h2>"}, {"slug": "keepers", "label": "Keepers of the Flame 🔒", "intro": "<h1>Keepers of the Flame — GM-Locked Force Users</h1>\n<p>Ninety years after Ruusan, the trained Force survives in exactly two places, and neither advertises: a hidden Jedi lineage down to one tired Master and one farmhand pupil, and the Banite line, two or three successions deep and patiently setting the table. This file stats both — plus the dark-side vergence the Inheritors are digging into — because Acts 2 and 3 turn on who reaches the new generation first. These five entries are the campaign's locked answers made playable.</p>\n<p><strong>GM ONLY — SPOILER-CRITICAL. Nothing in this file is player-facing; it implements Part V (locked) of the planning document. Do not read aloud, do not summarize to players, do not leave open at the table.</strong></p>\n<blockquote>\n<p><strong>Sourcing note (updated after re-pull).</strong> Per the pull-don't-build policy, all four NPCs below are now <strong>verbatim pulls of official printed FFG adversary blocks</strong>. Attestation: a book-and-page-cited transcription dataset (the MIT-licensed stoogoff/sw-adversaries index, carrying full characteristics, derived stats, skills, talents, and weapon lines per entry) was cross-checked so that every citation resolves to an official FFG book — <strong>\"Forsaken Jedi\"</strong> (Edge of the Empire Core Rulebook, p. 412), <strong>\"Jedi Padawan\"</strong> (Collapse of the Republic, p. 137), <strong>\"Fallen Master\"</strong> (Force and Destiny Core Rulebook, p. 412; reprinted in Allies and Adversaries, p. 81), and <strong>\"Emperor's Hand\"</strong> (Edge of the Empire Core Rulebook, p. 402). Every printed number is transcribed exactly; only names, flavor, and equipment cosmetics are re-skinned for the era, and every block's Adjustments line is \"none.\" The first draft's original builds and their unverified-against-print flags are hereby retired. The Scar's Echo remains the file's one declared homebrew entry (a hazard, not an adversary — no printed block exists or is owed). At the table, print outranks this file: if one of the cited books is open in front of you and disagrees on a number, the book wins — then tell the archivist.</p>\n</blockquote>\n<hr />\n<h2>The Two Jedi</h2>\n<p>The second fork of Dial 1, resolved: the Order is alive on Coruscant and absent from the Reach, so the campaign's Jedi are two — the Temple's envoy, and the woman who never left. A living mentor is the rarest Wellspring in the era (Part VII); the Reach now has one of each kind, and they disagree about what a Jedi is.</p>"}, {"slug": "ships", "label": "Ships of the Ember Age", "intro": "<h1>Ships of the Ember Age</h1>\n<p>Ninety years after Ruusan, nothing flies new. Every hull in this file is an inheritance — a pre-Withering pattern kept alive by devotion, cannibalized cousins, and a family's whole savings — and the handful of yards that could lay a fresh keel are strategic prizes worth wars. Book prices are quoted in old Republic credits as printed; in 90 AR a working ship is beyond price and a dead one becomes a neighborhood. Every stat block below is an official FFG vehicle block reproduced as printed; only the names and the rust are ours.</p>\n<p><em>This file is player-safe: no campaign secrets appear anywhere in it.</em></p>\n<hr />\n<h2>The Heirloom Lane-Runners</h2>\n<p><strong>Campaign convention.</strong> The three hulls below are the campaign's \"lane-runner patterns\" — freighter designs that were already old when the beacons went dark, reflavored as pre-Ruusan keels a century deep in one family's service. A player crew's shared ship uses one of these blocks <em>exactly as printed</em>: age lives in the paint, the smell, and the Obligation, never in the numbers. If a GM wants the rust mechanically visible for a session, RAW offers the <strong>Inferior</strong> quality (on a weapon: −1 damage <em>and</em> automatic threat on checks using it; on another system, apply the automatic threat) as a <em>temporary, story-driven condition</em> — apply it as a scene complication and take it off when the crew earns the repair montage. The blocks themselves stay stock.</p>"}];
const PAGES  = [{"section": "reference", "id": "primer", "title": "Adversary Rules Primer", "html": "<h1>NPC Library</h1>\n<p><em>Every stat block in this library is an </em><em>official published FFG adversary pulled as printed</em><em> and re-skinned for the Ember Age — new name, new face, same numbers. Each block cites its chassis (the printed adversary and book) and declares any mechanical deviation on an <code>Adjustments:</code> line (almost always \"none\"). Nothing here is built on fan homebrew.</em></p>\n<h2>How to read the blocks — FFG adversary rules in one screen</h2>\n<table>\n<thead>\n<tr>\n<th></th>\n<th><strong>Minion</strong></th>\n<th><strong>Rival</strong></th>\n<th><strong>Nemesis</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Strain threshold</td>\n<td><strong>None</strong> — strain damage becomes wounds</td>\n<td><strong>None</strong> — strain suffered becomes wounds</td>\n<td>Full strain threshold</td>\n</tr>\n<tr>\n<td>Skills</td>\n<td><strong>Group only, no ranks</strong> — a group has ranks equal to (members − 1) in its group skills</td>\n<td>Ranked, like a PC</td>\n<td>Ranked, like a PC</td>\n</tr>\n<tr>\n<td>Talents</td>\n<td>None</td>\n<td>Sparingly</td>\n<td>Expected — usually <strong>Adversary 1–3</strong> (<em>upgrade the difficulty of all combat checks targeting them, once per rank</em>)</td>\n</tr>\n<tr>\n<td>Dies to</td>\n<td>Any hit past its Wound Threshold</td>\n<td>Wounds past threshold</td>\n<td>Wounds past threshold (crits matter)</td>\n</tr>\n</tbody>\n</table>\n<p><strong>Minion group math:</strong> a group's wound threshold is the sum of its members' (four WT-5 minions = group WT 20), and one minion drops each time total damage passes a multiple of the individual WT.</p>\n<p><strong>Soak</strong> = Brawn + armor. <strong>Melee damage</strong> is printed as a total (Brawn already included).</p>\n<h2>The roster</h2>\n<table>\n<thead>\n<tr>\n<th>NPC</th>\n<th>Type</th>\n<th>Affiliation</th>\n<th>File</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Keeper Adressa Vhail</td>\n<td>Rival</td>\n<td>Vigil</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">Vesta-9 &amp; the Crew's Orbit</a></td>\n</tr>\n<tr>\n<td>Commander Joss Reike</td>\n<td>Nemesis</td>\n<td>Admiralty</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">Vesta-9 &amp; the Crew's Orbit</a></td>\n</tr>\n<tr>\n<td>Chartmistress Bel Nerra</td>\n<td>Rival</td>\n<td>Lamplighters</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">Vesta-9 &amp; the Crew's Orbit</a></td>\n</tr>\n<tr>\n<td>Captain Vess Marrow + the <em>Larksong</em> crew</td>\n<td>Rival + Minions</td>\n<td>Independent</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">Vesta-9 &amp; the Crew's Orbit</a></td>\n</tr>\n<tr>\n<td>Portmaster Grell</td>\n<td>Rival</td>\n<td>Okrent's Drift</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">Vesta-9 &amp; the Crew's Orbit</a></td>\n</tr>\n<tr>\n<td>Senator Vekris Dahl</td>\n<td>Nemesis</td>\n<td>Republic</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:republic-admiralty\">Republic &amp; Admiralty</a></td>\n</tr>\n<tr>\n<td>Envoy-Archivist Calla Merion</td>\n<td>Rival</td>\n<td>Republic</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:republic-admiralty\">Republic &amp; Admiralty</a></td>\n</tr>\n<tr>\n<td>Archive Wardens</td>\n<td>Minions</td>\n<td>Republic</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:republic-admiralty\">Republic &amp; Admiralty</a></td>\n</tr>\n<tr>\n<td>Lady Admiral Maren Voss</td>\n<td>Nemesis</td>\n<td>Admiralty</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:republic-admiralty\">Republic &amp; Admiralty</a></td>\n</tr>\n<tr>\n<td>Bastion Marines</td>\n<td>Minions</td>\n<td>Admiralty</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:republic-admiralty\">Republic &amp; Admiralty</a> (also with the <em>Steadfast</em> boarding party in <a hre >\n<tr>\n<td>Beacon-Tender</td>\n<td>Rival</td>\n<td>Lamplighters</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Lane-Runner Deckhands</td>\n<td>Minions</td>\n<td>Lamplighters</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Sorulba the Anchor</td>\n<td>Nemesis</td>\n<td>Kajidics</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Jeeda the Younger</td>\n<td>Rival</td>\n<td>Kajidics</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Kajidic Enforcers</td>\n<td>Minions</td>\n<td>Kajidics</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Arbiter Ten Vekk</td>\n<td>Nemesis</td>\n<td>Bounty Hunters' Guild</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Guild Purist Tracker</td>\n<td>Rival</td>\n<td>Bounty Hunters' Guild</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Captain Tal Ordo</td>\n<td>Nemesis</td>\n<td>Mandalorian Clans</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Clan Ordo Soldiers</td>\n<td>Minions</td>\n<td>Mandalorian Clans</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Runi Ordo</td>\n<td>Rival</td>\n<td>Mandalorian Clans (Awakened foundling)</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>\"Dead Letter\"</td>\n<td>Nemesis</td>\n<td>a ninety-year-old contract</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Docent-7</td>\n<td>Rival</td>\n<td>the Sealed Enclave</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>The Quartermaster</td>\n<td>Rival (social)</td>\n<td>the Ration Engine</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Anwei, the Oracle of Brel</td>\n<td>Rival</td>\n<td>Brel</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Provenance-Broker Halla Wex + Scribes</td>\n<td>Rival + Minions</td>\n<td>the Memory Market</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Junk Baron Okkam Dree + Clan Cutters</td>\n<td>Rival + Minions</td>\n<td>salvage economy</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Swoop Ace \"Kettle\" Maro</td>\n<td>Rival</td>\n<td>the circuit</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Pirate Captain of the Quiet + Quiet Pirates</td>\n<td>Nemesis + Minions</td>\n<td>the Quiet</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Hullmayor Bessa Rin + Hull-City Militia</td>\n<td>Rival + Minions</td>\n<td>the Mausoleum Yards</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">The Reaches</a></td>\n</tr>\n<tr>\n<td>Master Yenna Sar</td>\n<td>Nemesis</td>\n<td>hidden Jedi lineage</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>Coll Bren</td>\n<td>Rival</td>\n<td>hidden Jedi lineage</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>The Patient Master</td>\n<td>Nemesis</td>\n<td>the true Sith line</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>The Patient Apprentice</td>\n<td>Nemesis</td>\n<td>the true Sith line</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>The Scar's Echo</td>\n<td>Hazard</td>\n<td>the dark side, pooled</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n</tbody>\n</table>\n<p>🔒 = spoiler-critical even within the GM section: these existences are Dial 1 material.</p>\n<p><em>Ship stat blocks live in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:ships\">Ships of the Ember Age</a> (shareable — ship stats aren't spoilers).</em></p>"}, {"section": "reference", "id": "dice-results", "title": "Reading the Dice", "html": "<h1>Reading the Dice</h1>\n<p><em>A player reference for The Ember Age (FFG Star Wars narrative dice)</em></p>\n<p>You rolled. Symbols everywhere. Here is the whole trick: the dice answer <strong>two separate questions</strong>, and you only freeze when you try to make them answer one. Question one — <em>did it work?</em> Question two — <em>what else happened?</em> Settle them in that order, out loud, and you are done in ten seconds.</p>\n<h2>Reading a Roll in 10 Seconds</h2>\n<p><strong>Axis 1 — Did it work?</strong> Count <strong>Success</strong> symbols, count <strong>Failure</strong> symbols. Each Failure cancels one Success. If at least one Success is left over, the check succeeds. If Successes and Failures cancel out exactly — or Failures win — the check fails. Ties go to failure. Nothing else on the table can change this answer.</p>\n<p><strong>Axis 2 — What else happened?</strong> Count <strong>Advantage</strong> symbols, count <strong>Threat</strong> symbols. Each Threat cancels one Advantage. Whatever is left over is a side effect — a perk if Advantage remains, a complication if Threat remains. This currency <strong>never</strong> turns success into failure or failure into success. You can fail brilliantly (failure with Advantage: the lock holds, but you spot the maintenance hatch) or succeed at a price (success with Threat: the door opens, loudly).</p>\n<p><strong>The big symbols:</strong></p>\n<ul>\n<li><strong>Triumph</strong> is a Success <em>plus</em> something spectacular. Its built-in Success goes into the Axis 1 tally and can be cancelled by a Failure like any other — but the Triumph <em>effect</em> is never cancelled. Even on a check that fails overall, you still spend the Triumph.</li>\n<li><strong>Despair</strong> is the mirror: it adds one Failure to the Axis 1 tally (cancellable normally), and its <em>effect</em> always lands regardless of the roll's outcome. You can succeed and still eat a Despair.</li>\n<li>Triumph and Despair do <strong>not</strong> cancel each other. Both fire.</li>\n</ul>\n<p>So every roll lands in one of four quadrants — succeed/fail crossed with perk/complication — plus optional fireworks. Name the quadrant, then spend.</p>\n<h2>Spending Advantage and Triumph in Combat</h2>\n<p>These are the standard rulebook options. Announce your spend; the GM narrates it.</p>\n<table>\n<thead>\n<tr>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Advantage</td>\n<td>Recover 1 strain (may be chosen more than once).</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Add a boost die to the next allied character's check.</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Notice one important point in the fight — the blast door controls, a weak seam in the armor plating, the catwalk above.</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Activate a weapon quality whose listed cost is 1.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Perform one immediate free maneuver (cannot exceed the two-maneuver-per-turn limit).</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Add a setback die to a targeted character's next check.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Activate a weapon quality (2 is the default cost unless the quality says otherwise).</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Negate the target's defensive bonuses (cover, equipment, guarded stance) until the end of the current round.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Ignore penalizing environmental effects (weather, zero-g, and the like) until the end of your next turn.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Force the target into a significant drawback — drop a wielded weapon, or (on a damaging hit, with GM agreement) disable a piece of their gear instead of dealing the damage.</td>\n</tr>\n<tr>\n<td>Advantage = weapon's Critical rating</td>\n<td>On a hit that deals damage past soak, trigger a <strong>Critical Injury</strong>. Extra activations add +10 each to the Critical roll.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Any option above, regardless of its Advantage cost.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Trigger a Critical Injury on a damaging hit, regardless of Critical rating.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Activate any weapon quality, regardless of its cost.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Upgrade the difficulty of the target's next check, or upgrade the ability of an ally's next check (yourself included).</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Do something vital and scene-shaping: shoot the blast-door controls, collapse the catwalk, spot the escape route.</td>\n</tr>\n<tr>\n<td>2 Triumph</td>\n<td>On a damaging hit, destroy one piece of equipment the target is using — blow up their blaster, burn out their shield generator.</td>\n</tr>\n</tbody>\n</table>\n<blockquote>\n<p><strong>One crit per hit.</strong> A single hit can inflict only <strong>one</strong> Critical Injury, no matter how you pay for it. Every activation after the first — whether bought with Advantage or Triumph — instead adds +10 to that one Critical roll.</p>\n</blockquote>\n<h3>The Mirror: Threat and Despair in Combat</h3>\n<p>The GM (or you, narrating your own stumble) spends these against the active character.</p>\n<table>\n<thead>\n<tr>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Threat</td>\n<td>Suffer 1 strain (may be applied more than once).</td>\n</tr>\n<tr>\n<td>1 Threat</td>\n<td>Lose the benefit of a prior maneuver (your aim, your guarded stance) until you take it again.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>An opponent may take one immediate free maneuver.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>Add a boost die to a targeted character's next check, or a setback die to your own or an ally's next check.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>Fall prone.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>Grant the enemy a significant advantage in the encounter — you shoot out the bridge controls you needed for your own escape.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Your ranged weapon runs out of ammunition for the rest of the encounter.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Your weapon or tool is damaged — it jams, cracks, or degrades a step.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Upgrade the difficulty of an ally's (or your own) next check.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>A serious GM complication: the shot hits an ally, the gear breaks at the worst moment, the fallback plan closes.</td>\n</tr>\n</tbody>\n</table>\n<h2>Advantage Outside Combat</h2>\n<p>Out of combat, Advantage buys narrative position: information, time, goodwill, or a setup for the next check (usually a boost die to a follow-up, a setback die on the opposition, or a detail the GM confirms). One or two Advantage buys something small; three or more, or a Triumph, buys something the whole scene turns on. <strong>You may suggest any of these to the GM:</strong></p>\n<ul>\n<li><strong>Slicing (Computers):</strong> leave no trace in the log; find one extra file you were not looking for; keep the backdoor open for later.</li>\n<li><strong>Mechanics:</strong> the repair holds longer than it should; finish faster than expected; salvage a usable spare part from the job.</li>\n<li><strong>Astrogation:</strong> shave hours off the transit; note a landmark worth adding to the rutter; arrive positioned exactly where you wanted.</li>\n<li><strong>Negotiation:</strong> better price, or a favor thrown in; learn what the other side actually values; leave the door open for future business.</li>\n<li><strong>Charm / Deception:</strong> the target repeats your version to others; you read what they are hiding; the lie survives one follow-up question.</li>\n<li><strong>Stealth:</strong> find an exit route as you go; overhear something useful; leave the guards arguing about whether they saw anything at all.</li>\n</ul>\n<p>Failed the check but rolled Advantage? Same menu, smaller portions: the attempt did not work, <em>and</em> you learned something, kept your cover, or set up the next try.</p>\n<h2>The Ember Age Spends (Campaign-Specific)</h2>\n<p>House options for this campaign's subsystems. All of these are proposals, not entitlements — see the etiquette box.</p>\n<table>\n<thead>\n<tr>\n<th>Cost</th>\n<th>Situation</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2 Advantage</td>\n<td>Any relevant Knowledge check</td>\n<td>Surface a lead: the GM names where a related <strong>lore fragment</strong> might be found — a witness, a rutter page, an unwiped droid.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Beacon relight, any stage</td>\n<td>Ease the next stage: hand a boost die to whichever crewmate tackles it.</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Social check with a faction agent</td>\n<td>Glimpse a hairline crack: one hint of the tension running through their faction.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Cantina or swoop-circuit scene</td>\n<td>The rumor network works for you: a courier carries one message or question ahead of you, free.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Beacon relight, any stage</td>\n<td>One stage's failsafes yield early: that stage completes without a further check.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Reconstruction scene</td>\n<td>A secret beyond the Question: the GM reveals something the fragments were never asked about.</td>\n</tr>\n<tr>\n<td>1 Threat</td>\n<td>Open Force use with witnesses</td>\n<td>The crowd's reaction worsens one extra step beyond the normal witness rule.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>Astrogation on a decayed lane</td>\n<td>Your route leaks: a rival crew or faction learns which corridor you are running.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Reconstruction scene</td>\n<td>A <strong>corrupted conclusion</strong> enters play — and the party believes it.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Beacon relight, any stage</td>\n<td>The relight broadcasts wider than intended. Someone you did not invite heard it, and is coming.</td>\n</tr>\n</tbody>\n</table>\n<h2>Etiquette at the Table</h2>\n<blockquote>\n<p><strong>The player proposes, the GM disposes.</strong> Suggest a spend in plain words — \"two Advantage: can I get a free maneuver to duck behind the crates?\" — and let the GM shape it. You will rarely be told no; you will often be told \"yes, and.\"</p>\n<p><strong>Spend promptly.</strong> A decent spend now beats a perfect spend after two minutes of menu-reading. Table momentum is worth more than optimization, and the strain recovery is <em>always</em> there when nothing else sings.</p>\n<p><strong>Use it or lose it — gracefully.</strong> Unspent Advantage does not bank between rolls. If you shrug, the GM may spend it as scene color on your behalf. That is not a punishment; it is the dice refusing to be boring.</p>\n</blockquote>\n<p>When in doubt: recover strain, boost a friend, or notice something. Those three answers are never wrong.</p>"}, {"section": "reference", "id": "lore-fragments", "title": "Lore Fragments", "html": "<h1>Lore Fragments</h1>\n<p><em>The core subsystem. The players assemble the true history themselves.</em></p>\n<h2>What a fragment is</h2>\n<p>A fragment is a <strong>tangible source</strong>: a holocron shard, a rutter, a sealed archive cell, an unwiped pre-war droid memory core — or a <strong>living witness</strong>. The last human eyewitnesses of Ruusan are dying this decade, and longer-lived species still carry the war as personal memory; testimony is a fragment you can argue with, and it contradicts the documents exactly as often as they contradict each other.</p>\n<p>Every fragment carries a tag — <strong>Jedi</strong>, <strong>Sith</strong>, or <strong>Civic</strong> — and fragments about the same event from different tags <strong>always disagree on one load-bearing fact.</strong></p>\n<h2>Rules</h2>\n<ul>\n<li><strong>Holding a relevant fragment</strong> adds a boost die to related Knowledge checks.</li>\n</ul>\n<h3>Reconstruction</h3>\n<p>With <strong>three or more fragments</strong> bearing on one named <strong>Question</strong> (\"Why did the Jedi leave the Rim?\" \"What is the Valley?\"), the party may attempt a <strong>Hard Knowledge (Lore)</strong> check as a group scene.</p>\n<ul>\n<li>If <strong>all three tags</strong> are represented: upgrade an ability die once.</li>\n<li>If <strong>only one tag</strong> is represented: upgrade the difficulty once — <em>bias is real.</em></li>\n</ul>\n<h3>Results</h3>\n<table>\n<thead>\n<tr>\n<th>Result</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Success</strong></td>\n<td>The GM reveals a <strong>Truth</strong>, and the party gains an <strong>Insight</strong> — permanently remove a setback die from one defined category of checks, <strong>or</strong> unlock an out-of-career talent purchase the Truth justifies</td>\n</tr>\n<tr>\n<td><strong>Triumph</strong></td>\n<td>A secret beyond the Question</td>\n</tr>\n<tr>\n<td><strong>Despair</strong></td>\n<td>A <strong>corrupted conclusion</strong> enters play — and the party believes it</td>\n</tr>\n</tbody>\n</table>\n<h2>Named Questions</h2>\n<p>Keep a public list of the Questions the party is working, e.g.:</p>\n<ul>\n<li><em>Why did the Jedi leave the Rim?</em></li>\n<li><em>What is the Valley?</em></li>\n<li><em>Who lit Vesta-9?</em></li>\n<li><em>What did the Adjournment actually adjourn?</em></li>\n</ul>\n<p><em>(GM: track issued fragments and their tags in the GM tools section of this wiki.)</em></p>"}, {"section": "reference", "id": "beacon-relighting", "title": "Relighting a Beacon", "html": "<h1>Relighting a Beacon</h1>\n<p><em>The set-piece skill challenge. Three stages in any order, built so different PCs shine.</em></p>\n<h2>The three stages</h2>\n<h3>1. Wake it</h3>\n<p><strong>Mechanics or Computers</strong> against sixty years of dead-man failsafes.</p>\n<h3>2. Chart it</h3>\n<p><strong>Hard Astrogation</strong>, with <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">fragments</a> and rutters as boost dice.</p>\n<h3>3. Speak to it</h3>\n<p>A <strong>Knowledge or social check</strong> to satisfy old Republic handshake protocols — or to convince a guild observer to certify the lighting.</p>\n<h2>What a relit beacon does</h2>\n<p>Each relit beacon:</p>\n<ul>\n<li><strong>Opens a region</strong> — a corridor of worlds ninety years strange.</li>\n<li><strong>Shifts the faction map.</strong></li>\n<li><strong>Pays a first-lighting fee</strong> (see <a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">the Lamplighters</a>).</li>\n<li><strong>Raises the same question: who follows you through?</strong></li>\n</ul>"}, {"section": "reference", "id": "force", "title": "The Force in the Ember Age", "html": "<h1>The Force in the Ember Age</h1>\n<p><em>In this era the Force is not a skill; it is an event.</em></p>\n<h2>Almost no teachers — Wellsprings</h2>\n<p>Increasing <strong>Force Rating</strong> or opening a <strong>new power tree</strong> requires a <strong>Wellspring</strong> found in play — a functional holocron, a vergence, or, rarest of all, a living mentor from one of the hidden lineages — <strong>in addition to the usual XP.</strong></p>\n<p>Knowledge is treasure.</p>\n<h2>Witnesses</h2>\n<p>Open Force use in front of ordinary people:</p>\n<ul>\n<li><strong>Shifts their disposition one step</strong> — awe or fear, GM's call.</li>\n<li><strong>Adds a setback die to social checks with that community</strong> until the party addresses what they saw.</li>\n</ul>\n<h2>Morality</h2>\n<p>Run it as written, but land the aftermath of Conflict harder: there are no counselors out here, no Council that has heard of this sector, no one to tell a Force-sensitive what the nightmares mean — <strong>except whoever reached them first.</strong></p>"}, {"section": "reference", "id": "obligation", "title": "Obligation", "html": "<h1>Obligation, Reflavored</h1>\n<p><em>Roll or choose. Everyone takes one — it is a broke, indebted galaxy.</em></p>\n<table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">d10</th>\n<th>Obligation</th>\n<th>The Ember Age version</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td><strong>Debt</strong></td>\n<td>Sector scrip or a Kajidic marker, ruinous interest</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td><strong>Family</strong></td>\n<td>You are an isolated homeworld's only link</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td><strong>Oath</strong></td>\n<td>To a dying archivist</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td><strong>Notice</strong></td>\n<td>An Admiralty conscription writ with your name on it</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">5</td>\n<td><strong>Secret</strong></td>\n<td>Someone knows you are Force-sensitive — or love someone who is</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">6</td>\n<td><strong>Obsession</strong></td>\n<td>One fragment you cannot let go</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">7</td>\n<td><strong>Responsibility</strong></td>\n<td>Refugees from a lane that died</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">8</td>\n<td><strong>Contract</strong></td>\n<td>The Lamplighters hold your ship's papers</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">9</td>\n<td><strong>Posted</strong></td>\n<td>A Guild bounty, still live, with your name on it</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">10</td>\n<td>Choose or invent</td>\n<td>Keep it era-true: debts, memory, and the people a dead lane stranded</td>\n</tr>\n</tbody>\n</table>\n<p>Run Obligation as written in the core rules (starting totals, triggers, strain effects at threshold). The reflavoring changes who comes knocking, not the math.</p>"}, {"section": "reference", "id": "character-creation", "title": "Character Creation", "html": "<h1>Character Creation</h1>\n<h2>The basics</h2>\n<ul>\n<li><strong>Standard starting XP.</strong> Any career from any of the three core books (Edge of the Empire, Age of Rebellion, Force and Destiny).</li>\n<li><strong>The crew shares one heirloom ship</strong> — a Wayfarer-class, or any YT or Ghtroc hull reflavored as a pre-Ruusan lane-runner, a century old and held together by devotion. See <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:ships\">Ships of the Ember Age</a>.</li>\n<li><strong>Everyone takes <a href=\"#\" class=\"xin\" data-nav=\"page:reference:obligation\">Obligation</a></strong> — it is a broke, indebted galaxy.</li>\n<li><strong>Force-sensitive PCs also track Morality.</strong></li>\n<li><strong>Duty waits until Act 3</strong>, when the party formally aligns with a founding vision. The three mechanics mirror the three acts: survival, then conscience, then cause.</li>\n</ul>\n<h2>Playing one of the Awakened</h2>\n<p>A Force-sensitive PC enters via the <strong>Force-Sensitive Exile</strong> or <strong>Force-Sensitive Emergent</strong> universal specializations, or <strong>any Force and Destiny career</strong>, at <strong>Force Rating 1 — with no teacher who will have them.</strong> The Temple takes children, not adults; the Jedi who never left the Rim are a rumor; whatever taught you, it was not a Jedi.</p>\n<p>Their growth runs through discovery, not tuition: see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:force\">The Force in the Ember Age</a>. Knowledge is treasure.</p>\n<h2>Wayfinder crew concepts</h2>\n<p>The party are <strong>wayfinders</strong> — scout-envoy-archaeologists reopening the galaxy one lane at a time. Any concept that answers \"why does this person reopen dead lanes?\" works: seekers, traders, diplomats, chartkeepers, salvage crews, interpreters (splintered Basic makes them load-bearing), couriers off the swoop circuit, and perhaps one of the newly Force-sensitive.</p>"}, {"section": "setting", "id": "home", "title": "The Ember Age", "html": "<h1>The Ember Age</h1>\n<p><em>A homebrew Star Wars campaign for FFG (Edge of the Empire / Age of Rebellion / Force and Destiny)</em></p>\n<blockquote>\n<p>Hope with rust on it.</p>\n</blockquote>\n<table>\n<thead>\n<tr>\n<th></th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>When</strong></td>\n<td>~910 BBY. In-world, the year <strong>90 AR</strong> — After Ruusan.</td>\n</tr>\n<tr>\n<td><strong>What</strong></td>\n<td>Ninety years after the Jedi and Sith annihilated each other at Ruusan, the galaxy has withered into ten thousand islands — and the war is passing out of human living memory. Now the Force is returning, the beacons are relighting, and what comes next has not been decided.</td>\n</tr>\n<tr>\n<td><strong>Who</strong></td>\n<td>The player characters are <strong>wayfinders</strong> — a crew of seekers, traders, diplomats, and perhaps one of the newly Force-sensitive — reopening the galaxy one lane at a time.</td>\n</tr>\n<tr>\n<td><strong>Tone</strong></td>\n<td>Hope with rust on it. Rebuilding and discovery. Light and dark finding a way forward together — or the old dogmas returning wearing new faces.</td>\n</tr>\n</tbody>\n</table>\n<p>The thesis of the era, and the line to say aloud at session zero:</p>\n<p><strong>Nobody broke the galaxy — everyone just stopped holding it up.</strong></p>\n<hr />\n<h2>Finding your way</h2>\n<ul>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:timeline\">The Withering</a></strong> — the ninety-year timeline from Ruusan to the relighting of Vesta-9.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:galaxy\">The Galaxy at 90 AR</a></strong> — travel, memory, salvage, and the two networks that never stopped running.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:factions\">Factions</a></strong> — six answers to \"what comes next,\" and two standing powers.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:awakening\">The Awakening</a></strong> — the Force is coming back, and nobody knows why.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:structure\">Campaign Structure</a></strong> — three acts: Reconnection, Convergence, the Founding.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:session-one\">Session One: \"The Light on Vesta-9\"</a></strong> — the cold open.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"tab:reference\">Mechanics</a></strong> — character creation, Obligation, Lore Fragments, beacon relighting, and the Force in the Ember Age.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:glossary\">Terms of the Era</a></strong> — the appendix glossary.</li>\n</ul>\n<div class=\"adm adm-warning\"><p class=\"adm-title\">GM material</p><p>This is the GM's reference. Parts I–IV and VI–VIII can be read aloud or shared as the table discovers them; everything under the <strong>GM</strong> tab (Part V, the NPC library, the trackers) never leaves your side of the screen.</p></div>\n\n<h2>About this campaign and canon</h2>\n<p>This campaign diverges from Legends canon nowhere at all. The record says the Republic and the Jedi Order endured from Ruusan to the prequel era — and here they do: recovered in the Core, reformed, solvent, a Temple full of children. What the record does not say is how far the recovery reached, because records are written by recoveries, and a Senate that adjourned a third of the galaxy remembers itself as whole. The Bane novels remain true, and so does everything published after — this era is simply the chapter nobody wrote down, in the sectors nobody wrote to.</p>\n<p><strong>Your table writes it.</strong></p>"}, {"section": "setting", "id": "timeline", "title": "The Withering (Timeline)", "html": "<h1>The Withering</h1>\n<p><em>Ninety years, decade by decade — how the galaxy went out like a lamp: not smashed, just left untended.</em></p>\n<div class=\"adm adm-quote\"><p class=\"adm-title\">The thesis of the era</p><p><strong>Nobody broke the galaxy — everyone just stopped holding it up.</strong></p></div>\n\n<h2>0 AR — Ruusan</h2>\n<p>Seven battles end the New Sith Wars. Lord Kaan's thought bomb consumes both armies, and a thousand light and dark spirits are bound together in what becomes the Valley of the Jedi. Most of the Jedi Order dies on that world. Publicly, the Sith are extinct. Secretly, Darth Bane walks away with one apprentice and a Rule: two, no more.</p>\n<h2>0–12 AR — The Reformation and the Adjournment</h2>\n<p>The Republic demilitarizes in relief. The <strong>Ruusan Reformation</strong> dissolves the fleets and the Army of Light together, retires the Jedi Lords and their titles, and places what is left of the Order under the Chancellor — no longer generals, now <strong>peacekeepers</strong> who answer to the Senate. The Core rebuilds fast, because the Core was never the battlefield. Out here the graves do not distinguish which order dug them, and in the mouths of the bereaved, <em>Jedi</em> and <em>Sith</em> become one curse.</p>\n<p>The Order, grieving and thin, reforms itself in the same decade. The dead of Ruusan were mostly Jedi who had been taken late and trained in war; the Council resolves never to make that Order again. The new rule: find the gifted <strong>young</strong>, take them from their families to the one <strong>Temple on Coruscant</strong>, raise them without attachment, and hold them to the peace. It is a rule written for a Core that can be searched, by an Order too small to search anything else.</p>\n<p>In 12 AR the Senate votes <strong>the Adjournment</strong>: the withered sectors' seats, charters and obligations are suspended <em>sine die</em> — \"until reconnection\" — and the Republic's writ formally stops where its relays did. The Rim is adjourned, not the Republic. The Order withdraws with it, sealing its Rim temples and deeding stone and relic — property, never the calling — to the custodial order that becomes <a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">the Vigil</a>, under one codicil easy to miss in the minutes: <strong>any three Masters, met together in a sealed temple, may reopen it and seat a chapter of the Order there.</strong></p>\n<p>A few Jedi refuse the recall. They stay where the anger is thickest and do the only thing left: one master, one or two pupils, wherever a gifted child can be found and a family persuaded. The Temple calls them the withdrawn. They call themselves Jedi.</p>\n<h2>12–35 AR — The Long Exhale</h2>\n<p>The fleets are decommissioned faster than anything replaces them, and sector defense devolves to local squadrons. Around 20 AR, one admiral over the shipyard worlds of the Bastion cluster simply declines the recall order, citing piracy — and is quietly ignored. <a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">Her heirs never leave.</a></p>\n<h2>35–58 AR — The Quiet Ledger</h2>\n<p>No villain kills the HoloNet; appropriations committees do. Relay maintenance lapses sector by sector. Interstellar credit fractures into sector scrip. Long-haul trade privatizes, then localizes, then stops.</p>\n<h2>58–75 AR — The Drift and the Ebb</h2>\n<p>The last adjourned delegations stop sending even observers to a Senate whose sessions cost more to reach than they are worth. Meanwhile Force-sensitive births thin to almost nothing — <strong>the Ebb</strong> — and in the Core the Temple <em>notices</em>, because the Temple counts: its search returns fewer children each year, and the Order hardens its rule in response, taking every gifted child it can find, younger each decade. In the Rim, no one is counting. The few children born with the gift are hidden by their own families, because the surest way to lose a child is to let the neighbors hear the word <em>Jedi</em>. The withdrawn lineages starve for pupils, and most of them snap.</p>\n<h2>75–90 AR — The Dimming and the Awakening</h2>\n<p>The war generation begins to die. News travels by courier and arrives as rumor, and on ten thousand worlds the Jedi and Sith pass from testimony into story. Then, in the same years, the Ebb reverses: Force-sensitive children are born in rising numbers, the oldest of them now young adults. In the Core the Temple's creches fill and its doctrine holds. In the Rim the galaxy is forgetting the Force at exactly the moment the Force remembers the galaxy — and no one out here has seen a Jedi in a lifetime.</p>\n<p>In 90 AR, hyperspace beacon <strong>Vesta-9</strong>, dark for sixty years, relights. Nobody admits to lighting it.</p>\n<h2>Living memory at 90 AR</h2>\n<p>For humans, Ruusan is now a childhood memory of the very old: the last people who watched the armies pass are in their nineties, and they are dying this decade. For longer-lived species the ledger is different — a Wookiee who fought there is barely middle-aged, a Duros merchant remembers the Republic solvent, a Hutt remembers it whole. Galactic memory is stratified by species, and humans are already mythologizing what a living eyewitness two docks over can flatly contradict.</p>\n<p>History here is not yet archaeology. <strong>It can still be interviewed — and the interviews disagree.</strong></p>\n<p><em>(At the t
