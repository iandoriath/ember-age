 the check but rolled Advantage? Same menu, smaller portions: the attempt did not work, <em>and</em> you learned something, kept your cover, or set up the next try.</p>\n<h2>The Ember Age Spends (Campaign-Specific)</h2>\n<p>House options for this campaign's subsystems. All of these are proposals, not entitlements — see the etiquette box.</p>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th>Cost</th>\n<th>Situation</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>2 Advantage</td>\n<td>Any relevant Knowledge check</td>\n<td>Surface a lead: the GM names where a related <strong>lore fragment</strong> might be found — a witness, a rutter page, an unwiped droid.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Beacon relight, any stage</td>\n<td>Ease the next stage: hand a boost die to whichever crewmate tackles it.</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Social check with a faction agent</td>\n<td>Glimpse a hairline crack: one hint of the tension running through their faction.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Cantina or swoop-circuit scene</td>\n<td>The rumor network works for you: a courier carries one message or question ahead of you, free.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Beacon relight, any stage</td>\n<td>One stage's failsafes yield early: that stage completes without a further check.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Reconstruction scene</td>\n<td>A secret beyond the Question: the GM reveals something the fragments were never asked about.</td>\n</tr>\n<tr>\n<td>1 Threat</td>\n<td>Open Force use with witnesses</td>\n<td>The crowd's reaction worsens one extra step beyond the normal witness rule.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>Astrogation on a decayed lane</td>\n<td>Your route leaks: a rival crew or faction learns which corridor you are running.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Reconstruction scene</td>\n<td>A <strong>corrupted conclusion</strong> enters play — and the party believes it.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Beacon relight, any stage</td>\n<td>The relight broadcasts wider than intended. Someone you did not invite heard it, and is coming.</td>\n</tr>\n</tbody>\n</table></div>\n<h2>Etiquette at the Table</h2>\n<blockquote>\n<p><strong>The player proposes, the GM disposes.</strong> Suggest a spend in plain words — \"two Advantage: can I get a free maneuver to duck behind the crates?\" — and let the GM shape it. You will rarely be told no; you will often be told \"yes, and.\"</p>\n<p><strong>Spend promptly.</strong> A decent spend now beats a perfect spend after two minutes of menu-reading. Table momentum is worth more than optimization, and the strain recovery is <em>always</em> there when nothing else sings.</p>\n<p><strong>Use it or lose it — gracefully.</strong> Unspent Advantage does not bank between rolls. If you shrug, the GM may spend it as scene color on your behalf. That is not a punishment; it is the dice refusing to be boring.</p>\n</blockquote>\n<p>When in doubt: recover strain, boost a friend, or notice something. Those three answers are never wrong.</p>"}, {"section": "reference", "id": "lore-fragments", "title": "Lore Fragments", "html": "<h1>Lore Fragments</h1>\n<p><em>The core subsystem. The players assemble the true history themselves.</em></p>\n<h2>What a fragment is</h2>\n<p>A fragment is a <strong>tangible source</strong>: a holocron shard, a rutter, a sealed archive cell, an unwiped pre-war droid memory core — or a <strong>living witness</strong>. The last human eyewitnesses of Ruusan are dying this decade, and longer-lived species still carry the war as personal memory; testimony is a fragment you can argue with, and it contradicts the documents exactly as often as they contradict each other.</p>\n<p>Every fragment carries a tag — <strong>Jedi</strong>, <strong>Sith</strong>, or <strong>Civic</strong> — and fragments about the same event from different tags <strong>always disagree on one load-bearing fact.</strong></p>\n<p>Some fragments are not just testimony but <strong>navigation</strong>: a rutter, a war-convoy log, a pilgrim's chart. The deep history of this era is also a <em>road</em> — lanes that led somewhere everyone has forgotten — and by the endgame, when the party needs a way off every surviving chart, fragments are what buys it.</p>\n<h2>Rules</h2>\n<ul>\n<li><strong>Holding a relevant fragment</strong> adds a boost die to related Knowledge checks.</li>\n</ul>\n<h3>Reconstruction</h3>\n<p>With <strong>three or more fragments</strong> bearing on one named <strong>Question</strong> (\"Why did the Jedi leave the Rim?\" \"What is the Valley?\"), the party may attempt a <strong>Hard Knowledge (Lore)</strong> check as a group scene.</p>\n<ul>\n<li>If <strong>all three tags</strong> are represented: upgrade an ability die once.</li>\n<li>If <strong>only one tag</strong> is represented: upgrade the difficulty once — <em>bias is real.</em></li>\n</ul>\n<h3>Results</h3>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Result</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Success</strong></td>\n<td>The GM reveals a <strong>Truth</strong>, and the party gains an <strong>Insight</strong> — permanently remove a setback die from one defined category of checks, <strong>or</strong> unlock an out-of-career talent purchase the Truth justifies</td>\n</tr>\n<tr>\n<td><strong>Triumph</strong></td>\n<td>A secret beyond the Question</td>\n</tr>\n<tr>\n<td><strong>Despair</strong></td>\n<td>A <strong>corrupted conclusion</strong> enters play — and the party believes it</td>\n</tr>\n</tbody>\n</table></div>\n<h2>Named Questions</h2>\n<p>Keep a public list of the Questions the party is working. Questions open <em>in play</em> — Vesta-9's on session one; the call's the night a gifted character goes looking for the sound:</p>\n<ul>\n<li><em>Why did the Jedi leave the Rim?</em></li>\n<li><em>What is the Valley?</em></li>\n<li><em>Who lit Vesta-9?</em></li>\n<li><em>Why did the Run stay dark?</em></li>\n<li><em>What is calling the gifted up the Run?</em></li>\n<li><em>What did the Adjournment actually adjourn?</em></li>\n</ul>\n<p><em>(GM: track issued fragments and their tags in the GM tools section of this wiki.)</em></p>"}, {"section": "reference", "id": "beacon-relighting", "title": "Relighting a Beacon", "html": "<h1>Relighting a Beacon</h1>\n<p><em>The set-piece skill challenge. Three stages in any order, built so different PCs shine.</em></p>\n<h2>The three stages</h2>\n<h3>1. Wake it</h3>\n<p><strong>Mechanics or Computers</strong> against sixty years of dead-man failsafes.</p>\n<h3>2. Chart it</h3>\n<p><strong>Hard Astrogation</strong>, with <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">fragments</a> and rutters as boost dice.</p>\n<h3>3. Speak to it</h3>\n<p>A <strong>Knowledge or social check</strong> to satisfy old Republic handshake protocols — or to convince a guild observer to certify the lighting.</p>\n<h2>What a relit beacon does</h2>\n<p>Each relit beacon:</p>\n<ul>\n<li><strong>Opens a region</strong> — a corridor of worlds ninety years strange.</li>\n<li><strong>Shifts the faction map.</strong></li>\n<li><strong>Pays a first-lighting fee</strong> (see <a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">the Lamplighters</a>).</li>\n<li><strong>Raises the same question: who follows you through?</strong></li>\n</ul>"}, {"section": "reference", "id": "force", "title": "The Force in the Ember Age", "html": "<h1>The Force in the Ember Age</h1>\n<p><em>In this era the Force is not a skill; it is an event.</em></p>\n<h2>Almost no teachers — Wellsprings</h2>\n<p>Increasing <strong>Force Rating</strong> or opening a <strong>new power tree</strong> requires a <strong>Wellspring</strong> found in play — a functional holocron, a vergence, or, rarest of all, a living mentor from one of the hidden lineages — <strong>in addition to the usual XP.</strong></p>\n<p>Knowledge is treasure.</p>\n<h2>Witnesses</h2>\n<p>Open Force use in front of ordinary people:</p>\n<ul>\n<li><strong>Shifts their disposition one step</strong> — awe or fear, GM's call.</li>\n<li><strong>Adds a setback die to social checks with that community</strong> until the party addresses what they saw.</li>\n</ul>\n<h2>Morality</h2>\n<p>Run it as written, but land the aftermath of Conflict harder: there are no counselors out here, no Council that has heard of this sector, no one to tell a Force-sensitive what the nightmares mean — <strong>except whoever reached them first.</strong></p>"}, {"section": "reference", "id": "obligation", "title": "Obligation", "html": "<h1>Obligation, Reflavored</h1>\n<p><em>Roll or choose. Everyone takes one — it is a broke, indebted galaxy.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th style=\"text-align: center;\">d10</th>\n<th>Obligation</th>\n<th>The Ember Age version</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td><strong>Debt</strong></td>\n<td>Sector scrip or a Kajidic marker, ruinous interest</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td><strong>Family</strong></td>\n<td>You are an isolated homeworld's only link</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td><strong>Oath</strong></td>\n<td>To a dying archivist</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td><strong>Notice</strong></td>\n<td>An Admiralty conscription writ with your name on it</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">5</td>\n<td><strong>Secret</strong></td>\n<td>Someone knows you are Force-sensitive — or love someone who is</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">6</td>\n<td><strong>Obsession</strong></td>\n<td>One fragment you cannot let go</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">7</td>\n<td><strong>Responsibility</strong></td>\n<td>Refugees from a lane that died</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">8</td>\n<td><strong>Contract</strong></td>\n<td>The Lamplighters hold your ship's papers</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">9</td>\n<td><strong>Posted</strong></td>\n<td>A Guild bounty, still live, with your name on it</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">10</td>\n<td>Choose or invent</td>\n<td>Keep it era-true: debts, memory, and the people a dead lane stranded</td>\n</tr>\n</tbody>\n</table></div>\n<p>Run Obligation as written in the core rules (starting totals, triggers, strain effects at threshold). The reflavoring changes who comes knocking, not the math.</p>"}, {"section": "reference", "id": "character-creation", "title": "Character Creation", "html": "<h1>Character Creation</h1>\n<h2>The basics</h2>\n<ul>\n<li><strong>Standard starting XP.</strong> Any career from any of the three core books (Edge of the Empire, Age of Rebellion, Force and Destiny).</li>\n<li><strong>The crew shares one heirloom ship</strong> — a Wayfarer-class, or any YT or Ghtroc hull reflavored as a pre-Ruusan lane-runner, a century old and held together by devotion. See <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:ships\">Ships of the Ember Age</a>.</li>\n<li><strong>Everyone takes <a href=\"#\" class=\"xin\" data-nav=\"page:reference:obligation\">Obligation</a></strong> — it is a broke, indebted galaxy.</li>\n<li><strong>Force-sensitive PCs also track Morality.</strong></li>\n<li><strong>Duty waits until Act 3</strong>, when the party formally aligns with a founding vision. The three mechanics mirror the three acts: survival, then conscience, then cause.</li>\n</ul>\n<h2>Playing one of the Awakened</h2>\n<p>A Force-sensitive PC enters via the <strong>Force-Sensitive Exile</strong> or <strong>Force-Sensitive Emergent</strong> universal specializations, or <strong>any Force and Destiny career</strong>, at <strong>Force Rating 1 — with no teacher who will have them.</strong> The Temple takes children, not adults; the Jedi who never left the Rim are a rumor; whatever taught you, it was not a Jedi.</p>\n<p>Their growth runs through discovery, not tuition: see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:force\">The Force in the Ember Age</a>. Knowledge is treasure.</p>\n<h2>Wayfinder crew concepts</h2>\n<p>The party are <strong>wayfinders</strong> — scout-envoy-archaeologists reopening the galaxy one lane at a time. Any concept that answers \"why does this person reopen dead lanes?\" works: seekers, traders, diplomats, chartkeepers, salvage crews, interpreters (splintered Basic makes them load-bearing), couriers off the swoop circuit, and perhaps one of the newly Force-sensitive.</p>"}, {"section": "setting", "id": "home", "title": "The Ember Age", "html": "<h1>The Ember Age</h1>\n<p><em>A homebrew Star Wars campaign for FFG (Edge of the Empire / Age of Rebellion / Force and Destiny)</em></p>\n<blockquote>\n<p>Hope with rust on it.</p>\n</blockquote>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th></th>\n<th></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>When</strong></td>\n<td>~910 BBY. In-world, the year <strong>90 AR</strong> — After Ruusan.</td>\n</tr>\n<tr>\n<td><strong>What</strong></td>\n<td>Ninety years after the Jedi and Sith annihilated each other at Ruusan, the galaxy has gone dark, ten thousand islands — and the war is passing out of human living memory. Now the Force is returning, the beacons are relighting, and what comes next has not been decided.</td>\n</tr>\n<tr>\n<td><strong>Who</strong></td>\n<td>The player characters are <strong>wayfinders</strong> — a crew of seekers, traders, diplomats, and perhaps one of the newly Force-sensitive — reopening the galaxy one lane at a time.</td>\n</tr>\n<tr>\n<td><strong>Tone</strong></td>\n<td>Hope with rust on it. Rebuilding and discovery. Light and dark finding a way forward together — or the old dogmas returning wearing new faces.</td>\n</tr>\n</tbody>\n</table></div>\n<p>The thesis of the era, and the line to say aloud at session zero:</p>\n<p><strong>Nobody broke the galaxy — everyone just stopped holding it up.</strong></p>\n<hr />\n<h2>Finding your way</h2>\n<ul>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:timeline\">The Withering</a></strong> — the ninety-year timeline from Ruusan to the relighting of Vesta-9.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:galaxy\">The Galaxy at 90 AR</a></strong> — travel, memory, salvage, and the two networks that never stopped running.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:factions\">Factions</a></strong> — six answers to \"what comes next,\" and two standing powers.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:awakening\">The Awakening</a></strong> — the Force is coming back, and nobody knows why.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:structure\">Campaign Structure</a></strong> — three acts: Reconnection, Convergence, the Founding.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:session-one\">Session One: \"The Light on Vesta-9\"</a></strong> — the cold open.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"tab:reference\">Mechanics</a></strong> — character creation, Obligation, Lore Fragments, beacon relighting, and the Force in the Ember Age.</li>\n<li><strong><a href=\"#\" class=\"xin\" data-nav=\"page:setting:glossary\">Terms of the Era</a></strong> — the appendix glossary.</li>\n</ul>\n<div class=\"adm adm-warning\"><p class=\"adm-title\">GM material</p><p>This is the GM's reference. Parts I–IV and VI–VIII can be read aloud or shared as the table discovers them; everything under the <strong>GM</strong> tab (Part V, the NPC library, the trackers) never leaves your side of the screen.</p></div>\n\n<h2>About this campaign and canon</h2>\n<p>This campaign diverges from Legends canon nowhere at all. The record says the Republic and the Jedi Order endured from Ruusan to the prequel era — and here they do: recovered in the Core, reformed, solvent, a Temple full of children. What the record does not say is how far the recovery reached, because records are written by recoveries, and a Senate that adjourned a third of the galaxy remembers itself as whole. The Bane novels remain true, and so does everything published after — this era is simply the chapter nobody wrote down, in the sectors nobody wrote to.</p>\n<p><strong>Your table writes it.</strong></p>"}, {"section": "setting", "id": "timeline", "title": "The Withering (Timeline)", "html": "<h1>The Withering</h1>\n<p><em>Ninety years, decade by decade — how the galaxy went out like a lamp: not smashed, just left untended.</em></p>\n<div class=\"adm adm-quote\"><p class=\"adm-title\">The thesis of the era</p><p><strong>Nobody broke the galaxy — everyone just stopped holding it up.</strong></p></div>\n\n<h2>0 AR — Ruusan</h2>\n<p>Seven battles end the New Sith Wars. Lord Kaan's thought bomb consumes both armies, and a thousand light and dark spirits are bound together in what becomes the Valley of the Jedi. Most of the Jedi Order dies on that world. Publicly, the Sith are extinct. Secretly, Darth Bane walks away with one apprentice and a Rule: two, no more.</p>\n<h2>0–12 AR — The Reformation and the Adjournment</h2>\n<p>The Republic demilitarizes in relief. The <strong>Ruusan Reformation</strong> dissolves the fleets and the Army of Light together, retires the Jedi Lords and their titles, and places what is left of the Order under the Chancellor — no longer generals, now <strong>peacekeepers</strong> who answer to the Senate. The Core rebuilds fast, because the Core was never the battlefield. Out here the graves do not distinguish which order dug them, and in the mouths of the bereaved, <em>Jedi</em> and <em>Sith</em> become one curse.</p>\n<p>The Order, grieving and thin, reforms itself in the same decade. The dead of Ruusan were mostly Jedi who had been taken late and trained in war; the Council resolves never to make that Order again. The new rule: find the gifted <strong>young</strong>, take them from their families to the one <strong>Temple on Coruscant</strong>, raise them without attachment, and hold them to the peace. It is a rule written for a Core that can be searched, by an Order too small to search anything else.</p>\n<p>In 12 AR the Senate votes <strong>the Adjournment</strong>: the dark sectors' seats, charters and obligations are suspended <em>sine die</em> — \"until reconnection\" — and the Republic's writ formally stops where its relays did. The Rim is adjourned, not the Republic. The Order withdraws with it, sealing its Rim temples and deeding stone and relic — property, never the calling — to the custodial order that becomes <a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">the Vigil</a>, under one codicil easy to miss in the minutes: <strong>any three Masters, met together in a sealed temple, may reopen it and seat a chapter of the Order there.</strong></p>\n<p>A few Jedi refuse the recall. They stay where the anger is thickest and do the only thing left: one master, one or two pupils, wherever a gifted child can be found and a family persuaded. The Temple calls them the withdrawn. They call themselves Jedi.</p>\n<h2>12–35 AR — The Long Exhale</h2>\n<p>The fleets are decommissioned faster than anything replaces them, and sector defense devolves to local squadrons. Around 20 AR, one admiral simply declines the recall order, citing piracy — and instead of sailing coreward to be scrapped, takes her squadron, tenders and yard-ships rimward down the Enarc Run, past the last living relay, to quiet, half-charted Naboo. She is quietly ignored, then quietly forgotten. <a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">Her heirs never leave.</a> The pocket they fortify — fed by the plasma seams their engineers open — has no name the living galaxy would recognize; the government her heirs build there styles itself, in time, the <strong>Naboo Admiralty</strong>. The living galaxy will not hear from it for seventy years.</p>\n<h2>35–45 AR — The Quiet Ledger</h2>\n<p>No villain kills the HoloNet; appropriations committees do. Relay maintenance lapses sector by sector. Interstellar credit fractures into sector scrip. Long-haul trade privatizes, then localizes, then stops.</p>\n<h2>45–75 AR — The Drift and the Ebb</h2>\n<p>The last adjourned delegations stop sending even observers to a Senate whose sessions cost more to reach than they are worth. Meanwhile Force-sensitive births thin to almost nothing — <strong>the Ebb</strong> — and in the Core the Temple <em>notices</em>, because the Temple counts: its search returns fewer children each year, and the Order hardens its rule in response, taking every gifted child it can find, younger each decade. In the Rim, no one is counting. The few children born with the gift are hidden by their own families, because the surest way to lose a child is to let the neighbors hear the word <em>Jedi</em>. The withdrawn lineages starve for pupils, and one by one they snap — the last of them ends quietly, unremarked, a generation before anyone knows the Force is coming back.</p>\n<h2>75–90 AR — The Dimming and the Awakening</h2>\n<p>The war generation begins to die. News travels by courier and arrives as rumor, and on ten thousand worlds the Jedi and Sith pass from testimony into story. Then, in the same years, the Ebb reverses: Force-sensitive children are born in rising numbers, the oldest of them now young adults. In the Core the Temple's creches fill and its doctrine holds. In the Rim the galaxy is forgetting the Force at exactly the moment the Force remembers the galaxy — and no one out here has seen a Jedi in a lifetime.</p>\n<p>Around 80 AR the Lamplighters — the guild that spent the century leading the Corellian Run's restoration — abruptly redirect their first-lighting prizes down the old <strong>Duros Space Run</strong>, turning aside at New Cov with Ryloth still unreached. The Core is surprised; the payouts keep coming anyway. Kalarba, Kyrska, Glom Tho and Triffis come back onto the charts inside a decade, every prize paid in full — the last claimed by the crew of the <em>Larksong</em> — and a new fueling station rises at Bannistar to feed the advance. Then the advance stops: the next beacon cannot be found, the prize hangs unclaimed for years, and Bannistar's boomtown slides into recession. The reconnected worlds begin trading again. Their adjourned Senate seats stay adjourned; no overture comes.</p>\n<p>In 90 AR, hyperspace beacon <strong>Vesta-9</strong> — dark for sixty years, and the unfound beacon the whole advance stalled on — relights. Nobody admits to lighting it.</p>\n<h2>Living memory at 90 AR</h2>\n<p>For humans, Ruusan is now a childhood memory of the very old: the last people who watched the armies pass are in their nineties, and they are dying this decade. For longer-lived species the ledger is different — a Wookiee who fought there is barely middle-aged, a Duros merchant remembers the Republic solvent, a Hutt remembers it whole. Galactic memory is stratified by species, and humans are already mythologizing what a living eyewitness two docks over can flatly contradict.</p>\n<p>History here is not yet archaeology. <strong>It can still be interviewed — and the interviews disagree.</strong></p>\n<p><em>(At the table, that sentence is a mechanic: see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">Lore Fragments</a>.)</em></p>"}, {"section": "setting", "id": "galaxy", "title": "The Galaxy at 90 AR", "html": "<h1>The Galaxy at 90 AR</h1>\n<p><em>What daily life looks like ninety years into the Withering.</em></p>\n<h2>Travel is the defining fact of life</h2>\n<p>A handful of major lanes still run intermittently; minor routes have decayed past their nav data, and a <strong>rutter</strong> — an inherited, annotated route-log — is often worth more than the ship carrying it. Starships are heirlooms maintained by devotion, and the few shipyards that still function are strategic prizes worth wars.</p>\n<p>News moves by courier packet and arrives months old, already halfway to myth. The geography has split in two: the Core recovered — a working Senate, a Temple, lanes that run on schedule — and then stopped, at the line where the relays did. Out past it the Withering is the only weather, and some Rim worlds, forced into self-sufficiency early, have quietly thrived and see no reason to be \"reconnected.\"</p>\n<h2>The Force, remembered wrong</h2>\n<p>In the Core the Jedi are an institution: the Chancellor's peacekeepers, a Temple that sends for your gifted child at three, a word in the newsfeeds. Out here no one has seen a Jedi in a lifetime, and where the Force is remembered at all, it is remembered as the thing that burned the old galaxy down — the Run was Sith country, and the principalities told their subjects for a century who the invaders were. The grudge is generational — a ledger of war dead read out at funerals, with Jedi and Sith entered in the same column. Reactions to the gift run superstitious: awe, terror, and, under both, blame.</p>\n<p><em>(Mechanically, this is the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:force\">witness rule</a>: in this era the Force is not a skill; it is an event.)</em></p>\n<h2>The economy of leftovers</h2>\n<p>The Withering built its own institutions in the corners. Nothing new gets manufactured at scale, so the real economy is salvage: junk barons, chop-yards, and scavenger clans stripping the war's leftovers, with the best finds moving through <a href=\"#\" class=\"xin\" data-nav=\"page:setting:kajidics\">Kajidic</a> markets.</p>\n<p>Droids are heirlooms like everything else, and a pre-war droid with an unwiped memory core is a walking archive — which makes old droids quietly precious and occasionally hunted. Ninety years of isolation has splintered Basic into local creoles, so protocol droids and flesh-and-blood interpreters are load-bearing professions again.</p>\n<h2>The two networks that never stopped running</h2>\n<p>With the HoloNet dead, news moves through:</p>\n<ul>\n<li><strong>The cantina</strong> — where a good rumor is worth a drink minimum, and ships still change hands over sabacc.</li>\n<li><strong>The swoop circuit</strong> — whose racers carry mail, gossip, and contraband between systems. The season standings are the closest thing the galaxy has to a shared broadcast.</li>\n</ul>"}, {"section": "setting", "id": "awakening", "title": "The Awakening", "html": "<h1>The Awakening</h1>\n<p><em>The Force is coming back. Nobody knows why. The Temple thinks it is ready.</em></p>\n<p>For a generation almost no one was born with the gift; for the last twenty years the births have been rising, and no one knows why. The signs are consistent:</p>\n<ul>\n<li><strong>True dreams.</strong></li>\n<li><strong>The hearth-sense</strong> — reading a room's feeling like weather.</li>\n<li><strong>Small luck that bends.</strong></li>\n</ul>\n<p>In the Core there is an answer for it: the <strong>Temple</strong> on Coruscant, which has been finding gifted children and raising them since the Reformation, and whose creches are fuller this decade than in living memory. Out here there is nothing — no school, no Council that has ever heard of this sector, at most a rumor of a withdrawn Jedi or two in the deep systems, not advertising — and a galaxy with a generational grudge: households that buried sons over the orders' last war now watch the neighbor's daughter bend luck, and respond with worship, exile, or drowning-fear.</p>\n<h2>The ask</h2>\n<p>The Republic's charter ships carry a Jedi, and the Jedi carries the Temple's rule: <em>send us your gifted children.</em> Young — three, four, five — and to Coruscant, and not back. The Run hears that sentence through a century of principality propaganda and its own war dead, and what it hears is the invader, the child-taker, and, faintly, the old liberator. Every relit beacon makes the ask reachable for another world. Every answer is a scene.</p>\n<p>And the Temple has no rule for an adult. A twenty-year-old who dreams true is, by doctrine, too old to train and too dangerous to ignore — so the Order watches, which the watched can feel.</p>\n<h2>Three parties are counting</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Who</th>\n<th>Wants the gifted as</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:jedi\">The Jedi Order</a></td>\n<td><strong>Initiates</strong> — the young ones, for the Temple; the rest, watched</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:republic\">The Republic</a></td>\n<td>A census — and the Temple's quota met, as a condition of the charter</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">The Admiralty</a></td>\n<td>Assets</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">The Vigil</a></td>\n<td>Wards — the gift is a war orphan: kept <em>here</em>, taught restraint</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:inheritors\">The Inheritors</a></td>\n<td>Apprentices</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">The Lamplighters</a></td>\n<td>Navigators — quietly. A child who dreams true can feel a dead lane the way old pilots claim to</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:kajidics\">The Kajidics</a></td>\n<td>Merchandise</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:mandalorians\">The Mandalorian Clans</a></td>\n<td>Nothing — they simply adopt them. A foundling who bends luck is just a promising warrior</td>\n</tr>\n</tbody>\n</table></div>\n<p><em>(GM: there is a fourth count, and it is the oldest — see Dial 1.)</em></p>\n<h2>The question under the question</h2>\n<p>The Jedi of 90 AR are peacekeepers — the Chancellor's, answerable to a Senate, forbidden the war that made them, raising children to keep a peace the Rim never got. Is that what the Force is about? The Temple says yes. The withdrawn Jedi who never left the Rim say something else. The Awakened at your table will be asked to choose, by people who each think the choice is obvious.</p>\n<h2>The Awakening sits at your table</h2>\n<p>This is not a backdrop: one or more of the player characters carries the gift (see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:character-creation\">Character Creation</a>). Every policy in the table above is aimed at somebody's character sheet — the census, the assets, the custody, the apprenticeship, the navigator's articles, the Temple's watching. The party doesn't watch the Awakening happen to the galaxy. The galaxy watches it happen to the party, starting the night <a href=\"#\" class=\"xin\" data-nav=\"page:setting:session-one\">a sixty-years-dead beacon lights itself and three factions ask the crew to swear to who did it</a>.</p>"}, {"section": "setting", "id": "glossary", "title": "Terms of the Era", "html": "<h1>Terms of the Era</h1>\n<p><em>The appendix glossary — the words everyone at the table should end up using without thinking.</em></p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Term</th>\n<th>Meaning</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>AR</strong></td>\n<td>After Ruusan, the common calendar</td>\n</tr>\n<tr>\n<td><strong>the Withering</strong></td>\n<td>The long decline</td>\n</tr>\n<tr>\n<td><strong>the Ebb / the Awakening</strong></td>\n<td>The Force's fall and return</td>\n</tr>\n<tr>\n<td><strong>wayfinder</strong></td>\n<td>Scout-envoy-archaeologist; the party</td>\n</tr>\n<tr>\n<td><strong>rutter</strong></td>\n<td>An inherited, annotated route-log</td>\n</tr>\n<tr>\n<td><strong>scrip</strong></td>\n<td>Sector currency</td>\n</tr>\n<tr>\n<td><strong>first-lighting</strong></td>\n<td>Fee and honor for reopening a beacon</td>\n</tr>\n<tr>\n<td><strong>the Adjournment</strong></td>\n<td>The Senate's vote of 12 AR suspending the dark sectors' seats, charters and obligations sine die — the Rim was adjourned, not the Republic; the Order withdrew with it</td>\n</tr>\n<tr>\n<td><strong>the Temple</strong></td>\n<td>The Jedi Order's one house, on Coruscant — where the gifted are sent, young, and not sent back</td>\n</tr>\n<tr>\n<td><strong>the withdrawn</strong></td>\n<td>The Temple's word for the Jedi who refused the recall and stayed in the Rim. They call themselves Jedi</td>\n</tr>\n<tr>\n<td><strong>the Naboo Admiralty</strong></td>\n<td>The fleet that refused demobilization, anchored at Naboo beyond the Enarc Run — the last state navy in the galaxy, and now its own state</td>\n</tr>\n<tr>\n<td><strong>the black lanes</strong></td>\n<td>The dark, unregistered routes the Kajidics never stopped flying</td>\n</tr>\n<tr>\n<td><strong>a posting</strong></td>\n<td>A Guild bounty, the one writ that still travels</td>\n</tr>\n<tr>\n<td><strong>the Quiet</strong></td>\n<td>Deep-rim slang for dead space</td>\n</tr>\n<tr>\n<td><strong>the Run</strong></td>\n<td>The Duros Space Run — and, in spacer mouths, the whole dark country around it: you live and fly <em>out on the Run</em>. The lane itself is being relit hop by hop back toward the Hydian Way</td>\n</tr>\n<tr>\n<td><strong>the Grumani sector</strong></td>\n<td>The old principality cluster along the Run's deep half — Sith country in the wars</td>\n</tr>\n</tbody>\n</table></div>"}, {"section": "setting", "id": "geography", "title": "The Road Back to the Hydian", "html": "<h1>The Road Back to the Hydian</h1>\n<p><em>Where the campaign happens: real charts, dead lanes. Player-safe — this is the geography any spacer at Okrent's Drift could sketch on a napkin.</em></p>\n<h2>The country: the Duros Run</h2>\n<p>The crew starts in the dark interior of the Outer Rim, in the country spacers name for the lane that threads it: <strong>the Duros Run</strong>. You are <em>out on the Run</em>, and everything on it shares the name. Its deep half crosses the old <strong>Grumani sector</strong>, and a century ago that was Sith country: during the Republic Dark Age the sector shattered into warlord principalities — the Daimanate, the Bactranate, the Arkadianate, the Dyarchy — and the last war burned through it on the way to Ruusan. The Republic's recovery never reached this far back out. The principalities are dust; their worlds are still here, grown strange in the dark.</p>\n<h2>The lane home: the Duros Space Run</h2>\n<p>The country's one real lane is the <strong>Duros Space Run</strong>, which once carried trade from the Mid Rim all the way to the <strong>Hydian Way</strong> at <strong>Darkknell</strong>. For most of the last century the Lamplighters' great work was elsewhere: after the Ruusan reformations it was the guild, not the Senate, that led the restoration of the <strong>Corellian Run</strong>, relighting that artery stretch by stretch, and everyone assumed the prizes would keep following it rimward toward Ryloth. Instead, ten years ago, the guild surprised the Core — it began posting first-lighting prizes down the old Duros Space Run, from the Corellian Run junction at <strong>Churba / New Cov</strong> into country the recovery had written off.</p>\n<p>The prizes were claimed the way prizes are, one beacon and one corridor at a time: <strong>Kalarba</strong>, <strong>Kyrska</strong>, <strong>Glom Tho</strong>, and finally <strong>Triffis</strong>, whose prize the crew of the <em>Larksong</em> collected. The guild paid every one in full, and the reconnected worlds have slowly begun pricing themselves back into the galactic economy — though the Senate, whose Adjournment was worded <em>\"until reconnection,\"</em> has made no overture about restoring their seats.</p>\n<p>Then the advance stopped. The next beacon up the lane — <strong>Vesta-9</strong>, serving the long hop beyond Bannistar — has beaten every survey sent after it: dark for sixty years and, apparently, not where the old charts say it should be. Its prize has hung unclaimed for years, and <strong>Bannistar Station</strong> — fuel gantries raised new on the momentum of the advance, with <strong>Okrent's Drift</strong> growing up around their footings — has slid from boomtown to recession, the frayed end of the living lane. Everything beyond is beacon-dark.</p>\n<p><strong>The chain — one relit beacon per hop:</strong></p>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th style=\"text-align: center;\">#</th>\n<th>System</th>\n<th>What's there at 90 AR</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">⌂</td>\n<td><strong>Bannistar Station</strong></td>\n<td>The great fuel gantries — raised new for the advance up the Run, half-idle since it stalled — and <strong>Okrent's Drift</strong>, the port that grew on their back. Campaign start; the frayed end of the living Run</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">1</td>\n<td><strong>Enarc</strong></td>\n<td>A sealed crossroads — the <strong>Enarc Run</strong> (toward Naboo and the Rimma) and the Hutt-ringed <strong>Triellus</strong> once met the Run here. Now the <strong>Anchorage of Sorulba</strong>: a closed Hutt kingdom where any ship may dock and none has left in forty years. Spacers say it plainly — Enarc eats ships</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">2</td>\n<td><strong>Aquilaris</strong></td>\n<td>Drowned resort world — first of the deep-Run stops</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">3</td>\n<td><strong>Verdanth</strong></td>\n<td>Jungle world</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">4</td>\n<td><strong>Aplooine</strong></td>\n<td>Quiet agrarian survivor</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">5</td>\n<td><strong>Sanrafsix</strong></td>\n<td>The great dead hub — its bazaars thrived on the last war's economy and died with it. Junction of the smugglers' <strong>Sanrafsix Corridor</strong></td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">6</td>\n<td><strong>Heptooine</strong></td>\n<td>The Run's last waystop</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">7</td>\n<td><strong>Jutrand</strong></td>\n<td>City-planet; capital of a dead Sith principality, haunted by its own grandeur</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">★</td>\n<td><strong>Darkknell</strong></td>\n<td>The lights come back on: a trinary-sun trade city that never stopped, the Hydian Way's local anchor</td>\n</tr>\n<tr>\n<td style=\"text-align: center;\">★★</td>\n<td><strong>Eriadu</strong></td>\n<td>One Hydian hop south: the junction of the <strong>Hydian Way</strong> and the <strong>Rimma Trade Route</strong>. See below</td>\n</tr>\n</tbody>\n</table></div>\n<p>Side-lanes off the chain, for side arcs and episode worlds: the <strong>Sanrafsix Corridor</strong> (Syned, Fostin Nine, Omwat — a notorious smugglers' road through the Sanrafsix junction), the <strong>Enarc Run</strong>, and the dead local spurs into old principality space (Chelloa, Byllura, Gazzari).</p>\n<h2>The prize: Eriadu</h2>\n<p>At the far end of the chain, where the Run meets the living galaxy, sits <strong>Eriadu</strong> — an old, modest world best known for delicate shellwork jewelry, which happens to occupy the most valuable crossroads in the southern Rim: the Hydian Way crossed the Rimma Trade Route, plus the minor <strong>Lipsec Run</strong>. Every faction can read a chart. Whoever holds the relit corridor when Eriadu wakes up owns the front door of the next century — and there are already rumors of coreward money, old families from Corulag, taking an interest in the place.</p>\n<h2>Why the lanes are dark: the two darkenings</h2>\n<p>The Run's beacons died <strong>twice</strong>, and the distinction matters to anyone reading old rutters:</p>\n<ol>\n<li><strong>The first darkening (before Ruusan).</strong> In the depths of the Dark Age, the old Republic — bankrupt and losing — <em>deliberately shut down</em> its hyperspace relays beyond the Core, to deny the Sith the network. Thousands of systems went dark by policy. Out here, most beacons never came back: the oldest rutter pages describe lanes no living pilot has run.</li>\n<li><strong>The second darkening (the Withering).</strong> After Ruusan the recovery relit beacons Core-outward — slowly, and only so far. Vesta-9's sixty dark years date from this lapse: it was revived in the early Reformation and abandoned again when the appropriations stopped. The Withering is not the war's darkness; it is the recovery giving up.</li>\n</ol>\n<p>Both darkenings left more than silence: ninety years without traffic <strong>rewilded the lane itself</strong>. Dead stations wear mynock colonies like moss, war-wreck fields have grown into reefs with residents, and the deep worlds' abandoned farms belong to their livestock's feral great-grandchildren. Spacer wisdom on the living end of the Run is blunt about it — <em>check your intakes, light your holds, and never open a hatch that's been shut sixty years without standing to the side</em> — and when a beacon relights, the dark's tenants move up the lane ahead of the light: the wave of displaced mynocks is read as an omen from Bannistar to New Cov.</p>\n<h2>The far end: the Dead Gate</h2>\n<p>Every spacer eventually asks it: Darkknell is alive, rich, and one hop from Jutrand — so why has nobody ever relit the Run from <em>that</em> end? Two answers, and every merchant house on Darkknell can recite both.</p>\n<p>The first is arithmetic. From New Cov, every relit hop reconnects a living world that starts paying the day its beacon lights. From Darkknell, the first hops inward are Jutrand and the old principality cores — the deepest, strangest worlds on the Run — and a lane pays nothing in through-traffic until it is lit end to end. One direction is a ladder of small returns; the other is an all-or-nothing bet whose first rungs are haunted.</p>\n<p>The second answer has a graveyard in it. The two darkenings were not symmetrical. The Mid Rim end's beacons were Republic-pattern relays, cleanly mothballed by policy — anyone with the codes can wake one, which is exactly what the guild's advance has been doing. But the deep end was principality country, and to the Daimanate and the Bactranate, beacon control was <em>war infrastructure</em>: they fortified their approaches from the Hydian, keyed their masts to their own courts, and when the principalities died, their network died with them — masts slagged in the last campaigns, cores under dead-man locks answering to dynasties that are dust, approach lanes still sown with the war's ordnance. From Darkknell inward you do not relight beacons; you <em>rebuild</em> them, under fire from a dead century. Early in the Reformation a chartered venture out of Darkknell — the <strong>Jutrand Commission</strong> — spent a fortune and several ships proving it, and no bond-writer on Darkknell has underwritten the dark Run since: no bond, no certificate, no claim. Darkknell spacers call the Run's mouth <strong>the Dead Gate</strong>, and the insurance rates are how it keeps the name.</p>\n<p>And a quieter oddity, for the curious: now and then coreward money — Eriadu's new families, a Corulag consortium — talks about forcing the Gate anyway and meeting the guild's advance in the middle. Somehow the talk always dies: a syndicate loses its backers, a survey is cancelled, a prospectus goes missing. Nobody has ever explained why.</p>\n<h2>The far road: toward the Valley</h2>\n<p>Every child knows the armies reached <strong>Ruusan</strong> seven times, so the road exists: up the <strong>Hydian Way</strong> the entire way coreward — Darkknell, Malastare (itself a raw colony barely older than the Withering), Denon — to <strong>Brentaal</strong>, where the Hydian crosses the <strong>Perlemian Trade Route</strong>; rimward down the Perlemian to <strong>Lantillies</strong>; then the <strong>Randon Run</strong> past <strong>Kashyyyk</strong> — and off the charts, into the Teraab stellar nursery, where the nebulae themselves have been quietly eating the last lanes to Ruusan ever since the war ended.</p>\n<p>The crew is relighting beacons at one end of that road. The Valley is at the other.</p>"}, {"section": "setting", "id": "factions", "title": "Factions Overview", "html": "<h1>Factions</h1>\n<p>Seven answers to the question <strong>\"what comes next,\"</strong> then two standing powers not in the race but impossible to ignore. Each entry: who they are, what they want, what they offer a wayfinder crew, and the crack running through them.</p>\n<h2>The seven answers</h2>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th>Faction</th>\n<th>What comes next</th>\n<th>Offers the crew</th>\n<th>The crack</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:republic\">The Republic</a></td>\n<td>Reconnection — the adjourned Rim re-chartered on Coruscant's terms</td>\n<td>Accreditation, archive access, the flag</td>\n<td>It recovered by adjourning the Rim, and would rather nobody read the minutes</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:jedi\">The Jedi Order</a></td>\n<td>The Temple's peace — and the Rim's gifted children, sent young</td>\n<td>A Jedi's word, training for the very young, authentication</td>\n<td>Peacekeepers now; is that what the Force is about?</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">The Naboo Admiralty</a></td>\n<td>The Charter — the Run as a protected independency under the fleet</td>\n<td>Escort, fuel, repair, genuine safety</td>\n<td>Treaty wing vs the Founding cadre — and the Founding needs an enemy</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">The Vigil</a></td>\n<td>Veneration without practice, forever — the war's graves kept, the seals honored</td>\n<td>Sanctuary, the war's true records, sealed places</td>\n<td>The newly Force-sensitive split them in half; the Order's return splits them again</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:inheritors\">The Inheritors</a></td>\n<td>A monopoly on the returning Force</td>\n<td>Real training, when no one else can teach</td>\n<td>They don't know whose hand is at the top</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">The Lamplighters</a></td>\n<td>The network relit — in the order they choose</td>\n<td>Charters, salvage rights, first-lighting fees</td>\n<td>Whoever sets the order decides the century</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:kajidics\">The Kajidics</a></td>\n<td>Nothing, thank you — scarcity is margin</td>\n<td>Fuel, parts, black-lane rutters, no questions</td>\n<td>The young Hutts have run the numbers</td>\n</tr>\n</tbody>\n</table></div>\n<h2>The two standing powers</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Power</th>\n<th>Position</th>\n<th>To the crew</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:guild\">The Bounty Hunters' Guild</a></td>\n<td>The posting is the one writ that still travels</td>\n<td>Employer, threat, and the only enforcement a promise has</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:mandalorians\">The Mandalorian Clans</a></td>\n<td>War is work; foundlings are foundlings</td>\n<td>The finest soldiers alive, and everyone's contingency plan</td>\n</tr>\n</tbody>\n</table></div>"}, {"section": "setting", "id": "republic", "title": "The Republic", "html": "<h1>The Republic</h1>\n<p><em>Recovered, solvent, and sure of itself — a thousand lanes away.</em></p>\n<h2>Who they are</h2>\n<p>The Galactic Republic of the Reformation: a working Senate on Coruscant, a Chancellor with Jedi peacekeepers at his call, no army by law, and a writ that has stopped, for eighty years, exactly where the relays did. It does not think of itself as provisional. It thinks of itself as <em>recovered</em> — and it recovered by adjourning the Rim.</p>\n<p>Out here it arrives as charter ships: an envoy-archivist, a cargo of forms, a Jedi, and the quiet assumption that the Run has been waiting.</p>\n<h2>What they want</h2>\n<p>Every relit beacon registered under Republic charter, the adjourned delegations folded into <strong>sector seats</strong> — one senator per sector, not the old one-world-one-vote rolls — and the Temple's quota met: the gifted children of the reconnected worlds, found and sent. Continuity, not conquest — which, to a world that was adjourned without being asked, can look like the same thing.</p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>Letters of accreditation</strong> — and with them, lanes that are suddenly legal.</li>\n<li><strong>Archive access</strong> — the richest source of <strong>Civic</strong> <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a>, and the only record of the Adjournment's minutes.</li>\n<li><strong>The flag</strong> — moral cover that still means something, two hops from anywhere that remembers it.</li>\n</ul>\n<h2>The crack</h2>\n<p>A Republic that rebuilt itself without an army and without the Rim now wants the Rim back, and has only two instruments to take it with: paperwork, and the Jedi. Every charter it signs out here is an admission that the Adjournment was a choice — which is why the four worlds relit along the Duros Space Run this past decade, reconnected in exactly the sense the Adjournment's <em>\"until reconnection\"</em> named, heard nothing about their seats for ten years: restoring them one-for-one means explaining why the rest stayed suspended, and diluting every Core vote in the chamber. The overture finally coming with the accreditation mission is the Senate's workaround — <strong>reinstatement by sector</strong>: one senator for the whole Grumani sector, in place of the old one-world-one-seat delegations. Representation restored without the seats being restored, and everyone out here can do that math. It is a hard sell. Everything Republic is a hard sell out here. The senators who remember making the Adjournment are very old, and very anxious that the Rim not read the minutes.</p>"}, {"section": "setting", "id": "jedi", "title": "The Jedi Order", "html": "<h1>The Jedi Order</h1>\n<p><em>The Temple's peacekeepers — rare, reformed, and a century absent from the Run.</em></p>\n<h2>Who they are</h2>\n<p>The Order the Reformation made: no Lords, no armies, one Temple on Coruscant, and a doctrine written in grief. The Jedi of 90 AR are found young, taken from their families, raised without attachment, and sworn to a peace they keep on the Chancellor's behalf — investigators, mediators, the Senate's conscience with a lightsaber. There are fewer of them than there are sectors. They believe the Sith extinct, and they are the reason the Sith are careful.</p>\n<p>They have not been out on the Run since the Adjournment. The last Jedi anyone here remembers were Knight Errant–era warriors fighting Sith Lords through these systems — and the principalities spent the century after telling their subjects who the invaders had been.</p>\n<h2>What they want</h2>\n<p>The gifted children of the reconnected Rim, found early and sent to the Temple. The sealed temples reopened under the Council's authority. And no Jedi in the Rim who answer to no Council — the withdrawn lineages are believed extinct, which makes the rumor of a hermit Master somewhere up the Run, answering to nobody and teaching nobody knows what, a doctrinal problem the Temple has not yet admitted to having.</p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>A Jedi's word</strong>, which out here is the only Republic writ that can't be forged.</li>\n<li><strong>Training</strong> — for the very young. For an adult who bends luck, they offer watching.</li>\n<li><strong>Authentication</strong> of Jedi relics and the <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a> that carry the Jedi tag — the Temple's archive is the one that was never scattered.</li>\n<li><strong>Protection</strong> from things they do not believe exist.</li>\n</ul>\n<h2>The crack</h2>\n<p>They are peacekeepers now. Police, with a Senate to answer to and a war they are forbidden to fight. Half the Order has made its peace with that; the other half remembers, or has read, what the Force was before Ruusan turned it into a civic service — and the Run is full of people who will ask them, to their faces, <em>is that really what the Force is about?</em></p>\n<p>And the doctrine has no answer for an adult. The Temple takes children; it cannot take a twenty-year-old who dreams true, and it cannot stop watching one.</p>\n<p><em>(The Temple's envoy, and the hermit the Temple does not speak of, are in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> — GM only.)</em></p>"}, {"section": "setting", "id": "admiralty", "title": "The Naboo Admiralty", "html": "<h1>The Naboo Admiralty</h1>\n<p><em>The fleet that never demobilized, become its own state — unknown to this side of the galaxy until the night Vesta-9 lit.</em></p>\n<h2>Who they are</h2>\n<p>When the Ruusan Reformation dissolved the fleets, one squadron refused. Its admiral declined the recall, citing piracy — and instead of sailing coreward to be scrapped, took her squadron, her tenders, and her yard-ships <em>rimward</em>, down the Enarc Run past the last living relay, to quiet, half-charted Naboo. Ninety years later her heirs govern that pocket as <strong>the Naboo Admiralty</strong> — the fleet become a state: yards kept alive on the plasma seams their engineers opened, hereditary commissions hardening into an aristocracy of service, and a watch that never ended. To the living side of the Run they were a rumor out of the dark until the <em>Steadfast</em> came up the dead lane behind the Vesta-9 relight, flying a registry no chart lists. The last state fleet in the galaxy — and it believes, sincerely, that it is the last watch standing between order and the dark.</p>\n<h2>What they believe</h2>\n<ul>\n<li><strong>The Watch.</strong> The Reformation scrapped the fleets while the Rim burned; this fleet alone kept the watch — unpaid, unthanked, in the dark, for ninety years. Every ceremony, rank, and grudge flows from that story, and its strength is that it is true.</li>\n<li><strong>Service is citizenship.</strong> Under the Admiralty, rights are earned at a post — a patrol crewed, a yard shift worked, a watch stood. It sounds like fairness, it recruits like wildfire in a recession port, and it is quietly becoming a caste state: the officer families above, the served-for below, and everyone who does not serve becoming cargo.</li>\n<li><strong>The Charter.</strong> Their politics in one demand: the Run and its approaches as a protected independency, never again dependent on a Core that proved it will leave. Not secession, in their telling — <em>succession</em>: the Republic abandoned its writ, and the writ passed to those who kept it.</li>\n</ul>\n<h2>What they want</h2>\n<p>The relit lanes under naval protection — which is to say under naval law — and a <em>market</em>: after ninety years of autarky the Naboo pocket is exhausted, and a fleet's worth of plasma and yard-work is worthless without buyers. That double want is the live tension in everything they do, because a fleet that needs commerce cannot simply conquer its customers. And they conscript.</p>\n<h2>What they offer a wayfinder crew</h2>\n<p>What no one else can: <strong>escort, fuel, repair, genuine safety</strong> — out here, theirs is the only power that answers a distress call. The pitch lands because it is half true: the Republic dissolved its fleets by law, adjourned the Rim, and sends paperwork and a Jedi to take it back.</p>\n<h2>The crack</h2>\n<p><strong>Treaty against Founding.</strong> The old command wants the lanes open and tariffed — merchants with guns, wealth without overextension. The young cadre wants <strong>the Founding</strong>: one fleet, one law, one lane — the Charter imposed rather than negotiated, and the census as protection's natural instrument. The founding story requires an enemy, and if the Sith do not return, the Founding cadre will need one — or will settle for whoever is nearest. And underneath both wings: a fleet with order, ships, and a hunger for legitimacy has everything an empire needs except a cause. That vacancy is the most dangerous recruiting post in the galaxy — for whoever fills it, and for everyone after.</p>"}, {"section": "setting", "id": "vigil", "title": "The Vigil", "html": "<h1>The Vigil</h1>\n<p><em>The war's grave-keepers — the watch over the dead and the doors, and the standing peace terms with the bereaved.</em></p>\n<h2>Who they are</h2>\n<p>Founded at the war's end by the people who stayed to bury it: Ruusan's grave-tenders, the lay custodians the Order left holding its keys, and the locals of the Brotherhood's old country who dug both armies' graves. When the Jedi sealed their Rim temples in the year of the Adjournment and went home to Coruscant, the Council deeded the stone and the relics to the Vigil — <strong>custody of property, though nothing in the minutes grants them custody of the calling</strong> — under a single instruction: keep it locked. The Vigil kept it locked, and kept everything else besides: the battlefields, the tombs, the sealed academies of the dead principalities, and the lists of the fallen. An angry galaxy tolerates them precisely because they keep it all shut; their doctrine is not only faith, it is the standing peace terms with the bereaved.</p>\n<p>They are not a priesthood of the departed Jedi, whatever a coreward visitor assumes at first sight of the veils. They are the people who cleaned up after the Force's last war, on the ground where it was fought — and they know that war the way the Core does not: not as a chapter title but as family memory with map references. The Temple's archive was never scattered; the Vigil's was never <em>edited</em>. Which lineages fought here, who refused the recall, what the principalities did to their subjects, where the bodies are — the Vigil holds the ledger the Core sanitized, and reads a page of it aloud at every funeral: the <strong>necrology</strong>, the war dead entered in one column, Jedi and Sith together, because a grave-keeper does not sort the dead by whose fault they were.</p>\n<h2>What they believe</h2>\n<p>Not veneration of the Force — <strong>respect</strong> for it, the way a drowned-sailor town respects the sea: real, holy, lethal, never trusted. <strong>Veneration without practice</strong> is their whole law: tend the graves, keep the seals, teach the gifted restraint — and forbid, absolutely, the <em>use</em> of any of it, so that the fire can never spread here again. Eighty years of keeping those terms have made them the Rim's own answer to the Force, and they have had time to decide they prefer it to Coruscant's.</p>\n<h2>What they want</h2>\n<p>The seals honored. The graves left alone by the prize-rush pouring up the Run. And the Awakened of this country kept <em>here</em>: the gift is a war orphan — they buried its parents, and they mean to raise its children — taught restraint, never an order, never a title, never sent coreward at five years old to a Temple that did not come to the funerals.</p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>Sanctuary</strong> — with no registry attached.</li>\n<li><strong>The war's true records</strong> — authentication of war-era relics and <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a>, and testimony the Core never wrote down. (They are the second-best authenticators in the galaxy. Nobody, including them, knows who is first.)</li>\n<li><strong>Access to sealed places</strong> no one else may enter — including the temples the Temple now wants back.</li>\n</ul>\n<h2>How the Run sees them</h2>\n<p>The relit decade introduced them ahead of the campaign: every corridor the advance opened turned out to have Vigil sites in it — sealed doors under grey tape and script, and a warden arriving within the season to stand at whatever the prospectors had uncovered. So the living end of the Run already has a settled opinion of them, and it is conveniently wrong: <em>a weird religious sect</em> — grave cult, mostly harmless, don't touch what they've taped off, don't ask about the lists. Spacers trade Vigil stories the way they trade weather. Almost nobody has noticed that the strange grey order that mumbles over graves is also the only institution on the Run that knows what is behind every door the rush is about to open.</p>\n<h2>The crack</h2>\n<p>The newly Force-sensitive split them in half: sacrilege walking around in children's bodies, or the Order reborn. The Order's return splits them again: half the Vigil will hand over the keys and weep with relief; half will not hand over the children, and has begun to wonder whether eighty years of keeping the watch has <em>earned</em> something the minutes never granted.</p>\n<p>And beneath it sits the deed itself: their authority covers stone and relic, not flesh — a distinction somebody from Coruscant is eventually going to read aloud, in a sealed temple, with two other Masters present.</p>"}, {"section": "setting", "id": "inheritors", "title": "The Inheritors", "html": "<h1>The Inheritors</h1>\n<p><em>A patient whisper-network selling the era's most dangerous currency: answers.</em></p>\n<h2>Who they are</h2>\n<p>Founded by the Brotherhood's surviving quartermasters, collaborators, and camp-followers — some of them still alive — the network has spent three generations quietly hoarding Sith lore, and, lately, arriving first on the doorsteps of frightened Force-sensitive families with answers, flattery, and coin.</p>\n<h2>What they want</h2>\n<p>A monopoly on the returning Force.</p>\n<h2>What they offer a wayfinder crew</h2>\n<p>The era's most dangerous currency: <strong>real training, when no one else alive can teach.</strong></p>\n<h2>The crack</h2>\n<p>Even senior Inheritors are not sure whose hand is at the top of their own organization — whether they serve a living tradition or are merely wearing its costume.</p>\n<p><em>(The GM knows the answer.)</em></p>"}, {"section": "setting", "id": "lamplighters", "title": "The Lamplighters", "html": "<h1>The Lamplighters</h1>\n<p><em>The beacon-tenders' guild — nominally neutral, universally necessary.</em></p>\n<h2>Who they are</h2>\n<p>Chartkeepers, rutter-brokers, and lane-runners who never stopped maintaining what could be maintained. After the Ruusan reformations it was the guild, not the Senate, that led the restoration of the <strong>Corellian Run</strong> — a century of certified relights, stretch by stretch, that made a Lamplighter seal the closest thing the recovery has to a currency. The natural patron for a wayfinder crew.</p>\n<h2>The pivot</h2>\n<p>Ten years ago the guild did the one thing nobody could chart a profit in: with the Corellian Run's restoration still short of Ryloth, it turned aside at <strong>New Cov</strong> and began posting first-lighting prizes down the dead <strong>Duros Space Run</strong> instead. The Core was surprised. The guild's own journeymen were surprised. Four beacons later — Kalarba, Kyrska, Glom Tho, Triffis, every prize paid in full and on time, from somewhere — the questions have mostly been drowned out by the payouts, and the stall at Bannistar has given the skeptics nothing to point at but an unclaimed prize.</p>\n<h2>What they want</h2>\n<p>The network relit — <strong><em>in the order they choose.</em></strong></p>\n<h2>What they offer a wayfinder crew</h2>\n<ul>\n<li><strong>Charters.</strong></li>\n<li><strong>Salvage rights.</strong></li>\n<li><strong>First-lighting fees</strong> for every beacon reopened (see <a href=\"#\" class=\"xin\" data-nav=\"page:reference:beacon-relighting\">Relighting a Beacon</a>).</li>\n</ul>\n<h2>The crack</h2>\n<p>Whoever sets the relighting order decides which worlds matter for the next century. The Grandmaster of Charts knows this, every faction knows she knows, and her neutrality is not unpurchasable — the price is merely very high. The guild's insistence that beacons relight in <em>its</em> sequence, and only its sequence, is the one thing about it that is not for sale — and the one thing about it worth asking why.</p>"}, {"section": "setting", "id": "kajidics", "title": "The Kajidics", "html": "<h1>The Kajidics</h1>\n<p><em>The Hutt clan-corporations — the one interstellar institution the Withering made stronger.</em></p>\n<h2>Who they are</h2>\n<p>They never needed the Republic; <strong>scarcity is margin.</strong> Their lanes went dark like everyone else's — but Hutts hold rutters older than the Withering and lifespans long enough to remember every route, so the Kajidics simply never stopped flying. They run the black lanes (the dark, unregistered routes that stayed <em>theirs</em>), the fuel and scrap monopolies, and the protection rackets that pass for civic order on a hundred worlds.</p>\n<h2>What they want</h2>\n<p>Their answer to \"what comes next\" is <em>nothing, thank you</em> — they will be paid to keep it that way, because every relit beacon on a route they do not control is competition.</p>\n<h2>What they offer a wayfinder crew</h2>\n<p>What no charter can:</p>\n<ul>\n<li><strong>Fuel and parts.</strong></li>\n<li><strong>Black-lane rutters.</strong></li>\n<li><strong>Cash work with no questions attached.</strong></li>\n</ul>\n<h2>The crack</h2>\n<p>Generational: the young Hutts have run the numbers and think a rebuilt galaxy pays better than scarcity rents ever will, and a clan war over that spreadsheet is one bad season away.</p>"}, {"section": "setting", "id": "guild", "title": "The Bounty Hunters' Guild", "html": "<h1>The Bounty Hunters' Guild</h1>\n<p><em>A standing power — the closest thing the galaxy has to interstellar law.</em></p>\n<h2>Who they are</h2>\n<p>When the courts stopped reaching across systems, one writ kept traveling: <strong>the posting.</strong> The Guild honors any bounty whose bond clears — governments, Kajidics, grieving families, it does not care — and its code (<em>deliver as posted, no poaching, the posting is sacred</em>) has made it, absurdly, the closest thing the galaxy has to interstellar law.</p>\n<p>Worlds too small for judges hire hunters as <strong>circuit arbiters</strong>.</p>\n<h2>The dark side of the code</h2>\n<p>Postings outlive their posters, and Guild purists still honor bounties filed by governments that no longer exist.</p>\n<h2>To a wayfinder crew</h2>\n<p>The Guild is employer, threat, and occasionally the only enforcement a promise has.</p>"}, {"section": "setting", "id": "mandalorians", "title": "The Mandalorian Clans", "html": "<h1>The Mandalorian Clans</h1>\n<p><em>A standing power — the one people who never demobilized.</em></p>\n<h2>Who they are</h2>\n<p>Rebuilt under a Mandalore into clan companies that hire out to anyone whose bond clears — which, in a disarmed galaxy, makes them the finest soldiers alive and everyone's contingency plan. They remember the wars differently than everyone else: <strong>as work.</strong></p>\n<h2>On the Awakening</h2>\n<p>They hold the era's strangest position, which is no position at all — the clans take foundlings from every ruin they are paid to make or guard, and a foundling who bends luck is simply a promising warrior.</p>\n<p><strong>Nobody is watching the one culture that neither fears the gifted nor wants to own them.</strong></p>"}, {"section": "setting", "id": "structure", "title": "Campaign Structure", "html": "<h1>Campaign Structure</h1>\n<p>Three acts. Three mechanics. Three questions.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Act</th>\n<th>Sessions</th>\n<th>Shape</th>\n<th>Core mechanic</th>\n<th>The question</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-1\">Act 1 — Reconnection</a></td>\n<td>~1–8</td>\n<td>Episodic</td>\n<td><strong>Obligation</strong> (survival)</td>\n<td>What did the galaxy become while nobody was looking?</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-2\">Act 2 — Convergence</a></td>\n<td>~9–16</td>\n<td>Hinge events, any order</td>\n<td><strong>Morality</strong> (conscience)</td>\n<td>Every government has a policy now — what's yours?</td>\n</tr>\n<tr>\n<td><a href=\"#\" class=\"xin\" data-nav=\"page:setting:act-3\">Act 3 — The Founding</a></td>\n<td>~17–20+</td>\n<td>Two summits and one canyon</td>\n<td><strong>Duty</strong> (cause)</td>\n<td>What comes next — and who decides?</td>\n</tr>\n</tbody>\n</table></div>\n<div class=\"adm adm-tip\"><p class=\"adm-title\">Players discover this as they play</p><p>The act summaries below are shareable as the table reaches them. The GM's private notes live elsewhere.</p></div>\n\n<p>Start here: <a href=\"#\" class=\"xin\" data-nav=\"page:setting:session-one\">Session One — \"The Light on Vesta-9\"</a>. Track play in the <a href=\"#\" class=\"xin\" data-nav=\"tab:log\">Session Log</a>.</p>"}, {"section": "setting", "id": "act-1", "title": "Act 1 — Reconnection", "html": "<h1>Act 1 — Reconnection</h1>\n<p><em>Sessions ~1–8. Episodic. Each relit beacon opens a corridor, and each corridor holds a world that spent ninety years becoming something strange.</em></p>\n<p><strong>Act goals:</strong> put the factions on the ground in front of the crew, gather <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">lore fragments</a>, and let the crew's reputation outrun them. Pacing note: the prose of this campaign runs elegiac — schedule the comic engines deliberately (Del Gormo, the Quartermaster, Marrow's wager, the court at Enarc) and alternate heavy and light episodes; and after two sessions that end in paperwork, make the third end in weather — Aquilaris (hop 2) should be a <em>physical</em> adventure.</p>\n<p><strong>Where:</strong> the episodes sit along the dead <a href=\"#\" class=\"xin\" data-nav=\"page:setting:geography\">Duros Space Run</a> — one relit beacon per hop, Bannistar Station back toward Darkknell and the Hydian Way. Place each seed on a real system as the crew reaches it (the GM keeps suggested placements on the beacon map).</p>\n<h2>Episode seeds beyond Vesta-9</h2>\n<ol>\n<li><strong>The Sealed Enclave.</strong> A Vigil-sealed temple whose caretaker droid still runs lessons for empty rooms — and something answered this year's roll call.</li>\n<li><strong>The Ration Engine.</strong> A world administered for ninety years by a droid bureaucracy that refuses to believe the galaxy is back; the crew must out-argue a spreadsheet that genuinely loves its people.</li>\n<li><strong>The Mausoleum Yards.</strong> A mothballed Republic fleet, now a hull-city of squatters, with an Admiralty prize crew inbound carrying eviction orders.</li>\n<li><strong>The Memory Market.</strong> A world where provenance is currency, and a forgery ring is quietly poisoning the galaxy's lore-fragment economy — including, perhaps, something the party already trusts.</li>\n<li><strong>The Oracle of Brel.</strong> A settlement worships a Force-sensitive child whose true dreams are eating her sleep; three factions arrive the same week the PCs do.</li>\n<li><strong>The Scar.</strong> A New Sith Wars battlefield where the dark side pooled. An Inheritor dig site offers the crew coin, answers, and the campaign's first real temptation.</li>\n<li><strong>The Five Systems.</strong> A small confederation that is, embarrassingly, thriving in isolation. Plugging them into the galaxy may ruin them — and they know it. Discovery is not neutral.</li>\n<li><strong>The Anchorage.</strong> A Hutt hermit kingdom any ship may enter and none has left sits on a junction the recovery needs, living its opening crisis — one court faction wants the door open, the king wants it one-way forever; the diplomats and traders get their spotlight episode. (Run as Session Two at Enarc — module 02.)</li>\n<li><strong>The Dead Letter.</strong> An assassin droid is still working a ninety-year-old contract list. The government that posted it is dust, the Guild's purists insist a posting is a posting, and the next name on the list is somebody the crew needs alive.</li>\n<li><strong>The Handoff.</strong> A Kajidic middleman's \"cargo\" turns out to be a Force-sensitive child, sold up the chain toward buyers nobody names aloud. Intercepting the shipment is the easy part; deciding what to do about the market it revealed is the episode.</li>\n<li><strong>The Reef.</strong> A war-wreck field has spent ninety years becoming an ecosystem, and it sits across a corridor the recovery needs. Salvage rights, mynock shoals, and a resident landlord the size of a corvette — the oldest lesson on the lanes is <em>there's always a bigger fish</em>, and the crew can teach it to whoever is chasing them.</li>\n</ol>"}, {"section": "setting", "id": "act-2", "title": "Act 2 — Convergence", "html": "<h1>Act 2 — Convergence</h1>\n<p><em>Sessions ~9–16. The quiet ends.</em></p>\n<p>Hinge events, playable in any order:</p>\n<h2>The Awakening goes public</h2>\n<p>A display of the Force too public to hush — now every government has a policy, and every policy has victims.</p>\n<h2>The Conclave of Charts</h2>\n<p>The <a href=\"#\" class=\"xin\" data-nav=\"page:setting:lamplighters\">Lamplighters</a> auction the relighting order. Every faction bids; the party holds swing data from Act 1.</p>\n<h2>The Unveiling</h2>\n<p>The <a href=\"#\" class=\"xin\" data-nav=\"page:setting:inheritors\">Inheritors</a> present a trained cadre — the first \"Sith\" seen since Ruusan. They are costume: real techniques, counterfeit lineage. Almost nobody alive can tell the difference, and the two beings who can have just been handed an address.</p>\n<h2>The Vigil breaks</h2>\n<p>The argument over custody of the Force-sensitive goes from doctrinal to armed, and both halves of <a href=\"#\" class=\"xin\" data-nav=\"page:setting:vigil\">the Vigil</a> come to the party for help.</p>\n<h2>The Annexation</h2>\n<p>The <a href=\"#\" class=\"xin\" data-nav=\"page:setting:admiralty\">Admiralty</a> \"secures\" a relit corridor for everyone's safety, and does not leave.</p>"}, {"section": "setting", "id": "act-3", "title": "Act 3 — The Founding", "html": "<h1>Act 3 — The Founding</h1>\n<p><em>Sessions ~17–20+. Two summits and one canyon.</em></p>\n<h2>The Founding Conclave</h2>\n<p>Crisis forces the constitutional moment: the Rim re-chartered under Coruscant, an Admiralty dominion, a concord of independent leagues — or the players' own third way. Their accumulated fragments, favors, and Force-sensitive allies are the votes.</p>\n<p>And hanging over the whole chamber is a codicil almost nobody remembers: <strong>three Masters, met in a sealed temple, can reopen it and seat a chapter of the Order there</strong> — outside Coruscant's reach. The Run holds one Master who is unimpeachably the Temple's, one hermit whose standing Coruscant has every doctrinal reason to deny — if the swamp counts, the Temple does not control the count — and an empty third chair. Who fills it is a question worth a war.</p>\n<h2>The Valley of the Jedi</h2>\n<p>Getting there is its own act: up the <a href=\"#\" class=\"xin\" data-nav=\"page:setting:geography\">whole Hydian Way</a> coreward to Brentaal, out the Perlemian to Lantillies, down the Randon Run past Kashyyyk — and then off every chart that survives, into the Teraab stellar nursery, where the nebulae have been quietly erasing the last lanes to Ruusan since the war ended. The crew that relit the Rim's beacons ends the campaign navigating a road the sky itself is closing.</p>\n<p>Whoever brings the new Force-sensitives here defines what the Force's return means. On the table:</p>\n<ul>\n<li><strong>Release</strong> the thousand bound souls.</li>\n<li><strong>Draw</strong> on them.</li>\n<li><strong>Seal</strong> the Valley for another age.</li>\n<li><strong>Or ask the souls what they want.</strong></li>\n</ul>\n<h2>The true ending</h2>\n<p>The campaign's true ending is the <em>pairing</em> of a political outcome with a Valley choice. An empire that frees the dead and a republic that feeds on them are both possible, and both worth playing to find out.</p>"}, {"section": "setting", "id": "session-one", "title": "Session One (player recap)", "html": "<h1>Session One — \"The Light on Vesta-9\"</h1>\n<p><em>Player-safe summary. The GM runs the session from the <a href=\"#\" class=\"xin\" data-nav=\"tab:run\">full module</a>.</em></p>\n<h2>Cold open</h2>\n<p>The crew is grounded at <strong>Okrent's Drift</strong> — the boomtown port on the back of <strong>Bannistar Station</strong>'s new fuel gantries, built for the Lamplighters' advance up the <strong>Duros Space Run</strong> and in recession since the advance stalled — cargo impounded, Obligations circling — when the sky changes. <strong>Vesta-9 — the beacon nobody could find for five years — is broadcasting.</strong> Every ship that can lift is lifting, and nobody has stopped to ask who lit it.</p>\n<h2>Scene 1 — The Scramble</h2>\n<p>Get off-world first: the impound, the fuel, and the <em>Larksong</em> — the crew that claimed the last prize the guild ever paid — holding the head of the queue and waving.</p>\n<h2>Scene 2 — The Race</h2>\n<p>Astrogation on a decayed route. Introduce <a href=\"#\" class=\"xin\" data-nav=\"page:reference:lore-fragments\">fragments</a> here, when one page of somebody's grandmother's rutter is the difference between arrival and drift — and when the grandmother herself, dying in the depot infirmary, has something to say about who has been flying that lane.</p>\n<h2>Scene 3 — The Beacon</h2>\n<p>Vesta-9 station, three light-hours from where the charts put it, lit and humming — and occupied.</p>\n<ul>\n<li><strong>Keeper Adressa Vhail</strong> of the Vigil kneels at the beacon core, reading the war dead's names from a slate; she was here before the light came on, and will not say how. Spacers on the band shrug — the grey veils turn up wherever the advance opens a door; grave cult, mostly harmless, don't touch what they tape off.</li>\n<li>The battered Ghtroc <strong><em>Overdue</em></strong> — <strong>Captain Ferro Skell</strong>, the rival crew from the Drift — turns up with a first-lighting claim on the public band: the chart that found this station, he says, is collateral on a debt he bought that morning.</li>\n<li>One docking cradle is still warm. Nothing is in it.</li>\n<li>The Admiralty sloop <strong><em>Steadfast</em></strong> (<strong>Cmdr. Joss Reike</strong>) drops in, runs out its guns, and demands all vessels stand to for inspection.</li>\n<li><strong>Chartmistress Bel Nerra</strong> of the Lamplighters arrives to certify the relight — and to hire witnesses.</li>\n</ul>\n<h2>Scene 4 — The Record</h2>\n<p>Mid-certification, the paper asks its question — <em>lighting party?</em> — and everyone looks at the witnesses of record. The crew is holding more than anyone else in the room: a dying pilot's claim, a wake log, a warm cradle, a station that isn't where it should be. What they put on the founding paper of the reopened Run is theirs to decide — in front of three factions and a rival with a claim.</p>\n<ul>\n<li>Reike wants a stranger on the lane, on the record.</li>\n<li>Nerra wants it clean — and wants to buy the chart that found this place.</li>\n<li>Skell says the chart that found the station is collateral on a debt he bought this morning — and offers the crew a cut to swear to it.</li>\n<li>Vhail wants it said out loud at the core, and asks one question afterward.</li>\n</ul>\n<h2>Out</h2>\n<p>The corridor toward <strong>Enarc<
