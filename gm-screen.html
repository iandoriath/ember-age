er way is not the night ending — it is the custodian finishing: the country reopens hop by hop, in her order, exactly as fast as it is cleared.</p>\n<p>One rule governs the line's whole relationship to the network: <strong>the Sith never light beacons.</strong> They fly the dark lanes without them — beacons are for the <em>galaxy</em>. Why the line wants the country opened at all is the piece to hold onto: <strong>travel was never the bottleneck; discovery is.</strong> The line is two people, and the holocron is one object somewhere in a century of looted courts, sealed tombs, and resold estates — thousands of rooms on dozens of worlds, most of them under dead-man locks nobody has opened since the lights went out. Two people cannot excavate a sector. Only an economy can: prospectors crack vaults for salvage, heirs sell estates, scavengers strip ruins, and everything found must eventually surface at a choke point she already watches — the guild's registry, the certification desks, the Memory Market. She can open the road; only the galaxy can turn over the soil. The reopening is a mining operation: her money funds the mine, the galaxy supplies the labor, the guild is the mine office, the Memory Market is the assay office — and she skims the one nugget she came for while salting the tailings with fakes.</p>\n<p><strong>The method is two-phase, and the timing matters.</strong> <em>Ahead of the light:</em> the patron's sequence is a timetable — before a region's beacon relights, Mendac has already swept its <strong>known</strong> targets, the catalogued vaults and courts and tombs, while the country is still dark and empty of witnesses; then the beacon lights <em>behind</em> her and the prospectors arrive to find doors already visited. She stays a sector ahead of the advance, always. <em>Behind the light:</em> the diggers turn up what no catalogue listed — hidden collections, mislabeled spoils, an estate nobody knew held anything — and the <strong>whisper network</strong> flags it: market listeners, certification clerks, salvage brokers and fence-side ears, none of whom know whom they report to, assembled through the patron's cutouts and fed by the contract's first-look clause. When something genuinely Sith surfaces behind her, she doubles back and takes it — by quiet purchase through cutouts when possible, by the Weeding when not. A sector ahead of the advance; a whisper behind it.</p>\n<p>One population is largely immune to the line's favorite tools: <strong>Hutts.</strong> Influence breaks on Discipline like Sorulba's (5, behind Nobody's Fool 3), and Hutt courts price loyalty too well to buy cheaply — which is why the line never talked the closed kingdoms open and simply routed <em>around</em> Hutt space, and why the ghost-traffic shows up in Hutt picket logs and nobody else's records at all.</p>\n<p><strong>Vesta-9 was the exception that proves the doctrine, executed without drama:</strong> the advance was stalled on the one beacon nobody could find, so the line found it and lit it — plan, not improvisation. For years the line did not know a true chart existed (the old survey was assumed lost with the hands who flew it); only when the guild's repeated failed surveys forwarded <em>\"the one pilot who won't sell\"</em> to the patron's desk did anyone coreward learn of Osk. Then it took a season. Mendac sat at the blind woman's bedside as a kind stranger with a sheet of jump-knots and — <strong>Influence</strong>, the liar's power, one target made to believe something untrue for a few minutes — walked her through the run in a voice Osk trusted. Osk's own mouth gave up the position, and she cannot remember doing it. Visit, station, emptied cache (no holocron), light on the way out. The galaxy's comfortable wrong answer (\"some prize-hunter who didn't live to file\") was priced in.</p>", "search": "the doctrine of the open road the night was made. galaxy-wide, the era's theme holds — the ebb was real, nobody broke the galaxy, and th ook a season. mendac sat at the blind woman's bedside as a kind stranger with a sheet of jump-knots and — influence , the liar's power, one target made to believe something untrue for a few minutes — walked her through the run in a voice osk trusted. osk's own mouth gave up the position, and she cannot remember doing it. visit, station, emptied cache (no holocron), light on the way out. the galaxy's comfortable wrong answer (\"some prize-hunter who didn't live to file\") was priced in."}, {"id": "keepers--the-machinations", "name": "The machinations", "kind": "Special", "typeline": "", "faction": "", "role": "", "derived": "", "group": "keepers", "html": "<p>Off-screen and ongoing — draw on them whenever you need the pattern to show from very far back:</p>\n<ol>\n<li><strong>The Weeding.</strong> Whenever the relighting stalls — a certification held up, a corridor claim contested, a magistrate who would rather the lane stayed dark, a guild officer who questions the patron's order — the obstacle removes itself. A rival withdraws without explanation; a hostile official retires young and quiet; a rutter that would have started a war goes missing from a dead man's cabin. Mendac's hands, Veritis's patience, never a trace. The players should feel the recovery is lucky. It is not. The Weeding also guards the far door: every few years coreward money flirts with forcing the Dead Gate — reopening the Run from Darkknell and meeting the advance in the middle — and the talk always dies: a syndicate loses its backers, a survey is cancelled, a prospectus goes missing. A push from that end would reach Jutrand's vaults <em>before her gardeners do</em>, and Jutrand is where the catalogue's best guess lives. One obstacle never removed itself: <strong>Tama Osk</strong> — see the Vesta-9 passage above for why the Weeding never came for her, and why that is the doctrine working <em>and</em> the doctrine being wrong about what a dying woman's respect turns out to be worth. Fair-play rule for the whole Weeding: every removal carries one learnable tell — <strong>the obstacle vanishes the night after a guild packet leaves port.</strong> A crew that runs that pattern down (Streetwise, across episodes) has earned the first rung of the Ladder of Sightings (<a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">Faction Clocks</a>).</li>\n<li><strong>The Scrub.</strong> The line's real work on the Run, run in the two phases above. Run it at the table as the crew arriving somewhere already visited — a tomb with fresh footprints and nothing in it, a dead principality's archive whose only surviving volumes are the ones a Daunting Knowledge (Lore) check reveals to be worthless. The Memory Market at Sanrafsix is watched, not bought from: the day a genuine piece surfaces, its seller has a short future. Improv hook: a scholar of impeccable manners who asks to <em>see</em> a relic and is visibly, quietly relieved to find it is fake. And the Scrub's best-kept secret is its victim: <strong>the Vigil's sealed sites are the catalogue's richest entries, and the Vigil's own doctrine hides the thefts</strong> — a seal is never opened, so nobody has checked a vault's contents in eighty years, and whole shrines under faithful guard are already bare. The reveal — the crew and the Vigil unsealing a vault together and finding dust outlines — is the set piece <em>The Unbroken Seal</em> in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:vigil-inheritors\">Vigil &amp; Inheritors</a>, and it is the single best recruiting scene the Ladder of Sightings has.</li>\n<li><strong>The Wasp Trap.</strong> Millennial's heresy on Dromund Kaas is alive and tolerated. It is a sump for the loud: the ambitious, the visionary, the seer who would otherwise draw attention inside Republic space. Veritis's people never touch it — occasionally they <em>send</em> someone to it — and it will be culled the day it reaches Republic space or the day a Darth title out of the Sith Worlds is taken seriously. Dromund Kaas is on the far side of the Rim from the Run; if the heresy ever touches this campaign, it arrives as a recruiter, a rumor, or a prophecy that is suspiciously accurate about the Valley.</li>\n<li><strong>The Census.</strong> The Awakening is the line's future. A generation of untrained Force-sensitives with no Order to claim them is either the greatest recruiting pool the Sith have ever had or the seed of the Jedi's return, and Veritis means to decide which. The line keeps its own watch on the gifted, and the Inheritors' harvested Vesta-9 file (they watched the crew arrive at the door Mendac opened) completes it: the crew, the ship, the corridor, and — if the crew ever showed it to anyone — the rutter Osk kept from her for ten years. Which of them is gifted, the line learns later, the way it learns everything. <strong>Their desire is not to kill them.</strong> Gardeners are not pruned, and Mendac's successor has to come from somewhere: the Rule of Two recruits at generational distance, and if you want a sequel hook, the apprentice's apprentice may already be at your table. One more thread: the drift the Census keeps logging — gifted moving up the Run against all economics — is the Last Muster's doing (below), and Veritis cannot hear the call herself. The Census is quietly also her search for an ear.</li>\n<li><strong>The Graduation.</strong> The culling of the Inheritors is Mendac's exam — the trigger, the aftershocks, and the <em>Emptied House</em> set piece are with the faction they happen to, in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:vigil-inheritors\">Vigil &amp; Inheritors</a>. It is the Weeding, the Scrub and the Census done in one night.</li>\n<li><strong>The Absence.</strong> Never on camera <em>in the early acts</em>. Veritis manifests as pattern and Mendac as aftermath, and through Acts 1–2 no encounter with either is intended — mystery is the engine, and both should feel unbeatable because the crew is not meant to be fighting them yet. But the Absence is a doctrine the players can break with evidence, not a decree: the Ladder of Sightings (<a href=\"#\" class=\"xin\" data-nav=\"tab:trackers\">Faction Clocks</a>) is how — and rung four is where \"mysterious\" ends and the statted antagonists above step into the light.</li>\n</ol>", "search": "the machinations off-screen and ongoing — draw on them whenever you need the pattern to show from very far back: 1. the weeding. whenever the relighting stalls — a certification held up, a corridor claim contested, a magistrate who would rather the lane stayed dark, a guild officer who questions the patron's order — the obstacle removes itself. a rival withdraws without explanation; a hostile official retires young and quiet; a rutter that would have started a war goes missing from a dead man's cabin. mendac's hands, veritis's patience, never a trace. the players should feel the recovery is lucky. it is not. the weeding also guards the far door: every few years coreward money flirts with forcing the dead gate — reopening the run from darkknell and meeting the advance in the middle — and the talk always dies: a syndicate loses its backers, a survey is cancelled, a prospectus goes missing. a push from that end would reach jutrand's vaults before her gardeners do , and jutrand is where the catalogue's best guess lives. one obstacle never removed itself: tama osk — see the vesta-9 passage above for why the weeding never came for her, and why that is the doctrine working and the doctrine being wrong about what a dying woman's respect turns out to be worth. fair-play rule for the whole weeding: every removal carries one learnable tell — the obstacle vanishes the night after a guild packet leaves port. a crew that runs that pattern down (streetwise, across episodes) has earned the first rung of the ladder of sightings ([faction clocks](../tools/faction-clocks.md)). 2. the scrub. the line's real work on the run, run in the two phases above. run it at the table as the crew arriving somewhere already visited — a tomb with fresh footprints and nothing in it, a dead principality's archive whose only surviving volumes are the ones a daunting knowledge (lore) check reveals to be worthless. the memory market at sanrafsix is watched, not bought from: the day a genuine piece surfaces, its seller has a short future. improv hook: a scholar of impeccable manners who asks to see a relic and is visibly, quietly relieved to find it is fake. and the scrub's best-kept secret is its victim: the vigil's sealed sites are the catalogue's richest entries, and the vigil's own doctrine hides the thefts — a seal is never opened, so nobody has checked a vault's contents in eighty years, and whole shrines under faithful guard are already bare. the reveal — the crew and the vigil unsealing a vault together and finding dust outlines — is the set piece the unbroken seal in [vigil & inheritors](vigil-inheritors.md), and it is the single best recruiting scene the ladder of sightings has. 3. the wasp trap. millennial's heresy on dromund kaas is alive and tolerated. it is a sump for the loud: the ambitious, the visionary, the seer who would otherwise draw attention inside republic space. veritis's people never touch it — occasionally they send someone to it — and it will be culled the day it reaches republic space or the day a darth title out of the sith worlds is taken seriously. dromund kaas is on the far side of the rim from the run; if the heresy ever touches this campaign, it arrives as a recruiter, a rumor, or a prophecy that is suspiciously accurate about the valley. 4. the census. the awakening is the line's future. a generation of untrained force-sensitives with no order to claim them is either the greatest recruiting pool the sith have ever had or the seed of the jedi's return, and veritis means to decide which. the line keeps its own watch on the gifted, and the inheritors' harvested vesta-9 file (they watched the crew arrive at the door mendac opened) completes it: the crew, the ship, the corridor, and — if the crew ever showed it to anyone — the rutter osk kept from her for ten years. which of them is gifted, the line learns later, the way it learns everything. their desire is not to kill them. gardeners are not pruned, and mendac's successor has to come from somewhere: the rule of two recruits at generational distance, and if you want a sequel hook, the apprentice's apprentice may already be at your table. one more thread: the drift the census keeps logging — gifted moving up the run against all economics — is the last muster's doing (below), and veritis cannot hear the call herself. the census is quietly also her search for an ear. 5. the graduation. the culling of the inheritors is mendac's exam — the trigger, the aftershocks, and the emptied house set piece are with the faction they happen to, in [vigil & inheritors](vigil-inheritors.md). it is the weeding, the scrub and the census done in one night. 6. the absence. never on camera in the early acts . veritis manifests as pattern and mendac as aftermath, and through acts 1–2 no encounter with either is intended — mystery is the engine, and both should feel unbeatable because the crew is not meant to be fighting them yet. but the absence is a doctrine the players can break with evidence, not a decree: the ladder of sightings ([faction clocks](../tools/faction-clocks.md)) is how — and rung four is where \"mysterious\" ends and the statted antagonists above step into the light."}, {"id": "keepers--the-holocron-of-lord-kaan", "name": "The Holocron of Lord Kaan", "kind": "Special", "typeline": "", "faction": "", "role": "", "derived": "", "group": "keepers", "html": "<p>Legends gives Kaan no holocron, so this collides with nothing — and this campaign is its whole story. It is not a teaching holocron in the old sense: cut in the war's last years, it is the Brotherhood of Darkness's own record in its Dark Lord's voice — part archive, part manifesto, part confession — and it is the single most incriminating object in the galaxy. Chapter by chapter it proves what the Sith were at the end; its third chapter names the dissenter; and anyone who reads that chapter and then looks hard at the present — obstacles that remove themselves, a hand that can tell true relics from false — can do the arithmetic the Jedi have never had reason to attempt: <em>the heresy did not die at Ruusan.</em> It is the line's birth certificate, and Veritis will spend a century to bury it. She cannot use it — see the Gatekeeper — she can only silence it.</p>\n<p><strong>What is on it.</strong> Five chapters, in Kaan's own voice:</p>\n<ol>\n<li><strong>The Brotherhood</strong> — what he built and why: the Darth title abolished (\"a hundred Darths had made the word a civil war\"), every Sith a Dark Lord, equality as weapons discipline, the academies. The pitch that emptied a generation into his armies, in the voice that made it work — the one first-person account of what the Sith had become, and the truth Veritis wants out of every archive but her own.</li>\n<li><strong>The War</strong> — the New Sith Wars from the Sith side: the Grumani principalities as the Brotherhood's inheritance, with rosters, worlds, vault inventories and supply lines. Functionally this chapter is the Scrub's own catalogue in the enemy's hand: whoever holds it can <em>predict the patron's relighting order</em> — the most dangerous navigational fragment in the campaign.</li>\n<li><strong>The Dissenter</strong> — Bane, named. The miner from Apatros; the academy record; the heresy quoted in full so that Kaan could refute it — <em>that the Brotherhood was the Sith's disease, and that there should be two, no more, no less.</em> Ninety years on, the refutation reads as prophecy annotated by its victim. The Rule of Two's birth certificate; the name <strong>Bane</strong> enters the campaign here and nowhere else.</li>\n<li><strong>The Weapon</strong> — the thought bomb: the ritual, its price, and what it actually does. It does not kill; it <strong>seals</strong> — the souls it takes go into the bomb, not into the Force. Kaan records the working as his closing argument (\"the enemy cannot win a war I am willing to end\"). Read forward it is a weapon. Read backward it is a <em>lock</em> — and a lock implies a key. This is the chapter Act 3 turns on: release, draw, seal deeper, or ask the souls what they want — the holocron makes all four possible and forces none. Never point a sign at it; if the crew refuses the working, the refusal is the ending.</li>\n<li><strong>The Seventh Campaign</strong> — cut off mid-entry. The muster order; the contingency (\"if my thread is cut, call the gifted, and the Brotherhood rises from here\" — the Last Muster, below); the last confident sentences of a man who does not know he has already lost. The record ends before Ruusan does.</li>\n</ol>\n<p><strong>Where it is.</strong> Not where the catalogue says. Kaan trusted his Brotherhood and none of it: before the seventh campaign he moved his record to the muster cache (the Last Muster, below), off every inventory the principalities kept. The line's Jutrand guess is wrong — Jutrand is a magnificent red herring the Scrub will strip anyway — and the only working directions in the galaxy are a sound only the untrained can hear.</p>\n<p><strong>The Gatekeeper.</strong> Kaan's simulacrum, recorded at the Brotherhood's height — the most dangerous kind of dead man, a charismatic one. He does not know the war ended, or how. He is warm, collegial, magnetic, and recruiting: every visitor is \"Brother\" or \"Sister,\" every lesson bends toward the muster, and the friendliness that emptied academies works exactly as well on a lonely gifted spacer as it did on the war's cadets. He trades: chapters 1 and 2 for civility; chapter 3 for <em>news</em> — he is starving for word of a war he refuses to believe is over, and true accounts of the present are the only coin he values. Chapter 4 he opens to a sworn Brother (<strong>5 Conflict</strong>, and a standing problem: he now issues orders) or to a <strong>Daunting Discipline or Deception check</strong> from someone who can hold his gaze and lie about the century. Chapter 5 he shows freely to exactly one kind of visitor: one who has <strong>heard the call</strong> — he knows his own working's mark, and the crew's Dathomiri walks in already cleared. And the Rule of Two is, to him, the dissenter's madness in a second generation: <strong>the Banite line is the one lineage in the galaxy he will never teach.</strong> If Veritis ever stands before him, the holocron of Lord Kaan is the only thing on the Run that will call her a traitor to her face. She knows it. That is why the object must be silenced and can never be used.</p>\n<p><strong>At the table.</strong> The holocron is a <strong>Wellspring</strong> (Part VII): a Force-sensitive PC can raise Force Rating or open a power tree from it, at the Gatekeeper's price — never blood, always <em>enlistment</em>, paid in Conflict and in favors to a dead cause. It is a <strong>Sith-tagged lore fragment source</strong> of the first order: chapter 4 can close <em>What is the Valley?</em> from the inside; chapter 2 bears on <em>Why did the Run stay dark?</em> and hands the crew the patron's next moves; chapter 3 is the document that turns the Ladder of Sightings' pattern into a named tradition. And it is the thing every counter is counting toward: the Inheritors want it as proof of lineage, the Vigil wants it locked, Tane wants it on Coruscant, Veritis wants it silenced — and Del Gormo, alone in the campaign, wants nobody to have it. If the Inheritors reach it first, the culling is the night she takes it from them, and the Emptied House is where it was.</p>", "search": "the holocron of lord kaan legends gives kaan no holocron, so this collides with nothing — and this campaign is its whole story. it is not a teaching holocron in the old sense: cut in the war's last ye t seals — the souls it takes go into the bomb, not into the force. kaan records the working as his closing argument (\"the enemy cannot win a war i am willing to end\"). read forward it is a weapon. read backward it is a lock — and a lock implies a key. this is the chapter act 3 turns on: release, draw, seal deeper, or ask the souls what they want — the holocron makes all four possible and forces none. never point a sign at it; if the crew refuses the working, the refusal is the ending. 5. the seventh campaign — cut off mid-entry. the muster order; the contingency (\"if my thread is cut, call the gifted, and the brotherhood rises from here\" — the last muster, below); the last confident sentences of a man who does not know he has already lost. the record ends before ruusan does. where it is. not where the catalogue says. kaan trusted his brotherhood and none of it: before the seventh campaign he moved his record to the muster cache (the last muster, below), off every inventory the principalities kept. the line's jutrand guess is wrong — jutrand is a magnificent red herring the scrub will strip anyway — and the only working directions in the galaxy are a sound only the untrained can hear. the gatekeeper. kaan's simulacrum, recorded at the brotherhood's height — the most dangerous kind of dead man, a charismatic one. he does not know the war ended, or how. he is warm, collegial, magnetic, and recruiting: every visitor is \"brother\" or \"sister,\" every lesson bends toward the muster, and the friendliness that emptied academies works exactly as well on a lonely gifted spacer as it did on the war's cadets. he trades: chapters 1 and 2 for civility; chapter 3 for news — he is starving for word of a war he refuses to believe is over, and true accounts of the present are the only coin he values. chapter 4 he opens to a sworn brother ( 5 conflict , and a standing problem: he now issues orders) or to a daunting discipline or deception check from someone who can hold his gaze on has been calling the gifted to a war that ended ninety years ago — in the voice of a prison.</p>\n</blockquote>\n<p><strong>What it is.</strong> Kaan trusted his Brotherhood and no one in it. Before the seventh campaign he left a contingency in the Brotherhood's rear country: a working — Sith magic bound into principality stonework — keyed to his own thread in the Force, sealed over the cache that holds his record and the Brotherhood's reserve. Its orders were the Brotherhood's whole doctrine in one line: <em>if my thread is cut, call the gifted, and the Brotherhood rises from here.</em> The thought bomb cut the thread. The switch fired. It has been calling ever since — for exactly as long as the war has been over, which is a date the players can do arithmetic with.</p>\n<p><strong>Why it grinds.</strong> The working was built to carry its master's summons — Kaan's voice, Kaan's warmth, the recruiting charm that emptied academies. But the thought bomb did not kill its master the way the switch understands death: it <em>sealed</em> him, with a thousand others. So the switch reaches for the voice it was built to carry and finds the inside of the thought bomb — and what it broadcasts is not a summons but a relay: a thousand souls, light and dark together, grinding at their prison. Stone on dry stone. The mill turns and there is no grain. <strong>The pull Force-users feel up the Run is this switch</strong> — and what the switch is playing them is the Valley of the Jedi.</p>\n<p><strong>Who hears it.</strong> The muster calls <em>new blood</em> — Kaan's recruitment was always everyone, and the working is keyed to the unclaimed and untrained. That is why the Awakening generation drifts up the Run, why Del Gormo's shore keeps filling, why the crew's Dathomiri hears it clearest — and why <strong>the Banite line cannot hear it at all</strong>: Bane burned the Brotherhood's channel out of his doctrine, and his heirs are deaf to their own history's mouth. Veritis knows <em>something</em> calls — the Census keeps logging gifted drift with no economic explanation — and cannot hear it herself. If she ever learns one of the crew can walk the call, that character becomes the most valuable instrument on the Run — and the player should get to feel valuable before they learn to whom. One more set of ears: the Vigil has heard it for generations without a name for it. Their catechism calls it <strong>the millstone dream</strong> — <em>do not follow the grinding; it is the dead asking for what the living cannot give</em> — which is folk-accurate on every point, and the first real navigational help a gifted PC who asks them will ever get.</p>\n<p><strong>Dial 2 stands.</strong> The switch is not the Awakening's engine, and neither is the Valley: the Force returns because it returns. More births mean more ears — the call is not louder, it is better attended.</p>\n<p><strong>Using the call at the table.</strong> Directionless as weather for most: a mood at the edge of sleep, a sound in dry country. Near a threshold — a Brotherhood site, a principality vault, the cache itself — it has a direction the way a draft has a door. A gifted PC can learn to walk it: Force checks across episodes, sharpened by fragments (each Sith-tagged fragment held adds a boost — the record hums toward its author), and the Dathomiri's \"grinding stone on dry stone\" should be seeded early and paid off exactly here. <strong>Where:</strong> the cache sits off every catalogue on a dead principality spur — suggested placement <strong>Byllura</strong> (the Dyarchy's world, where for a decade a whole population moved to the will of two telepath children; stonework that remembers obedience is exactly the Brotherhood's kind of irony), but place it where your table's road wants it. <strong>Endgame stakes:</strong> open the cache or break the working and the call stops — silence lands on the sector's gifted like a lost tooth, and the Valley loses its only mouth this side of Ruusan. What the crew does with a switch still grinding, a record still naming Bane, and a road the sky itself is closing — that is Acts 2 and 3.</p>\n<hr />\n<h2>The Scar's Echo</h2>", "search": "the last muster — kaan's dead man's switch working — the brotherhood of darkness (dead) — the grinding call; declared homebrew, like the scar's echo somewhere out along the dead spurs, a patient working of stone and intention has been calling the gifted to a war that ended ninety years ago — in the voice of a prison. what it is. kaan trusted his brotherhood and no one in it. before the seventh campaign he left a contingency in the brotherhood's rear country: a working — sith magic bound into principality stonework — keyed to his own thread in the force, sealed over the cache that holds his record and the brotherhood's reserve. its orders were the brotherhood's whole doctrine in one line: if my thread is cut, call the gifted, and the brotherhood rises from here. the thought bomb cut the thread. the switch fired. it has been calling ever since — for exactly as long as the war has been over, which is a date the players can do arithmetic with. why it grinds. the working was built to carry its master's summons — kaan's voice, kaan's warmth, the recruiting charm that emptied academies. but the thought bomb did not kill its master the way the switch understands death: it sealed him, with a thousand others. so the switch reaches for the voice it was built to carry and finds the inside of the thought bomb — and what it broadcasts is not a summons but a relay: a thousand souls, light and dark together, grinding at their prison. stone on dry stone. the mill turns and there is no grain. the pull force-users feel up the run is this switch — and what the switch is playing them is the valley of the jedi. who hears it. the muster calls new blood — kaan's recruitment was always everyone, and the working is keyed to the unclaimed and untrained. that is why the awakening generation drifts up the run, why del gormo's shore keeps filling, why the crew's dathomiri hears it clearest — and why the banite line cannot hear it at all : bane burned the brotherhood's channel out of his doctrine, and his heirs are deaf to their own history's mouth. veritis knows something calls — the census keeps logging gifted drift with no economic explanation — and cannot hear it herself. if she ever learns one of the crew can walk the call, that character becomes the most valuable instrument on the run — and the player should get to feel valuable before they learn to whom. one more set of ears: the vigil has heard it for generations without a name for it. their catechism calls it the millstone dream — do not follow the grinding; it is the dead asking for what the living cannot give — which is folk-accurate on every point, and the first real navigational help a gifted pc who asks them will ever get. dial 2 stands. the switch is not the awakening's engine, and neither is the valley: the force returns because it returns. more births mean more ears — the call is not louder, it is better attended. using the call at the table. directionless as weather for most: a mood at the edge of sleep, a sound in dry country. near a threshold — a brotherhood site, a principality vault, the cache itself — it has a direction the way a draft has a door. a gifted pc can learn to walk it: force checks across episodes, sharpened by fragments (each sith-tagged fragment held adds a boost — the record hums toward its author), and the dathomiri's \"grinding stone on dry stone\" should be seeded early and paid off exactly here. where: the cache sits off every catalogue on a dead principality spur — suggested placement byllura (the dyarchy's world, where for a decade a whole population moved to the will of two telepath children; stonework that remembers obedience is exactly the brotherhood's kind of irony), but place it where your table's road wants it. endgame stakes: open the cache or break the working and the call stops — silence lands on the sector's gifted like a lost tooth, and the valley loses its only mouth this side of ruusan. what the crew does with a switch still grinding, a record still naming bane, and a road the sky itself is closing — that is acts 2 and 3. --- the scar's echo"}, {"id": "keepers--the-scar-s-echo", "name": "The Scar's Echo", "kind": "Hazard", "typeline": "Encounter hazard", "faction": "Episode 6, \"The Scar\"", "role": "NOT an NPC", "derived": "", "group": "keepers", "html": "<p><em>Encounter hazard — Episode 6, \"The Scar\" — NOT an NPC</em></p>\n<blockquote>\n<p>A New Sith Wars battlefield where the dark side pooled and never drained: kilometers of fused glass under gray ashfall, an Inheritor dig site at its heart, and something underneath that has learned the shape of a listener.</p>\n<p><strong>DELIBERATELY HOMEBREW SECTION — the only one in this file.</strong> The Scar's Echo is a dark-side vergence run as terrain, not a creature: it has no characteristics, no wounds, and cannot be fought. Its mechanics are assembled from two RAW subsystems — the fear-check rules (Discipline checks against a set difficulty, F&amp;D core fear guidance) and Morality/Conflict as written — so nothing below requires a book lookup; the assembly, and the two declared overrides on the Adjustments line at the end of this entry, are the homebrew. The \"Encounter hazard\" typeline above is a sanctioned exception to the template's Nemesis/Rival/Minion types: this is the file's one declared non-NPC entry.</p>\n</blockquote>\n<p><strong>Zones and fear checks.</strong> Call for a fear check (Discipline) when a character first enters each zone, and again if the Echo does something overt (a voice using a dead parent's cadence, a glass field flexing like breath). Per the RAW consequence pattern: on a failure the character suffers 2 strain and adds a setback die to all checks for the remainder of the encounter; three or more threat add 2 further strain; a despair means panic — the character is staggered until the end of their next turn or must immediately move away from the heart. A character who succeeds cannot be forced to re-check in the same zone the same day.</p>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th>Zone</th>\n<th>Fear check</th>\n<th>Ambient effects</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td><strong>Ashfall Rim</strong> (the crash-ring and Inheritor base camp)</td>\n<td>Hard Discipline</td>\n<td>Ash-blind: add a setback die to Perception and Vigilance checks; ranged attacks beyond short range upgrade their difficulty once.</td>\n</tr>\n<tr>\n<td><strong>The Glass Fields</strong> (fused, uneven, wrong underfoot)</td>\n<td>Hard Discipline; Force-sensitive characters upgrade the difficulty once</td>\n<td>Difficult terrain throughout. Each hour spent here: Average Discipline check or suffer 1 strain (the whisper accumulates; this strain cannot be recovered until the character leaves the Scar).</td>\n</tr>\n<tr>\n<td><strong>The Choir</strong> (the heart; the dig itself)</td>\n<td>Daunting Discipline; Force-sensitive characters upgrade the difficulty once</td>\n<td>Both outer effects apply. All checks to recover strain here automatically fail. Sleeping in the Choir: 1 Conflict, and a true-but-poisoned dream.</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Conflict pressure (RAW Conflict, tempted).</strong> The Echo's offer is generosity. While anywhere within the Scar, a Force-sensitive character may use dark side results on Force power checks <em>without flipping a Destiny Point</em> — the strain cost per dark point still applies as written, and each dark point used this way awards Conflict as RAW <strong>plus 1 additional Conflict</strong> (the vergence's finder's fee). Additionally, award 1 Conflict for: sleeping in the Choir; deliberately opening oneself to the Echo's visions; or taking payment from the dig knowing what is being dug. Land the aftermath hard (Part VII): there are no counselors in this era, and the first person to explain the nightmares wins — make sure the players notice who is offering.</p>\n<p><strong>The visions.</strong> Seek, Sense, Foresee, and Farsight checks made within the Scar add both a boost die <em>and</em> a setback die, and what they return is true but curated — the Echo shows real fragments (it qualifies as a <strong>Sith-tagged lore fragment source</strong> for the Reconstruction subsystem) selected to make the viewer feel indispensable. A despair on any such check puts a corrupted conclusion in play that the character believes (mirror of the Reconstruction rules).</p>\n<p><strong>The bargain (Wellspring).</strong> The Scar is a functional vergence, and therefore a legal Wellspring (Part VII): a Force-sensitive character <em>can</em> raise Force Rating or open a new power tree here. Any advance bought with the Scar as its Wellspring carries a rider: the first time that power or rating is used each session, the character gains 1 Conflict. This is the campaign's first real temptation, and it should work — the offer is genuine, the training is real, and the price is on layaway.</p>\n<p><strong>Running it.</strong> The Echo has no agenda a stat block could hold; it wants <em>listeners</em>, and it prefers the young. The Inheritor dig crew (coin, answers, courtesy — first contact is always helpful, per Dial 3) treats the whisper as an occupational perk and is quietly further gone than they know. Never bring the crew's gifted here without intending the campaign to pivot on it: they dream of the Valley, which is loud, but the Scar is quiet and hungry, and it would very much like to be their second teacher.</p>\n<p><strong>Chassis:</strong> original build (encounter hazard — no adversary stat block exists or is owed; assembled from the F&amp;D fear-check guidance and RAW Morality/Conflict). <strong>Adjustments:</strong> the +1 Conflict finder's-fee and the no-Destiny-flip dark-pip rule are the only overrides of RAW, both declared above.</p>", e Fore/Aft 1/1 · Armor 3 · Hull Trauma Threshold 22 · System Strain Threshold 15</strong></p>\n<ul>\n<li><strong>Hyperdrive:</strong> Primary: <strong>Class 1</strong>, Backup: <strong>none</strong> (see Adjustments)</li>\n<li><strong>Navicomputer:</strong> Yes</li>\n<li><strong>Sensor Range:</strong> Short</li>\n<li><strong>Crew:</strong> One pilot, one co-pilot/engineer (Marrow flies; her three deckhands rotate the second seat and the turrets)</li>\n<li><strong>Encumbrance Capacity:</strong> 165 · <strong>Passenger Capacity:</strong> 6</li>\n<li><strong>Consumables:</strong> Two months · <strong>Price/Rarity:</strong> 100,000 credits/4 · <strong>Customization Hard Points:</strong> 6 (two spent on the attachments below)</li>\n<li><strong>Weapons:</strong> One dorsal and one ventral turret-mounted medium laser cannon (Fire Arc All; Damage 6; Critical 3; Range [Close])</li>\n</ul>\n<p><strong>Chassis:</strong> YT-1300 Light Freighter, Edge of the Empire Core Rulebook (adjustments: declared — the stock block with two printed attachments installed at RAW cost, and one deliberate omission: (1) <strong>High-Output Ion Turbine</strong> (Edge of the Empire Core Rulebook): +1 Speed, so 4; (2) <strong>Hyperdrive Generator</strong> (Edge of the Empire Core Rulebook): the primary hyperdrive one class better, Class 2 → Class 1; (3) <strong>no backup hyperdrive</strong> — Marrow sold the Class 12 backup to the Bannistar chop-yard to make the generator's price. Confirm the two attachments' printed hard-point cost and prices against the book before the first roll that turns on them; everything else above is the YT-1300 as printed.)\n<strong>Era notes:</strong> This is what a first-lighting prize looks like when it is spent well. The Triffis fee went to the chop-yard under Okrent's Drift for a salvaged turbine and a generator pulled from a dead courier, and the yard quoted the crew the same work at a price they could not pay. Nothing about the <em>Larksong</em> is new; it is simply the one YT-1300 in the sector whose owner has been paid.\n<strong>Using it:</strong> The envy is calibrated on purpose: Speed 4 against the crew's 3, and Class 1 against their Class 2 — she wins every straight race and every jump, and \"the <em>Larksong</em> got there an hour ago\" is the hyperdrive math, not luck. Everything else is the same ship: same two turrets, same paper armor, same strain. The weaknesses are real and the players can find them. <strong>No backup hyperdrive:</strong> a Despair on her Astrogation, or a hit that drops the primary, leaves the <em>Larksong</em> drifting on a dead lane with no way home — Marrow knows it, which is why she only races lanes she holds a chart for, and why she wants the crew's page as much as they want hers. <strong>The turbine runs hot:</strong> after any chase flown at full speed, the GM may hang the Inferior quality on it until she has had a night in port (the lane-runner convention above). <strong>The prize is mostly gone:</strong> the pouch she pays Grell from is the last of it, and her hard points are two-thirds spent. And the hook under all of it: the turbine and the generator are RAW attachments at printed prices, sold by a yard that will sell the crew the same thing the day they have a prize of their own. The <em>Larksong</em> is not a better ship. It is a paid-for one. This block is mirrored in the session-one NPC file (<a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">session-one.md</a>) beside her crew — one canonical print; if either copy is ever adjusted, keep the two in sync.</p>\n<hr />\n<h2>The Admiralty</h2>", "search": "the larksong, prize-money yt-1300 vehicle — independent (captain vess marrow) — the rival's ship: the same pattern as yours, with the triffis prize spent on it same hull as half the rim, and you hear the difference before you see it: a new ion turbine that whistles clean where yours coughs, plating that has actually been painted this decade, and a name on the bow in gold ter;\">Speed</th>\n<th style=\"text-align: center;\">Handling</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td style=\"text-align: center;\">5</td>\n<td style=\"text-align: center;\">3</td>\n<td style=\"text-align: center;\">−1</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Defense Fore/Port/Starboard/Aft 2/2/2/1 · Armor 6 · Hull Trauma Threshold 45 · System Strain Threshold 20</strong></p>\n<ul>\n<li><strong>Hyperdrive:</strong> None</li>\n<li><strong>Navicomputer:</strong> None</li>\n<li><strong>Sensor Range:</strong> Long</li>\n<li><strong>Crew:</strong> Twelve</li>\n<li><strong>Encumbrance Capacity:</strong> not listed in the printed block · <strong>Passenger Capacity:</strong> 10 (troopers or prisoners)</li>\n<li><strong>Consumables:</strong> One month · <strong>Price/Rarity:</strong> 4,000,000 credits/5 · <strong>Customization Hard Points:</strong> 2</li>\n<li><strong>Weapons:</strong></li>\n<li>Dorsal, ventral, port, and starboard turret-mounted point-defense turbolaser batteries (Fire Arc All; Damage 11; Critical 3; Range [Long]; Breach 3, Linked 1, Slow-Firing 1)</li>\n<li>Forward-mounted concussion missile launcher (Fire Arc Forward; Damage 7; Critical 3; Range [Short]; Blast 4, Breach 4, Guided 3, Slow-Firing 1)</li>\n</ul>\n<p><strong>Chassis:</strong> Imperial System Patrol Craft (IPV-1), Beyond the Rim (adjustments: none — the printed block lists no encumbrance capacity; the line above reports that fact rather than inventing a number).\n<em>(stats unverified against print — scope: every other line of this block verified against the printed IPV-1; the one unverified field is </em><em>Price/Rarity</em><em> — check the printed block for the figure and restore the \"(R)\" restricted marker if the print carries one, as a military hull likely does)</em>\n<strong>Era notes:</strong> Naboo-pattern sloops carry no hyperdrive as printed — the Admiralty ferries them between systems clamped to fleet tenders, which is why one can \"drop in\" on a beacon relight and why, once on station, it is never leaving until the tender comes back. The NAS prefix is <em>Naboo Admiralty Ship</em> — a registry no chart on this side of the dark lists. Maintenance is the one thing the Naboo yards still do perfectly; this is the rare hull in the era with nothing patched. And the hull is itself intelligence: the Admiralty scouts with sloops and makes statements with heavier hulls — Vesta-9 got a <em>picket sent to look</em>, not a fleet sent to hold, and a sharp crew can read the Admiralty's distance and caution from what it chose to risk. Her answer to a swarm is arithmetic, not mass: twelve crew cannot board a dozen hulls and do not need to — the gun ladder means she only ever needs one example, which nobody volunteers to be.\n<strong>Using it:</strong> The Steadfast is a wall, not a duel — its turbolasers outrange and outhit anything a wayfinder crew owns, so the scene it creates is procedural: stand to, present manifests, submit to boarding (those ten passenger berths are Reike's inspection party, or your cell). Let the players win against the paperwork, the commander's rigidity, or the tender schedule, never the guns. If they run, Speed 3 and Handling −1 give a bold pilot honest odds; being <em>remembered</em> by the Admiralty is the real cost. This block is mirrored in the session-one NPC file (<a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">session-one.md</a>) so the GM-screen markers resolve — one canonical print; if either copy is ever adjusted, keep the two in sync.</p>\n<hr />\n<h2>The Circuit</h2>", "search": "nas steadfast, naboo-pattern patrol sloop vehicle — the admiralty — commander joss reike's inspection sloop the steadfast does not hail you so much as inform you: a wall of pre-ruusan naval steel that was keeping this watch before your grandmother was born, crewed by people who never stopped believing in uniforms. silhouette speed handling :-: :-: :-: 5 3 −1 defense fore/port/starboard/aft 2/2/2/1 · armor 6 · hull t f contract law. it is slow, unarmed, and utterly safe, because everyone for ten systems needs what is inside it to arrive. silhouette speed handling :-: :-: :-: 5 2 −3 defense fore/port/starboard/aft 2/1/1/1 · armor 2 · hull trauma threshold 40 · system strain threshold 20 - hyperdrive: primary: class 3, backup: class 20 - navicomputer: yes - sensor range: medium - crew: 20 - encumbrance capacity: 10,000 · passenger capacity: 5 - consumables: three months · price/rarity: 200,000 credits/5 · customization hard points: 4 - weapons: none chassis: action vi bulk transport, edge of the empire core rulebook (adjustments: none). era notes: the tanks are the newest thing aboard; the keel predates ruusan and the clan bought it as salvage for less than one hold's worth of fuel now sells for. its real armor is economics — burn a kajidic barge and your world goes dark next quarter. using it: the barge is a set, not a combatant: escort jobs, tollgate standoffs, a heist through 10,000 encumbrance of tank maze, or a negotiation where the cargo is the hostage. it cannot fight and barely steers, so every threat to it immediately becomes a social and logistical problem — exactly the kind the kajidics pay wayfinder crews, no questions attached, to solve. if the clan expects trouble, trouble arrives as a hired escort ship, not a gun bolted to the barge."}];
const GROUPS = [{"slug": "session-one", "label": "Vesta-9 & the Crew's Orbit", "intro": "<h1>Vesta-9 &amp; the Crew's Orbit</h1>\n<p>Six roster NPCs for session one, \"The Light on Vesta-9\" — plus the <em>Steadfast</em>'s marine boarding party and the sloop itself, statted here so the standoff runs without a lookup — and for the orbit the crew will keep crossing all campaign: the port that impounded their cargo, the rival ship racing them to the beacon, and the three factions waiting at the light. It is 90 AR — the beacon has just relit after sixty dark years, nobody admits to lighting it, and every ship at Okrent's Drift that can lift is lifting. Every stat block below is an official FFG print pulled verbatim and re-skinned for the era; chassis and adjustments are declared on each.</p>\n<p><strong>GM file — contains spoilers for session one and threads into the campaign's locked truths (Part V). Players keep out.</strong></p>\n<hr />\n<h2>Okrent's Drift — The Scramble</h2>"}, {"slug": "republic-admiralty", "label": "Republic & Admiralty", "intro": "<h1>The Republic &amp; the Admiralty</h1>\n<p>Recovered in the Core and absent out here since the Adjournment, the Republic arrives as charter ships: the old flag, the old archives, a writ that stopped where the relays did and now wants to move again — while the Naboo Admiralty arrives from the opposite direction, out of the dark itself: the fleet that refused demobilization, anchored at Naboo for ninety years, holding the last working capital ships and a founding story that requires an enemy. Between them lies the era's central argument: whether the galaxy is restored by continuity or secured by force. These six NPCs are the faces a wayfinder crew will meet when either power comes calling.</p>\n<p><em>GM file — contains faction cracks and campaign spoilers; do not share with players.</em></p>\n<hr />\n<h2>The Republic</h2>"}, {"slug": "vigil-inheritors", "label": "Vigil & Inheritors", "intro": "<h1>The Vigil &amp; the Inheritors</h1>\n<p>Two orders answer the Awakening, and both were founded on graves. The Vigil holds the sealed temples and the relics of the old Orders under a doctrine of veneration-without-practice — the standing peace terms with a bereaved galaxy — even as its founding generation dies and its certainty hardens. The Inheritors, heirs of the Brotherhood's quartermasters and camp-followers, spent three generations hoarding Sith lore, and now arrive first — warm, helpful, and taking notes — on the doorsteps of frightened Force-sensitive families.</p>\n<p><strong>GM file — spoilers for Dial 3, the Unveiling, and the Conclave of Charts. Do not share with players.</strong></p>\n<hr />\n<h2>The Vigil</h2>"}, {"slug": "lanes-ledgers", "label": "Lanes & Ledgers", "intro": "<h1>Lamplighters, Kajidics, the Guild &amp; the Clans</h1>\n<p>Ninety years after Ruusan, the powers in this file are the ones the Withering could not kill: the guild that kept the beacons breathing, the Hutt clan-corporations that got rich on the dark, the one writ that still travels between systems, and the one people who never demobilized. None of them wants the old Republic back — but every one of them intends to be paid, chartered, or armed when whatever comes next arrives. The party will work for all four before they ever fight one.</p>\n<p><strong>GM eyes only — this file carries Act 2–3 leverage (the Conclave of Charts, the kajidic succession) and one Dial 3 thread. Do not hand to players.</strong></p>\n<hr />\n<h2>The Lamplighters</h2>"}, {"slug": "reaches", "label": "Out on the Run", "intro": "<h1>Out on the Run — Episode NPCs</h1>\n<p>Beyond the Vesta-9 corridor lies the deep Run — the dark country where the last war's Sith principalities died and the Republic's recovery never returned: ten thousand islands, each one grown strange in its own direction across ninety unlit years. The people and machines below are what the crew finds when a lane relights — caretakers still keeping faith with vanished masters, economies built on scrap and provenance, and one very polite droid still working a dead government's kill-list. Every stat block here but one is an official published FFG adversary pulled verbatim and re-skinned for 90 AR — the single exception (Anwei, an original build) is declared on her block; chassis and adjustments are cited on each block.</p>\n<p><em>GM eyes only — this file spoils episode reveals for The Dead Letter, The Sealed Enclave, The Ration Engine, The Oracle of Brel, The Memory Market, The Chop-Yards, The Circuit, The Relit Lanes, and The Mausoleum Yards.</em></p>\n<hr />\n<h2>The Dead Letter</h2>"}, {"slug": "wildlife", "label": "The Feral Run", "intro": "<h1>The Feral Run — Wildlife of the Dark Country</h1>\n<p>Ninety years of darkness did not leave the Run empty — it left it <strong>wild</strong>. Dead stations grew mynock colonies; wreck-fields became reefs with resident predators; abandoned agri-worlds went over to feral herds; and things that like the dark had three generations to move into the infrastructure. Nobody broke the galaxy — the wilderness just moved back in when everyone stopped holding it up. The recovery is not only relighting beacons; it is evicting nature from the machinery, one cold surface at a time.</p>\n<p><strong>The eviction rule.</strong> Every relight displaces ninety years of dark-adapted tenants, and the displaced move <em>up the dark Run, ahead of the advance</em>. Spacers read the migrating swarms as omens. Sector folklore has spent a decade blaming ghost-traffic on mynock-waves and mynock-waves on ghosts — a confusion the campaign's hidden actors have enjoyed without ever arranging (the Scrub's cover, bought free; see <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a>). When the crew relights a beacon, ask the beacon map's shadow question: <em>what left when the light came on, and where did it go?</em></p>\n<p><strong>Using wildlife — weather with teeth.</strong> Star Wars beasts are rarely encounters; they are the environment demonstrating that space is old and alive. Three uses, in rising order of screen time: <strong>the complication</strong> (mynocks on the couplings mid-scene — never a whole scene), <strong>the territory</strong> (a dark station or sealed ruin that already belongs to something; entering wrongly is the mistake), and <strong>the bigger fish</strong> (the thing chasing the crew gets eaten — spend it once per act at most, and never on the villain the table has earned). Wildlife is also the comic engine on legs: a stampede through a certification ceremony beats three pages of dialogue.</p>\n<p><strong>The rules kit.</strong> Knowledge (Xenology) knows the beast; Survival reads and avoids it; Athletics and Coordination outclimb it. Anything <strong>silhouette 6 or larger runs as a hazard, not an adversary</strong> — terrain with intent: upgrade the Piloting checks, roll the water, never the teeth. And the era rule, absolute: <strong>wildlife is never a villain.</strong> No beast serves a faction, carries a grudge, or advances a clock. It is the recovery's honest obstacle — the one antagonist on the Run that is exactly what it appears to be.</p>\n<p><strong>Beasts and the gifted.</strong> The Force and fauna notice each other. A gifted PC can calm what a blaster only enrages (FaD's beast-influence rules apply as printed); Del Gormo's swamp is thick with creatures that behave strangely well around him; and a Dathomiri self-taught with a beast at her shoulder is a payoff worth building toward across an act. The vornskr (below) is this street running the other way — and note the GM irony: a beast that hunts the gifted is also a <em>detector</em> of them, and more than one faction would pay for a leashed one.</p>\n<blockquote>\n<p><strong>Sourcing note.</strong> Per the pull-don't-build policy these entries are transcriptions of official printed FFG beast blocks — <strong>transcribed from the library's index and NOT yet verified against print</strong>: before a beast hits the table, check the cited book and use the printed wording; print outranks this file, then tell the archivist. The two silhouette-6+ entries are declared <strong>hazards</strong> (like the Scar's Echo): terrain with intent, no printed block owed.</p>\n</blockquote>\n<hr />\n<h2>Vermin &amp; hunters</h2>"}, {"slug": "keepers", "label": "Keepers of the Flame 🔒", "intro": "<h1>Keepers of the Flame — GM-Locked Force Users</h1>\n<p>Ninety years after Ruusan, the trained Force survives in exactly three places, and only one of them advertises: the Temple on Coruscant, a swamp on Verdanth, and the Banite line, two or three successions deep and patiently setting the table. This file holds the campaign's locked Force users — the two Jedi, the two Sith, the dead withdrawn lineage's legacy, and the dark-side vergence the Inheritors are digging into — because Acts 2 and 3 turn on who reaches the new generation first. These entries are the campaign's locked answers made playable.</p>\n<p><strong>GM ONLY — SPOILER-CRITICAL. Nothing in this file is player-facing; it implements Part V (locked) of the planning document. Do not read aloud, do not summarize to players, do not leave open at the table.</strong></p>\n<blockquote>\n<p><strong>Sourcing note (updated after re-pull).</strong> Per the pull-don't-build policy, all statted NPCs below are <strong>verbatim pulls of official printed FFG adversary blocks</strong>. Attestation: a book-and-page-cited transcription dataset (the MIT-licensed stoogoff/sw-adversaries index, carrying full characteristics, derived stats, skills, talents, and weapon lines per entry) was cross-checked so that every citation resolves to an official FFG book — <strong>\"Fallen Master\"</strong> (Force and Destiny Core Rulebook, p. 412; reprinted in Allies and Adversaries, p. 81) and <strong>\"Emperor's Hand\"</strong> (Edge of the Empire Core Rulebook, p. 402). (The earlier <strong>\"Forsaken Jedi\"</strong> and <strong>\"Jedi Padawan\"</strong> pulls were retired with the Jedi rework — Yenna Sar and Coll Bren are cut from the campaign, and both living Jedi now run unstatted, per their entries' Stats lines.) Every printed number is transcribed exactly; only names, flavor, and equipment cosmetics are re-skinned for the era, and every block's Adjustments line is \"none.\" The first draft's original builds and their unverified-against-print flags are hereby retired. The Scar's Echo and the Last Muster are the file's two declared homebrew entries (a hazard and a working, not adversaries — no printed blocks exist or are owed). At the table, print outranks this file: if one of the cited books is open in front of you and disagrees on a number, the book wins — then tell the archivist.</p>\n</blockquote>\n<hr />\n<h2>The Two Jedi</h2>\n<p>The second fork of Dial 1, resolved: the Order is alive on Coruscant and absent from the Run, and the campaign's two Jedi disagree about what a Jedi is <em>for</em> — the Temple's service, or the swamp's. Neither is statted; both are questions, not encounters (see each entry's Stats line). The withdrawn lineages are dead — what they left behind closes this section.</p>"}, {"slug": "ships", "label": "Ships of the Ember Age", "intro": "<h1>Ships of the Ember Age</h1>\n<p>Ninety years after Ruusan, nothing flies new. Every hull in this file is an inheritance — a pre-Ruusan pattern kept alive by devotion, cannibalized cousins, and a family's whole savings — and the handful of yards that could lay a fresh keel are strategic prizes worth wars. Book prices are quoted in old Republic credits as printed; in 90 AR a working ship is beyond price and a dead one becomes a neighborhood. Every stat block below is an official FFG vehicle block reproduced as printed; only the names and the rust are ours.</p>\n<p><em>This file is player-safe: no campaign secrets appear anywhere in it.</em></p>\n<hr />\n<h2>The Heirloom Lane-Runners</h2>\n<p><strong>Campaign convention.</strong> The three hulls below are the campaign's \"lane-runner patterns\" — freighter designs that were already old when the beacons went dark, reflavored as pre-Ruusan keels a century deep in one family's service. A player crew's shared ship uses one of these blocks <em>exactly as printed</em>: age lives in the paint, the smell, and the Obligation, never in the numbers. If a GM wants the rust mechanically visible for a session, RAW offers the <strong>Inferior</strong> quality (on a weapon: −1 damage <em>and</em> automatic threat on checks using it; on another system, apply the automatic threat) as a <em>temporary, story-driven condition</em> — apply it as a scene complication and take it off when the crew earns the repair montage. The blocks themselves stay stock.</p>"}];
const PAGES  = [{"section": "reference", "id": "primer", "title": "Adversary Rules Primer", "html": "<h1>NPC Library</h1>\n<p><em>Every stat block in this library is an </em><em>official published FFG adversary pulled as printed</em><em> and re-skinned for the Ember Age — new name, new face, same numbers. Each block cites its chassis (the printed adversary and book) and declares any mechanical deviation on an <code>Adjustments:</code> line (almost always \"none\"). Nothing here is built on fan homebrew.</em></p>\n<h2>How to read the blocks — FFG adversary rules in one screen</h2>\n<div class=\"tw\"><table class=\"wide\">\n<thead>\n<tr>\n<th></th>\n<th><strong>Minion</strong></th>\n<th><strong>Rival</strong></th>\n<th><strong>Nemesis</strong></th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>Strain threshold</td>\n<td><strong>None</strong> — strain damage becomes wounds</td>\n<td><strong>None</strong> — strain suffered becomes wounds</td>\n<td>Full strain threshold</td>\n</tr>\n<tr>\n<td>Skills</td>\n<td><strong>Group only, no ranks</strong> — a group has ranks equal to (members − 1) in its group skills</td>\n<td>Ranked, like a PC</td>\n<td>Ranked, like a PC</td>\n</tr>\n<tr>\n<td>Talents</td>\n<td>None</td>\n<td>Sparingly</td>\n<td>Expected — usually <strong>Adversary 1–3</strong> (<em>upgrade the difficulty of all combat checks targeting them, once per rank</em>)</td>\n</tr>\n<tr>\n<td>Dies to</td>\n<td>Any hit past its Wound Threshold</td>\n<td>Wounds past threshold</td>\n<td>Wounds past threshold (crits matter)</td>\n</tr>\n</tbody>\n</table></div>\n<p><strong>Minion group math:</strong> a group's wound threshold is the sum of its members' (four WT-5 minions = group WT 20), and one minion drops each time total damage passes a multiple of the individual WT.</p>\n<p><strong>Soak</strong> = Brawn + armor. <strong>Melee damage</strong> is printed as a total (Brawn already included).</p>\n<h2>The roster</h2>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>NPC</th>\n<th>Type</t republic-admiralty\">Republic &amp; Admiralty</a></td>\n</tr>\n<tr>\n<td>Admiralty Marines</td>\n<td>Minions</td>\n<td>Admiralty</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:republic-admiralty\">Republic &amp; Admiralty</a> (also with the <em>Steadfast</em> boarding party in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:session-one\">Vesta-9</a>)</td>\n</tr>\n<tr>\n<td>Lieutenant-at-Writs Enna Calloway</td>\n<td>Rival</td>\n<td>Admiralty</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:republic-admiralty\">Republic &amp; Admiralty</a></td>\n</tr>\n<tr>\n<td>First Keeper Odran Su</td>\n<td>Nemesis</td>\n<td>Vigil (hardline)</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:vigil-inheritors\">Vigil &amp; Inheritors</a></td>\n</tr>\n<tr>\n<td>Keeper Tessa Marn</td>\n<td>Rival</td>\n<td>Vigil (reform)</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:vigil-inheritors\">Vigil &amp; Inheritors</a></td>\n</tr>\n<tr>\n<td>Vigil Wardens</td>\n<td>Minions</td>\n<td>Vigil</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:vigil-inheritors\">Vigil &amp; Inheritors</a></td>\n</tr>\n<tr>\n<td>Meru Vane, \"the First Friend\"</td>\n<td>Nemesis</td>\n<td>Inheritors</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:vigil-inheritors\">Vigil &amp; Inheritors</a></td>\n</tr>\n<tr>\n<td>Inheritor Adept</td>\n<td>Rival</td>\n<td>Inheritors</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:vigil-inheritors\">Vigil &amp; Inheritors</a></td>\n</tr>\n<tr>\n<td>Unveiling Blade-Cadre</td>\n<td>Rival</td>\n<td>Inheritors</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:vigil-inheritors\">Vigil &amp; Inheritors</a></td>\n</tr>\n<tr>\n<td>Inheritor Lore-Clerks</td>\n<td>Minions</td>\n<td>Inheritors</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:vigil-inheritors\">Vigil &amp; Inheritors</a></td>\n</tr>\n<tr>\n<td>Chartkeeper Denno Pike</td>\n<td>Rival</td>\n<td>Lamplighters (mole)</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:vigil-inheritors\">Vigil &amp; Inheritors</a></td>\n</tr>\n<tr>\n<td>Grandmaster of Charts Ophira Zel</td>\n<td>Nemesis</td>\n<td>Lamplighters</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Beacon-Tender</td>\n<td>Rival</td>\n<td>Lamplighters</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Lane-Runner Deckhands</td>\n<td>Minions</td>\n<td>Lamplighters</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Sorulba the Anchor</td>\n<td>Nemesis</td>\n<td>Kajidics</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Jeeda the Younger</td>\n<td>Rival</td>\n<td>Kajidics</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Kajidic Enforcers</td>\n<td>Minions</td>\n<td>Kajidics</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Arbiter Ten Vekk</td>\n<td>Nemesis</td>\n<td>Bounty Hunters' Guild</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Guild Purist Tracker</td>\n<td>Rival</td>\n<td>Bounty Hunters' Guild</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Captain Tal Ordo</td>\n<td>Nemesis</td>\n<td>Mandalorian Clans</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Clan Ordo Soldiers</td>\n<td>Minions</td>\n<td>Mandalorian Clans</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>Runi Ordo</td>\n<td>Rival</td>\n<td>Mandalorian Clans (Awakened foundling)</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:lanes-ledgers\">Lanes &amp; Ledgers</a></td>\n</tr>\n<tr>\n<td>\"Dead Letter\"</td>\n<td>Nemesis</td>\n<td>a ninety-year-old contract</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">Out on the Run</a></td>\n</tr>\n<tr>\n<td>Docent-7</td>\n<td>Rival</td>\n<td>the Sealed Enclave</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">Out on the Run</a></td>\n</tr>\n<tr>\n<td>The Quartermaster</td>\n<td>Rival (social)</td>\n<td>the Ration Engine</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">Out on the Run</a></td>\n</tr>\n<tr>\n<td>Anwei, the Oracle of Brel</td>\n<td>Rival</td>\n<td>Brel</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">Out on the Run</a></td>\n</tr>\n<tr>\n<td>Provenance-Broker Halla Wex + Scribes</td>\n<td>Rival + Minions</td>\n<td>the Memory Market</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">Out on the Run</a></td>\n</tr>\n<tr>\n<td>Junk Baron Okkam Dree + Clan Cutters</td>\n<td>Rival + Minions</td>\n<td>salvage economy</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">Out on the Run</a></td>\n</tr>\n<tr>\n<td>Swoop Ace \"Kettle\" Maro</td>\n<td>Rival</td>\n<td>the circuit</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">Out on the Run</a></td>\n</tr>\n<tr>\n<td>Pirate Captain of the Quiet + Quiet Pirates</td>\n<td>Nemesis + Minions</td>\n<td>the Quiet</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">Out on the Run</a></td>\n</tr>\n<tr>\n<td>Hullmayor Bessa Rin + Hull-City Militia</td>\n<td>Rival + Minions</td>\n<td>the Mausoleum Yards</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:reaches\">Out on the Run</a></td>\n</tr>\n<tr>\n<td>Mynock</td>\n<td>Minions</td>\n<td>The Feral Run</td>\n<td><span class=\"xref\">The Feral Run</span></td>\n</tr>\n<tr>\n<td>Fyrnock</td>\n<td>Rival</td>\n<td>The Feral Run</td>\n<td><span class=\"xref\">The Feral Run</span></td>\n</tr>\n<tr>\n<td>Nexu</td>\n<td>Rival</td>\n<td>The Feral Run</td>\n<td><span class=\"xref\">The Feral Run</span></td>\n</tr>\n<tr>\n<td>Vornskr</td>\n<td>Rival</td>\n<td>The Feral Run</td>\n<td><span class=\"xref\">The Feral Run</span></td>\n</tr>\n<tr>\n<td>Feral Bantha Herd</td>\n<td>Minions</td>\n<td>The Feral Run</td>\n<td><span class=\"xref\">The Feral Run</span></td>\n</tr>\n<tr>\n<td>The Reef</td>\n<td>Hazard</td>\n<td>The Feral Run</td>\n<td><span class=\"xref\">The Feral Run</span></td>\n</tr>\n<tr>\n<td>The Aquilaris Deep</td>\n<td>Hazard</td>\n<td>The Feral Run</td>\n<td><span class=\"xref\">The Feral Run</span></td>\n</tr>\n<tr>\n<td>Master N'Kata Del Gormo</td>\n<td>Nemesis</td>\n<td>the swamp (no faction)</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>Master Seldra Tane</td>\n<td>Nemesis</td>\n<td>Jedi Order (Temple envoy)</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>The Patient Master</td>\n<td>Nemesis</td>\n<td>the true Sith line</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>The Patient Apprentice</td>\n<td>Nemesis</td>\n<td>the true Sith line</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n<tr>\n<td>The Scar's Echo</td>\n<td>Hazard</td>\n<td>the dark side, pooled</td>\n<td><a href=\"#\" class=\"xin\" data-nav=\"npcs:group:keepers\">Keepers of the Flame</a> 🔒</td>\n</tr>\n</tbody>\n</table></div>\n<p>🔒 = spoiler-critical even within the GM section: these existences are Dial 1 material.</p>\n<p><em>Ship stat blocks live in <a href=\"#\" class=\"xin\" data-nav=\"npcs:group:ships\">Ships of the Ember Age</a> (shareable — ship stats aren't spoilers).</em></p>"}, {"section": "reference", "id": "dice-results", "title": "Reading the Dice", "html": "<h1>Reading the Dice</h1>\n<p><em>A player reference for The Ember Age (FFG Star Wars narrative dice)</em></p>\n<p>You rolled. Symbols everywhere. Here is the whole trick: the dice answer <strong>two separate questions</strong>, and you only freeze when you try to make them answer one. Question one — <em>did it work?</em> Question two — <em>what else happened?</em> Settle them in that order, out loud, and you are done in ten seconds.</p>\n<h2>Reading a Roll in 10 Seconds</h2>\n<p><strong>Axis 1 — Did it work?</strong> Count <strong>Success</strong> symbols, count <strong>Failure</strong> symbols. Each Failure cancels one Success. If at least one Success is left over, the check succeeds. If Successes and Failures cancel out exactly — or Failures win — the check fails. Ties go to failure. Nothing else on the table can change this answer.</p>\n<p><strong>Axis 2 — What else happened?</strong> Count <strong>Advantage</strong> symbols, count <strong>Threat</strong> symbols. Each Threat cancels one Advantage. Whatever is left over is a side effect — a perk if Advantage remains, a complication if Threat remains. This currency <strong>never</strong> turns success into failure or failure into success. You can fail brilliantly (failure with Advantage: the lock holds, but you spot the maintenance hatch) or succeed at a price (success with Threat: the door opens, loudly).</p>\n<p><strong>The big symbols:</strong></p>\n<ul>\n<li><strong>Triumph</strong> is a Success <em>plus</em> something spectacular. Its built-in Success goes into the Axis 1 tally and can be cancelled by a Failure like any other — but the Triumph <em>effect</em> is never cancelled. Even on a check that fails overall, you still spend the Triumph.</li>\n<li><strong>Despair</strong> is the mirror: it adds one Failure to the Axis 1 tally (cancellable normally), and its <em>effect</em> always lands regardless of the roll's outcome. You can succeed and still eat a Despair.</li>\n<li>Triumph and Despair do <strong>not</strong> cancel each other. Both fire.</li>\n</ul>\n<p>So every roll lands in one of four quadrants — succeed/fail crossed with perk/complication — plus optional fireworks. Name the quadrant, then spend.</p>\n<h2>Spending Advantage and Triumph in Combat</h2>\n<p>These are the standard rulebook options. Announce your spend; the GM narrates it.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Advantage</td>\n<td>Recover 1 strain (may be chosen more than once).</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Add a boost die to the next allied character's check.</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Notice one important point in the fight — the blast door controls, a weak seam in the armor plating, the catwalk above.</td>\n</tr>\n<tr>\n<td>1 Advantage</td>\n<td>Activate a weapon quality whose listed cost is 1.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Perform one immediate free maneuver (cannot exceed the two-maneuver-per-turn limit).</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Add a setback die to a targeted character's next check.</td>\n</tr>\n<tr>\n<td>2 Advantage</td>\n<td>Activate a weapon quality (2 is the default cost unless the quality says otherwise).</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Negate the target's defensive bonuses (cover, equipment, guarded stance) until the end of the current round.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Ignore penalizing environmental effects (weather, zero-g, and the like) until the end of your next turn.</td>\n</tr>\n<tr>\n<td>3 Advantage</td>\n<td>Force the target into a significant drawback — drop a wielded weapon, or (on a damaging hit, with GM agreement) disable a piece of their gear instead of dealing the damage.</td>\n</tr>\n<tr>\n<td>Advantage = weapon's Critical rating</td>\n<td>On a hit that deals damage past soak, trigger a <strong>Critical Injury</strong>. Extra activations add +10 each to the Critical roll.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Any option above, regardless of its Advantage cost.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Trigger a Critical Injury on a damaging hit, regardless of Critical rating.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Activate any weapon quality, regardless of its cost.</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Upgrade the difficulty of the target's next check, or upgrade the ability of an ally's next check (yourself included).</td>\n</tr>\n<tr>\n<td>1 Triumph</td>\n<td>Do something vital and scene-shaping: shoot the blast-door controls, collapse the catwalk, spot the escape route.</td>\n</tr>\n<tr>\n<td>2 Triumph</td>\n<td>On a damaging hit, destroy one piece of equipment the target is using — blow up their blaster, burn out their shield generator.</td>\n</tr>\n</tbody>\n</table></div>\n<blockquote>\n<p><strong>One crit per hit.</strong> A single hit can inflict only <strong>one</strong> Critical Injury, no matter how you pay for it. Every activation after the first — whether bought with Advantage or Triumph — instead adds +10 to that one Critical roll.</p>\n</blockquote>\n<h3>The Mirror: Threat and Despair in Combat</h3>\n<p>The GM (or you, narrating your own stumble) spends these against the active character.</p>\n<div class=\"tw\"><table>\n<thead>\n<tr>\n<th>Cost</th>\n<th>Effect</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>1 Threat</td>\n<td>Suffer 1 strain (may be applied more than once).</td>\n</tr>\n<tr>\n<td>1 Threat</td>\n<td>Lose the benefit of a prior maneuver (your aim, your guarded stance) until you take it again.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>An opponent may take one immediate free maneuver.</td>\n</tr>\n<tr>\n<td>2 Threat</td>\n<td>Add a boost die to a targeted character's next check, or a setback die to your own or an ally's next check.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>Fall prone.</td>\n</tr>\n<tr>\n<td>3 Threat</td>\n<td>Grant the enemy a significant advantage in the encounter — you shoot out the bridge controls you needed for your own escape.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Your ranged weapon runs out of ammunition for the rest of the encounter.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Your weapon or tool is damaged — it jams, cracks, or degrades a step.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>Upgrade the difficulty of an ally's (or your own) next check.</td>\n</tr>\n<tr>\n<td>1 Despair</td>\n<td>A serious GM complication: the shot hits an ally, the gear breaks at the worst moment, the fallback plan closes.</td>\n</tr>\n</tbody>\n</table></div>\n<h2>Advantage Outside Combat</h2>\n<p>Out of combat, Advantage buys narrative position: information, time, goodwill, or a setup for the next check (usually a boost die to a follow-up, a setback die on the opposition, or a detail the GM confirms). One or two Advantage buys something small; three or more, or a Triumph, buys something the whole scene turns on. <strong>You may suggest any of these to the GM:</strong></p>\n<ul>\n<li><strong>Slicing (Computers):</strong> leave no trace in the log; find one extra file you were not looking for; keep the backdoor open for later.</li>\n<li><strong>Mechanics:</strong> the repair holds longer than it should; finish faster than expected; salvage a usable spare part from the job.</li>\n<li><strong>Astrogation:</strong> shave hours off the transit; note a landmark worth adding to the rutter; arrive positioned exactly where you wanted.</li>\n<li><strong>Negotiation:</strong> better price, or a favor thrown in; learn what the other side actually values; leave the door open for future business.</li>\n<li><strong>Charm / Deception:</strong> the target repeats your version to others; you read what they are hiding; the lie survives one follow-up question.</li>\n<li><strong>Stealth:</strong> find an exit route as you go; overhear something useful; leave the guards arguing about whether they saw anything at all.</li>\n</ul>\n<p>Failed
